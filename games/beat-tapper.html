<!DOCTYPE html>
<html lang="en">
<head>

<title>Beat Tapper</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d0620;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr.on{display:flex}.scr>*{pointer-events:auto}
.title{font-size:min(15vw,116px);font-weight:900;font-style:italic;line-height:.86;text-align:center;letter-spacing:.01em;color:#fff;text-shadow:0 0 18px #ff3fd0,0 0 40px #ff3fd0,.05em .05em 0 #6a1aa8;transform:skewX(-6deg)}

.btn:hover{transform:scale(1.05)}.btn:active{transform:translateY(4px);box-shadow:0 0 14px rgba(255,95,216,.5),0 2px 0 #8a2a8a}
.btn.alt{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35)}
.btn.sm{font-size:17px;padding:9px 22px}
.ib{width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#mute{position:fixed;top:12px;right:12px;z-index:9}
#sSel .wrap{width:min(720px,96vw);height:min(96vh,800px);display:flex;flex-direction:column;gap:10px;padding:10px;background:rgba(14,4,34,.86);border-radius:26px;box-shadow:0 0 0 2px rgba(255,95,216,.25),0 20px 60px rgba(0,0,0,.5)}
.top{display:flex;align-items:center;gap:8px;padding-right:52px}
.top .pts{font-weight:900;font-size:18px;margin-left:auto;color:#ffd84a;text-shadow:0 0 10px #ffd84a88}
.diffs{display:flex;gap:6px;justify-content:center}
.df{font:inherit;font-weight:900;font-size:16px;border:0;border-radius:20px;padding:7px 18px;background:rgba(255,255,255,.1);color:#fff;cursor:pointer}
.df.on[data-d="0"]{background:#3fe08a;color:#06301a}.df.on[data-d="1"]{background:#3fb8ff;color:#062040}.df.on[data-d="2"]{background:#ff4f8a;color:#3a0618}

.g.S{background:#ffd84a;color:#3a2a00}.g.A{background:#ff5fd8;color:#3a0030}.g.B{background:#3fb8ff;color:#002040}.g.C{background:#3fe08a;color:#00301a}.g.D{background:#8a8aa8;color:#1a1a30}

.bar{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap}

#hud.on{display:flex}#hud .ib{pointer-events:auto}
#sc{font-size:26px;font-weight:900;text-shadow:0 0 12px #ff5fd8}
#sn{font-size:13px;opacity:.7}

.panel{position:relative;background:linear-gradient(160deg,#2a0f4a,#120830);border-radius:28px;padding:22px 28px;text-align:center;box-shadow:0 0 0 2px rgba(255,95,216,.5),0 0 60px rgba(255,95,216,.35);animation:pop .35s cubic-bezier(.2,1.6,.4,1);min-width:min(340px,92vw)}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.grade{font-size:120px;font-weight:900;font-style:italic;line-height:1;animation:gpop .6s cubic-bezier(.2,1.8,.4,1) .2s backwards}

.stat div{display:flex;flex-direction:column;font-size:22px}.stat small{font-size:11px;opacity:.7;letter-spacing:.1em}
.sub{opacity:.75;font-size:15px}

.dots{display:flex;gap:10px;justify-content:center;margin:10px 0}.dots i{width:18px;height:18px;border-radius:50%;background:rgba(255,255,255,.15);display:block}.dots i.on{background:#3ff6ff;box-shadow:0 0 12px #3ff6ff}

@media (max-width:560px){.song .nm{font-size:15px}.g{width:24px;height:24px;font-size:13px}.song{gap:8px;padding:8px 10px}.song .disc{width:36px;height:36px;font-size:16px}.grade{font-size:90px}}

<body>
<canvas id="c"></canvas>
<div id="sTitle" class="scr on">
  <div class="title">BEAT<span>TAPPER</span></div>
  <div style="height:6vh"></div>
  <button class="btn" id="bPlay">▶ PLAY</button>

</div>
<div id="sSel" class="scr"><div class="wrap">
  <div class="top"><button class="ib" id="bBack"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><button class="ib" id="bCal" title="Calibrate"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M9 3h6"/></svg></button><button class="ib" id="bSpd" style="width:auto;padding:0 14px;border-radius:22px;font-weight:900">⇣ 2x</button><div class="pts" id="pts">★ 0</div></div>

</div></div>
<div id="hud"><div><div id="sc">0</div><div id="sn"></div></div><div style="display:flex;gap:8px;margin-right:52px"><button class="ib" id="bPause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button></div></div>

<script>
"use strict";
var SK="gamebop.beat-tapper.";
function ld(k,d){try{var v=localStorage.getItem(SK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch(e){}}
var save=ld("save",null)||{best:{},grade:{},off:0,spd:2,sel:0,diff:0,plays:0};
var muted=!!ld("mute",false);
function persist(){sv("save",save)}
var $=function(i){return document.getElementById(i)};

// ---------- songs ----------
var DR={
 four:{k:"x...x...x...x...",s:"....x.......x...",h:"..x...x...x...x.",o:""},
 pop:{k:"x.....x.x.......",s:"....x.......x...",h:"x.x.x.x.x.x.x.x.",o:""},
 chip:{k:"x...x...x...x...",s:"....x..x....x..x",h:"xxxxxxxxxxxxxxxx",o:""},
 lofi:{k:"x......x..x.....",s:"....x.......x...",h:"x.x.x.x.x.x.x.x.",o:""},
 dnb:{k:"x.........x.....",s:"....x.......x...",h:"x.xxx.xxx.xxx.xx",o:""},
 funk:{k:"x..x..x...x..x..",s:"....x..x.x..x...",h:"xxxxxxxxxxxxxxxx",o:""},
 rock:{k:"x.x...x.x.x.....",s:"....x.......x...",h:"x.x.x.x.x.x.x.x.",o:""},
 trance:{k:"x...x...x...x...",s:"....x.......x...",h:"",o:"..x...x...x...x."},
 brk:{k:"x.....x...x.....",s:"....x.....x.x...",h:"x.xxx.x.x.xxx.x.",o:""}
};
var SC={maj:[0,2,4,5,7,9,11],min:[0,2,3,5,7,8,10],dor:[0,2,3,5,7,9,10],mix:[0,2,4,5,7,9,10],pen:[0,2,4,7,9,12,14],hm:[0,2,3,5,7,8,11]};
var SONGS=[
 {n:"Neon Steps",bpm:100,root:57,sc:"min",prog:[0,5,2,6],dr:"pop",lead:"square",bass:"root8",col:"#ff5fd8",ic:"✦",seed:3},
 {n:"Pixel Picnic",bpm:112,root:60,sc:"maj",prog:[0,3,4,0],dr:"chip",lead:"square",bass:"oct",col:"#3fe08a",ic:"◆",seed:7},
 {n:"Sunset Drive",bpm:96,root:52,sc:"min",prog:[0,5,3,4],dr:"four",lead:"saw",bass:"root8",col:"#ff9a3f",ic:"☀",seed:11},
 {n:"Bubble Pop",bpm:120,root:62,sc:"maj",prog:[0,4,5,3],dr:"pop",lead:"tri",bass:"pump",col:"#3ff6ff",ic:"○",seed:19},
 {n:"Lo-Fi Lantern",bpm:84,root:55,sc:"dor",prog:[0,3,6,4],dr:"lofi",lead:"tri",bass:"walk",col:"#ffd84a",ic:"☾",sw:.14,seed:23},
 {n:"Coral Bounce",bpm:124,root:58,sc:"min",prog:[0,6,5,6],dr:"four",lead:"pluck",bass:"off",col:"#ff6f8f",ic:"✿",seed:29},
 {n:"Moon Rail",bpm:132,root:56,sc:"min",prog:[0,5,2,6],dr:"trance",lead:"saw",bass:"roll",col:"#8f7fff",ic:"◐",seed:31},
 {n:"Funk Machine",bpm:106,root:53,sc:"mix",prog:[0,0,3,6],dr:"funk",lead:"square",bass:"funk",col:"#ffb03f",ic:"♪",sw:.08,seed:37},
 {n:"Glass Garden",bpm:116,root:64,sc:"pen",prog:[0,3,4,2],dr:"brk",lead:"pluck",bass:"root8",col:"#7fffd4",ic:"❖",seed:41},
 {n:"Arcade Rush",bpm:148,root:60,sc:"maj",prog:[0,5,3,4],dr:"chip",lead:"square",bass:"oct",col:"#5fff5f",ic:"▲",seed:43},
 {n:"Midnight Circuit",bpm:136,root:50,sc:"hm",prog:[0,0,5,4],dr:"four",lead:"saw",bass:"roll",col:"#3f9bff",ic:"⚡",seed:47},
 {n:"Thunder Kite",bpm:158,root:52,sc:"min",prog:[0,6,5,4],dr:"rock",lead:"saw",bass:"root8",col:"#ff4f4f",ic:"⚑",seed:53},
 {n:"Hyper Bloom",bpm:172,root:57,sc:"dor",prog:[0,6,3,4],dr:"dnb",lead:"pluck",bass:"roll",col:"#ff3fd0",ic:"❁",seed:59},
 {n:"Static Comet",bpm:180,root:59,sc:"min",prog:[0,3,6,5],dr:"brk",lead:"square",bass:"oct",col:"#bfff3f",ic:"☄",seed:61},
 {n:"Starfall Finale",bpm:190,root:55,sc:"hm",prog:[0,5,3,4],dr:"dnb",lead:"saw",bass:"roll",col:"#ffffff",ic:"★",seed:67}
];
var NEED=[0,0,2,4,6,8,11,14,17,20,24,28,32,36,40];
var GP={S:4,A:3,B:2,C:1,D:0};
function points(){var p=0;for(var k in save.grade)p+=GP[save.grade[k]]||0;return p}
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// compose: returns {steps:[], bars, sd (sec per step)}
var SECT=[["intro",4],["verse",8],["chorus",8],["verse",8],["bridge",4],["chorus",8],["outro",2]];
function compose(S){
 var r=rng(S.seed*7919),sc=SC[S.sc],sd=60/S.bpm/4,d=DR[S.dr];
 function deg2midi(dg,base){var n=sc.length,o=Math.floor(dg/n),i=((dg%n)+n)%n;return base+sc[i]+12*o}
 // motifs: rhythm templates (onset,len) within 2 bars (32 steps)
 var RT=[[[0,4],[4,2],[6,2],[8,4],[12,4],[16,6],[22,2],[24,8]],[[0,2],[2,2],[4,4],[10,2],[12,4],[16,2],[18,2],[20,4],[24,4],[28,4]],[[0,6],[6,2],[8,2],[10,6],[16,4],[20,4],[24,8]],[[0,3],[3,3],[6,2],[8,4],[12,2],[14,2],[16,3],[19,3],[22,2],[24,8]],[[2,2],[4,2],[6,4],[10,2],[12,4],[18,2],[20,2],[22,2],[24,4],[28,2],[30,2]]];
 function motif(dense){var rt=RT[Math.floor(r()*RT.length)],m=[],p=Math.floor(r()*3)+2;rt.forEach(function(x,i){if(!dense&&r()<.25&&i>0)return;var mv=[-2,-1,-1,1,1,2,0,3,-3][Math.floor(r()*9)];p=Math.max(-2,Math.min(9,p+mv));m.push({s:x[0],l:x[1],dg:p})});return m}
 var mA=motif(true),mB=motif(true),mV=motif(false),mBr=motif(false);
 var steps=[],bar=0;
 SECT.forEach(function(sec){var name=sec[0],nb=sec[1];
  for(var b=0;b<nb;b++,bar++){var ch=S.prog[bar%4],chRoot=deg2midi(ch,S.root-12);
   for(var s=0;s<16;s++){var st={drum:{},bass:null,chord:null,lead:null,sec:name,bar:bar};
    var full=name==="chorus",lite=name==="intro"||name==="outro"||name==="bridge";
    if(name!=="bridge"||b>=2){if(d.k[s]==="x"&&!(name==="intro"&&b<2&&s>0))st.drum.k=1;
     if(d.s[s]==="x"&&!(name==="intro"&&b<2))st.drum.s=1;
     if(d.h[s]==="x"&&(!lite||s%2===0))st.drum.h=(s%4===2?1:.6);
     if(d.o[s]==="x"&&name!=="intro")st.drum.o=1}
    if(full&&b===nb-1&&s>=12)st.drum.s=1;// fill
    if(full&&b===0&&s===0)st.drum.c=1;
    if(name!=="intro"||b>=2){var bp=S.bass,bn=null;
     if(bp==="root8"){if(s%2===0)bn=chRoot}else if(bp==="oct"){if(s%2===0)bn=chRoot+(s%4===2?12:0)}else if(bp==="pump"){if(s%4!==0)bn=chRoot}else if(bp==="off"){if(s%4===2)bn=chRoot}else if(bp==="roll"){bn=chRoot+(s%4===3?12:0)}else if(bp==="walk"){if(s%4===0)bn=deg2midi(ch+[0,2,4,5][s/4],S.root-12)}else if(bp==="funk"){if("x..x..x.x.x..xx."[s]==="x")bn=chRoot+(s===8||s===14?12:0)}
     if(bn!==null&&name!=="outro")st.bass=bn}
    if(s===0&&name!=="intro")st.chord=[0,2,4].map(function(i){return deg2midi(ch+i,S.root)});
    if(s===0&&name==="intro"&&b>=2)st.chord=[0,2,4].map(function(i){return deg2midi(ch+i,S.root)});
    steps.push(st)}
   // lead
   var mt=null;if(name==="chorus")mt=(Math.floor(b/2)%2===0)?mA:mB;else if(name==="verse")mt=mV;else if(name==="bridge")mt=mBr;
   if(mt){var half=b%2,base=bar*16;mt.forEach(function(n){if(Math.floor(n.s/16)!==half)return;var at=base+n.s%16;var tr=(name==="chorus"&&b>=4&&Math.floor(b/2)%2===1)?2:0;var dg=n.dg+tr+(b>=4&&name==="verse"&&n.s>=24?1:0);steps[at].lead={m:deg2midi(dg,S.root+12),l:n.l}})}
  }});
 return {steps:steps,sd:sd,bars:bar};
}
// chart: notes {t, lane, d(dur sec)}
function chart(song,comp,diff){
 var r=rng(song.seed*31+diff),notes=[],sd=comp.sd,lastLane=1,lastT=-1,lastM=null;
 var grid=[4,2,1][diff],minHold=[8,6,4][diff];
 function sw(i){return i%2===1&&song.sw?song.sw*sd*2:0}
 comp.steps.forEach(function(st,i){
  var t=i*sd+sw(i),cand=null;
  if(st.lead&&i%grid===0){var ln;if(lastM===null)ln=1;else{var dm=st.lead.m-lastM;ln=dm>0?lastLane+1+(dm>4?1:0):dm<0?lastLane-1-(dm<-4?1:0):lastLane;if(ln>3)ln=dm>4?0:2+(r()<.5?0:1)-(ln-3);if(ln<0)ln=dm<-4?3:1-(ln+1);ln=Math.max(0,Math.min(3,ln))}lastM=st.lead.m;cand={lane:ln,d:st.lead.l>=minHold?(st.lead.l-1)*sd:0}}
  else if(!st.lead){var strong=diff===0?(i%8===0&&st.drum.k)||(i%8===4&&st.drum.s):diff===1?(i%2===0&&(st.drum.k||st.drum.s)):(st.drum.k||st.drum.s||(st.drum.h===1&&r()<.5));
   if(strong&&i%grid===0){var ln2=st.drum.s?(r()<.5?1:2):(r()<.5?0:3);if(ln2===lastLane&&diff<2)ln2=(ln2+2)%4;cand={lane:ln2,d:0}}}
  if(cand){var gap=t-lastT;if(gap<sd*grid*.99&&notes.length){return}
   // avoid fast jacks on hard
   if(diff===2&&cand.lane===lastLane&&gap<sd*1.5)cand.lane=(cand.lane+1+Math.floor(r()*3))%4;
   // ensure no overlap with a holding lane
   var p=notes[notes.length-1];if(p&&p.d>0&&p.t+p.d>t-sd&&p.lane===cand.lane)cand.lane=(cand.lane+2)%4;
   notes.push({t:t,lane:cand.lane,d:cand.d});lastLane=cand.lane;lastT=t;
   // doubles on chorus accents
   if(diff>=1&&st.drum.c||diff===2&&st.drum.s&&st.sec==="chorus"&&i%16===12&&r()<.6){var l2=(cand.lane+2)%4;notes.push({t:t,lane:l2,d:0})}
  }
 });
 // remove notes that sit inside an active hold on same lane
 var act=[-1,-1,-1,-1],out=[];notes.forEach(function(n){if(n.t<act[n.lane]+.05)return;out.push(n);if(n.d>0)act[n.lane]=n.t+n.d});
 return out;
}

// ---------- audio engine ----------
var AC=null,master=null,comp=null,fx=null,nbuf=null;
function audio(){if(AC){if(AC.state==="suspended"&&!paused)AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)();comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master=AC.createGain();master.gain.value=muted?0:.8;comp.connect(master);master.connect(AC.destination);
 var dl=AC.createDelay(1);dl.delayTime.value=.3;var fb=AC.createGain();fb.gain.value=.3;var lp=AC.createBiquadFilter();lp.frequency.value=2500;dl.connect(lp);lp.connect(fb);fb.connect(dl);fx=AC.createGain();fx.gain.value=.5;fx.connect(dl);lp.connect(comp);
 nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);var a=nbuf.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=Math.random()*2-1}catch(e){AC=null}}
function env(g,t,a,peak,dcy,sus,rel){g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(Math.max(.0001,sus),t+a+dcy);if(rel)g.gain.exponentialRampToValueAtTime(.0001,t+a+dcy+rel)}
function mf(m){return 440*Math.pow(2,(m-69)/12)}
function kick(t,v){var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(42,t+.12);env(g,t,.002,v||1,.25,.0001);o.connect(g);g.connect(comp);o.start(t);o.stop(t+.3)}
function noiseHit(t,dur,type,f,q,v,dest){var s=AC.createBufferSource();s.buffer=nbuf;var bf=AC.createBiquadFilter();bf.type=type;bf.frequency.value=f;bf.Q.value=q||1;var g=AC.createGain();env(g,t,.001,v,dur,.0001);s.connect(bf);bf.connect(g);g.connect(dest||comp);s.start(t,Math.random()*.5);s.stop(t+dur+.05)}
function snare(t,v){noiseHit(t,.16,"bandpass",1800,.8,.6*(v||1));var o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(220,t);o.frequency.exponentialRampToValueAtTime(140,t+.08);env(g,t,.001,.35,.1,.0001);o.connect(g);g.connect(comp);o.start(t);o.stop(t+.15)}

 for(var i=0;i<notes.length;i++){var n=notes[i];if(n.state===2&&!(n.d>0))continue;if(n.state===1&&!(n.d>0))continue;var y=ry-(n.t-st)*pps;var yEnd=ry-(n.t+n.d-st)*pps;if(yEnd>H+50&&y>H+50)continue;if(y<-60&&n.t>st)break;var l=n.lane,cxl=laneX(l+.5),s=lw*.4,col=LC[l];
  if(n.d>0){if(n.done)continue;var y1=n.holding?ry:y;var tw=s*.55;cx.fillStyle=n.broken?"rgba(120,120,140,.35)":hexA(col,n.holding?.7:.45);cx.fillRect(cxl-tw/2,yEnd,tw,Math.max(0,y1-yEnd));cx.fillStyle=n.broken?"#556":col;rr(cxl-tw/2-3,yEnd-6,tw+6,12,6);cx.fill();if(n.state===1&&n.holding)continue;if(n.state)continue}
  if(n.state)continue;
  cx.shadowColor=col;cx.shadowBlur=14;cx.fillStyle=col;rr(cxl-s,y-s*.36,s*2,s*.72,s*.36);cx.fill();cx.shadowBlur=0;cx.fillStyle="rgba(255,255,255,.75)";rr(cxl-s*.7,y-s*.22,s*1.4,s*.16,s*.08);cx.fill()}
}
function hexA(h,a){var n=parseInt(h.slice(1),16);return "rgba("+(n>>16)+","+(n>>8&255)+","+(n&255)+","+a+")"}
var last=performance.now(),T=0;
function frame(now){var dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;cx.setTransform(DPR,0,0,DPR,0,0);
 seqTick();
 if(scene==="play"&&game&&!paused&&AC)updGame();
 for(var l=0;l<4;l++)laneFlash[l]=Math.max(0,laneFlash[l]-dt*4);
 var pulse=0;if(scene==="play"&&game)pulse=Math.pow(beatPulse,3);else if(seq&&AC){var bt=(AC.currentTime-seq.start)/(60/seq.S.bpm);pulse=Math.pow(1-(bt-Math.floor(bt)),3)}else pulse=Math.pow(1-((T*1.8)%1),3);
 var sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake=Math.max(0,shake-dt*30)}
 cx.save();cx.translate(sx,sy);drawBG(T,pulse);
 if(scene==="play"&&game){var st=songTime();drawHighway(T,game.notes,st,save.spd,st<4);
  // combo
  if(game.combo>=5){cx.globalAlpha=.9;cx.font="900 "+Math.round(Math.min(64,W*.12))+"px Trebuchet MS,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillStyle="#fff";cx.shadowColor="#ff5fd8";cx.shadowBlur=20*pulse+6;cx.fillText(game.combo,W/2,H*.32);cx.shadowBlur=0;cx.font="900 14px Trebuchet MS,sans-serif";cx.fillStyle="#ffd84a";cx.fillText("COMBO",W/2,H*.32+Math.min(40,W*.08));cx.globalAlpha=1}
  // progress
  var pr=Math.max(0,Math.min(1,st/game.end));cx.fillStyle="rgba(255,255,255,.12)";cx.fillRect(0,0,W,4);cx.fillStyle=game.S.col;cx.fillRect(0,0,W*pr,4);
  if(st<0){cx.font="900 64px Trebuchet MS,sans-serif";cx.textAlign="center";cx.fillStyle="#fff";cx.globalAlpha=.8;cx.fillText(Math.ceil(-st),W/2,H*.45);cx.globalAlpha=1}
 }else if(scene==="title"){demoHighway(T,dt)}
 cx.restore();
 pops.forEach(function(p){p.t+=dt;var a=Math.max(0,1-p.t/.6),s=1+Math.max(0,.3-p.t)*1.5;cx.globalAlpha=a;cx.font="900 "+Math.round(30*s)+"px Trebuchet MS,sans-serif";cx.textAlign="center";cx.textBaseline="middle";cx.fillStyle=p.c;cx.shadowColor=p.c;cx.shadowBlur=14;cx.fillText(p.txt,W/2,recY()-H*.2-p.t*20);if(p.sub){cx.font="900 13px Trebuchet MS,sans-serif";cx.fillText(p.sub,W/2,recY()-H*.2+22-p.t*20)}cx.shadowBlur=0;cx.globalAlpha=1});pops=pops.filter(function(p){return p.t<.6}).slice(-3);
 parts.forEach(function(p){p.l-=dt;if(p.g)p.vy+=400*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;cx.globalAlpha=Math.max(0,p.l/p.ml);cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});cx.globalAlpha=1;parts=parts.filter(function(p){return p.l>0});
 requestAnimationFrame(frame)}
function demoHighway(T,dt){var x0=laneX(0),hw=hwW(),ry=recY();demo.t+=dt;if(demo.notes.length<14&&Math.random()<dt*6)demo.notes.push({lane:(Math.random()*4)|0,y:-40,d:Math.random()<.2?120:0});
 cx.save();cx.globalAlpha=.85;cx.fillStyle="rgba(8,2,24,.6)";cx.fillRect(x0,0,hw,H);for(var l=0;l<=4;l++){cx.fillStyle="rgba(255,255,255,.08)";cx.fillRect(laneX(l),0,1,H)}
 demo.notes.forEach(function(n){n.y+=dt*H*.5;var s=laneW()*.4,cxl=laneX(n.lane+.5),col=LC[n.lane];if(n.d){cx.fillStyle=hexA(col,.45);cx.fillRect(cxl-s*.27,n.y-n.d,s*.55,n.d)}cx.shadowColor=col;cx.shadowBlur=14;cx.fillStyle=col;rr(cxl-s,n.y-s*.36,s*2,s*.72,s*.36);cx.fill();cx.shadowBlur=0;if(n.y>=ry&&!n.hit){n.hit=1;laneFlash[n.lane]=1;for(var i=0;i<10;i++){var a=-Math.random()*Math.PI,v=150+Math.random()*300;parts.push({x:cxl,y:ry,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.4,ml:.4,c:col,r:2+Math.random()*2})}}});
 demo.notes=demo.notes.filter(function(n){return n.y<ry+4||n.d&&n.y-n.d<ry});
 for(var l=0;l<4;l++){var cxl=laneX(l+.5),s=laneW()*.4;if(laneFlash[l]>0){var g=cx.createLinearGradient(0,ry,0,ry-H*.4);g.addColorStop(0,hexA(LC[l],.35*laneFlash[l]));g.addColorStop(1,hexA(LC[l],0));cx.fillStyle=g;cx.fillRect(laneX(l),0,laneW(),ry)}cx.strokeStyle=LC[l];cx.lineWidth=3;cx.shadowColor=LC[l];cx.shadowBlur=10;rr(cxl-s,ry-s*.42,s*2,s*.84,s*.4);cx.stroke();cx.shadowBlur=0}
 cx.restore()}
goTitle();requestAnimationFrame(frame);
window.__bt={state:function(){return {scene:scene,game:game&&{score:Math.round(game.score),cnt:game.cnt,combo:game.combo,done:game.done,n:game.notes.length,st:songTime()}}},
 notes:function(){return game.notes.map(function(n){return [n.t,n.lane,n.d]})},st:function(){return songTime()},
 stats:function(){return SONGS.map(function(S,i){var c=getComp(i);return [S.n,c.steps.length*c.sd|0].concat([0,1,2].map(function(d){var n=chart(S,c,d);return n.length+"/"+n.filter(function(x){return x.d>0}).length}))})},
 auto:function(){if(!game||game.done)return;var t=songTime();game.notes.forEach(function(n){if(!n.state&&Math.abs(n.t-t)<.03){judge(n.lane);if(n.d>0)held[n.lane]=true}if(n.holding&&t>n.t+n.d){held[n.lane]=false}})},
 skip:function(s){game.start-=s;seq.start-=s;seq.next=Math.max(seq.next,Math.floor((AC.currentTime-seq.start)/seq.c.sd))}};

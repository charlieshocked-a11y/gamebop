<script>
'use strict';
const cv=document.getElementById('c');
// ================= utils & storage
const SLUG='burrow-bolt',KP='gamebop.'+SLUG+'.';
const store={get(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v));}catch(e){}}};
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, TAU=Math.PI*2;
const approach=(a,b,d)=>a<b?Math.min(b,a+d):Math.max(b,a-d);
const ease=t=>1-Math.pow(1-t,3), easeBack=t=>{const c=1.70158;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(n){n=Math.imul(n^0x27d4eb2d,0x165667b1);n^=n>>>15;n=Math.imul(n,0x85ebca6b);n^=n>>>13;n=Math.imul(n,0xc2b2ae35);n^=n>>>16;return(n>>>0)/4294967296;}
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function shade(h,a){const c=hexRGB(h);const t=a<0?0:255,p=Math.abs(a);return'rgb('+c.map(v=>Math.round(v+(t-v)*p)).join(',')+')';}
function rgba(h,a){const c=hexRGB(h);return'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')';}
const FONT="'Trebuchet MS','Avenir Next','Segoe UI',Verdana,sans-serif";
const TFONT="'Arial Black','Arial Rounded MT Bold','Trebuchet MS',Impact,sans-serif";

const DEF_SAVE={v:1,unlocked:1,stars:{},bestT:{},worms:0,total:0,up:{dig:0,leap:0,mag:0,lamp:0},hats:['none'],skins:['classic'],hat:'none',skin:'classic',tut:false,secrets:{},last:0,played:false,plays:0};
let save=Object.assign({},DEF_SAVE,store.get('save',{}));
save.up=Object.assign({dig:0,leap:0,mag:0,lamp:0},save.up||{});
function persist(){store.set('save',save);}
let muted=!!store.get('mute',false);

// ================= audio
let AC=null,master=null,sfxG=null,musG=null,noiseBuf=null,digSrc=null,digGain=null,digFilt=null,windGain=null;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){AC=null;return;}
 master=AC.createGain();master.gain.value=muted?0:0.85;master.connect(AC.destination);
 sfxG=AC.createGain();sfxG.gain.value=0.9;sfxG.connect(master);
 musG=AC.createGain();musG.gain.value=0.16;musG.connect(master);
 noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 digSrc=AC.createBufferSource();digSrc.buffer=noiseBuf;digSrc.loop=true;digFilt=AC.createBiquadFilter();digFilt.type='lowpass';digFilt.frequency.value=300;digGain=AC.createGain();digGain.gain.value=0;digSrc.connect(digFilt);digFilt.connect(digGain);digGain.connect(sfxG);digSrc.start();
 const ws=AC.createBufferSource();ws.buffer=noiseBuf;ws.loop=true;const wf=AC.createBiquadFilter();wf.type='bandpass';wf.frequency.value=900;wf.Q.value=0.6;windGain=AC.createGain();windGain.gain.value=0;ws.connect(wf);wf.connect(windGain);windGain.connect(sfxG);ws.start(0,0.7);
}
function canSfx(){return AC&&!muted&&state==='play';}
function tone(f,d,type,v,f2,delay,att){if(!canSfx())return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.2,t+(att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(sfxG);o.start(t);o.stop(t+d+0.05);}
function noise(d,freq,v,type,q,delay,f2){if(!canSfx())return;const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+d);f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(v||0.2,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(sfxG);s.start(t,Math.random()*1.5);s.stop(t+d+0.05);}
const vr=()=>0.94+Math.random()*0.12;
const PENT=[0,2,4,7,9,12,14,16,19,21,24,26,28,31,33,36];
const nf=(semi,base)=>(base||392)*Math.pow(2,semi/12);
const SFX={
 gulp(ch){const s=PENT[Math.min(ch,PENT.length-1)];tone(nf(s,520)*vr(),0.09,'triangle',0.16,nf(s+5,520));tone(nf(s,1040),0.05,'sine',0.05,null,0.02);},
 dig(p){noise(0.22,380,0.25*p+0.08,'lowpass',1);tone(110*vr(),0.16,'sine',0.25*p+0.05,45);},
 burst(p){noise(0.35+p*0.2,700,0.18+p*0.12,'bandpass',0.8,0,2600);tone(180*vr(),0.25,'triangle',0.1+0.08*p,520);},
 perfect(c){const b=nf(Math.min(c,10)*2,523);tone(b,0.14,'square',0.07);tone(b*1.26,0.14,'square',0.07,null,0.06);tone(b*1.5,0.3,'triangle',0.12,null,0.12);tone(b*3,0.4,'sine',0.05,null,0.12);},
 early(){tone(300,0.09,'sine',0.05,240);},

function updCamera(dt){
 const s0=L.surf(P.x);const lead=W/cam.s*0.27+clamp(P.vx-600,0,900)*0.1;

 const need=bot-top;let s=Math.min(baseScale(),H/need*0.98);s=Math.max(s,0.16);
 cam.s=lerp(cam.s,s,1-Math.exp(-dt*(s<cam.s?6:2.5)));
 const vis=H/cam.s;let cy=(top+bot)/2;
 if(vis>need){cy=bot-vis/2+ (vis-need)*0.08;}
 cam.ty=cy;cam.tx=P.x+lead;
 cam.x=lerp(cam.x,cam.tx,1-Math.exp(-dt*7));cam.y=lerp(cam.y,cam.ty,1-Math.exp(-dt*6));const mg=(W<560?190:150)/cam.s;const tp=cam.y-H/2/cam.s;if(P.y-mg<tp)cam.y-=tp-(P.y-mg);

function heroPip(c,portrait){const ph=(T*0.9)%3;let hy=0,ha=0,sq=0;if(ph<0.5){const k=ph/0.5;hy=-90*Math.sin(k*Math.PI*0.5);ha=-0.5;sq=0.15*(1-k);}else if(ph<2.2){const k=(ph-0.5)/1.7;hy=-90+Math.sin(k*Math.PI)*-40;ha=-0.5+k*0.4+Math.sin(T*3)*0.05;}else{const k=(ph-2.2)/0.8;hy=-90*(1-ease(k));ha=-0.1+k*0.6;sq=k>0.8?0.15:0;}
  const hx=portrait?92:-250,hb=portrait?-62:150;c.save();c.translate(hx,hb);if(!portrait){c.fillStyle='#6a3e1c';c.beginPath();c.ellipse(0,8,70,20,0,Math.PI,0);c.fill();c.fillStyle='#2a1508';c.beginPath();c.ellipse(0,4,34,10,0,0,TAU);c.fill();}

// ================= main loop
let last=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=Math.min(0.05,(now-last)/1000);last=now;if(dt<0)dt=0;T+=dt;
 if(state==='play'||state==='menu'||state==='results'||state==='fail'||state==='levels'||state==='shop')sim(dt);

  const air=state==='play'&&P&&!P.under?clamp((Math.hypot(P.vx,P.vy)-500)/1500,0,1)*0.1:0;windGain.gain.setTargetAtTime(muted?0:air,AC.currentTime,0.1);}

function sim(dt){if(!L)return;
 const playing=state==='play'||state==='menu';
 if(slowT>0){slowT-=dt;if(slowT<=0)timeScale=1;else if(slowT<0.25)timeScale=lerp(1,timeScale,slowT/0.25);}

}

window.BB={sim(idx,cfg,maxT){const st=state;state='sim';botCfg=cfg;startLevel(idx,{});run.botForce=true;let n=0;const lim=(maxT||150)*120;const tr=[];while(!run.done&&!run.failed&&n<lim){step(STEP);updWorms(STEP);n++;if(cfg.trace&&n%30===0)tr.push([+run.t.toFixed(2),P.x|0,(P.y-L.surf(P.x))|0,P.under?1:0,P.S|0,+P.th.toFixed(2),P.hold?1:0,P.stun>0?1:0].join(","));}const r={tr,idx,done:run.done,failed:run.failed,why:run.failWhy,t:+run.t.toFixed(1),par:LV[idx].par,perf:run.perfects,pg:LV[idx].pg,worms:run.wormsN,tot:L.totalWorms,prog:+(P.x/L.len).toFixed(2),hearts:run.hearts};botCfg=null;state=st;startDemo();return r;},get state(){return state;},get P(){return P;},get run(){return run;},get L(){return L;},get save(){return save;},get tut(){return{mode:tutMode,step:tutStep};},BAND,BED,play,startTutorial,setSave(s){save=Object.assign({},DEF_SAVE,s);persist();calcU();},calcU,get fox(){return fox;},get boss(){return boss;},get cam(){return cam;},LV};

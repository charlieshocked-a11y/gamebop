<script>
(function () {
// ---- 00-util.js ----
'use strict';
// ===================== UTILITIES =====================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a = 0, b = 1) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(a + Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const hash = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };

const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInCubic = t => t * t * t;
const easeInOut = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeOutBack = t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };

const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const store = {
  get(k, d) { try { const v = localStorage.getItem('scribbleWizard.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('scribbleWizard.' + k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
};

// ---- 10-recognizer.js ----
// ===================== GESTURE RECOGNIZER =====================
// A $1-style unistroke template matcher, extended with:
//  - exhaustive rotation search (per-template allowed range) instead of the
//    "indicative angle", so start points near the centroid (spirals) work
//  - aspect-clamped non-uniform scaling (thin strokes don't explode)
//  - hook trimming (pen-down / pen-up flicks from fast drawing)
//  - a dedicated straight-line detector (1-D gestures break $1)
//  - stroke features (signed turning, corners, closure) to veto confusions
const Recognizer = (() => {
  'use strict';
  const N = 64;
  const DEG = Math.PI / 180;
  const ASPECT_CLAMP = 0.22;
  const HALF_DIAG = 0.5 * Math.SQRT2;

  // ---------- basic geometry ----------
  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  function bounds(p) {

  function centroid(p) { let x = 0, y = 0; for (const q of p) { x += q.x; y += q.y; } return { x: x / p.length, y: y / p.length }; }

    let D = 0, prev = { x: pts[0].x, y: pts[0].y };
    for (let i = 1; i < pts.length; i++) {
      const cur = pts[i];
      let d = dist(prev, cur);
      while (D + d >= I && d > 0 && out.length < n) {
        const t = (I - D) / d;
        const q = { x: prev.x + t * (cur.x - prev.x), y: prev.y + t * (cur.y - prev.y) };

  function circlePts(dir, start = -90, sweep = 360) {

  }

    const o = [];
    for (let i = 0; i <= n; i++) o.push([i / n * (n * 0.45), (i % 2 === 0) === firstUp ? 1 : 0]);
    return o;

  const GUIDE = {
    line: [[-1, 0], [1, 0]],
    triangle: trianglePts(0, -1).map(p => [p[0], p[1] + 0.1]),
    circle: circlePts(-1),
    zigzag: [[-1, 0.25], [-0.6, -0.45], [-0.2, 0.45], [0.2, -0.45], [0.6, 0.45], [1, -0.25]],
    spiral: spiralPts(1, 2.25, false, 0.04),
    heart: heartPts(false, -1),
    star: (() => { const s = starPts(1, 3); return s; })(),
  };

  // ---------- templates ----------
  const TEMPLATES = [];
  function addT(cls, pts, rot, tag) {
    const P = resample(pts.map(p => ({ x: p[0], y: p[1] })), N);
    const c = centroid(P);
    const xs = new Float64Array(N), ys = new Float64Array(N);
    for (let i = 0; i < N; i++) { xs[i] = P[i].x - c.x; ys[i] = P[i].y - c.y; }
    normalizeInPlace(xs, ys);
    TEMPLATES.push({ cls, xs, ys, rot: rot * DEG, tag });
  }
  function normalizeInPlace(xs, ys) {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < N; i++) { const x = xs[i], y = ys[i]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const w = x1 - x0, h = y1 - y0, m = Math.max(w, h) || 1;
    const sx = 1 / Math.max(w, m * ASPECT_CLAMP), sy = 1 / Math.max(h, m * ASPECT_CLAMP);
    let cx = 0, cy = 0;
    for (let i = 0; i < N; i++) { xs[i] *= sx; ys[i] *= sy; cx += xs[i]; cy += ys[i]; }
    cx /= N; cy /= N;
    for (let i = 0; i < N; i++) { xs[i] -= cx; ys[i] -= cy; }
  }

  // closed shapes are often left open or over-closed when drawn fast: add truncated variants
  function truncate(pts, frac) {
    const P = pts.map(p => ({ x: p[0], y: p[1] }));
    const L = pathLength(P) * frac, out = [pts[0]];
    let d = 0;
    for (let i = 1; i < P.length; i++) {
      const s = dist(P[i - 1], P[i]);
      if (d + s >= L) { const t = (L - d) / s; out.push([P[i - 1].x + (P[i].x - P[i - 1].x) * t, P[i - 1].y + (P[i].y - P[i - 1].y) * t]); return out; }
      d += s; out.push(pts[i]);
    }
    return out;
  }
  function addClosed(cls, pts, rot, tag) {
    addT(cls, pts, rot, tag);
    addT(cls, truncate(pts, 0.93), rot, tag + '~93');
    addT(cls, truncate(pts, 0.86), rot, tag + '~86');
  }
  for (let s = 0; s < 3; s++) for (const d of [1, -1]) addClosed('triangle', trianglePts(s, d), 50, 'tri' + s + d);
  addT('triangle', [[-0.6, 0.5], [0, -0.5], [0.6, 0.5]], 50, 'caretLR');
  addT('triangle', [[0.6, 0.5], [0, -0.5], [-0.6, 0.5]], 50, 'caretRL');
  for (const d of [1, -1]) addT('circle', circlePts(d), 180, 'circle' + d);
  for (const d of [1, -1]) addT('circle', circlePts(d, -90, 400), 180, 'circleOver' + d);
  for (const d of [1, -1]) addT('circle', circlePts(d, -90, 320), 180, 'circleUnder' + d);
  for (const d of [1, -1]) addClosed('star', starPts(d), 180, 'star' + d);
  for (const n of [3, 4, 5, 6]) for (const up of [true, false]) addT('zigzag', zigzagPts(n, up), 180, 'zig' + n + up);
  addT('zigzag', [[0, 0], [1, 0], [0, 1], [1, 1]], 180, 'Z');
  addT('zigzag', [[1, 0], [0, 0], [1, 1], [0, 1]], 180, 'S');
  addT('zigzag', [[0.65, 0], [0.25, 0.55], [0.75, 0.45], [0.35, 1]], 180, 'boltL');
  addT('zigzag', [[0.35, 0], [0.75, 0.55], [0.25, 0.45], [0.65, 1]], 180, 'boltR');
  for (const d of [1, -1]) for (const turns of [1.5, 2, 2.5, 3, 3.5]) for (const inward of [false, true]) for (const r0 of [0.03, 0.15]) addT('spiral', spiralPts(d, turns, inward, r0), 180, 'sp' + d + turns + inward + r0);
  for (const sb of [false, true]) for (const d of [1, -1]) addClosed('heart', heartPts(sb, d), 45, 'heart' + sb + d);

  // ---------- features ----------
  function features(P) {
    const S = smooth(P, 2);
    const n = S.length;
    const head = [];
    for (let i = 0; i < n - 1; i++) head.push(Math.atan2(S[i + 1].y - S[i].y, S[i + 1].x - S[i].x));
    const turns = [];
    for (let i = 0; i < head.length - 1; i++) turns.push(wrapAng(head[i + 1] - head[i]));
    let net = 0, abs = 0;
    for (const t of turns) { net += t; abs += Math.abs(t); }
    const W = 2, win = [];
    for (let i = 0; i < turns.length; i++) {
      let s = 0;
      for (let j = Math.max(0, i - W); j <= Math.min(turns.length - 1, i + W); j++) s += turns[j];
      win.push(s);
    }
    const corners = [];
    for (let i = 0; i < win.length; i++) {
      const a = Math.abs(win[i]);
      if (a < 55 * DEG) continue;
      let isMax = true;
      for (let j = Math.max(0, i - 3); j <= Math.min(win.length - 1, i + 3); j++) if (Math.abs(win[j]) > a || (Math.abs(win[j]) === a && j < i)) { isMax = false; break; }
      if (isMax) corners.push({ i: i + 1, a: win[i] });
    }
    let alternations = 0;
    for (let k = 1; k < corners.length; k++) if (Math.sign(corners[k].a) !== Math.sign(corners[k - 1].a)) alternations++;
    const bb = bounds(P);
    const diag = Math.hypot(bb.w, bb.h) || 1;
    const L = pathLength(P);
    const gap = dist(P[0], P[n - 1]);

    const c = centroid(P);
    let sxx = 0, syy = 0, sxy = 0;
    for (const q of P) { const dx = q.x - c.x, dy = q.y - c.y; sxx += dx * dx; syy += dy * dy; sxy += dx * dy; }
    const tr = sxx + syy, det = sxx * syy - sxy * sxy, disc = Math.sqrt(Math.max(0, tr * tr / 4 - det));

    const sharp = cornersDeg.filter(c => Math.abs(c.a) > 75);
    const verySharpSame = cornersDeg.filter(c => Math.abs(c.a) > 95 && Math.sign(c.a) === dirSign).length;
    const reverse = cornersDeg.filter(c => Math.sign(c.a) !== dirSign && Math.abs(c.a) > 45).length;

      const t = wrapAng(Math.atan2(c2.y - b.y, c2.x - b.x) - Math.atan2(b.y - a.y, b.x - a.x)) / DEG;

      net: net / DEG, abs: abs / DEG, corners: cornersDeg, alternations,

  }

  // ---------- convex-hull shape descriptors (robust to sloppiness) ----------
  function hull(P) {
    const pts = P.map(p => [p.x, p.y]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
    const cr = (o, a, b) => (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
    const lo = [], up = [];
    for (const p of pts) { while (lo.length >= 2 && cr(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
    for (let i = pts.length - 1; i >= 0; i--) { const p = pts[i]; while (up.length >= 2 && cr(up[up.length - 2], up[up.length - 1], p) <= 0) up.pop(); up.push(p); }
    up.pop(); lo.pop();
    return lo.concat(up);
  }
  function hullFeatures(P, size) {
    const H = hull(P);
    const h = H.length;

      const t = Math.abs((H[j][0] - H[i][0]) * (H[k][1] - H[i][1]) - (H[j][1] - H[i][1]) * (H[k][0] - H[i][0])) / 2;

      let d = Infinity;

  // Remove short flicks at the start/end of the stroke (common when drawing fast).
  function trimHooks(P) {
    const n = P.length;
    const L = pathLength(P);

    const cum = [0];
    for (let i = 1; i < n; i++) cum.push(cum[i - 1] + dist(P[i - 1], P[i]));

        let inner = 0;
        for (let k = 1; k < i; k++) inner += Math.abs(wrapAng(dirAt(k, k + 1) - dirAt(k - 1, k)));

      const turn = Math.abs(wrapAng(after - before));
      if (turn > 80 * DEG) {
        let inner = 0;
        for (let k = i + 1; k < n - 1; k++) inner += Math.abs(wrapAng(dirAt(k, k + 1) - dirAt(k - 1, k)));
        if (inner < 50 * DEG) { b = i; }

  // ---------- matching ----------
  const bx = new Float64Array(N), by = new Float64Array(N);
  function normAt(cx, cy, ang) {
    const c = Math.cos(ang), s = Math.sin(ang);
    for (let i = 0; i < N; i++) { bx[i] = cx[i] * c - cy[i] * s; by[i] = cx[i] * s + cy[i] * c; }
    normalizeInPlace(bx, by);
  }
  function dTo(T) {
    let d = 0;
    const tx = T.xs, ty = T.ys;
    for (let i = 0; i < N; i++) { const dx = bx[i] - tx[i], dy = by[i] - ty[i]; d += Math.sqrt(dx * dx + dy * dy); }
    return d / N;
  }
  function matchAll(P) {
    const c = centroid(P);
    // Two framings of the same stroke:
    //  A) raw (centred): rotate, then fit box  -> handles shapes stretched along their own axes
    //  B) squared in screen axes first          -> handles shapes stretched on screen but needing
    //     a large rotation to line up their start point (stars, spirals, circles)

    if (opts.reject != null) ok = bestS >= opts.reject;
    return finalize(bestK, bestS, scores, opts, F, m[bestK] && m[bestK].tag, ok ? -1 : 2, rawS[bestK]);
  }

  function finalize(name, score, scores, opts, F, tag, rej, rawScore) {
    const reject = rej != null ? rej : (opts.reject != null ? opts.reject : REJECT);
    if (score < reject) return { name: null, reason: 'unknown', guess: name, score, scores, tag };

    let q = rawScore != null ? rawScore : score;

    if (name === 'triangle' && tag && tag.startsWith('tri') && F.closure > 0.12) q -= (F.closure - 0.12) * 0.35;

  // Try to merge two strokes (e.g. a heart drawn as two halves)
  function recognizePair(a, b, opts = {}) {
    const rev = s => s.slice().reverse();

  // Could this stroke be one half of a two-stroke heart? (endpoints stacked vertically,
  // bulging to one side). The game waits briefly for a second stroke in that case.
  function halfHeartCandidate(raw) {
    if (raw.length < 4) return false;

    let dev = 0;
    for (const q of P) dev = Math.max(dev, Math.abs((q.x - a.x) * (b.y - a.y) - (q.y - a.y) * (b.x - a.x)) / len);

  }

  return { recognize, recognizePair, halfHeartCandidate, GUIDE, resample, features, hullFeatures, trimHooks, TEMPLATES, bounds, PERFECT };
})();

const canvas = document.getElementById('game');

const L = { cssW: 0, cssH: 0, dpr: 1, scale: 1, VW: 1000, VH: 540, safeL: 0, safeR: 0, safeT: 0, safeB: 0, marginX: 60, wizX: 124, groundY: 444, portrait: false, spawnX: 1050, laneLen: 860, speedK: 1 };

function readSafe() {

  if (!el) return { l: 0, r: 0, t: 0, b: 0 };

  return { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0, t: parseFloat(cs.paddingTop) || 0, b: parseFloat(cs.paddingBottom) || 0 };
}
function computeLayout() {
  const vv = window.visualViewport;
  const cssW = Math.max(240, Math.round(window.innerWidth || (vv && vv.width) || 800));
  const cssH = Math.max(240, Math.round(window.innerHeight || (vv && vv.height) || 600));
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const aspect = cssW / cssH;

  const scale = Math.min(cssW / minW, cssH / 540);
  const sf = readSafe();
  Object.assign(L, { cssW, cssH, dpr, scale, VW: cssW / scale, VH: cssH / scale, safeL: sf.l / scale, safeR: sf.r / scale, safeT: sf.t / scale, safeB: sf.b / scale, portrait: aspect < 0.85 });
  L.marginX = L.safeL + (L.portrait ? 40 : 62);
  L.wizX = L.marginX + (L.portrait ? 54 : 66);
  L.groundY = L.portrait ? Math.min(L.VH - 120, 560) : L.VH - 98 - L.safeB;

// ---------- paper ----------
const paperC = document.createElement('canvas'), paperBackC = document.createElement('canvas');
let grainPat = null;
function grain(c) {
  if (!grainPat) {
    const g = document.createElement('canvas'); g.width = g.height = 128;
    const gc = g.getContext('2d'), id = gc.createImageData(128, 128);
    for (let i = 0; i < id.data.length; i += 4) {
      const v = Math.random();
      id.data[i] = 120; id.data[i + 1] = 100; id.data[i + 2] = 70; id.data[i + 3] = v < 0.5 ? v * 18 : v * 8;
    }
    gc.putImageData(id, 0, 0);
    grainPat = g;
  }
  return c.createPattern(grainPat, 'repeat');
}
const LINE_TOP = 86, LINE_GAP = 30;
function buildPaper() {
  const S = L.scale * L.dpr;
  for (const back of [false, true]) {
    const cv = back ? paperBackC : paperC;
    cv.width = canvas.width; cv.height = canvas.height;
    const c = cv.getContext('2d');
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = back ? '#f6f1e3' : '#fdfaf0'; c.fillRect(0, 0, cv.width, cv.height);
    c.fillStyle = grain(c); c.fillRect(0, 0, cv.width, cv.height);
    c.setTransform(S, 0, 0, S, 0, 0);
    // rules
    c.strokeStyle = back ? 'rgba(110,150,205,0.2)' : 'rgba(104,152,214,0.5)'; c.lineWidth = 1.15;
    for (let y = LINE_TOP; y < L.VH + 2; y += LINE_GAP) { c.beginPath(); c.moveTo(0, y); c.lineTo(L.VW, y); c.stroke(); }
    // margin (double red line)
    const mx = back ? L.VW - L.marginX : L.marginX;
    c.strokeStyle = back ? 'rgba(220,110,110,0.22)' : 'rgba(226,96,96,0.62)'; c.lineWidth = 1.5;
    c.beginPath(); c.moveTo(mx, 0); c.lineTo(mx, L.VH); c.stroke();
    c.lineWidth = 0.8; c.beginPath(); c.moveTo(mx + (back ? -4 : 4), 0); c.lineTo(mx + (back ? -4 : 4), L.VH); c.stroke();
    // punched holes
    const hx = back ? L.VW - (L.marginX - L.safeL) * 0.45 - L.safeR : L.safeL + (L.marginX - L.safeL) * 0.45;
    const hr = L.portrait ? 8 : 10;
    for (const f of [0.17, 0.5, 0.83]) {
      const hy = L.VH * f;
      c.fillStyle = '#d8d1c0'; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
      const gr = c.createRadialGradient(hx - 2, hy - 3, 1, hx, hy, hr);
      gr.addColorStop(0, 'rgba(90,75,55,0.45)'); gr.addColorStop(1, 'rgba(90,75,55,0.05)');
      c.fillStyle = gr; c.beginPath(); c.arc(hx, hy, hr, 0, TAU); c.fill();
    }
    // soft page edge shading
    const vg = c.createLinearGradient(0, 0, 0, L.VH);
    vg.addColorStop(0, 'rgba(120,100,60,0.05)'); vg.addColorStop(0.15, 'rgba(0,0,0,0)'); vg.addColorStop(0.9, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(120,100,60,0.07)');
    c.fillStyle = vg; c.fillRect(0, 0, L.VW, L.VH);
  }
}

// static ground doodle (drawn every frame but not boiling, like ink on paper)
let groundPts = null, groundKey = '';
function drawGround() {
  const key = L.VW + 'x' + L.groundY;
  if (key !== groundKey) {
    groundKey = key; groundPts = [];
    for (let x = L.marginX + 8; x <= L.VW + 20; x += 26) groundPts.push([x, L.groundY + 6 + Math.sin(x * 0.013) * 3 + hs(x) * 1.6]);
  }
  const b = BOIL; BOIL = 0;
  shape(groundPts, { closed: false, lw: 2.2, amp: 0, color: 'rgba(38,41,90,0.75)' });
  // grass tufts & pebbles
  ctx.strokeStyle = 'rgba(70,130,60,0.7)'; ctx.lineWidth = 1.6; ctx.beginPath();
  for (let x = L.marginX + 30, i = 0; x < L.VW; x += 70 + hash(i) * 60, i++) {

// ---------- page flip (corner curl) ----------
const Flip = { active: false, t: 0, dur: 0.9, snap: document.createElement('canvas'), onDone: null };
function startFlip(onDone) {
  Flip.snap.width = canvas.width; Flip.snap.height = canvas.height;
  Flip.snap.getContext('2d').drawImage(canvas, 0, 0);
  Flip.active = true; Flip.t = 0; Flip.onDone = onDone || null;
  Sfx.pageFlip();
}
function updateFlip(dt) {
  if (!Flip.active) return;
  Flip.t += dt;
  if (Flip.t >= Flip.dur) { Flip.active = false; const f = Flip.onDone; Flip.onDone = null; if (f) f(); }
}
function halfPlane(c, Mx, My, fx, fy, dx, dy, sign, BIG) {
  c.beginPath();
  c.moveTo(Mx + fx * BIG, My + fy * BIG); c.lineTo(Mx - fx * BIG, My - fy * BIG);
  c.lineTo(Mx - fx * BIG + sign * dx * BIG, My - fy * BIG + sign * dy * BIG); c.lineTo(Mx + fx * BIG + sign * dx * BIG, My + fy * BIG + sign * dy * BIG);
  c.closePath();
}
function drawFlip(c) {
  if (!Flip.active) return;
  const W = canvas.width, H = canvas.height;
  const p = clamp(easeInOut(clamp(Flip.t / Flip.dur, 0, 1)) * 1.02 + 0.01, 0, 1);
  const Cx = W, Cy = H;
  const Px = W - p * W * 2.4, Py = H - Math.sin(p * Math.PI) * H * 0.5;
  let dx = Px - Cx, dy = Py - Cy;

  if (dl < 2) { c.drawImage(Flip.snap, 0, 0); c.restore(); return; }

  c.save(); halfPlane(c, Mx, My, fx, fy, dx, dy, 1, BIG); c.clip(); c.drawImage(Flip.snap, 0, 0); c.restore();
  // shadow on the revealed new page next to the fold
  c.save(); halfPlane(c, Mx, My, fx, fy, dx, dy, -1, BIG); c.clip();
  const sh = c.createLinearGradient(Mx, My, Mx - dx * 90 * L.dpr, My - dy * 90 * L.dpr);
  sh.addColorStop(0, 'rgba(50,35,20,0.32)'); sh.addColorStop(1, 'rgba(50,35,20,0)');
  c.fillStyle = sh; c.fillRect(0, 0, W, H); c.restore();
  // the lifted flap: lifted part of the page mirrored across the fold, showing its back
  c.save();
  const k = 2 * (Mx * dx + My * dy);
  c.transform(1 - 2 * dx * dx, -2 * dx * dy, -2 * dx * dy, 1 - 2 * dy * dy, k * dx, k * dy);
  halfPlane(c, Mx, My, fx, fy, dx, dy, -1, BIG); c.clip();
  c.drawImage(paperBackC, 0, 0);
  const fl = c.createLinearGradient(Mx, My, Mx - dx * W * 0.6, My - dy * W * 0.6);
  fl.addColorStop(0, 'rgba(0,0,0,0.12)'); fl.addColorStop(0.08, 'rgba(255,255,255,0.08)'); fl.addColorStop(1, 'rgba(60,40,20,0.14)');
  c.fillStyle = fl; c.fillRect(0, 0, W, H);
  c.strokeStyle = 'rgba(60,50,40,0.35)'; c.lineWidth = 2 * L.dpr; c.strokeRect(0, 0, W, H);

  c.strokeStyle = 'rgba(60,50,40,0.25)'; c.lineWidth = 1.5 * L.dpr;
  c.beginPath(); c.moveTo(Mx + fx * BIG, My + fy * BIG); c.lineTo(Mx - fx * BIG, My - fy * BIG); c.stroke();
  c.restore();
}

const bodyFill = m => (m.flash > 0 ? '#ffd8cf' : PAPER);
const lookAt = () => [wiz.x + 6, wiz.y - 70];

function drawBlob(m) {
  const r = m.r, w = m.walk;
  const hop = Math.abs(Math.sin(w * 2.2));
  const sq = 1 + 0.08 * Math.cos(w * 4.4) - m.squash * 0.28 + m.atk * 0.1;
  const sx = 1 / Math.sqrt(Math.max(0.5, sq)), sy = sq;
  const cx = m.x, cy = m.y - r * sy - hop * 4;
  const fo = Math.sin(w * 2.2) * 5;
  shape(ell(cx - r * 0.45 + fo, m.y - 3, r * 0.3, r * 0.15, 10), { fill: PAPER, lw: 2, amp: 0.4, seed: m.seed + 1 });
  shape(ell(cx + r * 0.4 - fo, m.y - 3, r * 0.3, r * 0.15, 10), { fill: PAPER, lw: 2, amp: 0.4, seed: m.seed + 2 });
  ctx.save(); ctx.translate(cx, m.y); ctx.rotate(-m.atk * 0.25); ctx.translate(-cx, -m.y);
  shape(blobPts(cx, cy, r * sx, r * sy, m.seed, 16, 0.07), { fill: bodyFill(m), shade: m.color, gap: 5, alpha: 0.72, shade2: m.color2, seed: m.seed, lw: 2.6, ang: -0.9 });
  const [lx, ly] = lookAt();
  const bl = (m.t % 4) < 0.12 ? 1 : 0;
  eye(cx - r * 0.3, cy - r * 0.18, r * 0.27, lx, ly, { seed: m.seed + 3, blink: bl });
  eye(cx + r * 0.17, cy - r * 0.27, r * 0.2, lx, ly, { seed: m.seed + 4, blink: bl });
  const my = cy + r * 0.3;
  if (m.atk > 0.3) shape(ell(cx - r * 0.1, my, r * 0.2, r * 0.16, 10), { fill: INK, lw: 1.6, amp: 0.4, seed: m.seed + 5 });
  else shape([[cx - r * 0.45, my - 3], [cx - r * 0.1, my + r * 0.14], [cx + r * 0.22, my - 1]], { closed: false, lw: 2.2, amp: 0.5, seed: m.seed + 5 });
  ctx.restore();
}

  const [lx, ly] = lookAt();

function drawSlime(m) {
  const r = m.r, x = m.x, ink = m.type === 'drop';
  const ph = (m.t * 1.35 + m.seed * 0.13) % 1;
  let sq = 1, lift = 0;
  if (ph < 0.3) sq = 1 - 0.25 * Math.sin((ph / 0.3) * Math.PI);
  else { const k = (ph - 0.3) / 0.7; lift = Math.sin(k * Math.PI) * r * 0.9; sq = 1 + 0.15 * Math.sin(k * Math.PI); }
  sq -= m.squash * 0.25;
  const sx = 1 / Math.sqrt(Math.max(0.5, sq)), sy = sq;
  const by = m.y - lift;
  if (lift > 2) { ctx.fillStyle = 'rgba(38,41,90,0.12)'; ctx.beginPath(); ctx.ellipse(x, m.y - 1, r * (1 - lift / (r * 3)), 3, 0, 0, TAU); ctx.fill(); }
  const pts = [];
  for (let i = 0; i < 16; i++) {
    const a = Math.PI + (i / 15) * Math.PI;
    pts.push([x + Math.cos(a) * r * sx * 1.05, by - r * 0.15 + Math.sin(a) * r * sy * 1.1]);
  }
  pts.push([x + r * sx, by]); pts.push([x - r * sx, by]);
  shape(pts, { fill: ink ? '#5c5a95' : (m.flash > 0 ? '#ffe0da' : '#e7fbf5'), shade: m.color, gap: 4, alpha: ink ? 0.9 : 0.7, shade2: m.color2, lw: 2.5, seed: m.seed, color: ink ? '#141233' : INK });
  shape(ell(x - r * 0.42, by - r * 0.85, r * 0.16, r * 0.1, 8, -0.6), { fill: '#fff', lw: 0, amp: 0.3, seed: m.seed + 1 });
  const [lx, ly] = lookAt();
  eye(x - r * 0.25, by - r * 0.5, r * 0.2, lx, ly, { seed: m.seed + 2 });
  eye(x + r * 0.2, by - r * 0.52, r * 0.17, lx, ly, { seed: m.seed + 3 });
  shape([[x - r * 0.2, by - r * 0.2], [x, by - r * 0.1], [x + r * 0.15, by - r * 0.22]], { closed: false, lw: 1.8, amp: 0.3, seed: m.seed + 4 });
  if (ink) for (let i = 0; i < 2; i++) { const dx = (i ? 0.5 : -0.6) * r; shape([[x + dx - 2, by], [x + dx, by + 5 + Math.sin(m.t * 3 + i) * 2], [x + dx + 2, by]], { fill: '#3b3a73', lw: 1.3, amp: 0.2, seed: m.seed + 5 + i, color: '#141233' }); }
}

function drawGhost(m) {
  const x = m.x, r = m.r, cy = m.y - r - 10 + Math.sin(m.t * 2.4 + m.seed) * 5;
  const pts = [];
  for (let i = 0; i <= 10; i++) { const a = Math.PI + (i / 10) * Math.PI; pts.push([x + Math.cos(a) * r, cy + Math.sin(a) * r]); }
  const wv = m.t * 6;
  for (let i = 0; i <= 6; i++) { const px = x + r - (i / 6) * 2 * r; pts.push([px, cy + r * 0.9 + (i % 2 ? -5 : 4) + Math.sin(wv + i) * 3]); }
  shape(pts, { fill: bodyFill(m), shade: m.color, gap: 4.5, alpha: 0.6, lw: 2.4, seed: m.seed, sketch: true });
  shape(ell(x - r * 0.32, cy - r * 0.12, r * 0.14, r * 0.22, 10), { fill: INK, lw: 1, amp: 0.3, seed: m.seed + 1 });
  shape(ell(x + r * 0.22, cy - r * 0.14, r * 0.12, r * 0.19, 10), { fill: INK, lw: 1, amp: 0.3, seed: m.seed + 2 });
  shape(ell(x - r * 0.05, cy + r * 0.32, r * 0.12, r * 0.15, 10), { fill: INK, lw: 1, amp: 0.3, seed: m.seed + 3 });
}

const DRAW = { blob: drawBlob, knight: drawKnight, bat: drawBat, ogre: drawOgre, slime: drawSlime, mini: drawSlime, ghost: drawGhost, drop: drawSlime };

// symbol speech-bubble above rune monsters / bosses
function drawRunes(list, idx, x, y, size, timer) {
  const n = list.length - idx;
  if (n <= 0) return;
  const gap = size * 1.25, w = n * gap + size * 0.35, h = size * 1.45;
  const bx = x - w / 2, by = y - h;
  const rp = rectPts(bx, by, w, h, 8, 2), cut = 6; // corners: TR, BR, BL, TL (3 pts each) -> tail goes on the bottom edge
  rp.splice(cut, 0, [x + 7, by + h], [x, by + h + 10], [x - 7, by + h]);
  shape(rp, { fill: '#fffef8', lw: 2, amp: 0.5, seed: 400 });
  for (let i = idx; i < list.length; i++) {
    const k = i - idx, cx = bx + size * 0.18 + gap * k + gap / 2, cy = by + h / 2;
    const active = k === 0;
    if (active) glow(cx, cy, size * 0.9, SPELLS[list[i]].color, 0.35 + 0.15 * Math.sin(G.t * 8));
    glyph(list[i], cx, cy, size * 0.78, { color: active ? INK : 'rgba(38,41,90,0.35)', lw: active ? Math.max(2.2, size * 0.1) : Math.max(1.5, size * 0.07) });
  }
  if (timer != null) { // countdown ring
    const cx = bx + w + 8, cy = by + 4;
    ctx.beginPath(); ctx.arc(cx, cy, 8, 0, TAU); ctx.fillStyle = '#fff'; ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 1.5; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 7, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(timer, 0, 1)); ctx.closePath(); ctx.fillStyle = timer < 0.3 ? COL.red : '#f0a830'; ctx.fill();
  }
}

// ---- 55-bosses.js ----
// ===================== BOSSES =====================
const BOSSES = {
  dragon:   { name: 'Doodle Dragon',   hp: 900,  score: 1000, runes: [3, 3],    runeDur: 13, color: '#e8553f' },
  eraser:   { name: 'The Angry Eraser', hp: 1500, score: 2000, runes: [3, 4],    runeDur: 13, color: '#f39bb5' },
  inkblot:  { name: 'Living Ink Blot', hp: 2100, score: 3000, runes: [4, 4],    runeDur: 14, color: '#2b2a5e' },
  scribble: { name: 'The Great Scribble', hp: 3200, score: 6000, runes: [4, 5], runeDur: 15, color: '#555' },
};
function runeSet() {
  const w = G.wave;
  const pool = w < 8 ? ['line', 'circle', 'triangle', 'zigzag'] : w < 14 ? ['line', 'circle', 'triangle', 'zigzag', 'heart', 'spiral'] : SHAPES.slice();
  return pool;
}
function makeRunes(n) {
  const pool = runeSet(), out = [];
  for (let i = 0; i < n; i++) { let s; do { s = pick(pool); } while (out.length && s === out[out.length - 1]); out.push(s); }
  return out;
}

function spawnBoss(kind) {
  const d = BOSSES[kind];
  const hpMul = 1;
  const b = {
    id: G.uid++, boss: true, type: 'boss', kind, name: d.name, x: L.spawnX + 120, y: L.groundY, hp: d.hp * hpMul, maxHp: d.hp * hpMul,
    t: 0, flash: 0, squash: 0, seed: randi(1, 999), runes: null, runeIdx: 0, runeT: 0, runeCount: 0, stun: 0,
    atkT: 0, atk2T: 0, spawnT: 0, state: 'enter', st: 0, mouth: 0, hx: 0, hy: 0, hr: 80, score: d.score, symbols: [], walk: 0, atk: 0, r: 80,
    targetX: L.VW * (L.portrait ? 0.7 : 0.66), lash: null,
  };
  G.monsters.push(b); G.boss = b;
  G.seenBoss[kind] = true; store.set('seenBoss', G.seenBoss);
  return b;
}

function bossDamageMul(b, src) {
  let k = b.stun > 0 ? 2 : 1;
  if (b.kind === 'inkblot' && src === 'fire') k *= 1.5;
  return k;
}
function startRunes(b) {
  const d = BOSSES[b.kind];
  b.runes = makeRunes(d.runes[Math.min(b.runeCount, d.runes.length - 1)]);
  b.runeIdx = 0; b.runeT = 0; b.runeDur = d.runeDur;
  Sfx.rune(); Sfx.roar();
  floatText(b.hx, b.hy - b.hr - 40, 'RUNE SHIELD!', { size: 30, color: COL.magic, life: 1.6 });
  hintOnce('bossRunes', 'Draw the symbols above the boss, in order, to break its shield!', 'star');
}
function runeCleared(b) {
  b.runes = null; b.runeCount++;
  b.stun = 4.5; b.flash = 1;
  G.shake = Math.max(G.shake, 10);
  Sfx.boom(true); Sfx.combo();
  floatText(b.hx, b.hy - b.hr - 30, 'SHIELD BROKEN! x2 DAMAGE', { size: 26, color: COL.red, life: 1.8 });
  burst(b.hx, b.hy, 40, COL.magic, 300);
  addScore(250, b.hx, b.hy - b.hr);
}
function runeFailed(b) {
  floatText(b.hx, b.hy - b.hr - 30, 'TOO SLOW!', { size: 30, color: COL.red, life: 1.4 });
  Sfx.roar();
  // punishing blast, blockable by the shield
  foeShot(b.hx - b.hr * 0.6, b.hy, 'big', 22);
  b.runes = makeRunes(b.runes.length); b.runeIdx = 0; b.runeT = 0;
}

function updateBoss(b, dt) {
  b.t += dt; b.st += dt;
  b.flash = Math.max(0, b.flash - dt * 4); b.squash = Math.max(0, b.squash - dt * 4);
  b.mouth = Math.max(0, b.mouth - dt * 2);
  // rune phases
  const d = BOSSES[b.kind], ratio = b.hp / b.maxHp;
  const thresholds = [0.66, 0.33];
  if (!b.runes && b.runeCount < thresholds.length && ratio <= thresholds[b.runeCount] && b.stun <= 0) startRunes(b);
  if (b.runes) { b.runeT += dt; if (b.runeT >= b.runeDur) runeFailed(b); }
  const fast = b.runes ? 0.7 : (b.runeCount >= 2 ? 0.8 : 1);
  if (b.stun > 0) b.stun -= dt;
  const stunned = b.stun > 0;
  switch (b.kind) {
    case 'dragon': {
      const hoverY = L.groundY - 190 - Math.min(40, L.portrait ? 0 : (L.VH - 540) * 0.2);
      if (b.state === 'enter') { b.x -= 120 * dt; if (b.x <= b.targetX) { b.x = b.targetX; b.state = 'fight'; } }
      const ty = stunned ? L.groundY - 70 : hoverY + Math.sin(b.t * 1.6) * 16;
      b.y = lerp(b.y === L.groundY ? hoverY : b.y, ty, Math.min(1, dt * 3));
      if (b.state === 'fight' && !stunned) {
        b.x = lerp(b.x, b.targetX + Math.sin(b.t * 0.5) * 40, dt);
        b.atkT += dt;
        if (b.atkT > 3.1 * fast) {
          b.atkT = 0; b.mouth = 1;
          const n = b.runeCount >= 1 ? 4 : 3;
          for (let i = 0; i < n; i++) later(i * 0.11, () => { if (b.hp > 0 && G.boss === b) foeShot(b.x - 118, b.y - 58, 'fire', 8, (i - (n - 1) / 2) * 0.16); });
          Sfx.fireCast();
        }
        b.spawnT += dt;
        if (b.spawnT > 11) { b.spawnT = 0; spawnMonster('blob'); if (G.wave > 6) spawnMonster('bat'); }
      }
      b.hx = b.x - 10; b.hy = b.y - 10; b.hr = 78;
      break;
    }
    case 'eraser': {
      if (b.state === 'enter') { b.x -= 160 * dt; if (b.x <= b.targetX) { b.x = b.targetX; b.state = 'idle'; b.st = 0; } }
      else if (stunned) { b.state = 'idle'; b.st = 0; }
      else if (b.state === 'idle') {
        b.x = lerp(b.x, b.targetX, dt * 2);
        b.atkT += dt;
        if (b.atkT > 4.4 * fast) { b.atkT = 0; b.mouth = 1; for (let i = 0; i < 3; i++) foeShot(b.x - 70, b.y - 70, 'crumb', 4, -0.3 + i * 0.25); Sfx.swing(); }
        if (b.st > 3.3 * fast) { b.state = 'windup'; b.st = 0; Sfx.roar(); }
      } else if (b.state === 'windup') {
        b.x += Math.sin(b.t * 60) * 1.5;
        if (b.st > 0.65) { b.state = 'charge'; b.st = 0; }
      } else if (b.state === 'charge') {
        b.x -= 470 * dt;
        if (Math.random() < 0.6) G.patches.push({ kind: 'smudge', x: b.x + 40 + rand(-10, 10), y: L.groundY - rand(5, 60), r: rand(14, 26), t: 0, life: 5 });
        const front = wiz.x + (G.shield ? G.shield.r : 34) + 80;
        if (b.x <= front) {
          b.x = front;
          if (G.shield) { shieldAbsorb(18); b.state = 'retreat'; b.st = 0; b.squash = 1; Sfx.boom(); G.shake = 8; }
          else { b.state = 'rub'; b.st = 0; }
        }
      } else if (b.state === 'rub') {
        b.x += Math.sin(b.st * 30) * 4;
        if (b.st > 0.25 && !b.rubbed) {
          b.rubbed = true; hurtWizard(13);
          if (!G.practice) { const lost = Math.min(G.mana, 20); G.mana -= lost; if (lost > 1) floatText(wiz.x + 40, wiz.y - 140, 'MANA ERASED!', { size: 22, color: COL.red }); }
        }
        if (b.st > 0.7) { b.state = 'retreat'; b.st = 0; b.rubbed = false; }
      } else if (b.state === 'retreat') {
        b.x += 260 * dt;
        if (b.x >= b.targetX) { b.x = b.targetX; b.state = 'idle'; b.st = 0; }
      }
      b.spawnT += dt;
      if (b.spawnT > 12 && b.state === 'idle') { b.spawnT = 0; spawnMonster('knight'); spawnMonster('bat'); }
      b.y = L.groundY;
      b.hx = b.x; b.hy = b.y - 55; b.hr = 72;
      break;
    }
    case 'inkblot': {
      if (b.state === 'enter') { b.x -= 90 * dt; if (b.x <= b.targetX) { b.x = b.targetX; b.state = 'fight'; } }
      else if (!stunned) {
        b.x = Math.max(L.VW * 0.5, b.x - 4 * dt);
        b.atkT += dt; b.atk2T += dt; b.spawnT += dt;
        if (b.atkT > 3 * fast) { b.atkT = 0; b.mouth = 1; foeShot(b.x - 60, b.y - 80, 'ink', 8, rand(-0.1, 0.1)); if (b.runeCount >= 1) foeShot(b.x - 60, b.y - 80, 'ink', 8, 0.25); Sfx.splat(); }
        if (b.atk2T > 8.5 * fast) {
          b.atk2T = 0; b.mouth = 1; Sfx.splat();
          const n = 3 + b.runeCount;
          for (let i = 0; i < n; i++) G.splats.push({ x: rand(L.VW * 0.15, L.VW * 0.85), y: rand(L.VH * 0.15, L.VH * 0.8), r: rand(50, 95), t: 0, life: 4.5, seed: randi(1, 999) });
          floatText(b.hx, b.hy - b.hr - 20, 'SPLAT!', { size: 30, color: '#2b2a5e' });
        }
        if (b.spawnT > 6.5) { b.spawnT = 0; spawnMonster('drop'); spawnMonster('drop'); }
      }
      b.y = L.groundY;
      b.hx = b.x; b.hy = b.y - 85; b.hr = 88;
      break;
    }
    case 'scribble': {
      const hoverY = L.groundY - 160;
      if (b.state === 'enter') { b.x -= 100 * dt; if (b.x <= b.targetX) { b.x = b.targetX; b.state = 'fight'; } }
      b.y = lerp(b.y === L.groundY ? hoverY : b.y, stunned ? L.groundY - 100 : hoverY + Math.sin(b.t * 1.3) * 20, Math.min(1, dt * 2.5));
      if (b.state === 'fight' && !stunned) {
        b.x = lerp(b.x, b.targetX + Math.sin(b.t * 0.6) * 50, dt);
        b.atkT += dt; b.spawnT += dt; b.atk2T += dt;
        if (b.atkT > (b.runeCount >= 2 ? 2.0 : 2.8) * fast) {
          b.atkT = 0; b.mouth = 1;
          for (let i = 0; i < 3; i++) foeShot(b.x - 80, b.y, 'dart', 7, (i - 1) * 0.2);
          Sfx.swing();
        }
        if (b.spawnT > (b.runeCount >= 1 ? 6.5 : 8)) {
          b.spawnT = 0;
          const k = pick(b.runeCount >= 1 ? ['knight', 'bat', 'slime', 'ghost', 'ogre'] : ['blob', 'knight', 'bat', 'slime']);
          spawnMonster(k, k === 'ghost' ? { symbols: randi(2, 3) } : null);
        }
        if (b.runeCount >= 1 && !b.lash && b.atk2T > 6) { b.atk2T = 0; b.lash = { t: 0, y: wiz.y - 60 }; floatText(b.hx, b.hy - b.hr - 10, '!!', { size: 34, color: COL.red }); }
      }
      if (b.lash) {
        b.lash.t += dt;
        if (b.lash.t > 1.1 && !b.lash.hit) { b.lash.hit = true; G.shake = 10; Sfx.lightning(); if (G.shield) shieldAbsorb(16); else hurtWizard(14); }
        if (b.lash.t > 1.45) b.lash = null;
      }
      b.hx = b.x; b.hy = b.y; b.hr = 95;
      break;
    }
  }
}

// ---- 60-combat.js ----
// ===================== COMBAT: spawning, damage, spells, effects =====================
G.timers = [];
function later(delay, fn) { G.timers.push({ t: delay, fn }); }
const isSlime = m => m.type === 'slime' || m.type === 'mini' || m.type === 'drop';
const alive = m => m.hp > 0 && !m.dead;

function makeSymbols(n) {
  const pool = runeSet(), out = [];
  for (let i = 0; i < n; i++) { let s; do { s = pick(pool); } while (out.length && s === out[out.length - 1] && pool.length > 1); out.push(s); }
  return out;
}
function spawnMonster(type, o = {}) {
  const d = MON[type];
  o = o || {};
  const w = G.wave;
  const hpMul = G.practice ? 1 : 1 + 0.1 * (w - 1) + Math.max(0, w - 8) * 0.06;
  const spMul = G.practice ? 1.6 : 1 + 0.025 * (w - 1);
  const m = {
    id: G.uid++, type, x: o.x != null ? o.x : L.spawnX + rand(0, 40), y: L.groundY,
    r: d.r, hp: d.hp * hpMul, maxHp: d.hp * hpMul, speed: d.speed * spMul * L.speedK * rand(0.9, 1.1), dmg: d.dmg * (G.practice ? 0 : 1 + 0.05 * (w - 1)),
    color: d.color, color2: d.color2, t: rand(0, 5), walk: rand(0, 5), flash: 0, squash: 0, seed: randi(1, 9999),
    atk: 0, atkT: rand(0, 0.5), atkEvery: type === 'ogre' ? 1.9 : 1.25, kb: o.kb || 0, stun: 0, burn: 0, burnDps: 0, inT: null, block: 0,
    symbols: [], score: d.score, fly: !!d.fly, mass: d.mass || 1, hx: 0, hy: 0, hr: d.r, lift: 0, spin: 0, fallV: 0,
  };
  if (m.fly) { m.baseY = L.groundY - 145 - rand(0, 70); m.y = m.baseY; m.ph = rand(0, TAU); }
  if (type === 'ghost') m.symbols = makeSymbols(o.symbols || 1);
  else if (o.symbols) m.symbols = makeSymbols(o.symbols);
  setHit(m);
  G.monsters.push(m);
  return m;
}
function setHit(m) {
  if (m.boss) return;
  if (m.fly) { m.hx = m.x; m.hy = m.y; m.hr = m.r + 4; }
  else if (m.type === 'ghost') { m.hx = m.x; m.hy = m.y - m.r - 10; m.hr = m.r; }
  else if (m.type === 'ogre') { m.hx = m.x; m.hy = m.y - 62; m.hr = 46; }
  else if (m.type === 'knight') { m.hx = m.x; m.hy = m.y - 38; m.hr = 27; }
  else { m.hx = m.x; m.hy = m.y - m.r; m.hr = m.r; }
  m.hy -= m.lift;
}
// can this monster be hit / targeted by a given spell?
function targetable(m, src) {
  if (!alive(m) || m.x > L.VW + 30) return false;
  if (m.symbols && m.symbols.length) return false;
  if (m.fly && src !== 'lightning') return false;
  return true;
}
function nearestN(n, filter) {
  return G.monsters.filter(filter).sort((a, b) => (a.hx - wiz.x) - (b.hx - wiz.x)).slice(0, n);
}

// ---------- wizard damage / shield ----------
function hurtWizard(d) {
  if (G.practice || G.screen !== 'play' || G.deathT > 0) return;
  G.hp -= d; wiz.hurtT = 0.45; G.shake = Math.max(G.shake, 7); G.flash = 0.35; G.flashCol = '#ff6a6a';
  Sfx.hurt();
  floatText(wiz.x + 8, wiz.y - 140, '-' + Math.round(d), { color: COL.red, size: 26 });
  if (G.hp <= 0) { G.hp = 0; startDeath(); }
}
function shieldAbsorb(d) {
  const s = G.shield; if (!s) return;
  s.hp -= d; s.hit = 1; Sfx.shieldHit();
  if (s.hp <= 0) popShield();
}
function popShield() {
  if (!G.shield) return;
  G.shield = null; Sfx.pop();
  burst(wiz.x, wiz.y - 55, 22, COL.shield, 260);
  G.fx.push({ kind: 'ring', x: wiz.x, y: wiz.y - 55, r0: 90, r1: 140, t: 0, life: 0.35, color: COL.shield });
}

// ---------- damage & death ----------
function damage(m, amt, src, o = {}) {

        }
      }

    } else if (s.kind === 'fire') {
      const k = Math.min(1, s.t / s.T);
      s.x = lerp(s.sx, s.tx, k); s.y = lerp(s.sy, s.ty, k) - s.h * 4 * k * (1 - k);
      if (Math.random() < 0.9) part({ kind: 'flame', x: s.x + rand(-5, 5), y: s.y + rand(-5, 5), vx: rand(-20, 20), vy: -rand(10, 50), life: 0.35, size: rand(5, s.mini ? 7 : 11), color: pick([COL.fire, '#ffb020', '#ff5a1a']) });
      if (k >= 1) {
        s.dead = true;
        const R = (s.mini ? 48 : 82) * (1 + 0.35 * upLv('bigboom')) * (s.pow > 1 ? 1.2 : 1);
        explode(s.x, s.y, R, (s.mini ? 10 : 18) * s.pow, 'fire', { word: s.mini ? 'pop!' : null });
        if (upLv('burning')) G.patches.push({ kind: 'fire', x: s.x, y: L.groundY, r: s.mini ? 34 : 58, t: 0, life: 3.2, dps: 9 * s.pow, tick: 0 });
        if (!s.mini && upLv('triple')) for (let i = 0; i < 3; i++) G.shots.push({ kind: 'fire', x: s.x, y: s.y, sx: s.x, sy: s.y, tx: s.x + 60 + i * 70, ty: L.groundY - 10, t: 0, T: 0.38 + i * 0.05, h: 70, pow: s.pow, mini: true });

  }
  G.shots = G.shots.filter(s => !s.dead);
  // tornados
  for (const T of G.tornados) {
    T.t += dt; T.x += T.speed * dt;
    if (Math.random() < dt * 25) part({ kind: 'paper', x: T.x + rand(-T.r, T.r), y: L.groundY - rand(0, 150), vx: rand(-60, 60), vy: -rand(30, 90), life: 0.6, size: rand(3, 6), color: T.fire ? COL.fire : '#c9c3b3', vr: rand(-10, 10) });
    for (const m of G.monsters) {
      if (!alive(m) || m.fly || m.inT || (m.symbols && m.symbols.length)) continue;

      if (Math.abs(m.x - T.x) < T.r) {
        if (m.mass >= 3) { if (!m.pushedBy || m.pushedBy !== T) { m.pushedBy = T; m.kb = 420; floatText(m.hx, m.hy - 60, 'too heavy!', { size: 16, color: COL.grey }); } continue; }
        m.inT = T; T.caught.push(m); m.atk = 0;
      }
    }
    T.tick = (T.tick || 0) + dt;
    if (T.tick > 0.25) {
      T.tick = 0;
      for (const m of T.caught) if (alive(m) && m.inT === T) damage(m, (T.fire ? 14 : 4 + 9 * upLv('shred')) * 0.25 * T.pow, T.fire ? 'fire' : 'tornado', { quiet: true });
    }
    if (T.t > T.life || T.x > L.VW + 90) T.dead = true;
  }
  G.tornados = G.tornados.filter(T => !T.dead);
  // meteors
  for (const M of G.meteors) {
    M.t += dt;
    const k = Math.min(1, M.t / M.T);
    M.x = lerp(M.sx, M.tx, k); M.y = lerp(M.sy, M.ty, k);
    if (Math.random() < 0.9) part({ kind: 'flame', x: M.x + rand(-6, 6), y: M.y + rand(-6, 6), vx: rand(10, 60), vy: -rand(0, 40), life: 0.4, size: rand(6, 12), color: pick([COL.meteor, COL.fire, '#ffb020']) });
    if (k >= 1) {
      M.dead = true;
      explode(M.tx, M.ty, 80, 34 * M.pow, 'meteor', { big: true, color: COL.meteor });
      G.patches.push({ kind: 'scorch', x: M.tx, y: L.groundY + 4, r: rand(26, 40), t: 0, life: 6 });
    }
  }
  G.meteors = G.meteors.filter(M => !M.dead);
  // foe projectiles
  for (const f of G.foes) {
    f.t += dt; f.vy += f.grav * dt; f.x += f.vx * dt; f.y += f.vy * dt;
    if (f.kind === 'fire' || f.kind === 'big') { if (Math.random() < 0.8) part({ kind: 'flame', x: f.x, y: f.y, vx: rand(10, 50), vy: -rand(10, 40), life: 0.3, size: rand(5, f.kind === 'big' ? 14 : 8), color: COL.fire }); }
    const cx = wiz.x + 2, cy = wiz.y - 58;

    if (dist(f.x, f.y, cx, cy) < 30 + f.r) { f.dead = true; hurtWizard(f.dmg); burst(f.x, f.y, 10, f.kind === 'ink' ? '#2b2a5e' : COL.fire, 200, f.kind === 'ink' ? 'ink' : 'spark'); continue; }
    if (f.y > L.groundY + 20) { f.dead = true; burst(f.x, L.groundY, 5, '#aaa', 100); }
    if (f.x < -50 || f.t > 6) f.dead = true;
  }
  G.foes = G.foes.filter(f => !f.dead);
  // ground patches
  for (const p of G.patches) {
    p.t += dt;
    if (p.kind === 'fire') {
      p.tick += dt;
      if (Math.random() < dt * 14) part({ kind: 'flame', x: p.x + rand(-p.r, p.r), y: p.y - rand(0, 8), vy: -rand(30, 70), life: 0.5, size: rand(5, 10), color: pick([COL.fire, '#ffb020']) });
      if (p.tick > 0.5) { p.tick = 0; for (const m of G.monsters) if (alive(m) && !m.fly && !m.inT && Math.abs(m.x - p.x) < p.r + m.hr * 0.5) damage(m, p.dps * 0.5, 'fire', { quiet: true }); }
    }
  }
  G.patches = G.patches.filter(p => p.t < p.life);
}

function updateFx(dt) {
  for (const p of G.parts) { p.t += dt; p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  G.parts = G.parts.filter(p => p.t < p.life);
  for (const tx of G.texts) { tx.t += dt; tx.y += tx.vy * dt; tx.vy *= Math.pow(0.15, dt); }
  G.texts = G.texts.filter(t => t.t < t.life);
  for (const f of G.fx) {
    f.t += dt;
    if (f.kind === 'crumple' && f.t > 0.2) {
      f.vy += 980 * dt; f.x += f.vx * dt; f.y += f.vy * dt; f.rot += f.vr * dt;
      const gy = L.groundY - f.r * 0.7;
      if (f.y > gy) { f.y = gy; f.vy *= -0.42; f.vx *= 0.7; f.vr *= 0.6; f.bounces++; if (Math.abs(f.vy) < 60) f.vy = 0; }
    }
  }
  G.fx = G.fx.filter(f => f.t < (f.kind === 'crumple' ? (f.big ? 3 : 1.9) : f.life));
  for (const s of G.splats) s.t += dt;
  G.splats = G.splats.filter(s => s.t < s.life);
}

function dizzy(x, y, r) {
  for (let i = 0; i < 3; i++) { const a = G.t * 4 + (i * TAU) / 3; sparkle(x + Math.cos(a) * r, y + Math.sin(a) * r * 0.35, 6, COL.gold, 1, a); }
}
function hpBar(x, y, w, f, col = COL.red) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.fillRect(x - w / 2, y - 3, w, 6);
  ctx.fillStyle = col; ctx.fillRect(x - w / 2, y - 3, w * clamp(f, 0, 1), 6);

function heartPath(x, y, s) {

// ---- sprite cache: each creature is re-inked only when its own boil tick changes (~9 fps,
// like stop-motion doodles), then blitted every frame at its smooth position ----
const SPR_BOX = { // [left, right, top, bottom] extents around (x, y)
  blob: m => [m.r * 1.7, m.r * 1.7, m.r * 2.7 + 12, m.r * 0.5 + 6], knight: () => [46, 46, 100, 8], bat: () => [48, 48, 40, 24],
  ogre: () => [128, 78, 182, 10], slime: m => [m.r * 1.6, m.r * 1.6, m.r * 3.4, 10], mini: m => [m.r * 1.6, m.r * 1.6, m.r * 3.4, 10],
  drop: m => [m.r * 1.6, m.r * 1.6, m.r * 3.4, 16], ghost: m => [m.r * 1.5, m.r * 1.5, m.r * 2.6 + 24, 12], dummy: () => [46, 46, 130, 8],
  dragon: () => [205, 205, 190, 80], eraser: () => [125, 125, 145, 22], inkblot: () => [130, 130, 220, 38], scribble: () => [170, 170, 170, 170],
};
function spriteDraw(m, key, fn) {
  const S = L.scale * L.dpr;
  const [l, r, t, b] = SPR_BOX[key](m);
  const w = l + r, h = t + b;
  const tick = Math.floor(G.t * 9 + (m.id % 7) / 7);
  const fl = m.flash > 0 ? 1 : 0;
  let sp = m.spr;
  if (!sp) sp = m.spr = { c: document.createElement('canvas'), tick: -1 };
  if (sp.tick !== tick || sp.S !== S || sp.fl !== fl || sp.w !== w || sp.h !== h) {
    const cw = Math.ceil(w * S), ch = Math.ceil(h * S);
    if (sp.c.width !== cw || sp.c.height !== ch) { sp.c.width = cw; sp.c.height = ch; sp.cx = null; }
    const c = sp.cx || (sp.cx = sp.c.getContext('2d'));
    c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cw, ch);
    c.setTransform(S, 0, 0, S, (l - m.x) * S, (t - m.y) * S);
    const prev = ctx, b0 = BOIL; ctx = c; BOIL = tick;
    fn(m);
    ctx = prev; BOIL = b0;
    Object.assign(sp, { tick, S, fl, w, h, l, t });
  }
  ctx.drawImage(sp.c, m.x - sp.l, m.y - sp.t, sp.w, sp.h);
}
function drawMonster(m) {
  if (m.boss) {
    spriteDraw(m, m.kind, DRAW_BOSS[m.kind]);
    if (m.kind === 'scribble') drawLash(m);
    if (m.stun > 0) dizzy(m.hx, m.hy - m.hr - 8, m.hr * 0.55);
    return; // boss runes are drawn later, above the HUD and hints (drawBossRunes)
  }
  ctx.save();
  if (m.lift > 0.5 || m.spin) { const cx = m.x, cy = m.y - m.r; ctx.translate(cx, cy - m.lift); ctx.rotate(m.spin); ctx.translate(-cx, -cy); }
  spriteDraw(m, m.type, DRAW[m.type]);
  ctx.restore();
  if (m.stun > 0) dizzy(m.hx, m.hy - m.hr - 6, 14);
  if ((m.type === 'ogre' || m.type === 'knight') && m.hp < m.maxHp) hpBar(m.hx, m.hy - m.hr - (m.type === 'ogre' ? 24 : 20), m.type === 'ogre' ? 56 : 36, m.hp / m.maxHp);
  if (m.symbols.length) drawRunes(m.symbols, 0, m.hx, m.hy - m.hr - (m.type === 'ghost' ? 6 : 14), 22);
}

function drawShieldBubble() {
  const S = G.shield; if (!S) return;
  const cx = wiz.x + 2, cy = wiz.y - 58;
  const grow = S.born < 0.25 ? easeOutBack(S.born / 0.25) : 1;
  const r = S.r * grow * (1 + Math.sin(G.t * 5) * 0.015 + S.hit * 0.06);
  const left = S.dur - S.t;
  const vis = left < 1.6 ? (Math.sin(G.t * 22) > 0 ? 1 : 0.45) : 1;
  const a0 = ctx.globalAlpha; ctx.globalAlpha = a0 * vis;
  ctx.fillStyle = `rgba(60,184,234,${0.1 + S.hit * 0.15})`; ctx.beginPath(); ctx.arc(cx, cy, r, 0, TAU); ctx.fill();

  shape(loopPts(cx, cy, r - 5, r - 5, 9, 24), { closed: false, lw: 1.3, color: 'rgba(60,184,234,0.5)', amp: 1.2, seed: 601 });

  ctx.beginPath(); ctx.arc(cx, cy, r + 6, Math.PI * 1.25, Math.PI * 1.25 + Math.PI * 0.5 * f); ctx.strokeStyle = 'rgba(47,141,245,0.55)'; ctx.lineWidth = 3; ctx.stroke();

  ctx.globalAlpha = a0;
}

function drawTornado(T) {
  const gy = L.groundY, col = T.fire ? COL.fire : '#7d9f96', col2 = T.fire ? '#ffb020' : '#a9c7bf';
  const fade = T.life - T.t < 0.4 ? (T.life - T.t) / 0.4 : Math.min(1, T.t / 0.15);
  const a0 = ctx.globalAlpha; ctx.globalAlpha = a0 * fade;

  }

}

function drawShots() {

function drawPatches(front) {

    else if (front && p.kind === 'fire') glow(p.x, p.y - 8, p.r * 1.3, COL.fire, 0.35 * clamp(f, 0, 1));

function drawFx() {
  for (const f of G.fx) {
    const k = f.t / (f.life || 1);
    if (f.kind === 'boom') {
      const e = easeOutCubic(Math.min(1, k * 1.6)), r = f.r * (0.35 + 0.65 * e), al = 1 - k;
      const a0 = ctx.globalAlpha; ctx.globalAlpha = a0 * al;
      shape(blobPts(f.x, f.y, r, r * 0.9, f.x, 14, 0.12), { fill: 'rgba(255,240,180,0.6)', shade: f.color, gap: 5, alpha: 0.8, lw: 2.5, color: '#8a3a10', seed: 30 });
      for (let i = 0; i < 8; i++) { const a = (i / 8) * TAU + f.x; iline(f.x + Math.cos(a) * r * 1.05, f.y + Math.sin(a) * r * 1.05, f.x + Math.cos(a) * r * 1.35, f.y + Math.sin(a) * r * 1.35, { lw: 2.4, color: f.color, amp: 0.5, seed: 31 + i }); }
      ctx.globalAlpha = a0;
      if (f.word) { const s = k < 0.2 ? easeOutBack(k / 0.2) : 1; text(f.word, f.x, f.y - r * 0.2, 26 * s, { color: '#ffd23f', outline: INK, outlineW: 5, rot: -0.12, seed: 3, alpha: k > 0.7 ? (1 - k) / 0.3 : 1 }); }
    } else if (f.kind === 'zap') {
      const al = 1 - k;
      const pts = [];
      for (let i = 0; i < f.pts.length - 1; i++) {
        const [x0, y0] = f.pts[i], [x1, y1] = f.pts[i + 1];
        const n = Math.max(3, Math.round(dist(x0, y0, x1, y1) / 22));
        const nx = -(y1 - y0), ny = x1 - x0, nl = Math.hypot(nx, ny) || 1;
        for (let j = 0; j < n; j++) { const t = j / n, off = j === 0 ? 0 : hs(f.seed + i * 13 + j * 7 + BOIL * 5) * 13; pts.push([lerp(x0, x1, t) + (nx / nl) * off, lerp(y0, y1, t) + (ny / nl) * off]); }
      }
      pts.push(f.pts[f.pts.length - 1]);

      ctx.lineJoin = 'miter'; ctx.lineCap = 'round';
      ctx.beginPath(); pts.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])));
      ctx.strokeStyle = INK; ctx.lineWidth = 9; ctx.stroke();
      ctx.strokeStyle = COL.lightning; ctx.lineWidth = 6; ctx.stroke();
      ctx.strokeStyle = '#fffbe0'; ctx.lineWidth = 2; ctx.stroke();
      ctx.lineJoin = 'round';
      ctx.globalAlpha = a0;
    } else if (f.kind === 'ring') {
      const r = lerp(f.r0, f.r1, easeOutCubic(k));
      ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, TAU); ctx.strokeStyle = f.color; ctx.globalAlpha = 1 - k; ctx.lineWidth = 3; ctx.stroke(); ctx.globalAlpha = 1;
    } else if (f.kind === 'crumple') {
      const m = f.m;

        const e = f.t / 0.2, s = 1 - 0.6 * e;
        ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(e * 0.7); ctx.scale(s * (1 + 0.15 * Math.sin(e * 20)), s); ctx.translate(-f.x, -f.y);

const MAX_WAVE = WAVES.length;

function startWave(n) {
  G.wave = n; G.waveT = 0; G.phase = 'intro'; G.phaseT = 0;
  const W = WAVES[n - 1];
  G.queue = [];
  const dens = 1 + 0.055 * (n - 1), pace = 1 / (1 + 0.03 * (n - 1));
  for (const gr of W.groups) {
    const slow = gr.type === 'ogre' || gr.sym > 0; // tough or symbol-carrying monsters scale gently
    const cnt = Math.max(1, Math.round(gr.n * (slow ? 1 + 0.015 * (n - 1) : dens)));
    for (let i = 0; i < cnt; i++) G.queue.push({ at: gr.at + i * gr.every * pace + rand(-0.25, 0.25) * gr.every * pace, type: gr.type, sym: gr.sym });
  }
  G.queue.sort((a, b) => a.at - b.at);
  G.bossPending = W.boss || null;
  G.mana = G.maxMana;
  G.shield = null; G.tornados = []; G.shots = []; G.foes = []; G.meteors = []; G.splats = []; G.timers = [];
  G.checkpoint = { wave: n, hp: G.hp, maxHp: G.maxHp, up: Object.assign({}, G.up), score: G.score, kills: G.kills, perfects: G.perfects, casts: G.casts };
  if (n > G.best) { G.best = n; store.set('bestWave', n); }
  G.introInfo = W.boss ? { boss: BOSSES[W.boss].name } : null;
  // show a wave's teaching intro the first time, and again whenever this is the player's frontier
  if (W.intro && (!HINTS_SEEN['intro' + n] || n >= (G.bestAtStart || 0))) G.introHint = W.intro; else G.introHint = null;
}
function manaRegen() { return 8 * (1 + 0.02 * (G.wave - 1)) * (1 + 0.15 * upLv('inkwell')); }

function updateWave(dt) {
  G.phaseT += dt;
  if (G.phase === 'intro') {
    if (G.phaseT === dt) { if (G.introInfo) Sfx.bossIntro(); else Sfx.waveStart(); }
    if (G.phaseT > (G.introHint ? 2.8 : 1.8)) {
      G.phase = 'fight'; G.phaseT = 0;
      if (G.introHint) { markHint('intro' + G.wave); G.hint = { str: G.introHint[0] + ' ' + G.introHint[2], shape: G.introHint[1], t: 0, life: 6 }; G.introHint = null; }
      if (G.bossPending) { spawnBoss(G.bossPending); Sfx.roar(); G.bossPending = null; }
    }
    return;
  }
  if (G.phase === 'fight') {
    G.waveT += dt;
    while (G.queue.length && G.queue[0].at <= G.waveT) { const q = G.queue.shift(); spawnMonster(q.type, q.sym ? { symbols: q.sym } : null); }
    if (WAVES[G.wave - 1].boss && !G.boss && !G.bossPending) G.queue = [];
    // contextual tips
    if (G.mana >= G.maxMana - 0.1 && G.wave >= 3 && G.monsters.length >= 5) hintOnce('star', 'Full mana! Draw a star for a Meteor Storm!', 'star');
    if (G.hp < G.maxHp * 0.5) hintOnce('heal', 'Ouch! Draw a heart to heal.', 'heart');
    if (G.monsters.some(m => !m.fly && m.x < wiz.x + 140)) hintOnce('shield', 'Too close! Draw a circle for a shield bubble.', 'circle');
    if (!G.queue.length && !G.boss && !G.monsters.length) {
      G.phase = 'clear'; G.phaseT = 0; Sfx.waveClear();
      floatText(L.VW / 2, L.groundY - 200, G.wave === MAX_WAVE ? 'THE SCRIBBLE IS ERASED!' : 'WAVE CLEARED!', { size: 44, color: COL.green, life: 2 });
      G.hp = Math.min(G.maxHp, G.hp + 10);
    }
  }
  if (G.phase === 'clear' && G.phaseT > 2.0) {
    if (G.wave >= MAX_WAVE) winGame();
    else { G.offers = rollUpgrades(); G.screen = 'upgrade'; G.upT = 0; G.picked = null; Sfx.upgrade(); }
  }
}

}

// ---------- gestures ----------
function idealFit(name, P, bb) {
  const src = SHAPE_PTS[name], sb = bbOf(src);
  if (name === 'line') { const y = bb.y + bb.h / 2; return [[bb.x, y], [bb.x + bb.w, y]]; }
  const sx = bb.w / (sb.w || 1), sy = bb.h / (sb.h || 1);
  return src.map(p => [bb.x + (p[0] - sb.x) * sx, bb.y + (p[1] - sb.y) * sy]);
}
const PREVIEW_SFX = { line: 'bolt', triangle: 'fireCast', circle: 'shieldCast', zigzag: 'lightning', spiral: 'tornado', heart: 'heal', star: 'meteorCast' };
function applyGesture(res, pts) {
  const P = pts.map(p => [p.x, p.y]);
  const bb = bbOf(P), cx = bb.x + bb.w / 2, cy = bb.y + bb.h / 2;
  if (G.screen === 'practice') {
    G.lastResult = res;
    if (res.name) { const st = G.practiceStats[res.name] || (G.practiceStats[res.name] = { n: 0, best: 0 }); st.n++; st.best = Math.max(st.best, res.quality); }
  }
  if (!res.name) {
    const msg = res.reason === 'vertical' ? 'draw lines sideways!' : (res.guess && res.score > 0.55 ? `almost a ${SHAPE_LABEL[res.guess]}?` : '');
    G.fx.push({ kind: 'fizzle', pts: P, t: 0, life: 0.8, cx, cy, msg });
    Sfx.fizzle();
    return;
  }
  const name = res.name, sp = SPELLS[name];
  let label = sp.verb, sub = null, ok = true, popped = 0;
  if (G.screen === 'play' || G.screen === 'practice') {
    popped = popRunes(name);
    ok = castSpell(name, res);
    if (!ok) { label = popped ? 'POP!' : sp.name; sub = popped ? null : (name === 'heart' && G.hp >= G.maxHp - 0.5 ? null : 'not enough mana'); }
  } else if (G.screen === 'title') { Sfx[PREVIEW_SFX[name]](); }
  if (G.screen === 'title') {
    for (const m of titleMobs) if (m.symbols.length && m.symbols[0] === name) {
      burst(m.hx, m.hy - m.hr - 26, 16, sp.color, 240); Sfx.pop();
      floatText(m.hx, m.hy - m.hr - 30, 'POOF!', { size: 26, color: COL.magic });
      m.symbols = []; m.respawn = 2.5;
    }
  }
  const perfect = res.perfect && (ok || popped > 0);
  if (G.screen === 'play') {
    G.streak = perfect ? (G.streak || 0) + 1 : 0;
    if (G.streak >= 2) { sub = `PERFECT streak x${G.streak}!`; addScore(10 * G.streak, cx, cy); }
  }
  G.fx.push({ kind: 'glyph', pts: P, ideal: idealFit(name, P, bb), t: 0, life: 0.8, cx, cy, top: bb.y, color: sp.color, perfect, label, sub });
  if (ok || popped || G.screen === 'title') {
    Sfx.shimmer(perfect);
    if (perfect) { G.slow = Math.max(G.slow, 0.1); G.flash = Math.max(G.flash, 0.22); G.flashCol = '#fff6c8'; }
  }
  const step = Math.max(1, Math.floor(P.length / 26));
  for (let i = 0; i < P.length; i += step) part({ kind: 'spark', x: P[i][0], y: P[i][1], vx: rand(-60, 60), vy: rand(-90, 10), life: rand(0.3, 0.7), size: rand(3, 7), color: perfect ? pick([COL.gold, '#fff8c0', sp.color]) : sp.color, grav: 60, rot: rand(0, TAU), vr: rand(-5, 5) });
}
function recogOpts() { return { perfectBonus: 0.012 * upLv('steady') }; }
function beginStroke(x, y, t) {
  pen.drawing = true; pen.pts = [{ x, y, t }]; pen.speed = 0;
  Sfx.scratchStart();
}
function addPoint(x, y, t) {
  const p = pen.pts[pen.pts.length - 1];
  const d = dist(x, y, p.x, p.y);
  if (d < 0.7) return;
  if (pen.pts.length > 3000) return;
  pen.pts.push({ x, y, t });
  const dtm = Math.max(1, t - p.t) / 1000;
  pen.speed = lerp(pen.speed, (d * L.scale) / dtm, 0.3);
  Sfx.scratchSpeed(pen.speed);
  wiz.lookX = x; wiz.lookY = y;
  if (Math.random() < 0.35) part({ kind: 'spark', x, y, vx: rand(-40, 40), vy: rand(-50, 20), life: rand(0.25, 0.5), size: rand(2.5, 5), color: pick(['#9d7bff', '#ffffff', '#c8b6ff']), grav: 40, rot: rand(0, TAU) });
}
function cancelStroke() { if (pen.drawing) { pen.drawing = false; pen.pts = []; Sfx.scratchStop(); } }
function endStroke() {
  pen.drawing = false; Sfx.scratchStop();
  const pts = pen.pts; pen.pts = [];
  let len = 0; for (let i = 1; i < pts.length; i++) len += dist(pts[i - 1].x, pts[i - 1].y, pts[i].x, pts[i].y);
  if (pts.length < 3 || len < 12) return; // a tap, not a drawing

  if (pending) {
    const first = pending; pending = null;
    const pr = Recognizer.recognizePair(first.pts, pts, opts);
    if (pr && pr.name === 'heart') { applyGesture(pr, first.pts.concat(pts)); return; }

// ---------- input ----------
function toWorld(e) { const r = canvas.getBoundingClientRect(); return [(e.clientX - r.left) / L.scale, (e.clientY - r.top) / L.scale]; }
function drawingAllowed() { return !Flip.active && ((G.screen === 'play' && G.deathT <= 0) || G.screen === 'practice' || G.screen === 'title'); }
function hitButton(x, y) { for (let i = BTN_LAST.length - 1; i >= 0; i--) { const b = BTN_LAST[i]; if (b.enabled && inRect(x, y, b)) return b; } return null; }
canvas.addEventListener('pointerdown', e => {
  Sfx.unlock();
  e.preventDefault();
  pointer.touch = e.pointerType !== 'mouse';
  const [x, y] = toWorld(e);
  pointer.x = x; pointer.y = y; pointer.hover = true;
  if (pen.down) return;
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  pen.down = true; pen.id = e.pointerId;
  try { canvas.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }

  if (b) { pen.btn = b; pointer.pressId = b.id; pen.dx = x; pen.dy = y; return; }
  if (drawingAllowed()) beginStroke(x, y, e.timeStamp);
});
canvas.addEventListener('pointermove', e => {
  const [x, y] = toWorld(e);
  pointer.x = x; pointer.y = y; pointer.hover = true;
  if (e.pointerType === 'mouse') pointer.touch = false;
  if (!pen.down || e.pointerId !== pen.id) return;
  e.preventDefault();
  if (pen.btn) {
    if (dist(x, y, pen.dx, pen.dy) * L.scale < 14) return;
    pen.btn = null; pointer.pressId = null;
    if (!drawingAllowed()) return;
    beginStroke(pen.dx, pen.dy, e.timeStamp - 16);
  }
  if (!pen.drawing) return;
  const evs = typeof e.getCoalescedEvents === 'function' ? e.getCoalescedEvents() : null;
  if (evs && evs.length) for (const ce of evs) { const [cx, cy] = toWorld(ce); addPoint(cx, cy, ce.timeStamp || e.timeStamp); }
  else addPoint(x, y, e.timeStamp);
});
function onUp(e) {

canvas.addEventListener('pointerup', onUp);
canvas.addEventListener('pointercancel', onUp);
canvas.addEventListener('contextmenu', e => e.preventDefault());
for (const ev of ['touchstart', 'touchmove', 'touchend']) canvas.addEventListener(ev, e => { if (ev === 'touchend') Sfx.unlock(); if (e.cancelable) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
window.addEventListener('keydown', e => {
  Sfx.unlock();
  const k = e.key;
  if (k === 'Escape' || k === 'p' || k === 'P') { if (G.screen === 'play') pauseGame(); else if (G.screen === 'pause') resumeGame(); else if (G.screen === 'book') closeBook(); }
  else if (k === 'm' || k === 'M') Sfx.toggle();
  else if (k === 'Enter' && G.screen === 'title' && !Flip.active) startGame(1);
});
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); Sfx.scratchStop(); } });
window.addEventListener('blur', () => { if (pen.drawing) { pen.down = false; endStroke(); } });
let resizeT = null;
function onResize() {
  const oldG = L.groundY;
  computeLayout();
  const dy = L.groundY - oldG;
  placeWizard();
  for (const m of G.monsters) { m.y += dy; if (m.baseY) m.baseY += dy; if (m.fixed) m.x = L.VW * (L.portrait ? 0.78 : 0.74); }
  makeTitleMobs();
}
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(onResize, 80); });
window.addEventListener('orientationchange', () => setTimeout(onResize, 250));

// ---------- loop ----------
function update(dt) {
  updateFlip(dt);
  wiz.t += dt; wiz.castT += dt; wiz.hurtT = Math.max(0, wiz.hurtT - dt * 1.6);
  wiz.blinkT -= dt; if (wiz.blinkT < -0.12) wiz.blinkT = rand(2, 5);
  if (!pen.drawing) {
    const tgt = G.screen === 'play' || G.screen === 'practice' ? nearestN(1, m => alive(m) && !m.fixed)[0] : null;
    const lx = tgt ? tgt.hx : pointer.hover ? pointer.x : wiz.x + 300, ly = tgt ? tgt.hy : pointer.hover ? pointer.y : wiz.y - 70;
    wiz.lookX = lerp(wiz.lookX, lx, Math.min(1, dt * 6)); wiz.lookY = lerp(wiz.lookY, ly, Math.min(1, dt * 6));
  }
  G.shake = Math.max(0, G.shake - dt * 28);
  G.flash = Math.max(0, G.flash - dt * 2.6); G.dim = Math.max(0, G.dim - dt * 0.32); G.manaShake = Math.max(0, (G.manaShake || 0) - dt);
  if (G.hint) { G.hint.t += dt; if (G.hint.t > G.hint.life) G.hint = null; }
  if (!G.hint && G.hintQueue && G.hintQueue.length && G.screen === 'play') G.hint = G.hintQueue.shift();
  if (G.guide) { G.guide.t += dt; if (G.guide.t > 5) G.guide = null; }
  if (pending && !pen.drawing) { pending.t += dt; if (pending.t > 0.4) { const p = pending; pending = null; applyGesture(p.res, p.pts); } }
  let gdt = dt;
  if (G.slow > 0) { G.slow -= dt; gdt = dt * 0.3; }
  if (Flip.active) { updateFx(dt); return; }
  switch (G.screen) {
    case 'play':
      if (G.deathT > 0) updateDeath(dt);
      else { G.mana = Math.min(G.maxMana, G.mana + manaRegen() * gdt); updateWave(gdt); }
      updateCombat(gdt); updateFx(gdt);
      break;
    case 'practice': {
      G.mana = G.maxMana; G.hp = G.maxHp;
      for (const m of G.monsters) if (m.fixed) { m.hp = m.maxHp; m.kb = 0; m.inT = null; m.stun = 0; m.burn = 0; m.lift = 0; m.spin = 0; m.falling = false; m.x = L.VW * (L.portrait ? 0.78 : 0.74); }
      updateCombat(gdt); updateFx(gdt);
      if (!G.monsters.some(m => m.fixed)) { const d = spawnMonster('dummy', { x: L.VW * (L.portrait ? 0.78 : 0.74) }); d.fixed = true; d.hp = d.maxHp = 1e9; }
      break;
    }
    case 'upgrade':
      G.upT += dt;
      if (G.picked != null) { G.pickT += dt; if (G.pickT > 0.7) { startFlip(); G.screen = 'play'; startWave(G.wave + 1); } }
      updateFx(dt);
      break;
    default: updateFx(dt);
  }
}
function drawWizardOrBall() {
  if (wiz.crumple <= 0) { drawWizard(wiz); return; }
  const k = wiz.crumple;
  if (k < 1) {
    ctx.save(); ctx.translate(wiz.x, wiz.y - 50); ctx.rotate(k * 1.2); ctx.scale(1 - 0.6 * k, 1 - 0.6 * k); ctx.translate(-wiz.x, -(wiz.y - 50));
    drawWizard(wiz); ctx.restore();
  } else {
    const t = G.deathT - 0.45;
    const bx = wiz.x + Math.min(40, t * 50), by = wiz.y - 26 - Math.abs(Math.sin(t * 6)) * 30 * Math.max(0, 1 - t);
    paperBall(bx, by, 26, t * 3, ROBE, 77);
  }
}
function drawBattle() {
  if (G.dim > 0) { ctx.fillStyle = `rgba(70,30,110,${0.16 * G.dim})`; ctx.fillRect(0, 0, L.VW, L.VH); }
  drawPatches(false);
  drawGround();
  drawPad();
  drawPageNumber();
  for (const T of G.tornados) drawTornado(T);
  const ms = G.monsters.slice().sort((a, b) => (a.boss ? -1 : b.boss ? 1 : ((a.fly ? 1 : 0) - (b.fly ? 1 : 0)) || (b.x - a.x)));
  for (const m of ms) drawMonster(m);
  drawWizardOrBall();
  drawShieldBubble();
  drawPatches(true);
  drawShots();
  drawFx();
  drawParts();
  drawSplats();
  drawTexts();
}

  const draw = (pts, alpha) => {

  if (pen.drawing && pen.pts.length) {
    draw(pen.pts, 1);
    const p = pen.pts[pen.pts.length - 1];
    glow(p.x, p.y, 24, '#9d7bff', 0.55);
    sparkle(p.x, p.y, 8, '#ffffff', 1, G.t * 8);
  }
}
function render() {
  ctx = mainCtx;
  BTN = [];
  frameNo++; sweepTextCache();
  const S = L.scale * L.dpr;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1;
  ctx.drawImage(paperC, 0, 0);
  const sx = G.shake > 0.3 ? hs(G.t * 91) * G.shake : 0, sy = G.shake > 0.3 ? hs(G.t * 77 + 3) * G.shake : 0;

let lastT = 0;
function frame(now) {

  if (!lastT) lastT = now;
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
  lastT = now;
  G.t += dt;
  BOIL = Math.floor(G.t * 9);

  catch (err) { console.error(err); }
}

// ---------- boot ----------
computeLayout();
placeWizard();
makeTitleMobs();
requestAnimationFrame(frame);
// small hook for automated testing / tinkering from the console
window.ScribbleWizard = { G, L, wiz, Recognizer, startGame, startWave, spawnMonster, castSpell, applyGesture, UPGRADES, applyUpgrade, buttons: () => BTN_LAST.map(b => ({ id: b.id, x: b.x, y: b.y, w: b.w, h: b.h })),
  sim: (sec, dt = 1 / 30) => { const n = Math.round(sec / dt); for (let i = 0; i < n; i++) { G.t += dt; BOIL = Math.floor(G.t * 9); update(dt); } },
  pickUpgrade, retryWave,
  timeFrames: n => { const t0 = performance.now(); for (let i = 0; i < n; i++) { G.t += 1 / 60; BOIL = Math.floor(G.t * 9); update(1 / 60); render(); } return (performance.now() - t0) / n; } };

})();

 ctx.save();ctx.translate(W*.85,y-s*.25);drawCube(ctx,s,1);ctx.restore();ctx.save();ctx.translate(W*.12,y-s*.3);drawStone(ctx,s*.9);ctx.restore()}

function drawParticles(dt){for(const p of particles){p.life-=dt;if(p.scr){p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=clamp(p.life,0,1);ctx.fillStyle=p.col;ctx.fillRect(p.x,p.y,p.r,p.r*1.6)}else{p.x+=p.vx*dt;p.y+=p.vy*dt;ctx.globalAlpha=clamp(p.life*1.5,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(ox+p.x*ts,oy+p.y*ts,p.r*ts,0,TAU);ctx.fill()}}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0)}
// ---------- screens ----------
let state='title',paused=false,mapCh=0;
function show(id){['title','map'].forEach(k=>$(k).classList.toggle('hidden',k!==id));const play=id==='play';['hud','ctl','pauseBtn'].forEach(k=>$(k).classList.toggle('hidden',!play));$('totStars').classList.toggle('hidden',id!=='map');if(!play)$('tip').classList.add('hidden')}
function openMap(){audioInit();state='map';paused=false;$('pause').classList.add('hidden');$('modal').classList.add('hidden');show('map');mapCh=chapterOf(Math.min(G.last+(G.done[G.last]!=null?1:0),LEVELS.length-1));renderMap()}
function tabIcon(c){const cv2=document.createElement('canvas');cv2.width=88;cv2.height=88;const g=cv2.getContext('2d');g.translate(44,48);const s=70;
 if(c===0)drawCritter(g,s,0,2,0);else if(c===1)drawStone(g,s);else if(c===2){g.fillStyle='#1a5a9a';g.beginPath();g.ellipse(0,0,28,26,0,0,TAU);g.fill();g.strokeStyle='#fff';g.lineWidth=4;g.beginPath();g.ellipse(0,0,28,26,0,Math.PI*1.1,Math.PI*1.9);g.stroke()}else if(c===3){g.fillStyle='#ff9a4a';rr(g,-28,-28,56,56,10);g.fill();g.fillStyle='#e8502a';for(let k=0;k<3;k++){rr(g,-21+k*16,-20,9,40,4);g.fill()}}else if(c===4){g.fillStyle='#7a5ad8';rr(g,-28,-28,56,56,8);g.fill();g.fillStyle='#b89aff';for(let k=0;k<3;k++)g.fillRect(-20+k*16,-22,7,44)}else{g.translate(-12,0);drawCritter(g,s*.8,1,1,0);g.translate(24,4);drawCritter(g,s*.8,2,3,0)}return cv2}
function renderMap(){$('totStars').textContent='★ '+totalStars()+' / '+LEVELS.length*3;const c=mapCh;$('chName').textContent=(c+1)+'. '+CHAPTERS[c].nm;
 const tabs=$('tabs');tabs.innerHTML='';for(let k=0;k<6;k++){const b=document.createElement('button');const lock=!unlocked(k*10);b.className='tab'+(k===c?' sel':'')+(lock?' lock':'');b.appendChild(tabIcon(k));if(!lock)b.onclick=()=>{mapCh=k;SFX.click();renderMap()};tabs.appendChild(b)}
 const L=$('lvls');L.innerHTML='';for(let k=0;k<10;k++){const i=c*10+k;const b=document.createElement('button');const lock=!unlocked(i);const st=G.done[i]||0;b.className='lv'+(lock?' lock':'')+(i===G.last?' cur':'');b.innerHTML=lock?'<svg viewBox="0 0 24 24" width="40%"><rect x="5" y="11" width="14" height="10" rx="2" fill="currentColor"/><path d="M8 11V8a4 4 0 018 0v3" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>':(i+1)+'<span class="st">'+'★★★'.slice(0,st)+'<i>'+'★★★'.slice(st)+'</i></span>';if(!lock)b.onclick=()=>{SFX.click();startLevel(i)};L.appendChild(b)}}
function startLevel(i){audioInit();state='play';show('play');loadLevel(i)}
let tipT=null;function showTip(t){const e=$('tip');if(!t){e.classList.add('hidden');return}e.textContent=t;e.classList.remove('hidden');e.style.opacity=1}
function hideTip(){const e=$('tip');if(!e.classList.contains('hidden')&&moves>=2){e.style.opacity=0;setTimeout(()=>e.classList.add('hidden'),400)}}
$('playBtn').onclick=()=>{SFX.click();if(hadSave)openMap();else startLevel(0)};if(hadSave)$('playBtn').textContent='CONTINUE';
$('bMenu').onclick=()=>{SFX.click();openMap()};$('bUndo').onclick=()=>undo();$('bRestart').onclick=()=>restart();
// ---------- input ----------
const KD={ArrowUp:0,w:0,W:0,ArrowRight:1,d:1,D:1,ArrowDown:2,s:2,S:2,ArrowLeft:3,a:3,A:3};
window.addEventListener('keydown',e=>{audioInit();if(e.key in KD){e.preventDefault();if(state==='play')tryMove(KD[e.key]);return}
 if(e.key==='Escape'||e.key==='p'||e.key==='P'){if(state==='play')togglePause();else if(state==='map'){state='title';show('title')}return}
 if(state==='play'){if(e.key==='z'||e.key==='Z'||e.key==='u'||e.key==='U'||e.key==='Backspace')undo();if(e.key==='r'||e.key==='R')restart();if((e.key==='Enter'||e.key===' ')&&!$('modal').classList.contains('hidden')){const n=$('wNext')||$('wMap');if(n)n.click()}}
 else if(state==='title'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();$('playBtn').click()}
 else if(state==='map'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();const i=Math.min(G.done[G.last]!=null?G.last+1:G.last,LEVELS.length-1);if(unlocked(i))startLevel(i)}});
let sw=null;cv.addEventListener('pointerdown',e=>{audioInit();sw={x:e.clientX,y:e.clientY}});
window.addEventListener('pointerup',e=>{if(!sw)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;sw=null;if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;if(Math.abs(dx)>Math.abs(dy))tryMove(dx>0?1:3);else tryMove(dy>0?2:0)});
function togglePause(f){if(state!=='play')return;paused=f!==undefined?f:!paused;$('pause').classList.toggle('hidden',!paused)}
$('pauseBtn').onclick=()=>togglePause(true);$('resumeBtn').onclick=()=>togglePause(false);$('pMap').onclick=()=>openMap();
document.addEventListener('visibilitychange',()=>{if(document.hidden)togglePause(true)});
// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)T+=dt;
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if(state==='play'&&LV){if(!paused){if(anim){anim.t+=dt*13;if(anim.t>=anim.dur)finishAnim()}for(const k in bumpT){bumpT[k].t-=dt}if(fallT>0){fallT-=dt;if(fallT<=0){fallT=0;S=hist.pop();moves--;updHud();showTip('Oops! Holes are deep');setTimeout(()=>{if(moves>=0)hideTip()},1200)}}if(winT>0){winT-=dt;if(winT<=0){winT=0;showWin()}}}
  drawBg();drawBoard();drawObjects();drawParticles(dt)}
 else{drawTitle();drawParticles(dt)}
 requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);
</script></body></html>

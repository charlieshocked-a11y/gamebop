<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Slingstar</title>
<style>
:root{--cream:#fff6e6;--gold:#ffd56b;--gold2:#ff9d4a;--ink:#2a1450;--glass:rgba(22,14,64,.58)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#140f33;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{font-family:"Trebuchet MS","Avenir Next","Segoe UI",Verdana,sans-serif;color:var(--cream)}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
.scr.on{display:block}
svg{display:block}
.btn{pointer-events:auto;font:inherit;font-weight:900;cursor:pointer;border:0;color:#43190a;font-size:20px;line-height:1;padding:12px 26px;
 border-radius:30px 10px 30px 10px;background:linear-gradient(180deg,#fff4c4 0%,#ffd56b 36%,#ff9d4a 100%);
 box-shadow:0 5px 0 #a8452e,0 9px 24px rgba(255,140,80,.42),inset 0 2px 0 rgba(255,255,255,.85),inset 0 -3px 0 rgba(190,70,30,.25);
 text-shadow:0 1px 0 rgba(255,255,255,.6);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
 transition:transform .16s cubic-bezier(.3,1.8,.5,1),box-shadow .1s,filter .1s}
.btn:hover{transform:translateY(-2px) scale(1.045) rotate(-1deg);filter:brightness(1.06)}
.btn:active,.btn.dn{transform:translateY(4px) scale(.96);box-shadow:0 1px 0 #a8452e,0 3px 10px rgba(255,140,80,.4),inset 0 2px 0 rgba(255,255,255,.6);transition-duration:.05s}
.btn.big{font-size:30px;padding:16px 50px;letter-spacing:.5px}
.btn.big::after{content:"";position:absolute;right:-6px;top:-8px;width:20px;height:20px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);animation:twk 1.8s ease-in-out infinite;filter:drop-shadow(0 0 6px #fff)}
.btn.sec{color:#f3eaff;background:linear-gradient(180deg,rgba(132,108,236,.85),rgba(54,36,130,.92));box-shadow:0 4px 0 #1c1050,0 7px 16px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.4);
 text-shadow:0 1px 0 #1c1050;border-radius:10px 24px 10px 24px;font-size:16px;padding:10px 18px}
.btn.sec:active{box-shadow:0 1px 0 #1c1050,inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ico{width:42px;height:42px;padding:0;border-radius:50% 44% 50% 44%;font-size:0}
.btn.ico svg{width:22px;height:22px}
@keyframes twk{0%,100%{transform:scale(.6) rotate(0);opacity:.6}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-7px) rotate(calc(var(--r,0deg)*-1))}}
@keyframes pop{0%{transform:scale(.2);opacity:0}60%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
@keyframes slideUp{0%{transform:translateY(40px) scale(.9);opacity:0}100%{transform:none;opacity:1}}
@keyframes tap{0%,100%{transform:translate(0,0) scale(1)}40%{transform:translate(0,10px) scale(.92)}}
@keyframes ripple{0%{transform:scale(.3);opacity:.9}100%{transform:scale(1.6);opacity:0}}
/* title */
#title .logo{position:absolute;left:50%;top:max(7%,calc(env(safe-area-inset-top) + 18px));transform:translateX(-50%);text-align:center;white-space:nowrap}
.word{font-size:min(12vw,17vh,120px);font-weight:900;font-style:italic;line-height:1;letter-spacing:.01em;position:relative}
.word span{display:inline-block;background:linear-gradient(180deg,#fffbe8 0%,#ffe08a 40%,#ff9a52 78%,#ff6a7a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
 filter:drop-shadow(0 .05em 0 #6b2a6a) drop-shadow(0 .09em 0 #2e1450) drop-shadow(0 0 .25em rgba(255,170,120,.55));animation:bob 2.8s ease-in-out infinite}
.word svg.sw{position:absolute;left:-6%;top:-28%;width:112%;height:150%;pointer-events:none;overflow:visible}
.sub{margin-top:.4em;font-size:min(3.6vw,3.4vh,19px);font-weight:700;letter-spacing:.32em;color:#ffe9d0;opacity:.85;text-transform:uppercase;text-shadow:0 2px 0 #2e1450}
#title .menu{position:absolute;left:50%;bottom:max(9%,calc(env(safe-area-inset-bottom) + 34px));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:min(16px,2.4vh)}
#title .row{display:flex;gap:12px}
#skins{display:flex;gap:8px;pointer-events:auto;padding:5px 10px;border-radius:20px;background:rgba(20,10,60,.35)}
.sk{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.25);cursor:pointer;position:relative;padding:0;background:none}
.sk.on{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.7);transform:scale(1.15)}
.sk.lock{opacity:.4;cursor:default}
.sk .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
#support{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));font-size:11.5px;color:#ffe9f4;opacity:.55;text-decoration:none;pointer-events:auto;letter-spacing:.3px}
#support:hover{opacity:1}
.tmute{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top))}
/* HUD */
#top{position:absolute;left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;gap:6px;align-items:center}
.chip{background:var(--glass);border:1px solid rgba(255,255,255,.16);border-radius:14px 6px 14px 6px;padding:7px 10px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:6px;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.25)}
.chip b{color:#ffe08a}
.chip svg{width:16px;height:16px}
#hWhC.pop{animation:pop .4s}#hWhC.done{box-shadow:0 0 0 2px #ffd56b,0 0 14px rgba(255,213,107,.6)}
#hName{opacity:.85;font-weight:700}
.goal{flex:1;min-width:60px}
.bar{flex:1;height:8px;border-radius:5px;background:rgba(255,255,255,.14);overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px;background:linear-gradient(90deg,#8fe9ff,#ffd56b)}
#top .btn.ico{width:38px;height:38px}
#hint{position:absolute;left:50%;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-weight:800;font-size:16px;transition:opacity .5s;text-shadow:0 2px 4px #000}
.key{display:inline-block;padding:6px 10px;border-radius:7px;background:linear-gradient(#fff,#d8d0f0);color:#2a1450;box-shadow:0 3px 0 #6a5aa0;font-weight:900;font-size:14px;text-shadow:none}
#banner{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 64px);transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .35s,transform .35s}
#banner.on{opacity:1;transform:translateX(-50%) translateY(0)}
#banner .bn{font-size:min(8vw,46px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 3px 0 #2e1450,0 0 20px rgba(255,200,140,.6)}
#banner .bk{font-size:15px;letter-spacing:.3em;font-weight:800;color:#ffe08a;text-shadow:0 2px 0 #2e1450}
#banner .nw{display:inline-flex;align-items:center;gap:8px;margin-top:8px;padding:5px 14px 5px 6px;border-radius:20px;background:rgba(255,213,107,.18);border:1px solid rgba(255,213,107,.5);font-weight:900;color:#fff2c8}
#banner canvas{width:40px;height:40px}
/* panels */
.panel{position:absolute;left:50%;top:50%;translate:-50% -56%;width:min(92vw,440px);padding:20px 20px 22px;text-align:center;pointer-events:auto;
 background:radial-gradient(120% 90% at 30% 0%,rgba(130,100,255,.38),rgba(30,18,80,.0) 60%),linear-gradient(180deg,rgba(44,28,110,.94),rgba(22,12,58,.96));
 border:2px solid rgba(255,220,170,.45);border-radius:34px 12px 34px 12px;box-shadow:0 20px 60px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.25);animation:slideUp .4s cubic-bezier(.2,1.4,.4,1)}
.rt{font-size:min(8vw,36px);font-weight:900;font-style:italic;color:#fff;text-shadow:0 3px 0 #120830}
.stars{display:flex;justify-content:center;gap:10px;margin:12px 0 8px}
.st{width:64px;height:64px;opacity:.25;filter:grayscale(1)}
.st:nth-child(2){transform:translateY(-10px)}
.st.on{opacity:1;filter:drop-shadow(0 0 12px rgba(255,210,100,.8));animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.st.on:nth-child(2){animation-name:pop}
.rows{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.rw{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.25);padding:7px 12px;border-radius:12px;font-size:18px;font-weight:800}
.rw svg{width:18px;height:18px}
.rw small{opacity:.6;font-size:13px}
.rw.ok{box-shadow:inset 0 0 0 2px rgba(255,213,107,.7)}
.near{min-height:22px;margin-top:8px;font-weight:900;color:#ffb0c8;font-size:15px}
.tease{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:10px;padding:8px 14px;border-radius:16px;background:rgba(255,255,255,.07);border:1px dashed rgba(255,255,255,.25)}
.tease small{display:block;letter-spacing:.3em;font-size:11px;opacity:.7;font-weight:800;text-align:left}
.tease b{font-size:20px;color:#fff2c8;font-style:italic}
.tease canvas{width:72px;height:72px;filter:drop-shadow(0 0 8px rgba(255,220,150,.35))}
.unl{margin-top:8px;font-weight:900;color:#a8ffe0;min-height:0}
.rbtns{position:absolute;left:50%;bottom:max(6%,calc(env(safe-area-inset-bottom) + 18px));transform:translateX(-50%);display:flex;gap:12px;align-items:center;pointer-events:auto}
/* levels */
#lvls{background:radial-gradient(120% 90% at 50% 40%,#2a1660,#0c0626 80%)}
#lvls .lhead{position:absolute;left:0;right:0;top:max(12px,env(safe-area-inset-top));display:flex;align-items:center;justify-content:center;gap:12px}
#lvls .lhead .btn{position:absolute;left:max(12px,env(safe-area-inset-left))}
#lvls .lhead b{font-size:min(7vw,32px);font-style:italic;text-shadow:0 3px 0 #120830}
#lStars{position:absolute;right:max(14px,env(safe-area-inset-right));font-weight:900;color:#ffe08a;font-size:17px}
#lgrid{position:absolute;left:50%;top:calc(max(12px,env(safe-area-inset-top)) + 58px);bottom:12px;transform:translateX(-50%);width:min(96vw,640px);overflow-y:auto;pointer-events:auto;padding-bottom:20px;touch-action:pan-y}
.sect{margin:6px 0 4px;font-weight:900;letter-spacing:.25em;font-size:12px;opacity:.8;text-align:left;padding-left:8px}
.nodes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.node{pointer-events:auto;cursor:pointer;border:0;font:inherit;color:#fff;height:78px;border-radius:24px 8px 24px 8px;background:linear-gradient(180deg,#6f58d8,#2c1a78);box-shadow:0 4px 0 #160a40,inset 0 1px 0 rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.node:hover{transform:translateY(-2px) scale(1.04)}.node:active{transform:translateY(3px)}
.node .nn{font-size:22px;font-weight:900}
.node .nm{font-size:10.5px;opacity:.8;font-weight:700;max-width:96%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node .ns{font-size:13px;color:#ffd56b;letter-spacing:1px}
.node.lock{background:linear-gradient(180deg,#2e2460,#1a1240);color:#7d72b0;cursor:default}.node.lock .ns{color:#4a4080}
.node.cur{box-shadow:0 4px 0 #160a40,0 0 0 2px #ffd56b,0 0 18px rgba(255,213,107,.5)}
.node.endl{grid-column:span 4;height:64px;flex-direction:row;gap:14px;background:linear-gradient(90deg,#c8603e,#6a1e5a)}
/* tutorial */
#tCap{position:absolute;left:50%;top:calc(max(8px,env(safe-area-inset-top)) + 62px);transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:22px 8px 22px 8px;background:rgba(255,248,230,.95);color:#2a1450;font-weight:900;font-size:17px;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:background .2s}
#tCap.now{background:#ffd56b;transform:translateX(-50%) scale(1.08)}
#hand{position:absolute;left:50%;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 14px);width:76px;height:76px;margin-left:-38px;animation:tap 1s ease-in-out infinite}
#hand.now{animation-duration:.35s}
#hand::before{content:"";position:absolute;left:14px;top:-4px;width:30px;height:30px;border-radius:50%;border:3px solid #ffd56b;animation:ripple 1s ease-out infinite}
#bSkip{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:max(14px,calc(env(safe-area-inset-bottom) + 10px))}
#pause .panel .btn.big{margin:14px 0}
#pause .row{display:flex;gap:10px;justify-content:center}
@media (max-width:560px){#banner .bn{font-size:30px}#banner{width:92vw}#hName{display:none}.chip{padding:6px 8px;font-size:14px}#top{gap:4px}.btn.big{font-size:26px;padding:14px 40px}.st{width:54px;height:54px}}
@media (max-height:430px){#title .menu{gap:8px}.btn.big{font-size:24px;padding:12px 38px}.btn.sec:not(.ico){padding:8px 14px;font-size:14px}#skins{display:none}.panel{translate:-50% -58%;scale:.82}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="title" class="scr on">
 <div class="logo">
  <div class="word"><svg class="sw" viewBox="0 0 100 40" preserveAspectRatio="none"><defs><linearGradient id="swg" x1="0" x2="1"><stop offset="0" stop-color="#8fe9ff" stop-opacity="0"/><stop offset=".7" stop-color="#bff4ff" stop-opacity=".8"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><path d="M2 34 Q 40 6 96 8" fill="none" stroke="url(#swg)" stroke-width="1.6" stroke-linecap="round"/><circle cx="96" cy="8" r="1.8" fill="#fff"/></svg><span style="--r:-3deg;animation-delay:0s">S</span><span style="--r:2deg;animation-delay:.1s">l</span><span style="--r:-2deg;animation-delay:.2s">i</span><span style="--r:3deg;animation-delay:.3s">n</span><span style="--r:-2deg;animation-delay:.4s">g</span><span style="--r:2deg;animation-delay:.5s">s</span><span style="--r:-3deg;animation-delay:.6s">t</span><span style="--r:2deg;animation-delay:.7s">a</span><span style="--r:-2deg;animation-delay:.8s">r</span></div>
  <div class="sub">one tap &middot; whip &middot; catch</div>
 </div>
 <div class="menu">
  <button id="bPlay" class="btn big"><svg viewBox="0 0 24 24" width="26" height="26"><path d="M7 4l13 8-13 8z" fill="#43190a"/></svg><span id="playTxt">Play</span></button>
  <div class="row"><button id="bLevels" class="btn sec">Routes</button><button id="bHow" class="btn sec">How to play</button></div>
  <div id="skins"></div>
 </div>
 <button class="btn sec ico tmute mute" aria-label="mute"></button>
 <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="lvls" class="scr">
 <div class="lhead"><button id="bBack" class="btn sec">&#9664;</button><b>Star Routes</b><span id="lStars"></span></div>
 <div id="lgrid"></div>
</div>

<div id="hud" class="scr">
 <div id="top">
  <div class="chip"><b id="hNum">1</b><span id="hName"></span></div>
  <div class="chip goal"><svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" fill="#ffd56b"/></svg><div class="bar"><i id="hBar"></i></div><span id="hAst"></span></div>
  <div class="chip" id="hWhC"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#fffbe6" stroke="#ffb43a" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="hWh">0/1</b></div>
  <div class="chip"><svg viewBox="0 0 24 24"><path d="M12 1C13 9 15 11 23 12 15 13 13 15 12 23 11 15 9 13 1 12 9 11 11 9 12 1Z" fill="#fff2b0"/></svg><b id="hDust">0</b></div>
  <div class="chip" id="hTimeC"><b id="hTime">0.0</b></div>
  <button id="bRe" class="btn sec ico" aria-label="restart"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M3 4l2.6 6 5.6-3z" fill="#fff"/></svg></button>
  <button id="bPause" class="btn sec ico" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#fff"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#fff"/></svg></button>
 </div>
 <div id="hint"><span class="key">Space</span><span>/</span><span class="key">Tap</span><span>let go</span></div>
 <div id="banner"><div class="bk" id="bnNum"></div><div class="bn" id="bnName"></div><div class="nw" id="bnNew"><canvas id="bnIco" width="80" height="80"></canvas><span id="bnNewT"></span></div></div>
</div>

<div id="tut" class="scr">
 <div id="tCap"><span class="key">Space</span><span class="key">Tap</span><span id="tTxt">when the line turns gold</span></div>
 <div id="hand"><svg viewBox="0 0 64 64" width="76" height="76"><g fill="#fff" stroke="#2a1450" stroke-width="3" stroke-linejoin="round"><rect x="24" y="4" width="13" height="34" rx="6.5"/><path d="M14 30c0-5 7-6 9-2V27h0c1-5 9-5 10 0 1-4 9-4 10 1 1-3 8-3 8 3v12c0 9-6 16-16 16h-4c-9 0-14-6-17-12l-6-10c-2-4 3-7 6-4z"/></g></svg></div>
 <button id="bSkip" class="btn sec">Skip &#9654;&#9654;</button>
</div>

<div id="pause" class="scr">
 <div class="panel"><div class="rt">Paused</div>
  <button id="bResume" class="btn big">Resume</button>
  <div class="row"><button id="bRestart" class="btn sec">Restart</button><button id="bQuit" class="btn sec">Menu</button><button class="btn sec ico mute" aria-label="mute"></button></div>
 </div>
</div>

<div id="res" class="scr">
 <div class="panel" id="rPanel">
  <div class="rt" id="rTitle">Route clear!</div>
  <div class="stars"><svg class="st" id="s1" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" fill="#ffd56b" stroke="#a8452e" stroke-width="1"/></svg><svg class="st" id="s2" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" fill="#ffd56b" stroke="#a8452e" stroke-width="1"/></svg><svg class="st" id="s3" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7-6.2-3.8-6.2 3.8 1.6-7L2 9.2l7.1-.6z" fill="#ffd56b" stroke="#a8452e" stroke-width="1"/></svg></div>
  <div class="rows">
   <div class="rw" id="rwT"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M12 13V8M9 2h6" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg><b id="rTime">0.0s</b><small id="rPar"></small></div>
   <div class="rw" id="rwW"><svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z" fill="#fffbe6" stroke="#ffb43a" stroke-width="1.5" stroke-linejoin="round"/></svg><b id="rWh">0</b><small id="rWhN"></small></div>
   <div class="rw" id="rwD"><svg viewBox="0 0 24 24"><path d="M12 1C13 9 15 11 23 12 15 13 13 15 12 23 11 15 9 13 1 12 9 11 11 9 12 1Z" fill="#fff2b0"/></svg><b id="rDust">0</b><small id="rDustN"></small></div>
  </div>
  <div class="near" id="rNear"></div>
  <div class="unl" id="rUnl"></div>
  <div class="tease" id="rTease"><canvas id="tIco" width="116" height="116"></canvas><div><small>NEXT</small><b id="tTxtN"></b></div></div>
 </div>
 <div class="rbtns"><button id="bRetry" class="btn sec ico" aria-label="retry"><svg viewBox="0 0 24 24"><path d="M12 5a7 7 0 1 1-6.6 4.7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/><path d="M3 4l2.6 6 5.6-3z" fill="#fff"/></svg></button><button id="bNext" class="btn big"><span id="nextTxt">Next</span><svg viewBox="0 0 24 24" width="24" height="24"><path d="M7 4l13 8-13 8z" fill="#43190a"/></svg></button><button id="bMenu2" class="btn sec ico" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg></button></div>
</div>

<script>
'use strict';
(function(){
const $=id=>document.getElementById(id);
const cv=$('cv');

const TAU=Math.PI*2;

function tone(f,dur,o){
 if(!AC)return;o=o||{};const t=AC.currentTime+(o.d||0);
 const os=AC.createOscillator();os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);
 if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
 os.detune.value=o.det||0;
 const g=AC.createGain();const v=o.v||.15;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.a||.006));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 os.connect(g);g.connect(o.bus||FX);
 if(o.echo){const e=AC.createGain();e.gain.value=o.echo;g.connect(e);e.connect(ECHO)}
 os.start(t);os.stop(t+dur+.05);
}
function noise(dur,o){

 s.connect(f);f.connect(g);g.connect(FX);if(o.echo){const e=AC.createGain();e.gain.value=o.echo;g.connect(e);e.connect(ECHO)}

/* ---------- physics ---------- */
function flareX(t){const f=L.flare;return f.on?f.base+f.sp*(t-f.t0):f.base}
function accel(x,y,t){
 AX=0;AY=0;
 for(const b of L.grav){bpos(b,t);const dx=PX-x,dy=PY-y;let d2=dx*dx+dy*dy;if(d2>810000)continue;const mn=b.cz*b.cz;if(d2<mn)d2=mn;const d=Math.sqrt(d2);const a=1500*b.r*b.r/d2;AX+=dx/d*a;AY+=dy/d*a}
 for(const h of L.holes){const dx=h.x-x,dy=h.y-y;const d2=dx*dx+dy*dy;const d=Math.sqrt(d2)||1;const a=3.1e7*h.m/(d2+500);AX+=dx/d*a;AY+=dy/d*a}
 for(const w of L.worms){const dx=w.x-x,dy=w.y-y;const d2=dx*dx+dy*dy;if(d2>90000||d2<400)continue;const d=Math.sqrt(d2);const a=5e6/d2;AX+=dx/d*a;AY+=dy/d*a}
}
const FS={x:0,y:0,vx:0,vy:0,ft:0,wc:0,from:null};
// returns 0 none,1 capture,2 wormhole,3 hole,4 rock,5 flare
function flyStep(s,t,h){
 accel(s.x,s.y,t);s.vx+=AX*h;s.vy+=AY*h;s.x+=s.vx*h;s.y+=s.vy*h;s.ft+=h;
 if(s.wc>0)s.wc-=h;else for(const w of L.worms){const dx=s.x-w.x,dy=s.y-w.y;if(dx*dx+dy*dy<2304){const sp=Math.hypot(s.vx,s.vy)||1;s.x=w.x2+dx+s.vx/sp*40;s.y=w.y2+dy+s.vy/sp*40;s.wc=.5;EV_B=w;return 2}}
 let best=null,bq=1;
 for(const b of L.bodies){if(b===s.from&&s.ft<.45)continue;bpos(b,t);const dx=s.x-PX,dy=s.y-PY;const q=(dx*dx+dy*dy)/(b.cz*b.cz);if(q<bq){bq=q;best=b}}
 if(best){EV_B=best;return 1}
 for(const hh of L.holes){const dx=s.x-hh.x,dy=s.y-hh.y;if(dx*dx+dy*dy<hh.hr*hh.hr){EV_B=hh;return 3}}
 if(!(PREDICTING&&L.diff>=1))for(const k of L.rocks){rpos(k,t);const dx=s.x-PX,dy=s.y-PY,rr=k.r*.78+4;if(dx*dx+dy*dy<rr*rr){EV_B=k;return 4}}

}
let PREDICTING=false;
function predict(vx,vy,steps){PREDICTING=true;try{return predict0(vx,vy,steps)}finally{PREDICTING=false}}
function predict0(vx,vy,steps){
 FS.x=C.x;FS.y=C.y;FS.vx=vx;FS.vy=vy;FS.ft=0;FS.wc=0;FS.from=C.body;
 let t=T,n=0;PRX[n]=FS.x;PRY[n]=FS.y;n++;steps=steps||312;
 for(let i=0;i<steps;i++){
  t+=HS;const e=flyStep(FS,t,HS);
  if(e===2){PRX[n]=NaN;PRY[n]=NaN;n++;PRX[n]=FS.x;PRY[n]=FS.y;n++;continue}
  if((i&1)===0||e){PRX[n]=FS.x;PRY[n]=FS.y;n++}
  if(e===1){const b=EV_B;bpos(b,t);bvel(b,t);const rx=FS.x-PX,ry=FS.y-PY,vx2=FS.vx-VX,vy2=FS.vy-VY;const miss=Math.abs(rx*vy2-ry*vx2)/(Math.hypot(vx2,vy2)||1);
   return{r:1,b,n,miss:miss/b.cz,t:i*HS}}
  if(e>=3)return{r:e,n,b:null};
  if(Math.abs(FS.x-C.x)>2400)break;
 }

}
function releaseVel(){const b=C.body;const tx=-Math.sin(C.ang)*C.dir,ty=Math.cos(C.ang)*C.dir;bvel(b,T);return[tx*b.launch+VX,ty*b.launch+VY]}
function good(res){return res.r===1&&res.b!==C.body}

/* ---------- actions ---------- */
function release(){

  const maxA=(L.tut&&L.tut.step<2?24:[13,7,4][L.diff||0]+Math.min(C.fails||0,4)*2.5)*Math.PI/180;let found=null;
  for(let k=1;k<=12&&!found;k++)for(const sg of[1,-1]){const a=sg*maxA*k/12,c=Math.cos(a),s=Math.sin(a);const v2x=vx*c-vy*s,v2y=vx*s+vy*c;const r2=predict(v2x,v2y);if(good(r2)){found={vx:v2x,vy:v2y,res:r2};break}}

 }
 const b=C.body;
 C.state='fly';C.vx=vx;C.vy=vy;C.ft=0;C.wc=0;C.from=b;C.lastOt=C.ot;C.flightId++;C.target=good(res)?res.b:null;

 C.pflight=false;if(C.perfect){C.pflight=true;let bo=1.45;for(const m of[1.45,1.3,1.15]){const r2=predict(vx*m,vy*m);if(good(r2)&&r2.b===res.b){bo=m;res=r2;break}bo=1}vx*=bo;vy*=bo;C.vx=vx;C.vy=vy;C.target=res.b}
 if(C.perfect&&!L.demo){C.pstreak=(C.pstreak||0)+1;SFX.whip(C.pstreak);slow(.14,.35);shake(.3);flash(.18,'#ffffff');cam.kick=-.04;ringBurst(C.x,C.y,30,'#ffffff',.7);
  for(let i=0;i<22;i++){const u=rnd(.2,1.4);part(C.x-vx*.06*u+rnd(-16,16),C.y-vy*.06*u+rnd(-16,16),vx*.5,vy*.5,rnd(.2,.4),rnd(2,3.5),i%2?'#ffffff':'#fff2b0',{k:3,drag:3})}
  floatT(C.x,C.y-30,'WHIP!','#ffffff',30);flash(.45,'#fffbe6');screenBurst(C.x,C.y,46);
  if(!SAVE.fw){SAVE.fw=1;save();C.dust+=10;bigText('FIRST WHIP!',1.6);slow(.5,.25);screenBurst(C.x,C.y,90);for(let i=0;i<60;i++){const a=rnd(0,TAU),sp=rnd(150,520);part(C.x,C.y,Math.cos(a)*sp,Math.sin(a)*sp,rnd(.8,1.6),rnd(3,6),SKC[i%6],{k:1,g:220,drag:.9})}}
 }else if(!L.demo)C.pstreak=0;
 bpos(b,T);L.whip={x:PX,y:PY,r:C.rad,a:C.ang,dir:C.dir,t:0,b};
 for(let i=0;i<8;i++){const u=rnd(.2,1);part(C.x-vx*.05*u+rnd(-8,8),C.y-vy*.05*u+rnd(-8,8),vx*.35,vy*.35,rnd(.15,.3),rnd(1.5,2.5),'#ffffff',{k:3,drag:4})}
 C.csv+=12;b.sqv-=3;cam.kick=Math.min(cam.kick,-.02);
 if(L.flare&&!L.flare.on){L.flare.on=true;L.flare.t0=T;SFX.flare()}
 const sp=Math.hypot(vx,vy);
 SFX.release(sp/540);
 shake(.08+(b.spin?.12:0));
 for(let i=0;i<14;i++){const a=Math.atan2(-vy,-vx)+rnd(-.7,.7);const s=rnd(60,240);part(C.x,C.y,Math.cos(a)*s,Math.sin(a)*s,rnd(.25,.5),rnd(2,4.5),skinCol(Math.random()),{drag:3})}

}
function perfQ(c){return c.perfect&&c.body!==c.from}
function capture(b){
 const c=C;bpos(b,T);const bx=PX,by=PY;bvel(b,T);const rx=c.x-bx,ry=c.y-by,vx=c.vx-VX,vy=c.vy-VY;const d=Math.hypot(rx,ry)||1;const cr=rx*vy-ry*vx;
 const back=b===c.from;

/* ---------- fx update ---------- */
function updateFX(dt,sdt){
 for(let i=PS.length-1;i>=0;i--){const p=PS[i];p.life-=sdt;if(p.life<=0){PS.splice(i,1);continue}p.vx+=p.g*GVX*sdt;p.vy+=p.g*GVY*sdt;const dr=Math.exp(-p.drag*sdt);p.vx*=dr;p.vy*=dr;p.x+=p.vx*sdt;p.y+=p.vy*sdt;p.rot+=p.vr*sdt}
 for(let i=TXT.length-1;i>=0;i--){const t=TXT[i];t.t+=dt;if(t.t>t.max)TXT.splice(i,1)}
 cam.shake=Math.max(0,cam.shake-dt*2.2);cam.kick*=Math.exp(-dt*9);flashA=Math.max(0,flashA-dt*2.4);
 if(!L)return;
 // springs
 C.csv+=(-C.cs*220-C.csv*14)*dt;C.cs+=C.csv*dt;
 C.blink-=dt;if(C.blink<0)C.blink=rnd(2,4.5);
 for(const b of L.bodies){b.sqv+=(-b.sq*320-b.sqv*7)*dt;b.sq+=b.sqv*dt;
  b.spinPh+=dt*(b.spin?4:.35);b.wakeT+=dt;b.waveT+=dt;if(b.shock>0)b.shock-=dt;
  b.blink-=dt;if(b.blink<0){b.blinkT=.12;b.blink=rnd(2,5)}if(b.blinkT>0)b.blinkT-=dt;
  if(b.bub){b.bub.t+=dt;if(b.bub.t>2.2)b.bub=null}}
 for(const a of L.astros)if(a.bub){a.bub.t+=dt;if(a.bub.t>2.2)a.bub=null}
 if(dustChainT>0)dustChainT-=dt;
 if(L.bark&&screen==='play'){L.bark.t+=dt;if(L.bark.t>.6&&!L.bark.done){L.bark.done=1;bubble(L.bodies[0],L.bark.txt)}}
 // whale
 L.whaleT-=dt;if(!L.whale&&L.whaleT<=0){L.whale={x:W+260,y:H0*rnd(.25,.6),a:0};SFX.whale()}
 if(L.whale){const w=L.whale;w.x-=dt*Math.min(W,H0)*.09;w.a=Math.min(1,w.a+dt*.5);if(w.x<-300){L.whale=null;L.whaleT=rnd(40,70)}}
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0,rt=0;
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-last)/1000;last=now;if(!(dt>0))dt=0;if(dt>.05)dt=.05;
 if(paused){render(rt,0);return}
 rt+=dt;
 let sdt=0;
 if(L){
  if(hitstop>0){hitstop-=dt;sdt=dt*.25}
  else{
   if(slowT>0){slowT-=dt;timeScale+=(slowS-timeScale)*Math.min(1,dt*14)}else timeScale+=(1-timeScale)*Math.min(1,dt*6);
   acc+=dt*timeScale;let n=0;while(acc>=HS&&n<12){step(HS);acc-=HS;n++}if(n>=12)acc=0;sdt=dt*timeScale;
  }
  if(C.state==='orbit'&&!L.won){const [vx,vy]=releaseVel();PRED=predict(vx,vy)}else PRED.n=0;
  if(L.demo)demoBot(dt);
  if(L.won){L.winT+=dt;if(L.winT>1.5&&!L.resShown){L.resShown=true;if(L.demo){setTimeout(()=>{if(L&&L.demo)startDemo()},0)}else showResults()}}
  if(L.tut)tutUpdate(dt);
 }
 updateFX(dt,sdt);
 if(L)camUpdate(dt);
 render(rt,dt);
 if(screen==='play')hud();
 if(AC)music();
}

}

/* ---------- input ---------- */
function onAction(){
 audioInit();
 if(screen==='play'){if(paused){resume();return}if(L&&L.won)return;release();return}
 if(screen==='res'){next();return}
 if(screen==='title'){playMain();return}
}
function playMain(){
 SFX.ui();
 if(!tutDone&&!(SAVE.u>0)){startLevel(0,true);return}
 const i=Math.min(SAVE.u,LV.length-1);
 // continue from first level without stars from progress
 startLevel(i);
}
window.addEventListener('pointerdown',e=>{
 if(e.target.closest&&e.target.closest('button,a,#lgrid'))return;
 audioInit();
 if(screen==='play'){e.preventDefault();if(paused)return;release()}
},{passive:false});
window.addEventListener('keydown',e=>{
 const k=e.key;
 if(k===' '||k==='Enter'||k==='ArrowUp'||k==='w'||k==='W'){e.preventDefault();if(e.repeat)return;
  if(screen==='play'&&paused&&k!==' ')return;onAction();return}
 if(k==='Escape'||k==='p'||k==='P'){if(screen==='play'){paused?resume():pauseGame()}else if(screen==='lvls'){SFX.ui();toTitle()}return}
 if(k==='r'||k==='R'){if(screen==='play'&&!paused||screen==='res'){retry()}return}
 if(k==='m'||k==='M'){audioInit();setMute(!muted);return}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden){pauseGame();save()}});
window.addEventListener('pagehide',()=>save());
window.addEventListener('blur',()=>{pauseGame()});
const btn=(id,f)=>{$(id).addEventListener('click',e=>{e.stopPropagation();audioInit();f(e)})};
btn('bPlay',()=>playMain());
btn('bLevels',()=>{SFX.ui();showLevels()});
btn('bHow',()=>{SFX.ui();startLevel(0,true)});
btn('bBack',()=>{SFX.ui();toTitle()});
btn('bPause',()=>{SFX.ui();pauseGame()});
btn('bRe',()=>{SFX.ui();retry()});
btn('bResume',()=>{SFX.ui();resume()});
btn('bRestart',()=>{SFX.ui();paused=false;retry()});
btn('bQuit',()=>{SFX.ui();paused=false;if(AC)AC.resume().catch(()=>{});toTitle()});
btn('bNext',()=>next());
btn('bRetry',()=>{SFX.ui();retry()});
btn('bMenu2',()=>{SFX.ui();toTitle()});
btn('bSkip',()=>{SFX.ui();tutDone=true;sset('tut',true);endTut();show('hud');if(L)L.slow=LV[0].slow||1});
document.querySelectorAll('.mute').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();audioInit();setMute(!muted);SFX.ui()}));
document.querySelectorAll('.btn').forEach(b=>{b.addEventListener('pointerdown',()=>b.classList.add('dn'));['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>b.classList.remove('dn')))});

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H0=window.innerHeight;ROT=H0>W*1.15;ROTA=ROT?Math.PI/2:0;GVX=ROT?-1:0;GVY=ROT?0:1;cv.width=Math.round(W*DPR);cv.height=Math.round(H0*DPR);nebSec=-1}
window.addEventListener('resize',resize);
resize();drawMuteBtns();refreshTitle();startDemo();
// debug hook for automated tests
window.__ss={get:()=>({screen,paused,state:C.state,body:C.body?L.bodies.indexOf(C.body):-1,lock:(PRED.r===1&&PRED.b!==C.body)?L.bodies.indexOf(PRED.b):-1,sweet:!!(PRED.r===1&&PRED.b!==C.body&&PRED.miss<PERF),level:L?L.idx:-1,won:L?L.won:false,time:L?L.time:0,deaths:L?L.deaths:0,dust:C.dust,tut:!!(L&&L.tut),combo:C.combo,score:L?L.score:0})};
requestAnimationFrame(t=>{last=t;frame(t)});
})();
</script>

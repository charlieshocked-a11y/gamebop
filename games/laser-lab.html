function frame(now){var rdt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;var dt=rdt;if(slowT>0){slowT-=rdt;dt*=.3}if(hitStop>0){hitStop-=rdt;dt=0}
 T+=rdt;cx.setTransform(DPR,0,0,DPR,0,0);drawBG();flash=Math.max(0,flash-rdt*3);robo.rec=Math.max(0,robo.rec-rdt*5);if(robo.sayT>0)robo.sayT-=rdt;if(robo.moodT>0)robo.moodT-=rdt;

function kbMove(dx,dy){kbOn=true;if(!inB(L,kbK))kbK="0,0";var p=PK(kbK),cand;
 if(dx){cand=[K(p[0]+dx,p[1])];var pk=hpos(cand[0]);kbX=pk[0]}else{cand=dy<0?[K(p[0],p[1]-1),K(p[0]+1,p[1]-1)]:[K(p[0]-1,p[1]+1),K(p[0],p[1]+1)];cand=cand.filter(function(k){return inB(L,k)});cand.sort(function(a,b){return Math.abs(hpos(a)[0]-kbX)-Math.abs(hpos(b)[0]-kbX)})}
 cand=cand.filter(function(k){return inB(L,k)});if(cand.length){kbK=cand[0];SFX.tick(2)}if(dx)kbX=hpos(kbK)[0];updPrev()}

 if(scene!=="play"||paused||!L)return;idleT=0;
 if(k==="arrowleft"||k==="a"){kbMove(-1,0);e.preventDefault()}else if(k==="arrowright"||k==="d"){kbMove(1,0);e.preventDefault()}else if(k==="arrowup"||k==="w"){kbMove(0,-1);e.preventDefault()}else if(k==="arrowdown"||k==="s"){kbMove(0,1);e.preventDefault()}
 else if(k===" "||k==="enter"){e.preventDefault();if(!kbOn){kbOn=true;updPrev();return}doTurn(kbK)}
 else if(k==="x"||k==="shift"||k==="tab"){e.preventDefault();doSwap()}else if(k==="z"||k==="backspace"){e.preventDefault();undo()}else if(k==="r"&&L.mode!=="tut"){if(L.mode==="endless")startEndless();else startLevel(L.cfg.n)}
 else if(k==="1")useTool("tH");else if(k==="2")useTool("tS");else if(k==="3")useTool("tB")});

// ---------- surprises ----------
function catchGold(){var g=goldBee;goldBee=null;save.coins+=8;persist();SFX.gold();burst(g.x,g.y,["#ffd84d","#fff"],24,240,{sh:"s"});floatT("+8 honey!",g.x,g.y-24,"#ffd84d",24);beeSay("Golden bee!","cheer")}
function updSurprises(dt){
 if(scene==="play"&&!paused){goldNext-=dt;if(goldNext<=0&&!goldBee){goldNext=50+Math.random()*40;var fromL=Math.random()<.5;goldBee={x:fromL?-40:W+40,y:H*(.14+Math.random()*.2),vx:fromL?150:-150,t:0}}
  ladyNext-=dt;if(ladyNext<=0&&!ladyb&&L){ladyNext=40+Math.random()*30;ladyb={a:Math.random()*6.28,t:0,fly:0,x:0,y:0}}}
 if(goldBee){var g=goldBee;g.t+=dt;g.x+=g.vx*dt;g.y+=Math.sin(g.t*4)*40*dt;if(g.x<-80||g.x>W+80)goldBee=null;else{cx.save();cx.shadowColor="#fff2a0";cx.shadowBlur=20;drawBug(cx,g.x,g.y,22,{kind:"bee",body:"#ffe066",stripe:"#c88a00",face:g.vx>0?1:-1,mood:"cheer",flapS:60});cx.restore();if(Math.random()<.3)parts.push({x:g.x,y:g.y,vx:0,vy:20,l:.5,ml:.5,c:"#fff6a0",r:2,g:0,sh:"s",rot:0})}}
 if(ladyb&&L&&scene==="play"){var lb=ladyb;lb.t+=dt;if(!lb.fly){lb.a+=dt*.25;var rad=S*(L.R*1.73+1.15);lb.x=OX+Math.cos(lb.a)*rad;lb.y=OY+Math.sin(lb.a)*rad*.92;if(lb.t>14)lb.fly=1}else{lb.y-=dt*240;lb.x+=Math.sin(lb.t*8)*3}
  cx.save();cx.translate(lb.x,lb.y);cx.rotate(lb.fly?Math.sin(lb.t*20)*.3:lb.a+Math.PI);var s=9;cx.fillStyle="#2a1400";cx.beginPath();cx.arc(s*.9,0,s*.5,0,7);cx.fill();cx.fillStyle="#e8302a";cx.beginPath();cx.ellipse(0,0,s,s*.85,0,0,7);cx.fill();cx.strokeStyle="#2a1400";cx.lineWidth=1.5;cx.beginPath();cx.moveTo(-s,0);cx.lineTo(s,0);cx.stroke();cx.fillStyle="#2a1400";[[-.4,-.4],[.3,-.45],[-.35,.4],[.35,.42]].forEach(function(p){cx.beginPath();cx.arc(p[0]*s,p[1]*s,s*.17,0,7);cx.fill()});cx.restore();if(lb.y<-30)ladyb=null}}

// ---------- title ----------
function drawTitle(){var s=Math.min(W/9.5,H/8,72),cy=H*.16+s*.4,word=["BEE","MERGE"],vals=[1,2,3,4,5,6,7,8];
 for(var row=0;row<2;row++){var wd=word[row];for(var i=0;i<wd.length;i++){var x=W/2+(i-(wd.length-1)/2)*s*1.62,y=cy+row*s*1.72+(i%2?s*.3:0)+Math.sin(T*2.2+i+row)*4,v=vals[(i+row*3+Math.floor(T*.7))%8],col=vcol(v);
  cx.save();cx.translate(x,y);var bump=Math.max(0,Math.sin(T*3-i*.6-row*2))*.06;cx.scale(1+bump,1-bump);cx.fillStyle="rgba(60,25,0,.3)";hexPath(cx,0,s*.12,s*.95,s*.22);cx.fill();var g=cx.createLinearGradient(0,-s,0,s);g.addColorStop(0,shade(col,.35));g.addColorStop(1,shade(col,-.2));cx.fillStyle=g;hexPath(cx,0,0,s*.95,s*.22);cx.fill();cx.fillStyle="rgba(255,255,255,.35)";cx.beginPath();cx.ellipse(-s*.15,-s*.5,s*.42,s*.16,-.25,0,7);cx.fill();
  txt(cx,wd[i],0,s*.08,s*1.0,"#fff","center",shade(col,-.55));cx.restore()}}
 var bx=W/2+Math.cos(T*.9)*Math.min(W*.32,300),by=cy+s*.9+Math.sin(T*1.8)*s*1.2;drawBug(cx,bx,by,Math.max(30,s*.6),{kind:"bee",face:-Math.sin(T*.9)>=0?1:-1,mood:"cheer",flapS:50});
 if(Math.random()<.2)parts.push({x:bx,y:by,vx:0,vy:10,l:.6,ml:.6,c:"rgba(255,230,120,.8)",r:3,g:0,sh:"c",rot:0});
 // hive deco
 var hy=H*.86,hs=Math.min(34,W/20);if(H>=560)for(var j=-3;j<=3;j++){var v2=((j+3)*2+Math.floor(T))%9+1;drawTile(W/2+j*hs*1.75,hy+(j%2?hs*.5:0),hs,v2,{seed:j,mood:"idle"})}}
function drawIntro(dt){if(!introCard)return;var ic=introCard;ic.t+=dt;var u=ic.t,a=u<.3?easeBack(u/.3):1,al=u>2.6?Math.max(0,1-(u-2.6)/.4):1;if(u>3){introCard=null;return}
 var w=Math.min(360,W-30),h=100,x=W/2-w/2,y=OY-h/2-S*.5;cx.save();cx.globalAlpha=al;cx.translate(W/2,y+h/2);cx.scale(a,a);cx.translate(-W/2,-(y+h/2));panelBG(cx,x,y,w,h);var old=cx;var f=ic.f;
 var ix=x+50,iy=y+h/2;if(featIcon(cx,f,ix,iy,30)){}else if(f==="boss"){var bl=BOSSLOOK[L.boss.kind];drawBug(cx,ix,iy,30,{kind:bl.kind,body:bl.body,stripe:bl.stripe,crown:bl.crown,angry:1})}else if(f==="flower")drawFlower(cx,ix,iy,24,T);else if(f==="ice"||f==="ice2")drawTile(ix,iy,30,3,{ice:f==="ice2"?2:1});else if(f==="hornet")drawHornet(cx,ix,iy,40,T,null);else if(f==="rock"||f==="crack")drawRock(cx,ix,iy,30,f==="crack");else if(f==="wild")drawTile(ix,iy,30,-1,{});else if(f==="bomb")drawBomb(cx,ix,iy,30);else if(f==="wind")drawWindIcon(ix,iy,24,3);else drawTile(ix,iy,30,f==="r3"?6:1,{mood:"happy"});
 txt(cx,"NEW!",x+94,y+30,16,"#e8452c");txt(cx,f==="boss"?BOSSN[L.boss.kind]:FEAT[f][0],x+94,y+60,f==="boss"?22:20,"#5a2e00");cx.restore()}

// ---------- main loop ----------
var last=performance.now();
function frame(now){var rdt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;var dt=rdt;
 if(slowT>0){slowT-=rdt;dt*=.35}if(hitStop>0){hitStop-=rdt;dt=0}
 T+=rdt;cx.setTransform(DPR,0,0,DPR,0,0);drawBG();
 if(bee.sayT>0)bee.sayT-=rdt;if(bee.moodT>0)bee.moodT-=rdt;bee.sq*=Math.pow(.02,rdt);for(var pk in popT){if(popT[pk]>0)popT[pk]=Math.max(0,popT[pk]-rdt*4)}for(var ck in cardPop)cardPop[ck]=Math.max(0,cardPop[ck]-rdt*3);
 bossFx.flash=Math.max(0,bossFx.flash-rdt*4);bossFx.hurtT=Math.max(0,bossFx.hurtT-rdt);bossFx.throwT=Math.max(0,bossFx.throwT-rdt*2);qAnim=Math.min(1,qAnim+rdt*5);
 if(scene==="title")drawTitle();
 if(L&&(scene==="play"||scene==="won"||scene==="lost")){
  if(!paused&&scene==="play"){idleT+=rdt;if(L.rush&&!Tut.isOn()&&!introCard){L.rush.t-=rdt;if(L.rush.t<=0&&!cur&&!STEPS.length){L.rush.t=0;turnDone()}else if(L.rush.t<=5&&Math.floor(L.rush.t*2)!==Math.floor((L.rush.t+rdt)*2))SFX.tick(5)}}
  if(!paused){var guard=0;while(guard++<8){if(!cur&&STEPS.length){cur=STEPS.shift();cur.t=0;cur.dur=durOf(cur);fxStart(cur)}if(!cur)break;var sp=(STEPS.length>4?2.2:1)*(buffer!=null?2:1);cur.t+=dt*sp;if(cur.t>=cur.dur){fxEnd(cur);view=cur.view;cur=null;if(!STEPS.length){turnDone();break}}else break;dt=0}}
  var sx=0,sy=0;if(shake>0){sx=(Math.random()-.5)*shake;sy=(Math.random()-.5)*shake;shake=Math.max(0,shake-rdt*45)}
  cx.save();cx.translate(sx,sy);drawBoard();if(shimmer>0&&L){var su=1-shimmer;cx.save();cx.globalCompositeOperation="lighter";L.cells.forEach(function(k){var q=hpos(k),dd=Math.hypot(q[0]-OX,q[1]-OY)/(S*(L.R*1.8+1)),a=Math.max(0,1-Math.abs(dd-su*1.3)*4)*.5;if(a>0){cx.fillStyle="rgba(255,220,120,"+a+")";hexPath(cx,q[0],q[1],S*.95,S*.22);cx.fill()}});cx.restore();shimmer=Math.max(0,shimmer-rdt*1.4)}cx.restore();drawHUD()}
 if(flashA>0){cx.fillStyle="rgba(255,245,200,"+flashA+")";cx.fillRect(0,0,W,H);flashA=Math.max(0,flashA-rdt*2)}
 updSurprises(rdt);drawFX(hitStop>0?0:(slowT>0?rdt*.35:rdt));drawIntro(rdt);
 requestAnimationFrame(frame)}

 Tut.start([

 bot:function(){if(!L||cur||STEPS.length||scene!=="play")return null;var m=botMove(L,2);if(!m)return null;if(m.swap)doSwap();doTurn(m.k);return m.k},hpos:hpos,LV:LV};

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hex Merge</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#241a3a;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr.on{display:flex}.scr>*{pointer-events:auto}
.btn{font:inherit;font-weight:900;border:0;border-radius:18px;padding:14px 36px;font-size:24px;color:#3a1a00;background:linear-gradient(#ffe27a,#ff9f3a);box-shadow:0 6px 0 #b85a14,0 10px 22px rgba(0,0,0,.3);cursor:pointer;margin:6px;transition:transform .08s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b85a14}
.btn.alt{background:linear-gradient(#fff,#e0dcf0);color:#3a2a5a;box-shadow:0 6px 0 #8f86b0,0 10px 22px rgba(0,0,0,.25)}
.btn.sm{font-size:17px;padding:9px 20px}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900;position:relative}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:-6px;right:-6px;background:#ffcf3a;color:#3a1a00;border-radius:10px;font-size:12px;padding:1px 6px;font-weight:900}
#mute{position:fixed;top:10px;right:12px;z-index:9}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,220px));gap:14px;padding:0 16px}
.mode{border-radius:22px;padding:16px 12px;text-align:center;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.25),0 14px 28px rgba(0,0,0,.3);transition:transform .12s}
.mode:hover{transform:translateY(-4px)}
.mode .ic{font-size:40px;line-height:1.1}.mode .nm{font-weight:900;font-size:20px;margin-top:4px}.mode .ds{font-size:14px;opacity:.85;margin-top:2px}
.h2{font-size:min(9vw,44px);font-weight:900;margin-bottom:14px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.lg{display:grid;grid-template-columns:repeat(5,62px);gap:10px}
.lb{width:62px;height:68px;border:0;font:inherit;font-weight:900;font-size:22px;cursor:pointer;color:#3a2a5a;background:linear-gradient(#fff,#e6e0f6);clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.lb small{font-size:10px;color:#e8901a}
.lb.lock{background:#4a3f66;color:#8a80aa;cursor:default}
.lb.cur{background:linear-gradient(#ffe27a,#ffb04a)}
.themes{display:grid;grid-template-columns:repeat(3,minmax(0,150px));gap:12px}
.th{border-radius:18px;padding:12px;text-align:center;cursor:pointer;font-weight:900;box-shadow:0 5px 0 rgba(0,0,0,.25);position:relative}
.th.on{outline:4px solid #fff}.th.lock{filter:grayscale(.85) brightness(.6);cursor:default}
.th .sw{display:flex;gap:3px;justify-content:center;margin-bottom:6px}.th .sw i{width:20px;height:22px;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);display:block}
.th small{display:block;font-size:12px;opacity:.85;margin-top:2px}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:8px;padding:10px 12px;pointer-events:none}
#hud.on{display:flex}#hud>*{pointer-events:auto}
.boxes{flex:1;display:flex;gap:8px;justify-content:center;padding-right:52px}
.bx{background:rgba(0,0,0,.25);border-radius:14px;padding:4px 12px;text-align:center;min-width:72px}
.bx small{display:block;font-size:11px;opacity:.7;font-weight:900;letter-spacing:.08em}
.bx b{font-size:22px}
.dim{position:fixed;inset:0;background:rgba(20,10,40,.6)}
.panel{position:relative;background:linear-gradient(#fff,#ece8f8);color:#3a2a5a;border-radius:26px;padding:22px 28px;text-align:center;box-shadow:0 10px 0 #8f86b0,0 20px 50px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-width:94vw}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.panel h3{font-size:30px;font-weight:900;margin-bottom:6px}
.stars{font-size:50px;letter-spacing:6px}.stars i{font-style:normal;color:#d8d0e8;display:inline-block;animation:st .4s backwards}.stars i.on{color:#ffb21a;text-shadow:0 3px 0 #c27a00}
@keyframes st{from{transform:scale(0)}60%{transform:scale(1.4)}}
.big{font-size:46px;font-weight:900;color:#e8801a}
.sub{opacity:.7;font-size:15px;margin:2px 0 8px}
#tip{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:13px;opacity:.65;pointer-events:none;display:none}
#goal{position:fixed;left:0;right:0;top:66px;text-align:center;font-weight:900;font-size:15px;pointer-events:none;display:none}
.gb-sup{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font-size:11.5px;font-weight:700;color:#fff;opacity:.55;text-decoration:none;z-index:8;display:none;padding:4px 6px;letter-spacing:.02em;transition:opacity .2s}
.gb-sup:hover,.gb-sup:focus{opacity:1}.gb-sup.on{display:block}
#tut{position:fixed;inset:0;pointer-events:none;z-index:7;display:none}#tut.on{display:block}
#tCap{position:absolute;left:50%;top:76px;transform:translateX(-50%);background:linear-gradient(#fff,#ece8f8);color:#3a2a5a;font-weight:900;font-size:19px;padding:10px 20px;border-radius:18px;box-shadow:0 5px 0 #8f86b0,0 10px 24px rgba(0,0,0,.35);white-space:nowrap;animation:tcap .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes tcap{from{transform:translateX(-50%) scale(.5);opacity:0}}
#tKeys{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-weight:900;font-size:14px;opacity:.95}
.tk{display:inline-flex;min-width:34px;height:34px;padding:0 8px;align-items:center;justify-content:center;border-radius:9px;background:linear-gradient(#fff,#d9d2ee);color:#3a2a5a;box-shadow:0 4px 0 #8f86b0;font-size:16px;animation:tkp 1.4s ease-in-out infinite}
@keyframes tkp{0%,55%,100%{transform:none;box-shadow:0 4px 0 #8f86b0}65%{transform:translateY(3px);box-shadow:0 1px 0 #8f86b0}}
#tHand{position:absolute;width:44px;height:52px;margin:-3px 0 0 -21px;filter:drop-shadow(0 4px 4px rgba(0,0,0,.35));animation:tsw 1.6s cubic-bezier(.45,0,.25,1) infinite}
@keyframes tsw{0%{transform:translate(0,0) scale(1.15);opacity:0}15%{transform:translate(0,0) scale(1);opacity:1}25%{transform:translate(calc(var(--dx) * -.08),calc(var(--dy) * -.08)) scale(.9)}70%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:1}85%,100%{transform:translate(var(--dx),var(--dy)) scale(1);opacity:0}}
#tTrail{position:absolute;height:10px;border-radius:5px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.55));transform-origin:0 50%;animation:ttr 1.6s cubic-bezier(.45,0,.25,1) infinite}
@keyframes ttr{0%,22%{clip-path:inset(0 100% 0 0);opacity:.9}70%{clip-path:inset(0 0 0 0);opacity:.9}90%,100%{clip-path:inset(0 0 0 0);opacity:0}}
#tSkip{position:absolute;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));pointer-events:auto}
#tut.shake #tCap{animation:tsh .3s}@keyframes tsh{25%{margin-left:-8px}75%{margin-left:8px}}
@media (max-width:560px){.modes{grid-template-columns:repeat(2,minmax(0,170px));gap:10px}.mode .ic{font-size:30px}.mode .nm{font-size:17px}.themes{grid-template-columns:repeat(2,minmax(0,150px))}.lg{grid-template-columns:repeat(5,56px);gap:8px}.lb{width:56px;height:62px}.bx{min-width:58px;padding:4px 8px}.bx b{font-size:18px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sTitle" class="scr on"><div style="height:min(40vh,300px)"></div><div style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap"><button class="btn" id="bPlay">▶ Play</button><button class="btn alt sm" id="bHow">? How to play</button></div><div style="margin-top:12px;font-size:14px;opacity:.85">Slide · match · merge to 2048</div></div>
<div id="sMenu" class="scr"><div class="modes" id="modes"></div><div style="margin-top:16px"><button class="btn alt sm" id="bMB">◀</button></div></div>
<div id="sLv" class="scr"><div class="h2">Challenges</div><div class="lg" id="lg"></div><div style="margin-top:16px"><button class="btn alt sm" id="bLB">◀</button></div></div>
<div id="sTh" class="scr"><div class="h2">Themes</div><div class="themes" id="ths"></div><div style="margin-top:16px"><button class="btn alt sm" id="bTB">◀</button></div></div>
<div id="hud"><button class="ib" id="bBack"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><div class="boxes"><div class="bx"><small id="l1">SCORE</small><b id="v1">0</b></div><div class="bx"><small id="l2">BEST</small><b id="v2">0</b></div><button class="ib" id="bUndo" title="Undo (Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg><span class="badge" id="un">3</span></button></div></div>
<div id="goal"></div>
<div id="tip">Q W E · A S D &nbsp;or swipe</div>
<button class="ib" id="mute"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
<div id="tut"><div id="tTrail"></div><svg id="tHand" viewBox="0 0 48 56"><path d="M18 30V8a5 5 0 0 1 10 0v14l11 2.5a6 6 0 0 1 4.6 6.8L41 46a8 8 0 0 1-8 7H22a8 8 0 0 1-6.4-3.2L6 37a4.5 4.5 0 0 1 7-5.6z" fill="#fff" stroke="#3a2a5a" stroke-width="3" stroke-linejoin="round"/></svg><div id="tCap"></div><div id="tKeys"></div><button class="btn alt sm" id="tSkip">Skip ▸</button></div>
<a class="gb-sup" id="gbSup" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
<div id="sOver" class="scr"><div class="dim"></div><div class="panel" id="panel"></div></div>
<script>
"use strict";
var SK="gamebop.hex-merge.";
function ld(k,d){try{var v=localStorage.getItem(SK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch(e){}}
var save=ld("save",null)||{best:{classic:0,big:0,time:0},maxTile:0,lv:{},unl:0,undo:3,theme:0,run:null,g512:0};
var muted=!!ld("mute",false);function persist(){sv("save",save)}
var $=function(i){return document.getElementById(i)};
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// themes: bg1,bg2,board,cell, tile colors by log2 (1..12+)
var THEMES=[
 {n:"Candy",req:"",bg:["#3a2a6a","#1c1438"],board:"#2a2050",cell:"#3d3070",t:["#ffe0ec","#ffc6dc","#ff9ec4","#ff77a8","#ff5a8a","#ff8a3a","#ffb52e","#ffd93a","#a8e05a","#4ad6a0","#3ab8ff","#8a6aff","#ff4af0"]},
 {n:"Ocean",req:"tile 256",bg:["#0f4a6a","#082438"],board:"#0c3550",cell:"#14506e",t:["#e0f8ff","#b8ecff","#88dcff","#58c8f8","#38a8e8","#2a88d8","#3a6ae0","#5a4ae0","#8a3ad8","#2ad8c0","#48f0a0","#fff06a","#ff7a5a"]},
 {n:"Sunset",req:"tile 512",bg:["#6a2a4a","#2a0f2a"],board:"#4a1a3a",cell:"#6a2a50",t:["#ffeedd","#ffd8b0","#ffbe88","#ffa060","#ff8048","#ff5a48","#e83a6a","#c02a8a","#8a2aa8","#ffd23a","#ffef8a","#7affd8","#ffffff"]},
 {n:"Forest",req:"10 levels",bg:["#2a5a3a","#102a1a"],board:"#1f4a2c",cell:"#2c6038",t:["#effbe0","#d6f2b8","#b8e690","#98d86a","#78c850","#58b040","#d8c048","#e8a038","#d87a2a","#b85a2a","#8a4a8a","#ffe85a","#ffffff"]},
 {n:"Neon",req:"tile 1024",bg:["#10051f","#000"],board:"#14082a",cell:"#1f0f3a",t:["#3ff6ff","#3fb8ff","#5f7fff","#9f5fff","#d84fff","#ff3fd0","#ff3f8a","#ff5f3f","#ffb03f","#ffef3f","#9fff3f","#3fff8a","#ffffff"]},
 {n:"Gold",req:"tile 2048",bg:["#4a3a10","#1f1505"],board:"#3a2c0c",cell:"#544014",t:["#fff8e0","#fff0c0","#ffe49a","#ffd670","#ffc848","#f0b030","#e09a20","#c88010","#b06a08","#ffe9a0","#fffbe8","#ffffff","#fff"]}
];
function themeOk(i){var t=THEMES[i].req;if(!t)return true;if(t==="tile 256")return save.maxTile>=256;if(t==="tile 512")return save.maxTile>=512;if(t==="tile 1024")return save.maxTile>=1024;if(t==="tile 2048")return save.maxTile>=2048;if(t==="10 levels")return Object.keys(save.lv).length>=10;return false}
// challenge levels
var LV=[];(function(){var tg=[32,64,64,128,128,128,256,256,256,256,256,512,512,512,512,512,512,1024,1024,1024,1024,1024,2048,2048,2048],
 bl=[0,0,1,0,2,0,2,3,1,4,5,3,2,5,4,6,7,4,5,6,7,8,5,7,8],wi=[0,0,0,1,0,2,0,1,2,0,1,0,2,1,3,0,2,1,0,2,3,1,0,2,3],LIM=[30,60,55,110,125,110,205,230,230,235,235,450,420,435,410,460,475,865,850,880,980,1130,1540,2150,2190];
 for(var i=0;i<25;i++){var L={n:i+1,r:i<5?2:3,target:tg[i],blocks:bl[i],wild:wi[i],wchance:i>=6&&i%4===2?.03:0,seed:i*977+13};L.moves=LIM?LIM[i]:9999;LV.push(L)}})();
var DIRS=[[0,-1],[1,-1],[1,0],[0,1],[-1,1],[-1,0]];// N NE SE S SW NW (flat-top axial)
var KEYMAP={w:0,e:1,d:2,s:3,a:4,q:5,arrowup:0,arrowdown:3};

// ---------- audio ----------
var AC=null,master=null;
function audio(){if(AC){if(AC.state==="suspended")AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.45;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,t,d,type,v,sl){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(t||0);o.type=type||"sine";o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.2,n+.008);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.05)}
var PEN=[0,2,4,7,9];
var SFX={slide:function(){tone(300,0,.08,"sine",.08,200)},merge:function(lv){var f=262*Math.pow(2,(PEN[lv%5]+12*Math.floor(lv/5))/12);tone(f,0,.18,"triangle",.2);tone(f*1.5,.03,.15,"sine",.1)},
 big:function(){[523,659,784,1047,1319].forEach(function(f,i){tone(f,i*.07,.35,"triangle",.18)})},bad:function(){tone(150,0,.12,"square",.07)},
 undo:function(){tone(600,0,.12,"sine",.12,300)},ui:function(){tone(800,0,.05,"triangle",.1)},over:function(){[392,330,262,196].forEach(function(f,i){tone(f,i*.14,.4,"triangle",.16)})}};

// ---------- core ----------
var G=null,scene="title",paused=false,parts=[],floats=[],shake=0,uid=1;
function cells(r){var c=[];for(var q=-r;q<=r;q++)for(var s=-r;s<=r;s++){var rr2=-q-s;if(Math.abs(rr2)<=r)c.push([q,s])}return c}
function k(q,r){return q+","+r}
function newBoard(cfg){var r=rng(cfg.seed||Date.now()),b={r:cfg.r,cells:cells(cfg.r),tiles:{},blocked:{},rnd:r};
 if(cfg.blocks){var cs=b.cells.filter(function(c){return !(c[0]===0&&c[1]===0)});for(var i=0;i<cfg.blocks;i++){var j=Math.floor(r()*cs.length);b.blocked[k(cs[j][0],cs[j][1])]=1;cs.splice(j,1)}}
 return b}
function empties(b){return b.cells.filter(function(c){var kk=k(c[0],c[1]);return !b.tiles[kk]&&!b.blocked[kk]})}
function spawn(b,val){var e=empties(b);if(!e.length)return null;var c=e[Math.floor(b.rnd()*e.length)];var v=val||(G&&G.cfg.wchance&&b.rnd()<G.cfg.wchance?-1:(b.rnd()<.9?2:4));var t={id:uid++,v:v,q:c[0],r:c[1],pq:c[0],pr:c[1],born:0,pop:0};b.tiles[k(c[0],c[1])]=t;return t}
function inB(b,q,r){return Math.max(Math.abs(q),Math.abs(r),Math.abs(q+r))<=b.r}
function canMerge(a,c){if(a.v===-1&&c.v===-1)return false;return a.v===c.v||a.v===-1||c.v===-1}
function mergedVal(a,c){if(a.v===-1)return c.v*2;if(c.v===-1)return a.v*2;return a.v*2}
function move(b,d,dry){var dq=DIRS[d][0],dr=DIRS[d][1];
 var list=b.cells.filter(function(c){return b.tiles[k(c[0],c[1])]});
 list.sort(function(x,y){return proj(y,d)-proj(x,d)});
 var occ={},plan=[],moved=false,gain=0,merges=[];
 list.forEach(function(c){var t=b.tiles[k(c[0],c[1])],q=c[0],r=c[1],mg=false;
  while(true){var nq=q+dq,nr=r+dr;if(!inB(b,nq,nr)||b.blocked[k(nq,nr)])break;var o=occ[k(nq,nr)];if(o){if(!o.m&&canMerge({v:t.v},{v:o.v})){var nv=mergedVal({v:t.v},{v:o.v});o.m=1;o.nv=nv;gain+=nv;mg=true;merges.push({from:t,into:o.t,v:nv,q:nq,r:nr});plan.push({t:t,q:nq,r:nr})}break}q=nq;r=nr}
  if(!mg){occ[k(q,r)]={t:t,v:t.v,q:q,r:r};plan.push({t:t,q:q,r:r})}
  if(mg||q!==c[0]||r!==c[1])moved=true});
 if(!dry){var nt={};plan.forEach(function(p){p.t.pq=p.t.q;p.t.pr=p.t.r;p.t.q=p.q;p.t.r=p.r});for(var kk in occ){var o=occ[kk];if(o.m){o.t.ov=o.t.v;o.t.v=o.nv}nt[kk]=o.t}b.tiles=nt}
 return {moved:moved,gain:gain,merges:merges}}
function proj(c,d){var dq=DIRS[d][0],dr=DIRS[d][1];var x=c[0],z=c[1],y=-x-z,ddy=-dq-dr;return x*dq+y*ddy+z*dr}
function anyMove(b){if(empties(b).length)return true;for(var d=0;d<6;d++){var r=move(b,d,true);if(r.moved)return true}return false}
function snap(){var t=[];for(var kk in G.b.tiles){var x=G.b.tiles[kk];t.push([x.q,x.r,x.v])}return {t:t,score:G.score,moves:G.moves,rs:G.rseed}}

function startMode(cfg){var b;G={cfg:cfg,score:0,moves:0,hist:[],over:false,won:false,anim:0,mergeFx:[],time:cfg.time||0,maxT:0};
 G.rseed=(cfg.seed||Date.now())|0;b=newBoard(cfg);G.b=b;
 if(cfg.restore){cfg.restore.t.forEach(function(x){var t={id:uid++,v:x[2],q:x[0],r:x[1],pq:x[0],pr:x[1],born:1,pop:0};b.tiles[k(x[0],x[1])]=t});G.score=cfg.restore.score;G.moves=cfg.restore.moves;b.blocked={};cfg.restore.t.forEach(function(x){if(x[2]>G.maxT)G.maxT=x[2]})}
 else{for(var i=0;i<(cfg.wild||0);i++)spawn(b,-1);spawn(b);spawn(b)}
 scene="play";paused=false;show();updHud()}
function doMove(d){if(!G||G.over||paused||scene!=="play")return;audio();if(G.tut&&(G.tut.need<0||d!==G.tut.need)){SFX.bad();bump(d);tutNudge();return}var before=snap();var r=move(G.b,d,true);if(!r.moved){SFX.bad();bump(d);return}
 G.hist.push(before);if(G.hist.length>20)G.hist.shift();
 r=move(G.b,d,false);G.anim=0;G.moves++;G.score+=r.gain;

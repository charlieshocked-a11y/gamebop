<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snowbigger</title>
<style>
:root{--ink:#17305a;--ice:#e8f4ff;--wood:#a8693a;--wood2:#7a4422;--gold:#ffc93c;--pink:#ff6f91}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9cc8ee;font-family:"Trebuchet MS","Segoe UI",Verdana,system-ui,sans-serif;color:var(--ink);touch-action:none}
canvas{position:fixed;left:0;top:0;display:block}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.screen.show{display:flex;animation:fadein .35s ease-out}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.btn{position:relative;border:none;cursor:pointer;font:900 clamp(18px,3.2vw,26px) "Trebuchet MS",Verdana,sans-serif;color:#fff;letter-spacing:.5px;padding:.55em 1.4em .6em;border-radius:14px 16px 13px 15px;background:linear-gradient(#c47a40,#93511f);box-shadow:0 5px 0 #5c2f10,0 9px 16px rgba(20,40,80,.35),inset 0 2px 0 rgba(255,255,255,.25);text-shadow:0 2px 0 #5c2f10;transition:transform .08s,box-shadow .08s;margin:6px;min-width:150px}
.btn::before{content:"";position:absolute;left:6%;right:6%;top:-7px;height:13px;background:#fff;border-radius:10px 14px 8px 12px;box-shadow:0 2px 0 #cfe2f6;pointer-events:none}
.btn:hover{transform:translateY(-2px)}
.btn:active,.btn.press{transform:translateY(4px);box-shadow:0 1px 0 #5c2f10,0 3px 8px rgba(20,40,80,.3)}
.btn.blue{background:linear-gradient(#4aa3f0,#2667c4);box-shadow:0 5px 0 #173f7d,0 9px 16px rgba(20,40,80,.35),inset 0 2px 0 rgba(255,255,255,.3);text-shadow:0 2px 0 #173f7d}
.btn.big{font-size:clamp(24px,4.4vw,36px);padding:.5em 1.6em .55em}
.btn.small{font-size:clamp(14px,2.2vw,18px);padding:.45em 1em;min-width:0}
.btn:disabled{filter:grayscale(.8) brightness(.9);cursor:default}
#title .logo{position:relative;text-align:center;margin-top:-6vh;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-.6deg)}}
.logo .l{display:inline-block;font:900 clamp(54px,11vw,132px)/0.95 "Arial Black","Trebuchet MS",Verdana,sans-serif;color:#fff;-webkit-text-stroke:clamp(3px,.6vw,7px) #17305a;paint-order:stroke fill;text-shadow:0 .07em 0 #17305a,0 .14em 0 rgba(23,48,90,.35),0 .25em .3em rgba(23,48,90,.3);transform-origin:50% 90%;animation:let 2.4s ease-in-out infinite}
.logo .l.b{color:#bfe4ff}
@keyframes let{0%,100%{transform:translateY(0) scaleY(1)}12%{transform:translateY(-.08em) scaleY(1.06)}22%{transform:translateY(0) scaleY(.94)}30%{transform:scaleY(1)}}
.logo .sub{font:800 clamp(13px,2vw,18px) "Trebuchet MS",sans-serif;color:#fff;background:#17305a;display:inline-block;padding:4px 14px;border-radius:20px;margin-top:10px;letter-spacing:2px}
#title .btns{display:flex;flex-direction:column;align-items:center;margin-top:5vh}
#support{position:fixed;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));font:600 11px "Trebuchet MS",sans-serif;color:#17305a;opacity:.55;text-decoration:none;z-index:30;display:none}
#support:hover{opacity:1}
.panel{position:relative;background:linear-gradient(#fdfeff,#e2efff);border-radius:22px 26px 20px 24px;box-shadow:0 0 0 4px #17305a,0 10px 0 4px #17305a,0 20px 40px rgba(10,30,70,.4);padding:22px 26px;max-width:min(94vw,760px);max-height:88vh;display:flex;flex-direction:column;align-items:center}
.panel::before{content:"";position:absolute;left:-6px;right:-6px;top:-14px;height:26px;background:#fff;border-radius:16px 22px 12px 20px;box-shadow:0 0 0 4px #17305a;clip-path:inset(-10px -10px 50% -10px);pointer-events:none}
h2{margin:0 0 8px;font:900 clamp(24px,4vw,38px) "Arial Black","Trebuchet MS",sans-serif;color:#17305a;letter-spacing:1px}
.coins{display:inline-flex;align-items:center;gap:6px;font:900 20px "Trebuchet MS",sans-serif;color:#17305a}
.coin{width:1em;height:1em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc93c 45%,#d8901a);box-shadow:inset 0 0 0 2px #b8730f;display:inline-block;flex:none}
#mapGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:10px 0;width:min(86vw,680px)}
.tile{position:relative;aspect-ratio:1/1.05;border-radius:14px;border:none;cursor:pointer;background:linear-gradient(#78b6ef,#3f7fcf);box-shadow:0 4px 0 #173f7d,inset 0 2px 0 rgba(255,255,255,.35);color:#fff;font:900 clamp(16px,3vw,24px) "Trebuchet MS",sans-serif;overflow:hidden;padding:0;transition:transform .08s}
.tile:active{transform:translateY(3px)}
.tile svg.mt{position:absolute;left:0;right:0;bottom:0;width:100%;height:60%}
.tile .num{position:absolute;top:5px;left:8px;text-shadow:0 2px 0 #173f7d}
.tile .md{position:absolute;top:6px;right:6px;width:22%;aspect-ratio:1;border-radius:50%}
.tile .nm{position:absolute;bottom:4px;left:2px;right:2px;font-size:clamp(8px,1.4vw,11px);color:#17305a;font-weight:800;line-height:1.05}
.tile.lock{background:linear-gradient(#a8b4c4,#7d8a9c);box-shadow:0 4px 0 #4d586a;cursor:default}
.tile.black{background:linear-gradient(#5b6b8a,#2a3550);box-shadow:0 4px 0 #111a2e,inset 0 2px 0 rgba(255,255,255,.2)}
.tile.sel{outline:4px solid var(--gold);outline-offset:1px}
.tabs{display:flex;gap:8px;margin:4px 0}
.tab{border:none;border-radius:12px;padding:6px 14px;font:900 15px "Trebuchet MS",sans-serif;background:#cfe1f5;color:#17305a;cursor:pointer}
.tab.on{background:#17305a;color:#fff}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center}
#shopList{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(88vw,680px);margin:8px 0}
.up{background:#fff;border-radius:14px;padding:10px;box-shadow:0 0 0 3px #17305a;display:flex;flex-direction:column;gap:6px}
.up .t{font:900 17px "Trebuchet MS",sans-serif;display:flex;align-items:center;gap:6px}
.up .d{font:700 12px "Trebuchet MS",sans-serif;opacity:.75}
.pips{display:flex;gap:2px}
.pips i{flex:1;height:8px;border-radius:3px;background:#d6e2f0}
.pips i.on{background:linear-gradient(#7fd0ff,#2d84e0)}
#skins{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:6px 0;width:min(88vw,680px)}
.skin{position:relative;width:62px;height:76px;border:none;border-radius:12px;background:#fff;box-shadow:0 0 0 3px #17305a;cursor:pointer;padding:4px;font:800 11px "Trebuchet MS",sans-serif;color:#17305a}
.skin canvas{position:static;width:46px;height:46px;display:block;margin:0 auto 2px}
.skin.on{box-shadow:0 0 0 4px var(--gold),0 0 0 7px #17305a}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.show{display:block}
#sizebox{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(10px,env(safe-area-inset-top));background:rgba(255,255,255,.88);border-radius:16px;box-shadow:0 0 0 3px #17305a,0 5px 0 3px #17305a;padding:6px 12px 8px;min-width:150px}
#sizeTxt{font:900 24px "Arial Black","Trebuchet MS",sans-serif;color:#17305a;transition:transform .1s;display:inline-block}
#sizeRow{display:flex;align-items:center;gap:6px}
#gIco{width:30px;height:30px;flex:none;border-radius:50%;background:#e3effc;box-shadow:inset 0 0 0 2px #9fb4cf;padding:3px;transition:background .2s}
#gIco svg{width:100%;height:100%;display:block}
#sizebox{transition:box-shadow .25s}
#sizebox.grow{box-shadow:0 0 0 3px #17305a,0 5px 0 3px #17305a,0 0 16px 5px rgba(110,200,255,.95);animation:gpulse .5s ease-in-out infinite alternate}
#sizebox.grow #gIco{background:#bfe6ff;box-shadow:inset 0 0 0 2px #2d84e0}
#sizebox.nogrow #gIco{background:#ffe3c9;box-shadow:inset 0 0 0 2px #e08a3a}
#sizebox.melt #gIco{background:#ffd6dc;box-shadow:inset 0 0 0 2px #d23b3b}
#sizebox.melt{box-shadow:0 0 0 3px #d23b3b,0 5px 0 3px #d23b3b}
#sizebox.pop{animation:gpop .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes gpulse{from{box-shadow:0 0 0 3px #17305a,0 5px 0 3px #17305a,0 0 8px 2px rgba(110,200,255,.7)}to{box-shadow:0 0 0 3px #17305a,0 5px 0 3px #17305a,0 0 20px 8px rgba(150,220,255,1)}}
@keyframes gpop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
#sizeFill.on{background:linear-gradient(90deg,#9ad7ff,#2d84e0,#bff0ff,#2d84e0);background-size:200% 100%;animation:shim .6s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
#sizeTxt small{font-size:14px}
#sizeBar{position:relative;height:10px;border-radius:6px;background:#d6e2f0;margin-top:3px;width:170px;max-width:36vw}
#sizeFill{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:linear-gradient(90deg,#9ad7ff,#2d84e0);width:0}
.mk{position:absolute;top:-4px;width:12px;height:18px;margin-left:-6px;border-radius:4px;box-shadow:0 0 0 2px #17305a}
#coinbox{position:absolute;right:max(110px,calc(env(safe-area-inset-right) + 104px));top:max(14px,env(safe-area-inset-top));background:rgba(255,255,255,.88);border-radius:14px;box-shadow:0 0 0 3px #17305a,0 4px 0 3px #17305a;padding:5px 12px}
#prog{position:absolute;left:50%;transform:translateX(-50%);top:max(14px,env(safe-area-inset-top));width:min(30vw,300px);height:12px;border-radius:7px;background:rgba(23,48,90,.35);box-shadow:0 0 0 2px rgba(255,255,255,.7)}
#progBall,#progGhost,#progAva{position:absolute;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%}
#progBall{background:#fff;box-shadow:0 0 0 3px #17305a}
#progGhost{background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(23,48,90,.4)}
#progAva{background:#fff;box-shadow:0 0 0 3px #d23b3b;display:none}
#progFlag{position:absolute;right:-6px;top:-10px;width:14px;height:22px}
#lvlName{position:absolute;left:50%;transform:translateX(-50%);top:calc(max(14px,env(safe-area-inset-top)) + 20px);font:900 14px "Trebuchet MS",sans-serif;color:#fff;text-shadow:0 2px 0 #17305a,0 0 6px #17305a;white-space:nowrap}
.hb{position:absolute;top:max(10px,env(safe-area-inset-top));width:42px;height:42px;border-radius:12px;border:none;background:rgba(255,255,255,.88);box-shadow:0 0 0 3px #17305a,0 4px 0 3px #17305a;pointer-events:auto;cursor:pointer;padding:8px}
.hb svg{width:100%;height:100%}
#bPause{right:max(12px,env(safe-area-inset-right))}
#bMute{right:max(62px,calc(env(safe-area-inset-right) + 56px))}
#bMuteT{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20;display:none}
#hint{position:absolute;left:50%;bottom:max(18px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(23,48,90,.78);color:#fff;border-radius:16px;padding:8px 14px;font:800 15px "Trebuchet MS",sans-serif;transition:opacity .8s;white-space:nowrap}
.key{display:inline-block;background:#fff;color:#17305a;border-radius:6px;padding:2px 8px;box-shadow:0 3px 0 #9fb4cf;font:900 13px "Trebuchet MS",sans-serif}
#warn{position:absolute;left:12px;top:50%;transform:translateY(-50%);font:900 18px "Trebuchet MS",sans-serif;color:#fff;background:#d23b3b;border-radius:12px;padding:6px 10px;box-shadow:0 0 0 3px #fff;display:none}
#tut{position:fixed;inset:0;z-index:8;pointer-events:none;display:none}
#tut.show{display:block}
#tutCap{position:absolute;left:50%;top:26%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:10px 20px;box-shadow:0 0 0 4px #17305a,0 6px 0 4px #17305a;font:900 clamp(20px,3.6vw,30px) "Trebuchet MS",sans-serif;white-space:nowrap;display:none;align-items:center;gap:10px}
#tutCap.show{display:flex;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:translateX(-50%) scale(.3)}to{transform:translateX(-50%) scale(1)}}
#tutHand{position:absolute;left:50%;top:52%;width:90px;height:90px;margin-left:-45px;display:none}
#tutHand.show{display:block;animation:tap 1s ease-in-out infinite}
#tutHand.hold{animation:hold 1.6s ease-in-out infinite}
@keyframes tap{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(14px) scale(.9)}55%{transform:translateY(0) scale(1)}}
@keyframes hold{0%{transform:translateY(0)}20%,80%{transform:translateY(14px) scale(.9)}100%{transform:translateY(0)}}
#bSkip{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));pointer-events:auto}
#result .medal{width:110px;height:110px;margin:4px auto}
#resStats{display:flex;gap:18px;justify-content:center;margin:6px 0 4px;font:900 20px "Trebuchet MS",sans-serif}
#resStats div{display:flex;flex-direction:column;align-items:center}
#resStats span{font:700 12px "Trebuchet MS",sans-serif;opacity:.7}
#resBar{position:relative;width:min(70vw,420px);height:16px;border-radius:9px;background:#d6e2f0;margin:12px 0 18px}
#resFill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:linear-gradient(90deg,#9ad7ff,#2d84e0)}
#shop .panel{overflow-y:auto}
#tease{display:flex;align-items:center;gap:10px;background:#17305a;color:#fff;border-radius:14px;padding:8px 14px;font:800 15px "Trebuchet MS",sans-serif;margin:6px 0}
#tease canvas{position:static;width:54px;height:40px;border-radius:8px;background:#9cc8ee}
#resMsg{font:900 clamp(26px,5vw,44px) "Arial Black","Trebuchet MS",sans-serif;color:#17305a;margin:0}
#resSub{font:800 15px "Trebuchet MS",sans-serif;opacity:.75;margin:2px 0}
.newbest{display:inline-block;background:var(--pink);color:#fff;border-radius:10px;padding:2px 10px;font:900 14px "Trebuchet MS",sans-serif;animation:pulse .7s ease-in-out infinite alternate}
@keyframes pop2{from{transform:scale(.2) rotate(-30deg)}to{transform:scale(1)}}
@keyframes pulse{to{transform:scale(1.12)}}
#resBtns{display:flex;gap:6px;align-items:center;justify-content:center;width:100%;margin-top:6px}
#resBtns .grow{flex:1}
@media (max-width:560px){
 #mapGrid{grid-template-columns:repeat(4,1fr);gap:8px}
 #shopList{grid-template-columns:1fr}
 .up{padding:7px}
 #sizebox{min-width:0;padding:4px 9px 6px}
 #sizeTxt{font-size:19px}
 #gIco{width:24px;height:24px;padding:2px}
 #sizeBar{width:110px}
 #prog{top:auto;bottom:max(14px,env(safe-area-inset-bottom));width:52vw;left:16px;transform:none}
 .up .d{display:none}
 .up .btn{font-size:14px;padding:.3em}
 .up{gap:4px}
 #lvlName{display:none}
 #coinbox{right:auto;left:max(12px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 66px);padding:3px 10px}
 #coinbox .coins{font-size:16px}
 #hint{bottom:calc(max(12px,env(safe-area-inset-bottom)) + 26px);font-size:13px}
 .panel{padding:18px 14px}
 #resStats{gap:12px;font-size:17px}
 .btn{min-width:110px}
}
@media (max-height:500px){#title .logo{margin-top:0}.logo .l{font-size:min(11vw,18vh)}#title .btns{margin-top:2vh;flex-direction:row}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
 <div id="sizebox"><div id="sizeRow"><span id="gIco"></span><div id="sizeTxt">0.4<small> m</small></div></div><div id="sizeBar"><div id="sizeFill"></div></div></div>
 <div id="prog"><div id="progGhost"></div><div id="progAva"></div><div id="progBall"></div>
  <svg id="progFlag" viewBox="0 0 14 22"><rect x="1" y="0" width="2" height="22" fill="#17305a"/><path d="M3 1h10v8H3z" fill="#fff"/><path d="M3 1h3v3H3zM9 1h3v3H9zM6 4h3v3H6zM3 7h3v2H3zM9 7h3v2H9z" fill="#17305a"/></svg></div>
 <div id="lvlName"></div>
 <div id="coinbox"><span class="coins"><i class="coin"></i><span id="coinTxt">0</span></span></div>
 <button class="hb" id="bMute" aria-label="mute"></button>
 <button class="hb" id="bPause" aria-label="pause"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="4.5" height="14" rx="1.5" fill="#17305a"/><rect x="11.5" y="3" width="4.5" height="14" rx="1.5" fill="#17305a"/></svg></button>
 <div id="hint"><span class="key">SPACE</span><span>or tap = hop</span><span style="opacity:.7">· hold = higher</span></div>
 <div id="warn">AVALANCHE!</div>
</div>

<div id="tut">
 <div id="tutCap"></div>
 <svg id="tutHand" viewBox="0 0 90 90"><circle cx="45" cy="22" r="14" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/><path d="M38 30 v-14 a6 6 0 0 1 12 0 v20 l10 -2 a7 7 0 0 1 9 6 l-4 24 a12 12 0 0 1 -12 10 h-14 a12 12 0 0 1 -10 -6 l-10 -18 a6 6 0 0 1 9 -7 l10 9z" fill="#fff" stroke="#17305a" stroke-width="4" stroke-linejoin="round"/></svg>
 <button class="btn small blue" id="bSkip">Skip &#9658;</button>
</div>

<div id="title" class="screen">
 <div class="logo">
  <div><span class="l">S</span><span class="l">N</span><span class="l">O</span><span class="l">W</span></div>
  <div><span class="l b">B</span><span class="l b">I</span><span class="l b">G</span><span class="l b">G</span><span class="l b">E</span><span class="l b">R</span></div>
  <div class="sub">ROLL &middot; GROW &middot; SMASH</div>
 </div>
 <div class="btns">
  <button class="btn big" id="bPlay">Play</button>
  <button class="btn blue small" id="bHow">How to play</button>
 </div>
</div>
<button class="hb" id="bMuteT" aria-label="mute"></button>
<a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support &#9829;</a>

<div id="map" class="screen">
 <div class="panel">
  <div class="row" style="width:100%;justify-content:space-between">
   <button class="btn small blue" id="bMapBack">&#9664;</button>
   <h2>Mountains</h2>
   <span class="coins"><i class="coin"></i><span id="mapCoins">0</span></span>
  </div>
  <div class="tabs"><button class="tab on" id="tabG">Green Slopes</button><button class="tab" id="tabB">Black Diamond</button></div>
  <div id="mapGrid"></div>
  <div class="row"><button class="btn" id="bShop">Upgrades</button><button class="btn blue big" id="bGo">Go!</button></div>
 </div>
</div>

<div id="shop" class="screen">
 <div class="panel">
  <div class="row" style="width:100%;justify-content:space-between">
   <button class="btn small blue" id="bShopBack">&#9664;</button>
   <h2>Upgrades</h2>
   <span class="coins"><i class="coin"></i><span id="shopCoins">0</span></span>
  </div>
  <div id="shopList"></div>
  <div style="font:900 16px 'Trebuchet MS',sans-serif;margin-top:4px">Ball skins</div>
  <div id="skins"></div>
 </div>
</div>

<div id="result" class="screen">
 <div class="panel">
  <div id="resMsg">FINISH!</div>
  <div id="resSub"></div>
  <svg class="medal" id="resMedal" viewBox="0 0 110 110"></svg>
  <div id="resBar"><div id="resFill"></div></div>
  <div id="resStats"><div><b id="rSize">0</b><span>size</span></div><div><b id="rDist">0</b><span>distance</span></div><div><b class="coins" style="font-size:20px"><i class="coin"></i><span id="rCoins">0</span></b><span>coins</span></div></div>
  <div id="resBest"></div>
  <div id="tease"></div>
  <div id="resBtns"><button class="btn small blue" id="bResMap">Map</button><button class="btn small" id="bRetry">Retry <span class="key" style="font-size:11px">R</span></button><button class="btn big blue grow" id="bNext">Next &#9658;</button></div>
 </div>
</div>

<div id="pause" class="screen" style="background:rgba(15,30,60,.45)">
 <div class="panel">
  <h2>Paused</h2>
  <button class="btn big blue" id="bResume">Resume</button>
  <div class="row"><button class="btn small" id="bPRestart">Restart</button><button class="btn small" id="bPMap">Map</button></div>
 </div>
</div>

<script>
'use strict';
// ================= utils =================
const $=id=>document.getElementById(id);
const cv=$('c');let ctx=cv.getContext('2d');
let W=800,H=600,DPR=1,U=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);

function buildCourse(L,startR){
 const def=L<0?TUT:LEVELS[L];
 const R=mulberry((L+7)*7919+101);
 const sl=[],sf=[],dr=[],estA=[],lips=[],lipP=[],puffs=[];const objs=[],coins=[],lifts=[],yetis=[];
 let est=10,estB=10;const allow=def.allow.split(' ');const ph=R()*10,ph2=R()*10;
 const kOf=t=>t===1?0.0065:t===0?0.0016:t===3?0.0004:t===2?-0.0012:0;
 function step(s,t,noise){const i=sl.length;sl.push(s+(noise||0)*(Math.sin(i*.21+ph)*.6+Math.sin(i*.057+ph2)*.4));sf.push(t);dr.push(0);est+=STEP*kOf(t)/(1+est/55);if(est<6)est=6;estB+=STEP*kOf(t)/(1+estB/55);if(estB<6)estB=6;estA.push(est);}
 function addObj(type,i,ex){const b=OBJ[type];const o=Object.assign({type,x:i*STEP+R()*8,hp:3,dead:false,wob:0,t:R()*10,id:objs.length},b);
  const sc=ex&&ex.sc||1;if(sc!==1){o.h*=sc;o.w*=sc;o.need*=sc;o.mass*=sc*sc;}Object.assign(o,ex||{});
  objs.push(o);if(o.kind!=='gate'&&o.kind!=='king'&&!o.noEst){if(est*(o.bonus?1.8:.95)>=o.need)est=Math.sqrt(est*est+o.mass*.5*.8);if(!o.bonus&&estB*.95>=o.need)estB=Math.sqrt(estB*estB+o.mass*.5*.8);}return o;}
 function puffAt(x,hc,big){const pr=(9+est*.22)*(big?1.5:1);const a=est*est*(big?.16:.065);puffs.push({x,dy:-hc,r:pr,a,got:false,big:!!big,ph:R()*6});est=Math.sqrt(est*est+a*.85);}
 function vT(r){return clamp(G(r)*.152/(.7-Math.min(.4,r*.002)),220+2*r,900+5*r)}
function puffArc(i0,n,hi){// puffs sit on the path of one well-timed hop
  const r=est,v=vT(r),tu=Math.sqrt(2*jumpH(r)/Gair(r)),jh=jumpH(r)*(hi?1.6:1),pr=9+r*.22,floor=2.1*r+pr+8;n=Math.min(n,4);
  for(let k=0;k<n;k++){const u=-.55+1.1*k/(n-1);puffAt(i0*STEP+u*tu*v*(hi?1.4:1),Math.max(floor,r+jh*(1-u*u)+(r*.85+pr)*.72),false);}}
 function filler(i){const q=R();if(q<.07)addObj('pile',i,{sc:clamp(.8+estB/40,.8,3)});else if(q<.1)addObj('flag',i,{col:SKC[(R()*5)|0]});}
 function fodder(i){
  const cand=[];for(const k of allow){const b=OBJ[k];if(!b)continue;if(b.need<=estB*.9)cand.push(k)}
  if(!cand.length)return;
  // prefer meaningful sizes
  let best=cand.filter(k=>OBJ[k].need>=estB*.3||OBJ[k].kind==='stick');if(!best.length)best=cand;
  if(R()<.35)best=cand;
  const k=best[(R()*best.length)|0];let sc=1;
  if((k==='snowman'||k==='tree'||k==='fence')&&OBJ[k].need*1.5<estB*.85&&R()<.6)sc=1+R()*Math.min(2.2,(estB*.85/OBJ[k].need-1)*.7);
  addObj(k,i,{sc});
 }
 function coinArc(i0,n,hgt){for(let k=0;k<n;k++){coins.push({x:(i0+k*1.6)*STEP,dy:-(est*1.1+14+Math.sin(k/(n-1||1)*Math.PI)*hgt),got:false})}}

const FLK='<g stroke-linecap="round" stroke-width="2.6"><path d="M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9"/><path d="M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5" fill="none"/></g>';
const GICO={grow:'<svg viewBox="0 0 24 24" stroke="#2d84e0">'+FLK+'</svg>',idle:'<svg viewBox="0 0 24 24" stroke="#7fa6d6">'+FLK+'</svg>',
 air:'<svg viewBox="0 0 24 24"><g stroke="#a9b6c8">'+FLK+'</g><path d="M4 20 20 4" stroke="#e08a3a" stroke-width="3.2" stroke-linecap="round"/></svg>',
 bare:'<svg viewBox="0 0 24 24"><rect x="2" y="15" width="20" height="6" rx="2" fill="#b9a58c"/><circle cx="8" cy="15" r="2.4" fill="#8a7560"/><circle cx="15" cy="14.5" r="3" fill="#8a7560"/><g stroke="#a9b6c8" transform="translate(6 0) scale(.5)">'+FLK+'</g></svg>',
 melt:'<svg viewBox="0 0 24 24"><path d="M11 3c4 6 7 9 7 13a7 7 0 0 1-14 0c0-4 3-7 7-13z" fill="#5ab4ff" stroke="#17305a" stroke-width="1.5"/><path d="M20 4v8m-3-3 3 3 3-3" stroke="#d23b3b" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>',
 lake:'<svg viewBox="0 0 24 24"><rect x="2" y="9" width="20" height="10" rx="3" fill="#9fd6ff" stroke="#17305a" stroke-width="1.5"/><path d="M8 9l3 5-2 5M15 9l-1 4 3 3" stroke="#17305a" stroke-width="1.4" fill="none"/></svg>'};
function buildSizeMarks(){const bar=$('sizeBar');bar.querySelectorAll('.mk').forEach(e=>e.remove());const m=S.course.med,mx=m[2]*1.15;if(S.L<0)return;m.forEach((v,i)=>{const d=document.createElement('div');d.className='mk';d.style.left=(v/mx*100)+'%';d.style.background=['#d08a4a','#c9d3e0','#ffc93c'][i];bar.appendChild(d);});}
function hudTick(){if(S.mode!=='play')return;const b=S.ball,c=S.course;const t=fmtM(b.r);if(t!==lastSizeTxt){lastSizeTxt=t;const p=t.split(' ');$('sizeTxt').innerHTML=p[0]+'<small> m</small>';$('sizeTxt').style.transform='scale(1.15)';setTimeout(()=>$('sizeTxt').style.transform='',90);}
 $('sizeFill').style.width=Math.min(100,b.r/(c.med[2]*1.15)*100)+'%';
 {const gs=S.gState==='grow'&&S.gRate>.5?'grow':S.gState==='grow'?'idle':S.gState;const cls=gs==='grow'?'grow':gs==='melt'||gs==='lake'?'melt':gs==='idle'?'':'nogrow';
  if(gs!==hudGS){hudGS=gs;$('gIco').innerHTML=GICO[gs]||GICO.grow;$('sizebox').classList.toggle('grow',cls==='grow');$('sizebox').classList.toggle('nogrow',cls==='nogrow');$('sizebox').classList.toggle('melt',cls==='melt');$('sizeFill').classList.toggle('on',cls==='grow');}
  if(S.gPulse>0){S.gPulse=0;const sb=$('sizebox');sb.classList.remove('pop');void sb.offsetWidth;sb.classList.add('pop');}}$('coinTxt').textContent=save.coins+S.coinsRun;$('progBall').style.left=clamp(b.x/c.finishX,0,1)*100+'%';}

// ================= menus =================
function showScreen(id){for(const s of ['title','map','shop','result','pause'])$(s).classList.toggle('show',s===id);$('support').style.display=id==='title'?'block':'none';$('bMuteT').style.display=(id&&id!=='pause')?'block':'none';if(id){S.mode=id;$('hud').classList.remove('show');}}
function showTitle(){$('tut').classList.remove('show');showScreen('title');$('bPlay').textContent=hadSave&&save.tut?'Continue':'Play';startLevel(0,true);S.mode='title';}
function drawMuteIcons(){const svg=muted?'<svg viewBox="0 0 20 20"><path d="M3 7h3l5-4v14l-5-4H3z" fill="#17305a"/><path d="M13 7l5 6M18 7l-5 6" stroke="#d23b3b" stroke-width="2.2" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 20 20"><path d="M3 7h3l5-4v14l-5-4H3z" fill="#17305a"/><path d="M13.5 6.5a5 5 0 0 1 0 7M15.8 4a8.5 8.5 0 0 1 0 12" fill="none" stroke="#17305a" stroke-width="2" stroke-linecap="round"/></svg>';$('bMute').innerHTML=svg;$('bMuteT').innerHTML=svg;}
drawMuteIcons();
$('bMute').addEventListener('click',e=>{e.stopPropagation();setMute(!muted)});$('bMuteT').addEventListener('click',e=>{initAudio();setMute(!muted)});
$('bPause').addEventListener('click',e=>{e.stopPropagation();pause()});
$('bResume').addEventListener('click',()=>{SND.click();resume()});
$('bPRestart').addEventListener('click',()=>{resume();retry()});
$('bPMap').addEventListener('click',()=>{resume();showMap()});
$('bPlay').addEventListener('click',()=>{initAudio();SND.click();if(!save.tut)startTutorial('play');else showMap();});
$('bHow').addEventListener('click',()=>{initAudio();SND.click();startTutorial('menu');});
let mapTab=0,mapSel=0;
function showMap(){showScreen('map');S.mode='map';mapSel=clamp(Math.min(save.unlock,save.last+((save.medal[save.last]||0)>0?1:0)),0,LEVELS.length-1);mapTab=mapSel>=10?1:0;renderMap();if(!S.course||!S.demo)startLevel(0,true);S.mode='map';}
function renderMap(){$('mapCoins').textContent=save.coins;$('tabG').classList.toggle('on',mapTab===0);$('tabB').classList.toggle('on',mapTab===1);const g=$('mapGrid');g.innerHTML='';
 for(let i=mapTab*10;i<mapTab*10+10;i++){const L=LEVELS[i];const lock=i>save.unlock;const b=document.createElement('button');b.className='tile'+(lock?' lock':'')+(i>=10&&!lock?' black':'')+(i===mapSel?' sel':'');
  const m=save.medal[i]||0;b.innerHTML='<svg class="mt" viewBox="0 0 100 60" preserveAspectRatio="none"><path d="M0 60 L0 40 L22 18 L34 30 L55 6 L75 28 L86 20 L100 34 L100 60Z" fill="'+(lock?'#c4ccd8':'#eef6ff')+'"/><path d="M55 6 L48 16 L55 13 L60 18 L65 14Z" fill="#fff"/><path d="M0 60 L100 60 L100 48 Q50 38 0 52Z" fill="'+(lock?'#aab4c4':'#d4e6fa')+'"/></svg><span class="num">'+(lock?'<svg viewBox="0 0 20 22" style="width:.9em;height:1em"><rect x="3" y="9" width="14" height="12" rx="3" fill="#fff"/><path d="M6 9V6a4 4 0 0 1 8 0v3" stroke="#fff" stroke-width="2.6" fill="none"/></svg>':i+1)+'</span>'+
   (m?'<span class="md" style="background:'+['','#d08a4a','#c9d3e0','#ffc93c'][m]+';box-shadow:0 0 0 2px #17305a"></span>':'')+'<span class="nm">'+(lock?'Locked':L.n)+(save.best[i]?'<br>'+fmtM(save.best[i]):'')+'</span>';
  if(!lock)b.addEventListener('click',()=>{SND.click();if(mapSel===i){startLevel(i);}else{mapSel=i;renderMap();}});g.appendChild(b);}
 $('tabB').disabled=save.unlock<10;$('tabB').style.opacity=save.unlock<10?.5:1;}
$('tabG').addEventListener('click',()=>{mapTab=0;renderMap()});$('tabB').addEventListener('click',()=>{if(save.unlock>=10){mapTab=1;renderMap()}});
$('bGo').addEventListener('click',()=>{SND.click();startLevel(mapSel)});
$('bMapBack').addEventListener('click',()=>{SND.click();showTitle()});
$('bShop').addEventListener('click',()=>{SND.click();showShop()});
$('bShopBack').addEventListener('click',()=>{SND.click();showMap()});
$('bResMap').addEventListener('click',()=>{SND.click();showMap()});
$('bRetry').addEventListener('click',()=>retry());
$('bNext').addEventListener('click',()=>{SND.click();const n=S.L+1;if(n<LEVELS.length&&save.unlock>=n)startLevel(n);else showMap();});
function showShop(){showScreen('shop');S.mode='shop';renderShop();}
function renderShop(){$('shopCoins').textContent=save.coins;const l=$('shopList');l.innerHTML='';
 for(const u of UPG){const t=save.upg[u.k];const cost=upCost(t);const d=document.createElement('div');d.className='up';
  d.innerHTML='<div class="t"><span style="width:14px;height:14px;border-radius:50%;background:'+u.c+';box-shadow:0 0 0 2px #17305a;display:inline-block"></span>'+u.n+'<span style="margin-left:auto;font-size:13px;opacity:.7">'+t+'/'+UPMAX+'</span></div><div class="d">'+u.d+'</div><div class="pips">'+Array.from({length:UPMAX},(_,i)=>'<i class="'+(i<t?'on':'')+'"></i>').join('')+'</div>';
  const bt=document.createElement('button');bt.className='btn small blue';bt.style.margin='2px 0 0';
  if(t>=UPMAX){bt.textContent='MAX';bt.disabled=true;}else{bt.innerHTML='<span class="coins" style="color:#fff;font-size:inherit"><i class="coin"></i>'+cost+'</span>';bt.disabled=save.coins<cost;}
  bt.addEventListener('click',()=>{if(save.coins>=cost&&t<UPMAX){save.coins-=cost;save.upg[u.k]++;persist();SND.coin(8);SND.pop();renderShop();}});d.appendChild(bt);l.appendChild(d);}
 const sk=$('skins');sk.innerHTML='';SKINS.forEach((s,i)=>{const own=save.skins.includes(i);const b=document.createElement('button');b.className='skin'+(save.skin===i?' on':'');const c=document.createElement('canvas');c.width=92;c.height=92;b.appendChild(c);
  const lab=document.createElement('div');lab.innerHTML=own?s.n:'<span class="coins" style="font-size:11px"><i class="coin"></i>'+s.cost+'</span>';b.appendChild(lab);
  const x=c.getContext('2d');x.scale(2,2);drawBall(x,23,23,19,i*.7,i,0,0,null);if(!own){x.fillStyle='rgba(255,255,255,.45)';x.fillRect(0,0,46,46);}
  b.addEventListener('click',()=>{if(own){save.skin=i;persist();SND.click();renderShop();}else if(save.coins>=s.cost){save.coins-=s.cost;save.skins.push(i);save.skin=i;persist();SND.golden();renderShop();}else{SND.boing();}});sk.appendChild(b);});}
function drawIcon(c,ic){const x=c.getContext('2d');const w=c.width,h=c.height;const g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,ic==='night'?'#0a1431':'#5fa8e8');g.addColorStop(1,ic==='night'?'#2b3e78':'#cde8fb');x.fillStyle=g;x.fillRect(0,0,w,h);
 x.fillStyle=ic==='lake'?'#9fd6ff':'#fff';x.beginPath();x.moveTo(0,h*.55);x.lineTo(w,h*.85);x.lineTo(w,h);x.lineTo(0,h);x.fill();
 if(ic==='ice'){x.strokeStyle='#8fe3ff';x.lineWidth=6;x.beginPath();x.moveTo(w*.3,h*.55+h*.3*.3);x.lineTo(w*.8,h*.55+h*.3*.8);x.stroke();}
 x.save();x.translate(w*.55,h*.78);
 const f={fence:dFence,tree:dTree,yeti:dYeti,king:dYeti,penguin:dPenguin,lodge:dLodge}[ic];
 // draw using main ctx functions by temporarily swapping
 if(f){x.scale(ic==='lodge'?.07:ic==='yeti'||ic==='king'?.4:.9,ic==='lodge'?.07:ic==='yeti'||ic==='king'?.4:.9);swapCtx(x,()=>f({t:1,x:0,id:1,type:ic}));}
 else if(ic==='puff'){swapCtx(x,()=>{ctx.fillStyle='#a9d6ff';puffShape(8,-30,13,1);ctx.fill();ctx.fillStyle='#fff';puffShape(8,-31,12,1);ctx.fill();ctx.fillStyle='#ffe7a0';puffShape(30,-44,9,2);ctx.fill();});}
 else if(ic==='jump'){x.fillStyle='#fff';x.beginPath();x.moveTo(-40,0);x.quadraticCurveTo(-5,0,5,-22);x.lineTo(5,0);x.fill();x.strokeStyle='#17305a';x.lineWidth=2;x.stroke();}
 else if(ic==='ava'){x.fillStyle='#fff';for(let k=0;k<6;k++){x.beginPath();x.arc(-30+k*5,-k*7,10,0,7);x.fill();}}
 else if(ic==='lift'){x.strokeStyle='#2b3550';x.lineWidth=2;x.beginPath();x.moveTo(-50,-40);x.lineTo(50,-20);x.stroke();x.fillStyle='#ff6f91';x.fillRect(-5,-18,18,4);}
 else if(ic==='night'){x.fillStyle='#ffd36b';x.beginPath();x.arc(0,-26,6,0,7);x.fill();x.fillStyle='#2b3550';x.fillRect(-1,-22,3,22);}
 else if(ic==='wind'){x.strokeStyle='#fff';x.lineWidth=3;for(let k=0;k<3;k++){x.beginPath();x.moveTo(-30,-10-k*9);x.lineTo(20,-10-k*9);x.stroke();}}
 x.restore();
 x.save();x.translate(w*.25,h*.5);swapCtx(x,()=>drawBall(x,0,0,9,1,save.skin,0,0,null));x.restore();}
function swapCtx(x,fn){const real=ctx;ctx=x;try{fn()}finally{ctx=real}}
// ================= loop =================
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);let dt=(now-lastT)/1000;lastT=now;if(!(dt>0))dt=.016;dt=Math.min(dt,.05);S.rt+=dt;
 if(S.course&&(S.mode==='play'&&!S.paused||S.demo&&S.mode!=='play'))update(dt);
 else if(S.course&&S.mode==='result'){updateFx(dt*.5);}
 tutTick(dt);hudTick();render();if(AC)musicTick();}
showTitle();requestAnimationFrame(frame);
window.__sb={S,save:()=>save,input,LEVELS,setSave:o=>{save=Object.assign(defSave(),o);persist();},startLevel,fmtM,buildCourse,update,press,release,tutTick};
</script>

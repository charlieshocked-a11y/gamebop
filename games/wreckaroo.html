<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wreckaroo</title>
<style>
:root{--y:#ffc21a;--y2:#ffe066;--yd:#e09a00;--ink:#2a1c12;--org:#ff7a1a;--red:#e2432e;--cream:#fff3dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#3a1d3a;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{font-family:"Arial Black","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;color:var(--ink)}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;cursor:pointer}
.scr{position:fixed;inset:0;display:none;z-index:5;pointer-events:none}
.scr.on{display:block}
button{font-family:inherit}
.btn{pointer-events:auto;font:900 19px/1 "Arial Black",Impact,"Trebuchet MS",sans-serif;color:var(--ink);cursor:pointer;padding:12px 20px;letter-spacing:.5px;text-transform:uppercase;
 background:radial-gradient(circle at 9px 9px,#7a5a1a 2.5px,transparent 3.5px),radial-gradient(circle at calc(100% - 9px) 9px,#7a5a1a 2.5px,transparent 3.5px),linear-gradient(#ffe46e,#ffc21a 55%,#f0a400);
 border:3px solid var(--ink);border-radius:5px 14px 5px 14px;box-shadow:0 5px 0 var(--ink),0 10px 18px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.6);
 transition:transform .14s cubic-bezier(.3,1.8,.5,1),box-shadow .08s;position:relative;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{transform:translateY(-2px) rotate(-1.2deg) scale(1.04)}
.btn:active,.btn.dn{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--ink),0 3px 6px rgba(0,0,0,.3);transition-duration:.04s}
.btn.big{font-size:32px;padding:16px 40px 16px 40px;border-width:4px}
.btn.big::before,.btn.big::after{content:"";position:absolute;top:6px;bottom:6px;width:16px;background:repeating-linear-gradient(-45deg,var(--ink) 0 6px,transparent 6px 12px);border-radius:2px;opacity:.85}
.btn.big::before{left:8px}.btn.big::after{right:8px}
.btn.tag{background:linear-gradient(#fff6e2,#f3dcae);font-size:16px;padding:10px 16px;border-radius:4px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);padding-left:22px}
.btn.org{background:linear-gradient(#ffa24a,#ff7a1a 60%,#e8600a);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn.ico{width:46px;height:46px;padding:0;border-radius:50%;font-size:18px}
.btn.ico svg{width:24px;height:24px}
.btn[disabled]{filter:grayscale(.9) brightness(.8);cursor:default}
#menu .wrap{position:absolute;left:0;right:0;top:calc(4vh + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:center;gap:6px}
#logo{display:flex;align-items:flex-end;font:900 clamp(46px,11.5vw,112px)/1 "Arial Black",Impact,sans-serif;letter-spacing:-1px;filter:drop-shadow(0 10px 14px rgba(40,10,30,.45))}
#logo span{display:inline-block;color:#ffcb2e;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;
 text-shadow:0 2px 0 #e89a00,0 4px 0 #c57d00,0 6px 0 #a96600,0 8px 0 var(--ink),0 9px 0 var(--ink);animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
#logo span:nth-child(odd){color:#ffd84a}
#logo span:nth-child(3n){color:#ffb51a}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-6px) rotate(calc(var(--r,0deg)*-1))}}
#logo .ballo{width:.8em;height:1em;position:relative;margin-left:.03em;animation:none;-webkit-text-stroke:0;text-shadow:none}
#logo .ballo i{position:absolute;left:50%;top:-.42em;width:4px;height:.58em;margin-left:-2px;background:repeating-linear-gradient(#2a1c12 0 5px,#7d6a5a 5px 8px);transform-origin:50% 0;animation:swingo 1.6s ease-in-out infinite}
#logo .ballo b{position:absolute;left:50%;top:.14em;width:.74em;height:.74em;margin-left:-.37em;box-shadow:0 .06em 0 var(--ink),inset 0 0 0 .05em #ffcb2e;border-radius:50%;background:radial-gradient(circle at 34% 30%,#c9ced6 0 8%,#69707c 30%,#2b2f37 70%,#15171b);border:3px solid var(--ink);transform-origin:50% -.56em;animation:swingb 1.6s ease-in-out infinite}
@keyframes swingo{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
@keyframes swingb{0%,100%{transform:rotate(7deg)}50%{transform:rotate(-7deg)}}
#tagline{font:900 clamp(12px,2.6vw,17px)/1 "Arial Black",sans-serif;color:var(--ink);background:var(--y);padding:7px 34px;border:3px solid var(--ink);transform:rotate(-2deg);position:relative;letter-spacing:2px;box-shadow:0 4px 0 var(--ink)}
#tagline::before,#tagline::after{content:"";position:absolute;top:0;bottom:0;width:22px;background:repeating-linear-gradient(-45deg,var(--ink) 0 5px,transparent 5px 10px)}
#tagline::before{left:4px}#tagline::after{right:4px}
#menu .btns{position:absolute;left:0;right:0;bottom:calc(9vh + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
#menu .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:0 16px}
@media (max-width:520px){#menu .row .btn.tag{font-size:13px;padding:9px 11px 9px 19px}#menu .row{gap:7px}}
#mstats{pointer-events:none;font-size:14px;color:#fff6e2;text-shadow:0 2px 0 rgba(0,0,0,.5);display:flex;gap:14px}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font:700 11.5px/1 "Trebuchet MS",sans-serif;color:#fff6e6;opacity:.55;text-decoration:none;pointer-events:auto;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.3px}
#support:hover{opacity:1}
#muteM{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom))}
/* HUD */
#hud .tl{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#lvlSign{background:linear-gradient(#ffe46e,#ffc21a);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);padding:5px 12px 6px 34px;font-size:15px;position:relative;border-radius:3px;max-width:58vw;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#lvlSign::before{content:"";position:absolute;left:0;top:0;bottom:0;width:24px;background:repeating-linear-gradient(-45deg,var(--ink) 0 5px,var(--y) 5px 10px);border-right:3px solid var(--ink)}
#lvlSign b{color:#b33a12;margin-right:6px}
#goal{display:flex;gap:4px;align-items:center;background:rgba(42,28,18,.72);padding:4px 9px 4px 6px;border-radius:14px;color:#fff;font-size:13px}
#goal svg{width:20px;height:20px}
#goal .fl{transition:transform .3s cubic-bezier(.3,1.8,.5,1),opacity .3s}
#goal .fl.dn{opacity:.35;transform:scale(.8) rotate(-20deg)}
#hud .tr{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start}
#ballsBox{display:flex;gap:3px;background:rgba(42,28,18,.72);padding:5px 8px;border-radius:16px;align-items:center;height:34px}
#ballsBox i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9dde3 0 10%,#6c737e 35%,#24272d 75%);border:2px solid #111;transition:transform .3s cubic-bezier(.3,1.8,.5,1),opacity .3s}
#ballsBox i.u{opacity:.22;transform:scale(.7)}
#coinBox{background:rgba(42,28,18,.72);padding:5px 10px 5px 6px;border-radius:16px;color:#ffd84a;font-size:15px;display:flex;align-items:center;gap:5px;height:34px;transition:transform .15s}
#coinBox.bump{transform:scale(1.18)}
#coinBox i{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#ffc21a 45%,#c47f00);border:2px solid #6a4200}
#hud .btn.ico{width:38px;height:38px;font-size:15px;border-width:2px;box-shadow:0 3px 0 var(--ink)}
#hud .btn.ico svg{width:20px;height:20px}
#hint{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;gap:8px;align-items:center;color:#fff;font-size:14px;background:rgba(42,28,18,.7);padding:6px 12px;border-radius:18px;pointer-events:none;transition:opacity .6s;white-space:nowrap}
#hint kbd,#tut kbd{font:900 12px/1 "Arial Black",sans-serif;background:#fff6e2;color:var(--ink);border:2px solid var(--ink);border-bottom-width:4px;border-radius:5px;padding:4px 8px}
#hint.off{opacity:0}
/* tutorial */
#tut .cap{position:absolute;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:linear-gradient(#ffe46e,#ffc21a);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 20px;font-size:clamp(17px,4.4vw,24px);white-space:nowrap;border-radius:4px 16px 4px 16px;display:flex;gap:10px;align-items:center}
#tut .cap.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
#tut .cap.go{background:linear-gradient(#b4ff9a,#4fe36a)}
@keyframes pop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#tHand{position:absolute;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));width:84px;height:84px;margin-left:-42px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
#tHand.press{animation:press 1.1s ease-in-out infinite}
#tHand.lift{animation:liftH .9s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(-10px)}30%,80%{transform:translateY(6px) scale(.94)}}
@keyframes liftH{0%,100%{transform:translateY(6px) scale(.94)}50%{transform:translateY(-22px) rotate(-8deg)}}
#tSkip{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));pointer-events:auto;font-size:14px;padding:8px 16px}
#tSkip:hover{transform:translateX(-50%) translateY(-2px)}
#tSkip:active{transform:translateX(-50%) translateY(3px)}
/* panels */
.veil{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(30,10,30,.25),rgba(20,6,20,.7));pointer-events:auto}
.panel{position:absolute;left:50%;top:50%;width:min(440px,92vw);transform:translate(-50%,-50%);pointer-events:auto;background:linear-gradient(#ffe46e,#ffc21a 60%,#f2ad10);border:4px solid var(--ink);border-radius:6px;box-shadow:0 8px 0 var(--ink),0 20px 40px rgba(0,0,0,.45);padding:34px 18px 18px;text-align:center}
.panel::before{content:"";position:absolute;left:-4px;right:-4px;top:-4px;height:20px;background:repeating-linear-gradient(-45deg,var(--ink) 0 11px,var(--y) 11px 22px);border:4px solid var(--ink);border-radius:6px 6px 0 0}
.panel.in{animation:drop .6s cubic-bezier(.2,1.5,.4,1)}
@keyframes drop{from{transform:translate(-50%,-160%) rotate(-6deg)}}
.panel h2{margin:4px 0 6px;font-size:clamp(28px,8vw,40px);line-height:1;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink)}
.stars{display:flex;justify-content:center;gap:6px;margin:4px auto 10px;background:#2a1c12;border-radius:40px;padding:8px 18px 6px;width:max-content;box-shadow:inset 0 3px 0 rgba(0,0,0,.4)}
.stars i{width:58px;height:58px;display:block;background:no-repeat center/contain;transform:scale(0);transition:transform .45s cubic-bezier(.2,1.9,.4,1)}
.stars i:nth-child(2){width:70px;height:70px;margin-top:-10px}
.stars i.on{transform:scale(1)}
.stats{display:flex;justify-content:center;gap:10px;margin:2px 0 10px;flex-wrap:wrap}
.stats div{background:rgba(42,28,18,.85);color:#fff;border-radius:12px;padding:6px 12px;font-size:17px;display:flex;align-items:center;gap:6px}
.stats svg{width:20px;height:20px}
.tease{background:#2a1c12;border-radius:6px;padding:6px;margin:0 0 12px;position:relative;color:#ffd84a;font-size:13px}
.tease canvas{width:100%;height:96px;display:block}
.tease span{position:absolute;left:10px;top:8px;letter-spacing:2px}
.tease em{position:absolute;right:10px;bottom:8px;font-style:normal;color:#fff}
.prow{display:flex;gap:10px;justify-content:center;align-items:center}
#lvGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;max-height:56vh;overflow:auto;padding:4px}
.lt{pointer-events:auto;cursor:pointer;background:linear-gradient(#fff6e2,#f3dcae);border:3px solid var(--ink);border-radius:4px;box-shadow:0 3px 0 var(--ink);padding:8px 2px 5px;font-size:20px;position:relative;transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
.lt:active{transform:translateY(3px)}
.lt small{display:block;font-size:11px;color:#b37a00;letter-spacing:1px;height:12px}
.lt.lock{filter:grayscale(1) brightness(.7);cursor:default}
.lt.boss{background:linear-gradient(#ffb08a,#ff7a4a)}
.lt.bonus{background:linear-gradient(#fff3a0,#ffd84a)}
#skins{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.sk{pointer-events:auto;cursor:pointer;background:linear-gradient(#fff6e2,#f3dcae);border:3px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink);padding:6px 2px;font-size:12px}
.sk canvas{width:64px;height:64px;display:block;margin:0 auto}
.sk.eq{background:linear-gradient(#9dff8a,#3fd45a)}
.sk.lock canvas{filter:brightness(.35)}
@media (max-width:520px){#lvlSign{max-width:40vw;font-size:13px;padding-left:30px}.btn.big{font-size:24px;padding:13px 30px}.panel .btn.tag{font-size:13px;padding:9px 10px 9px 18px}.prow{gap:6px}#hud .tr{gap:5px}#coinBox{font-size:13px}#ballsBox i{width:16px;height:16px}}
@media (max-aspect-ratio:9/10){#logo{font-size:13.2vw}#menu .wrap{top:calc(7vh + env(safe-area-inset-top))}#menu .btns{bottom:calc(14vh + env(safe-area-inset-bottom))}}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4;transition:opacity .25s}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="flash"></div>

<div id="menu" class="scr on">
 <div class="wrap">
  <div id="logo"><span style="--r:-4deg">W</span><span style="--r:3deg">R</span><span style="--r:-2deg">E</span><span style="--r:4deg">C</span><span style="--r:-3deg">K</span><span style="--r:2deg">A</span><span style="--r:-4deg">R</span><span style="--r:3deg">O</span><span class="ballo"><i></i><b></b></span></div>
  <div id="tagline">SWING · SMASH · WRECK</div>
 </div>
 <div class="btns">
  <button class="btn big" id="bPlay">PLAY</button>
  <div class="row"><button class="btn tag" id="bLevels">Levels</button><button class="btn tag" id="bGarage">Balls</button><button class="btn tag" id="bHow">How to play</button></div>
  <div id="mstats"></div>
 </div>
 <button class="btn ico mute" id="muteM" aria-label="Mute"></button>
 <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="hud" class="scr">
 <div class="tl"><div id="lvlSign"><b>1</b><span>Tiny Shed</span></div><div id="goal"></div></div>
 <div class="tr"><div id="coinBox"><i></i><span id="coinN">0</span></div><div id="ballsBox"></div><button class="btn ico" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1" fill="#2a1c12"/><rect x="14" y="4" width="5" height="16" rx="1" fill="#2a1c12"/></svg></button><button class="btn ico mute" id="muteH" aria-label="Mute"></button></div>
</div>
<div id="hint" class="off"><kbd>SPACE</kbd><span>or</span><svg width="22" height="22" viewBox="0 0 64 64"><path d="M26 30V10a5 5 0 0 1 10 0v16l12 3c4 1 6 4 5 8l-3 14c-1 5-4 8-9 8H31c-3 0-5-1-7-4l-9-13c-2-3 1-7 5-5l6 4z" fill="#fff6e2" stroke="#2a1c12" stroke-width="3"/></svg><span>hold · let go</span></div>

<div id="tut" class="scr">
 <div class="cap" id="tCap">Hold to swing!</div>
 <svg id="tHand" viewBox="0 0 64 64"><circle cx="31" cy="12" r="10" fill="none" stroke="#fff" stroke-width="3" opacity=".7"/><path d="M26 30V10a5 5 0 0 1 10 0v16l12 3c4 1 6 4 5 8l-3 14c-1 5-4 8-9 8H31c-3 0-5-1-7-4l-9-13c-2-3 1-7 5-5l6 4z" fill="#fff6e2" stroke="#2a1c12" stroke-width="3"/></svg>
 <button class="btn tag" id="tSkip">Skip ▸▸</button>
</div>

<div id="pause" class="scr"><div class="veil"></div><div class="panel"><h2>PAUSED</h2><div class="prow"><button class="btn tag" id="pMenu">Menu</button><button class="btn tag" id="pRetry">Retry</button><button class="btn big" id="pResume">GO</button></div></div></div>

<div id="res" class="scr"><div class="veil"></div><div class="panel" id="resP">
 <h2 id="resT">WRECKED!</h2>
 <div class="stars" id="resStars"><i></i><i></i><i></i></div>
 <div class="stats" id="resStats"></div>
 <div class="tease" id="tease"><canvas id="teaseCv" width="400" height="120"></canvas><span>NEXT</span><em id="teaseN"></em></div>
 <div class="prow"><button class="btn tag" id="rMenu">Menu</button><button class="btn tag" id="rRetry">Retry</button><button class="btn big" id="rNext">NEXT</button></div>
</div></div>

<div id="levels" class="scr"><div class="veil"></div><div class="panel"><h2>JOBS</h2><div id="lvGrid"></div><div class="prow" style="margin-top:12px"><button class="btn tag" id="lvBack">Back</button></div></div></div>
<div id="garage" class="scr"><div class="veil"></div><div class="panel"><h2>BALLS</h2><div id="skins"></div><div class="prow"><button class="btn tag" id="gBack">Back</button></div></div></div>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'),cx=cv.getContext('2d');
let VW=1,VH=1,DPR=1;
const KP='gamebop.wreckaroo.';
function lg(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function ls(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}
const defSave=()=>({lvl:1,stars:{},coins:0,skins:['iron'],skin:'iron',best:{}});
let hasSave=lg('save',null)!=null;
let S=Object.assign(defSave(),lg('save',{})||{});
function save(){ls('save',S);hasSave=true}
let muted=!!lg('mute',false);
let tutDone=!!lg('tut',false);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
function mulb(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const easeOutBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};

// ================= AUDIO =================
let AC=null,MG=null,NB=null,WH=null,pitchMul=1,quiet=false;
const lastS={};
function aInit(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
 MG=AC.createGain();MG.gain.value=muted?0:.8;
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.2;
 MG.connect(comp);comp.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
 const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=500;f.Q.value=1.4;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(MG);s.start();WH={f,g};
}
function setMute(m){muted=m;ls('mute',m);if(MG)MG.gain.setTargetAtTime(m?0:.8,AC.currentTime,.02);updMute()}
const pv=(x,v=.08)=>x*(1+(Math.random()*2-1)*v);

 if(id==='iron'||id==='spiked'){g.strokeStyle='rgba(0,0,0,.35)';g.lineWidth=2;g.beginPath();g.ellipse(0,0,r*.98,r*.3,0,0,Math.PI);g.stroke();g.fillStyle='rgba(255,255,255,.18)';for(let i=0;i<5;i++){const a=.3+i*.6;g.beginPath();g.arc(Math.cos(a)*r*.98,Math.sin(a)*r*.3,1.8,0,7);g.fill()}}
 g.fillStyle='rgba(255,255,255,.55)';g.beginPath();g.ellipse(-r*.38,-r*.42,r*.22,r*.13,-.6,0,7);g.fill();
 // lug
 g.fillStyle='#3a3e46';g.strokeStyle='#15171b';g.lineWidth=2.5;rr(g,-r*.22,-r-8,r*.44,12,3);g.fill();g.stroke();g.beginPath();g.arc(0,-r-10,5,0,7);g.stroke()}
function drawBall(b,x,y,a){const g=cx;
 if(!G.rep&&!G.paused){b.tr=b.tr||[];b.tr.push(x,y);if(b.tr.length>16)b.tr.splice(0,2);const sp=Math.hypot(b.vx,b.vy);if(sp>450&&b.tr.length>4){g.lineCap='round';for(let i=2;i<b.tr.length;i+=2){const k=i/b.tr.length;g.strokeStyle='rgba(255,236,200,'+(k*.35*Math.min(1,(sp-450)/500))+')';g.lineWidth=b.r*1.6*k;g.beginPath();g.moveTo(b.tr[i-2],b.tr[i-1]);g.lineTo(b.tr[i],b.tr[i+1]);g.stroke()}}}

 // shadow-ish rim light
 if(b.sq>.01){g.rotate(b.sqa||0);g.scale(1-b.sq,1+b.sq*.7);g.rotate(-(b.sqa||0))}
 
 if(G.arcGreen&&b===R.ball&&!G.rep){const pu=.6+.4*Math.sin(G.t*14);const gr=g.createRadialGradient(0,0,b.r*.8,0,0,b.r*1.9);gr.addColorStop(0,'rgba(141,255,106,'+.65*pu+')');gr.addColorStop(1,'rgba(141,255,106,0)');g.fillStyle=gr;g.beginPath();g.arc(0,0,b.r*1.9,0,7);g.fill()}

function drawRope(fr){const g=cx;const X=R.px,Y=R.py;let bx,by,on=R.on&&R.ball;
 if(fr){on=fr.r;}
 if(on){const b=R.ball;if(!b)return;bx=b.x;by=b.y;if(fr){const i=fr.b.indexOf(b);if(i>=0){bx=fr.b[i+1];by=fr.b[i+2]}}
  const dx=bx-X,dy=by-Y,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,ex=bx-ux*(BALLR+10),ey=by-uy*(BALLR+10);
  g.strokeStyle='#1a1a1e';g.lineWidth=5;g.beginPath();g.moveTo(X,Y);g.lineTo(ex,ey);g.stroke();
  g.strokeStyle='#8a8f98';g.lineWidth=2;g.setLineDash([6,5]);g.beginPath();g.moveTo(X,Y);g.lineTo(ex,ey);g.stroke();g.setLineDash([]);
  g.fillStyle='#ffc21a';g.strokeStyle='#2a1c12';g.lineWidth=2;g.save();g.translate(ex,ey);g.rotate(Math.atan2(uy,ux)-Math.PI/2);rr(g,-8,-12,16,10,3);g.fill();g.stroke();g.restore()}
 else{const L=40+R.retract*60,sw=Math.sin(G.t*5)*R.retract*14;g.strokeStyle='#1a1a1e';g.lineWidth=5;g.beginPath();g.moveTo(X,Y);g.lineTo(X+sw,Y+L);g.stroke();g.strokeStyle='#2a1c12';g.lineWidth=4;g.beginPath();g.arc(X+sw,Y+L+8,8,-1.2,3.6);g.stroke()}}
function drawBalloons(fr){const g=cx;G.balloons.forEach((bl,i)=>{let x=bl.x,y=bl.y,p=bl.popped;if(fr&&fr.bl[i]){x=fr.bl[i][0];y=fr.bl[i][1];p=fr.bl[i][2]}if(p&&!bl.fly)return;if(bl.fly){p=0}const h=bl.h;let ax=bl.ax||h.x+bl.lx,ay=bl.ay||h.y-h.hh;if(bl.fly){ax=x+Math.sin(G.t*3+i)*6;ay=y+70}
 g.strokeStyle='rgba(255,255,255,.8)';g.lineWidth=1.5;g.beginPath();g.moveTo(ax,ay);g.quadraticCurveTo(ax+(x-ax)*.2+Math.sin(G.t*2+i)*8,(ay+y)/2,x,y+26);g.stroke();
 const c=['#ff4a3a','#ffd23a','#3ab8ff'][bl.c];const gr=g.createRadialGradient(x-7,y-9,2,x,y,26);gr.addColorStop(0,'#fff');gr.addColorStop(.25,c);gr.addColorStop(1,c);g.fillStyle=gr;g.strokeStyle='#2a1c12';g.lineWidth=2.5;g.beginPath();g.ellipse(x,y,20,25,Math.sin(G.t*1.5+i)*.08,0,7);g.fill();g.stroke();g.fillStyle=c;g.beginPath();g.moveTo(x-4,y+28);g.lineTo(x+4,y+28);g.lineTo(x,y+23);g.fill();g.stroke()})}
function drawPigeons(){const g=cx;for(const p of G.pigeons){g.save();g.translate(p.x,p.y);g.scale(p.st?(p.vx>0?1:-1):p.dir,1);g.strokeStyle='#2a1c12';g.lineWidth=2;
 if(p.st===0){const pk=(p.t%3)<.25?4:0;g.fillStyle='#8a90a6';g.beginPath();g.ellipse(0,-9,10,7,0,0,7);g.fill();g.stroke();g.fillStyle='#6a7088';g.beginPath();g.moveTo(-10,-10);g.lineTo(-16,-6);g.lineTo(-8,-6);g.fill();
  g.fillStyle='#9aa0b8';g.beginPath();g.arc(8,-17+pk,5,0,7);g.fill();g.stroke();g.fillStyle='#ffb02a';g.beginPath();g.moveTo(12,-17+pk);g.lineTo(17,-15+pk);g.lineTo(12,-14+pk);g.fill();g.fillStyle='#000';g.fillRect(8,-19+pk,2,2);g.strokeStyle='#ff8a3a';g.beginPath();g.moveTo(-2,-3);g.lineTo(-2,0);g.moveTo(3,-3);g.lineTo(3,0);g.stroke()}
 else{const f=Math.sin(p.t*30)*10;g.fillStyle='#8a90a6';g.beginPath();g.ellipse(0,0,10,6,-.3,0,7);g.fill();g.stroke();g.fillStyle='#b4b8cc';g.beginPath();g.moveTo(-2,-2);g.lineTo(-8,-12-f);g.lineTo(6,-4);g.fill();g.stroke();g.fillStyle='#9aa0b8';g.beginPath();g.arc(9,-4,5,0,7);g.fill();g.stroke();g.fillStyle='#ffb02a';g.beginPath();g.moveTo(13,-4);g.lineTo(18,-3);g.lineTo(13,-1);g.fill()}
 g.restore()}}
function drawParts(){const g=cx;for(const p of P){const k=p.l/p.L;g.globalAlpha=1;
 switch(p.t){
 case'dust':g.globalAlpha=(1-k)*.7;g.fillStyle=p.c?p.c+(1-k)*.8+')':'rgba(235,205,170,'+(1-k)*.8+')';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();break;
 case'smoke':g.globalAlpha=(1-k)*.6;g.fillStyle='#5a4a50';g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();break;
 case'fire':{g.globalAlpha=1-k;g.fillStyle=k<.3?'#fff6b0':k<.6?'#ffb030':'#e04020';g.beginPath();g.arc(p.x,p.y,p.r*(1-k*.5),0,7);g.fill();break}
 case'chip':g.globalAlpha=k>.75?(1-k)*4:1;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r2,p.r*2,p.r2*2);g.strokeStyle='rgba(40,20,10,.6)';g.lineWidth=1;g.strokeRect(-p.r,-p.r2,p.r*2,p.r2*2);g.restore();break;
 case'shard':g.globalAlpha=k>.7?(1-k)*3.3:.9;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.beginPath();g.moveTo(-p.r,p.r2);g.lineTo(p.r*.3,-p.r);g.lineTo(p.r,p.r2*.5);g.closePath();g.fill();g.strokeStyle='rgba(40,110,150,.7)';g.lineWidth=1;g.stroke();g.restore();break;
 case'spark':g.globalAlpha=1-k;g.strokeStyle=p.c;g.lineWidth=2.5;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);g.stroke();break;
 case'ring':g.globalAlpha=(1-k)*.8;g.strokeStyle=p.c;g.lineWidth=6*(1-k)+1;g.beginPath();g.arc(p.x,p.y,lerp(p.r,p.R,1-Math.pow(1-k,3)),0,7);g.stroke();break;
 case'conf':g.globalAlpha=k>.8?(1-k)*5:1;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.scale(1,Math.sin(p.l*12));g.fillStyle=p.c;g.fillRect(-p.r/2,-p.r/3,p.r,p.r*.66);g.restore();break;
 case'drop':g.globalAlpha=1-k;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,p.r,0,7);g.fill();break;
 case'feath':g.globalAlpha=1-k;g.save();g.translate(p.x,p.y);g.rotate(p.a+Math.sin(p.l*5));g.fillStyle='#e4e6f0';g.beginPath();g.ellipse(0,0,7,2.5,0,0,7);g.fill();g.restore();break;
 case'coin':{g.save();g.translate(p.x,p.y);g.scale(Math.abs(Math.cos(p.l*10))*.8+.2,1);g.fillStyle='#ffc21a';g.strokeStyle='#6a4200';g.lineWidth=2;g.beginPath();g.arc(0,0,8,0,7);g.fill();g.stroke();g.fillStyle='#fff3a0';g.fillRect(-1.5,-4,3,8);g.restore();break}
 case'heart':g.globalAlpha=1-k;g.fillStyle='#ff4a7a';g.save();g.translate(p.x,p.y);g.scale(1+k,1+k);g.beginPath();g.moveTo(0,6);g.bezierCurveTo(-12,-4,-6,-12,0,-5);g.bezierCurveTo(6,-12,12,-4,0,6);g.fill();g.restore();break;
 case'flagp':g.save();g.translate(p.x,p.y);g.rotate(p.a);g.strokeStyle='#eee';g.lineWidth=3;g.beginPath();g.moveTo(0,-20);g.lineTo(0,20);g.stroke();g.fillStyle='#9dff8a';g.strokeStyle='#2a1c12';g.lineWidth=2;g.beginPath();g.moveTo(1,-20);g.lineTo(26,-14);g.lineTo(1,-6);g.closePath();g.fill();g.stroke();g.restore();break}}
 g.globalAlpha=1}
function drawPops(){const g=cx;for(const q of G.pops){const k=q.l/q.L;const sc=k<.2?easeOutBack(k/.2):1;g.save();g.translate(q.x,q.y-k*40);g.scale(sc,sc);g.globalAlpha=k>.7?(1-k)/.3:1;g.font='900 '+q.sz+'px "Arial Black",Impact,sans-serif';g.textAlign='center';g.textBaseline='middle';g.lineJoin='round';g.lineWidth=7;g.strokeStyle='#2a1c12';g.strokeText(q.txt,0,0);g.fillStyle=q.col;g.fillText(q.txt,0,0);g.restore()}g.globalAlpha=1}
function drawArc(){const g=cx,r=G.arc,p=r.pts,green=G.arcGreen;const col=green?'#8dff6a':'#fff6e2';if(green){g.shadowColor='#8dff6a';g.shadowBlur=14}
 for(let i=0;i<p.length;i+=2){const k=i/p.length;g.globalAlpha=(1-k*.65)*(green?1:.8);const rd=((i/2)%2?3.5:6.5)-k*2.5;g.fillStyle='rgba(42,28,18,.55)';g.beginPath();g.arc(p[i],p[i+1],rd+2,0,7);g.fill();g.fillStyle=col;g.beginPath();g.arc(p[i],p[i+1],rd,0,7);g.fill()}
 g.globalAlpha=1;g.shadowBlur=0;if(r.hit){const s=1+Math.sin(G.t*14)*.12;g.strokeStyle=green?'#8dff6a':'#ffb0a0';g.lineWidth=4;g.beginPath();g.arc(r.x,r.y,22*s,0,7);g.stroke();g.beginPath();g.moveTo(r.x-32*s,r.y);g.lineTo(r.x-14*s,r.y);g.moveTo(r.x+14*s,r.y);g.lineTo(r.x+32*s,r.y);g.moveTo(r.x,r.y-32*s);g.lineTo(r.x,r.y-14*s);g.moveTo(r.x,r.y+14*s);g.lineTo(r.x,r.y+32*s);g.stroke()}}
function drawTutArrow(){const g=cx;const f=G.flags.find(f=>!f.down)||G.flags[0];if(!f)return;const x=f.h.x+60,y0=f.h.y-40,y1=-G.line-6;const b=Math.sin(G.t*6)*6;g.strokeStyle='#ffd84a';g.lineWidth=7;g.lineCap='round';g.beginPath();g.moveTo(x,y0);g.lineTo(x,y1-14+b);g.stroke();g.fillStyle='#ffd84a';g.beginPath();g.moveTo(x-14,y1-20+b);g.lineTo(x+14,y1-20+b);g.lineTo(x,y1+b);g.fill()}
function drawForeman(){const g=cx,x=FM.x,y=FM.jy,t=G.t,D='#2a1c12';const br=Math.sin(t*2.4)*1.2;const ps=FM.pose;

 // legs
 const tuck=y<-5?6:0;limb([-6,-30,-8,-14+tuck*.5,-8,-3-tuck],'#3a5a9a',7);limb([6,-30,8,-14+tuck*.5,9,-3-tuck-tap],'#3a5a9a',7);
 g.fillStyle=D;rr(g,-15,-6-tuck,12,7,3);g.fill();rr(g,3,-6-tuck-tap,13,7,3);g.fill();
 // torso
 const ty=-32+br*.3;g.fillStyle='#ff7a1a';g.strokeStyle=D;g.lineWidth=3;rr(g,-13,ty-28,26,32,8);g.fill();g.stroke();g.fillStyle='#fff6a0';g.fillRect(-12,ty-14,24,4);g.fillRect(-12,ty-6,24,3);g.fillStyle='#3a5a9a';g.fillRect(-12,ty-2,24,6);
 // arms
 const sh=ty-24;let L,Rr;
 if(ps==='cheer'){const w=Math.sin(t*16)*8;L=[-11,sh,-20,sh-14,-18+w,sh-30];Rr=[11,sh,20,sh-14,18-w,sh-30]}
 else if(ps==='point'){L=[-11,sh,-18,sh+10,-12,sh+20];Rr=[11,sh,28,sh-6,44,sh-12]}
 else if(ps==='sad'){L=[-11,sh,-16,sh-12,-6,sh-24];Rr=[11,sh,16,sh-12,6,sh-24]}
 else if(ps==='tap'){L=[-11,sh,-22,sh+6,-12,sh+16];Rr=[11,sh,20,sh+4,30,sh+2]}
 else{L=[-11,sh,-22,sh+8,-12,sh+18];Rr=[11,sh,22,sh+8,12,sh+18]}
 limb(L,'#ff7a1a',7);limb(Rr,'#ff7a1a',7);g.fillStyle='#f2c08a';g.strokeStyle=D;g.lineWidth=2;for(const a of[L,Rr]){g.beginPath();g.arc(a[4],a[5],4.5,0,7);g.fill();g.stroke()}
 // head
 const hx=0,hy=sh-14+br*.4;const lk=(R.ball&&G.st!=='menu')?clamp((R.ball.x-x)/300,-1,1):(G.free[0]?1:.6);
 g.fillStyle='#f2c08a';g.beginPath();g.arc(hx,hy,12,0,7);g.fill();g.stroke();

 g.fillStyle='#6a3a1a';g.beginPath();g.ellipse(hx+lk*2,hy+4,7,2.6,0,0,7);g.fill();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Gale Regatta</title>
<style>
:root{--ink:#143a5c;--ink2:#0d2840;--cloth:#fbf3e1;--cloth2:#eadcbc;--red:#e5483a;--redD:#9c2a20;--brass:#e8b04a;--sea:#2aa3c4}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0d2840;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.ov{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
.ov.show{display:block}
.serif{font-family:Georgia,"Palatino Linotype","Book Antiqua",Palatino,serif;font-style:italic}
.btn{pointer-events:auto;font:inherit;font-weight:800;border:0;cursor:pointer;color:var(--ink);padding:11px 22px;font-size:19px;line-height:1;letter-spacing:.3px;
 border-radius:14px 16px 13px 17px;background:linear-gradient(#fffaf0,#f3e6c8 60%,#e6d3ab);
 box-shadow:0 5px 0 #9a7f52,0 10px 18px rgba(5,20,40,.35),inset 0 2px 0 #fff;
 outline:2px dashed rgba(20,58,92,.22);outline-offset:-6px;position:relative;transition:transform .08s,box-shadow .08s,filter .12s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn:active,.btn.press{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #9a7f52,0 3px 6px rgba(5,20,40,.3),inset 0 2px 0 #fff}
.btn.red{color:#fff;background:linear-gradient(#ff7a62,#e5483a 55%,#c9372b);box-shadow:0 5px 0 var(--redD),0 10px 18px rgba(5,20,40,.4),inset 0 2px 0 rgba(255,255,255,.45);outline-color:rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(110,20,10,.4)}
.btn.red:active{box-shadow:0 1px 0 var(--redD),inset 0 2px 0 rgba(255,255,255,.45)}
.btn.navy{color:var(--cloth);background:linear-gradient(#2b5f8c,#174169);box-shadow:0 5px 0 #0a2238,0 10px 18px rgba(5,20,40,.4),inset 0 2px 0 rgba(255,255,255,.25);outline-color:rgba(255,255,255,.25)}
.btn.big{font-size:27px;padding:15px 46px;border-radius:18px 22px 17px 21px}
.btn.sm{font-size:14px;padding:8px 12px;outline-offset:-4px}
.btn.ico{width:44px;height:44px;padding:0;border-radius:50%;outline-offset:-5px}
.btn[disabled]{filter:grayscale(.7) brightness(.8);cursor:default}
.btn svg{width:22px;height:22px;flex:none}
.btn.sm svg{width:16px;height:16px}
/* title */
#title .logo{position:absolute;left:50%;top:max(6vh,calc(18px + env(safe-area-inset-top)));transform:translateX(-50%);width:min(680px,92vw);animation:logoIn .9s cubic-bezier(.2,1.4,.4,1) both}
#title .logo svg{width:100%;height:auto;display:block;filter:drop-shadow(0 8px 14px rgba(5,25,45,.45))}
@keyframes logoIn{from{opacity:0;transform:translate(-50%,-30px) scale(.85) rotate(-3deg)}to{opacity:1;transform:translate(-50%,0)}}
#title .tb{position:absolute;bottom:max(7vh,calc(30px + env(safe-area-inset-bottom)));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .8s cubic-bezier(.3,1.5,.6,1) both .25s}
.row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
@keyframes rise{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{0%{opacity:0;transform:scale(.7)}65%{opacity:1;transform:scale(1.05)}100%{transform:scale(1)}}
@keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff8e8;opacity:.55;text-decoration:none;pointer-events:auto;text-shadow:0 1px 2px rgba(0,0,0,.5);letter-spacing:.3px;transition:opacity .2s}
#support:hover{opacity:1}
.corner{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px;pointer-events:auto}
/* panels */
.panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,94vw);max-height:calc(100vh - 24px);overflow:auto;
 background:radial-gradient(120% 90% at 30% 20%,#fdf6e6,#f2e3c2 70%,#e8d3a8) padding-box,repeating-linear-gradient(45deg,#b0824a 0 5px,#e0bb80 5px 10px) border-box;
 border:7px solid transparent;border-radius:22px;box-shadow:0 18px 50px rgba(3,15,30,.55);padding:16px 18px;color:var(--ink);animation:panIn .45s cubic-bezier(.2,1.3,.4,1) both;scrollbar-width:none}
.panel::-webkit-scrollbar{display:none}
@keyframes panIn{from{opacity:0;transform:translate(-50%,-42%) scale(.92)}to{opacity:1;transform:translate(-50%,-50%)}}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ph h2{margin:0;font-family:Georgia,"Palatino Linotype",serif;font-style:italic;font-size:30px;color:var(--ink);text-shadow:0 2px 0 rgba(255,255,255,.8);flex:1}
.coins{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:19px;background:var(--ink);color:#ffe9a8;padding:6px 12px 6px 7px;border-radius:20px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6bf,#f4c03a 55%,#b9821c);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 2px #8a5a10 inset}
.venues{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.ven{position:relative;border-radius:14px;overflow:hidden;cursor:pointer;aspect-ratio:1/1.05;border:3px solid #fff;box-shadow:0 4px 0 #9a7f52,0 6px 12px rgba(0,0,0,.2);transition:transform .2s cubic-bezier(.3,1.8,.5,1);background:#246}
.ven canvas{width:100%;height:100%;display:block}
.ven b{position:absolute;left:0;right:0;bottom:0;padding:3px 2px 4px;font-size:12px;text-align:center;color:#fff;background:linear-gradient(transparent,rgba(5,20,40,.8));text-shadow:0 1px 2px #000}
.ven.on{transform:translateY(-4px) scale(1.05);border-color:var(--brass);box-shadow:0 0 0 3px var(--red),0 8px 14px rgba(0,0,0,.3)}
.ven.lock{filter:grayscale(.85) brightness(.7);cursor:default}
.ven .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.ven .lk svg{width:34%;height:34%}
.ven .tro{position:absolute;top:4px;right:4px;width:24px;height:24px}
.races{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0 6px}
.race{pointer-events:auto;cursor:pointer;width:118px;border:0;font:inherit;background:none;padding:0;position:relative;transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
.race:hover{transform:translateY(-3px) rotate(-1.5deg)}
.race .flag{height:92px;border-radius:12px 12px 14px 14px;background:linear-gradient(#fffaf0,#efdfbd);box-shadow:0 4px 0 #9a7f52,0 6px 12px rgba(0,0,0,.18);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px}
.race .n{font-family:Georgia,serif;font-style:italic;font-weight:900;font-size:26px;color:var(--ink);line-height:1}
.race .t{font-size:12px;font-weight:800;color:#5a6a78;line-height:1.1;text-align:center}
.race .m{height:22px;display:flex;gap:4px;align-items:center;font-size:12px;font-weight:800;color:#5a6a78}
.race .m svg{width:22px;height:22px}
.race.lock{cursor:default;filter:grayscale(1);opacity:.55}
.race.next .flag{background:linear-gradient(#ff8a6e,#e5483a);box-shadow:0 4px 0 var(--redD),0 0 0 3px #fff inset,0 8px 16px rgba(200,40,20,.3)}
.race.next .n,.race.next .t,.race.next .m{color:#fff}
.race.next{animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.vinfo{display:flex;align-items:center;justify-content:center;gap:14px;font-weight:800;color:#506070;font-size:14px;flex-wrap:wrap}
.vinfo span{display:inline-flex;align-items:center;gap:5px}
.vinfo svg{width:18px;height:18px}
.foot{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
/* dock */
.dock{display:grid;grid-template-columns:minmax(220px,1fr) 1.35fr;gap:14px}
.prev{border-radius:16px;overflow:hidden;background:#1d6f9a;min-height:230px;position:relative;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.prev canvas{width:100%;height:100%;display:block;position:absolute;inset:0}
.prev .nm{position:absolute;left:10px;top:8px;font-family:Georgia,serif;font-style:italic;font-weight:900;font-size:24px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.prev .stats{position:absolute;left:10px;right:10px;bottom:10px;display:grid;grid-template-columns:auto 1fr;gap:3px 8px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 1px #000}
.bar{height:8px;border-radius:5px;background:rgba(0,0,0,.35);overflow:hidden;align-self:center}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd36a,#ff8a4a);border-radius:5px;transition:width .4s cubic-bezier(.2,1.3,.4,1)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs .btn{flex:1}
.tabs .btn.on{background:linear-gradient(#2b5f8c,#174169);color:#fff;box-shadow:0 2px 0 #0a2238}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.55);border-radius:12px;padding:7px 9px;box-shadow:0 2px 0 rgba(150,120,70,.35)}
.item .ic{width:44px;height:44px;flex:none}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:16px}
.item .tx small{color:#5a6a78;font-weight:700;font-size:12px}
.pips{display:flex;gap:3px;margin-top:3px}
.pips i{width:16px;height:7px;border-radius:3px;background:#cdbb95}
.pips i.on{background:linear-gradient(#ffcf5a,#e8902a)}
.item.sel{box-shadow:0 0 0 3px var(--red)}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{pointer-events:auto;width:48px;height:48px;border-radius:12px;border:3px solid #fff;cursor:pointer;position:relative;box-shadow:0 3px 0 #9a7f52;padding:0;overflow:hidden;background:#ccc}
.sw button.on{border-color:var(--red);transform:scale(1.08)}
.sw button .pr{position:absolute;left:0;right:0;bottom:0;font-size:10px;font-weight:900;background:rgba(10,30,50,.75);color:#ffe9a8}
.sw button canvas{width:100%;height:100%}
.lbl{font-weight:900;font-size:13px;color:#5a6a78;margin:10px 0 6px;text-transform:uppercase;letter-spacing:1px}
/* achievements */
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.ach{text-align:center;font-size:11.5px;font-weight:800;color:#5a6a78;line-height:1.15}
.ach .bd{width:58px;height:58px;margin:0 auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#fff3b8,#e9b23f 60%,#a56d12);box-shadow:0 3px 0 #7a4f0c,inset 0 0 0 3px rgba(255,255,255,.5)}
.ach .bd svg{width:32px;height:32px}
.ach.no{opacity:.45}.ach.no .bd{background:#c9bc9e;box-shadow:0 3px 0 #a09070}
.ach.no .bd svg{opacity:.4}
.medals{display:flex;gap:16px;justify-content:center;font-weight:900;font-size:20px;margin-bottom:12px}
.medals span{display:inline-flex;align-items:center;gap:5px}
.medals svg{width:28px;height:28px}
/* results */
#res .panel{width:min(480px,94vw);text-align:center}
.place{font-family:Georgia,serif;font-style:italic;font-weight:900;font-size:76px;line-height:1;color:var(--ink);text-shadow:0 4px 0 #fff,0 7px 0 rgba(20,58,92,.2)}
.place sup{font-size:32px}
.medalBig{width:120px;height:140px;margin:-6px auto 0;animation:medalDrop .9s cubic-bezier(.2,1.6,.4,1) both .2s}
@keyframes medalDrop{from{opacity:0;transform:translateY(-80px) rotate(-30deg) scale(.6)}to{opacity:1;transform:none}}
.rstat{display:flex;justify-content:center;gap:18px;font-weight:800;font-size:15px;color:#506070;margin:8px 0;flex-wrap:wrap}
.rstat b{display:block;font-size:22px;color:var(--ink)}
.tag{display:inline-block;background:var(--red);color:#fff;font-weight:900;font-size:13px;padding:4px 10px;border-radius:10px;transform:rotate(-3deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1) both .9s;margin:2px}
.tag.gold{background:linear-gradient(#ffd25a,#e8992a);color:#5a3200}
.board{margin:8px auto;max-width:340px;text-align:left;font-weight:800;font-size:14px}
.board div{display:flex;align-items:center;gap:8px;padding:3px 8px;border-radius:8px;animation:slideUp .4s cubic-bezier(.2,1.3,.4,1) both}
.board div.me{background:rgba(229,72,58,.18)}
.board i{width:14px;height:14px;border-radius:50%;display:inline-block;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.board em{margin-left:auto;font-style:normal;color:#5a6a78}
/* hud */
#hud .tl{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:7px}
#hud .tl .btn{pointer-events:auto}
.touch .tc{display:block}
.tc{display:none}
.pad{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;pointer-events:auto;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.45),rgba(255,255,255,.16));border:3px solid rgba(255,255,255,.6);box-shadow:0 6px 14px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;touch-action:none}
.pad svg{width:40px;height:40px}
.pad.on{background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,.3));transform:scale(.93)}
#pL{left:calc(14px + env(safe-area-inset-left))}
#pR{left:calc(110px + env(safe-area-inset-left))}
#pT{width:66px;height:66px;left:calc(68px + env(safe-area-inset-left));bottom:calc(112px + env(safe-area-inset-bottom));font-weight:900;color:#fff;font-size:13px;flex-direction:column;text-shadow:0 1px 2px rgba(0,0,0,.5)}
#pT svg{width:26px;height:26px}
#trim{position:absolute;right:calc(16px + env(safe-area-inset-right));bottom:calc(20px + env(safe-area-inset-bottom));width:66px;height:200px;border-radius:33px;pointer-events:auto;touch-action:none;background:rgba(255,255,255,.18);border:3px solid rgba(255,255,255,.55);box-shadow:0 6px 14px rgba(0,0,0,.25)}
#trim .zone{position:absolute;left:6px;right:6px;border-radius:12px;background:rgba(120,255,170,.45);box-shadow:0 0 14px rgba(120,255,170,.7)}
#trim .knob{position:absolute;left:5px;width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fffaf0,#e6d3ab);box-shadow:0 4px 0 #9a7f52,0 6px 10px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#trim .knob svg{width:28px;height:28px}
#trim .tl2{position:absolute;left:0;right:0;text-align:center;font-size:10px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000}
/* tutorial */
#tut .cap{position:absolute;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--cloth);padding:11px 20px;border-radius:16px 20px 15px 19px;font-weight:900;font-size:21px;box-shadow:0 5px 0 #9a7f52,0 12px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;white-space:nowrap;animation:capIn .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes capIn{from{opacity:0;transform:translate(-50%,-20px) scale(.8)}to{opacity:1;transform:translate(-50%,0)}}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:32px;height:32px;padding:0 7px;border-radius:7px;background:#fff;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-size:15px;font-weight:900;color:var(--ink);animation:keyTap 1s ease-in-out infinite}
.key+.key{animation-delay:.5s}
@keyframes keyTap{0%,60%,100%{transform:none;box-shadow:0 3px 0 var(--ink)}30%{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}}
#tutSkip{position:absolute;left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top));pointer-events:auto}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));z-index:30;transform:translate(-50%,-140%);transition:transform .5s cubic-bezier(.2,1.4,.4,1);display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;padding:7px 16px 7px 8px;border-radius:30px;font-weight:800;box-shadow:0 8px 20px rgba(0,0,0,.4);pointer-events:none}
#toast.show{transform:translate(-50%,0)}
#toast .bd{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b8,#e9b23f 60%,#a56d12);display:flex;align-items:center;justify-content:center}
#toast .bd svg{width:24px;height:24px}
#toast small{display:block;font-size:11px;color:#ffd56a;letter-spacing:1px}
#fade{position:fixed;inset:0;background:#0d2840;z-index:40;pointer-events:none;opacity:0;transition:opacity .28s ease}
@media (max-width:640px){
 .venues{grid-template-columns:repeat(3,1fr)}
 .dock{grid-template-columns:1fr}.prev{min-height:190px}
 .race{width:92px}.race .flag{height:84px}.race .n{font-size:22px}
 .btn.big{font-size:24px;padding:14px 36px}
 .btn{font-size:17px;padding:10px 16px}
 .ph h2{font-size:24px}
 #tut .cap{font-size:17px;padding:9px 14px;top:calc(112px + env(safe-area-inset-top))}
 .place{font-size:60px}
}
@media (max-height:500px){#title .logo{width:min(520px,70vw);top:10px}#title .tb{bottom:14px;gap:8px}.btn.big{font-size:22px;padding:11px 34px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ov">
 <div class="logo">
  <svg viewBox="0 0 680 250" aria-label="Gale Regatta">
   <defs>
    <linearGradient id="lg1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffdf5"/><stop offset=".55" stop-color="#ffe9b0"/><stop offset="1" stop-color="#f3b24a"/></linearGradient>
    <linearGradient id="lg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff8a6a"/><stop offset="1" stop-color="#d63a2c"/></linearGradient>
    <linearGradient id="sl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e9dcc0"/></linearGradient>
   </defs>
   <g transform="translate(40,18)">
    <path d="M58 8 L58 150 L8 150 Q30 80 58 8Z" fill="url(#lg2)" stroke="#0d2840" stroke-width="7" stroke-linejoin="round"/>
    <path d="M66 0 L66 150 L132 150 Q118 70 66 0Z" fill="url(#sl)" stroke="#0d2840" stroke-width="7" stroke-linejoin="round"/>
    <path d="M78 60 Q100 90 108 128" stroke="#e5483a" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M0 160 L140 160 Q132 186 104 190 L22 190 Q6 182 0 160Z" fill="#143a5c" stroke="#0d2840" stroke-width="6" stroke-linejoin="round"/>
    <path d="M10 168 L132 168" stroke="#e8b04a" stroke-width="4"/>
   </g>
   <text x="200" y="112" font-family="Georgia,'Palatino Linotype',serif" font-style="italic" font-weight="900" font-size="104" fill="url(#lg1)" stroke="#0d2840" stroke-width="14" stroke-linejoin="round" paint-order="stroke" letter-spacing="2">Gale</text>
   <text x="186" y="208" font-family="Georgia,'Palatino Linotype',serif" font-style="italic" font-weight="900" font-size="96" fill="url(#lg1)" stroke="#0d2840" stroke-width="14" stroke-linejoin="round" paint-order="stroke">Regatta</text>
   <path d="M196 228 q22 -14 44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0 t44 0" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9"/>
   <path d="M470 40 q30 -12 70 -2 q-26 6 -40 20" stroke="#fff" stroke-width="6" fill="none" stroke-linecap="round" opacity=".75"/>
   <path d="M430 66 q40 -10 90 0" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity=".55"/>
  </svg>
 </div>
 <div class="tb">
  <button class="btn red big" id="bPlay"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#fff"/></svg><span id="playLbl">Play</span></button>

  drawLand(T);

  for (const g of G.gulls) { g.x = g.cx + Math.cos(g.a) * g.r; g.y = g.cy + Math.sin(g.a) * g.r; }
  // no-go cone teaching aid

    planeT(); const pt = p.point * D2R, d = p.wdir, R = 170; const g = ctx.createRadialGradient(p.x, p.y, 20, p.x, p.y, R);

    const m = G.marks[0]; m.x = bx; m.y = by; const f = G.marks[1]; f.x = bx + 60; f.y = by + 620; f.ax = f.x - 170; f.ay = f.y; f.bx = f.x + 170; f.by = f.y; G.tackBase = p.tacks + (p.gybes || 0); p.mi = 0;
  }
  tutShow();
}
function tutTick(dt) {
  const p = G.player, s = G.tutStep; if (s >= 5) return;
  if (s == 0 && G.steerT > .7) tutAdvance(1);
  else if (s == 1) { if (p.perfect) G.perfT += dt; if (G.perfT > .5) tutAdvance(2); }
  else if (s == 2) { if (p.mi >= 1) tutAdvance(4); else if (p.tacks + (p.gybes || 0) > G.tackBase) tutAdvance(3); }
  else if (s == 3 && p.mi >= 1) tutAdvance(4);
}
function tutDraw(T) {
  const p = G.player; screenT(); const [sx, sy] = w2s(p.x, p.y); const s = G.tutStep;
  const bob = Math.sin(T * 5) * 6;
  ctx.strokeStyle = '#ffe27a'; ctx.fillStyle = '#ffe27a'; ctx.lineWidth = 5; ctx.lineCap = 'round';
  if (s == 0) { for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(sx, sy - 20, 70 + bob * .5, d < 0 ? Math.PI * 1.05 : -Math.PI * .05, d < 0 ? Math.PI * 1.35 : -Math.PI * .35, d > 0); ctx.stroke(); const a = d < 0 ? Math.PI * 1.35 : -Math.PI * .35, ex = sx + Math.cos(a) * (70 + bob * .5), ey = sy - 20 + Math.sin(a) * (70 + bob * .5); ctx.beginPath(); ctx.arc(ex, ey, 7, 0, TAU); ctx.fill(); } }
  if (s == 1) { let tx, ty; if (isTouch) { tx = VW - 100; ty = VH - 120; } else { tx = VW / 2; ty = VH - 80; } ctx.save(); ctx.translate(tx + (isTouch ? -bob : 0), ty + (isTouch ? 0 : -bob)); ctx.rotate(isTouch ? 0 : Math.PI / 2); ctx.beginPath(); ctx.moveTo(-40, 0); ctx.lineTo(-6, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-16, -12); ctx.lineTo(-16, 12); ctx.closePath(); ctx.fill(); ctx.restore(); }
  if (s == 2) { // wind arrow banner
    const a = G.wDir + Math.PI, cx = VW / 2, cy = VH * .5 - 120; ctx.save(); ctx.translate(sx, sy - 10); ctx.rotate(a); ctx.globalAlpha = .9; ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 6;
    const off = -170 + ((T * 60) % 40); ctx.beginPath(); ctx.moveTo(off - 60, 0); ctx.lineTo(off, 0); ctx.stroke(); ctx.beginPath(); ctx.moveTo(off + 14, 0); ctx.lineTo(off - 6, -12); ctx.lineTo(off - 6, 12); ctx.closePath(); ctx.fill(); ctx.restore();
    const wx = sx + Math.cos(G.wDir) * 200, wy = sy + Math.sin(G.wDir) * 160 - 10; txt('WIND', wx, wy, 20, '#fff', 'center', 5);
  }
}
function endTutorial() {
  if (base != 'play' || !G || G.mode != 'tut') return;
  store.set('tutorial', true);
  if (tutFrom == 'first') { save.started = true; persist(); startRace('race', 0, 0); }
  else fadeTo(goTitle);
}

// ============ input ============
function setTouch() { if (isTouch) return; isTouch = true; document.body.classList.add('touch'); if (G && G.mode == 'tut') tutShow(); }
window.addEventListener('keydown', e => {
  initAudio(); const k = e.key;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(k)) e.preventDefault();
  if (k == 'ArrowLeft' || k == 'a' || k == 'A') keys.left = true;
  if (k == 'ArrowRight' || k == 'd' || k == 'D') keys.right = true;
  if (k == 'ArrowUp' || k == 'w' || k == 'W') keys.up = true;
  if (k == 'ArrowDown' || k == 's' || k == 'S') keys.down = true;
  if (k == ' ' && base == 'play' && !modal && G && G.player && !e.repeat) doTack(G.player);
  if (k == 'Escape' || k == 'p' || k == 'P') { if (base == 'play') { if (modal) resume(); else pauseGame(); } else if (base == 'map' || base == 'dock' || base == 'ach') goTitle(); }
  if (k == 'm' || k == 'M') setMute(!settings.mute);
  if (k == 'Enter' && base == 'title' && !modal) $('bPlay').click();
});
window.addEventListener('keyup', e => { const k = e.key;
  if (k == 'ArrowLeft' || k == 'a' || k == 'A') keys.left = false; if (k == 'ArrowRight' || k == 'd' || k == 'D') keys.right = false;
  if (k == 'ArrowUp' || k == 'w' || k == 'W') keys.up = false; if (k == 'ArrowDown' || k == 's' || k == 'S') keys.down = false; });
window.addEventListener('blur', resetInput);
document.addEventListener('pointerdown', e => { initAudio(); if (e.pointerType == 'touch') setTouch(); }, true);
document.addEventListener('visibilitychange', () => { if (document.hidden) { pauseGame(); resetInput(); } });
const padBind = (id, k) => { const el = $(id); const on = e => { e.preventDefault(); touch[k] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) { } }, off = () => { touch[k] = false; el.classList.remove('on'); };
  el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off); el.addEventListener('lostpointercapture', off); };
padBind('pL', 'left'); padBind('pR', 'right');
$('pT').addEventListener('pointerdown', e => { e.preventDefault(); const el = $('pT'); el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 150); if (G && G.player) doTack(G.player); });
{ const tr = $('trim'); const set = e => { const r = tr.getBoundingClientRect(); touch.trim = clamp((e.clientY - r.top - 30) / (r.height - 60), 0, 1); };
  tr.addEventListener('pointerdown', e => { e.preventDefault(); try { tr.setPointerCapture(e.pointerId); } catch (_) { } set(e); tr.dataset.on = 1; });
  tr.addEventListener('pointermove', e => { if (tr.dataset.on == 1) set(e); });
  const up = () => { tr.dataset.on = 0; }; tr.addEventListener('pointerup', up); tr.addEventListener('pointercancel', up); }
document.querySelectorAll('.btn').forEach(b => b.addEventListener('pointerdown', () => { initAudio(); SFX.click(); }));
document.addEventListener('click', e => { const m = e.target.closest('.mute'); if (m) setMute(!settings.mute); });
$('bPlay').onclick = () => { if (!store.get('tutorial', false)) startTutorial('first'); else fadeTo(goMap); };
$('bDaily').onclick = () => startRace('daily', 0, 0);
$('bDock').onclick = () => fadeTo(goDock);
$('bAch').onclick = () => fadeTo(goAch);
$('bHow').onclick = () => startTutorial('title');
$('mBack').onclick = () => fadeTo(goTitle);
$('mDock').onclick = () => fadeTo(goDock);
$('dBack').onclick = () => fadeTo(() => save.started ? goMap() : goTitle());
$('aBack').onclick = () => fadeTo(goTitle);
document.querySelectorAll('.tabs .btn').forEach(b => b.onclick = () => { dockTab = b.dataset.t; renderDock(); });
$('hPause').onclick = pauseGame;
$('pRes').onclick = resume;
$('tutSkip').onclick = () => { SFX.click(); endTutorial(); };
$('pRestart').onclick = () => { modal = null; if (G.mode == 'tut') startTutorial(tutFrom); else startRace(G.mode, G.v, G.rIdx); };
$('pQuit').onclick = () => { modal = null; if (G.mode == 'tut') { endTutorial(); return; } fadeTo(() => G.mode == 'race' ? goMap() : goTitle()); };

// ============ main loop ============
let lastTs = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  let dt = (ts - lastTs) / 1000; lastTs = ts; if (!(dt > 0)) dt = 0; dt = Math.min(dt, .05); T += dt;
  try {
    if (modal != 'pause') { let d = dt; if (G.hit > 0) { G.hit -= dt; d *= .12; } d *= G.slow || 1; const n = (window.__gr && window.__gr.speed) || 1; for (let i = 0; i < n; i++) step(d); }
    render(T);
    if (base == 'dock') prevRender(T, dt);
  } catch (e) { console.warn(e); }
}
window.__gr = { get G() { return G; }, get save() { return save; }, auto: false, speed: 1 };
goTitle(); updMute();
requestAnimationFrame(frame);
</script>

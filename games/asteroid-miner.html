function makeRock(x,y,tier,vx,vy,rich){const r=[16,30,54,95][tier]*(0.85+Math.random()*0.3);const n=9+tier*3;const pts=[];for(let i=0;i<n;i++){const a=i/n*6.283;const rad=r*(0.75+Math.random()*0.3);pts.push([Math.cos(a)*rad,Math.sin(a)*rad])}
 const craters=[];for(let i=0;i<tier+1;i++){const a=Math.random()*6.28,d=Math.random()*r*0.5;craters.push([Math.cos(a)*d,Math.sin(a)*d,r*(0.12+Math.random()*0.12)])}
 const veins=[];if(rich)for(let i=0;i<2+tier;i++){const a=Math.random()*6.28,d=Math.random()*r*0.6;veins.push([Math.cos(a)*d,Math.sin(a)*d,r*0.1+2])}
 return{x,y,vx:vx||rnd(-30,30),vy:vy||rnd(-30,30),r,tier,hp:[8,24,60,160][tier]*(1+(R?R.sector-1:0)*0.12),rot:Math.random()*6,vr:rnd(-0.8,0.8)/(tier+1),pts,craters,veins,rich,flash:0}}

 const rocks=48+sector*4;for(let i=0;i<rocks;i++){let x,y;do{x=rnd(-WORLD/2,WORLD/2);y=rnd(-WORLD/2,WORLD/2)}while(x*x+y*y<300*300);const t=Math.random()<0.15?3:Math.random()<0.55?2:1;R.rocks.push(makeRock(x,y,t,0,0,Math.random()<0.3))}

// ---------- bosses ----------
const BOSS_COL=['#ff4f7a','#ffb23e','#c86bff','#7dff8a','#2ee6c8'];
function spawnBoss(){const s=R.sector,kind=(s-1)%5,tier=Math.floor((s-1)/5);const sh=R.ship;const a=Math.random()*6.283;
 const hp=1100*(1+(s-1)*0.62);R.boss={kind,tier,x:sh.x+Math.cos(a)*650,y:sh.y+Math.sin(a)*650,vx:0,vy:0,hp,maxHp:hp,r:kind===3?110:78,t:0,a:0,st:'move',stT:2,fireT:2,spin:0,flash:0,col:BOSS_COL[kind],enter:0};

function updateBoss(dt){const b=R.boss,sh=R.ship;b.t+=dt;b.flash=Math.max(0,b.flash-dt*5);b.enter=Math.min(1,b.enter+dt);const toP=Math.atan2(sh.y-b.y,sh.x-b.x);const d=Math.hypot(sh.x-b.x,sh.y-b.y);const rage=b.hp<b.maxHp*0.5?1.35:1;const k=b.tier;
 const keep=(want,spd)=>{const f=d>want?1:-0.6;b.vx+=(Math.cos(toP)*f*spd-b.vx)*dt*1.5;b.vy+=(Math.sin(toP)*f*spd-b.vy)*dt*1.5};

 if(b.kind===0){keep(380,90);b.a=toP;if(b.fireT<=0){b.fireT=2.2;const n=12+k*6;for(let i=0;i<n;i++)bossFire(b.x,b.y,i/n*6.283+b.spin,200+k*40,8);if(R.enemies.length<14)for(let i=0;i<3+k*2;i++)spawnEnemy('swarm',b.x+rnd(-60,60),b.y+rnd(-60,60))}}
 else if(b.kind===1){b.stT-=dt*rage;if(b.st==='move'){keep(420,140);b.a=toP;if(b.fireT<=0){b.fireT=1.2;for(let i=-1;i<=1;i++)bossFire(b.x,b.y,toP+i*0.25,320)}if(b.stT<=0){b.st='aim';b.stT=0.8;b.ca=toP}}
  else if(b.st==='aim'){b.vx*=0.9;b.vy*=0.9;b.ca+=angDiff(b.ca,toP)*dt*2;b.a=b.ca;if(b.stT<=0){b.st='charge';b.stT=0.9;b.vx=Math.cos(b.ca)*950;b.vy=Math.sin(b.ca)*950;shake=8;SFX.boom()}}
  else{if(k&&Math.random()<dt*10)R.enemies.push(Object.assign({type:'mine',x:b.x,y:b.y,vx:0,vy:0,hp:20,maxHp:20,r:14,spd:0,t:0,fireT:9,elite:false,flash:0,a:0}));if(b.stT<=0){b.st='move';b.stT=2.5-k*0.6;for(let i=0;i<10+k*6;i++)bossFire(b.x,b.y,i/(10+k*6)*6.283,240)}}}
 else if(b.kind===2){keep(320,60);b.a=b.spin;if(b.fireT<=0){b.fireT=0.14;const arms=3+k*2;for(let i=0;i<arms;i++)bossFire(b.x,b.y,b.spin*1.4+i/arms*6.283,230,7)}if(Math.sin(b.t*0.9)>0.97&&lim('bburst',600)){for(let i=-2;i<=2;i++)bossFire(b.x,b.y,toP+i*0.12,380,9,'#fff')}}

  else{b.la+=angDiff(b.la,toP)*dt*(0.35+k*0.3);b.a=b.la;const ex=b.x+Math.cos(b.la)*1600,ey=b.y+Math.sin(b.la)*1600;if(segDist(sh.x,sh.y,b.x,b.y,ex,ey)<30)hurtShip(40*dt*(1+R.sector*0.12),true);if(b.stT<=0){b.st='move';b.stT=2.2-k*0.5}}}
 b.x+=b.vx*dt;b.y+=b.vy*dt;b.x=clamp(b.x,-WORLD/2+b.r,WORLD/2-b.r);b.y=clamp(b.y,-WORLD/2+b.r,WORLD/2-b.r);

function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1;const l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=clamp(t,0,1);return Math.hypot(px-(x1+dx*t),py-(y1+dy*t))}
// ---------- combat ----------
function weaponFire(dt){const sh=R.ship,w=S.weapon,L=lv(w)||1;const pw=sh.power>0?1.6:1;sh.fireT-=dt*pw;const a=sh.a;const mx=sh.x+Math.cos(a)*18,my=sh.y+Math.sin(a)*18;

 sh.vx-=Math.cos(a)*6;sh.vy-=Math.sin(a)*6}

function laserTick(dt){const sh=R.ship,a=sh.a,len=R.laser.len;const dx=Math.cos(a),dy=Math.sin(a);let best=len,hit=null;
 const test=(o,r)=>{const ox=o.x-sh.x,oy=o.y-sh.y;const t=ox*dx+oy*dy;if(t<0||t>best+r)return;const pd=Math.abs(ox*dy-oy*dx);if(pd<r){const tt=t-Math.sqrt(r*r-pd*pd);if(tt<best){best=Math.max(0,tt);hit=o}}};
 R.rocks.forEach(o=>test(o,o.r*0.9));R.enemies.forEach(o=>test(o,o.r));if(R.boss)test(R.boss,R.boss.r);
 R.laser.end=best;if(hit){damage(hit,R.laser.dps*dt,sh.x+dx*best,sh.y+dy*best,true);if(Math.random()<dt*30)parts.push({x:sh.x+dx*best,y:sh.y+dy*best,vx:rnd(-150,150),vy:rnd(-150,150),life:0.3,max:0.3,col:'#ff9fb4',s:2.5})}SFX.beam()}

 const n=(o.rich?2:0)+(o.tier===0?(Math.random()<0.5?1:0):o.tier);dropOre(o.x,o.y,n,1);shake=Math.max(shake,o.tier*2)}

 if(Math.random()<0.045)R.pickups.push({x:o.x,y:o.y,vx:0,vy:0,kind:['heal','power','heal'][Math.floor(Math.random()*3)],life:15})}

function hurtShip(d,cont,src){const sh=R.ship;if(R.state==='dead')return;if(!cont&&sh.inv>0)return;sh.hp-=d;sh.lastHit=0;if(!cont){sh.inv=0.7;SFX.hurt();shake=Math.max(shake,10);flash=Math.max(flash,0.35)}

function updateRun(dt){const sh=R.ship,st=R.st;
 if(R.banner)R.banner.t-=dt;if(R.banner&&R.banner.t<=0)R.banner=null;

 // input
 let mx=0,my=0;if(keys.KeyA||keys.ArrowLeft)mx-=1;if(keys.KeyD||keys.ArrowRight)mx+=1;if(keys.KeyW||keys.ArrowUp)my-=1;if(keys.KeyS||keys.ArrowDown)my+=1;
 if(sticks.L){mx=sticks.L.dx;my=sticks.L.dy}
 const ml=Math.hypot(mx,my);if(ml>1){mx/=ml;my/=ml}
 sh.vx+=(mx*st.speed-sh.vx)*Math.min(1,dt*st.accel/st.speed);sh.vy+=(my*st.speed-sh.vy)*Math.min(1,dt*st.accel/st.speed);
 let firing=false;

 else{const wx=(mouse.x-W/2)/ZOOM+R.camx,wy=(mouse.y-H/2)/ZOOM+R.camy;if(mouse.seen)sh.a=Math.atan2(wy-sh.y,wx-sh.x);else if(ml>0.1)sh.a=Math.atan2(my,mx);firing=mouse.down||keys.Space}
 R.firing=firing;R.laser=null;if(firing&&R.state!=='cleared')weaponFire(dt);else sh.fireT=Math.max(0,sh.fireT-dt);
 sh.x+=sh.vx*dt;sh.y+=sh.vy*dt;const wl=WORLD/2-20;if(Math.abs(sh.x)>wl){sh.x=clamp(sh.x,-wl,wl);sh.vx*=-0.5}if(Math.abs(sh.y)>wl){sh.y=clamp(sh.y,-wl,wl);sh.vy*=-0.5}
 sh.inv=Math.max(0,sh.inv-dt);sh.lastHit+=dt;sh.power=Math.max(0,sh.power-dt);if(sh.lastHit>3&&st.regen)sh.hp=Math.min(st.maxHp,sh.hp+st.regen*dt);
 if(ml>0.1&&Math.random()<dt*40)parts.push({x:sh.x-Math.cos(Math.atan2(my,mx))*14,y:sh.y-Math.sin(Math.atan2(my,mx))*14,vx:-mx*120+rnd(-30,30),vy:-my*120+rnd(-30,30),life:0.35,max:0.35,col:Math.random()<0.5?P.amber:'#fff3c0',s:rnd(1.5,3.5)});
 // camera
 const la=touchMode?60:Math.min(120,Math.hypot(mouse.x-W/2,mouse.y-H/2)*0.18);R.camx+=(sh.x+Math.cos(sh.a)*la-R.camx)*Math.min(1,dt*5);R.camy+=(sh.y+Math.sin(sh.a)*la-R.camy)*Math.min(1,dt*5);
 // waves
 if(R.state==='between'){if(!TUT)R.timer-=dt;if(R.timer<=0){R.wave++;if(R.wave<=3){R.state='wave';R.queue=waveSize();R.spawnT=0.5;R.banner={s:'Wave '+R.wave,t:1.6}}else{R.state='boss';spawnBoss()}}}
 else if(R.state==='wave'){R.spawnT-=dt;if(R.queue>0&&R.spawnT<=0&&R.enemies.length<10+R.sector){const types=enemyTypes();const grp=Math.min(R.queue,1+Math.floor(Math.random()*3));spawnAround((x,y)=>{for(let i=0;i<grp;i++){const ty=types[Math.floor(Math.random()*types.length)];spawnEnemy(ty,x+rnd(-50,50),y+rnd(-50,50),R.sector>=4&&Math.random()<0.06+R.sector*0.015);if(ty==='swarm'){for(let j=0;j<2;j++)spawnEnemy('swarm',x+rnd(-50,50),y+rnd(-50,50))}}});R.queue-=grp;R.spawnT=Math.max(0.5,2.2-R.sector*0.12-R.wave*0.2)}
  if(R.queue<=0&&R.enemies.length===0){R.state='between';R.timer=2.5;R.banner={s:'Wave clear',t:1.4};SFX.power();if(R.ship.hp<R.st.maxHp)R.ship.hp=Math.min(R.st.maxHp,R.ship.hp+R.st.maxHp*0.15)}}
 else if(R.state==='boss'){if(R.boss)updateBoss(dt)}

 // rocks
 if(R.rocks.length<34+R.sector*3&&Math.random()<dt*0.6)spawnAround((x,y)=>R.rocks.push(makeRock(x,y,Math.random()<0.5?2:1,0,0,Math.random()<0.35)));
 R.rocks.forEach(o=>{o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.vr*dt;o.flash=Math.max(0,o.flash-dt*6);if(o.hostile){o.hostile-=dt;if(o.hostile<=0)o.hostile=0}
  if(Math.abs(o.x)>WORLD/2){o.vx=-Math.sign(o.x)*Math.abs(o.vx)}if(Math.abs(o.y)>WORLD/2){o.vy=-Math.sign(o.y)*Math.abs(o.vy)}
  const dd=Math.hypot(sh.x-o.x,sh.y-o.y);if(dd<o.r*0.85+12){const a=Math.atan2(sh.y-o.y,sh.x-o.x);const rel=Math.hypot(sh.vx-o.vx,sh.vy-o.vy);if(rel>120||o.hostile)hurtShip((5+o.tier*5)*(o.hostile?2:1),false,o);sh.x=o.x+Math.cos(a)*(o.r*0.85+12);sh.y=o.y+Math.sin(a)*(o.r*0.85+12);sh.vx=Math.cos(a)*Math.max(120,rel*0.5);sh.vy=Math.sin(a)*Math.max(120,rel*0.5)}});
 // enemies
 R.enemies.forEach(e=>{e.t+=dt;e.flash=Math.max(0,e.flash-dt*6);const toP=Math.atan2(sh.y-e.y,sh.x-e.x);const d=Math.hypot(sh.x-e.x,sh.y-e.y);
  if(e.type==='chaser'||e.type==='swarm'||e.type==='tank'){const wob=e.type==='swarm'?Math.sin(e.t*6)*0.7:0;e.vx+=(Math.cos(toP+wob)*e.spd-e.vx)*dt*2;e.vy+=(Math.sin(toP+wob)*e.spd-e.vy)*dt*2;e.a=Math.atan2(e.vy,e.vx);
   if(e.type==='tank'){e.fireT-=dt;if(e.fireT<=0&&d<700){e.fireT=2.4;for(let i=0;i<8;i++)R.eb.push({x:e.x,y:e.y,vx:Math.cos(i/8*6.28+e.t)*190,vy:Math.sin(i/8*6.28+e.t)*190,r:6,life:4,col:P.enemy2,dmg:8*(1+R.sector*0.12)})}}}
  else if(e.type==='shooter'){const want=d>360?1:d<260?-1:0;const perp=toP+Math.PI/2;e.vx+=(Math.cos(toP)*want*e.spd+Math.cos(perp)*60-e.vx)*dt*2;e.vy+=(Math.sin(toP)*want*e.spd+Math.sin(perp)*60-e.vy)*dt*2;e.a=toP;e.fireT-=dt;if(e.fireT<=0&&d<620){e.fireT=rnd(1.4,2.2)/(e.elite?1.6:1);const sp=270+R.sector*12;R.eb.push({x:e.x,y:e.y,vx:Math.cos(toP)*sp,vy:Math.sin(toP)*sp,r:5,life:3,col:P.rose,dmg:8*(1+R.sector*0.12)});if(lim('eshot',80))tone(520,0.06,'square',0.02,0.6)}}
  else if(e.type==='mine'){e.vx*=0.98;e.vy*=0.98;if(d<220){e.vx+=Math.cos(toP)*160*dt;e.vy+=Math.sin(toP)*160*dt}e.a+=dt}
  e.x+=e.vx*dt;e.y+=e.vy*dt;
  if(d<e.r+12){const dmg={chaser:12,swarm:6,tank:20,shooter:10,mine:28}[e.type]*(1+(R.sector-1)*0.12);hurtShip(dmg,false,e);if(e.type==='mine'||e.type==='swarm'){e.hp=0;killEnemy(e)}else{e.vx-=Math.cos(toP)*300;e.vy-=Math.sin(toP)*300}}});
 // separate enemies
 for(let i=0;i<R.enemies.length;i++)for(let j=i+1;j<R.enemies.length;j++){const a=R.enemies[i],b=R.enemies[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),m=a.r+b.r;if(d<m&&d>0.01){const p=(m-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p}}
 // buddies
 R.buddies.forEach((bd,i)=>{bd.a+=dt*2;bd.x=sh.x+Math.cos(bd.a)*46;bd.y=sh.y+Math.sin(bd.a)*46;bd.fireT-=dt;if(bd.fireT<=0){let tgt=null,bdist=480*480;R.enemies.forEach(e=>{const d=dist2(e,bd);if(d<bdist){bdist=d;tgt=e}});if(!tgt&&R.boss&&dist2(R.boss,bd)<600*600)tgt=R.boss;
  if(tgt){bd.fireT=1/(1.8+lv('drone')*0.5);const a=Math.atan2(tgt.y-bd.y,tgt.x-bd.x);R.bullets.push({x:bd.x,y:bd.y,vx:Math.cos(a)*700,vy:Math.sin(a)*700,dmg:7*(1+lv('drone')*0.4),life:0.9,r:3,buddy:true})}}});
 // bullets
 const targets=()=>{const a=R.enemies.slice();if(R.boss)a.push(R.boss);return a};
 R.bullets.forEach(b=>{b.life-=dt;if(b.homing){let tgt=null,bd=700*700;targets().forEach(e=>{const d=dist2(e,b);if(d<bd){bd=d;tgt=e}});if(!tgt)R.rocks.forEach(e=>{const d=dist2(e,b);if(d<350*350&&d<bd){bd=d;tgt=e}});
   const sp=Math.hypot(b.vx,b.vy);let a=Math.atan2(b.vy,b.vx);if(tgt)a+=clamp(angDiff(a,Math.atan2(tgt.y-b.y,tgt.x-b.x)),-dt*6,dt*6);const ns=Math.min(620,sp+dt*700);b.vx=Math.cos(a)*ns;b.vy=Math.sin(a)*ns;if(Math.random()<0.5)parts.push({x:b.x,y:b.y,vx:0,vy:0,life:0.3,max:0.3,col:'rgba(46,230,200,.8)',s:2.5})}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.life>0){for(const e of R.enemies){if((e.x-b.x)**2+(e.y-b.y)**2<(e.r+b.r)**2){b.life=0;damage(e,b.dmg);hitSpark(b);return}}
   if(R.boss&&(R.boss.x-b.x)**2+(R.boss.y-b.y)**2<(R.boss.r+b.r)**2){b.life=0;damage(R.boss,b.dmg);hitSpark(b);return}
   for(const o of R.rocks){if((o.x-b.x)**2+(o.y-b.y)**2<(o.r*0.9+b.r)**2){b.life=0;o.vx+=b.vx*0.02/(o.tier+1);o.vy+=b.vy*0.02/(o.tier+1);damage(o,b.dmg,0,0,true);hitSpark(b,P.rockL);if(lim('rh',50))tone(180,0.03,'triangle',0.04);return}}}});
 R.bullets=R.bullets.filter(b=>b.life>0);
 R.eb.forEach(b=>{b.life-=dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if((b.x-sh.x)**2+(b.y-sh.y)**2<(b.r+9)**2){b.life=0;hurtShip(b.dmg)}});R.eb=R.eb.filter(b=>b.life>0);
 // pickups
 R.pickups.forEach(p=>{p.life-=dt;p.vx*=0.95;p.vy*=0.95;const d=Math.hypot(sh.x-p.x,sh.y-p.y);if(d<st.magnet||R.state==='cleared'){const a=Math.atan2(sh.y-p.y,sh.x-p.x);const f=R.state==='cleared'?1400:900;p.vx+=Math.cos(a)*f*dt;p.vy+=Math.sin(a)*f*dt}p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(d<20){p.life=0;if(p.kind==='ore'){const v=Math.round(p.val*oreMult()*10)/10;R.ore+=v;SFX.ore();if(Math.random()<0.3)texts.push({x:p.x,y:p.y,s:'+'+Math.round(v*10)/10,col:P.amber,life:0.6})}

   else if(p.kind==='power'){sh.power=8;SFX.power();texts.push({x:sh.x,y:sh.y-30,s:'POWER',col:P.amber,life:1})}}});
 R.pickups=R.pickups.filter(p=>p.life>0);
 updateFx(dt)}
function hitSpark(b,col){for(let i=0;i<4;i++)parts.push({x:b.x,y:b.y,vx:rnd(-120,120)-b.vx*0.1,vy:rnd(-120,120)-b.vy*0.1,life:0.25,max:0.25,col:col||'#fff3a0',s:2})}
function updateFx(dt){parts.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.97;p.vy*=0.97});parts=parts.filter(p=>p.life>0);if(parts.length>900)parts.splice(0,parts.length-900);texts.forEach(t=>{t.life-=dt;t.y-=40*dt});texts=texts.filter(t=>t.life>0)}
let lastResult=null;
function finishRun(won){const keep=won?1:0.6;const ore=Math.floor(R.ore*keep);S.ore+=ore;if(won){if(R.sector>=S.unlocked&&R.sector<10)S.unlocked=R.sector+1;if(R.sector>S.best)S.best=R.sector;S.sector=Math.min(10,Math.max(S.sector,R.sector<10?R.sector+1:10))}
 lastResult={won,ore,raw:Math.floor(R.ore),kills:R.kills,sector:R.sector,t:0};save();scene='result'}

function drawShip(g,x,y,a,s,inv,thrust){g.save();g.translate(x,y);g.rotate(a);g.scale(s,s);if(inv>0&&Math.floor(inv*20)%2)g.globalAlpha=0.4;

 g.fillStyle=P.teal;g.beginPath();g.moveTo(14,0);g.lineTo(2,-4);g.lineTo(2,4);g.closePath();g.fill();

 g.save();g.clip();g.fillStyle='rgba(255,255,255,.07)';g.beginPath();g.arc(-o.r*0.3,-o.r*0.3,o.r*0.8,0,7);g.fill();g.restore();

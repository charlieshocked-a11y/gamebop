<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tile Kingdom</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1b4f72;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr.on{display:flex}.scr>*{pointer-events:auto}
.title{font-size:min(14vw,104px);font-weight:900;line-height:.88;text-align:center;color:#fff;letter-spacing:.02em;text-shadow:0 .05em 0 #2a7fb8,0 .1em 0 #165a8a,0 .18em .25em rgba(0,0,0,.35)}
.title span{display:block;color:#ffe066;font-size:1.12em;text-shadow:0 .05em 0 #e08a1e,0 .1em 0 #9a4f0a,0 .18em .25em rgba(0,0,0,.35)}
.btn{font:inherit;font-weight:800;border:0;border-radius:18px;padding:14px 36px;font-size:24px;color:#4a2a00;background:linear-gradient(#ffe98a,#ffb52e);box-shadow:0 6px 0 #c47a10,0 10px 22px rgba(0,0,0,.3);cursor:pointer;margin:6px;transition:transform .08s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c47a10}
.btn.alt{background:linear-gradient(#fff,#d6ecf7);color:#1d4f6e;box-shadow:0 6px 0 #7fa9c2,0 10px 22px rgba(0,0,0,.25)}
.btn.sm{font-size:17px;padding:9px 20px}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:rgba(10,40,70,.45);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:10px;padding:10px 12px;pointer-events:none}
#hud.on{display:flex}#hud>*{pointer-events:auto}
#scoreBox{flex:1;max-width:420px;margin:0 auto;background:rgba(10,40,70,.5);border-radius:16px;padding:6px 12px;display:flex;align-items:center;gap:10px}
#score{font-size:28px;font-weight:900;min-width:64px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#bar{flex:1;height:14px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;position:relative}
#barF{height:100%;width:0;background:linear-gradient(90deg,#ffd23a,#ff9a2e);border-radius:8px;transition:width .35s}
#next{font-size:14px;font-weight:800;white-space:nowrap}
#packs{font-size:15px;font-weight:900;background:rgba(255,255,255,.18);border-radius:10px;padding:3px 8px;white-space:nowrap}
#tray{position:fixed;bottom:10px;left:0;right:0;display:none;justify-content:center;gap:10px;pointer-events:none}
#tray.on{display:flex}
.tc{pointer-events:auto;width:84px;height:92px;border-radius:18px;background:linear-gradient(#fffdf4,#efe2c2);box-shadow:0 6px 0 #b59a62,0 10px 18px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s;color:#5a3a10;font-weight:900;font-size:12px;position:relative}
.tc img{width:64px;height:58px}
.tc.sel{transform:translateY(-12px);box-shadow:0 6px 0 #b59a62,0 0 0 4px #ffd23a,0 16px 24px rgba(0,0,0,.35)}
.tc.new{animation:dealIn .45s cubic-bezier(.2,1.5,.4,1) backwards}
@keyframes dealIn{from{transform:translateY(120px) rotate(-12deg);opacity:0}}
#rules{position:fixed;bottom:118px;left:50%;transform:translateX(-50%);background:rgba(10,40,70,.72);border-radius:14px;padding:5px 10px;display:none;gap:8px;align-items:center;font-weight:900;font-size:15px;white-space:nowrap;pointer-events:none}
#rules.on{display:flex}#rules img{width:36px;height:33px;vertical-align:middle}#rules b{margin-right:2px}
.pos{color:#9cff8a}.neg{color:#ff8a8a}
.panel{background:linear-gradient(#fffef8,#eef6fb);color:#1d4f6e;border-radius:26px;padding:22px 26px;text-align:center;box-shadow:0 10px 0 #7fa9c2,0 20px 50px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-width:94vw}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.panel h3{font-size:30px;font-weight:900;margin-bottom:8px}
.dim{position:fixed;inset:0;background:rgba(5,25,45,.5)}
.packs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.pk{background:linear-gradient(#fff6d6,#f2d58a);border-radius:18px;padding:10px;box-shadow:0 5px 0 #c4a050;cursor:pointer;display:flex;gap:2px;transition:transform .1s}
.pk:hover{transform:translateY(-4px) scale(1.04)}.pk img{width:46px;height:42px}
.big{font-size:52px;font-weight:900;color:#e08a1e;text-shadow:0 3px 0 #9a4f0a33}
.sub{opacity:.75;font-size:15px;margin-bottom:6px}
#sMenu .wrap{width:min(960px,96vw);max-height:96vh;background:rgba(8,36,64,.72);border-radius:26px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tab{font:inherit;font-weight:900;font-size:17px;border:0;border-radius:14px;padding:8px 18px;background:rgba(255,255,255,.2);color:#fff;cursor:pointer}
.tab.on{background:#ffd23a;color:#4a2a00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:100%;overflow-y:auto;padding:6px;max-height:62vh}
.it{background:linear-gradient(#fffef8,#e6f2f9);color:#1d4f6e;border-radius:18px;padding:10px;text-align:center;box-shadow:0 5px 0 #7fa9c2;cursor:pointer;position:relative}
.it .nm{font-weight:900;font-size:16px}.it .ds{font-size:13px;opacity:.85;min-height:18px}
.it .cost{display:inline-block;margin-top:5px;background:#ffd23a;color:#4a2a00;border-radius:10px;padding:2px 10px;font-weight:900}
.it.owned .cost{background:#9be08a;color:#1d4a10}.it.lock>*:not(.cost){filter:grayscale(1);opacity:.5}
.it.cur{outline:4px solid #ffd23a}
.it canvas,.it img{display:block;margin:0 auto}
.crowns{font-size:22px;font-weight:900;margin-bottom:8px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#hint{position:fixed;top:62px;left:0;right:0;text-align:center;font-size:13px;opacity:.7;pointer-events:none;display:none;text-shadow:0 1px 2px #000}
#mute{position:fixed;top:10px;right:12px;z-index:9}
.gbsup{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font-size:12px;font-weight:700;color:#fff;opacity:.55;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.7);transition:opacity .2s}
.gbsup:hover{opacity:1}
@media (max-width:560px){.tc{width:70px;height:80px}.tc img{width:54px;height:48px}#score{font-size:22px;min-width:44px}#next{display:none}.grid{grid-template-columns:repeat(2,1fr)}#rules{bottom:100px;font-size:13px;gap:4px;padding:4px 8px}#rules img{width:28px;height:26px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sTitle" class="scr on">
  <div class="title">TILE<span>KINGDOM</span></div>
  <div style="height:6vh"></div>
  <button class="btn" id="bPlay">▶ Play</button>
  <button class="btn alt sm" id="bHow">? How to play</button>
  <div style="margin-top:12px;font-size:14px;opacity:.85;text-shadow:0 1px 3px #000">Place tiles · combo neighbours · grow your island</div>
  <a class="gbsup" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>
<div id="sMenu" class="scr"><div class="wrap">
  <div class="crowns" id="crowns">👑 0</div>
  <div class="tabs"><button class="tab on" data-t="isles">🏝 Islands</button><button class="tab" data-t="build">🏠 Buildings</button><button class="tab" data-t="up">⬆ Upgrades</button></div>
  <div class="grid" id="grid"></div>
  <div style="margin-top:10px;display:flex;gap:6px"><button class="btn alt sm" id="bMBack">◀</button><button class="btn" id="bGo">▶ Build!</button></div>
</div></div>
<div id="hud">
  <button class="ib" id="bMenu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="scoreBox"><div id="score">0</div><div id="bar"><div id="barF"></div></div><div id="next">🎁 15</div><div id="packs">📦 1</div></div>
  <div style="width:44px"></div>
</div>
<button class="ib" id="mute"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
<div id="rules"></div>
<div id="hint">Pick a tile · tap the island to place</div>
<div id="tray"></div>
<div id="sOver" class="scr"><div class="dim"></div><div class="panel" id="panel" style="position:relative"></div></div>
<script>
"use strict";
var SK="gamebop.tile-kingdom.";
function ld(k,d){try{var v=localStorage.getItem(SK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch(e){}}
var save=ld("save",null)||{crowns:0,own:{house:1,farm:1,mill:1,tower:1,market:1},isle:0,isles:{0:1},best:{},up:{},runs:0};
var muted=!!ld("mute",false);
function persist(){sv("save",save)}
var $=function(i){return document.getElementById(i)};

// ---------- buildings ----------
var B={
 house:{n:"House",base:1,adj:{house:1,market:2,temple:1,mill:-1,mine:-1},c:"#f2efe6",r:"#e2574c"},
 farm:{n:"Farm",base:1,adj:{open:1,farm:1,mill:1},c:"#f1cf55",r:"#b8322c"},
 mill:{n:"Mill",base:0,adj:{farm:2,water:1},c:"#e8dcc0",r:"#7a5a3a"},
 tower:{n:"Tower",base:2,adj:{water:1,mount:2,tower:-2},c:"#c8c4d0",r:"#4a6fd0"},
 market:{n:"Market",base:0,adj:{house:2,harbor:2,farm:1,market:-3},c:"#f7e8c8",r:"#e85a9a"},
 temple:{n:"Temple",base:3,adj:{forest:1,house:1,garden:2,market:-2,mill:-2,mine:-2},c:"#fffaf0",r:"#e9b23a",cost:8},
 harbor:{n:"Harbor",base:1,adj:{water:1,market:2,house:1},req:"water",c:"#a8784a",r:"#2a8ad8",cost:15},
 lumber:{n:"Lumber",base:0,adj:{forest:2,house:1,lumber:-2},c:"#9a6a3a",r:"#5a3a1a",cost:25},
 garden:{n:"Garden",base:0,adj:{house:1,temple:2,open:1,forest:1},c:"#6fcf6a",r:"#ff8ac0",cost:35},
 mine:{n:"Mine",base:1,adj:{mount:3,tower:1,house:-1},req:"mount",c:"#8a8090",r:"#3a3440",cost:50},
 lighthouse:{n:"Lighthouse",base:0,adj:{water:2,harbor:2,lighthouse:-4},req:"water2",c:"#fff",r:"#e2443c",cost:70},
 castle:{n:"Castle",base:4,adj:{tower:3,house:2,castle:-6},c:"#d8d2e0",r:"#8a4ad8",cost:100}
};
var BK=Object.keys(B);
var ISLES=[
 {n:"Green Isle",cost:0,seed:11,land:.0,forest:.22,mount:.08,pal:{water:"#3fb6e0",deep:"#1f7fb8",sand:"#f3d98e",grass:"#86cc5c",forest:"#3f9a4a",mount:"#a2a0ac",tree:"#2f8a3a",snow:"#fff"}},
 {n:"Pine Isle",cost:20,seed:23,land:.03,forest:.32,mount:.1,pal:{water:"#3aa8c8",deep:"#1b6a98",sand:"#e8d49a",grass:"#9ac46a",forest:"#2e7a4e",mount:"#8f97a0",tree:"#1f6a42",snow:"#fff"}},
 {n:"Dune Isle",cost:45,seed:37,land:-.02,forest:.08,mount:.12,sandy:1,pal:{water:"#2fd0d0",deep:"#1890a8",sand:"#f7d17a",grass:"#c9c65e",forest:"#7aa04a",mount:"#d39a62",tree:"#5a8a3a",snow:"#f7e0b0"}},
 {n:"Frost Isle",cost:75,seed:53,land:.04,forest:.2,mount:.22,pal:{water:"#4a9ad8",deep:"#2a5a9a",sand:"#dfe6ee",grass:"#eef4fa",forest:"#cfe0e8",mount:"#9aa8c0",tree:"#3f7f80",snow:"#fff"}},
 {n:"Ember Isle",cost:110,seed:71,land:.0,forest:.12,mount:.2,lava:1,pal:{water:"#2a4f7a",deep:"#162a4a",sand:"#5a4a44",grass:"#7a6a50",forest:"#5a6a3a",mount:"#3a3238",tree:"#3f5a2a",snow:"#ff6a2a"}}
];
var UPS=[
 {id:"pack",n:"+1 Start pack",ic:"📦",max:3,cost:[30,60,100]},
 {id:"choice",n:"+1 Pack choice",ic:"🎁",max:1,cost:[40]},
 {id:"size",n:"Bigger packs",ic:"➕",max:1,cost:[60]},
 {id:"reroll",n:"Reroll tray",ic:"🎲",max:3,cost:[25,50,80]}
];

// ---------- audio ----------
var AC=null,master=null;
function audio(){if(AC){if(AC.state==="suspended")AC.resume();return}try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.45;master.connect(AC.destination);startMusic()}catch(e){AC=null}}
function tone(f,t,d,type,v,slide){if(!AC)return;var o=AC.createOscillator(),g=AC.createGain(),n=AC.currentTime+(t||0);o.type=type||"sine";o.frequency.setValueAtTime(f,n);if(slide)o.frequency.exponentialRampToValueAtTime(slide,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v||.25,n+.01);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(master);o.start(n);o.stop(n+d+.05)}
function noise(t,d,v,fq){if(!AC)return;var n=AC.currentTime+(t||0),b=AC.createBuffer(1,Math.max(1,AC.sampleRate*d|0),AC.sampleRate),a=b.getChannelData(0);for(var i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);var s=AC.createBufferSource();s.buffer=b;var f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=fq||800;var g=AC.createGain();g.gain.value=v||.3;s.connect(f);f.connect(g);g.connect(master);s.start(n)}
var PENT=[0,2,4,7,9];
var SFX={place:function(p){noise(0,.12,.35,600);tone(220,0,.15,"sine",.3,110);var s=Math.max(0,Math.min(12,p));for(var i=0;i<Math.min(5,1+s/3);i++)tone(440*Math.pow(2,PENT[i%5]/12+Math.floor(i/5)),.05+i*.05,.2,"triangle",.15)},
 sel:function(){tone(880,0,.06,"triangle",.12)},bad:function(){tone(160,0,.15,"square",.08)},
 pack:function(){[523,659,784,1047].forEach(function(f,i){tone(f,i*.07,.3,"triangle",.18)})},
 hover:function(){tone(1200,0,.03,"sine",.04)},
 end:function(){[784,659,523,392].forEach(function(f,i){tone(f,i*.15,.5,"triangle",.18)})},
 buy:function(){[660,880,1320].forEach(function(f,i){tone(f,i*.06,.25,"square",.08)})}};
var musT=0,musStep=0;
function startMusic(){}
function musicTick(){if(!AC||muted)return;var now=AC.currentTime;if(musT<now)musT=now+.05;while(musT<now+.3){var st=musStep%32,ch=[0,5,3,4][Math.floor(musStep/32)%4],root=[0,5,-3,-1][Math.floor(musStep/32)%4];
 if(st%8===0)ptone(110*Math.pow(2,root/12),musT,1.2,"sine",.06);
 if(st%2===0&&Math.random()<.45){var deg=PENT[(Math.random()*5)|0]+(Math.random()<.3?12:0);ptone(440*Math.pow(2,(deg+root)/12),musT,.5,"triangle",.025)}
 musT+=.18;musStep++}}
function ptone(f,at,d,type,v){var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,at);g.gain.linearRampToValueAtTime(v,at+.03);g.gain.exponentialRampToValueAtTime(.0005,at+d);o.connect(g);g.connect(master);o.start(at);o.stop(at+d+.05)}

// ---------- rng / noise ----------
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function vnoise(rnd){var g={};function h(x,y){var k=x+","+y;if(g[k]===undefined)g[k]=rnd();return g[k]}return function(x,y){var x0=Math.floor(x),y0=Math.floor(y),fx=x-x0,fy=y-y0;fx=fx*fx*(3-2*fx);fy=fy*fy*(3-2*fy);var a=h(x0,y0),b=h(x0+1,y0),c=h(x0,y0+1),d=h(x0+1,y0+1);return a+(b-a)*fx+(c-a)*fy+(a-b-c+d)*fx*fy}}

// ---------- map ----------
var DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
var RAD=6,SQ=.58;
var map=null,tiles=[];
function key(q,r){return q+","+r}
function genIsland(isleIdx,seed){
 var I=ISLES[isleIdx],rnd=mul(seed),n1=vnoise(rnd),n2=vnoise(rnd),n3=vnoise(rnd),n4=vnoise(rnd),m={},list=[];
 for(var q=-RAD-1;q<=RAD+1;q++)for(var r=-RAD-1;r<=RAD+1;r++){var s=-q-r;if(Math.max(Math.abs(q),Math.abs(r),Math.abs(s))>RAD+1)continue;
  var x=q*1.5,y=(r+q/2)*1.732,d=Math.sqrt(x*x+y*y)/(RAD*1.55);
  var e=n1(x*.3+50,y*.3+50)*.55+n2(x*.7,y*.7)*.25+.7-d*d*.8+I.land;
  var dist=Math.max(Math.abs(q),Math.abs(r),Math.abs(s));
  var t;if(dist>RAD||e<.45)t=e<.36||dist>RAD?"deep":"water";else if(e<.5+(I.sandy?.07:0))t="sand";else{var f=n3(x*.45+9,y*.45+9),mm=n4(x*.5+3,y*.5+30);if(mm>.8-I.mount*1.1&&e>.6)t="mount";else if(f<I.forest+.25&&f>.25)t="forest";else t="grass"}
  var tl={q:q,r:r,t:t,b:null,e:e,pop:0,drop:0,id:list.length};m[key(q,r)]=tl;list.push(tl)}
 // count buildable
 var bc=list.filter(function(t){return t.t==="grass"||t.t==="sand"}).length;
 if(bc<55&&(genIsland.d=(genIsland.d||0)+1)<30)return genIsland(isleIdx,seed+977);genIsland.d=0;map&&0;
 // pre-scatter a few ruins? no
 return {m:m,list:list,isle:isleIdx,seed:seed};
}
function nb(t){var o=[];for(var i=0;i<6;i++){var n=map.m[key(t.q+DIRS[i][0],t.r+DIRS[i][1])];o.push(n||{t:"deep",b:null,virt:1})}return o}
function nkind(n){if(n.b)return n.b;if(n.t==="water"||n.t==="deep")return "water";if(n.t==="grass"||n.t==="sand")return "open";return n.t}
function tScore(t){if(!t.b)return 0;var d=B[t.b],s=d.base,ns=nb(t);for(var i=0;i<6;i++){var k=nkind(ns[i]);if(d.adj[k])s+=d.adj[k]}return s}
function total(){var s=0;for(var i=0;i<map.list.length;i++)s+=tScore(map.list[i]);return s}
function canPlace(t,b){if(!t||t.b||(t.t!=="grass"&&t.t!=="sand"))return false;var d=B[b];if(d.req){var ns=nb(t),w=0,mt=0;ns.forEach(function(n){var k=nkind(n);if(k==="water")w++;if(n.t==="mount")mt++});if(d.req==="water"&&!w)return false;if(d.req==="water2"&&w<2)return false;if(d.req==="mount"&&!mt)return false}return true}
function preview(t,b){var before=[],ns=nb(t);var ts=[t].concat(ns.filter(function(n){return !n.virt&&n.b}));ts.forEach(function(x){before.push(tScore(x))});t.b=b;var res={total:0,per:[]};ts.forEach(function(x,i){var d=tScore(x)-before[i];res.total+=d;if(x!==t&&d)res.per.push({t:x,d:d});if(x===t)res.self=d});t.b=null;return res}

// ---------- run state ----------
var run=null,scene="title",selIdx=0,hoverT=null,floats=[],parts=[],shakeT=0;
function thresholdAt(k){return Math.round(10+13*k+k*k*.9)}
function poolList(){return BK.filter(function(k){return save.own[k]})}
function makePack(rnd){var pool=poolList(),n=3+(save.up.size?1:0),p=[];var w=pool.map(function(k){return k==="castle"||k==="lighthouse"?.5:k==="house"?2.2:k==="farm"?1.6:1});var sw=w.reduce(function(a,b){return a+b},0);for(var i=0;i<n;i++){var r=rnd()*sw,j=0;while(r>w[j]){r-=w[j];j++}p.push(pool[Math.min(j,pool.length-1)])}return p}
function newRun(){
 var seed=(Date.now()%100000)+save.runs*131;map=genIsland(save.isle,seed);run={score:0,lvl:0,tray:[],packs:2+(save.up.pack||0),rnd:mul(seed^0x5f3),placed:0,rerolls:save.up.reroll||0,over:false,choosing:false,bestCombo:0};
 openPack();scene="play";save.runs++;persist();showUI();updHud();layoutCam(true);
 for(var i=0;i<map.list.length;i++){map.list[i].rise=-(Math.random()*.6+i*.004)}
 if(tutForce||!tutDone){tutForce=false;setTimeout(runTut,700)}

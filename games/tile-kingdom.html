<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Island Town</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1b5f8a;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr.on{display:flex}.scr>*{pointer-events:auto}
.logo{font-size:min(15vw,112px,13vh);font-weight:900;line-height:.86;text-align:center;color:#fff;letter-spacing:.01em;transform:rotate(-3deg);text-shadow:0 .05em 0 #2a86c2,0 .1em 0 #1a5d8e,0 .16em 0 #12466d,0 .24em .3em rgba(0,0,0,.4);animation:logoIn .8s cubic-bezier(.2,1.6,.4,1) backwards}
.logo span{display:block;color:#ffe066;font-size:1.22em;text-shadow:0 .05em 0 #f0a020,0 .1em 0 #c0700a,0 .15em 0 #8a4a06,0 .22em .3em rgba(0,0,0,.4)}
@keyframes logoIn{from{transform:scale(.3) rotate(-14deg);opacity:0}}
.btn{font:inherit;font-weight:900;border:0;border-radius:20px 20px 24px 24px;padding:14px 40px;font-size:26px;color:#4a2a00;background:linear-gradient(#fff0a0,#ffc23a 60%,#f5a020);box-shadow:0 7px 0 #b8700c,0 12px 22px rgba(0,0,0,.3),inset 0 2px 0 #fff8;cursor:pointer;margin:6px;transition:transform .1s cubic-bezier(.3,1.8,.5,1);display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover{transform:translateY(-2px) scale(1.04)}.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #b8700c}
.btn.alt{background:linear-gradient(#ffffff,#d8eef9);color:#1d4f6e;box-shadow:0 6px 0 #7fa9c2,0 10px 20px rgba(0,0,0,.25)}
.btn.sm{font-size:17px;padding:9px 20px}
.btn svg{width:1em;height:1em}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:rgba(10,40,70,.5);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);flex:none}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:6px;padding:10px 10px;pointer-events:none;z-index:5}
#hud.on{display:flex}#hud>*{pointer-events:auto}
.pill{background:rgba(10,40,70,.55);border-radius:16px;padding:4px 10px;display:flex;align-items:center;gap:6px;height:44px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);flex:none}
#goal{flex:1 1 auto;min-width:0;max-width:300px;margin-left:auto}
#goal canvas{width:40px;height:40px;flex:none}
#goal .gt{flex:1;min-width:0}#gTxt{font-weight:900;font-size:18px;line-height:1;white-space:nowrap}
.gbar{height:9px;border-radius:6px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}.gbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffe066,#ff9a2e);border-radius:6px;transition:width .35s cubic-bezier(.3,1.4,.5,1)}
#bagP b,#scoreP b{font-size:20px;font-weight:900}#bagP svg{width:24px;height:24px}
#bagP.low{animation:lowP .6s infinite alternate}@keyframes lowP{to{background:rgba(200,40,40,.7)}}
#scoreP{margin-right:auto;min-width:64px;justify-content:center}#scoreP .ms{display:block;font-size:11px;color:#ffd23a;line-height:1;text-align:center;letter-spacing:1px}#scoreP .ms i{font-style:normal;color:rgba(255,255,255,.3)}#scoreP b{line-height:1;text-align:center}
#bossBar{position:fixed;top:62px;left:50%;transform:translateX(-50%);width:min(420px,86vw);display:none;align-items:center;gap:8px;z-index:5;pointer-events:none}
#bossBar.on{display:flex}#bossName{font-weight:900;font-size:15px;text-shadow:0 2px 0 #0008;white-space:nowrap}
#bossBar .hp{flex:1;height:14px;border-radius:8px;background:rgba(0,0,0,.45);overflow:hidden;border:2px solid #0006}#bossFill{display:block;height:100%;background:linear-gradient(#ff7a6a,#d02a3a);width:100%;transition:width .3s}
body:has(#gbbar) #hud{padding-top:46px}body:has(#gbbar) #bossBar{top:98px}
#dock{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:none;justify-content:center;align-items:flex-end;gap:10px;pointer-events:none;z-index:5}
#dock.on{display:flex}
.slot{pointer-events:auto;position:relative;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#fffef6,#e8d9b4);box-shadow:0 5px 0 #a88a52,0 9px 16px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;border:0;font:inherit;cursor:pointer;color:#5a3a10;flex:none}
.slot canvas{width:88%;height:88%}
.slot span{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff;text-shadow:0 1px 2px #000;letter-spacing:.05em}
.slot.cur{width:92px;height:92px;box-shadow:0 6px 0 #a88a52,0 0 0 4px #ffd23a,0 12px 22px rgba(0,0,0,.35);animation:curB 1.6s ease-in-out infinite;cursor:default}
@keyframes curB{50%{transform:translateY(-4px)}}
.slot.cur.pop{animation:curPop .35s cubic-bezier(.2,1.8,.4,1)}@keyframes curPop{from{transform:scale(.4)}}
.slot b{position:absolute;right:-4px;top:-4px;background:#e2443c;color:#fff;border-radius:11px;min-width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 2px 0 #0005}
.slot.btnS svg{width:30px;height:30px;fill:none;stroke:#5a3a10;stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.slot.off{opacity:.45;filter:grayscale(.7)}
.slot.fin{background:radial-gradient(circle at 50% 35%,#f4ffe8,#b8ec9a);box-shadow:0 5px 0 #4a9a3a,0 0 0 3px #fff,0 9px 16px rgba(0,0,0,.3);animation:curB 1.2s ease-in-out infinite}
.slot.act{box-shadow:0 5px 0 #a88a52,0 0 0 4px #ff5a4a,0 9px 16px rgba(0,0,0,.3);animation:curB .5s infinite}
.slot:active:not(.cur){transform:translateY(4px);box-shadow:0 1px 0 #a88a52}
#holdS.none{display:none}
.panel{background:linear-gradient(#fffef8,#eaf5fb);color:#1d4f6e;border-radius:28px;padding:20px 24px;text-align:center;box-shadow:0 10px 0 #7fa9c2,0 20px 50px rgba(0,0,0,.45);animation:pop .4s cubic-bezier(.2,1.6,.4,1);max-width:94vw;width:380px;position:relative}
@keyframes pop{from{transform:scale(.4) translateY(40px);opacity:0}}
.panel h3{font-size:30px;font-weight:900;margin-bottom:4px;line-height:1.05}
.panel .sub{opacity:.7;font-size:15px;margin-bottom:6px;font-weight:700}
.dim{position:fixed;inset:0;background:rgba(5,25,45,.5)}#sOver{z-index:20}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0}
.stars svg{width:62px;height:62px;filter:drop-shadow(0 4px 0 #0002)}.stars svg:nth-child(2){transform:translateY(-12px);width:72px;height:72px}
.stars .on{animation:starIn .45s cubic-bezier(.2,1.8,.4,1) backwards}@keyframes starIn{from{transform:scale(0) rotate(-90deg)}}
.big{font-size:46px;font-weight:900;color:#e08a1e;text-shadow:0 3px 0 #9a4f0a33;line-height:1}
.tease{display:flex;align-items:center;gap:10px;justify-content:center;background:#dff0f9;border-radius:16px;padding:6px 12px;margin:10px 0 4px;font-weight:900}
.tease canvas{width:52px;height:52px}
.prow{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.crw{display:inline-flex;align-items:center;gap:4px;font-weight:900;font-size:22px}
.crw svg{width:24px;height:24px}
#sMap .top{position:absolute;top:10px;left:10px;right:10px;display:flex;align-items:center;gap:8px}
body:has(#gbbar) #sMap .top{top:46px}
#sMap .isleN{flex:1;text-align:center;font-size:clamp(20px,5vw,34px);font-weight:900;text-shadow:0 3px 0 #0005;display:flex;align-items:center;justify-content:center;gap:8px}
.crownP{background:rgba(10,40,70,.55);border-radius:14px;padding:6px 12px;font-weight:900;font-size:20px;display:flex;align-items:center;gap:6px}.crownP svg{width:22px;height:22px}
#path{position:relative;width:min(640px,94vw);height:min(440px,62vh);margin-top:30px}
#path svg.ln{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.nd{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;border:0;font:inherit;font-size:26px;font-weight:900;color:#5a3a10;background:radial-gradient(circle at 50% 30%,#fff6d0,#f0c870);box-shadow:0 6px 0 #9a6a20,0 10px 18px rgba(0,0,0,.35);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .12s cubic-bezier(.3,1.8,.5,1)}
.nd:hover{transform:scale(1.1)}.nd:active{transform:translateY(4px)}
.nd.boss{width:80px;height:80px;margin:-40px 0 0 -40px;background:radial-gradient(circle at 50% 30%,#ffb0a0,#d8443a);color:#fff;box-shadow:0 6px 0 #8a1a1a,0 10px 18px rgba(0,0,0,.35)}
.nd.bonus{background:radial-gradient(circle at 50% 30%,#fffbe0,#ffd23a);box-shadow:0 6px 0 #b8800a,0 0 18px #ffe066}
.nd.lock{background:radial-gradient(circle at 50% 30%,#d8dde2,#9aa4ae);box-shadow:0 6px 0 #5a6470;color:#5a6470;cursor:default}
.nd.lock svg{width:26px;height:26px}
.nd.nxt{animation:ndB 1s ease-in-out infinite}@keyframes ndB{50%{transform:translateY(-8px) scale(1.06)}}
.nd .st{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);display:flex;gap:1px}.nd .st svg{width:17px;height:17px}
.nd .bi{width:44px;height:44px}
.mbot{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:4px;flex-wrap:wrap;padding:0 60px}
.ups{display:flex;flex-direction:column;gap:8px;max-height:58vh;overflow-y:auto;margin:8px 0;padding:2px}
.up{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 10px;box-shadow:0 4px 0 #b8d4e4;text-align:left}
.up canvas{width:44px;height:44px;flex:none}.up .t{flex:1;min-width:0}.up .nm{font-weight:900;font-size:16px}.up .ds{font-size:12px;opacity:.7;font-weight:700}
.up .dots{font-size:10px;letter-spacing:1px;color:#e08a1e}
.up button{font:inherit;font-weight:900;border:0;border-radius:12px;padding:8px 10px;background:#ffd23a;color:#4a2a00;box-shadow:0 3px 0 #b8800a;cursor:pointer;display:flex;align-items:center;gap:3px;white-space:nowrap}
.up button svg{width:16px;height:16px}.up button.no{background:#ccd6dd;box-shadow:0 3px 0 #8a98a4;color:#5a6470}.up button.mx{background:#9be08a;box-shadow:0 3px 0 #4a9a3a;color:#1d4a10}
#mute{position:fixed;top:10px;right:10px;z-index:9}body:has(#gbbar) #mute{top:46px}
#intro{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%);display:none;align-items:center;gap:12px;background:linear-gradient(#fffef8,#eaf5fb);color:#1d4f6e;border-radius:22px;padding:10px 20px 10px 12px;box-shadow:0 7px 0 #7fa9c2,0 14px 30px rgba(0,0,0,.4);font-weight:900;font-size:20px;z-index:6;pointer-events:none;white-space:nowrap}
#intro.on{display:flex;animation:introIn .5s cubic-bezier(.2,1.6,.4,1)}@keyframes introIn{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
#intro canvas{width:64px;height:64px}#intro small{display:block;font-size:12px;color:#e2443c;letter-spacing:.1em}
.gbsup{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font-size:12px;font-weight:700;color:#fff;opacity:.55;text-decoration:none;text-shadow:0 1px 3px rgba(0,0,0,.7);transition:opacity .2s}
.gbsup:hover{opacity:1}
#hint{position:fixed;bottom:118px;left:0;right:0;text-align:center;font-size:13px;font-weight:800;opacity:.85;pointer-events:none;display:none;text-shadow:0 1px 3px #000;z-index:4}
#hint .k{display:inline-block;background:#fff;color:#1d4f6e;border-radius:5px;padding:1px 6px;margin:0 2px;box-shadow:0 2px 0 #7fa9c2}
@media (max-width:560px){.pill{height:40px;padding:3px 7px;gap:4px}#goal canvas{width:32px;height:32px}#gTxt{font-size:15px}#bagP b,#scoreP b{font-size:16px}#scoreP{min-width:46px}#bagP svg{width:18px;height:18px}.ib{width:40px;height:40px}
 .slot{width:54px;height:54px}.slot.cur{width:82px;height:82px}#dock{gap:7px}.nd{width:54px;height:54px;margin:-27px 0 0 -27px;font-size:22px}.nd.boss{width:68px;height:68px;margin:-34px 0 0 -34px}#intro{font-size:16px}#intro canvas{width:50px;height:50px}.mbot{padding:0 40px 0 6px}#hint{bottom:108px}#sMap .top{flex-wrap:wrap;right:56px}#sMap .isleN{order:3;flex-basis:100%;margin-top:4px}#sMap .top>div[style]{display:none}#sMap .crownP{margin-left:auto}#path{margin-top:70px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sTitle" class="scr on">
  <div class="logo">ISLAND<span>TOWN</span></div>
  <div style="height:5vh"></div>
  <button class="btn" id="bPlay"></button>
  <div><button class="btn alt sm" id="bHow">How to play</button><button class="btn alt sm" id="bBoard" aria-label="Leaderboard"></button></div>
  <a class="gbsup" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>
<div id="sMap" class="scr">
  <div class="top"><button class="ib" id="mBack"></button><div class="isleN"><button class="ib" id="mPrev"></button><span id="isleName">Green Isle</span><button class="ib" id="mNext"></button></div><div class="crownP" id="mCrowns"></div><div style="width:44px"></div></div>
  <div id="path"></div>
  <div class="mbot"><button class="btn sm" id="bEndless">Endless</button><button class="btn alt sm" id="bUps">Upgrades</button><button class="btn alt sm" id="bBoard2" aria-label="Leaderboard"></button></div>
</div>
<div id="hud">
  <button class="ib" id="bPause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button>
  <div class="pill" id="goal"><canvas id="gIco" width="96" height="96"></canvas><div class="gt"><div id="gTxt">0/2</div><div class="gbar"><i id="gFill"></i></div></div></div>
  <div class="pill" id="bagP"><svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7z" fill="#e8c27a" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M9 8a3 3 0 0 1 6 0" fill="none" stroke="#fff" stroke-width="2"/></svg><b id="bagN">0</b></div>
  <div class="pill" id="scoreP"><b id="scoreN">0</b></div>
  <div style="width:44px;flex:none"></div>
</div>
<div id="bossBar"><span id="bossName">KRAKEN</span><div class="hp"><i id="bossFill"></i></div></div>
<button class="ib" id="mute"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
<div id="intro"><canvas id="introC" width="128" height="128"></canvas><div><small>NEW!</small><span id="introT"></span></div></div>
<div id="hint"></div>
<div id="dock">
  <button class="slot none" id="holdS" data-gbctl="hold"><canvas width="128" height="128"></canvas><span>HOLD</span></button>
  <div class="slot cur" id="curS"><canvas width="160" height="160"></canvas></div>
  <div class="slot" id="nextS"><canvas width="128" height="128"></canvas><span>NEXT</span></div>
  <button class="slot btnS" id="undoS" data-gbctl="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg><b id="undoN">0</b><span>UNDO</span></button>
  <button class="slot btnS" id="hamS" data-gbctl="hammer"><canvas width="128" height="128"></canvas><b id="hamN">0</b><span>SMASH</span></button>
  <button class="slot btnS fin" id="finS" data-gbctl="finish" style="display:none"><svg viewBox="0 0 24 24"><path d="M6 21V4"/><path d="M6 4h11l-2.5 4L17 12H6" fill="#9be08a"/></svg><span>FINISH</span></button>
</div>
<div id="sOver" class="scr"><div class="dim"></div><div class="panel" id="panel"></div></div>
<script>
"use strict";
var SK="gamebop.tile-kingdom.";
function ld(k,d){try{var v=localStorage.getItem(SK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch(e){}}
var $=function(i){return document.getElementById(i)};
// ---------- save (v2, migrates the old Island Builder save) ----------
var save=(function(){var s=ld("save",null);if(!s||typeof s!=="object")s={};
 if(s.v!==2){var o=s;s={v:2,crowns:Math.max(0,o.crowns|0),stars:{},unl:1,up:{},runs:o.runs|0,endBest:0,cur:null};
  if(o.isles&&typeof o.isles==="object"){var mx=0;for(var k in o.isles)if(o.isles[k])mx=Math.max(mx,+k||0);s.unl=Math.min(25,1+mx*6)}
  if(o.best&&typeof o.best==="object")s.oldBest=o.best;
  if(o.up&&typeof o.up==="object"){var bonus=0;for(var u in o.up)bonus+=(+o.up[u]||0)*25;s.crowns+=bonus}}
 if(!s.stars||typeof s.stars!=="object")s.stars={};if(!s.up||typeof s.up!=="object")s.up={};s.unl=Math.max(1,Math.min(30,s.unl|0||1));s.crowns=Math.max(0,s.crowns|0);s.endBest=s.endBest|0;s.runs=s.runs|0;
 return s})();
var muted=!!ld("mute",false);
function persist(){sv("save",save)}
persist();
var SVG={crown:'<svg viewBox="0 0 24 24"><path d="M3 18l1.5-10 5 4.5L12 5l2.5 7.5 5-4.5L21 18z" fill="#ffd23a" stroke="#b8700c" stroke-width="1.6" stroke-linejoin="round"/><rect x="3" y="18" width="18" height="3" rx="1" fill="#f5a020"/></svg>',
 star:function(on){return '<svg viewBox="0 0 24 24" class="'+(on?"on":"")+'"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.5l1.3-6.6L2.5 9.3l6.6-.8z" fill="'+(on?"#ffd23a":"#c9d6de")+'" stroke="'+(on?"#d08a10":"#9aabb8")+'" stroke-width="1.6" stroke-linejoin="round"/></svg>'},
 trophy:'<svg viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="#ffd23a" stroke="#b8700c" stroke-width="1.6"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4" fill="none" stroke="#b8700c" stroke-width="1.6"/><path d="M10 14h4v3h-4zM8 20h8v-3H8z" fill="#f5a020" stroke="#b8700c" stroke-width="1.4"/></svg>',
 lock:'<svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2" fill="#5a6470"/><path d="M8 10V7a4 4 0 0 1 8 0v3" fill="none" stroke="#5a6470" stroke-width="2.6"/></svg>',
 back:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',fwd:'<svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>',
 play:'<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z" fill="#4a2a00"/></svg>',
 retry:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v5h5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
 map:'<svg viewBox="0 0 24 24"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>',
 undo:'<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 0 1 0 12h-3" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>'};
$("bBoard").innerHTML=SVG.trophy;$("bBoard2").innerHTML=SVG.trophy;$("mBack").innerHTML=SVG.back;$("mPrev").innerHTML=SVG.back;$("mNext").innerHTML=SVG.fwd;

// ---------- data ----------
var DIRS=[[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
var VAL=[0,5,20,75,250,800,2500,8000],SVAL=[0,30,150,600],DMG=[0,0,4,12,36,100,300,900],SDMG=[0,0,25,90];
var TN=["","Hut","House","Manor","Tower","Castle","Palace","Sky Palace"],SN=["","Statue","Fountain","Monument"];

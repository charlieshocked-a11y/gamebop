<script>
'use strict';
const SLUG='bounce-brigade';
const S={k:k=>'gamebop.'+SLUG+'.'+k,
 get(k,d){try{const v=localStorage.getItem(this.k(k));return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(this.k(k),JSON.stringify(v))}catch(e){}},
 del(k){try{localStorage.removeItem(this.k(k))}catch(e){}}};

/* ---------- audio ---------- */
const A={c:null,m:null,nb:null,muted:!!S.get('muted',false),
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.42;this.m.connect(this.c.destination)}catch(e){this.c=null}},
 mute(v){this.muted=v;S.set('muted',v);if(this.m)this.m.gain.value=v?0:.42;drawMute()},
 t(f,d,type,vol,slide,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+d+.03)}catch(e){}},
 n(d,vol,freq,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0);if(!this.nb){const L=c.sampleRate;this.nb=c.createBuffer(1,L,L);const a=this.nb.getChannelData(0);for(let i=0;i<L;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=freq||2000;const g=c.createGain();g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+d+.03)}catch(e){}}};
const SFX={
 pad(){A.t(260,.09,'square',.1,1.6)},
 hit(c){A.t(420+Math.min(c,20)*35,.06,'triangle',.16)},
 brk(c){A.t(620+Math.min(c,20)*40,.11,'square',.08,.45);A.t(1240+Math.min(c,20)*60,.05,'sine',.06)},
 steel(){A.t(1800,.05,'square',.05,.8)},
 boom(){A.n(.45,.35,900);A.t(90,.35,'sawtooth',.18,.4)},
 laser(){A.t(1100,.07,'sawtooth',.035,.35)},
 gem(){A.t(1320,.07,'sine',.1,1.5);A.t(1980,.06,'sine',.06,1.2,.04)},
 lose(){A.t(440,.6,'sawtooth',.13,.25);A.t(220,.7,'triangle',.12,.3,.1)},
 clear(){[523,659,784,1046].forEach((f,i)=>A.t(f,.18,'square',.08,1,i*.08));A.t(1568,.4,'triangle',.1,1,.34)},
 pick(){A.t(660,.08,'square',.08,1.5);A.t(990,.12,'triangle',.1,1.4,.06)},
 boss(){A.t(130,.14,'square',.16,.6);A.n(.12,.15,600)},
 zap(){A.t(1600,.09,'sawtooth',.05,.3)},
 stun(){A.t(200,.3,'sawtooth',.14,.3);A.n(.2,.2,1500)},
 click(){A.t(880,.05,'square',.06,1.3)},
 warn(){A.t(700,.12,'square',.06,1.02);A.t(700,.12,'square',.06,1.02,.2)}};

/* ---------- helpers ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){let s=(seed>>>0)||1;const f=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296};f.pick=a=>a[Math.floor(f()*a.length)];return f}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);const f=amt<0?0:255,t=Math.abs(amt);r=Math.round(lerp(r,f,t));g=Math.round(lerp(g,f,t));b=Math.round(lerp(b,f,t));return'rgb('+r+','+g+','+b+')'}

/* ---------- data ---------- */
const VW=480,VH=720,PY=662,TOP=46,BW=44,BH=19,BX=11,BY=86,COLS=10;
const WORLDS=[
 {n:'NEON MEADOW',bg:['#1d0f4a','#4a1a72'],acc:'#ff4fa3',pal:['#ff5fa8','#ffa64f','#ffe25f','#6bf0a0','#5fd0ff','#b47dff']},
 {n:'CRYSTAL CAVES',bg:['#04183a','#0e4274'],acc:'#4fe0ff',pal:['#5fe8ff','#5f9cff','#9a7dff','#d77dff','#ff7de0','#e8f4ff']},
 {n:'MOLTEN FORGE',bg:['#2a0806','#621c0a'],acc:'#ff7a2e',pal:['#ffd25f','#ff9a3f','#ff5f3f','#e8304f','#b02a7a','#ffe8a0']},
 {n:'SKY CITADEL',bg:['#163a7a','#4a8ad0'],acc:'#ffe066',pal:['#ffffff','#9fe0ff','#ffe066','#ffb14f','#ff7fa0','#c08aff']},
 {n:'VOID CORE',bg:['#07040f','#2a0f3e'],acc:'#8aff5f',pal:['#8aff5f','#4fffd0','#b36bff','#ff4fd8','#ff5f5f','#ffffff']}];
const BOSSES=[
 {hp:36,col:'#ff4fa3',spd:70,atk:['bricks','shards'],shape:0},
 {hp:55,col:'#4fe0ff',spd:55,atk:['shards','bricks','shards'],shape:1},
 {hp:75,col:'#ff7a2e',spd:45,atk:['rain','armor','rain'],shape:2},
 {hp:95,col:'#ffe066',spd:120,atk:['beam','shards','tele'],shape:3},
 {hp:130,col:'#b36bff',spd:85,atk:['beam','rain','bricks','tele','shards'],shape:4}];
const UPS={
 multi:{n:'Multiball',d:'+1 ball per serve',max:3,c:'#4fd8ff'},
 pierce:{n:'Piercing',d:'smash through bricks',max:4,c:'#a8b8ff'},
 fire:{n:'Fireball',d:'burn neighbours',max:3,c:'#ff7a2e'},
 wide:{n:'Wide Paddle',d:'bigger paddle',max:4,c:'#7dff8a'},
 laser:{n:'Lasers',d:'auto-fire cannons',max:4,c:'#ff4466'},

 heavy:{n:'Heavy Ball',d:'+1 damage',max:3,c:'#e0e0f0'},
 zap:{n:'Zap',d:'chain lightning',max:3,c:'#7ab0ff'},
 magnet:{n:'Gem Magnet',d:'gems fly to you',max:2,c:'#ff9cff'}};
const PADS=[
 {id:'classic',n:'Classic',cost:0,w:92,c:'#4fd8ff',up:{}},
 {id:'bulwark',n:'Bulwark',cost:60,w:124,c:'#7dff8a',up:{}},
 {id:'blaster',n:'Blaster',cost:150,w:92,c:'#ff5577',up:{laser:1}},
 {id:'inferno',n:'Inferno',cost:260,w:92,c:'#ff9a2e',up:{fire:1}},
 {id:'twin',n:'Twin Core',cost:420,w:96,c:'#c77dff',up:{multi:1}},
 {id:'prism',n:'Prism',cost:650,w:92,c:'#fff36b',up:{split:2,zap:1}},
 {id:'royal',n:'Royal',cost:1000,w:106,c:'#ffd23f',up:{guard:1,gemx:1,heavy:1}}];
const PERKS=[{id:'hp',n:'+Heart',ic:'heart',cost:[120,400]},{id:'reroll',n:'Reroll',ic:'reroll',cost:[80,220,480]},{id:'gem',n:'Gems+',ic:'gemx',cost:[100,260,520]}];

let meta=Object.assign({gems:0,own:['classic'],sel:'classic',perks:{hp:0,reroll:0,gem:0},maxW:1,heat:0,heatMax:0,best:0,wins:0,runs:0},S.get('meta',{}));
meta.perks=Object.assign({hp:0,reroll:0,gem:0},meta.perks||{});
function saveMeta(){S.set('meta',meta)}

/* ---------- icons ---------- */
function icon(g,id,x,y,s,col){
 g.save();g.translate(x,y);g.scale(s/40,s/40);g.lineCap='round';g.lineJoin='round';
 const c=col||(UPS[id]&&UPS[id].c)||'#fff';g.fillStyle=c;g.strokeStyle=c;g.lineWidth=4;
 const circ=(cx,cy,r)=>{g.beginPath();g.arc(cx,cy,r,0,7);g.fill()};
 switch(id){
 case'multi':circ(-9,6,7);circ(9,6,7);circ(0,-9,7);break;
 case'pierce':g.fillRect(-16,-3,32,6);g.beginPath();g.moveTo(0,18);g.lineTo(0,-14);g.stroke();g.beginPath();g.moveTo(-8,-6);g.lineTo(0,-16);g.lineTo(8,-6);g.stroke();break;
 case'fire':g.beginPath();g.moveTo(0,-18);g.bezierCurveTo(14,-4,16,6,12,12);g.quadraticCurveTo(0,22,-12,12);g.bezierCurveTo(-16,4,-8,-2,-6,-8);g.quadraticCurveTo(-2,-2,0,-18);g.fill();g.fillStyle='#ffe066';g.beginPath();g.moveTo(0,-2);g.quadraticCurveTo(8,8,4,13);g.quadraticCurveTo(0,16,-4,13);g.quadraticCurveTo(-6,6,0,-2);g.fill();break;
 case'wide':rr(g,-12,2,24,8,4);g.fill();g.beginPath();g.moveTo(-14,-8);g.lineTo(-19,-4);g.lineTo(-14,0);g.moveTo(14,-8);g.lineTo(19,-4);g.lineTo(14,0);g.moveTo(-18,-4);g.lineTo(18,-4);g.stroke();break;
 case'laser':rr(g,-16,8,32,8,4);g.fill();g.fillRect(-13,-18,4,22);g.fillRect(9,-18,4,22);break;
 case'split':circ(0,12,6);g.beginPath();g.moveTo(0,6);g.lineTo(0,-2);g.lineTo(-12,-14);g.moveTo(0,-2);g.lineTo(12,-14);g.stroke();circ(-13,-15,5);circ(13,-15,5);break;
 case'heart':g.beginPath();g.moveTo(0,16);g.bezierCurveTo(-24,0,-14,-20,0,-8);g.bezierCurveTo(14,-20,24,0,0,16);g.fill();break;
 case'guard':g.beginPath();g.moveTo(0,-17);g.lineTo(15,-10);g.quadraticCurveTo(14,10,0,18);g.quadraticCurveTo(-14,10,-15,-10);g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,.35)';g.beginPath();g.moveTo(-6,0);g.lineTo(-1,5);g.lineTo(7,-5);g.stroke();break;
 case'gemx':g.beginPath();g.moveTo(0,-17);g.lineTo(15,-4);g.lineTo(0,17);g.lineTo(-15,-4);g.closePath();g.fill();g.fillStyle='rgba(255,255,255,.6)';g.beginPath();g.moveTo(0,-17);g.lineTo(6,-4);g.lineTo(-6,-4);g.closePath();g.fill();break;
 case'slow':g.beginPath();g.arc(0,0,15,0,7);g.stroke();g.beginPath();g.moveTo(0,0);g.lineTo(0,-9);g.moveTo(0,0);g.lineTo(7,4);g.stroke();break;
 case'boom':g.beginPath();for(let i=0;i<16;i++){const a=i/16*Math.PI*2,r=i%2?8:18;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.fillStyle='#ffe066';circ(0,0,5);break;
 case'heavy':circ(0,2,14);g.fillStyle='rgba(0,0,0,.25)';circ(4,6,7);g.fillStyle='rgba(255,255,255,.7)';circ(-5,-4,4);break;
 case'zap':g.beginPath();g.moveTo(4,-18);g.lineTo(-10,2);g.lineTo(-1,2);g.lineTo(-5,18);g.lineTo(10,-3);g.lineTo(1,-3);g.closePath();g.fill();break;
 case'magnet':g.lineWidth=8;g.lineCap='butt';g.beginPath();g.arc(0,0,11,Math.PI,0,true);g.stroke();g.beginPath();g.moveTo(-11,0);g.lineTo(-11,-14);g.moveTo(11,0);g.lineTo(11,-14);g.stroke();g.strokeStyle='#fff';g.beginPath();g.moveTo(-11,-10);g.lineTo(-11,-15);g.moveTo(11,-10);g.lineTo(11,-15);g.stroke();break;
 case'reroll':g.beginPath();g.arc(0,0,13,-.4,4.4);g.stroke();g.beginPath();g.moveTo(13,-14);g.lineTo(13,-4);g.lineTo(3,-6);g.fill();break;
 }

/* ---------- stage generation ---------- */
const PATS=['full','pyramid','vee','diamond','checker','stripes','columns','ring','noise','zig','fortress','hearts','arches'];
function genStage(w,s,seed,isDemo){
 const R=rng(seed*7919+w*131+s*17+3);
 bricks=[];boss=null;
 const heat=run?run.heat:0;
 const rows=Math.min(13,5+Math.floor(s*.7)+w);
 const pat=isDemo?R.pick(['full','diamond','pyramid','checker','hearts','arches']):PATS[Math.floor(R()*PATS.length)];
 const noise=[];for(let r=0;r<rows;r++){noise[r]=[];for(let c=0;c<5;c++)noise[r][c]=R()}
 const maxHp=Math.min(6,2+Math.floor((w-1+heat)*.8+(s-1)/2));
 const mid=(rows-1)/2;
 for(let r=0;r<rows;r++)for(let c=0;c<5;c++){
  const cc=4-c;let on=true,steel=false;
  switch(pat){
   case'pyramid':on=cc<=r*5/rows+.4;break;
   case'vee':on=cc>=4-r*5/rows-.4;break;
   case'diamond':on=Math.abs(r-mid)/(mid+.5)*5+cc<=5.2;break;
   case'checker':on=(r+c)%2===0;break;
   case'stripes':on=r%2===0;break;
   case'columns':on=c%2===0||r===0;break;
   case'ring':on=r===0||r===rows-1||c===0||(cc<=1&&r>1&&r<rows-2);break;
   case'noise':on=noise[r][c]<.68;break;
   case'zig':on=((c+r)%4)<2||r===0;break;
   case'fortress':on=true;steel=(r===rows-1&&cc>1)||(c===0&&r>rows/2&&w>=2);break;
   case'hearts':{const hx=[0,1,1,0,0][r%5],row=r%5;on=row===0?(c===1||c===3):row===4?(c===2):row===3?(c>=1&&c<=3):true;break}
   case'arches':on=(r%4!==3)&&!(r%4>0&&(c===2));break;
  }
  if(!on)continue;
  for(const col of (c===4?[4,5]:[c,9-c])){
   if(c===4&&col===5){}
   const t=noise[r][c];
   let type='n',hp=clamp(1+Math.floor((1-r/rows)*maxHp+t*.6),1,6);
   if(steel&&!isDemo)type='w';
   else if(!isDemo){
    const q=(noise[(r+3)%rows][(c+2)%5]*7.31+r*.13)%1;
    if(q<.05+.012*w)type='x';
    else if(q<.09+.03*w&&(w>=2||s>=4))type='a';
    else if(q<.10+.035*w&&w>=2)type='s';
    else if(q>.965)type='g';
   }
   if(type==='a')hp=3+w+heat;
   if(type==='x'||type==='g')hp=1;
   if(type==='s')hp=2+Math.floor(w/2);
   addBrick(col,r,type,hp);
  }
 }
 // moving row
 if(!isDemo&&(w>=2||s>=3)&&s!==6){
  const r=rows+1,k=3+Math.floor(R()*3),dir=R()<.5?-1:1,sp=(55+w*12)*dir;
  for(let i=0;i<k;i++){const b=addBrick(0,r,'m',1+Math.floor(w/2));b.x=BX+i*(BW+10)+(VW-k*(BW+10))/2-BX;b.vx=sp}
 }
 if(s===6&&!isDemo){bricks=bricks.filter(b=>b.gy<3);spawnBoss(w)}
 bricks.forEach(b=>{b.maxhp=b.hp;b.sy=b.y;b.y-=300+b.gy*30;b.drop=0});
}
function addBrick(gx,gy,type,hp){const b={gx,gy,x:BX+gx*(BW+2),y:BY+gy*(BH+2),w:BW,h:BH,hp,maxhp:hp,type,alive:true,flash:0,vx:0,ph:Math.random()*6,spawn:rnd(4,8)};bricks.push(b);return b}
function spawnBoss(w){const d=BOSSES[w-1],heat=run?run.heat:0;boss={d,w,x:VW/2,y:170,bw:150,bh:78,hp:Math.round(d.hp*(1+.35*heat)),max:0,vx:d.spd,t:2.2,flash:0,ph:0,eye:0,phase:1,dead:0,tele:0};boss.max=boss.hp;bricks=bricks.map(b=>{b.y+=150;return b})}

function part(x,y,c,vx,vy,life,size,g){if(parts.length>700)return;parts.push({x,y,c,vx,vy,l:life,m:life,s:size,g:g==null?500:g})}

/* ---------- collisions ---------- */
function circRect(b,rx,ry,rw,rh){
 const px=clamp(b.x,rx,rx+rw),py=clamp(b.y,ry,ry+rh);let dx=b.x-px,dy=b.y-py;const d2=dx*dx+dy*dy;
 if(d2>b.r*b.r)return null;
 if(d2<1e-6){const l=b.x-rx,r=rx+rw-b.x,t=b.y-ry,bo=ry+rh-b.y,m=Math.min(l,r,t,bo);
  if(m===l)return{nx:-1,ny:0,pen:l+b.r};if(m===r)return{nx:1,ny:0,pen:r+b.r};if(m===t)return{nx:0,ny:-1,pen:t+b.r};return{nx:0,ny:1,pen:bo+b.r}}
 const d=Math.sqrt(d2);let nx=dx/d,ny=dy/d;
 if(Math.abs(nx)>.8){ny=0;nx=Math.sign(nx)}else if(Math.abs(ny)>.8){nx=0;ny=Math.sign(ny)}
 return{nx,ny,pen:b.r-d+.5}}
function reflect(b,n){const dot=b.vx*n.nx+b.vy*n.ny;if(dot<0){b.vx-=2*dot*n.nx;b.vy-=2*dot*n.ny}b.x+=n.nx*n.pen;b.y+=n.ny*n.pen;fixAngle(b)}
function fixAngle(b){const sp=Math.hypot(b.vx,b.vy)||1;b.vx=b.vx/sp*b.spd;b.vy=b.vy/sp*b.spd;if(Math.abs(b.vy)<b.spd*.28){b.vy=(b.vy<0?-1:1)*b.spd*.28;b.vx=Math.sign(b.vx||1)*Math.sqrt(b.spd*b.spd-b.vy*b.vy)}}
function ballDmg(){return 1+(upl('fire')>0?1:0)+upl('heavy')+(upl('fire')>=3?1:0)}
function damageBrick(b,dmg,src){
 if(!b.alive)return false;
 if(b.type==='w'){b.flash=1;if(src==='ball')SFX.steel();return false}
 b.hp-=dmg;b.flash=1;
 if(b.hp<=0){killBrick(b);return true}
 if(src==='ball')SFX.hit(combo);burst(b.x+b.w/2,b.y+b.h/2,'#fff',4,120);return false}
function killBrick(b){
 b.alive=false;const c=brickCol(b);
 for(let i=0;i<12;i++)part(b.x+rnd(0,b.w),b.y+rnd(0,b.h),c,rnd(-160,160),rnd(-220,60),rnd(.4,.9),rnd(3,6));
 if(!run||demo){if(demo)SFX.brk(combo);return}
 if(TUT)TUT.kills++;combo++;const pts=Math.round(10*b.maxhp*(1+combo*.1));run.score+=pts;
 if(combo>=3)floats.push({x:b.x+b.w/2,y:b.y,t:0,s:''+pts,c:'#fff'});
 SFX.brk(combo);
 if(b.type==='x')booms.push({x:b.x+b.w/2,y:b.y+b.h/2,t:.07,r:58,dmg:3});
 if(b.type==='g')for(let i=0;i<4;i++)drops.push({k:'gem',x:b.x+b.w/2,y:b.y+b.h/2,vx:rnd(-80,80),vy:rnd(-160,-40),v:1});
 else if(Math.random()<.06)drops.push({k:'gem',x:b.x+b.w/2,y:b.y+b.h/2,vx:rnd(-30,30),vy:-60,v:1});
 if(Math.random()<.015&&balls.length<10)drops.push({k:'ball',x:b.x+b.w/2,y:b.y+b.h/2,vx:0,vy:20});
}
function brickCol(b){const w=W_();if(b.type==='a')return'#9aa4c4';if(b.type==='x')return'#ff3a3a';if(b.type==='w')return'#556';if(b.type==='g')return'#ffd23f';if(b.type==='s')return'#4cff9a';return w.pal[clamp(Math.ceil(b.hp)-1,0,5)]}
function ballHitsBrick(ball,b,n){

  if(upl('boom')&&Math.random()<.08*upl('boom'))booms.push({x:b.x+b.w/2,y:b.y+b.h/2,t:0,r:48,dmg:1});
  if(upl('zap')&&Math.random()<.15*upl('zap')){const c=bricks.filter(o=>o.alive&&o!==b&&o.type!=='w'&&Math.hypot(o.x-b.x,o.y-b.y)<170);if(c.length){const t=c[Math.floor(Math.random()*c.length)];zaps.push({x1:b.x+b.w/2,y1:b.y+b.h/2,x2:t.x+t.w/2,y2:t.y+t.h/2,t:.18});damageBrick(t,1,'zap');SFX.zap()}}
  if(upl('split')&&balls.length<10&&Math.random()<.06*upl('split')){const a=Math.atan2(ball.vy,ball.vx)+(Math.random()<.5?.45:-.45);const nb=mkBall(ball.x,ball.y,Math.cos(a)*ball.spd,Math.sin(a)*ball.spd,false);nb.spd=ball.spd;balls.push(nb);burst(ball.x,ball.y,'#fff36b',8,150)}

 if(B.tele>0){B.tele-=dt;if(B.tele<=0){B.x=rnd(100,VW-100);burst(B.x,B.y,B.d.col,30,250)}}
 else{B.x+=B.vx*enr*dt;if(B.x<B.bw/2+14){B.x=B.bw/2+14;B.vx=Math.abs(B.vx)}if(B.x>VW-B.bw/2-14){B.x=VW-B.bw/2-14;B.vx=-Math.abs(B.vx)}}

 if(slowT>0){slowT-=dt;dt*=.35}

 if(TUT.ok>0){TUT.ok+=dt;if(TUT.ok>.8){TUT.step++;if(TUT.step>=TSTEPS.length){tutEnd();return}TUT.t=0;TUT.ok=0;const s=TSTEPS[TUT.step];if(s.enter)s.enter()}return}
 if(TUT.t>.3&&TSTEPS[TUT.step].done()){TUT.ok=.0001;if(TUT.step<TSTEPS.length-1)SFX.pick()}}
function tutHand(g,x,y,press){g.save();g.translate(x,y);const sc=press?.9:1;g.scale(sc,sc);g.lineJoin='round';g.lineWidth=3;g.strokeStyle='#1a0a3a';g.fillStyle='#fff';rr(g,-6,-30,13,36,6.5);g.fill();g.stroke();g.beginPath();g.moveTo(-16,2);g.quadraticCurveTo(-18,30,2,34);g.quadraticCurveTo(22,32,20,6);g.lineTo(20,-4);g.quadraticCurveTo(14,-8,9,-2);g.lineTo(-6,-2);g.quadraticCurveTo(-14,-6,-16,2);g.closePath();g.fill();g.stroke();if(press){g.strokeStyle='#ffd84a';g.beginPath();g.arc(0,-30,13,0,7);g.stroke()}g.restore()}

function tutRing(g,x,y,r,col){const p=(T*1.4)%1;g.strokeStyle=col;g.lineWidth=3;g.globalAlpha*=1;const a0=g.globalAlpha;g.globalAlpha=a0*(1-p);g.beginPath();g.arc(x,y,r+p*r*.7,0,7);g.stroke();g.globalAlpha=a0;g.setLineDash([7,6]);g.lineDashOffset=-T*30;g.beginPath();g.arc(x,y,r,0,7);g.stroke();g.setLineDash([])}
function tutDraw(g){if(!TUT||paused)return;const st=TUT.step,acc=W_().acc;const fade=TUT.ok>.4?1-eIO((TUT.ok-.4)/.4):Math.min(1,TUT.t/.35);
 g.save();g.globalAlpha=Math.max(0,fade);
 if(st===0){const sw=Math.sin(T*2.4);g.strokeStyle=acc;g.lineWidth=4;g.lineCap='round';for(const s of[-1,1]){const x=pad.x+s*(pad.w/2+22+Math.abs(sw)*6);g.beginPath();g.moveTo(x,PY+4);g.lineTo(x+s*16,PY+4);g.stroke();g.beginPath();g.moveTo(x+s*16,PY+4);g.lineTo(x+s*8,PY-4);g.moveTo(x+s*16,PY+4);g.lineTo(x+s*8,PY+12);g.stroke()}
  if(tutTouch)tutHand(g,VW/2+sw*110,PY+44,true);else{tutKey(g,VW/2-60,PY+34,'←',keys.ArrowLeft||keys.KeyA);tutKey(g,VW/2-22,PY+34,'→',keys.ArrowRight||keys.KeyD);g.fillStyle='rgba(255,255,255,.7)';g.font='900 13px Trebuchet MS,sans-serif';g.textAlign='center';g.fillText('or',VW/2+12,PY+39);tutMouse(g,VW/2+50+sw*28,PY+36,false)}}
 else if(st===1){const b=balls.find(b=>b.stuck);if(b)tutRing(g,b.x,b.y,16,'#ffd84a');if(tutTouch){const ph=(T*1.5)%1;tutHand(g,VW/2+60,PY-80+(ph>.5&&ph<.75?0:-eIO(ph/.5)*8),ph>.5&&ph<.75)}else{tutKey(g,VW/2-36,PY+34,'Space',keys.Space,64);g.fillStyle='rgba(255,255,255,.7)';g.font='900 13px Trebuchet MS,sans-serif';g.textAlign='center';g.fillText('or',VW/2+12,PY+39);tutMouse(g,VW/2+44,PY+34,false)}}
 else if(st===2){let lo=null;for(const b of bricks)if(b.alive&&b.type!=='w'&&(!lo||b.y>lo.y||(b.y===lo.y&&Math.abs(b.x+b.w/2-VW/2)<Math.abs(lo.x+lo.w/2-VW/2))))lo=b;if(lo){const bx=lo.x+lo.w/2,by=lo.y+lo.h;const bob=Math.abs(Math.sin(T*5))*10;g.fillStyle='#ffd84a';g.strokeStyle='#2a0b4a';g.lineWidth=3;g.beginPath();const y=by+14+bob;g.moveTo(bx,y);g.lineTo(bx-12,y+16);g.lineTo(bx-5,y+16);g.lineTo(bx-5,y+32);g.lineTo(bx+5,y+32);g.lineTo(bx+5,y+16);g.lineTo(bx+12,y+16);g.closePath();g.stroke();g.fill()}}
 else if(st===3){g.font='900 20px Trebuchet MS,sans-serif';const sw=g.measureText(''+run.score).width;tutRing(g,VW-14-sw-80,22,18,'#5fe8ff')}
 g.restore();
 // caption
 const cap=TSTEPS[st].cap();g.font='900 22px Trebuchet MS,sans-serif';const tw=g.measureText(cap).width,chk=TUT.ok>0?36:0,pw=Math.min(VW-16,tw+44+chk),ph=50;const k=eBack(TUT.t/.45),out=TUT.ok>.4?eIO((TUT.ok-.4)/.4):0;const px=VW/2-pw/2,py=486+(1-k)*30+out*16;

 if(TUT.ok>0){const c=eBack(TUT.ok/.3),cx=px+22+4,cy=py+ph/2;g.fillStyle='#2ec85a';g.beginPath();g.arc(cx,cy,15*c,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=3.5;g.lineCap='round';g.beginPath();g.moveTo(cx-6*c,cy);g.lineTo(cx-1.5*c,cy+5*c);g.lineTo(cx+7*c,cy-5*c);g.stroke()}

/* ---------- loop ---------- */
let last=performance.now();const tutSkipEl=document.getElementById('tutSkip'),supEl=document.getElementById('sup'),titleEl=document.getElementById('title');
function frame(now){
 let dt=Math.min(.033,(now-last)/1000);last=now;T+=dt;
 if(!paused&&(state==='play'||state==='title'||state==='clear'))update(dt);
 else if(state==='pick'||state==='over'||state==='wait'){for(const p of parts){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.l>0)}
 if(TUT)tutUpdate(dt);
 {const sk=TUT&&!paused?'':'none';if(tutSkipEl.style.display!==sk)tutSkipEl.style.display=sk;const sv=state==='title'&&titleEl.classList.contains('on')?'':'none';if(supEl.style.display!==sv)supEl.style.display=sv}
 render();requestAnimationFrame(frame);
}

<style>

<script>
'use strict';
const SLUG='zombie-fort',TAU=Math.PI*2,TILE=40,MW=40,MH=30,CX=20,CY=15;
const ST={get(k,d){try{const v=localStorage.getItem('gamebop.'+SLUG+'.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gamebop.'+SLUG+'.'+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
// ---------- audio ----------
let AC=null,master=null,muted=!!ST.get('muted',false);
function audioInit(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.4;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
let nbuf=null;function noise(d,v,freq,q,delay){if(!AC||muted)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1000;f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05)}
let sndBudget=0;
const SFX={
 shot(k){if(sndBudget>6)return;sndBudget++;if(k==='shotgun'){noise(.25,.45,600,.6);tone(90,.15,'square',.12,50)}else if(k==='smg'){noise(.06,.18,2200,1.2)}else if(k==='xbow'){tone(500,.12,'triangle',.15,1500);noise(.08,.1,4000,2)}else if(k==='flame'){noise(.1,.08,500,.5)}else if(k==='turret'){noise(.05,.1,3000,1.5)}else{noise(.1,.28,1500,1);tone(200,.06,'square',.08,80)}},
 hit(){if(sndBudget>8)return;sndBudget++;noise(.05,.12,800,2)},
 die(){if(sndBudget>8)return;sndBudget++;tone(rnd(160,220),.25,'sawtooth',.08,60);noise(.2,.12,400,1)},
 groan(){tone(rnd(90,130),.6,'sawtooth',.05,rnd(60,80))},
 hurt(){tone(300,.15,'square',.15,150)},build(){tone(300,.06,'square',.12);noise(.08,.2,1200,1,.05);tone(500,.08,'square',.1,null,.1)},
 scrap(){tone(1200,.05,'square',.06);tone(1600,.06,'square',.06,null,.04)},boom(){noise(.6,.6,200,.5);tone(80,.5,'sawtooth',.2,30)},
 zap(){tone(1800,.15,'sawtooth',.08,300);noise(.1,.1,5000,3)},reload(){tone(400,.05,'square',.08);tone(600,.05,'square',.08,null,.12)},
 night(){[220,208,196,147].forEach((f,i)=>tone(f,.5,'sawtooth',.1,null,i*.25))},dawn(){[392,494,587,784].forEach((f,i)=>tone(f,.3,'triangle',.15,null,i*.12))},
 click(){tone(700,.04,'square',.07)},thud(){noise(.12,.25,300,1)},spit(){noise(.15,.15,900,3);tone(400,.1,'sine',.08,200)}};
function setMuteIcon(){$('muteIc').innerHTML=muted?'<path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 9l5 6M21 9l-5 6" stroke="#ff6b6b" stroke-width="2.5"/>':'<path d="M4 9h4l5-4v14l-5-4H4z" fill="#fff"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none"/>'}
$('mute').onclick=e=>{e.stopPropagation();audioInit();muted=!muted;ST.set('muted',muted);if(master)master.gain.value=muted?0:.4;setMuteIcon()};setMuteIcon();
// ---------- data ----------
const WEAP=[
 {k:'pistol',nm:'Pistol',unlock:1,dmg:12,rate:3.6,mag:12,rel:1,spd:780,spread:.05,pel:1,life:.7,pierce:0,shake:1.5},
 {k:'shotgun',nm:'Shotgun',unlock:3,dmg:9,rate:1.15,mag:6,rel:1.5,spd:720,spread:.36,pel:7,life:.34,pierce:0,shake:6},
 {k:'smg',nm:'SMG',unlock:7,dmg:7,rate:11,mag:40,rel:1.6,spd:840,spread:.13,pel:1,life:.6,pierce:0,shake:1},
 {k:'xbow',nm:'Crossbow',unlock:11,dmg:48,rate:1.5,mag:5,rel:1.3,spd:980,spread:.01,pel:1,life:.9,pierce:6,shake:2},
 {k:'flame',nm:'Flamer',unlock:15,dmg:46,rate:30,mag:100,rel:2,flame:1,shake:.5}];
const BUILDS=[
 {k:'wall',nm:'Wall',cost:10,hp:140,block:1,unlock:1},
 {k:'spike',nm:'Spikes',cost:15,hp:90,block:0,unlock:2},
 {k:'turret',nm:'Turret',cost:40,hp:110,block:1,unlock:4},
 {k:'mine',nm:'Mine',cost:20,hp:1,block:0,unlock:6},
 {k:'zap',nm:'Zapper',cost:70,hp:140,block:1,unlock:12}];
const ZT={
 walker:{hp:30,spd:36,dmg:10,r:14,col:'#86c860',dark:'#4a7a32',from:1},
 runner:{hp:18,spd:90,dmg:7,r:12,col:'#c8dc4a',dark:'#7a8a1a',from:4},
 brute:{hp:240,spd:26,dmg:26,r:24,col:'#9a7ad0',dark:'#5a3a8a',wall:3,from:8},
 spitter:{hp:42,spd:38,dmg:0,r:14,col:'#4ac8b0',dark:'#1a7a6a',range:220,from:12},
 digger:{hp:55,spd:62,dmg:12,r:14,col:'#c09a6a',dark:'#6a4a2a',from:16},
 boss:{hp:2600,spd:30,dmg:60,r:46,col:'#e05a7a',dark:'#8a1a3a',wall:8,from:99}};
const UPS=[['hp','Health','♥'],['dmg','Damage','✦'],['spd','Speed','»'],['scav','Scavenger','⚙'],['eng','Engineer','▣'],['tur','Turrets','◎']];
const NIGHTS=30;
// ---------- save ----------
const DEF={night:1,scrap:40,builds:[],medals:0,ups:{hp:0,dmg:0,spd:0,scav:0,eng:0,tur:0},best:0,kills:0,started:false};
let G=ST.get('save',null);const hadSave=!!(G&&G.started);G=Object.assign(JSON.parse(JSON.stringify(DEF)),G||{});G.ups=Object.assign({},DEF.ups,G.ups||{});
function save(){ST.set('save',G)}
// ---------- canvas ----------
const cv=$('c'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,lc=null,lctx=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=window.innerWidth;H=window.innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);lc=document.createElement('canvas');lc.width=Math.ceil(W/2);lc.height=Math.ceil(H/2);lctx=lc.getContext('2d')}
window.addEventListener('resize',()=>{resize();if(state==='game')buildToolbar()});resize();
// ---------- map ----------
const N=MW*MH,terr=new Uint8Array(N),bld=new Array(N).fill(null),dist=new Float64Array(N);
const idx=(x,y)=>y*MW+x,inb=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH;
const isCore=(x,y)=>(x===CX-1||x===CX)&&(y===CY-1||y===CY);
let ground=null,trees=[];
function genMap(){const R=mulberry(777);terr.fill(0);trees=[];
 for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){if(isCore(x,y))terr[idx(x,y)]=3}
 let n=0;while(n<62){const x=2+Math.floor(R()*(MW-4)),y=2+Math.floor(R()*(MH-4));if(Math.hypot(x-CX,y-CY)<6.5)continue;const i=idx(x,y);if(terr[i])continue;const t=R()<.55?2:1;terr[i]=t;if(t===2)trees.push({x:(x+.5)*TILE,y:(y+.5)*TILE,s:.8+R()*.5});
  if(R()<.45){const dx=R()<.5?1:0,dy=1-dx;const x2=x+dx,y2=y+dy;if(inb(x2,y2)&&!terr[idx(x2,y2)]&&Math.hypot(x2-CX,y2-CY)>=6.5&&x2<MW-2&&y2<MH-2){terr[idx(x2,y2)]=1}}n++}
 // prerender ground
 ground=document.createElement('canvas');ground.width=MW*TILE;ground.height=MH*TILE;const g=ground.getContext('2d');
 g.fillStyle='#5a9a3a';g.fillRect(0,0,ground.width,ground.height);
 for(let i=0;i<2600;i++){const x=R()*ground.width,y=R()*ground.height;g.fillStyle=R()<.5?'rgba(40,90,30,.35)':'rgba(130,190,80,.3)';g.beginPath();g.ellipse(x,y,2+R()*6,1.5+R()*3,R()*3,0,TAU);g.fill()}
 const cg=g.createRadialGradient(CX*TILE,CY*TILE,40,CX*TILE,CY*TILE,TILE*6.5);cg.addColorStop(0,'rgba(170,130,80,.9)');cg.addColorStop(.7,'rgba(160,120,70,.6)');cg.addColorStop(1,'rgba(160,120,70,0)');g.fillStyle=cg;g.fillRect(0,0,ground.width,ground.height);
 for(let i=0;i<70;i++){const x=R()*ground.width,y=R()*ground.height;const cols=['#ffe14a','#fff','#ff8ab0','#b08aff'];g.fillStyle=cols[i%4];for(let k=0;k<4;k++){g.beginPath();g.arc(x+Math.cos(k*1.57)*2.5,y+Math.sin(k*1.57)*2.5,2,0,TAU);g.fill()}}
 for(let i=0;i<N;i++){const x=(i%MW)*TILE,y=Math.floor(i/MW)*TILE;if(terr[i]===1){g.fillStyle='rgba(0,0,0,.25)';g.beginPath();g.ellipse(x+22,y+25,19,15,0,0,TAU);g.fill();const rg=g.createRadialGradient(x+14,y+12,3,x+20,y+20,20);rg.addColorStop(0,'#c8c8d0');rg.addColorStop(1,'#6a6a78');g.fillStyle=rg;g.beginPath();g.moveTo(x+4,y+24);g.lineTo(x+10,y+6);g.lineTo(x+28,y+4);g.lineTo(x+37,y+18);g.lineTo(x+32,y+35);g.lineTo(x+12,y+36);g.closePath();g.fill();g.strokeStyle='rgba(0,0,0,.2)';g.lineWidth=2;g.stroke()}
  if(terr[i]===2){g.fillStyle='#6a4a2a';g.beginPath();g.arc(x+20,y+20,6,0,TAU);g.fill()}}
 g.strokeStyle='rgba(0,0,0,.25)';g.lineWidth=6;g.strokeRect(3,3,ground.width-6,ground.height-6)}
// ---------- flow field ----------
function tileCost(i){const t=terr[i];if(t===1||t===2)return Infinity;if(t===3)return 0;const b=bld[i];if(b&&BUILDS[b.t].block)return 9;return 1}
function computeFlow(){dist.fill(1e9);const heap=[];const push=(i,d)=>{heap.push([d,i]);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;[heap[p],heap[k]]=[heap[k],heap[p]];k=p}};
 const pop=()=>{const top=heap[0],l=heap.pop();if(heap.length){heap[0]=l;let k=0;for(;;){const a=2*k+1,b=a+1;let m=k;if(a<heap.length&&heap[a][0]<heap[m][0])m=a;if(b<heap.length&&heap[b][0]<heap[m][0])m=b;if(m===k)break;[heap[m],heap[k]]=[heap[k],heap[m]];k=m}}return top};

  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dy)continue;const nx=x+dx,ny=y+dy;if(!inb(nx,ny))continue;const j=idx(nx,ny);if(dx&&dy){const a=tileCost(idx(x+dx,y)),b=tileCost(idx(x,y+dy));if(a!==1&&a!==0||b!==1&&b!==0)continue}const c=tileCost(j);if(c===Infinity)continue;const nd=d+(c||1)*(dx&&dy?1.414:1);if(nd<dist[j]){dist[j]=nd;push(j,nd)}}}}

 // edges

 // scavenge piles

function makeWave(n){const list=[];const total=Math.round(9+n*3.4+(n>20?(n-20)*4:0)+(n>NIGHTS?(n-NIGHTS)*6:0));const dur=30+n*1.3;const hpm=1+(n-1)*.065+(n>NIGHTS?(n-NIGHTS)*.12:0);
 const w={walker:1,runner:n>=4?.25+n*.02:0,brute:n>=8?.07+n*.006:0,spitter:n>=12?.14:0,digger:n>=16?.13:0};let tw=0;for(const k in w)tw+=w[k];
 for(let k=0;k<total;k++){let r=Math.random()*tw,t='walker';for(const kk in w){r-=w[kk];if(r<=0){t=kk;break}}list.push({t,at:(k/total)*dur+rnd(0,2.5)})}

 if(w.flame){P.mags[curW]-=dt*30;const a=P.ang;for(let k=0;k<3;k++){const aa=a+rnd(-.25,.25),v=rnd(260,380);PT.push({x:P.x+Math.cos(a)*22,y:P.y+Math.sin(a)*22,vx:Math.cos(aa)*v,vy:Math.sin(aa)*v,life:.42,max:.42,col:'fl',r:rnd(5,9)})}

 // player movement

  let gx=null,gy=null,attack=null;const dp=Math.hypot(P.x-z.x,P.y-z.y);const dc=Math.hypot(CX*TILE-z.x,CY*TILE-z.y);

  else if(d.range&&(dp<d.range||dc<d.range+40)){const tgt=dp<d.range?[P.x,P.y]:[CX*TILE,CY*TILE];z.ang=Math.atan2(tgt[1]-z.y,tgt[0]-z.x);if(z.cd<=0){z.cd=2.2;const a=z.ang;SP.push({x:z.x,y:z.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,life:1.4,dmg:12,own:'z',tx:tgt[0],ty:tgt[1]});SFX.spit()}}

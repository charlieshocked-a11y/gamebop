.course:hover{transform:translateY(-3px)}.course.lock{opacity:.5;cursor:default}

.course div{padding:8px;font-weight:900;text-align:center;font-size:18px}.course small{display:block;font-size:13px;opacity:.75}
table.sc{border-collapse:collapse;font-weight:800;font-size:15px}
table.sc td{border:2px solid #173d1f;width:34px;height:32px;text-align:center}
table.sc tr:first-child td{background:#173d1f;color:#fff}
table.sc td.lab{width:48px;background:#e8f5e8}

.bl.sel{background:#ffd23d}.bl.lock{opacity:.45;cursor:default}
.tot{font-size:20px;font-weight:900}

  const ev=[];const n=Math.ceil(dt/(1/300));for(let i=0;i<n;i++){step(H,B,dt/n,G.t-dt+dt*(i+1)/n,ev);if(B.sunk||B.wet||!B.moving)break}

}

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Glowburst</title>
<style>
:root{--ink:#3d1208;--paper:#ffd27a;--paper2:#ff8f45;--gold:#ffd86b;--plum:#2a1236}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#0b0820;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;pointer-events:none}
.scr>*{pointer-events:auto}
.hide{display:none!important}
.tag{white-space:nowrap;position:relative;border:3px solid #5a1e10;color:var(--ink);font:900 22px/1 "Trebuchet MS","Segoe UI",sans-serif;padding:14px 26px 13px;border-radius:16px 20px 14px 18px;background:linear-gradient(180deg,#ffe3a0 0%,#ffbf5e 45%,#ff8a3d 100%);box-shadow:0 5px 0 #5a1e10,0 0 26px rgba(255,150,60,.45),inset 0 2px 0 rgba(255,255,255,.6);text-shadow:0 1px 0 #ffefc2;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.8,.5,1),box-shadow .1s;outline:none;letter-spacing:.5px}
.tag:hover{transform:translateY(-2px) scale(1.05) rotate(var(--r,0deg))}
.tag:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #5a1e10,0 0 18px rgba(255,150,60,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.tag::before{content:"";position:absolute;left:50%;top:-12px;width:2px;height:10px;background:#5a1e10;transform:translateX(-50%)}
.tag::after{content:"";position:absolute;left:50%;bottom:-17px;width:6px;height:12px;border-radius:0 0 4px 4px;background:linear-gradient(#d33a2a,#8e1a14);transform:translateX(-50%);animation:sway 2.4s ease-in-out infinite}
.tag.big{font-size:34px;padding:18px 54px 16px;border-radius:22px 26px 18px 24px}
.tag.small{font-size:17px;padding:11px 18px 10px}
.tag.red{background:linear-gradient(180deg,#ffb3a0 0%,#ff6b5b 50%,#d8342e 100%);color:#3a0806}
.tag.teal{background:linear-gradient(180deg,#c9fff0 0%,#6fe0c8 50%,#2aa59a 100%);color:#062a28}
@keyframes sway{0%,100%{transform:translateX(-50%) rotate(8deg)}50%{transform:translateX(-50%) rotate(-8deg)}}
#menu .mb{position:absolute;left:50%;bottom:max(12vh,90px);transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:26px}
#menu .row{display:flex;gap:16px}
#mInfo{color:#ffe6b0;font:700 14px "Trebuchet MS",sans-serif;opacity:.8;text-shadow:0 1px 3px #000;margin-top:-10px;display:flex;gap:6px;align-items:center}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font:12px "Trebuchet MS",sans-serif;color:#ffe9c4;opacity:.55;text-decoration:none}
#support:hover{opacity:1}
.ic{width:44px;height:44px;border-radius:50% 46% 52% 48%;border:2px solid #ffcf7a88;background:rgba(30,10,40,.55);color:#ffe2a0;display:grid;place-items:center;cursor:pointer;padding:0;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.ic:active{transform:scale(.88)}
.ic svg{width:22px;height:22px}
#corner{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;z-index:5}
#bSkip{position:fixed;top:calc(66px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:6;font-size:15px;padding:8px 14px}
.panel{position:fixed;left:50%;top:50%;width:min(440px,92vw);transform:translate(-50%,-50%);padding:26px 22px 30px;border-radius:26px 30px 24px 28px;background:radial-gradient(120% 90% at 50% 0%,rgba(110,40,90,.97),rgba(34,12,48,.97));border:3px solid #ffcf6e;box-shadow:0 0 0 6px rgba(60,16,40,.7),0 0 60px rgba(255,140,60,.35);color:#ffeccc;text-align:center;z-index:8}
.panel.in{animation:pin .55s cubic-bezier(.2,1.5,.4,1) both}
@keyframes pin{from{transform:translate(-50%,40%) scale(.8);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
.panel h2{margin:0 0 6px;font:900 34px/1.05 "Trebuchet MS",sans-serif;color:#ffd86b;text-shadow:0 3px 0 #6a1c18,0 0 18px rgba(255,170,60,.6);letter-spacing:1px}
.panel .sub{font:700 15px sans-serif;opacity:.75;margin-bottom:6px}
.stars{display:flex;justify-content:center;gap:10px;margin:8px 0 6px;height:70px;align-items:flex-end}
.stars svg{width:58px;height:58px;filter:drop-shadow(0 3px 0 #4a1610)}
.stars svg:nth-child(2){width:72px;height:72px}
.stars svg.on{animation:spop .5s cubic-bezier(.2,2,.4,1) both}
@keyframes spop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.big-num{font:900 46px/1 "Trebuchet MS",sans-serif;color:#fff3d0;text-shadow:0 0 16px rgba(255,190,90,.7)}
.big-num small{font-size:22px;opacity:.7}
.line{font:700 15px sans-serif;margin:6px 0;opacity:.9}
.newb{display:inline-block;background:#ff5e5b;color:#fff;border-radius:8px;padding:3px 8px;font:900 13px sans-serif;margin-left:6px;animation:wob .8s ease-in-out infinite}
@keyframes wob{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(6deg) scale(1.1)}}
.tease{display:flex;align-items:center;gap:12px;justify-content:center;margin:14px auto 18px;padding:8px 14px;border-radius:16px;background:rgba(0,0,0,.25);border:2px dashed #ffcf6e66;width:fit-content}
.tease canvas{position:static;width:60px;height:60px}
.tease .tt{text-align:left;font:800 17px sans-serif;color:#fff0cc}
.tease .tt b{display:block;font:900 12px sans-serif;color:#ffd86b;letter-spacing:2px}
.btns{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:8px}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px 8px;margin-top:10px}
.lv{position:relative;height:58px;border-radius:40% 40% 34% 34%;border:2px solid #5a1e10;background:linear-gradient(#ffd47e,#ff7f3a);color:#4a1508;font:900 18px sans-serif;cursor:pointer;padding:0;box-shadow:0 3px 0 #5a1e10,0 0 14px rgba(255,140,60,.35)}
.lv.d2{background:linear-gradient(#ffd0e6,#ff6fa8)}
.lv.d3{background:linear-gradient(#e6f6ff,#7cc4ff)}
.lv.boss{border-radius:30% 30% 46% 46%;box-shadow:0 3px 0 #5a1e10,0 0 18px rgba(255,80,60,.7)}
.lv.lock{filter:grayscale(1) brightness(.45);cursor:default}
.lv i{position:absolute;left:0;right:0;bottom:3px;font:normal 10px sans-serif;letter-spacing:-1px;color:#5a1e10}
.lvh{font:900 13px sans-serif;letter-spacing:2px;color:#ffd86b;margin:12px 0 0;text-align:left}
#levels{width:min(480px,94vw);max-height:92vh;overflow:auto}
#banner{position:fixed;left:50%;top:calc(78px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:6px 16px 6px 8px;border-radius:18px;background:rgba(40,12,44,.82);border:2px solid #ffcf6e;color:#fff1cf;font:800 16px sans-serif;z-index:4;pointer-events:none;transition:opacity .4s, transform .5s cubic-bezier(.2,1.6,.4,1)}
#banner canvas{position:static;width:52px;height:52px}
#banner b{display:block;font:900 11px sans-serif;letter-spacing:2px;color:#ffd86b}
@media (max-width:480px){#banner{font-size:14px}#banner canvas{width:40px;height:40px}}
#banner.off{opacity:0;transform:translate(-50%,-30px)}
@media (min-width:900px) and (min-height:600px){.panel{width:540px;padding:32px 30px 36px}.panel h2{font-size:46px}.big-num{font-size:62px}.stars{height:92px}.stars svg{width:76px;height:76px}.stars svg:nth-child(2){width:94px;height:94px}.line{font-size:18px}.tease .tt{font-size:20px}.tease canvas{width:76px;height:76px}#lvGrid .lv{height:66px}#levels{width:580px}}
@media (max-width:480px){.tag.big{font-size:28px;padding:14px 40px 13px}.tag.small{font-size:15px;padding:10px 14px 9px}#menu .mb{gap:22px}}
@media (max-height:460px){#menu .mb{bottom:40px;gap:16px}.tag.big{font-size:26px;padding:12px 40px 11px}}
</style></head>
<body>
<canvas id="c"></canvas>
<div id="menu" class="scr">
  <div class="mb">
    <button id="bPlay" class="tag big" style="--r:-2deg">Play</button>
    <div id="mInfo"></div>
    <div class="row"><button id="bLevels" class="tag small teal" style="--r:2deg">Levels</button><button id="bHow" class="tag small" style="--r:-1deg">How to play</button></div>
  </div>
  <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>
<div id="corner">
  <button id="bPause" class="ic hide" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="currentColor"/></svg></button>
  <button id="bMute" class="ic" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mWave" d="M16 8.5c1.5 1 1.5 6 0 7M18.5 6c3 2.5 3 9.5 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path id="mX" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" style="display:none"/></svg></button>
</div>
<button id="bSkip" class="tag small red hide">Skip ▸▸</button>
<div id="banner" class="off"><canvas id="bnC" width="104" height="104"></canvas><div><b id="bnK">NEW</b><span id="bnT"></span></div></div>
<div id="res" class="panel hide">
  <h2 id="rT">Lovely!</h2>
  <div class="sub" id="rSub">Level 1</div>
  <div class="stars" id="rStars"></div>
  <div class="big-num" id="rNum">0</div>
  <div class="line" id="rLine"></div>
  <div class="tease" id="rTease"><canvas id="tzC" width="120" height="120"></canvas><div class="tt"><b id="tzK">NEXT</b><span id="tzT"></span></div></div>
  <div class="btns"><button id="bRetry" class="tag small teal" style="--r:-3deg" aria-label="Retry">↻</button><button id="bNext" class="tag big" style="--r:1deg">Next ▶</button></div>
</div>
<div id="pause" class="panel hide">
  <h2>Paused</h2>
  <div class="btns" style="flex-direction:column;gap:26px;margin-top:22px"><button id="bResume" class="tag big">Resume</button><div class="btns"><button id="bRestart" class="tag small teal">↻ Retry</button><button id="bQuit" class="tag small red">Menu</button></div></div>
</div>
<div id="levels" class="panel hide">
  <h2>Levels</h2>
  <div class="sub" id="lvInfo"></div>
  <div id="lvWrap"></div>
  <div class="btns" style="margin-top:22px"><button id="bLvBack" class="tag small red">Back</button></div>
</div>
<script>
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const COARSE=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);const TAU=Math.PI*2,rnd=Math.random;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3),easeBack=t=>{const c=1.7;t=t-1;return 1+t*t*((c+1)*t+c)};
const store={get(k,d){try{const v=localStorage.getItem('gamebop.glowburst.'+k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem('gamebop.glowburst.'+k,JSON.stringify(v))}catch(e){}}};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ================= layout =================
let vw,vh,dpr,S,GW,GH,Z,roofY,bankY,riverY;
function zoneFor(w,h){const s=clamp(Math.sqrt(w*h/450000),.4,2.6);const gw=w/s,gh=h/s;return{s,gw,gh,z:{x0:26,x1:gw-26,y0:96,y1:gh*.70}}}
function layout(){
  vw=innerWidth;vh=innerHeight;dpr=Math.min(2,window.devicePixelRatio||1);
  const L=zoneFor(vw,vh);S=L.s;GW=L.gw;GH=L.gh;Z=L.z;roofY=GH*.70;bankY=GH*.845;riverY=GH*.872;
  cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);
  sprites={};bgDirty=true;makeCrowd();
}

// ================= audio =================
const AU={c:null,muted:!!store.get('mute',false),int:0,beat:0,next:0,recent:0};
function audioInit(){
  if(AU.c){if(AU.c.state==='suspended')AU.c.resume();return}
  try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AU.c=new C()}catch(e){return}
  const c=AU.c;
  AU.m=c.createGain();AU.m.gain.value=AU.muted?0:.85;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=.003;comp.release.value=.2;
  AU.m.connect(comp);comp.connect(c.destination);
  AU.sfx=c.createGain();AU.sfx.gain.value=.8;AU.sfx.connect(AU.m);
  AU.mus=c.createGain();AU.mus.gain.value=.55;AU.mus.connect(AU.m);
  const len=c.sampleRate*2.4|0,ir=c.createBuffer(2,len,c.sampleRate);
  for(let ch=0;ch<2;ch++){const d=ir.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(rnd()*2-1)*Math.pow(1-i/len,3)}
  AU.rev=c.createConvolver();AU.rev.buffer=ir;const rg=c.createGain();rg.gain.value=.32;AU.rev.connect(rg);rg.connect(AU.m);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),nd=nb.getChannelData(0);for(let i=0;i<nd.length;i++)nd[i]=rnd()*2-1;AU.noise=nb;
  AU.next=c.currentTime+.1;
}
function setMute(m){AU.muted=m;store.set('mute',m);if(AU.m)AU.m.gain.setTargetAtTime(m?0:.85,AU.c.currentTime,.05);$('mWave').style.display=m?'none':'';$('mX').style.display=m?'':'none'}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function osc(type,f,t,a,d,v,dest,f2,rev){const c=AU.c,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);env(g,t,a,v,d);o.connect(g);g.connect(dest||AU.sfx);if(rev)g.connect(AU.rev);o.start(t);o.stop(t+a+d+.05)}
function nz(t,d,v,ft,f,q,dest,f2,rev){const c=AU.c,s=c.createBufferSource();s.buffer=AU.noise;const fl=c.createBiquadFilter();fl.type=ft;fl.frequency.setValueAtTime(f,t);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+d);fl.Q.value=q||1;const g=c.createGain();env(g,t,.004,v,d);s.connect(fl);fl.connect(g);g.connect(dest||AU.sfx);if(rev)g.connect(AU.rev);s.start(t,rnd()*1.5);s.stop(t+d+.05)}
const PENT=[0,2,4,7,9];
const pf=(deg,base)=>{base=base||62;const o=Math.floor(deg/5),i=((deg%5)+5)%5;return 440*Math.pow(2,(base+o*12+PENT[i]-69)/12)};
const mf=m=>440*Math.pow(2,(m-69)/12);
const vr=()=>1+(rnd()-.5)*.03;
function chainDeg(i){if(i<=28)return Math.floor((i-1)*.55)+[0,1,0,2][i%4];return 13+[0,2,1,3,2,4][i%6]}
const SND={
  ok(){return AU.c&&!AU.muted},
  pop(chain,type){if(!this.ok())return;const c=AU.c,t=c.currentTime;AU.recent++;AU.int=Math.min(1,AU.int+.07);
    if(AU.recent<7){const f=pf(chainDeg(chain))*(1+(rnd()-.5)*.006);
      osc('triangle',f,t,.004,.55,.16,0,0,1);osc('sine',f*2,t,.002,.22,.05);
      if(chain%4==0)osc('sine',pf(chainDeg(chain)-3),t,.01,.7,.08,0,0,1)}
    if(AU.recent<10)nz(t,.07,.13,'bandpass',2600*vr(),1.2);
    if(type==='big'||type==='mega'||type==='head'||type==='rainbow'){osc('sine',110*vr(),t,.005,.5,.4,0,40);nz(t,.35,.25,'lowpass',900,.7,0,200)}
  },
  boom(){if(!this.ok())return;const t=AU.c.currentTime;osc('sine',95*vr(),t,.004,.55,.55,0,38);nz(t,.45,.35,'lowpass',1800,.7,0,160,1);
    for(let i=0;i<7;i++)nz(t+.08+rnd()*.5,.03,.08,'highpass',4000+rnd()*3000,1)},
  launch(){if(!this.ok())return;const t=AU.c.currentTime;nz(t,.24,.18,'bandpass',500,2.5,0,3200);osc('sine',420*vr(),t,.01,.2,.05,0,1200)},
  ignite(){if(!this.ok()||AU.recent>8)return;nz(AU.c.currentTime,.05,.05,'highpass',5000,1)},
  clink(){if(!this.ok())return;const t=AU.c.currentTime;osc('triangle',1900*vr(),t,.002,.18,.12);osc('triangle',2870*vr(),t,.002,.12,.07);nz(t,.06,.1,'highpass',6000,1)},
  coin(){if(!this.ok())return;const t=AU.c.currentTime;osc('square',988,t,.003,.09,.05);osc('square',1319,t+.08,.003,.25,.05,0,0,1);osc('sine',1976,t+.16,.003,.3,.05,0,0,1)},
  zip(){if(!this.ok())return;const t=AU.c.currentTime;osc('sawtooth',700*vr(),t,.003,.16,.04,0,2400)},
  fuse(d){if(!this.ok())return;const t=AU.c.currentTime;nz(t,d,.05,'highpass',5500,1)},
  whoop(d){if(!this.ok())return;const t=AU.c.currentTime;osc('sine',180,t,.05,d,.08,0,900)},
  rocket(){if(!this.ok())return;const t=AU.c.currentTime;nz(t,.6,.12,'bandpass',900,3,0,2600)},
  hoot(){if(!this.ok())return;const t=AU.c.currentTime;for(const k of[0,.32]){osc('sine',395,t+k,.04,.26,.16,0,345,1);osc('sine',790,t+k,.04,.16,.02)}},
  cheer(){if(!this.ok())return;const t=AU.c.currentTime;for(let i=0;i<14;i++){const s=t+rnd()*.6;nz(s,.5+rnd()*.6,.04,'bandpass',700+rnd()*1600,4)}for(let i=0;i<5;i++){const s=t+rnd()*.5;osc('sine',900+rnd()*500,s,.04,.25,.025,0,1300+rnd()*500)}},
  star(i){if(!this.ok())return;const t=AU.c.currentTime,f=mf(74+i*4);osc('sine',f,t,.003,.9,.18,0,0,1);osc('sine',f*2.76,t,.002,.35,.04);osc('triangle',f*2,t,.002,.5,.05,0,0,1)},
  tick(i){if(!this.ok())return;osc('square',600+i*9,AU.c.currentTime,.002,.03,.025)},
  click(){if(!this.ok())return;const t=AU.c.currentTime;nz(t,.04,.12,'bandpass',1400,2);osc('sine',320,t,.002,.06,.08)},
  roar(){if(!this.ok())return;const t=AU.c.currentTime;const c=AU.c,o=c.createOscillator(),g=c.createGain(),fl=c.createBiquadFilter();o.type='sawtooth';o.frequency.setValueAtTime(130,t);o.frequency.linearRampToValueAtTime(80,t+.6);fl.type='lowpass';fl.frequency.value=700;env(g,t,.05,.18,.6);o.connect(fl);fl.connect(g);g.connect(AU.sfx);g.connect(AU.rev);o.start(t);o.stop(t+.8)},
  fanfare(){if(!this.ok())return;const t=AU.c.currentTime;[62,66,69,74].forEach((m,i)=>{osc('triangle',mf(m),t+i*.09,.005,.6,.1,0,0,1);osc('sine',mf(m+12),t+i*.09,.005,.3,.04)})},
  fail(){if(!this.ok())return;const t=AU.c.currentTime;[69,66,62].forEach((m,i)=>osc('triangle',mf(m),t+i*.16,.01,.4,.09,0,0,1))},
  secret(){if(!this.ok())return;const t=AU.c.currentTime;[81,86,88,93].forEach((m,i)=>osc('sine',mf(m),t+i*.07,.003,.7,.08,0,0,1))}
};
const CH=[[50,54,57],[47,50,54],[43,47,50],[45,49,52]];
function music(){
  if(!AU.c||AU.muted)return;const c=AU.c;if(AU.next<c.currentTime-.5)AU.next=c.currentTime+.05;
  const step=60/96/2,I=AU.int,inGame=state==='play';
  while(AU.next<c.currentTime+.12){
    const t=AU.next,s=AU.beat%64,ch=CH[Math.floor(s/16)];
    if(s%16==0)ch.forEach(m=>{osc('triangle',mf(m+12),t,.7,3.6,.018,AU.mus);osc('sine',mf(m),t,.8,3.4,.02,AU.mus)});
    if(inGame&&I>.12&&s%4==0){osc('sine',72,t,.004,.3,.22*I,AU.mus,42);nz(t,.12,.08*I,'lowpass',500,1,AU.mus)}
    if(inGame&&I>.22&&s%2==0)osc('triangle',mf(ch[0]-12),t,.005,.25,.09*I,AU.mus);
    if(I>.38&&inGame)osc('triangle',mf(ch[[0,1,2,1,0,2,1,2][s%8]]+24),t,.003,.22,.045*I,AU.mus,0,1);
    if(inGame&&I>.6&&s%2==1)nz(t,.03,.05*I,'highpass',7000,1,AU.mus);
    if(!inGame&&s%8==4&&rnd()<.5)osc('sine',pf(5+Math.floor(rnd()*8)),t,.004,1.2,.035,AU.mus,0,1);

function formPos(W,l){const f=l.form,z=W.z,zw=z.x1-z.x0,zh=z.y1-z.y0,mn=Math.min(zw,zh);

function dragonStep(W,dr,dt){

    if(idx>=tr.length-1){const p=tr[tr.length-1];s.x=p[0];s.y=p[1]}target+=dr.sp*.78}

function stepWorld(W,dt){
  W.t+=dt;const z=W.z,d=W.d;
  if(d.wind){const c=W.t%7.5,gi=Math.floor(W.t/7.5);let tw=0;if(c>2.5&&c<6)tw=(gi%2?-1:1)*(c<3?(c-2.5)*2:c>5.5?(6-c)*2:1)*70;W.wind=tw}

      if(l.type==='riser'){l.by+=l.vy*dt;l.bx+=(l.vx+W.wind*.5)*dt;if(l.by<z.y0-50&&l.st===0){l.st=3;W.lost++;FX.escape(l)}}

          if(l.by<z.y0+l.r){l.by=z.y0+l.r;l.vy=Math.abs(l.vy)}if(l.by>z.y1-l.r){l.by=z.y1-l.r;l.vy=-Math.abs(l.vy)}}

      l.fuse-=dt;if(l.fuse<=0)popL(W,l);

function addBurst(W,x,y,R,src){W.bursts.push({x,y,R,r:0,t:0,hit:new Set(),src})}

function drawHand(g,x,y,press){g.save();g.translate(x+6,y+8);g.scale(1+.0,1-.0);const p=press*6;g.translate(0,p);g.rotate(-.35);g.fillStyle='#fff8ec';g.strokeStyle='#3a1a10';g.lineWidth=2.5;g.beginPath();g.moveTo(-4,0);g.lineTo(-4,-30+0);g.arc(0,-30,4,Math.PI,0);g.lineTo(4,-8);g.quadraticCurveTo(10,-14,14,-8);g.quadraticCurveTo(19,-12,22,-5);g.quadraticCurveTo(27,-8,28,0);g.lineTo(28,14);g.quadraticCurveTo(26,28,10,30);g.lineTo(0,30);g.quadraticCurveTo(-12,26,-14,12);g.lineTo(-16,2);g.quadraticCurveTo(-14,-4,-6,4);g.closePath();g.fill();g.stroke();g.restore();

function tick(rdt){
  realT+=rdt;music();if(state!=='play')calStep(6);AU.recent=Math.max(0,AU.recent-rdt*60);AU.int=Math.max(0,AU.int-rdt*(W&&W.settleT>.3?.25:.06));

  if(slowT>0){slowT-=rdt;timeScale=lerp(timeScale,.3,.25)}else timeScale=lerp(timeScale,1,.12);

  shake=Math.max(0,shake-rdt*2.2);skyFlash=Math.max(0,skyFlash-rdt*1.6);moonSmile=Math.max(0,moonSmile-rdt);chainShow=Math.max(0,chainShow-(W&&W.settleT>0?rdt:0));chainBump=Math.max(0,chainBump-rdt*6);

  for(let i=flashes.length-1;i>=0;i--){flashes[i].t+=gdt;if(flashes[i].t>flashes[i].dur)flashes.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){floats[i].t+=rdt;if(floats[i].t>(floats[i].stamp?1.4:1.2))floats.splice(i,1)}

    W.nextAuto-=gdt;if(W.nextAuto<=0){const sp=spots(W);const p=sp[Math.floor(rnd()*Math.min(3,sp.length))];if(p){fire(W,p.x,p.y)}W.nextAuto=3.2+rnd()*1.5}

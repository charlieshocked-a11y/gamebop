function seasonCols(){const se=season(),f=(S.yearT%SEAS_LEN)/SEAS_LEN;const P=[['#7ed8ff','#c9f7ff','#5cc95a','#3f9e3a'],['#59b8ff','#ffe9a8','#7acb3a','#4f9a20'],['#ff9e5a','#ffd9a0','#c9a03a','#9a6a20'],['#7a9ac8','#e6f0ff','#e8f2ff','#b8c8e0']];const a=P[se],b=P[(se+1)%4],k=clamp((f-0.85)/0.15,0,1);return a.map((c,i)=>mix(c,b[i],k))}
function mix(a,b,t){const pa=parseInt(a.slice(1),16),pb=parseInt(b.slice(1),16);const r=Math.round(lerp(pa>>16,pb>>16,t)),g=Math.round(lerp(pa>>8&255,pb>>8&255,t)),bl=Math.round(lerp(pa&255,pb&255,t));return'rgb('+r+','+g+','+bl+')'}

function drawFlower(x,y,s,c,c2,k,bl){const p=5;X.save();X.translate(x,y);X.strokeStyle='#2f7a2a';X.lineWidth=Math.max(1,s*0.15);X.beginPath();X.moveTo(0,0);X.lineTo(0,s*1.8);X.stroke();X.scale(bl,bl);X.fillStyle=c;for(let i=0;i<p;i++){const a=i/p*TAU+k;X.beginPath();X.ellipse(Math.cos(a)*s*0.6,Math.sin(a)*s*0.6,s*0.55,s*0.38,a,0,TAU);X.fill()}X.fillStyle=c2;X.beginPath();X.arc(0,0,s*0.38,0,TAU);X.fill();X.restore()}
function drawMeadow(){const se=season();for(let i=0;i<FIELDS.length;i++){const F=FIELDS[i],p=fieldPos(i),lv=S.fields[i];const bloom=F.b[se];

function drawHive(){const R=MAXR;const s=hexS;
// branch
X.strokeStyle='#6a3f1a';X.lineWidth=Math.max(6,s*0.5);X.lineCap='round';X.beginPath();X.moveTo(view.x,view.y+8);X.quadraticCurveTo(hc.x,view.y-4,view.x+view.w,view.y+14);X.stroke();
for(let q=-R;q<=R;q++)for(let r=-R;r<=R;r++){if((Math.abs(q)+Math.abs(r)+Math.abs(q+r))/2>R)continue;const k=q+','+r,c=S.cells[k],p=hpos(q,r);
if(c){const T=c.t==='queen'?{ic:'jelly',col:'#d9a0ff'}:TYPES[c.t];const pp=pops[k]||0;const sz=s*(0.96+pp*0.3);hexPath(p.x,p.y+3,sz);X.fillStyle='rgba(60,30,0,0.35)';X.fill();hexPath(p.x,p.y,sz);const g=X.createRadialGradient(p.x-s*0.3,p.y-s*0.4,1,p.x,p.y,s);g.addColorStop(0,'#fff6c8');g.addColorStop(1,c.t==='queen'?'#b06cff':c.t==='store'?'#ff9800':c.t==='nursery'?'#ff8fb8':c.t==='works'?'#f0d26a':'#5a9cff');X.fillStyle=g;X.fill();X.strokeStyle='#7a4a00';X.lineWidth=Math.max(2,s*0.09);X.stroke();
if(c.t==='store'){const fillK=clamp(S.honey/D().honeyCap,0,1);X.save();hexPath(p.x,p.y,sz*0.8);X.clip();X.fillStyle='rgba(255,170,0,0.6)';X.fillRect(p.x-s,p.y+s*0.8-fillK*s*1.6,s*2,s*2);X.restore()}
dimg(T.ic,p.x,p.y-s*0.08,s*(c.t==='queen'?1.0:0.95));
if(c.lv>1||c.t!=='queen'){X.fillStyle='#2a1700';X.beginPath();X.arc(p.x+s*0.5,p.y+s*0.5,s*0.3,0,TAU);X.fill();X.fillStyle='#ffe066';X.font='900 '+Math.round(s*0.34)+'px Trebuchet MS';X.textAlign='center';X.textBaseline='middle';X.fillText(c.lv,p.x+s*0.5,p.y+s*0.52)}
if(sel===k){hexPath(p.x,p.y,s*1.02);X.strokeStyle='#fff';X.lineWidth=3+Math.sin(time*8)*1.5;X.stroke()}}
else if(state!=='title'&&buildable(q,r)){hexPath(p.x,p.y,s*0.9);X.fillStyle=sel===k?'rgba(255,255,255,0.45)':'rgba(255,240,200,0.18)';X.fill();X.setLineDash([5,5]);X.strokeStyle='rgba(122,74,0,0.6)';X.lineWidth=2;X.stroke();X.setLineDash([]);
const can=canAffordAny();X.fillStyle=can?'rgba(80,160,40,'+(0.6+0.3*Math.sin(time*3))+')':'rgba(122,74,0,0.45)';X.fillRect(p.x-s*0.25,p.y-s*0.06,s*0.5,s*0.12);X.fillRect(p.x-s*0.06,p.y-s*0.25,s*0.12,s*0.5)}}}
function canAffordAny(){return TKEYS.some(t=>{const c=buildCost(t);return S.wax>=c.wax&&S.honey>=c.honey})}
function drawBee(x,y,a,s,col){X.save();X.translate(x,y);X.rotate(a);X.fillStyle='rgba(255,255,255,0.75)';const fl=Math.sin(time*60+x)*0.4;X.beginPath();X.ellipse(-s*0.1,-s*0.55,s*0.45,s*0.25,-0.5+fl,0,TAU);X.ellipse(-s*0.1,s*0.55,s*0.45,s*0.25,0.5-fl,0,TAU);X.fill();X.fillStyle=col||'#ffc800';X.beginPath();X.ellipse(0,0,s*0.7,s*0.45,0,0,TAU);X.fill();X.fillStyle='#2a1700';X.fillRect(-s*0.25,-s*0.42,s*0.16,s*0.84);X.fillRect(s*0.1,-s*0.42,s*0.16,s*0.84);X.beginPath();X.arc(s*0.6,0,s*0.22,0,TAU);X.fill();X.restore()}
function updBees(dt){const d=D();const want=Math.min(70,Math.round(Math.sqrt(d.n[0])*6));while(bees.length<want)bees.push(newBee());if(bees.length>want)bees.length=want;
for(const b of bees){b.t+=dt*b.sp;if(b.t>=1){b.t=0;b.out=!b.out;if(b.out){b.f=pickField()}if(!b.out&&state==='game'&&Math.random()<0.25)floats.push({x:hc.x+(Math.random()-0.5)*hexS*2,y:hc.y,s:'',ic:'nectar',t:0})}
const h=hpos(0,0),f=b.f>=0?fieldPos(b.f):{x:hc.x+(Math.random()-0.5)*200,y:meadow.y};const a=b.out?{x:h.x,y:h.y}:{x:f.x+b.ox,y:f.y-10+b.oy},c=b.out?{x:f.x+b.ox,y:f.y-10+b.oy}:{x:h.x,y:h.y};
const e=b.t<0.5?2*b.t*b.t:1-Math.pow(-2*b.t+2,2)/2;const nx=lerp(a.x,c.x,e)+Math.sin(b.t*TAU*2+b.ph)*b.w,ny=lerp(a.y,c.y,e)+Math.cos(b.t*TAU*3+b.ph)*b.w*0.5-Math.sin(b.t*Math.PI)*40;b.a=Math.atan2(ny-b.y,nx-b.x);b.x=nx;b.y=ny}}
function pickField(){const se=season(),c=[];FIELDS.forEach((F,i)=>{if(S.fields[i]&&F.b[se]>0.05)c.push(i)});return c.length?c[(Math.random()*c.length)|0]:-1}
function newBee(){return{t:Math.random(),out:Math.random()<0.5,f:pickField(),sp:0.2+Math.random()*0.15,ph:Math.random()*TAU,w:8+Math.random()*16,ox:(Math.random()-0.5)*30,oy:(Math.random()-0.5)*14,x:hc.x,y:hc.y,a:0}}
// ---------- raids ----------
function startRaid(){const d=D();raid={t:0,str:d.raidStr,def:d.def,win:d.def>=d.raidStr,res:false};wasps=[];const n=Math.min(24,4+S.raidN*2);for(let i=0;i<n;i++){const side=i%2?1:-1;wasps.push({x:side>0?W+30+Math.random()*80:-30-Math.random()*80,y:view.y+Math.random()*view.h*0.6,vx:0,vy:0,hp:1,ph:Math.random()*TAU})}sfx.alarm();shake=0.4}
function updRaid(dt){if(!raid)return;raid.t+=dt;const h=hpos(0,0);const dur=3.2;
for(const w of wasps){if(!w.hp)continue;const tx=h.x+Math.cos(w.ph+raid.t)*hexS*2.4,ty=h.y+Math.sin(w.ph*1.3+raid.t*1.4)*hexS*2;w.vx=lerp(w.vx,(tx-w.x)*2.2,0.1);w.vy=lerp(w.vy,(ty-w.y)*2.2,0.1);w.x+=w.vx*dt;w.y+=w.vy*dt;
if(raid.t>1.2&&Math.random()<dt*(raid.win?1.6:0.5)){w.hp=0;burst(w.x,w.y,'#ffd400',14);sfx.hit();shake=Math.max(shake,0.15)}}
if(raid.t>1&&Math.random()<dt*14){const w=wasps[(Math.random()*wasps.length)|0];if(w&&w.hp)parts.push({x:w.x,y:w.y,vx:(Math.random()-0.5)*120,vy:(Math.random()-0.5)*120,l:0.4,m:0.4,s:3,c:'#fff'})}
if(raid.t>dur&&!raid.res){raid.res=true;resolveRaid()}if(raid.t>dur+0.8){wasps=[];raid=null}}
function resolveRaid(){const d=D();if(raid.win){const rw=Math.round(10*Math.pow(1.38,S.raidN)),rh=Math.round(40*Math.pow(1.45,S.raidN));S.wax+=rw;S.honey=Math.min(d.honeyCap,S.honey+rh);S.raidN++;S.raidsWon++;sfx.win();toast(ic('star'));showGain([['wax',rw],['honey',rh]],'win')}
else{const lh=Math.floor(S.honey*0.3),lb=Math.floor(S.bees*0.12);S.honey-=lh;S.bees-=lb;sfx.lose();shake=1;showGain([['honey',-lh],['bee',-lb]],'lose');for(const w of wasps)w.hp&&(w.vx=(w.x<hc.x?-1:1)*400)}
S.raidT=d.raidInt;persist()}
function burst(x,y,c,n){for(let i=0;i<n;i++){const a=Math.random()*TAU,s=40+Math.random()*160;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.5+Math.random()*0.4,m:0.9,s:2+Math.random()*3,c})}}
// ---------- costs ----------
function countT(t){let n=0;for(const k in S.cells)if(S.cells[k].t===t)n++;return n}
function buildCost(t){const T=TYPES[t],n=countT(t),m=Math.pow(1.75,n);return{wax:Math.ceil(T.wax*m),honey:Math.ceil(T.honey*m)}}
function upCost(c){const T=c.t==='queen'?{wax:25,honey:80}:TYPES[c.t];const m=Math.pow(c.t==='queen'?2.4:1.9,c.lv);return{wax:Math.ceil(T.wax*1.5*m),honey:Math.ceil(T.honey*2*m)}}
function fieldCost(i){const F=FIELDS[i],lv=S.fields[i];if(!lv)return F.cost;return Math.ceil(Math.max(60,F.cost*0.5)*Math.pow(1.85,lv))}
function qCost(u){return Math.ceil(u.base*Math.pow(1.7,Q(u.k)))}
function swarmGain(){return Math.floor(Math.sqrt(S.runHoney/4000))}
const MAXLV=15;

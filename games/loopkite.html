<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Loopkite</title>
<style>
:root{--ink:#3d2b4f;--paper:#fff7e8;--coral:#ff7b67;--sun:#ffc54a;--sea:#39a5c4;--leaf:#69b878;--f:"Trebuchet MS","Avenir Next","Segoe UI Rounded","Segoe UI",system-ui,sans-serif}
html,body{margin:0;height:100%;overflow:hidden;background:#8fd0ee;font-family:var(--f);-webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;outline:none}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:3}
.scr.on{display:flex}
.btn{font:800 20px/1 var(--f);color:#fff;letter-spacing:.5px;background:linear-gradient(#ff9a76,#f0604f);border:0;border-radius:20px 14px 22px 12px;padding:14px 26px;box-shadow:0 5px 0 #b4433c,0 9px 18px rgba(60,30,50,.25);text-shadow:0 2px 0 rgba(90,20,20,.25);cursor:pointer;transition:transform .09s,box-shadow .09s;margin:6px;position:relative}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #b4433c,0 3px 8px rgba(60,30,50,.2)}
.btn.sea{background:linear-gradient(#66cde4,#2f92b4);box-shadow:0 5px 0 #1d6782,0 9px 18px rgba(20,50,70,.25);border-radius:14px 22px 12px 20px}
.btn.sea:active{box-shadow:0 1px 0 #1d6782}
.btn.sun{background:linear-gradient(#ffd96b,#f6a830);color:#5b3410;text-shadow:0 1px 0 rgba(255,255,255,.4);box-shadow:0 5px 0 #b8731c,0 9px 18px rgba(80,50,10,.25);border-radius:22px 12px 18px 16px}
.btn.sun:active{box-shadow:0 1px 0 #b8731c}
.btn.leaf{background:linear-gradient(#8fd88f,#4ea763);box-shadow:0 5px 0 #2f7444,0 9px 18px rgba(20,60,30,.25);border-radius:12px 20px 16px 22px}
.btn.leaf:active{box-shadow:0 1px 0 #2f7444}
.btn.big{font-size:30px;padding:18px 44px}
.btn.sm{font-size:16px;padding:10px 16px}
.btn[disabled]{filter:grayscale(.8) brightness(.95);opacity:.7;cursor:default}
#title .logo{display:flex;gap:2px;margin-bottom:6px;transform:rotate(-3deg)}
#title .logo span{display:inline-block;font:900 92px/1 var(--f);color:#fff;text-shadow:0 0 0 #3d2b4f,4px 4px 0 #3d2b4f,-4px 4px 0 #3d2b4f,4px -3px 0 #3d2b4f,-4px -3px 0 #3d2b4f,0 5px 0 #3d2b4f,0 -4px 0 #3d2b4f,5px 0 0 #3d2b4f,-5px 0 0 #3d2b4f,0 11px 0 rgba(61,43,79,.35);animation:bob 2.4s ease-in-out infinite}
#title .sub{font:700 17px var(--f);color:#3d2b4f;background:rgba(255,247,232,.8);padding:6px 14px;border-radius:14px 8px 16px 10px;margin-bottom:18px;transform:rotate(1deg)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r,0deg))}50%{transform:translateY(-9px) rotate(calc(var(--r,0deg)*-1))}}
.menu{display:flex;flex-direction:column;align-items:center}
.row{display:flex;flex-wrap:wrap;justify-content:center}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right,0px));bottom:calc(8px + env(safe-area-inset-bottom,0px));font:600 11.5px var(--f);color:#fffbe9;opacity:.55;text-decoration:none;text-shadow:0 1px 2px rgba(40,20,60,.75);padding:2px 3px}
#support:hover{opacity:1}
.panel{background:var(--paper);border-radius:26px 18px 30px 20px;padding:18px 22px;box-shadow:0 10px 0 rgba(61,43,79,.18),0 18px 40px rgba(40,20,60,.3);color:var(--ink);max-width:min(92vw,760px);max-height:88vh;overflow:auto;position:relative;animation:pin .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pin{from{transform:translateY(40px) scale(.85);opacity:0}to{transform:none;opacity:1}}
.panel h2{margin:2px 0 10px;font:900 30px var(--f);text-align:center;color:var(--ink)}
#levels .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lv{position:relative;width:118px;height:84px;border:0;border-radius:16px 10px 18px 12px;background:linear-gradient(#fff,#f3e5ca);box-shadow:0 4px 0 #d7bf95;cursor:pointer;font:800 14px var(--f);color:var(--ink);padding:4px;transition:transform .1s}
.lv:hover{transform:translateY(-3px) rotate(-1.5deg)}
.lv:active{transform:translateY(3px)}
.lv b{display:block;font-size:24px}
.lv i{display:block;font-style:normal;font-size:11px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lv .st{font-size:15px;letter-spacing:1px;color:#f2a91e}
.lv .st s{text-decoration:none;color:#d8c9ad}
.lv.lock{opacity:.5;cursor:default}
.lv.boss{background:linear-gradient(#e6e0f5,#c7bde2);box-shadow:0 4px 0 #9184b3}
.lv.cur{outline:3px solid #ff7b67;outline-offset:2px;animation:pulse 1.2s infinite}
@keyframes pulse{50%{outline-color:#ffc54a}}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font:800 17px var(--f);gap:10px}
.chip{background:#fff;border-radius:12px;padding:5px 11px;box-shadow:0 3px 0 #e1cfae}
.kites{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.kc{width:150px;background:#fff;border-radius:18px 12px 20px 14px;box-shadow:0 4px 0 #e1cfae;padding:8px;text-align:center;font:700 13px var(--f)}
.kc canvas{position:static;width:110px;height:90px;display:block;margin:0 auto}
.kc.sel{outline:3px solid #69b878}
.kc .nm{font:900 17px var(--f)}
.kc .ds{font-size:11px;opacity:.75;min-height:28px}
.ug{display:flex;align-items:center;gap:10px;background:#fff;border-radius:16px;padding:8px 12px;margin-top:10px;box-shadow:0 4px 0 #e1cfae;flex-wrap:wrap}
.ug .nm{font:900 17px var(--f);min-width:120px}
.pips{display:flex;gap:3px;flex:1}
.pips u{flex:1;height:14px;min-width:6px;border-radius:5px;background:#eadcc0;display:block}
.pips u.on{background:linear-gradient(#ffd96b,#f39a2a)}
#hudb{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));display:none;z-index:4;gap:8px}
#hudb.on{display:flex}
.ib{width:44px;height:44px;border-radius:14px 10px 15px 11px;border:0;background:rgba(255,247,232,.85);box-shadow:0 3px 0 rgba(61,43,79,.25);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib:active{transform:translateY(2px)}
.ib svg{width:24px;height:24px}
#tut{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
#tut.on{display:block}
#tutcap{position:absolute;left:50%;top:22%;transform:translateX(-50%);font:900 30px var(--f);color:#fff;text-shadow:0 3px 0 #3d2b4f,3px 0 0 #3d2b4f,-3px 0 0 #3d2b4f,0 -3px 0 #3d2b4f,0 6px 10px rgba(0,0,0,.25);white-space:nowrap;transition:transform .2s}
#skip{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));pointer-events:auto}
#res .stars{display:flex;justify-content:center;gap:8px;margin:4px 0 6px}
#res .stars canvas{position:static;width:74px;height:74px}
#res .num{font:900 40px var(--f);text-align:center}
#res .line{text-align:center;font:700 16px var(--f);opacity:.85}
#res .tease{display:flex;align-items:center;gap:10px;justify-content:center;background:#fff;border-radius:16px;padding:6px 14px;margin:10px auto 4px;font:800 16px var(--f);width:fit-content;box-shadow:0 3px 0 #e1cfae}
#res .tease canvas{position:static;width:54px;height:54px}
#res .acts{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}
#pause .panel{text-align:center}
.hide{display:none!important}
@media (max-width:640px){
 #title .logo span{font-size:62px}
 #levels .grid{grid-template-columns:repeat(4,1fr);gap:7px}
 .lv{width:76px;height:76px;font-size:12px}
 .lv b{font-size:21px}
 .kc{width:136px}
 .btn.big{font-size:26px;padding:16px 34px}
 #tutcap{font-size:24px}
 .panel{padding:14px 12px}
}
</style></head>
<body>
<canvas id="c" tabindex="0"></canvas>
<div id="hudb"><button class="ib" id="hPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#3d2b4f"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#3d2b4f"/></svg></button><button class="ib" id="hMute" aria-label="Sound"></button></div>
<div id="tut"><div id="tutcap">Hold to climb!</div><button class="btn sea sm" id="skip">Skip ▸▸</button></div>

<div id="title" class="scr on">
 <div class="logo" id="logo"></div>
 <div class="sub">hold · release · loop the loop</div>
 <div class="menu">
  <button class="btn big" id="bCont">Continue</button>
  <button class="btn big sun" id="bPlay">Play</button>
  <div class="row"><button class="btn sea" id="bLv">Levels</button><button class="btn leaf" id="bShed">Kite Shed</button><button class="btn sun sm" id="bHow">How to play</button></div>
 </div>
 <button class="ib" id="tMute" style="position:absolute;top:12px;right:12px" aria-label="Sound"></button>
 <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="levels" class="scr"><div class="panel">
 <div class="bar"><button class="btn sea sm" id="lvBack">◂ Back</button><span class="chip" id="lvStars">★ 0</span><span class="chip" id="lvShells">0</span></div>
 <div class="grid" id="lvGrid"></div>
</div></div>

<div id="shed" class="scr"><div class="panel">
 <div class="bar"><button class="btn sea sm" id="shBack">◂ Back</button><h2 style="margin:0">Kite Shed</h2><span class="chip" id="shShells">0</span></div>
 <div class="kites" id="shKites"></div>
 <div id="shUps"></div>
</div></div>

<div id="pause" class="scr"><div class="panel"><h2>Paused</h2>
 <div class="menu"><button class="btn big leaf" id="pRes">Resume</button><div class="row"><button class="btn sun" id="pRe">Restart</button><button class="btn sea" id="pMenu">Levels</button></div></div>
</div></div>

<div id="res" class="scr"><div class="panel" style="min-width:300px">
 <h2 id="rTitle">Beach Cleared!</h2>
 <div class="stars" id="rStars"></div>
 <div class="num" id="rScore">0</div>
 <div class="line" id="rLine"></div>
 <div class="tease" id="rTease"></div>
 <div class="acts"><button class="btn sea sm" id="rMenu">Levels</button><button class="btn sun" id="rRe">↻ Retry</button><button class="btn big leaf" id="rNext">Next ▸</button></div>
</div></div>

<script>
'use strict';
// ================= utils =================
const TAU=Math.PI*2, clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<=-Math.PI)a+=TAU;return a;};
const angDiff=(to,from)=>wrapA(to-from);
const rnd=(a,b)=>a+Math.random()*(b-a);
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hsh(i,s){const x=Math.sin(i*127.1+s*311.7)*43758.5453;return x-Math.floor(x);}
const $=id=>document.getElementById(id);
const SHELL='<svg viewBox="0 0 24 24" width="18" height="18" style="vertical-align:-3px"><path d="M12 3C6 3 2.5 8 3 13l9 8 9-8c.5-5-3-10-9-10z" fill="#ffb59a" stroke="#c9604a" stroke-width="1.5"/><path d="M12 5v14M8 6l3 13M16 6l-3 13M5 10l6 9M19 10l-6 9" stroke="#c9604a" stroke-width="1" fill="none"/></svg>';
const LOCK='<svg viewBox="0 0 24 24" width="24" height="24"><rect x="5" y="10" width="14" height="11" rx="3" fill="#b8a888"/><path d="M8 10V7a4 4 0 0 1 8 0v3" stroke="#b8a888" stroke-width="2.6" fill="none"/></svg>';
// ================= storage =================
const KP='gamebop.loopkite.';
function sget(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function sset(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v));}catch(e){}}
const DEF_SAVE={unlocked:1,stars:[],best:[],shells:0,line:0,lift:0,kites:{diamond:1},kite:'diamond',tut:0,played:0,last:0};
let save=Object.assign({},DEF_SAVE,sget('save',{}));
if(!save.kites||typeof save.kites!=='object')save.kites={diamond:1};
function persist(){sset('save',save);}
function hasSave(){return save.played>0;}

// ================= audio =================
const AU={ctx:null,muted:!!sget('mute',false),musicOn:false,key:261.63};
function auInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return;}
 try{
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  const c=AU.ctx=new C();
  AU.master=c.createGain();AU.master.gain.value=AU.muted?0:0.85;
  const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
  AU.sfx=c.createGain();AU.sfx.gain.value=0.9;AU.sfx.connect(AU.master);
  AU.mus=c.createGain();AU.mus.gain.value=0.3;AU.mus.connect(AU.master);
  const nb=c.createBuffer(1,c.sampleRate*2,c.sampleRate),d=nb.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;AU.noise=nb;
  const ws=c.createBufferSource();ws.buffer=nb;ws.loop=true;
  const wf=c.createBiquadFilter();wf.type='bandpass';wf.frequency.value=500;wf.Q.value=0.8;
  const wg=c.createGain();wg.gain.value=0;ws.connect(wf);wf.connect(wg);wg.connect(AU.sfx);ws.start();
  AU.windF=wf;AU.windG=wg;
  const o1=c.createOscillator();o1.type='sawtooth';o1.frequency.value=82;
  const o2=c.createOscillator();o2.type='triangle';o2.frequency.value=123;
  const tf=c.createBiquadFilter();tf.type='lowpass';tf.frequency.value=420;tf.Q.value=5;
  const tg=c.createGain();tg.gain.value=0;
  o1.connect(tf);o2.connect(tf);tf.connect(tg);tg.connect(AU.sfx);o1.start();o2.start();
  AU.thO=o1;AU.thO2=o2;AU.thG=tg;AU.thF=tf;
  AU.nextBeat=c.currentTime+0.1;AU.beat=0;
 }catch(e){AU.ctx=null;}
}
function setMute(m){AU.muted=m;sset('mute',m);if(AU.master)AU.master.gain.setTargetAtTime(m?0:0.85,AU.ctx.currentTime,0.05);paintMute();}
function tone(f,dur,o){o=o||{};const c=AU.ctx;if(!c||AU.muted)return;const t=c.currentTime+(o.delay||0);
 const osc=c.createOscillator();osc.type=o.type||'sine';osc.frequency.setValueAtTime(f,t);
 if(o.slide)osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.slide),t+dur);
 const g=c.createGain();const v=o.vol||0.2;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+(o.att||0.006));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 let n=osc;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;osc.connect(fl);n=fl;}
 n.connect(g);g.connect(o.bus||AU.sfx);osc.start(t);osc.stop(t+dur+0.05);}
function noise(dur,o){o=o||{};const c=AU.ctx;if(!c||AU.muted)return;const t=c.currentTime+(o.delay||0);
 const s=c.createBufferSource();s.buffer=AU.noise;const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
 const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(o.vol||0.2,t+(o.att||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(AU.sfx);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);}
const PENTA=[0,2,4,7,9,12,14,16,19,21,24,26,28,31];
const vary=()=>1+(Math.random()-.5)*0.04;
function sChime(n){const f=523.25*Math.pow(2,PENTA[clamp(n,0,13)]/12)*vary();tone(f,0.7,{vol:.15});tone(f*2.005,0.4,{vol:.05});tone(f*3.01,0.2,{vol:.025,type:'triangle'});}
function sLoop(ch){const b=392*Math.pow(2,Math.min(ch-1,7)*2/12);[0,4,7,12,16].forEach((s,i)=>{tone(b*Math.pow(2,s/12),0.5,{vol:.12,delay:i*0.055,type:i%2?'triangle':'sine'});});noise(0.5,{f:6000,ft:'highpass',vol:.05,delay:.1});}
function sBonk(){tone(140*vary(),0.22,{slide:55,vol:.32});noise(0.18,{f:500,ft:'lowpass',vol:.22});}
function sHit(){noise(0.3,{f:2200,q:2,vol:.25});tone(520,0.28,{type:'square',slide:140,vol:.09,lp:1600});}
function sZap(){noise(0.45,{f:3500,ft:'highpass',vol:.22});tone(1400,0.35,{type:'sawtooth',slide:90,vol:.08,lp:3000});}
function sCharge(){tone(180,0.8,{type:'sawtooth',slide:700,vol:.04,lp:1200});}
function sSquawk(){tone(1050*vary(),0.13,{type:'sawtooth',slide:640,vol:.07,lp:2600});tone(980,0.12,{type:'sawtooth',slide:560,vol:.06,lp:2600,delay:.15});}
function sBark(){tone(420,0.08,{type:'square',slide:260,vol:.1,lp:1400});tone(460,0.09,{type:'square',slide:270,vol:.1,lp:1400,delay:.14});}
function sSneeze(){noise(0.35,{f:1800,f2:600,q:1.5,vol:.16,att:.18});noise(0.4,{f:3000,f2:900,vol:.3,delay:.55});}
function sTwang(f){tone((f||196)*vary(),0.35,{type:'triangle',slide:(f||196)*0.94,vol:.09,lp:1400});}
function sPop(){tone(600*vary(),0.09,{slide:1500,vol:.15});noise(0.06,{f:3000,vol:.12});}
function sBoom(){noise(0.7,{f:300,ft:'lowpass',vol:.35});for(let i=0;i<6;i++)noise(0.05,{f:5000,ft:'highpass',vol:.07,delay:.25+i*0.07+Math.random()*.05});}
function sWin(){[0,4,7,12,7,12,16].forEach((s,i)=>tone(523.25*Math.pow(2,s/12),0.45,{vol:.13,delay:i*0.09,type:i<4?'triangle':'sine'}));}
function sFail(){[7,4,0,-5].forEach((s,i)=>tone(392*Math.pow(2,s/12),0.4,{vol:.1,delay:i*0.12,type:'triangle'}));}
function sClick(){tone(700,0.06,{type:'triangle',vol:.1});}
function sThunder(){noise(1.6,{f:260,f2:80,ft:'lowpass',vol:.4,att:.04});}
function sWhoosh(){noise(0.6,{f:400,f2:1600,q:.7,vol:.12,att:.2});}
function pluck(f,t,v,dur){const c=AU.ctx;const o=c.createOscillator();o.type='triangle';o.frequency.value=f;const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=1700;const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.5));o.connect(fl);fl.connect(g);g.connect(AU.mus);o.start(t);o.stop(t+(dur||0.5)+0.05);}
const CHORDS=[[0,4,7,12],[-3,0,4,9],[-7,-3,0,5],[-5,-1,2,7]],MPAT=[0,2,1,3,2,1,3,1];
function musicTick(){const c=AU.ctx;if(!c||AU.muted||!AU.musicOn)return;const bl=0.28;
 if(AU.nextBeat<c.currentTime)AU.nextBeat=c.currentTime+0.05;
 while(AU.nextBeat<c.currentTime+0.25){const b=AU.beat++,bar=Math.floor(b/8)%4,st=b%8,ch=CHORDS[bar];const t=AU.nextBeat;const root=AU.key;
  if(st!==7||bar%2===0)pluck(root*Math.pow(2,ch[MPAT[st]]/12),t,st===0?0.055:0.035,0.5);
  if(st===0||st===5)pluck(root/2*Math.pow(2,ch[0]/12),t,0.07,0.9);
  AU.nextBeat+=bl;}}

// ================= canvas / view =================
const cv=$('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,SC=1,VW=1280,VH=720,GOFF=115,SKY=605;
function resize(){W=window.innerWidth;H=window.innerHeight;DPR=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 SC=Math.min(H/720,W/560);VW=W/SC;VH=H/SC;GOFF=clamp(VH*0.16,105,150);SKY=VH-GOFF;}
window.addEventListener('resize',resize);resize();

function simPath(holdAt,holdFor,dur,keepAcc){const K0=G.kite;const k={x:K0.x,y:K0.y,a:K0.a,s:K0.s,L:K0.L,loopAcc:keepAcc?K0.loopAcc:0,relT:keepAcc?K0.relT:9,assisting:keepAcc?K0.assisting:0,tumble:0,swirl:0,tension:0,tug:0,surge:0};let loops=0;
 let kx=G.kid.x;const pts=[];const env={hand:{x:0,y:0},wind:{x:G.wind.x,y:0},st:G.st,sim:1};const dt=1/120;

function buildLevel(i){const d=LV[i],R0=mulberry(1000+i*77),R=(a,b)=>a+R0()*(b-a),pick=a=>a[Math.floor(R0()*a.length)];
 const diff=i/(NL-1),hs=1+0.5*diff+0.012*(save.line+save.lift);G.hs=hs;const f=d.f;const gt=d.goal[0];
 if(d.boss){// helper ribbons spread around

 let x=1150,k=0;const end=d.len-420;G.grpN=0;

 const ribPattern=(x)=>{const p=pick(f.includes('circle')?['circle','circle','circle','low']:i===0?['wave','low','high','circle']:['circle','high','low','column','circle']);const yc=R(-190,-290);
  if(p==='high'){const n=4;for(let j=0;j<n;j++){const t=j/(n-1);addRib(x+60+t*190,-372-Math.sin(t*Math.PI)*28);}return;}
  if(p==='low'){for(let j=0;j<4;j++)addRib(x+j*62,-58-Math.sin(j/3*Math.PI)*22);return;}
  if(p==='arc'){const n=4+Math.floor(R(0,2));for(let j=0;j<n;j++){const t=j/(n-1);addRib(x+t*260,yc+60-Math.sin(t*Math.PI)*120);}}
  else if(p==='wave'){for(let j=0;j<5;j++)addRib(x+j*70,yc+Math.sin(j*1.4)*70);}
  else if(p==='circle'){const n=6,gid=++G.grpN,cy=Math.min(yc,-240);for(let j=0;j<n;j++){const a=j/n*TAU;addRib(x+130+Math.cos(a)*120,cy+Math.sin(a)*115);G.items[G.items.length-1].grp=gid;}G.items.push({type:'loopmark',x:x+130,y:cy});}
  else{for(let j=0;j<4;j++)addRib(x+j*24,-110-j*70);}};
 while(x<end){
  const w=R(470,600)*(1-diff*0.18);

   for(let j=0;j<Math.floor(L/120);j++){if(gt==='lan'&&j%2===0)G.items.push({type:'lan',x:x+80+j*120,y:dy+R(60,110),bob:R(0,6)});else addRib(x+80+j*120,dy+60+Math.sin(j*1.3)*40+R(0,30));}
   if(f.includes('gull')&&diff>0.5)G.gulls.push(mkGull(x+L*0.6,dy+R(70,120),hs*0.8,0));
   x+=L+380;k++;continue;}
  // collectible

  else if(gt==='ring'){const y=yb();G.items.push({type:'ring',x:x+120,y,bob:R(0,6),r:58-diff*8});const y2=clamp(y+R(-120,120),-360,-120);G.items.push({type:'ring',x:x+300+R(0,60),y:y2,bob:R(0,6),r:58-diff*8});if(R0()<0.5){addRib(x+30,y);addRib(x+210,(y+y2)/2);}}
  else if(gt==='lan'){const n=2+Math.floor(R(0,2.4));for(let j=0;j<n;j++)G.items.push({type:'lan',x:x+j*R(110,150),y:yb(),bob:R(0,6)});}
  // hazard
  if(hz.length&&(k%2===1||(diff>0.45&&R0()<0.75))&&x>1300){const h=pick(hz);
   if(h==='gull'){const n=1+Math.floor(R(0,1.2+diff*3.2));for(let j=0;j<n;j++)G.gulls.push(mkGull(x+R(200,500)+j*R(90,170),R(-120,-360),hs,diff>0.4&&R0()<0.4));}
   else if(h==='cloud'){G.clouds.push({x:x+R(150,400),y:R(-260,-370),t:R(0,2),per:3.6-1.1*diff,ch:1.0-0.25*diff,state:0,zap:0,tgt:null,face:R(0,6)});}

  }
  x+=w;k++;}
 if(f.includes('ring')&&gt!=='ring'){}

// ================= kite physics =================
function stepKite(k,dt,h,env){const st=env.st;let da=0,ev=0;
 const hx=env.hand.x,hy=env.hand.y;const d0=Math.hypot(k.x-hx,k.y-hy)||1;const taut=d0>=k.L-3;if(h)k.relT=0;else k.relT=(k.relT||0)+dt;
 if(k.tumble>0){da=-10*dt;k.tumble-=dt;}
 else if(h){da=-st.turn*dt*(0.8+0.2*Math.min(1.5,k.s/260));}
 else if(k.assisting||(k.loopAcc>2.75&&k.relT<0.35)){da=-Math.max(3.2,st.turn*0.95)*dt;k.assisting=1;}
 else if(taut){const nx=(k.x-hx)/d0,ny=(k.y-hy)/d0;const e=Math.atan2(-ny,nx);const up=e<1.0;const ta=up?Math.atan2(-nx,ny):Math.atan2(nx,-ny);da=clamp(angDiff(ta,k.a)*2.2,-2.6,2.6)*dt;}
 else{const diff=angDiff(REL,k.a);da=clamp(diff*2.4,-2.5,2.5)*dt;}
 da+=k.swirl*dt;
 k.a=wrapA(k.a+da);k.loopAcc=Math.max(0,k.loopAcc-da);
 const sy=Math.sin(k.a),cx=Math.cos(k.a);
 k.s+=165*st.dive*sy*dt;
 if(h&&k.tumble<=0)k.s+=60*st.surge*dt;
 k.s+=(st.base-k.s)*0.6*dt;k.s=clamp(k.s,120,st.vmax);
 const wx=env.wind.x,wy=env.wind.y-st.lift+k.tug;
 k.x+=(cx*k.s+wx)*dt;k.y+=(sy*k.s+wy)*dt;
 // reel
 if(h)k.L=Math.max(st.Lmin,k.L-75*dt);else k.L=Math.min(st.Lmax,k.L+95*dt);
 // tether
 let rx=k.x-hx,ry=k.y-hy;const d=Math.hypot(rx,ry);k.tension*=Math.pow(0.02,dt);
 if(d>k.L){const nx=rx/d,ny=ry/d,over=d-k.L;const nd=k.L+over*0.2;k.x=hx+nx*nd;k.y=hy+ny*nd;
  const ax=cx*k.s,ay=sy*k.s,out=ax*nx+ay*ny;
  if(out>0){k.s+=out*(h?0.5:0.15)*dt*st.surge*3;}
  k.tension=Math.max(k.tension,clamp(over/18+(out>0?out/300:0),0,1.5));}
 // ceilings (bridges)
 if(env.ceil!=null&&k.y<env.ceil+18){k.y=env.ceil+18;if(sy<-0.5)ev|=4;if(sy<0)k.a=Math.abs(cx)>0.3?(cx>0?0.12:Math.PI-0.12):wrapA(-k.a);}
 // ground
 if(k.y>-14){k.y=-14;if(sy>0){k.bonkV=sy*k.s;k.a=wrapA(-k.a);k.s*=0.75;ev|=1;}}
 if(k.y<-SKY+40&&!env.sim){k.y=-SKY+40;if(sy<0)k.a=wrapA(-k.a);}
 if(k.loopAcc>=TAU){k.loopAcc-=TAU;ev|=2;k.assisting=0;}if(k.relT>1.6)k.assisting=0;
 return ev;}

function updRope(k,hand,dt,wind){const R=k.rope,N=R.length;const bx=k.x,by=k.y;
 R[0].x=hand.x;R[0].y=hand.y;R[N-1].x=bx;R[N-1].y=by;
 const d=Math.hypot(bx-hand.x,by-hand.y);const len=Math.max(d,k.L*0.98)/(N-1);
 for(let i=1;i<N-1;i++){const p=R[i];const vx=(p.x-p.px)*0.97,vy=(p.y-p.py)*0.97;p.px=p.x;p.py=p.y;p.x+=vx+wind.x*0.002;p.y+=vy+340*dt*dt;}
 for(let it=0;it<10;it++){for(let i=0;i<N-1;i++){const a=R[i],b=R[i+1];const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||1,df=(dd-len)/dd*0.5;
  if(i>0){a.x+=dx*df;a.y+=dy*df;}if(i+1<N-1){b.x-=dx*df;b.y-=dy*df;}}
  for(let i=1;i<N-1;i++)if(R[i].y>4)R[i].y=4;}
}
function updTail(k,dt,wind,n,seg){const T=k.tail;const r=k.a+Math.PI/2;
 T[0].x=k.x-Math.sin(r)*28;T[0].y=k.y+Math.cos(r)*28;T[0].px=T[0].x;T[0].py=T[0].y;
 for(let i=1;i<T.length;i++){const p=T[i];const vx=(p.x-p.px)*0.95,vy=(p.y-p.py)*0.95;p.px=p.x;p.py=p.y;const ux=vx/dt,uy=vy/dt;p.x+=vx+(wind.x*0.8-ux)*2.2*dt*dt;p.y+=vy+(220+(wind.y-uy)*1.2)*dt*dt;}
 for(let it=0;it<6;it++)for(let i=0;i<T.length-1;i++){const a=T[i],b=T[i+1];const dx=b.x-a.x,dy=b.y-a.y,dd=Math.hypot(dx,dy)||1,df=(dd-seg)/dd;
  if(i===0){b.x-=dx*df;b.y-=dy*df;}else{a.x+=dx*df*0.5;a.y+=dy*df*0.5;b.x-=dx*df*0.5;b.y-=dy*df*0.5;}}
}

// ================= particles & popups =================
function part(o){if(P.length>900)P.shift();P.push(Object.assign({vx:0,vy:0,g:0,life:1,max:1,size:4,col:'#fff',type:'spark',rot:Math.random()*6,vr:rnd(-6,6),drag:0.98},o));}
function sparkle(x,y,n,cols,sp){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=rnd(40,sp||220);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(.4,.9),size:rnd(2,5),col:cols[i%cols.length],type:'spark',g:60});}}
function confetti(x,y,n,sp){const cols=['#ff6f61','#ffd166','#4fc3e0','#7bd389','#c58cf2','#fff'];for(let i=0;i<n;i++){const a=-Math.PI/2+rnd(-1.3,1.3),v=rnd(150,sp||520);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(1.2,2.4),size:rnd(4,8),col:cols[i%6],type:'conf',g:420,drag:0.97});}}
function streamers(x,y,n){const cols=['#ff6f61','#ffd166','#4fc3e0','#7bd389','#c58cf2'];for(let i=0;i<n;i++){const a=-Math.PI/2+rnd(-1.1,1.1),v=rnd(300,640);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(1.6,2.6),size:rnd(3,5),col:cols[i%5],type:'strm',g:380,drag:0.975,tr:[]});}}
function puff(x,y,n,col){for(let i=0;i<n;i++){const a=rnd(-Math.PI,0),v=rnd(20,120);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*0.6,life:rnd(.4,.8),size:rnd(6,13),col,type:'puff',g:-10,drag:0.92});}}
function firework(x,y){const cols=[['#ff6f61','#ffd166'],['#4fc3e0','#fff'],['#7bd389','#ffd166'],['#c58cf2','#ff9ad5']][Math.floor(Math.random()*4)];for(let i=0;i<46;i++){const a=i/46*TAU,v=rnd(150,280);part({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(1,1.6),size:rnd(2,4),col:cols[i%2],type:'fw',g:90,drag:0.96,tr:[]});}}
function popup(x,y,text,col,size){POP.push({x,y,text,col:col||'#fff',size:size||26,t:0,life:1.1});}
function uiFly(x,y,kind){UIF.push({x,y,kind,t:0});}

// ================= gameplay =================
function addCombo(){G.combo++;G.comboT=2.6;G.mult=Math.min(5,1+Math.floor(G.combo/4));}
function award(base,x,y,label,col){const v=base*G.mult;G.score+=v;popup(x,y-26,(label?label+' ':'')+'+'+v,col||'#fff',label?28:22);return v;}
function toScreen(x,y){return{x:(x-G.camX)*SC,y:(y+SKY)*SC};}
function damage(src){const k=G.kite;if(G.inv>0||G.done||G.failed)return;(G.dmg=G.dmg||[]).push(src);G.hp--;G.inv=1.4;k.tumble=0.55;k.s*=0.6;G.freeze=0.09;G.shake=Math.max(G.shake,14);G.combo=0;G.mult=1;G.chain=0;G.chainT=0;k.loopAcc=0;k.tailRib=0;
 sHit();sparkle(k.x,k.y,18,['#fff','#ffd166','#aaa'],260);G.kid.mood='oh';G.kid.moodT=1.2;
 if(G.attached){const b=G.attached;G.attached=null;sPop();sparkle(k.x,k.y+40,12,[b.col,'#fff']);}
 if(G.hp<=0){G.failed=1;G.endT=0;k.tumble=3;sFail();G.kid.mood='sad';G.kid.moodT=9;}}
function loopDone(){const k=G.kite;G.loops++;G.chain++;G.chainT=G.st.chain;G.maxChain=Math.max(G.maxChain,G.chain);addCombo();
 k.tailRib=Math.min(6,k.tailRib+1);const lbl=G.chain>1?'LOOP x'+G.chain:'LOOP!';let lp=25+25*Math.min(G.chain,4);let lb=lbl;if(G.loopPick>0){lp+=200*G.loopPick;lb=G.loopPick>1?'RIBBON LOOP x'+G.loopPick:'RIBBON LOOP';}G.loopPick=0;G.score+=lp;popup(k.x,k.y-36,lb+' +'+lp,'#ffe07a',28);
 sLoop(G.chain);G.shake=Math.max(G.shake,4+G.chain);G.freeze=Math.max(G.freeze,0.045);k.surge=1;
 for(let i=0;i<26;i++){const a=i/26*TAU;part({x:k.x+Math.cos(a)*40,y:k.y+Math.sin(a)*40,vx:Math.cos(a)*120,vy:Math.sin(a)*120,life:.7,size:4,col:i%2?'#ffd166':'#ff9ad5',type:'spark',g:0});}
 G.kid.mood='wow';G.kid.moodT=0.9;
 if(G.tut&&G.tut.step===3){const T=G.tut;if(T.t>1.0&&G.lastHold>=0.8&&G.lastHold<3){T.loops=(T.loops||0)+1;if(T.loops>=2){T.step=4;T.t=0;streamers(k.x,k.y,40);confetti(k.x,k.y,40);}else{popup(k.x,k.y-70,'One more!','#fff',30);T.t=0;}}else popup(k.x,k.y-70,'Hold longer!','#fff',26);}
 if(G.chain===5){G.fireworks=2.8;G.slow=0.6;popup(k.x,k.y-60,'FIREWORKS! +300','#ff9ad5',40);G.score+=300;}
 if(G.boss&&!G.boss.dead){const b=G.boss;if(Math.hypot(k.x-b.x,k.y-b.y)<370){b.hp--;b.hurt=0.6;G.freeze=0.12;G.shake=18;sThunder();sparkle(b.x,b.y,30,['#fff','#ffd166'],380);G.score+=600;popup(b.x,b.y-110,'POW!','#ffe07a',44);
   for(let i=0;i<14;i++)part({x:k.x,y:k.y,vx:(b.x-k.x)*rnd(1.5,2.5),vy:(b.y-k.y)*rnd(1.5,2.5),life:.5,size:5,col:'#ffd166',type:'spark'});
   if(b.hp<=0){b.dead=1;G.slow=1.4;G.goal=b.max;sBoom();G.fireworks=4;G.clear=0.001;}}
  else popup(k.x,k.y-50,'Get closer!','#cfe',20);}
 if(G.def.goal[0]==='loop')G.goal=G.loops;}
function pickup(o){const k=G.kite;o.dead=1;if(k.loopAcc>1.2)G.loopPick=(G.loopPick||0)+1;addCombo();sChime(Math.min(G.combo-1,12));
 if(o.type==='rib'){G.ribs++;o.got=1;award(100,o.x,o.y);if(o.grp&&!G['gp'+o.grp]&&G.items.filter(q=>q.grp===o.grp&&q.dead&&q.got).length+1>=4){G['gp'+o.grp]=1;G.score+=500;if(G.def.goal[0]==='circle')G.goal++;popup(k.x,k.y-64,'PERFECT CIRCLE +500','#9ff2ff',30);sWin();confetti(k.x,k.y,24,380);G.shake=Math.max(G.shake,7);}sparkle(o.x,o.y,14,['#ffd166','#ff8fb1','#fff']);const s=toScreen(o.x,o.y);uiFly(s.x,s.y,'rib');if(G.def.goal[0]==='rib')G.goal++;
  if(o.starter){G.starterGot++;if(G.starterGot===3){streamers(k.x,k.y,34);confetti(k.x,k.y,30);sWin();popup(k.x,k.y-70,'WOOHOO!','#fff',40);G.kid.mood='cheer';G.kid.moodT=1.4;G.shake=8;}}}
 else if(o.type==='lan'){o.dead=0;o.lit=1;o.rise=0;G.lans++;award(150,o.x,o.y,'',"#ffd27a");sparkle(o.x,o.y,16,['#ffb347','#ffe9a8']);if(G.def.goal[0]==='lan')G.goal++;const s=toScreen(o.x,o.y);uiFly(s.x,s.y,'lan');}
 else if(o.type==='gold'){award(o.val||777,o.x,o.y,o.lbl||'DRAGON LUCK','#ffd700');sparkle(o.x,o.y,40,['#ffd700','#fff','#ff6f61'],320);G.shake=10;sWin();}
}
function update(dt){const g=G;if(!g)return;g.t+=dt;const k=g.kite,st=g.st,kid=g.kid;
 const playing=g.mode==='play';const h=(playing||g.demo)&&!g.done&&!g.failed&&(g.demo?demoHold():hold);
 if(h){g.holdTime+=dt;g.curHold=(g.curHold||0)+dt;g.lastHold=g.curHold;}else g.curHold=0;
 // kid walk
 const walkSp=(g.done||g.failed)?0:g.walk;kid.x+=walkSp*dt;kid.walking=lerp(kid.walking,walkSp>0?1:0,dt*6);kid.phase+=walkSp*dt/13;
 if(kid.moodT>0){kid.moodT-=dt;if(kid.moodT<=0)kid.mood='happy';}
 kid.pull=lerp(kid.pull,h?1:0,Math.min(1,dt*18));
 const hx=kid.x+16-kid.pull*7,hy=-56+kid.pull*9-Math.abs(Math.sin(kid.phase))*2*kid.walking-(kid.hopY||0);g.hand.x=hx;g.hand.y=hy;
 // wind & gusts
 let gw=0;const strong=g.def.f.includes('gust');
 if(!g.tut||g.demo){g.gustT-=dt;if(g.gustT<=0){g.gust=1;g.gustT=strong?rnd(3,5):rnd(6,10);g.gustDir=strong&&Math.random()<0.5?-1:1;g.gustY=strong?rnd(-90,90):g.lvl<4?rnd(-10,80):rnd(-40,60);if(g.gustY>40)popup(g.kite.x,g.kite.y-40,'Downdraft!','#cde',22);sWhoosh();for(let i=0;i<10;i++)part({x:g.camX+VW+rnd(0,100),y:rnd(-SKY,-20),vx:-rnd(300,500),vy:0,life:1.4,size:rnd(30,70),col:'rgba(255,255,255,.5)',type:'streak',g:0,drag:1});}}
 if(g.gust>0){g.gust-=dt*0.6;gw=Math.sin(Math.max(0,g.gust)*Math.PI)*(strong?150:80)*g.gustDir;}
 g.wind.x=g.walk+10+gw;g.wind.y=g.gust>0?Math.sin(Math.max(0,g.gust)*Math.PI)*(g.gustY||0):0;
 // updraft & ceiling env
 k.swirl=0;let ceil=null;
 for(const d of g.drafts){const dx=Math.abs(k.x-d.x);if(dx<d.w*0.5+10&&k.y<0){const f=1-dx/(d.w*0.5+10);g.wind.y-=200*f;k.swirl=-0.9*f;d.act=1;if(Math.random()<0.2)sparkle(k.x,k.y,1,['#fff7c2']);}}
 for(const b of g.bridges){if(k.x>b.x0-10&&k.x<b.x1+10){ceil=b.y;}
  if(!b.warn&&b.x0-k.x<520){b.warn=1;}
  if(k.x>b.x0-30&&k.x<b.x0+20&&k.y<b.y+4&&!b.hitOnce){b.hitOnce=1;damage('bridge');k.y=b.y+30;}}
 // tutorial gating
 if(g.tut)tutUpdate(dt,h);
 // kite substeps
 const env={hand:g.hand,wind:g.wind,st,ceil};const n=3,sdt=dt/n;let ev=0;
 if(g.failed){k.tumble=Math.max(k.tumble,0.1);}
 if(kid.dogTug>0){kid.dogTug-=dt;k.tug=260;}else k.tug=0;
 for(let i=0;i<n;i++)ev|=stepKite(k,sdt,h,env);
 if(ev&1&&!g.failed&&!g.tut&&!g.demo&&k.bonkV>200&&g.inv<=0){popup(k.x,k.y-34,'CRASH!','#ff8a7a',30);puff(k.x,0,14,'rgba(240,220,180,.95)');damage('crash');}
 else if(ev&1&&!g.failed){sBonk();puff(k.x,0,8,'rgba(240,220,180,.9)');G.shake=Math.max(G.shake,5);if(g.combo>2)popup(k.x,k.y-30,'Bonk!','#fff',22);g.combo=0;g.mult=1;k.flick=1;}
 if(ev&4&&(g._scr||0)<=0){g._scr=0.3;sTwang(330);sparkle(k.x,k.y-14,8,['#ffd166','#fff']);}if(g._scr>0)g._scr-=dt;
 if(ev&2&&!g.failed)loopDone();
 if(h&&!g._wasH){sTwang(196+Math.random()*30);k.surge=1;}
 g._wasH=h;k.surge=Math.max(0,k.surge-dt*3);k.flick=Math.max(0,k.flick-dt*2);
 if(k.tension>0.6&&!g._taut){g._taut=1;if(h)sTwang(147);}if(k.tension<0.3)g._taut=0;
 updRope(k,g.hand,dt,g.wind);updTail(k,dt,g.wind,st.tailN,9);
 if(!k.trail)k.trail=[];k.trail.push(k.x,k.y);if(k.trail.length>90)k.trail.splice(0,2);if(ev&2)k.trailGlow=1;k.trailGlow=Math.max(0,(k.trailGlow||0)-dt*1.5);
 if(g.inv>0)g.inv-=dt;
 // timers
 if(g.comboT>0){g.comboT-=dt;if(g.comboT<=0){g.combo=0;g.mult=1;}}
 if(g.chainT>0){g.chainT-=dt;if(g.chainT<=0){g.chain=0;k.tailRib=Math.max(0,k.tailRib-6);}}
 if(g.banner>0)g.banner-=dt;if(g.hintT>0&&g.holdTime>1.2)g.hintT-=dt;
 // items
 const mag=st.mag*(g.tut?1.1:1);
 for(const o of g.items){if(o.dead)continue;o.bob+=dt*2;
  if(o.type==='rib'||o.type==='gold'||(o.type==='lan'&&!o.lit)){const dx=k.x-o.x,dy=k.y-o.y,d=Math.hypot(dx,dy);const m=o.starter?mag*1.15:mag;
   if(d<m+28&&!g.failed){o.x+=dx*Math.min(1,dt*5);o.y+=dy*Math.min(1,dt*5);}
   if(d<m*0.8+(o.starter?14:0)&&!g.failed)pickup(o);
   else if(G.rival&&o.type!=='gold'){const r=G.rival;if(Math.hypot(r.x-o.x,r.y-o.y)<34){o.dead=1;g.stolen++;puff(o.x,o.y,6,'rgba(255,120,120,.8)');popup(o.x,o.y-20,'Stolen!','#ff9a9a',20);sPop();if(o.type==='lan'){o.dead=1;}}}
  }
  if(o.type==='lan'&&o.lit){o.rise+=dt;o.y-=dt*20;if(o.rise>8)o.dead=1;}
  if(o.type==='ring'&&!o.done){const px=k._px==null?k.x:k._px;if((px-o.x)*(k.x-o.x)<=0&&px!==k.x){if(Math.abs(k.y-o.y)<o.r*0.92){o.done=1;o.okT=0;g.rings++;addCombo();sChime(Math.min(g.combo+2,13));award(250,o.x,o.y,'RING','#9ff2ff');sparkle(o.x,o.y,24,['#9ff2ff','#fff','#ffd166'],300);g.shake=Math.max(g.shake,5);if(g.def.goal[0]==='ring')g.goal++;const s=toScreen(o.x,o.y);uiFly(s.x,s.y,'ring');}}
   if(!o.done&&k.x>o.x+60&&g.kid.x>o.x-200)o.miss=1;}
  if(o.type==='ring'&&o.done)o.okT+=dt;
 }
 k._px=k.x;
 if(g.items.length>60)g.items=g.items.filter(o=>!(o.dead&&o.type!=='lan')&&o.x>g.camX-600);
 // gulls
 for(const q of g.gulls){if(q.dead)continue;if(!q.act&&q.x<g.camX+VW+120){q.act=1;sSquawk();}if(!q.act)continue;
  q.ph+=dt*9;q.x+=q.vx*dt;
  if(q.dive&&!q.dv&&q.x-k.x<300&&q.x>k.x){q.dv=1;q.tvy=clamp((k.y-q.y)*1.2,-200,200);popup(q.x,q.y-30,'!','#ff6f61',30);sSquawk();}
  if(q.dv)q.y+=(q.tvy||0)*dt;else q.y=q.y0+Math.sin(q.ph*0.18)*18;
  const d=Math.hypot(k.x-q.x,k.y-q.y);
  if(d<26&&!q.hit&&!g.failed){q.hit=1;damage('gull');sSquawk();for(let i=0;i<8;i++)part({x:q.x,y:q.y,vx:rnd(-120,120),vy:rnd(-120,40),life:1.4,size:7,col:'#fff',type:'feather',g:60,drag:0.95});q.vx*=1.6;q.vy=-80;}
  else if(d<60&&!q.hit&&!q.near&&G.inv<=0){q.near=1;g.score+=50;popup(k.x,k.y-30,'Close!','#cff',20);}
  if(G.attached&&Math.hypot(G.attached.x-q.x,G.attached.y-q.y)<30){const b=G.attached;G.attached=null;sPop();sparkle(b.x,b.y,14,[b.col,'#fff']);popup(b.x,b.y,'Pop!','#fff',22);}
  if(q.x<g.camX-200)q.dead=1;}

 if(!g.tut){c.textAlign='center';c.textBaseline='top';c.font='900 '+(m?26:32)+'px '+FONT;c.lineWidth=6;c.lineJoin='round';c.strokeStyle='#3d2b4f';c.strokeText(g.score.toLocaleString(),cx,y0);c.fillStyle='#fff';c.fillText(g.score.toLocaleString(),cx,y0);
  const bw=m?150:200,by=y0+(m?32:38);c.fillStyle='rgba(61,43,79,.35)';rr(c,cx-bw/2,by,bw,8,4);c.fill();c.fillStyle='#ffd166';rr(c,cx-bw/2,by,bw*clamp(g.score/T[2],0,1),8,4);c.fill();
  for(let i=1;i<3;i++){const x=cx-bw/2+bw*(T[i]/T[2]);starPath(c,x,by+4,9,4);c.fillStyle=g.score>=T[i]?'#ffd166':'#fff7e8';c.fill();c.strokeStyle='#3d2b4f';c.lineWidth=1.5;c.stroke();}
  // progress line
  if(!g.def.boss){const pw=m?W-40:Math.min(420,W*0.35),px=cx-pw/2,py=H-14;c.fillStyle='rgba(61,43,79,.3)';rr(c,px,py,pw,5,3);c.fill();const t=clamp(g.kid.x/g.finishX,0,1);c.fillStyle='#fff7e8';rr(c,px,py,pw*t,5,3);c.fill();c.fillStyle='#ff6f61';ell(c,px+pw*t,py+2.5,6,6);c.fill();c.fillStyle='#3d2b4f';c.font='800 11px '+FONT;c.fillText('⚑',px+pw+8,py-4);}
  else if(g.boss&&!g.boss.dead){const bw2=m?Math.min(W-150,220):300,bx=cx-bw2/2,byy=by+(m?22:26);c.fillStyle='rgba(30,20,40,.5)';rr(c,bx,byy,bw2,12,6);c.fill();c.fillStyle='#b68cf2';rr(c,bx,byy,bw2*g.boss.hp/g.boss.max,12,6);c.fill();c.fillStyle='#fff';c.font='900 11px '+FONT;c.fillText('STORM KING',cx,byy+14);}
 }
 // combo
 if(g.mult>1&&g.comboT>0){const s=1+Math.max(0,g.comboT-2.3)*1.5;c.save();c.translate(W-(m?46:70),sy+(m?84:92));c.scale(s,s);c.rotate(-0.12);c.font='900 '+(m?26:34)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';c.lineWidth=7;c.strokeStyle='#3d2b4f';c.strokeText('x'+g.mult,0,0);c.fillStyle=['#fff','#ffd166','#ff9ad5','#9ff2ff','#7bd389','#c58cf2','#ff6f61','#ffd700'][g.mult-1];c.fillText('x'+g.mult,0,0);c.restore();}
 if(g.chain>1&&g.chainT>0){c.font='900 '+(m?15:18)+'px '+FONT;c.textAlign='right';c.textBaseline='middle';c.fillStyle='#ffe07a';c.strokeStyle='#3d2b4f';c.lineWidth=4;const tt='Loop chain '+g.chain+(g.chain<5?' → 5 = fireworks':'');c.strokeText(tt,W-12,sy+(m?116:126));c.fillText(tt,W-12,sy+(m?116:126));}
 // banner
 if(g.banner>0&&!g.tut){const a=clamp(Math.min((1.9-g.banner)/0.2,g.banner/0.5),0,1);c.save();c.globalAlpha=a*0.92;c.font='900 '+(m?12:14)+'px '+FONT;c.textAlign='center';c.textBaseline='middle';
  const txt=(g.lvl+1)+' · '+g.def.n+'  —  '+g.def.say;const tw=Math.min(W-24,c.measureText(txt).width+26);const yy=sy+(m?106:76);c.fillStyle='rgba(61,43,79,.55)';rr(c,W/2-tw/2,yy-12,tw,24,12);c.fill();c.fillStyle='#fff7e8';c.fillText(txt,W/2,yy+1,W-40);c.restore();}
 // control hint
 if(g.hintT>0&&!g.tut){c.globalAlpha=clamp(g.hintT,0,1);drawKeyHint(c,W/2,H-(m?60:56));c.globalAlpha=1;}
 // tutorial ghost
 if(g.tut){const st=g.tut.step;if(st===0||st===3){drawKeyHint(c,W/2,H-(m?70:64),true);const s=toScreen(g.kite.x,g.kite.y);if(st===3){c.strokeStyle='rgba(255,255,255,.8)';c.lineWidth=4;c.setLineDash([10,8]);c.lineDashOffset=-g.t*40;c.beginPath();c.arc(s.x,s.y-70*SC,60*SC,0,TAU);c.stroke();c.setLineDash([]);}
   const hp=(Math.sin(g.t*5)+1)/2;c.save();c.translate(W*0.62,H*0.62+hp*8);c.fillStyle='rgba(255,255,255,.9)';c.strokeStyle='#3d2b4f';c.lineWidth=3;c.beginPath();c.moveTo(0,0);c.lineTo(0,-30);c.quadraticCurveTo(6,-38,12,-30);c.lineTo(12,-12);c.lineTo(26,-10);c.quadraticCurveTo(34,-8,32,6);c.lineTo(28,26);c.lineTo(4,26);c.closePath();c.fill();c.stroke();c.globalAlpha=1-hp;c.strokeStyle='#fff';c.beginPath();c.arc(6,-34,14+hp*14,0,TAU);c.stroke();c.restore();}
  if(st===1){c.font='900 46px '+FONT;c.textAlign='center';c.fillStyle='rgba(255,255,255,.85)';c.fillText('↘',W*0.6,H*0.55);}}
 // flying ui icons
 for(const f of UIF){const e=easeOut(f.t);const x=lerp(f.x,sx+26,e),y=lerp(f.y,sy+26,e)-Math.sin(f.t*Math.PI)*60;c.save();c.translate(x,y);c.scale(1-e*0.4,1-e*0.4);icon(c,f.kind==='lan'?'lan':f.kind,0,0,0.7);c.restore();}
}
const COARSE=(function(){try{return matchMedia('(pointer:coarse)').matches;}catch(e){return false;}})();
function drawKeyHint(c,x,y,big){const s=big?1.15:1;c.save();c.translate(x,y);c.scale(s,s);c.font='800 15px '+FONT;c.textAlign='center';c.textBaseline='middle';
 const t=G.t;const pressed=Math.floor(t*1.6)%2===0;c.fillStyle='rgba(61,43,79,.4)';rr(c,-148,-20,296,44,14);c.fill();
 c.fillStyle=pressed?'#ffd166':'#fff7e8';rr(c,-140,-14+(pressed?3:0),92,30,8);c.fill();c.fillStyle='#3d2b4f';c.fillText(COARSE?'HOLD':'SPACE',-94,1+(pressed?3:0));
 c.fillStyle='#fff';c.fillText(COARSE?'anywhere':'/ click',-2,1);c.textAlign='left';c.fillText(pressed?'climb ↑':'let go ↘',58,1);c.restore();}

// ================= screens & UI =================
const SCR=['title','levels','shed','pause','res'];
function showScreen(n){for(const s of SCR)$(s).classList.toggle('on',s===n);$('hudb').classList.toggle('on',n===null&&G&&G.mode==='play'&&!G.demo);}
function paintMute(){const svg=AU.muted?'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3d2b4f"/><path d="M16 9l5 6M21 9l-5 6" stroke="#ff6f61" stroke-width="2.4" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z" fill="#3d2b4f"/><path d="M16 8.5c1.6 1.8 1.6 5.2 0 7M18.5 6c3 3.2 3 8.8 0 12" stroke="#3d2b4f" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';$('hMute').innerHTML=svg;$('tMute').innerHTML=svg;}
function buildLogo(){const L='Loopkite',cols=['#ff7b67','#ffc54a','#ffc54a','#ff7b67','#4fc3e0','#7bd389','#c58cf2','#ff9ad5'];$('logo').innerHTML=L.split('').map((ch,i)=>'<span style="color:'+cols[i]+';animation-delay:'+(i*0.12)+'s;--r:'+((i%2?1:-1)*3)+'deg">'+ch+'</span>').join('');}
function refreshTitle(){$('bCont').classList.toggle('hide',!hasSave());$('bPlay').textContent=hasSave()?'Levels':'Play';$('bLv').classList.toggle('hide',!hasSave());$('bPlay').classList.toggle('hide',hasSave());}
function totalStars(){let s=0;for(let i=0;i<NL;i++)s+=save.stars[i]||0;return s;}
function startDemo(){startLevel(0,{demo:1});G.mode='title';AU.musicOn=true;}
function startPlay(i){auInit();startLevel(i);showScreen(null);$('hudb').classList.add('on');AU.musicOn=true;save.last=i;save.played=Math.max(1,save.played);persist();cv.focus();}
function startTut(from){auInit();startLevel(0,{tut:1});G.tutFrom=from;$('tut').classList.add('on');$('tutcap').textContent=TUTCAP[0];showScreen(null);$('hudb').classList.add('on');AU.musicOn=true;}
function continueGame(){let i=0;for(let j=0;j<Math.min(save.unlocked,NL);j++){if(!(save.stars[j]>0)){i=j;break;}i=Math.min(save.unlocked-1,NL-1);}startPlay(i);}
function openLevels(){showScreen('levels');$('lvStars').textContent='★ '+totalStars()+' / '+NL*3;$('lvShells').innerHTML=SHELL+' '+save.shells.toLocaleString();const gr=$('lvGrid');gr.innerHTML='';
 for(let i=0;i<NL;i++){const b=document.createElement('button');const lock=i>=save.unlocked;b.className='lv'+(lock?' lock':'')+(LV[i].boss?' boss':'')+(i===save.unlocked-1&&!(save.stars[i]>0)?' cur':'');const s=save.stars[i]||0;
  b.innerHTML=lock?'<b>'+LOCK+'</b><i>'+(i+1)+'</i>':'<b>'+(i+1)+'</b><i>'+LV[i].n+'</i><span class="st">'+'★'.repeat(s)+'<s>'+'★'.repeat(3-s)+'</s></span>';
  if(!lock)b.onclick=()=>{sClick();startPlay(i);};gr.appendChild(b);}}
function openShed(){showScreen('shed');renderShed();}
function renderShed(){$('shShells').innerHTML=SHELL+' '+save.shells.toLocaleString()+' &nbsp;★ '+totalStars();const kw=$('shKites');kw.innerHTML='';const ts=totalStars();
 for(const id of KORDER){const K=KITES[id];const d=document.createElement('div');d.className='kc'+(save.kite===id?' sel':'');const own=!!save.kites[id];
  d.innerHTML='<canvas width="220" height="180"></canvas><div class="nm">'+K.name+'</div><div class="ds">'+K.ds+'</div>';
  const b=document.createElement('button');b.className='btn sm '+(own?(save.kite===id?'leaf':'sea'):'sun');
  if(own){b.textContent=save.kite===id?'Flying ✓':'Fly it';b.onclick=()=>{save.kite=id;persist();sClick();renderShed();};}
  else{const can=save.shells>=K.cost&&ts>=K.stars;b.innerHTML=(ts<K.stars?'★'+K.stars+' · ':'')+SHELL+K.cost.toLocaleString();if(!can)b.disabled=true;b.onclick=()=>{if(save.shells>=K.cost&&totalStars()>=K.stars){save.shells-=K.cost;save.kites[id]=1;save.kite=id;persist();sWin();renderShed();}};}
  d.appendChild(b);kw.appendChild(d);
  const pc=d.querySelector('canvas').getContext('2d');pc.scale(2,2);const sv=G;if(!G)G={t:1};pc.translate(55,40);drawKite(pc,id,0,0,0.25,1,0);G=sv;}
 const up=$('shUps');up.innerHTML='';
 [['line','Line Strength','Longer, stronger line · more patches'],['lift','Lift','Faster turns, more climb & speed']].forEach(([k,n,ds])=>{const lv=save[k];const r=document.createElement('div');r.className='ug';
  let pips='';for(let i=0;i<UPMAX;i++)pips+='<u class="'+(i<lv?'on':'')+'"></u>';
  r.innerHTML='<div><div class="nm">'+n+' <small>'+lv+'/'+UPMAX+'</small></div><div style="font-size:11px;opacity:.7">'+ds+'</div></div><div class="pips">'+pips+'</div>';
  const b=document.createElement('button');b.className='btn sm sun';if(lv>=UPMAX){b.textContent='MAX';b.disabled=true;}else{const cst=upCost(lv);b.innerHTML=SHELL+' '+cst.toLocaleString();if(save.shells<cst)b.disabled=true;b.onclick=()=>{if(save.shells>=cst){save.shells-=cst;save[k]++;persist();sChime(save[k]);renderShed();}};}
  r.appendChild(b);up.appendChild(r);});}
let resInfo=null;
function showResult(win){const g=G;g.mode='result';$('hudb').classList.remove('on');AU.musicOn=false;const T=starT();let stars=0;
 if(win){stars=1+(g.score>=T[1]?1:0)+(g.score>=T[2]?1:0);}
 const i=g.lvl,prevStars=save.stars[i]||0;const shells=Math.round(g.score/25)+(win?stars*30:0)+(win&&stars>prevStars?(stars-prevStars)*60:0);
 if(win){save.stars[i]=Math.max(prevStars,stars);save.unlocked=Math.max(save.unlocked,Math.min(NL,i+2));}
 const best=save.best[i]||0;const nb=g.score>best;if(nb)save.best[i]=g.score;save.shells+=shells;save.played++;persist();
 resInfo={win,stars,shells,score:g.score,t:0};
 $('rTitle').textContent=win?(g.def.boss?'Storm Cleared!':['Sky High!','Beautiful Flight!','Kite Master!'][stars-1]):(g.failed?'Kite Down!':'So close!');
 const rs=$('rStars');rs.innerHTML='';for(let s=0;s<3;s++){const cc=document.createElement('canvas');cc.width=148;cc.height=148;rs.appendChild(cc);}
 let line;if(win)line='+'+shells+' shells'+(nb?'  ·  New best!':'  ·  Best '+best.toLocaleString());else{const gt=g.def.goal[0];line=g.def.boss?'Storm King has '+g.boss.hp+' ♥ left':('Got '+g.goal+' / '+g.goalN+' '+({circle:'perfect circles',rib:'ribbons',ring:'rings',lan:'lanterns',loop:'loops'}[gt]))+(g.failed?' — dodge to keep patches':'');line+='  ·  +'+shells+' shells';}
 if(win&&stars<3)line+='\n★'+(stars+1)+' at '+T[stars].toLocaleString();
 $('rLine').textContent=line;$('rLine').style.whiteSpace='pre-line';
 const te=$('rTease');const ni=win?i+1:i;if(ni<NL){te.classList.remove('hide');te.innerHTML='<canvas width="108" height="108"></canvas><span>'+(win?'Next: ':'Try again: ')+LV[ni].n+'<br><small style="opacity:.7">'+LV[ni].say+'</small></span>';const tc=te.querySelector('canvas').getContext('2d');tc.scale(2,2);tc.fillStyle='#8fd0ee';rr(tc,2,2,50,50,12);tc.fill();icon(tc,LV[ni].tease,27,27,LV[ni].tease==='boss'?1:0.8);}else{te.classList.remove('hide');te.innerHTML='<span>You beat every storm! Chase ★★★</span>';}
 $('rNext').classList.toggle('hide',!(win&&i+1<NL));$('rRe').className=win&&i+1<NL?'btn sun':'btn big sun';
 showScreen('res');resShownAt=performance.now();}
let resShownAt=0;
function animResult(dt){if(!resInfo||G.mode!=='result')return;resInfo.t+=dt;const r=resInfo;const cs=$('rStars').querySelectorAll('canvas');
 cs.forEach((cc,s)=>{const x=cc.getContext('2d');x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,148,148);const st=0.3+s*0.35;const e=r.t<st?0:easeBack((r.t-st)/0.4);const got=s<r.stars;
  if(got&&r.t>=st&&!cc._p){cc._p=1;sChime(5+s*2);}
  x.translate(74,74);x.rotate((1-Math.min(1,e))*-1.5);const sc=got?Math.max(0.0001,e):1;x.scale(sc,sc);starPath(x,0,0,62,28);x.fillStyle=got?'#ffd166':'#eadcc0';x.fill();x.lineWidth=7;x.strokeStyle=got?'#e08a1a':'#d7bf95';x.stroke();if(got){x.fillStyle='rgba(255,255,255,.6)';x.beginPath();x.ellipse(-16,-14,10,5,-0.6,0,TAU);x.fill();}});
 const v=Math.round(r.score*easeOut(Math.min(1,r.t/1.1)));$('rScore').textContent=v.toLocaleString();}

// ================= input =================
function isHoldKey(e){return e.code==='Space'||e.code==='ArrowUp'||e.code==='KeyW'||e.code==='Enter'||e.code==='NumpadEnter';}
function setHoldState(){hold=keyHold||ptrs.size>0;}
window.addEventListener('keydown',e=>{auInit();
 if(e.code==='KeyM'){setMute(!AU.muted);return;}
 if(G&&G.mode==='play'&&!G.demo){
  if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();pauseGame();return;}
  if(e.code==='KeyR'&&!G.tut){startPlay(G.lvl);return;}
  if(isHoldKey(e)){e.preventDefault();keyHold=true;setHoldState();}
  return;}
 if(G&&G.mode==='pause'){if(e.code==='Escape'||e.code==='KeyP'){resumeGame();}return;}
 if(G&&G.mode==='result'){if(e.repeat||performance.now()-resShownAt<700)return;if(e.code==='KeyR'){startPlay(G.lvl);}else if(e.code==='Enter'||e.code==='Space'){e.preventDefault();if(resInfo.win&&G.lvl+1<NL)startPlay(G.lvl+1);else startPlay(G.lvl);}else if(e.code==='Escape')openLevels();return;}
 if($('title').classList.contains('on')&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();if(hasSave())continueGame();else playFresh();}
});
window.addEventListener('keyup',e=>{if(isHoldKey(e)){keyHold=false;setHoldState();}});
cv.addEventListener('pointerdown',e=>{auInit();if(!G||G.mode!=='play'||G.demo)return;ptrs.add(e.pointerId);setHoldState();e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}} ,{passive:false});
const ptrUp=e=>{ptrs.delete(e.pointerId);setHoldState();};
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);cv.addEventListener('lostpointercapture',ptrUp);
window.addEventListener('blur',()=>{keyHold=false;ptrs.clear();setHoldState();if(G&&G.mode==='play'&&!G.demo)pauseGame();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G&&G.mode==='play'&&!G.demo)pauseGame();});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function pauseGame(){if(!G||G.mode!=='play')return;G.mode='pause';keyHold=false;ptrs.clear();setHoldState();showScreen('pause');AU.musicOn=false;if(AU.thG)AU.thG.gain.value=0;if(AU.windG)AU.windG.gain.value=0;}
function resumeGame(){if(!G||G.mode!=='pause')return;G.mode='play';showScreen(null);$('hudb').classList.add('on');if(G.tut)$('tut').classList.add('on');AU.musicOn=true;}
function playFresh(){sClick();if(!save.tut)startTut('play');else openLevels();}
const bind=(id,f)=>$(id).addEventListener('click',e=>{e.stopPropagation();auInit();sClick();f();});
bind('bCont',continueGame);bind('bPlay',playFresh);bind('bLv',openLevels);bind('bShed',openShed);bind('bHow',()=>startTut('menu'));
bind('lvBack',()=>{showScreen('title');refreshTitle();if(!G||G.mode!=='title')startDemo();});bind('shBack',()=>{showScreen('title');refreshTitle();if(!G||G.mode!=='title')startDemo();});
bind('pRes',resumeGame);bind('pRe',()=>{if(G.tut){$('tut').classList.add('on');startTut(G.tutFrom);}else startPlay(G.lvl);});bind('pMenu',()=>{$('tut').classList.remove('on');AU.musicOn=false;openLevels();startDemo();G.mode='menu';});
bind('rNext',()=>startPlay(G.lvl+1));bind('rRe',()=>startPlay(G.lvl));bind('rMenu',()=>{openLevels();startDemo();G.mode='menu';});
bind('skip',()=>{endTut(false);});bind('tMute',()=>setMute(!AU.muted));
$('hMute').addEventListener('pointerdown',e=>e.stopPropagation());$('hPause').addEventListener('pointerdown',e=>e.stopPropagation());
$('hMute').addEventListener('click',e=>{e.stopPropagation();setMute(!AU.muted);});$('hPause').addEventListener('click',e=>{e.stopPropagation();pauseGame();});
$('skip').addEventListener('pointerdown',e=>e.stopPropagation());

// ================= main loop =================
let last=performance.now();
let MANUAL=false;
function tick(dt){if(G){if(G.mode==='play'||G.mode==='title'||G.mode==='menu'||G.mode==='result'){let d=dt;if(G.freeze>0){G.freeze-=dt;d=0;}if(G.slow>0){G.slow-=dt;d*=0.4;}if(d>0)update(d);}
  if(G.mode==='result')animResult(dt);}}
function frame(now){let dt=(now-last)/1000;last=now;dt=Math.min(dt,1/30);
 if(!MANUAL)tick(dt);
 render();musicTick();requestAnimationFrame(frame);}
buildLogo();paintMute();refreshTitle();startDemo();requestAnimationFrame(frame);
window.__LK={tick,manual(v){MANUAL=v;},get G(){return G;},get save(){return save;},setHold(v){keyHold=v;setHoldState();},startPlay,startTut,stats,LV,finishLevel,simPath};
</script>

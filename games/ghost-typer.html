function keyOf(c){if(c===' ')return' ';if(SHIFT[c])return SHIFT[c];return c.toLowerCase()}
function drawHeat(c,stats){const dpr=Math.min(2,window.devicePixelRatio||1);const w=c.clientWidth||500;const ks=w/12.6;const h=ks*5.3+8;c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const g=c.getContext('2d');g.scale(dpr,dpr);
 const agg={};for(const ch in stats){const k=keyOf(ch);const a=agg[k]||(agg[k]=[0,0]);a[0]+=stats[ch][0];a[1]+=stats[ch][1]}
 const shiftA=[0,0];for(const ch in stats){if(ch!==ch.toLowerCase()||SHIFT[ch]){shiftA[0]+=stats[ch][0];shiftA[1]+=stats[ch][1]}}
 const col=(a)=>{if(!a||!a[0])return'#2a2244';const r=a[1]/a[0];if(r<=0)return'#1f8a6a';if(r<.06)return lerpC('#1fd6a0','#ffe14a',r/.06);return lerpC('#ffe14a','#ff2a4a',clamp((r-.06)/.14,0,1))};
 const key=(x,y,kw,label,a)=>{g.fillStyle=col(a);rrp(g,x+2,y+2,kw-4,ks-4,6);g.fill();if(a&&a[1]){g.shadowColor='#ff2a4a';g.shadowBlur=a[1]*3}g.shadowBlur=0;g.fillStyle=a&&a[0]?'#0a0418':'rgba(255,255,255,.5)';g.font='900 '+(ks*.36)+'px Consolas,monospace';g.textAlign='center';g.textBaseline='middle';g.fillText(label,x+kw/2,y+ks*.45);if(a&&a[1]){g.font='900 '+(ks*.22)+'px "Trebuchet MS",sans-serif';g.fillText(a[1],x+kw*.78,y+ks*.78)}};
 KROWS.forEach((r,ri)=>{const off=[0,.5,.75,1.1][ri]*ks+4;for(let i=0;i<r.length;i++)key(off+i*ks,4+ri*ks,ks,r[i].toUpperCase(),agg[r[i]])});
 key(4,4+3*ks,ks*1.1,'⇧',shiftA[0]?shiftA:null);key(4+ks*2.5,4+4*ks,ks*7,'space',agg[' ']);}
function lerpC(a,b,t){const A=[1,3,5].map(i=>parseInt(a.substr(i,2),16)),B=[1,3,5].map(i=>parseInt(b.substr(i,2),16));return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')'}
function openStats(){SFX.click();const d=document.createElement('div');const h=G.hist;const avg=h.length?Math.round(h.slice(-10).reduce((s,r)=>s+r.w,0)/Math.min(10,h.length)):0;
 d.innerHTML='<div class="stats">'+chip(G.best,'BEST')+chip(avg,'AVG 10')+chip(G.races,'RACES')+chip(h.filter(r=>r.p===1).length,'WINS')+'</div><div class="sub">WPM HISTORY</div>';
 const gc=document.createElement('canvas');gc.className='gr';d.appendChild(gc);d.insertAdjacentHTML('beforeend','<div class="sub">KEY ERRORS · ALL TIME</div>');const hm=document.createElement('canvas');hm.className='hm';d.appendChild(hm);
 openModal('Stats',d);requestAnimationFrame(()=>{drawGraph(gc);drawHeat(hm,G.keys)})}
function drawGraph(c){const dpr=Math.min(2,window.devicePixelRatio||1);const w=c.clientWidth||500,h=Math.round(w*.42);c.width=w*dpr;c.height=h*dpr;c.style.height=h+'px';const g=c.getContext('2d');g.scale(dpr,dpr);
 const hs=G.hist.slice(-40);const pl=34,pr=10,pt=12,pb=20;const maxW=Math.max(60,...hs.map(r=>r.w),LEAGUES[G.top][1])+10;const minW=0;
 g.strokeStyle='rgba(255,255,255,.1)';g.fillStyle='rgba(255,255,255,.5)';g.font='11px "Trebuchet MS",sans-serif';g.textAlign='right';for(let v=0;v<=maxW;v+=20){const y=pt+(h-pt-pb)*(1-(v-minW)/(maxW-minW));g.beginPath();g.moveTo(pl,y);g.lineTo(w-pr,y);g.stroke();g.fillText(v,pl-5,y+4)}
 const tw=LEAGUES[G.top][1];const ty=pt+(h-pt-pb)*(1-tw/maxW);g.setLineDash([6,5]);g.strokeStyle='#ff3fd2';g.beginPath();g.moveTo(pl,ty);g.lineTo(w-pr,ty);g.stroke();g.setLineDash([]);g.fillStyle='#ff3fd2';g.textAlign='left';g.fillText('league '+tw,pl+4,ty-4);
 if(hs.length<1){g.fillStyle='rgba(255,255,255,.5)';g.textAlign='center';g.font='16px "Trebuchet MS",sans-serif';g.fillText('race to fill this',w/2,h/2);return}
 const X=i=>pl+(w-pl-pr)*(hs.length===1?.5:i/(hs.length-1)),Y=v=>pt+(h-pt-pb)*(1-v/maxW);
 const gr=g.createLinearGradient(0,pt,0,h);gr.addColorStop(0,'rgba(63,240,255,.35)');gr.addColorStop(1,'rgba(63,240,255,0)');g.fillStyle=gr;g.beginPath();g.moveTo(X(0),h-pb);hs.forEach((r,i)=>g.lineTo(X(i),Y(r.w)));g.lineTo(X(hs.length-1),h-pb);g.fill();
 g.strokeStyle='#3ff0ff';g.lineWidth=2.5;g.beginPath();hs.forEach((r,i)=>i?g.lineTo(X(i),Y(r.w)):g.moveTo(X(i),Y(r.w)));g.stroke();
 hs.forEach((r,i)=>{g.fillStyle=r.p===1?'#ffe14a':r.p===2?'#d8d8e8':'#ff8aa0';g.beginPath();g.arc(X(i),Y(r.w),3.5,0,TAU);g.fill()})}
function openGarage(){SFX.click();const d=document.createElement('div');d.className='cars';
 CARS.forEach((c,i)=>{const lock=i>G.top;const e=document.createElement('div');e.className='carc'+(i===G.car?' sel':'')+(lock?' lock':'');e.appendChild(carCanvas(c[0],c[1],c[2],100,44));e.insertAdjacentHTML('beforeend','<div>'+(lock?LEAGUES[i][1]+' WPM':LEAGUES[i][0].split(' ')[0])+'</div>');if(!lock)e.onclick=()=>{G.car=i;save();openGarage()};d.appendChild(e)});openModal('Cars',d)}
$('statsBtn').onclick=openStats;$('garageBtn').onclick=openGarage;
// ---------- track render ----------
function drawTrack(){const th=trackH();drawSynthBand(th);const ghosts=R.ghosts.length,n=4+ghosts;const top=34,laneH=(th-top-8)/n;const x0=clamp(laneH*.85,24,64)+8,x1=W-40;const len=R.text.length;
 // road
 ctx.fillStyle='rgba(10,4,24,.8)';ctx.fillRect(0,top-4,W,laneH*n+8);
 ctx.strokeStyle='rgba(255,63,210,.5)';ctx.lineWidth=2;ctx.setLineDash([18,14]);ctx.lineDashOffset=-(R.pos*3+T*8);for(let i=1;i<n;i++){const y=top+i*laneH;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.setLineDash([]);
 ctx.strokeStyle='#3ff0ff';ctx.lineWidth=3;ctx.shadowColor='#3ff0ff';ctx.shadowBlur=10;ctx.beginPath();ctx.moveTo(0,top-4);ctx.lineTo(W,top-4);ctx.moveTo(0,top+laneH*n+4);ctx.lineTo(W,top+laneH*n+4);ctx.stroke();ctx.shadowBlur=0;
 // finish
 const cs=Math.max(5,laneH/5);for(let y=top,k=0;y<top+laneH*n;y+=cs,k++){for(let j=0;j<3;j++){ctx.fillStyle=(k+j)%2?'#fff':'#111';ctx.fillRect(x1+j*cs-cs,y,cs,cs)}}
 ctx.fillStyle='rgba(255,255,255,.15)';ctx.fillRect(x0,top,2,laneH*n);
 const L=clamp(laneH*1.5,28,80);const lane=i=>top+laneH*(i+.5);const px=p=>x0+(x1-x0-L*.4)*clamp(p/len,0,1);
 const label=(t,x,y,col)=>{ctx.font='900 '+clamp(laneH*.26,9,12)+'px "Trebuchet MS",sans-serif';ctx.textAlign='left';ctx.textBaseline='top';ctx.fillStyle=col;ctx.globalAlpha=.85;ctx.fillText(t,6,y-laneH/2+3);ctx.globalAlpha=1};
 let li=0;
 R.ghosts.forEach(gh=>{const ch=Math.min(len,ghostChars(gh,R.t));const x=px(ch),y=lane(li++);drawCar(ctx,x,y+Math.sin(T*3+li)*1.5,L,'#e0ffff','#3ff0ff',CARS[G.car][2],.38+Math.sin(T*6)*.06,true);label(gh.lbl,x,y,'rgba(63,240,255,.8)')});
 R.ai.forEach(a=>{const x=px(a.prog),y=lane(li++);trail(x,y,L,a.col);drawCar(ctx,x,y,L,a.col,'#1a0830',a.shape);label(a.name.split(' ')[0]+(a.fin?' ✔':''),x,y,a.col)});
 const y=lane(li),x=px(R.pos);trail(x,y,L,CARS[G.car][0]);drawCar(ctx,x,y,L,CARS[G.car][0],CARS[G.car][1],CARS[G.car][2]);label('YOU',x,y,'#ffe14a');
 if(R.errFlash>0){ctx.fillStyle='rgba(255,59,92,'+R.errFlash+')';ctx.beginPath();ctx.arc(x+L*.5,y,L*.3,0,TAU);ctx.fill()}
 // top bar progress
 ctx.fillStyle='rgba(255,255,255,.7)';ctx.font='900 13px "Trebuchet MS",sans-serif';ctx.textAlign='left';ctx.textBaseline='middle';ctx.fillText(LEAGUES[R.l][0].toUpperCase(),12,16);ctx.textAlign='right';ctx.fillText(R.t.toFixed(1)+'s',W-112,16);
 if(R.cd>0){const n=Math.ceil(R.cd);ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(0,top-4,W,laneH*4+8+laneH*ghosts);ctx.font='900 '+Math.round(th*.4)+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillStyle=n<=0?'#7cf08a':'#ffe14a';ctx.shadowColor=ctx.fillStyle;ctx.shadowBlur=24;ctx.fillText(n<=0?'GO!':n>3?3:n,W/2,top+laneH*n*.5);ctx.shadowBlur=0}
}
function trail(x,y,L,col){ctx.fillStyle=col;ctx.globalAlpha=.18;for(let k=1;k<5;k++)ctx.fillRect(x-L*.5-k*L*.3,y-2+(k%2)*3,L*.2,2);ctx.globalAlpha=1}
function drawSynthBand(th){const g=ctx.createLinearGradient(0,0,0,th);g.addColorStop(0,'#1a0638');g.addColorStop(1,'#2a0848');ctx.fillStyle=g;ctx.fillRect(0,0,W,th)}
function drawRaceBg(){const th=trackH();const g=ctx.createLinearGradient(0,th,0,H);g.addColorStop(0,'#1a0638');g.addColorStop(1,'#0a0218');ctx.fillStyle=g;ctx.fillRect(0,th,W,H-th);ctx.strokeStyle='rgba(255,63,210,.12)';ctx.lineWidth=1;for(let x=(T*10)%40;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,th);ctx.lineTo(x,H);ctx.stroke()}}
// ---------- input ----------
const kb=$('kb');
function refocus(){if(state==='race'&&!paused){try{kb.focus({preventScroll:true})}catch(e){kb.focus()}}}
window.addEventListener('keydown',e=>{audioInit();
 if(e.key==='Escape'){if(state==='race'){togglePause();e.preventDefault();return}if(!$('modal').classList.contains('hidden')){goLobby();return}}
 if(state==='race'){if(e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.length===1){e.preventDefault();typeChar(e.key)}else if(e.key==='Backspace'||e.key==='Tab'||e.key===' ')e.preventDefault();return}
 if(e.key==='Enter'||e.key===' '){e.preventDefault();if(state==='title'){viewLeague=G.top;goLobby()}else if(state==='lobby'&&$('modal').classList.contains('hidden'))startRace();else if(state==='results'&&resultsOpen){$('modal').classList.add('hidden');startRace()}}
 if(state==='lobby'&&$('modal').classList.contains('hidden')){if(e.key==='ArrowLeft')$('lPrev').click();if(e.key==='ArrowRight')$('lNext').click()}});
kb.addEventListener('input',()=>{const v=kb.value;kb.value='';for(const ch of v)typeChar(ch)});
$('psg').addEventListener('pointerdown',()=>refocus());cv.addEventListener('pointerdown',()=>refocus());
function togglePause(f){if(state!=='race')return;paused=f!==undefined?f:!paused;$('pause').classList.toggle('hidden',!paused);if(!paused)refocus()}
$('pauseBtn').onclick=()=>togglePause(true);$('resumeBtn').onclick=()=>togglePause(false);$('quitBtn').onclick=()=>{R=null;goLobby()};
document.addEventListener('visibilitychange',()=>{if(document.hidden)togglePause(true)});
// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){T+=dt;if(state==='race'&&R)updateRace(dt)}
 ctx.setTransform(DPR,0,0,DPR,0,0);
 if((state==='race'||state==='results')&&R){drawRaceBg();drawTrack()}else drawTitleScene();
 requestAnimationFrame(loop)}
resize();requestAnimationFrame(loop);
</script></body></html>

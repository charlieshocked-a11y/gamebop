<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Boing Voyage</title>
<style>
:root{--ink:#3d2433;--paper:#fff3dc;--paperD:#e6c79c}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2a1b2c;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{font-family:"Trebuchet MS","Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.ov{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
.ov.show{display:block}
.pe{pointer-events:auto}
.btn{pointer-events:auto;font:inherit;font-weight:900;border:0;cursor:pointer;color:#fff;padding:12px 24px;font-size:21px;line-height:1;
 border-radius:20px 26px 18px 24px/24px 18px 26px 20px;background:linear-gradient(#ffa463,#ff6b3f 70%,#f2582f);
 box-shadow:0 6px 0 #b13f29,0 11px 16px rgba(50,15,25,.35),inset 0 3px 0 rgba(255,255,255,.45),inset 0 -3px 0 rgba(0,0,0,.08);
 text-shadow:0 2px 0 rgba(120,30,20,.45);position:relative;transition:transform .07s,box-shadow .07s,filter .1s;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:hover{filter:brightness(1.08) saturate(1.05)}
.btn:active,.btn.dn{transform:translateY(5px) scale(.98);box-shadow:0 1px 0 #b13f29,0 3px 6px rgba(50,15,25,.3),inset 0 3px 0 rgba(255,255,255,.45)}
.btn.blue{background:linear-gradient(#7fd8ff,#3f9ff0 70%,#3590e0);box-shadow:0 6px 0 #22609e,0 11px 16px rgba(20,25,60,.35),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(20,50,110,.45)}
.btn.blue:active{box-shadow:0 1px 0 #22609e,inset 0 3px 0 rgba(255,255,255,.45)}
.btn.green{background:linear-gradient(#a6ec78,#5ec24a 70%,#4fb23e);box-shadow:0 6px 0 #2f7a2a,0 11px 16px rgba(20,50,20,.35),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(30,80,20,.45)}
.btn.green:active{box-shadow:0 1px 0 #2f7a2a,inset 0 3px 0 rgba(255,255,255,.45)}
.btn.purple{background:linear-gradient(#d39bff,#9d5ce8 70%,#8f4fdc);box-shadow:0 6px 0 #5a2f9a,0 11px 16px rgba(40,20,60,.35),inset 0 3px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 rgba(60,20,110,.45)}
.btn.purple:active{box-shadow:0 1px 0 #5a2f9a,inset 0 3px 0 rgba(255,255,255,.45)}
.btn.cream{background:linear-gradient(#fffaf0,#f6e3c2);color:var(--ink);text-shadow:none;box-shadow:0 6px 0 #c9a77a,0 11px 16px rgba(50,15,25,.3),inset 0 3px 0 #fff}
.btn.cream:active{box-shadow:0 1px 0 #c9a77a,inset 0 3px 0 #fff}
.btn.big{font-size:30px;padding:16px 38px}
.btn.ico{width:54px;height:54px;padding:0;border-radius:50% 46% 52% 48%/48% 52% 46% 50%}
.btn.sm{font-size:16px;padding:9px 16px}
.btn svg{width:26px;height:26px;flex:none}
.btn.big svg{width:30px;height:30px}
.btn[disabled]{filter:grayscale(.8) brightness(.9);cursor:default}
@keyframes popin{0%{transform:scale(.2) rotate(-10deg);opacity:0}55%{transform:scale(1.12) rotate(3deg);opacity:1}78%{transform:scale(.95) rotate(-1deg)}100%{transform:scale(1)}}
@keyframes slideup{0%{transform:translateY(40px);opacity:0}70%{transform:translateY(-4px);opacity:1}100%{transform:none}}
@keyframes wob{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.show .pop{animation:popin .55s cubic-bezier(.2,.8,.3,1) backwards}
#title .menu{position:absolute;left:0;right:0;bottom:calc(46px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:16px}
#title .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff6e6;opacity:.55;text-decoration:none;pointer-events:auto;text-shadow:0 1px 2px rgba(0,0,0,.4);letter-spacing:.3px}
#support:hover{opacity:1}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));gap:8px}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;background:rgba(255,244,222,.94);border-radius:16px 20px 15px 19px;padding:6px 12px 6px 8px;font-weight:900;font-size:18px;box-shadow:0 4px 0 rgba(150,105,70,.55),0 6px 12px rgba(0,0,0,.2)}
.chip svg{width:22px;height:22px}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
#card{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--paper);border-radius:24px 30px 22px 28px;padding:12px 14px 12px 18px;display:flex;align-items:center;gap:14px;box-shadow:0 7px 0 var(--paperD),0 16px 30px rgba(0,0,0,.35);pointer-events:auto;min-width:300px;max-width:94vw}
#card .nm{font-weight:900;font-size:20px;line-height:1.1}
#card .sub{font-size:13px;opacity:.7;font-weight:700}
#card .icons{display:flex;gap:4px;margin-top:4px;align-items:center}

.panel{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);background:var(--paper);border-radius:30px 36px 28px 34px;padding:22px 22px 20px;box-shadow:0 9px 0 var(--paperD),0 26px 50px rgba(0,0,0,.45);pointer-events:auto;max-width:94vw;max-height:90vh;overflow:auto;text-align:center}
.show .panel{animation:panelin .45s cubic-bezier(.2,.9,.3,1.15) backwards}
@keyframes panelin{0%{transform:translate(-50%,-30%) scale(.7) rotate(-4deg);opacity:0}100%{transform:translate(-50%,-50%)}}
.ribbon{display:inline-block;margin:-38px auto 10px;background:linear-gradient(#ff8b57,#f0603a);color:#fff;font-weight:900;font-size:24px;padding:8px 28px;border-radius:12px 16px 10px 14px;box-shadow:0 5px 0 #a73c25;text-shadow:0 2px 0 rgba(0,0,0,.2);transform:rotate(-2deg)}
.ribbon.blue{background:linear-gradient(#7fd2ff,#3f96e8);box-shadow:0 5px 0 #24589a}
.ribbon.purple{background:linear-gradient(#cf98ff,#9152e0);box-shadow:0 5px 0 #57308f}
.prow{display:flex;gap:12px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.dim{position:absolute;inset:0;background:rgba(35,15,35,.45);pointer-events:auto}

.star{width:76px;height:76px;position:relative;display:flex;flex-direction:column;align-items:center}

.star .why{width:26px;height:26px;margin-top:-6px}
.star .why svg{width:26px;height:26px}
.star.on svg.st{animation:starpop .5s cubic-bezier(.2,.9,.3,1.4) backwards}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:none}}

.stats span{display:inline-flex;gap:5px;align-items:center}
.stats svg{width:22px;height:22px}
#skinGrid,#achGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:6px}
.sk{background:#fff;border-radius:18px 22px 16px 20px;padding:8px 4px 6px;box-shadow:0 4px 0 #e2c9a3;cursor:pointer;position:relative;transition:transform .1s}
.sk:active{transform:translateY(3px)}
.sk.sel{outline:4px solid #ff7a45;outline-offset:-2px}
.sk.lock canvas{filter:brightness(.8) saturate(.45);opacity:.75}
.sk canvas{width:64px;height:64px;display:block;margin:0 auto}
.sk .n{font-weight:900;font-size:13px;margin-top:2px}
.sk .p{font-size:13px;font-weight:900;display:flex;gap:3px;justify-content:center;align-items:center;color:#2b74b8}
.sk .p svg{width:15px;height:15px}
.sk .eq{position:absolute;top:4px;right:6px;width:18px;height:18px}
#skinPrev{display:flex;align-items:center;gap:14px;justify-content:center}
#skinPrev canvas{width:120px;height:120px}
.ach{background:#fff;border-radius:16px 20px 14px 18px;padding:8px 6px;box-shadow:0 4px 0 #e2c9a3;font-size:12px;font-weight:800;line-height:1.15}
.ach .ai{width:40px;height:40px;margin:0 auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9dcc6}
.ach .ai svg{width:26px;height:26px}
.ach.got .ai{background:radial-gradient(circle at 35% 30%,#fff2a8,#ffc53d 60%,#e39a12)}
.ach:not(.got){opacity:.55}
.ach .d{font-weight:700;opacity:.65;font-size:11px;margin-top:2px}
#hudbtns{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px}
#hudbtns .btn{width:46px;height:46px}
#hudbtns .btn svg{width:22px;height:22px}
.tbtn{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));width:84px;height:84px;border-radius:50%;pointer-events:auto;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,rgba(255,255,255,.55),rgba(255,240,220,.28));border:3px solid rgba(255,255,255,.65);box-shadow:0 5px 0 rgba(0,0,0,.18)}
.tbtn svg{width:40px;height:40px;opacity:.9}
.tbtn.dn{transform:scale(.92);background:rgba(255,255,255,.6)}
.touch .tbtn{display:flex}
#tSquish{right:calc(16px + env(safe-area-inset-right))}
#tPound{right:calc(112px + env(safe-area-inset-right));width:68px;height:68px;bottom:calc(26px + env(safe-area-inset-bottom))}
#tut .cap{position:absolute;left:50%;top:calc(78px + env(safe-area-inset-top));transform:translateX(-50%);background:var(--paper);padding:12px 20px;border-radius:20px 26px 18px 24px;font-weight:900;font-size:22px;box-shadow:0 6px 0 var(--paperD),0 12px 24px rgba(0,0,0,.3);display:flex;align-items:center;gap:10px;white-space:nowrap;animation:slideup .45s cubic-bezier(.2,.9,.3,1.2)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 6px;border-radius:8px;background:linear-gradient(#fff,#e9dcc8);box-shadow:0 4px 0 #b49a78;font-size:18px;font-weight:900;animation:keyp 1s infinite}
@keyframes keyp{0%,60%,100%{transform:none;box-shadow:0 4px 0 #b49a78}30%{transform:translateY(3px);box-shadow:0 1px 0 #b49a78}}
#tutSkip{position:absolute;right:calc(14px + env(safe-area-inset-right));top:calc(68px + env(safe-area-inset-top))}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-220%);opacity:0;background:linear-gradient(#fff6c8,#ffd65a);border-radius:18px;padding:8px 16px 8px 10px;font-weight:900;display:flex;gap:10px;align-items:center;box-shadow:0 5px 0 #c7962a,0 10px 20px rgba(0,0,0,.3);transition:transform .5s cubic-bezier(.2,.9,.3,1.3);z-index:20;white-space:nowrap}
#toast.on{transform:translate(-50%,0);opacity:1}
#toast svg{width:30px;height:30px}
#toast small{display:block;font-size:11px;opacity:.7}
.big2{font-size:44px;font-weight:900;line-height:1;margin:4px 0;color:#ff6b3f;text-shadow:0 3px 0 #ffd3a8}
.lbl{font-weight:800;opacity:.65;font-size:14px}
@media (max-height:460px){#title .menu{gap:10px;bottom:calc(30px + env(safe-area-inset-bottom))}.btn.big{font-size:24px;padding:12px 30px}.btn{font-size:17px;padding:10px 16px}.btn.ico{width:46px;height:46px}}
@media (max-width:520px){.btn.big{font-size:26px;padding:14px 30px}.btn{font-size:18px;padding:11px 18px}#card{min-width:0;width:94vw}#tut .cap{font-size:18px;top:calc(124px + env(safe-area-inset-top))}.star{width:62px}.star svg{width:54px;height:54px}#mapside{bottom:calc(112px + env(safe-area-inset-bottom))}#mapside .btn.ico{width:48px;height:48px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="ov">
  <div class="menu">
    <button id="bPlay" class="btn big pop" style="animation-delay:.15s"></button>
    <div class="row">
      <button id="bGaunt" class="btn purple pop" style="animation-delay:.25s"></button>
      <button id="bHow" class="btn blue pop" style="animation-delay:.32s"></button>
    </div>
    <div class="row">
      <button id="bSkinsT" class="btn ico cream pop" style="animation-delay:.4s" aria-label="Skins"></button>
      <button id="bAchT" class="btn ico cream pop" style="animation-delay:.46s" aria-label="Awards"></button>
      <button id="bMuteT" class="btn ico cream pop" style="animation-delay:.52s" aria-label="Sound"></button>
    </div>
  </div>
  <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="mapui" class="ov">
  <div class="bar">
    <button id="bMapBack" class="btn ico cream" aria-label="Back"></button>
    <div class="chips"><span class="chip" id="cGems"></span><span class="chip" id="cStars"></span><span class="chip" id="cBolts"></span></div>
  </div>
  <div id="mapside">
    <button id="bSkinsM" class="btn ico cream" aria-label="Skins"></button>
    <button id="bAchM" class="btn ico cream" aria-label="Awards"></button>
    <button id="bGauntM" class="btn ico purple" aria-label="Gauntlet"></button>
  </div>
  <div id="card">
    <div class="info"><div class="nm" id="cardName"></div><div class="sub" id="cardSub"></div><div class="icons" id="cardIcons"></div></div>
    <button id="bGo" class="btn green"></button>
  </div>
</div>

<div id="hud" class="ov">
  <div id="hudbtns"><button id="bPause" class="btn ico cream" aria-label="Pause"></button></div>
  <div id="tPound" class="tbtn"></div>
  <div id="tSquish" class="tbtn"></div>
</div>

<div id="tut" class="ov">
  <div class="cap" id="tutCap"></div>
  <button id="tutSkip" class="btn cream sm">Skip ›</button>
</div>

<div id="pause" class="ov"><div class="dim"></div>
  <div class="panel"><div class="ribbon blue">Paused</div>
    <div class="prow"><button id="bResume" class="btn green big"></button></div>
    <div class="prow"><button id="bRestart" class="btn sm cream"></button><button id="bQuit" class="btn sm cream"></button><button id="bMuteP" class="btn ico cream"></button></div>
  </div>
</div>

<div id="results" class="ov"><div class="dim" style="background:rgba(35,15,35,.25)"></div>
  <div class="panel" style="min-width:300px;top:62%"><div class="ribbon" id="resTitle">Hooray!</div>
    <div id="stars"></div>
    <div class="stats" id="resStats"></div>
    <div class="prow"><button id="bResMap" class="btn ico cream" aria-label="Map"></button><button id="bResRetry" class="btn ico cream" aria-label="Retry"></button><button id="bResNext" class="btn green big"></button></div>
  </div>
</div>

<div id="gover" class="ov"><div class="dim"></div>
  <div class="panel" style="min-width:290px"><div class="ribbon purple">Gauntlet</div>
    <div class="lbl">Score</div><div class="big2" id="goScore">0</div>
    <div class="stats" id="goStats"></div>
    <div class="prow"><button id="bGoMenu" class="btn ico cream" aria-label="Menu"></button><button id="bGoAgain" class="btn purple big"></button></div>
  </div>
</div>

<div id="skins" class="ov"><div class="dim"></div>
  <div class="panel" style="width:560px"><div class="ribbon">Skin Shelf</div>
    <div id="skinPrev"><canvas id="skinCv" width="240" height="240"></canvas><div style="text-align:left"><div class="nm" id="skName" style="font-weight:900;font-size:22px"></div><div class="lbl" id="skDesc"></div><div style="margin-top:10px"><button id="bSkAct" class="btn green sm"></button></div></div></div>
    <div id="skinGrid"></div>
    <div class="prow"><button id="bSkClose" class="btn cream sm">Done</button></div>
  </div>
</div>

<div id="ach" class="ov"><div class="dim"></div>
  <div class="panel" style="width:600px"><div class="ribbon blue">Awards <span id="achCount"></span></div>
    <div id="achGrid"></div>
    <div class="prow"><button id="bAchClose" class="btn cream sm">Done</button></div>
  </div>
</div>

<div id="toast"></div>
<script>
'use strict';
// ===== utils =====
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
let VW = 0, VH = 0, DPR = 1;
const TS = 40, PI = Math.PI, TAU = PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const E = {
  outCubic: t => 1 - Math.pow(1 - t, 3),
  outBack: t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); },
  inOut: t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2,
  outElastic: t => t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -9 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1
};
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return m + ':' + String(s).padStart(2, '0'); }

// ===== storage =====
const PFX = 'gamebop.boing-voyage.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) { } }
};
function defSave() { return { lv: {}, unl: 0, gems: 0, gemsAll: 0, skins: ['pip'], skin: 'pip', ach: {}, st: { smash: 0, sup: 0, cannon: 0, portal: 0, stomp: 0, plays: 0, maxCombo: 0, wall: 0 }, gBest: 0, daily: { d: '', best: 0 }, days: [], sel: 0, started: false }; }
let save = defSave();
try { const s = store.get('save', null); if (s && typeof s === 'object') { save = Object.assign(defSave(), s); save.st = Object.assign(defSave().st, s.st || {}); } } catch (e) { }
let settings = Object.assign({ mute: false, music: true }, store.get('settings', {}) || {});
function persist() { store.set('save', save); }
function persistSettings() { store.set('settings', settings); }

// ===== audio =====
let AC = null, master = null, sfx = null, mus = null, noiseBuf = null;
function initAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = settings.mute ? 0 : 1; master.connect(AC.destination);
    const comp = AC.createDynamicsCompressor(); comp.connect(master);
    sfx = AC.createGain(); sfx.gain.value = .55; sfx.connect(comp);
    mus = AC.createGain(); mus.gain.value = .12; mus.connect(comp);
    noiseBuf = AC.createBuffer(1, AC.sampleRate * .5, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  } catch (e) { AC = null; }
}
function setMute(m) { settings.mute = m; persistSettings(); if (master) master.gain.setTargetAtTime(m ? 0 : 1, AC.currentTime, .02); refreshMuteIcons(); }
function tone(f, dur, o = {}) {
  if (!AC || settings.mute) return;
  const t0 = AC.currentTime + (o.delay || 0);
  const os = AC.createOscillator(), g = AC.createGain();
  os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t0);
  if (o.to) os.frequency.exponentialRampToValueAtTime(Math.max(20, o.to), t0 + (o.glide || dur));
  const v = o.vol == null ? .3 : o.vol;
  g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(v, t0 + (o.att || .006)); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  let last = os;
  if (o.lfo) { const l = AC.createOscillator(), lg = AC.createGain(); l.frequency.value = o.lfo; lg.gain.value = o.lfoAmt || f * .15; l.connect(lg); lg.connect(os.frequency); l.start(t0); l.stop(t0 + dur + .05); }
  if (o.lp) { const fl = AC.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; os.connect(fl); last = fl; }
  last.connect(g); g.connect(o.dest || sfx); os.start(t0); os.stop(t0 + dur + .05);
}
function noise(dur, o = {}) {

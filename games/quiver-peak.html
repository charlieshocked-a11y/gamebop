<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Quiver Peak</title>
<style>
:root{--ink:#2b1a10;--cream:#fff3dc;--gold:#f2b538}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#2a3550;color:var(--cream);font-family:"Trebuchet MS","Segoe UI",Tahoma,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
button{font-family:inherit;border:none;cursor:pointer;color:inherit;background:none}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;opacity:1;transition:opacity .28s ease,transform .38s cubic-bezier(.2,.9,.3,1.25),visibility 0s;z-index:10}
.screen.hidden{opacity:0;visibility:hidden;transform:translateY(22px) scale(.97);transition:opacity .2s ease,transform .2s ease,visibility 0s .2s}
.screen>*{pointer-events:auto}
.btn{--sh:#3c1f0d;position:relative;font:700 19px/1 Georgia,"Palatino Linotype","Book Antiqua",serif;color:#fff4de;letter-spacing:.6px;padding:13px 30px 14px;border-radius:9px 13px 10px 12px;
background:repeating-linear-gradient(93deg,rgba(255,255,255,0) 0 9px,rgba(255,240,210,.06) 9px 11px,rgba(0,0,0,.05) 11px 18px),linear-gradient(#ad6e3d,#7e4724 55%,#673719);
box-shadow:inset 0 2px 0 rgba(255,222,170,.45),inset 0 -3px 0 rgba(0,0,0,.28),0 5px 0 var(--sh),0 9px 16px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.45);transition:transform .16s cubic-bezier(.3,1.8,.5,1),box-shadow .12s,filter .2s;white-space:nowrap}
.btn::before,.btn::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#f1dfb6,#6b5434 70%);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn::before{left:9px}.btn::after{right:9px}
.btn:hover{transform:translateY(-2px) scale(1.04);filter:brightness(1.08)}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:inset 0 2px 0 rgba(255,222,170,.3),inset 0 -2px 0 rgba(0,0,0,.28),0 1px 0 var(--sh),0 3px 6px rgba(0,0,0,.3)}
.btn.red{--sh:#5c150a;background:repeating-linear-gradient(93deg,rgba(255,255,255,0) 0 9px,rgba(255,240,210,.07) 9px 11px,rgba(0,0,0,.05) 11px 18px),linear-gradient(#ec6447,#bc3621 58%,#9a2614)}
.btn.green{--sh:#173a22;background:linear-gradient(#5f9a4a,#3f7434 60%,#2f5c27)}
.btn.big{font-size:30px;padding:17px 60px 19px;border-radius:12px 16px 12px 15px}
.btn.sm{font-size:15px;padding:9px 18px 10px}
.btn.sm::before,.btn.sm::after{display:none}
.btn[disabled]{filter:grayscale(.8) brightness(.75);cursor:default;transform:none}
#scrMain{justify-content:flex-end;padding-bottom:calc(7vh + env(safe-area-inset-bottom))}
.mcol{display:flex;flex-direction:column;align-items:center;gap:13px;animation:rise .7s cubic-bezier(.3,1.5,.6,1) both .25s}
.mrow{display:flex;gap:12px}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes popin{0%{opacity:0;transform:scale(.5)}70%{opacity:1;transform:scale(1.08)}100%{transform:scale(1)}}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff3dc;opacity:.55;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.7);transition:opacity .2s}
#support:hover{opacity:1}
.coinbox{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));display:flex;align-items:center;gap:7px;font:700 18px Georgia,serif;color:#fff4de;background:linear-gradient(#6d4022,#4e2b14);padding:6px 13px 6px 8px;border-radius:20px;box-shadow:inset 0 1px 0 rgba(255,220,170,.35),0 3px 0 #2d170a,0 6px 12px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.4);z-index:12;pointer-events:none}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3a8,#f2b538 55%,#b9761a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25),0 0 0 2px #8a5410}
#bMute{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));z-index:30}
.ibtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 30%,#93603a,#5a3216);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 3px 0 #2d170a,0 6px 10px rgba(0,0,0,.3);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.ibtn:active{transform:translateY(3px) scale(.94)}
.ibtn svg{width:22px;height:22px;fill:#fff1d6}
.panel{position:relative;width:min(960px,calc(100vw - 20px));max-height:calc(100% - 40px - env(safe-area-inset-top) - env(safe-area-inset-bottom));margin-top:calc(16px + env(safe-area-inset-top));display:flex;flex-direction:column;background:radial-gradient(120% 90% at 30% 0%,#fbf0d6,#ead2a2);color:var(--ink);border-radius:14px;border:7px solid #6e3f1f;box-shadow:inset 0 0 0 2px #c79c5e,inset 0 0 50px rgba(140,80,20,.22),0 14px 40px rgba(0,0,0,.45)}
.ribbon{align-self:center;margin-top:-22px;background:linear-gradient(#dc553c,#a92f1d);color:#fff6e6;font:700 23px Georgia,serif;padding:8px 36px 9px;border-radius:5px;box-shadow:0 4px 0 #6b190d,0 6px 12px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.35);position:relative;white-space:nowrap}
.ribbon::before,.ribbon::after{content:"";position:absolute;top:8px;width:22px;height:100%;background:#8e2414;z-index:-1}
.ribbon::before{left:-14px;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,40% 50%)}
.ribbon::after{right:-14px;clip-path:polygon(0 0,100% 0,60% 50%,100% 100%,0 100%)}
.pbody{overflow:auto;padding:14px 16px 16px;flex:1;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.pfoot{display:flex;justify-content:center;gap:12px;padding:4px 12px 16px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.card{position:relative;background:linear-gradient(#fff8e9,#f1dfb8);border-radius:11px;border:2px solid #c7a26a;box-shadow:0 3px 0 #b48a52,0 6px 12px rgba(80,40,10,.18);padding:9px;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.7,.5,1);animation:popin .4s cubic-bezier(.3,1.5,.6,1) both;text-align:left;color:var(--ink)}
.card:hover{transform:translateY(-3px) rotate(-.5deg)}
.card:active{transform:translateY(2px) scale(.98)}
.card.locked{filter:grayscale(.9) brightness(.82);cursor:default}
.card.locked:hover{transform:none}
.card h3{font:700 17px Georgia,serif;margin:6px 2px 2px}
.card .sub{font-size:12.5px;opacity:.75;margin:0 2px}
.card canvas{display:block;width:100%;border-radius:7px}
.card .lock{position:absolute;inset:0;display:grid;place-items:center;font:700 15px Georgia,serif;color:#fff;text-shadow:0 2px 3px #000}
.medal{position:absolute;top:6px;right:6px;width:30px;height:30px;border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 -3px 0 rgba(0,0,0,.2);display:grid;place-items:center;font:700 13px Georgia,serif;color:#5a3a10}
.medal.gold{background:radial-gradient(circle at 35% 30%,#fff6b0,#f2b538 60%,#b9761a)}
.medal.silver{background:radial-gradient(circle at 35% 30%,#ffffff,#c9d1d9 60%,#7d8a96)}
.medal.bronze{background:radial-gradient(circle at 35% 30%,#ffd6a8,#c98149 60%,#7a4419)}
.stars{color:#c99a3a;font-size:17px;letter-spacing:1px;margin:2px}
.stars i{font-style:normal;color:rgba(80,50,20,.25)}
.stars i.on{color:#e8a623;text-shadow:0 1px 0 #8a5410}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tab{font:700 16px Georgia,serif;padding:8px 18px;border-radius:20px;background:rgba(110,63,31,.15);color:var(--ink);transition:transform .15s}
.tab.on{background:#6e3f1f;color:#fff4de;transform:translateY(-1px)}
.bar{height:7px;border-radius:4px;background:rgba(80,40,10,.15);margin:3px 0 5px;overflow:hidden}
.bar b{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5f9a4a,#a8cf5a)}
.lbl{font-size:11.5px;opacity:.7;display:flex;justify-content:space-between}
.price{display:flex;align-items:center;gap:5px;font:700 15px Georgia,serif;margin-top:5px}
.eq{position:absolute;top:8px;left:8px;background:#3f7434;color:#fff;font:700 11px sans-serif;padding:3px 7px;border-radius:9px}
.ach{display:flex;gap:9px;align-items:center;padding:8px;border-radius:10px;background:rgba(255,255,255,.4);border:1px solid rgba(110,63,31,.2)}
.ach .md{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font:700 18px Georgia,serif;color:#6b4415;background:radial-gradient(circle at 35% 30%,#e9e2d4,#a9a091 70%);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.ach.on .md{background:radial-gradient(circle at 35% 30%,#fff6b0,#f2b538 60%,#b9761a);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2),0 0 10px rgba(242,181,56,.6)}
.ach b{font:700 14px Georgia,serif;display:block}
.ach span{font-size:12px;opacity:.7}
.ach:not(.on){opacity:.6}
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;transition:opacity .25s}
#hud.hidden{opacity:0;visibility:hidden}
#hEv{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));background:linear-gradient(#6d4022,#4e2b14);border-radius:9px;padding:6px 12px 7px;box-shadow:inset 0 1px 0 rgba(255,220,170,.35),0 3px 0 #2d170a,0 6px 12px rgba(0,0,0,.3);max-width:46vw}
#hEvN{font:700 14px Georgia,serif;color:#ffe4b0;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#hEvS{font-size:13px;color:#fff4de;display:block;margin-top:2px;white-space:nowrap}
#hScore{position:absolute;top:calc(6px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);font:700 36px Georgia,serif;color:#fff;text-shadow:0 3px 0 #3d200e,0 0 14px rgba(0,0,0,.45);transition:transform .2s cubic-bezier(.3,1.8,.5,1)}
#hScore.bump{transform:translateX(-50%) scale(1.25)}
#bPause{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(62px + env(safe-area-inset-right));pointer-events:auto}
.rbtn{pointer-events:auto;position:absolute;border-radius:50%;padding:6px;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.rbtn .in{width:100%;height:100%;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 30%,#93603a,#5a3216);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 3px 0 #2d170a;color:#fff1d6;font:700 11px sans-serif;letter-spacing:.5px}
.rbtn svg{width:30px;height:30px;fill:#fff1d6}
#bSteady{right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom));width:90px;height:90px;background:conic-gradient(#ffd56a calc(var(--b,1)*360deg),rgba(40,20,10,.5) 0)}
#bSteady.on .in{background:radial-gradient(circle at 40% 30%,#ffe9a0,#d39a26);color:#4a2a08}
#bSteady.on svg{fill:#4a2a08}
#bSteady.tired{background:conic-gradient(#e0533a calc(var(--b,1)*360deg),rgba(40,20,10,.5) 0)}
#bFocus{right:calc(118px + env(safe-area-inset-right));bottom:calc(22px + env(safe-area-inset-bottom));width:66px;height:66px;background:conic-gradient(#7fdcff calc(var(--f,0)*360deg),rgba(20,30,50,.5) 0)}
#bFocus .in{background:radial-gradient(circle at 40% 30%,#4c6a8a,#22344c)}
#bFocus.ready{animation:pulse .9s infinite}
#bFocus.ready .in{background:radial-gradient(circle at 40% 30%,#c8f2ff,#3aa0d8);color:#0b2a40}
#bFocus.ready svg{fill:#0b2a40}
#tut{position:fixed;left:0;right:0;top:calc(112px + env(safe-area-inset-top));display:flex;justify-content:center;pointer-events:none;z-index:20}
#tut.hidden{display:none}
#tutCap{background:rgba(255,247,228,.97);color:#2b1a10;font:700 19px Georgia,serif;padding:10px 20px;border-radius:12px;box-shadow:0 4px 0 #b48a52,0 8px 18px rgba(0,0,0,.3);max-width:calc(100vw - 30px);text-align:center}
#tutCap.pop{animation:popin .45s cubic-bezier(.3,1.6,.5,1)}
#tutSkip{position:fixed;top:calc(62px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:25;pointer-events:auto}
#tutSkip.hidden{display:none}
#toast{position:fixed;left:50%;top:calc(56px + env(safe-area-inset-top));transform:translate(-50%,-400%);z-index:40;display:flex;align-items:center;gap:10px;background:linear-gradient(#fff8e9,#f1dfb8);color:var(--ink);padding:8px 16px 8px 9px;border-radius:30px;border:2px solid #c7a26a;box-shadow:0 6px 16px rgba(0,0,0,.35);transition:transform .45s cubic-bezier(.3,1.5,.5,1);pointer-events:none;white-space:nowrap}
#toast.show{transform:translate(-50%,0)}
#toast .md{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6b0,#f2b538 60%,#b9761a);display:grid;place-items:center;font:700 16px Georgia,serif;color:#6b4415}
#toast b{font:700 15px Georgia,serif;display:block}#toast span{font-size:12px;opacity:.7}
#banner{position:fixed;left:0;right:0;top:34%;text-align:center;pointer-events:none;z-index:8;font:700 44px Georgia,serif;color:#fff;text-shadow:0 4px 0 #3d200e,0 0 24px rgba(0,0,0,.5);opacity:0;transform:scale(.6);transition:opacity .25s,transform .45s cubic-bezier(.3,1.6,.5,1)}
#banner.show{opacity:1;transform:none}
#banner small{display:block;font-size:20px;margin-top:6px;color:#ffe4b0}
table.st{width:100%;border-collapse:collapse;font:15px Georgia,serif}
table.st td{padding:6px 6px;border-bottom:1px solid rgba(110,63,31,.2)}
table.st td.n{text-align:right;font-weight:700;font-size:17px}
table.st tr.me{background:rgba(242,181,56,.25)}
table.st td.rs{font-size:12.5px;opacity:.75;text-align:center}
.rface{width:34px;height:34px;vertical-align:middle}
#rTitle{font:700 34px Georgia,serif;text-align:center;color:#6e3f1f;margin:4px 0 2px}
.rline{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;font:700 18px Georgia,serif;margin:6px 0}
.rline .coinv{display:flex;align-items:center;gap:6px}
.newb{display:inline-block;background:#c8432f;color:#fff;font:700 12px sans-serif;padding:3px 8px;border-radius:8px;margin-left:6px;animation:pulse 1s infinite}
.unl{text-align:center;color:#3f7434;font:700 15px Georgia,serif;margin-top:6px;animation:popin .5s both .6s}
#scrResult{justify-content:flex-end;padding-bottom:calc(10px + env(safe-area-inset-bottom))}
#scrResult .panel{width:min(560px,calc(100vw - 20px))}
#scrRound .panel,#scrPause .panel{width:min(520px,calc(100vw - 20px))}
.modeg{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.modeg .card h3{font-size:20px}
@media (max-width:520px){.btn.big{font-size:26px;padding:15px 46px 17px}.btn{font-size:17px;padding:12px 22px 13px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card h3{font-size:15px}.modeg{grid-template-columns:repeat(2,1fr);gap:10px}#banner{font-size:34px}#hScore{font-size:30px}.ribbon{font-size:19px;padding:7px 24px}}
@media (max-height:440px){.btn.big{font-size:24px;padding:12px 44px 14px}.mcol{gap:9px}.btn{font-size:16px;padding:10px 20px 11px}.btn.sm{font-size:13px;padding:7px 14px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
 <div id="hEv"><span id="hEvN">Village Fair</span><span id="hEvS">Round 1</span></div>
 <div id="hScore">0</div>
 <button class="ibtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
 <button class="rbtn" id="bFocus" aria-label="Focus"><div class="in"><svg viewBox="0 0 24 24"><path d="M13 2 4 14h6l-1 8 9-12h-6z"/></svg></div></button>
 <button class="rbtn" id="bSteady" aria-label="Steady"><div class="in"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="#fff1d6" stroke-width="2"/><circle cx="12" cy="12" r="4.5"/><rect x="11" y="0" width="2" height="5"/><rect x="11" y="19" width="2" height="5"/><rect x="0" y="11" width="5" height="2"/><rect x="19" y="11" width="5" height="2"/></svg><span>STEADY</span></div></button>
</div>
<div class="coinbox" id="coinbox"><i class="coin"></i><span id="coinv">0</span></div>
<button class="ibtn" id="bMute" aria-label="Sound"><svg viewBox="0 0 24 24" id="muteIc"></svg></button>

<div id="scrMain" class="screen">
 <div class="mcol">
  <button class="btn red big" id="bPlay">Play</button>
  <div class="mrow"><button class="btn" id="bArmory">Armory</button><button class="btn" id="bTrophies">Trophies</button></div>
  <button class="btn sm" id="bHow">How to play</button>
 </div>
 <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="scrModes" class="screen hidden"><div class="panel"><div class="ribbon">Choose Event</div><div class="pbody"><div class="modeg" id="modeGrid"></div></div><div class="pfoot"><button class="btn sm" data-back>‹ Back</button></div></div></div>
<div id="scrCareer" class="screen hidden"><div class="panel"><div class="ribbon">Career Ladder</div><div class="pbody"><div class="grid" id="tourGrid"></div></div><div class="pfoot"><button class="btn sm" data-back="modes">‹ Back</button></div></div></div>
<div id="scrChal" class="screen hidden"><div class="panel"><div class="ribbon">Skill Challenges</div><div class="pbody"><div class="grid" id="chalGrid"></div></div><div class="pfoot"><button class="btn sm" data-back="modes">‹ Back</button></div></div></div>
<div id="scrArmory" class="screen hidden"><div class="panel"><div class="ribbon">Armory</div><div class="pbody"><div class="tabs" id="armTabs"></div><div class="grid" id="armGrid"></div></div><div class="pfoot"><button class="btn sm" data-back>‹ Back</button></div></div></div>
<div id="scrTrophies" class="screen hidden"><div class="panel"><div class="ribbon" id="trTitle">Trophies</div><div class="pbody"><div class="grid" id="achGrid"></div></div><div class="pfoot"><button class="btn sm" data-back>‹ Back</button></div></div></div>
<div id="scrPause" class="screen hidden"><div class="panel"><div class="ribbon">Paused</div><div class="pbody" style="display:flex;flex-direction:column;align-items:center;gap:12px;padding-top:20px"><button class="btn red" id="bResume">Resume</button><button class="btn" id="bQuit">Quit to Menu</button></div></div></div>
<div id="scrRound" class="screen hidden"><div class="panel"><div class="ribbon" id="rdTitle">Round 1</div><div class="pbody"><table class="st" id="rdTable"></table></div><div class="pfoot"><button class="btn red" id="bNextRound">Next ›</button></div></div></div>
<div id="scrResult" class="screen hidden"><div class="panel"><div class="ribbon" id="rsRib">Results</div><div class="pbody" id="rsBody"></div><div class="pfoot" id="rsFoot"></div></div></div>

<div id="banner"></div>
<div id="tut" class="hidden"><div id="tutCap"></div></div>
<button class="btn sm hidden" id="tutSkip">Skip ›</button>
<div id="toast"><div class="md">★</div><div><b id="toastN"></b><span id="toastD"></span></div></div>
<script>
'use strict';
// ================= UTIL =================
const $=id=>document.getElementById(id);
const cv=$('c');let cx=cv.getContext('2d');
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const eoc=t=>1-Math.pow(1-t,3),eio=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eob=t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.random()*a.length|0];
const damp=(c,t,r,dt)=>c+(t-c)*(1-Math.exp(-r*dt));

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hoop Shot</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a2a5a;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS','Segoe UI',Verdana,system-ui,sans-serif;color:#fff}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center;padding:16px;box-sizing:border-box}
.ov.on{display:flex}
.dim{background:rgba(8,14,40,.72);backdrop-filter:blur(3px)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.84;transform:rotate(-5deg);animation:bob 2.2s ease-in-out infinite;margin-bottom:10px}
.logo span{font-weight:900;font-style:italic;font-size:min(15vw,17vh,140px);letter-spacing:.02em;background:linear-gradient(180deg,#fff8e0 0%,#ffcf4a 40%,#ff8a1a 70%,#e8461a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #7a2408) drop-shadow(0 8px 0 #2a0c04) drop-shadow(0 0 22px rgba(255,140,40,.55))}
.logo span.l2{background:linear-gradient(180deg,#ffffff 0%,#bfe8ff 45%,#4aa8ff 75%,#2a5ae8 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0c2a7a) drop-shadow(0 8px 0 #06123a) drop-shadow(0 0 22px rgba(80,160,255,.55))}
@keyframes bob{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(-3deg) translateY(-8px)}}
.btn{font:inherit;font-weight:900;color:#fff;border:0;border-radius:16px;padding:12px 26px;font-size:20px;cursor:pointer;background:linear-gradient(180deg,#ffa53a,#ee6a12);box-shadow:0 5px 0 #8a3204,0 8px 18px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3204}
.btn.big{font-size:24px;padding:12px 30px;min-width:170px}
.btn.bl{background:linear-gradient(180deg,#5ab8ff,#2a6aee);box-shadow:0 5px 0 #12348a,0 8px 18px rgba(0,0,0,.35)}
.btn.gn{background:linear-gradient(180deg,#7dffa0,#1eb85a);box-shadow:0 5px 0 #0c6a30,0 8px 18px rgba(0,0,0,.35)}
.btn.gy{background:linear-gradient(180deg,#6a7aa8,#3e4c80);box-shadow:0 5px 0 #1e2850}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{filter:grayscale(1);opacity:.5}
.btns{display:flex;flex-direction:column;gap:12px;align-items:center}
.hrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.hint{opacity:.8;font-size:14px;letter-spacing:.04em}
.corner{position:fixed;top:8px;right:8px;z-index:8;display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.3);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:24px;height:24px}
h2{margin:0;font-size:clamp(36px,8vw,60px);font-weight:900;font-style:italic;letter-spacing:.03em;background:linear-gradient(180deg,#fff,#ffcf4a 60%,#ff8a1a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #6a2408)}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;max-width:560px;width:100%}
.lvl{aspect-ratio:1;border-radius:14px;border:0;font:inherit;font-weight:900;font-size:20px;color:#fff;cursor:pointer;background:linear-gradient(180deg,#ffa53a,#ee6a12);box-shadow:0 4px 0 #8a3204;position:relative;padding:0}
.lvl.lock{background:#3a4470;box-shadow:0 4px 0 #1e2850;color:#fff5;cursor:default}
.lvl .st{position:absolute;bottom:2px;left:0;right:0;font-size:11px;color:#ffe27a;letter-spacing:-1px}
.top{position:fixed;top:10px;left:12px;z-index:7;display:flex;gap:8px}
.pill{background:rgba(0,0,0,.4);border-radius:20px;padding:6px 14px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc81a 50%,#c88a00);box-shadow:0 0 6px #ffcf3a}
.shop{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:560px;width:100%}
.item{border-radius:14px;background:rgba(255,255,255,.08);padding:8px 4px;cursor:pointer;font-weight:900;font-size:13px;box-shadow:0 0 0 2px rgba(255,255,255,.08) inset}
.item canvas{width:64px;height:64px;display:block;margin:0 auto 4px}
.item.sel{box-shadow:0 0 0 3px #7dffa0 inset,0 0 14px #7dffa066}
.item .pr{display:flex;align-items:center;justify-content:center;gap:4px;color:#ffe27a}
.tabs{display:flex;gap:8px}
.tab{font:inherit;font-weight:900;border:0;border-radius:12px;padding:8px 18px;background:#2a3460;color:#fff;cursor:pointer;font-size:16px}
.tab.sel{background:#ffcf4a;color:#3a1a04}
.bigstars{font-size:54px;letter-spacing:6px;color:#ffd45a;text-shadow:0 3px 0 #8a5a00,0 0 18px #ffd45a88}
.bigstars s{text-decoration:none;color:#ffffff22;text-shadow:none}
.res{display:flex;gap:14px;font-size:22px;font-weight:900;flex-wrap:wrap;justify-content:center}
.res div{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:8px 14px;border-radius:12px}
#levels,#shopO{justify-content:flex-start;overflow-y:auto;padding-top:64px}
</style></head><body>
<canvas id="c"></canvas>
<div class="corner"><button class="ib" id="bPause" style="display:none" aria-label="pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button><button class="ib" id="bMute" aria-label="mute"></button></div>

<div id="title" class="ov on">
 <div class="logo"><span>HOOP</span><span class="l2">SHOT</span></div>
 <div class="hrow"><button class="btn big" id="bCareer">CAREER</button><button class="btn big bl" id="bArcade">ARCADE</button><button class="btn big gn" id="bShop">SHOP</button></div>
 <div class="hint">Drag back · release to shoot</div>
</div>
<div id="levels" class="ov dim">
 <div class="top"><button class="btn sm gy" id="lBack">BACK</button><div class="pill"><span class="coin"></span><span class="cv">0</span></div></div>
 <h2>CAREER</h2><div class="grid" id="lgrid"></div>
</div>
<div id="shopO" class="ov dim">
 <div class="top"><button class="btn sm gy" id="sBack">BACK</button><div class="pill"><span class="coin"></span><span class="cv">0</span></div></div>
 <div class="tabs"><button class="tab sel" id="tBalls">BALLS</button><button class="tab" id="tCourts">COURTS</button></div>
 <div class="shop" id="sgrid"></div>
</div>
<div id="result" class="ov dim">
 <h2 id="rT">CLEAR!</h2>
 <div class="bigstars" id="rStars"></div>
 <div class="res" id="rRes"></div>
 <div class="hrow"><button class="btn gy" id="rMenu">MENU</button><button class="btn bl" id="rRetry">RETRY</button><button class="btn gn big" id="rNext">NEXT</button></div>
</div>
<div id="pause" class="ov dim">
 <h2>PAUSED</h2>
 <div class="btns"><button class="btn gn big" id="pRes">RESUME</button><button class="btn gy" id="pMenu">MENU</button></div>
</div>

<script>
'use strict';
const SLUG='hoop-shot';
const S={k:k=>'gamebop.'+SLUG+'.'+k,
 get(k,d){try{const v=localStorage.getItem(this.k(k));return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(this.k(k),JSON.stringify(v))}catch(e){}}};
const A={c:null,m:null,nb:null,muted:!!S.get('muted',false),
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.45;this.m.connect(this.c.destination)}catch(e){this.c=null}},
 mute(v){this.muted=v;S.set('muted',v);if(this.m)this.m.gain.value=v?0:.45;drawMute()},
 t(f,d,type,vol,slide,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+d+.03)}catch(e){}},
 n(d,vol,freq,delay,type,q){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0);if(!this.nb){const L=c.sampleRate*2;this.nb=c.createBuffer(1,L,c.sampleRate);const a=this.nb.getChannelData(0);for(let i=0;i<L;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||2000;if(q)f.Q.value=q;const g=c.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.linearRampToValueAtTime(vol||.2,t0+Math.min(.04,d*.2));g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+d+.03)}catch(e){}}};
const SFX={
 bounce(v){const k=Math.min(1,v/900);A.t(110,.12,'sine',.25*k+.05,.5);A.n(.06,.12*k,500)},
 rim(v){const k=Math.min(1,v/700);A.t(1250,.25,'triangle',.07*k+.03,.98);A.t(1870,.18,'sine',.04*k+.02,.99)},
 board(v){A.t(160,.12,'square',.08,.7);A.n(.1,.15,900)},
 swish(){A.n(.35,.35,3500,0,'bandpass',.8)},
 score(c){[659,880,1046].forEach((f,i)=>A.t(f*(1+Math.min(c,8)*.06),.12,'square',.07,1,i*.06))},
 cheer(){A.n(1.1,.18,1400,0,'bandpass',.5);A.n(.9,.1,2600,.1,'bandpass',.7)},
 shoot(){A.n(.08,.08,1200,0,'highpass');A.t(300,.08,'sine',.06,1.5)},
 buzz(){A.t(220,.6,'sawtooth',.12,1);A.t(225,.6,'sawtooth',.1,1)},
 click(){A.t(880,.05,'square',.06,1.3)},
 coin(){A.t(1400,.06,'square',.05,1.2);A.t(2100,.08,'square',.04,1,.05)},
 miss(){A.t(300,.25,'triangle',.08,.6)},
 tick(){A.t(1500,.03,'square',.04)}};

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- data ---------- */
const BALLS=[
 {id:'classic',cost:0,c:'#f07a22',l:'#2a1206'},
 {id:'street',cost:100,c:'#e8303a',l:'#fff',stripe:'#2a5ae8'},
 {id:'neon',cost:200,c:'#2aff9a',l:'#063a22',glow:1},
 {id:'beach',cost:300,c:'#fff',l:'#fff',panels:['#ff4a5a','#ffd23a','#3ac8ff']},
 {id:'gold',cost:500,c:'#ffcf3a',l:'#8a5a00',glow:1},
 {id:'lava',cost:800,c:'#3a0a04',l:'#ff7a1a',fire:1},
 {id:'galaxy',cost:1200,c:'#2a0a5a',l:'#bf7aff',stars:1},
 {id:'ice',cost:1600,c:'#bff0ff',l:'#3ab0ff',glow:1}];
const COURTS=[
 {id:'park',cost:0},{id:'gym',cost:150},{id:'beach',cost:300},{id:'neon',cost:600},{id:'space',cost:1000}];
const LV=[
 {d:[260],b:3,n:1},
 {d:[380],b:4,n:2},
 {d:[450],b:3,n:1,c:'bank'},
 {d:[420],b:5,n:3},
 {d:[350],b:3,n:1,c:'swish'},
 {d:[480],b:5,n:2,mv:{x:90,s:.6}},
 {d:[450],b:5,n:2,wind:1},
 {d:[700],b:5,n:2},
 {d:[300,400,500],b:6,n:3,c:'streak'},
 {d:[300,600],t:30,n:5},
 {d:[420],b:4,n:1,c:'wall',wall:1},
 {d:[550],b:5,n:2,blk:{x:-240,h:430,mv:110}},
 {d:[600],b:5,n:2,mv:{y:70,s:.8}},
 {d:[500],b:5,n:2,c:'swish',wind:2},
 {d:[850],b:6,n:2},
 {d:[450,550,650],b:6,n:3,mv:{x:120,s:.9}},
 {d:[420],b:4,n:2,c:'bank',wind:2},
 {d:[600],b:5,n:2,ceil:560},
 {d:[350,500,650,800],b:6,n:4,c:'streak'},
 {d:[400,700],t:35,n:7,mv:{x:80,s:.7}},
 {d:[520],b:5,n:2,c:'wall',wall:1,wind:1},
 {d:[700],b:6,n:3,blk:{x:-330,h:470,mv:150},mv:{x:60,s:.6}},
 {d:[1000],b:6,n:2,wind:1},
 {d:[500],b:5,n:3,c:'swish',mv:{x:100,s:1}},
 {d:[600],b:5,n:2,c:'bank',mv:{y:90,s:1}},
 {d:[450,650,850],t:40,n:8,wind:2},
 {d:[620],b:5,n:2,c:'wall',wall:1,blk:{x:260,h:460,mv:0}},
 {d:[1100],b:6,n:2,wind:2,mv:{x:60,s:.8}},
 {d:[400,550,700,850,1000],b:7,n:5,c:'streak',wind:1},
 {d:[600,900],b:8,n:4,c:'swish',mv:{x:140,s:1.2},wind:2}];
const CONDN={bank:'BANK SHOT',swish:'SWISH ONLY',wall:'OFF THE WALL',streak:'IN A ROW'};

let save=Object.assign({max:1,stars:[],coins:0,best:0,balls:['classic'],courts:['park'],ball:'classic',court:'park'},S.get('save',{}));
function persist(){S.set('save',save)}

/* ---------- canvas & camera ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR,portrait;
const cam={x:0,s:1,fy:0,tx:0,ts:1};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);portrait=W/H<1;frame_(true)}
function frame_(snap){if(!G)return;const m=portrait?80:170,x0=Math.min(G.sx,G.hx-60,G.wallX!=null?G.wallX:1e9)-m,x1=Math.max(G.sx,G.hx+60,G.wallX!=null?G.wallX:-1e9)+m;const w=Math.max(portrait?560:760,x1-x0);cam.ts=Math.min(W/w,H/(portrait?620:700));cam.tx=(x0+x1)/2;if(snap){cam.s=cam.ts;cam.x=cam.tx}}
function fy(){return H-(portrait?H*.2:Math.max(26,H*.07))}
const SX=x=>W/2+(x-cam.x)*cam.s, SY=y=>fy()-y*cam.s;
addEventListener('resize',resize);

/* ---------- game ---------- */
const GR=1500,BR=18,RIM=40,RIMY=300,BOARD=52;
let G=null,state='title',paused=false,balls=[],parts=[],floats=[],net=null,shake=0,T=0,drag=null,demoT=0,confetti=[];
function newGame(mode,lv){
 G={mode,lv,makes:0,shots:0,balls:0,streak:0,score:0,combo:0,time:0,timeMax:0,sx:-400,hx:0,hy:RIMY,hbx:0,hby:RIMY,side:1,wind:0,windT:0,ceil:null,blk:null,wallX:null,mv:null,cond:null,need:0,posI:0,over:false,coins:0,ready:0,fireT:0};
 if(mode==='career'){const L=LV[lv-1];G.need=L.n;G.balls=L.b||0;G.timeMax=L.t||0;G.time=L.t||0;G.cond=L.c||null;G.mv=L.mv||null;G.ceil=L.ceil||null;G.windLv=L.wind||0;
  if(L.wall){G.side=-1;G.wallX=L.d[0]+190}
  if(L.blk)G.blk={x:L.blk.x,h:L.blk.h,mv:L.blk.mv,y:0};
  G.dList=L.d}
 else if(mode==='arcade'){G.timeMax=60;G.time=60;G.dList=[300];G.windLv=0}
 else{G.dList=[420];G.windLv=0}
 balls=[];parts=[];floats=[];confetti=[];
 placeShooter(true);makeNet();resize();spawnBall();
}
function placeShooter(first){
 let d;if(G.mode==='arcade'||G.mode==='demo'){d=G.mode==='demo'?rnd(300,650):(G.makes===0&&first?320:rnd(260,Math.min(950,420+G.score*6)))}else d=G.dList[G.posI%G.dList.length];
 G.sx=G.side>0?G.hx-d:G.hx+d;
 if(G.windLv){G.wind=(Math.random()<.5?-1:1)*G.windLv*rnd(60,95)}else G.wind=0;
 frame_(first);
}
function makeNet(){const rows=6,cols=7,pts=[];for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const k=1-r/(rows-1)*.42,x=G.hbx+(c/(cols-1)-.5)*2*RIM*k,y=G.hby-r*15;pts.push({x,y,px:x,py:y,r,c,u:c/(cols-1)})}net={pts,rows,cols}}
function spawnBall(){if(G.mode==='career'&&G.balls<=0&&!G.timeMax)return;G.ready=1;balls.push({x:G.sx+G.side*14,y:190,vx:0,vy:0,held:true,a:0,va:0,touchedRim:0,touchedBoard:0,touchedWall:0,scored:0,t:0,rest:0,done:0,prevY:190,fire:G.combo>=3})}
function heldBall(){return balls.find(b=>b.held)}
function shoot(vx,vy){const b=heldBall();if(!b)return;b.held=false;b.vx=vx;b.vy=vy;b.va=-vx/BR*.4;G.shots++;if(G.mode==='career'&&!G.timeMax)G.balls--;SFX.shoot();shooterAnim=1;
 const delay=G.mode==='arcade'?.45:null;if(delay)setTimeout(()=>{if(G&&state==='play'&&!heldBall()&&G.time>0){placeShooter();spawnBall()}},delay*1000)}
let shooterAnim=0;
function rimPts(){return[{x:G.hbx-RIM,y:G.hby},{x:G.hbx+RIM,y:G.hby}]}
function boardSeg(){const x=G.hbx+G.side*BOARD;return{x,y0:G.hby-12,y1:G.hby+125}}
function collideCircle(b,px,py,pr,rest,kind){const dx=b.x-px,dy=b.y-py,d=Math.hypot(dx,dy),m=BR+pr;if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=px+nx*m;b.y=py+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+rest)*vn*nx;b.vy-=(1+rest)*vn*ny;b.vx*=.92;b.vy*=.96;b.va+=(b.vx*ny-b.vy*nx)*.01;return-vn}}return 0}
function updBall(b,dt){
 if(b.held){b.x=G.sx+G.side*14;b.y=190+Math.sin(T*3)*3;return}
 b.t+=dt;b.prevY=b.y;
 const steps=Math.ceil(Math.hypot(b.vx,b.vy)*dt/6)+1,h=dt/steps;
 for(let i=0;i<steps;i++){
  b.vy-=GR*h;b.vx+=G.wind*h;b.x+=b.vx*h;b.y+=b.vy*h;b.a+=b.va*h;
  // floor
  if(b.y<BR){b.y=BR;if(b.vy<-60)SFX.bounce(-b.vy);if(b.vy<0)b.vy=-b.vy*.68;b.vx*=.88;b.va=-b.vx/BR;if(Math.abs(b.vy)<40)b.vy=0}
  if(G.ceil&&b.y>G.ceil-BR){b.y=G.ceil-BR;if(b.vy>0){b.vy=-b.vy*.6;SFX.board()}}
  const wl=Math.min(G.sx,G.hx)-560,wr=G.wallX!=null?G.wallX:Math.max(G.sx,G.hx)+420;
  if(b.x>wr-BR){b.x=wr-BR;if(b.vx>0){b.vx=-b.vx*.7;b.touchedWall=1;SFX.board();burst(b.x+BR,b.y,'#fff',6)}}
  if(b.x<wl+BR){b.x=wl+BR;if(b.vx<0){b.vx=-b.vx*.7;b.touchedWall=1;SFX.board()}}
  // rim
  for(const p of rimPts()){const v=collideCircle(b,p.x,p.y,4,.55);if(v>30){b.touchedRim=1;SFX.rim(v);burst(p.x,p.y,'#ff8a3a',3)}}
  // board
  const B=boardSeg(),cy=clamp(b.y,B.y0,B.y1),dx=b.x-B.x,dy=b.y-cy,d=Math.hypot(dx,dy);

function drawBlocker(g){const k=G.blk,s=cam.s,x=SX(G.hx+k.x),top=SY(k.h+k.y),F=SY(0);g.fillStyle='#e8303a';rr(g,x-22*s,top,44*s,F-top,10*s);g.fill();g.fillStyle='#fff';rr(g,x-14*s,top+12*s,28*s,18*s,6*s);g.fill();g.fillStyle='#1a1030';g.fillRect(x-8*s,top+18*s,5*s,6*s);g.fillRect(x+3*s,top+18*s,5*s,6*s);g.strokeStyle='#ffd23a';g.lineWidth=4*s;for(let y=top+44*s;y<F-10;y+=30*s){g.beginPath();g.moveTo(x-22*s,y);g.lineTo(x+22*s,y+12*s);g.stroke()}}
function drawAim(g){
 const b=heldBall(),v=aimVel();if(!v)return;const n=G.mode==='career'?Math.max(5,13-Math.floor(G.lv/3)):11;
 for(let i=1;i<=n;i++){const t=i*.045,x=b.x+v[0]*t,y=b.y+v[1]*t-GR*t*t/2;g.fillStyle='rgba(255,255,255,'+(1-i/(n+1))+')';g.beginPath();g.arc(SX(x),SY(y),Math.max(2.5,6*cam.s)*(1-i/(n*1.6)),0,7);g.fill()}
 const p=Math.hypot(v[0],v[1])/1650;g.fillStyle='rgba(0,0,0,.4)';rr(g,SX(b.x)-30,SY(b.y)+BR*cam.s+12,60,8,4);g.fill();g.fillStyle=p>.85?'#ff4a3a':p>.55?'#ffd23a':'#7dff8a';rr(g,SX(b.x)-30,SY(b.y)+BR*cam.s+12,60*p,8,4);g.fill();
}
function drawHud(g){
 const sc=Math.max(.8,Math.min(1.2,W/900));g.save();g.font='italic 900 '+Math.round(24*sc)+'px Trebuchet MS,sans-serif';g.textBaseline='middle';
 let x=14,y=30;
 if(G.mode==='career'){
  g.fillStyle='rgba(0,0,0,.35)';rr(g,8,8,Math.min(W-120,300*sc),44*sc,22*sc);g.fill();
  g.textAlign='left';g.fillStyle='#fff';g.fillText(G.lv,x+4,8+22*sc);x+=g.measureText(''+G.lv).width+16;
  for(let i=0;i<G.need;i++){g.fillStyle=i<G.makes?'#7dff8a':'rgba(255,255,255,.25)';g.beginPath();g.arc(x+8*sc,8+22*sc,8*sc,0,7);g.fill();x+=20*sc}
  x+=8;if(G.timeMax){g.fillStyle=G.time<6?'#ff6a5a':'#fff';g.fillText(Math.ceil(G.time)+'s',x,8+22*sc)}else{const bs=BALLS.find(b=>b.id===save.ball);for(let i=0;i<G.balls;i++){drawBallSkin(g,bs,x+9*sc,8+22*sc,8*sc,0);x+=19*sc}}
  if(G.cond){g.font='italic 900 '+Math.round(18*sc)+'px Trebuchet MS,sans-serif';const t=CONDN[G.cond]+(G.cond==='streak'?'':''),w=g.measureText(t).width+24;g.fillStyle='#ffcf4a';rr(g,8,8+50*sc,w,30*sc,15*sc);g.fill();g.fillStyle='#3a1a04';g.textAlign='left';g.fillText(t,20,8+65*sc)}
 } else {
  g.fillStyle='rgba(0,0,0,.35)';rr(g,8,8,250*sc,44*sc,22*sc);g.fill();g.fillStyle=G.time<10?'#ff6a5a':'#fff';g.textAlign='left';g.fillText(Math.ceil(G.time)+'s',20,8+22*sc);
  g.fillStyle='#ffe27a';g.fillText('★ '+G.score,100*sc,8+22*sc);
  if(G.combo>=3){g.fillStyle='#ff8a3a';g.font='italic 900 '+Math.round(20*sc)+'px Trebuchet MS,sans-serif';g.fillText('x'+(1+Math.floor(G.combo/3)),190*sc,8+22*sc)}
  g.fillStyle='rgba(255,255,255,.5)';g.font='900 '+Math.round(13*sc)+'px Trebuchet MS,sans-serif';g.fillText('BEST '+save.best,20,8+58*sc);
 }

 if(heldBall()&&!drag&&G.shots===0&&G.mode!=='demo'){const b=heldBall();g.globalAlpha=.6+.4*Math.sin(T*5);g.strokeStyle='#fff';g.lineWidth=3;const hx=SX(b.x)-G.side*(30+((T*50)%40)),hy=SY(b.y)+30+((T*50)%40)*.6;g.beginPath();g.arc(hx,hy,12,0,7);g.stroke();g.globalAlpha=1}

/* ---------- loop ---------- */
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;if(!paused)update(dt);render();requestAnimationFrame(loop)}

/* ---------- input ---------- */
function aimVel(){if(!drag)return null;let dx=drag.x0-drag.x,dy=drag.y-drag.y0;const L=Math.hypot(dx,dy);if(L<8)return null;const k=Math.min(1650,L*7.2)/L;return[dx*k,dy*k]}
cv.addEventListener('pointerdown',e=>{A.init();if(state!=='play'||paused||!heldBall())return;drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(drag){drag.x=e.clientX;drag.y=e.clientY}});
addEventListener('pointerup',()=>{if(!drag)return;const v=aimVel();drag=null;if(v&&state==='play'&&!paused)shoot(v[0],v[1])});
addEventListener('pointercancel',()=>{drag=null});
addEventListener('keydown',e=>{A.init();if(e.code==='Escape'||e.code==='KeyP'){if(state==='play')setPause(!paused);e.preventDefault()}if(e.code==='KeyM')A.mute(!A.muted)});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!paused)setPause(true)});

/* ---------- UI ---------- */
function showOv(id){for(const o of['title','levels','shopO','result','pause'])$(o).classList.toggle('on',o===id);document.querySelectorAll('.cv').forEach(e=>e.textContent=save.coins)}
function drawMute(){$('bMute').innerHTML=A.muted?'<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'}
drawMute();
$('bMute').onclick=()=>{A.init();A.mute(!A.muted)};
$('bPause').onclick=()=>setPause(true);
function setPause(v){if(v&&state!=='play')return;paused=v;showOv(v?'pause':null)}
$('pRes').onclick=()=>{SFX.click();setPause(false)};
$('pMenu').onclick=()=>{SFX.click();paused=false;toTitle()};
function toTitle(){state='title';newGame('demo');$('bPause').style.display='none';showOv('title')}
function play(mode,lv){newGame(mode,lv);state='play';showOv(null);$('bPause').style.display='flex';if(mode==='career'){const L=LV[lv-1];floats.push({x:G.hx,y:G.hy+200,s:L.c?CONDN[L.c]:(L.t?L.n+' IN '+L.t+'s':'MAKE '+L.n),c:'#fff',t:-.3,big:1})}}
$('bCareer').onclick=()=>{A.init();SFX.click();if(save.max===1&&!save.stars.length)play('career',1);else openLevels()};
$('bArcade').onclick=()=>{A.init();SFX.click();play('arcade')};
$('bShop').onclick=()=>{A.init();SFX.click();openShop('balls')};
$('lBack').onclick=$('sBack').onclick=()=>{SFX.click();showOv('title')};
function openLevels(){showOv('levels');const gr=$('lgrid');gr.innerHTML='';for(let i=1;i<=30;i++){const b=document.createElement('button');b.className='lvl'+(i>save.max?' lock':'');b.textContent=i;const st=save.stars[i-1]||0;if(st){const s=document.createElement('div');s.className='st';s.textContent='★'.repeat(st);b.appendChild(s)}if(i<=save.max)b.onclick=()=>{SFX.click();play('career',i)};gr.appendChild(b)}}
let shopTab='balls';
$('tBalls').onclick=()=>openShop('balls');$('tCourts').onclick=()=>openShop('courts');
function openShop(tab){shopTab=tab;showOv('shopO');$('tBalls').classList.toggle('sel',tab==='balls');$('tCourts').classList.toggle('sel',tab==='courts');const gr=$('sgrid');gr.innerHTML='';
 const list=tab==='balls'?BALLS:COURTS,own=tab==='balls'?save.balls:save.courts,cur=tab==='balls'?save.ball:save.court;
 list.forEach(it=>{const d=document.createElement('div');d.className='item'+(cur===it.id?' sel':'');const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');
  if(tab==='balls')drawBallSkin(g,it,64,64,40,.4);else courtThumb(g,it.id);d.appendChild(c);
  const p=document.createElement('div');p.className='pr';if(own.includes(it.id))p.textContent=cur===it.id?'✔':'';else{p.innerHTML='<span class="coin"></span>'+it.cost;if(save.coins<it.cost)p.style.color='#f88'}d.appendChild(p);
  d.onclick=()=>{if(own.includes(it.id)){if(tab==='balls')save.ball=it.id;else save.court=it.id;SFX.click()}else if(save.coins>=it.cost){save.coins-=it.cost;own.push(it.id);if(tab==='balls')save.ball=it.id;else save.court=it.id;SFX.coin()}else{SFX.miss();return}persist();openShop(tab)};gr.appendChild(d)})}
function courtThumb(g,id){const sv=save.court,sg={W,H,cam:{...cam}};save.court=id;const oW=W,oH=H,oc={...cam};W=128;H=128;cam.x=0;cam.s=.2;const OG=G;G=null;g.save();g.beginPath();g.arc(64,64,60,0,7);g.clip();const o=ctx;drawCourtOn(g);g.restore();G=OG;W=oW;H=oH;Object.assign(cam,oc);save.court=sv}
function drawCourtOn(g){const sp=portrait;portrait=false;drawCourt(g);portrait=sp}
function showResult(t,stars,items,ok){
 $('rT').textContent=t;$('rStars').style.display=stars>=0?'':'none';$('rStars').innerHTML='★'.repeat(Math.max(0,stars))+'<s>'+'★'.repeat(3-Math.max(0,stars))+'</s>';
 $('rRes').innerHTML=items.map(([k,v])=>k==='coin'?'<div><span class="coin"></span>+'+v+'</div>':'<div>'+v+'</div>').join('');

 showOv('result');$('bPause').style.display='none'}
$('rMenu').onclick=()=>{SFX.click();if(G.mode==='career'){toTitle();openLevels()}else toTitle()};

$('rNext').onclick=()=>{SFX.click();play('career',G.lv+1)};

window.__hs={G:()=>G,state:()=>state,save:()=>save,play:(m,l)=>play(m,l),shootAt:(err)=>{const b=heldBall();if(!b)return false;const v=solveShot(b.x,b.y,err||0);if(v)shoot(v[0],v[1]);return!!v},held:()=>!!heldBall()};

requestAnimationFrame(loop);
</script></body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<body><canvas id="c"></canvas>
<script>
'use strict';
const SLUG='farm-loop',KP='gamebop.'+SLUG+'.';
const store={get(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}};
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const P={ink:'#4a3424',cream:'#fff8e8',soil:'#9a6640',soilD:'#6e4529',wet:'#5e3a22',wetD:'#432716',wood:'#c98a52',woodD:'#8e5a30',sky:'#bfe8ff',coin:'#ffcf3a',xp:'#6cc7ff',red:'#e8584a',leaf:'#4fae3c',leafD:'#2f7d27'};
// seasons: 0 spring 1 summer 2 autumn 3 winter
const SEASON_LEN=180;
const SEASONS=[{g1:'#9fdc6a',g2:'#86c955',acc:'#ffb3d1'},{g1:'#a9d957',g2:'#8fc343',acc:'#ffd84a'},{g1:'#c9c25a',g2:'#b3a748',acc:'#f08a3a'},{g1:'#dfeef2',g2:'#c9dde3',acc:'#ffffff'}];
// crops: id, seasons mask, grow s, seed cost, sell, xp, level, leaf colour
const CROPS=[
 {id:'wheat',m:7,t:30,c:2,p:5,xp:1,lv:1},{id:'carrot',m:13,t:45,c:4,p:9,xp:2,lv:1},{id:'straw',m:3,t:90,c:8,p:20,xp:3,lv:2},
 {id:'corn',m:6,t:120,c:10,p:26,xp:4,lv:3},{id:'tomato',m:2,t:150,c:14,p:34,xp:5,lv:4},{id:'potato',m:13,t:120,c:9,p:24,xp:4,lv:5},
 {id:'pumpkin',m:4,t:300,c:25,p:75,xp:9,lv:6},{id:'cabbage',m:9,t:200,c:16,p:46,xp:6,lv:7},{id:'sunflower',m:2,t:240,c:20,p:58,xp:7,lv:8},
 {id:'grape',m:6,t:360,c:34,p:100,xp:11,lv:10},{id:'eggplant',m:6,t:280,c:28,p:80,xp:9,lv:12},{id:'cranberry',m:12,t:420,c:40,p:125,xp:13,lv:14}];
const CROP={};CROPS.forEach(c=>CROP[c.id]=c);
const GOODS={flour:22,bread:70,pie:230,egg:14,milk:30,cheese:95,oil:95,juice:300,jam:90,yogurt:80};
function price(id){const base=CROP[id]?CROP[id].p:GOODS[id];return Math.round(base*(1+0.06*up('cart'))*(G.demand===id?2:1))}
const BUILD=[
 {id:'market',lv:1,cost:0},{id:'shed',lv:1,cost:0},
 {id:'mill',lv:2,cost:80,rec:[{in:{wheat:3},out:'flour',t:25,lv:2},{in:{sunflower:3},out:'oil',t:70,lv:9}]},
 {id:'coop',lv:3,cost:150,animal:'chicken',feed:'wheat',out:'egg',t:40,max:4,acost:60},
 {id:'bakery',lv:5,cost:300,rec:[{in:{flour:2,egg:1},out:'bread',t:60,lv:5},{in:{flour:1,pumpkin:1,egg:2},out:'pie',t:120,lv:8}]},
 {id:'barn',lv:6,cost:450,animal:'cow',feed:'corn',out:'milk',t:90,max:3,acost:180},
 {id:'dairy',lv:7,cost:500,rec:[{in:{milk:2},out:'cheese',t:90,lv:7},{in:{milk:1,straw:2},out:'yogurt',t:60,lv:9}]},
 {id:'press',lv:10,cost:900,rec:[{in:{straw:3},out:'jam',t:60,lv:10},{in:{grape:4},out:'juice',t:100,lv:11}]}];
const BLD={};BUILD.forEach(b=>BLD[b.id]=b);
const UPS=[{k:'fert',max:5,base:120},{k:'sprk',max:5,base:200},{k:'cart',max:5,base:150},{k:'hand',max:4,base:300}];
const MAXPLOTS=24;
function plotCost(n){return Math.round(40*Math.pow(1.38,n-6))}
function plotLv(n){return n<9?1:n<12?3:n<16?6:n<20?9:12}
function xpNeed(L){return Math.round(18*Math.pow(L,1.55))}
// ---------- state ----------
function defState(){return{coins:30,xp:0,lvl:1,plots:Array.from({length:MAXPLOTS},(_,i)=>({open:i<6,crop:null,g:0,wet:0})),inv:{},bld:{market:1,shed:1},jobs:{},animals:{},aT:{},ups:{fert:0,sprk:0,cart:0,hand:0},season:0,sT:0,demand:'carrot',last:Date.now(),sel:'wheat',started:false,stats:{harv:0}}}
let G=defState();
(()=>{const s=store.get('save',null);if(s&&typeof s==='object'&&Array.isArray(s.plots)){G=Object.assign(defState(),s);G.ups=Object.assign(defState().ups,s.ups||{})}})();
const hadSave=!!store.get('save',null)&&G.started;
let muted=!!store.get('muted',false);
function save(){G.last=Date.now();store.set('save',G)}
function up(k){return G.ups[k]||0}
function inv(id){return G.inv[id]||0}
function addInv(id,n){G.inv[id]=inv(id)+n;if(G.inv[id]<=0)delete G.inv[id]}
// ---------- audio ----------
let AC=null,master=null;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination)}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,slide,delay){if(muted||!AC)return;try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.1,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03)}catch(e){}}
let sl={};function lim(k,ms){const n=performance.now();if(sl[k]&&n-sl[k]<ms)return false;sl[k]=n;return true}
const SFX={plant(){if(lim('p',50))tone(330,0.08,'triangle',0.12,1.4)},water(){if(lim('w',50)){tone(900,0.1,'sine',0.06,0.5);tone(1300,0.06,'sine',0.04,0.6,0.03)}},harvest(){if(lim('h',40)){tone(523,0.07,'triangle',0.12,1.5);tone(784,0.1,'triangle',0.08,1,0.05)}},
 coin(){if(lim('c',40)){tone(1319,0.06,'square',0.04);tone(1760,0.12,'square',0.04,1,0.05)}},bad(){tone(160,0.12,'square',0.05,0.8)},click(){tone(800,0.04,'triangle',0.06)},
 level(){[523,659,784,1047,1319].forEach((f,i)=>tone(f,0.25,'triangle',0.1,1,i*0.09))},buy(){[523,784,1047].forEach((f,i)=>tone(f,0.1,'triangle',0.09,1,i*0.06))},cluck(){tone(700,0.05,'square',0.03,1.6);tone(900,0.06,'square',0.03,0.8,0.06)},moo(){tone(140,0.5,'sawtooth',0.04,0.8)},done(){tone(988,0.1,'sine',0.08);tone(1318,0.15,'sine',0.07,1,0.08)}};
// ---------- canvas ----------
const cv=document.getElementById('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1,L={};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(200,innerWidth);H=Math.max(200,innerHeight);cv.width=W*DPR|0;cv.height=H*DPR|0;layout();icache={}}
function layout(){const hud=58;L.hud=hud;L.land=W>H*1.1;const sb=Math.min(84,Math.max(64,H*0.11));L.sbH=sb;
 if(L.land){const fw=W*0.6;const cs=Math.floor(Math.min((fw-30)/6,(H-hud-sb-30)/4));L.cs=cs;L.fx=(fw-cs*6)/2+6;L.fy=hud+10+(H-hud-sb-24-cs*4)/2;
  L.bArea={x:fw+6,y:hud+8,w:W-fw-16,h:H-hud-20};L.seed={x:L.fx-6,y:H-sb-8,w:cs*6+12,h:sb}}
 else{const cs=Math.floor(Math.min((W-24)/6,(H-hud-sb)*0.42/4));L.cs=cs;L.fx=(W-cs*6)/2;L.fy=hud+10;const by=L.fy+cs*4+16;L.bArea={x:10,y:by,w:W-20,h:H-sb-16-by};L.seed={x:8,y:H-sb-8,w:W-16,h:sb}}
 const cols=L.land&&L.bArea.w<L.bArea.h*0.9?2:4,rows=Math.ceil(BUILD.length/cols);const bw=L.bArea.w/cols,bh=Math.min(L.bArea.h/rows,bw*1.05);L.bslots=BUILD.map((b,i)=>({x:L.bArea.x+(i%cols)*bw,y:L.bArea.y+Math.floor(i/cols)*bh+(L.bArea.h-bh*rows)/2,w:bw,h:bh}));L.basket=[L.bslots[0].x+L.bslots[0].w/2,L.bslots[0].y+L.bslots[0].h*0.4];L.coinPos=[80,28]}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function txt(s,x,y,size,col,align,stroke){const g=cx;g.font='bold '+size+'px '+FONT;g.textAlign=align||'center';g.textBaseline='middle';if(stroke){g.lineJoin='round';g.lineWidth=stroke;g.strokeStyle=typeof stroke==='string'?stroke:P.ink;g.strokeText(s,x,y)}g.fillStyle=col||P.ink;g.fillText(s,x,y)}
function circ(g,x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function ell(g,x,y,rx,ry,c,rot){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,rot||0,0,7);g.fill()}
function coinIcon(g,x,y,r){circ(g,x,y+r*0.15,r,'#d99a10');circ(g,x,y,r,P.coin);g.strokeStyle='#e8a817';g.lineWidth=r*0.18;g.beginPath();g.arc(x,y,r*0.6,0,7);g.stroke();circ(g,x-r*0.35,y-r*0.35,r*0.16,'rgba(255,255,255,.7)')}
function starPath(g,x,y,r){g.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2?r*0.46:r;g.lineTo(x+Math.cos(a)*rad,y+Math.sin(a)*rad)}g.closePath()}
// ---------- item icons (100-unit box) ----------
function drawItem(g,id){g.lineJoin='round';g.lineCap='round';
 const shine=(x,y,r)=>ell(g,x,y,r,r*0.6,'rgba(255,255,255,.5)',-0.6);
 switch(id){
 case 'wheat':for(let s=-1;s<=1;s++){g.save();g.rotate(s*0.28);g.strokeStyle='#c99a2e';g.lineWidth=4;g.beginPath();g.moveTo(0,40);g.lineTo(0,-10);g.stroke();for(let k=0;k<5;k++){ell(g,-6,-6-k*8,5,8,'#f2c84b',-0.5);ell(g,6,-6-k*8,5,8,'#f2c84b',0.5)}ell(g,0,-44,4,8,'#f2c84b');g.restore()}break;
 case 'carrot':g.fillStyle='#ff8a2a';g.beginPath();g.moveTo(-16,-18);g.quadraticCurveTo(0,-26,16,-18);g.lineTo(2,42);g.quadraticCurveTo(0,46,-2,42);g.closePath();g.fill();g.strokeStyle='#d9661a';g.lineWidth=3;[[-10,-6,4],[8,4,-4],[-6,16,4]].forEach(q=>{g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(q[0]+q[2]*2,q[1]+2);g.stroke()});[[-10,-1],[0,0],[10,1]].forEach(q=>ell(g,q[0]*0.8,-30,5,16,P.leaf,q[0]*0.04));shine(-6,-10,4);break;
 case 'straw':g.fillStyle='#e8384a';g.beginPath();g.moveTo(0,40);g.bezierCurveTo(-40,10,-34,-26,0,-20);g.bezierCurveTo(34,-26,40,10,0,40);g.fill();g.fillStyle='#ffe58a';[[-12,-6],[8,-8],[-2,6],[14,6],[-14,12],[4,22],[-4,-12]].forEach(p=>ell(g,p[0],p[1],1.8,2.8,'#ffe58a'));g.fillStyle=P.leaf;for(let i=0;i<5;i++){g.save();g.translate(0,-22);g.rotate(-1.2+i*0.6);ell(g,0,-8,5,10,P.leaf);g.restore()}shine(-14,-8,5);break;
 case 'corn':g.save();g.rotate(0.35);ell(g,0,4,16,38,'#f7d33c');g.fillStyle='#e0b322';for(let y=-28;y<36;y+=8)for(let x=-10;x<=10;x+=7)ell(g,x,y,2.6,3,'#e8bd2a');g.fillStyle=P.leaf;g.beginPath();g.moveTo(-4,40);g.quadraticCurveTo(-30,10,-20,-30);g.quadraticCurveTo(-12,6,4,40);g.fill();g.beginPath();g.moveTo(4,40);g.quadraticCurveTo(30,10,22,-24);g.quadraticCurveTo(12,6,-4,40);g.fill();g.restore();break;
 case 'tomato':circ(g,0,6,32,'#e8483a');ell(g,-10,6,10,26,'rgba(0,0,0,.06)');g.fillStyle=P.leaf;for(let i=0;i<5;i++){g.save();g.translate(0,-22);g.rotate(i*1.256);ell(g,0,-8,4,10,P.leaf);g.restore()}circ(g,0,-24,4,P.leafD);shine(-12,-6,7);break;
 case 'potato':g.fillStyle='#c99a5e';g.beginPath();g.ellipse(0,4,36,26,0.3,0,7);g.fill();[[-14,-4],[10,8],[2,-12],[18,-6]].forEach(p=>circ(g,p[0],p[1],2.6,'#8e6a3c'));shine(-14,-8,8);break;
 case 'pumpkin':[[-20,4,18,26],[20,4,18,26],[0,4,20,30]].forEach(q=>{ell(g,q[0],q[1],q[2],q[3],'#ff9a2e');g.strokeStyle='#e07a14';g.lineWidth=2.5;g.beginPath();g.ellipse(q[0],q[1],q[2],q[3],0,0,7);g.stroke()});g.fillStyle='#6e8a2a';rr(g,-4,-36,8,14,3);g.fill();g.strokeStyle=P.leaf;g.lineWidth=3;g.beginPath();g.moveTo(4,-30);g.quadraticCurveTo(16,-40,20,-28);g.stroke();shine(-6,-12,6);break;
 case 'cabbage':circ(g,0,4,34,'#7cc95a');circ(g,0,4,26,'#a3dd7a');circ(g,0,4,16,'#c7ee9e');g.strokeStyle='#5aa83c';g.lineWidth=2.5;for(let i=0;i<5;i++){g.beginPath();g.moveTo(0,4);g.lineTo(Math.cos(i*1.256)*30,4+Math.sin(i*1.256)*30);g.stroke()}break;
 case 'sunflower':g.strokeStyle=P.leafD;g.lineWidth=5;g.beginPath();g.moveTo(0,10);g.lineTo(0,46);g.stroke();for(let i=0;i<12;i++){g.save();g.translate(0,-6);g.rotate(i*0.524);ell(g,0,-24,7,13,'#ffd23a');g.restore()}circ(g,0,-6,16,'#7a4a22');for(let i=0;i<8;i++)circ(g,Math.cos(i)*8,-6+Math.sin(i)*8,2,'#5a3416');break;
 case 'grape':g.fillStyle=P.leaf;g.beginPath();g.moveTo(0,-30);g.quadraticCurveTo(26,-46,30,-26);g.quadraticCurveTo(14,-26,0,-30);g.fill();[[-14,-14],[0,-16],[14,-14],[-8,-2],[8,-2],[0,10],[-14,8],[14,8],[0,24],[-7,14],[7,14]].forEach(p=>{circ(g,p[0],p[1],9,'#8b4fc4');circ(g,p[0]-3,p[1]-3,2.5,'rgba(255,255,255,.5)')});break;
 case 'eggplant':g.save();g.rotate(-0.5);ell(g,0,8,20,32,'#7a3ca8');shine(-8,0,5);g.fillStyle=P.leaf;g.beginPath();g.moveTo(-16,-18);g.quadraticCurveTo(0,-34,16,-18);g.quadraticCurveTo(0,-14,-16,-18);g.fill();rr(g,-3,-40,6,14,3);g.fill();g.restore();break;
 case 'cranberry':g.fillStyle=P.leafD;g.lineWidth=3;g.strokeStyle=P.leafD;g.beginPath();g.moveTo(0,-36);g.lineTo(-14,-6);g.moveTo(0,-36);g.lineTo(14,-2);g.moveTo(0,-36);g.lineTo(0,8);g.stroke();[[-16,-2],[14,2],[0,12],[-10,22],[12,24],[0,-6],[-22,14],[24,14]].forEach(p=>{circ(g,p[0],p[1],8,'#c41e3a');circ(g,p[0]-2.5,p[1]-2.5,2,'rgba(255,255,255,.6)')});break;

 case 'bread':ell(g,0,10,40,24,'#b8702e');ell(g,0,4,38,22,'#d99248');g.strokeStyle='#f5c27a';g.lineWidth=4;for(let i=-1;i<=1;i++){g.beginPath();g.moveTo(i*16-6,-6);g.lineTo(i*16+6,10);g.stroke()}shine(-18,-4,7);break;
 case 'pie':ell(g,0,14,42,18,'#d7e7f2');ell(g,0,8,38,18,'#c47a35');ell(g,0,4,32,14,'#ff9a2e');g.strokeStyle='#e8b060';g.lineWidth=5;for(let i=-2;i<=2;i++){g.beginPath();g.moveTo(i*12-8,-8);g.lineTo(i*12+8,16);g.stroke()}break;

 case 'cheese':g.fillStyle='#ffd23a';g.beginPath();g.moveTo(-36,20);g.lineTo(36,20);g.lineTo(36,-6);g.lineTo(-30,-22);g.closePath();g.fill();g.fillStyle='#ffe57a';g.beginPath();g.moveTo(-36,20);g.lineTo(-30,-22);g.lineTo(36,-6);g.lineTo(36,-2);g.lineTo(-30,-16);g.closePath();g.fill();[[-14,8,5],[10,4,7],[24,12,3.5],[-24,14,3]].forEach(p=>circ(g,p[0],p[1],p[2],'#e5b014'));break;

 }}

function plotSpeed(p){const c=CROP[p.crop];let s=(p.wet>0?1:0.4)*(1+0.12*up('fert'));if(!(c.m&(1<<G.season)))s*=0.25;return s}
function simStep(dt,report){
 G.sT+=dt;while(G.sT>=SEASON_LEN){G.sT-=SEASON_LEN;G.season=(G.season+1)%4;newDemand();if(!report)seasonChanged()}
 G.plots.forEach(p=>{if(!p.open||!p.crop)return;if(p.g<1){p.g=Math.min(1,p.g+dt/CROP[p.crop].t*plotSpeed(p))}if(p.wet>0)p.wet=Math.max(0,p.wet-dt)});
 // sprinkler
 const sp=up('sprk');if(sp){G.spT=(G.spT||0)+dt;const iv=Math.max(2,14-sp*2.4);while(G.spT>=iv){G.spT-=iv;let n=sp;for(const p of G.plots){if(n<=0)break;if(p.open&&p.crop&&p.g<1&&p.wet<=0){p.wet=WET_T;n--;if(!report)splash(p)}}}}
 // animals
 ['coop','barn'].forEach(id=>{const b=BLD[id];const n=G.animals[id]||0;if(!G.bld[id]||!n)return;G.aT[id]=(G.aT[id]||0)+dt*n;while(G.aT[id]>=b.t){if(inv(b.feed)<=0){G.aT[id]=Math.min(G.aT[id],b.t);break}G.aT[id]-=b.t;addInv(b.feed,-1);addInv(b.out,1);if(report)report[b.out]=(report[b.out]||0)+1;else{popFrom(id,b.out);id==='coop'?SFX.cluck():SFX.moo()}}});
 // processors
 BUILD.forEach(b=>{if(!b.rec||!G.bld[b.id])return;const q=G.jobs[b.id];if(!q||!q.length)return;let left=dt;while(left>0&&q.length){const j=q[0];const r=b.rec[j.r];const need=r.t-j.p;if(left>=need){left-=need;q.shift();addInv(r.out,1);addXP(2,!!report);if(report)report[r.out]=(report[r.out]||0)+1;else{popFrom(b.id,r.out);SFX.done()}}else{j.p+=left;left=0}}});
}
const WET_T=150;
function newDemand(){const opts=CROPS.filter(c=>c.lv<=G.lvl).map(c=>c.id).concat(Object.keys(GOODS).filter(k=>inv(k)>0||G.lvl>=6));G.demand=opts[Math.floor(Math.random()*opts.length)]}
function seasonChanged(){toast={kind:'season',life:2.4};if(!(CROP[G.sel].m&(1<<G.season))){const c=CROPS.find(c=>c.lv<=G.lvl&&(c.m&(1<<G.season)));if(c)G.sel=c.id}}
function addXP(n,quiet){G.xp+=n;while(G.xp>=xpNeed(G.lvl)){G.xp-=xpNeed(G.lvl);G.lvl++;const bonus=20*G.lvl;G.coins+=bonus;if(!quiet){SFX.level();lvlUp={life:3,lv:G.lvl,bonus};confetti()}}}
function offline(){const el=Math.max(0,(Date.now()-(G.last||Date.now()))/1000);const cap=7200*(1+up('hand'));const t=Math.min(el,cap);if(t<20)return;const rep={};let left=t;while(left>0){const s=Math.min(2,left);simStep(s,rep);left-=s}
 const ready=G.plots.filter(p=>p.crop&&p.g>=1).length;welcome={t,rep,ready,life:999}}

function plotAction(i,mode){const p=G.plots[i];const [x,y]=plotCenter(i);
 if(!p.open)return null;

function queueJob(bid,ri){const b=BLD[bid],r=b.rec[ri];if(r.lv>G.lvl){SFX.bad();return}const q=G.jobs[bid]||(G.jobs[bid]=[]);if(q.length>=3){SFX.bad();return}for(const k in r.in)if(inv(k)<r.in[k]){SFX.bad();return}for(const k in r.in)addInv(k,-r.in[k]);q.push({r:ri,p:0});SFX.click();save()}

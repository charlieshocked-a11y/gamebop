<script>
'use strict';
const SLUG='farm-loop',KP='gamebop.'+SLUG+'.',BOARD='farm-loop';
const store={get(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}};
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
const P={ink:'#4a3424',cream:'#fff8e8',soil:'#9a6640',soilD:'#6e4529',wet:'#5e3a22',wetD:'#432716',wood:'#c98a52',woodD:'#8e5a30',sky:'#bfe8ff',coin:'#ffcf3a',xp:'#6cc7ff',red:'#e8584a',leaf:'#4fae3c',leafD:'#2f7d27'};
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3),easeBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
// ---------- crops ----------
const CROPS={wheat:{v:2,t:2.6},carrot:{v:3,t:3.3},tomato:{v:4,t:4},pumpkin:{v:9,t:5.2,hp:3},corn:{v:4,t:3.6},grape:{v:3,t:3.4,chain:1},cabbage:{v:6,t:4.8,hp:2},cranberry:{v:5,t:4.2},sunflower:{v:5,t:4.4},potato:{v:3,t:3.2},straw:{v:4,t:3.8},eggplant:{v:5,t:4.4}};
const SEASON_CROPS=[['wheat','carrot','straw','potato'],['tomato','corn','sunflower','eggplant'],['pumpkin','corn','grape','cabbage'],['cabbage','cranberry','potato','carrot']];
const SEASONS=[{g1:'#a6e070',g2:'#7cc04e',sky1:'#9fdcff',sky2:'#e6f8ff',hill:'#8fd05c',hill2:'#6fb545',acc:'#ffb3d1',tree:'#5fb04a'},
 {g1:'#b2db5c',g2:'#86bb3f',sky1:'#7fd0ff',sky2:'#fff4cf',hill:'#9ccc4a',hill2:'#7bb23a',acc:'#ffd84a',tree:'#4f9a3a'},
 {g1:'#d4c45e',g2:'#b89c44',sky1:'#ffc38a',sky2:'#ffeccc',hill:'#d0a648',hill2:'#b5833a',acc:'#f08a3a',tree:'#e07a2a'},
 {g1:'#e6f2f5',g2:'#c5dce4',sky1:'#b7cfe8',sky2:'#eef6ff',hill:'#f4fbff',hill2:'#d8e8f0',acc:'#ffffff',tree:'#6a9a8a'}];
// ---------- days ----------
// k: thing introduced. crow/mole/weed/bee: spawn strength. boss: raccoon|crowking|moleking|gang
const DAYS=[
 {crops:['wheat'],len:40,new:{k:'swipe',n:'Swipe!'}},
 {crops:['wheat','carrot'],new:{k:'carrot',n:'Carrots'}},
 {crops:['wheat','carrot'],crow:1,new:{k:'crow',n:'Crows!'}},
 {crops:['wheat','carrot','potato'],crow:1,gold:1,new:{k:'gold',n:'Golden crops'}},
 {crops:['wheat','carrot','potato'],crow:.5,boss:'raccoon',new:{k:'raccoon',n:'BOSS: Rascal'}},
 {crops:['tomato','corn','pumpkin'],crow:.8,new:{k:'pumpkin',n:'Pumpkins'}},
 {crops:['tomato','corn','pumpkin'],mole:1,new:{k:'mole',n:'Moles!'}},
 {crops:['tomato','corn','sunflower'],weather:'rain',len:45,new:{k:'rain',n:'Rain day!'}},
 {crops:['tomato','corn','eggplant'],weed:1,crow:.6,new:{k:'weed',n:'Weeds'}},
 {crops:['tomato','corn','pumpkin'],boss:'crowking',new:{k:'crowking',n:'BOSS: Crow King'}},
 {crops:['pumpkin','corn','grape'],bee:1,new:{k:'bee',n:'Bees! Don’t cut'}},
 {crops:['pumpkin','grape','cabbage'],crow:1,mole:1,new:{k:'mix',n:'Crows + Moles'}},
 {crops:['grape','corn','cabbage'],weather:'heat',crow:.7,new:{k:'heat',n:'Heat wave'}},
 {crops:['pumpkin','grape','cabbage'],weather:'night',mole:.8,new:{k:'night',n:'Night harvest'}},
 {crops:['pumpkin','grape','corn'],boss:'moleking',new:{k:'moleking',n:'BOSS: Mole King'}},
 {crops:['cabbage','cranberry','potato'],weather:'snow',new:{k:'snow',n:'Frosty crops'}},
 {crops:['cabbage','cranberry','carrot'],weather:'snow',bee:1,weed:1,new:{k:'mix',n:'Bees + Weeds'}},
 {crops:['cranberry','cabbage','potato'],weather:'snow',crow:1.2,mole:.8,new:{k:'mix',n:'Hungry winter'}},
 {crops:['cranberry','cabbage','carrot'],weather:'night',bee:1,crow:1,new:{k:'mix',n:'Night bees'}},
 {crops:['cabbage','cranberry','potato'],weather:'snow',boss:'gang',new:{k:'gang',n:'BOSS: Raccoon Gang'}}];
const BOSSES=['raccoon','crowking','moleking','gang'];
function potential(c,withUps){const cr=c.crops;let t=0,v=0;cr.forEach(k=>{const C=CROPS[k];t+=C.t*(1+0.25*((C.hp||1)-1))*(c.weather==='snow'?1.2:1);v+=C.v});t/=cr.length;v/=cr.length;
 const wm=(c.weather==='rain'?2.2:c.weather==='heat'?1.2:1)*(withUps?1+0.07*up('grow'):1);const N=(withUps?fieldN():15)*soilFrac(c.n);const len=55+(withUps?up('sun')*2:0);const pm=withUps?1+0.1*up('price'):1;
 return N*len/(t/wm+0.25)*v*pm*1.9}
function goalFor(c){const d=c.n-1;const base=potential(c,false),pu=potential(c,true);let f=Math.min(3.2,0.45+0.07*d+0.0012*d*d);
 let mod=1;if(c.weather==='snow')mod*=0.72;if(c.crops.includes('pumpkin'))mod*=0.85;if(c.crow)mod*=1-0.06*Math.min(1.5,c.crow);if(c.mole)mod*=1-0.06*Math.min(1.5,c.mole);if(c.weed)mod*=0.92;if(c.bee)mod*=0.9;if(c.weather==='night')mod*=0.9;if(c.weather==='heat')mod*=0.9;
 const len=c.n===1?40/55:(c.len0||55)/55;
 return Math.max(20,Math.round(f*base*Math.sqrt(pu/base)*mod*len/5)*5)}
function dayCfg(n){let c;const d=n-1;
 if(n<=DAYS.length)c=Object.assign({},DAYS[n-1]);
 else{let s=n*9301+49297;const r=()=>{s=(s*9301+49297)%233280;return s/233280};const se=Math.floor((n-1)/5)%4;
  const pool=SEASON_CROPS[se].slice();c={crops:[]};while(c.crops.length<3){const k=pool.splice(Math.floor(r()*pool.length),1)[0];c.crops.push(k)}
  const sc=1+(n-20)*0.04;const th=['crow','mole','weed','bee'];const pick=[];while(pick.length<2+(r()<.4?1:0)){const t=th[Math.floor(r()*4)];if(!pick.includes(t))pick.push(t)}
  pick.forEach(t=>c[t]=(0.8+r()*0.5)*sc);
  if(n%5===0){c.boss=BOSSES[(n/5-1)%4];}
  const wr=r();c.weather=se===3?'snow':wr<.2?'rain':wr<.35?'night':wr<.48&&se===1?'heat':null;
  c.new={k:c.boss||'mix',n:c.boss?'BOSS: '+{raccoon:'Rascal',crowking:'Crow King',moleking:'Mole King',gang:'Raccoon Gang'}[c.boss]:'Day '+n+' mix'}}
 c.n=n;c.season=Math.floor((n-1)/5)%4;c.len0=c.len||55;c.len=c.len0+up('sun')*2;
 c.gold=n>=4;c.slots=n<3?1:n<8?2:3;
 c.patience=Math.max(14,26-d*0.45)+up('pat')*2.2;
 c.int=Math.pow(0.985,d);// threat spawn interval multiplier
 c.goal=goalFor(c);
 return c}
// ---------- upgrades ----------
const UPS=[
 {k:'blade',n:'Big Swipe',d:'Wider cuts',max:12,base:30,mul:1.55},
 {k:'grow',n:'Fertilizer',d:'Crops regrow faster',max:15,base:40,mul:1.5},
 {k:'price',n:'Fancy Crates',d:'+10% crop coins',max:20,base:45,mul:1.42},
 {k:'pat',n:'Lemonade',d:'Customers wait longer',max:10,base:60,mul:1.6},
 {k:'sun',n:'Long Days',d:'+2s every day',max:10,base:80,mul:1.62},
 {k:'scare',n:'Scarecrow',d:'Fewer pests',max:10,base:120,mul:1.6},
 {k:'field',n:'Bigger Field',d:'More plots',max:5,base:150,mul:3}];
const FIELD=[[5,3],[5,4],[6,4],[6,5],[7,5],[8,5]];
// field layouts: every day the farm looks different (paths, ponds, rocks to swipe around, hay, trees)
const STYLES=['split','rocks','pond','corner','stripe','diamond','rocks','scatter','pond','split','rocks2','corner','stripe','scatter','diamond','rocks2','pond','split','scatter','diamond'];
function makeLayout(n,cols,rows){const N=cols*rows,k=new Array(N).fill('soil');if(n<=1)return k;let s=n*7919+13;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
 const st=n<=STYLES.length+1?STYLES[n-2]:['split','rocks','pond','corner','stripe','diamond','scatter','rocks2'][Math.floor(r()*8)];const at=(c,y)=>y*cols+c;const mc=Math.floor(cols/2),mr=Math.floor(rows/2);
 const rand=(kind,cnt)=>{let g=0;while(cnt>0&&g++<80){const i=Math.floor(r()*N);if(k[i]==='soil'){k[i]=kind;cnt--}}};
 if(st==='split')for(let y=0;y<rows;y++)k[at(mc,y)]='path';
 else if(st==='stripe')for(let c=0;c<cols;c++)k[at(c,mr)]=c===mc?'soil':'path';
 else if(st==='pond'){k[at(mc,mr)]='pond';if(cols>=6)k[at(mc-1,mr)]='pond';if(rows>=5)k[at(mc,mr-1)]='pond'}
 else if(st==='corner'){k[at(cols-1,0)]='tree';k[at(cols-2,0)]='hay';if(rows>3)k[at(cols-1,1)]='hay'}
 else if(st==='diamond'){k[at(0,0)]='tree';k[at(cols-1,0)]='tree';k[at(0,rows-1)]='hay';k[at(cols-1,rows-1)]='hay'}
 else if(st==='rocks')rand('rock',2+Math.floor(N/16));
 else if(st==='rocks2')rand('rock',3+Math.floor(N/12));
 else{rand('rock',1+Math.floor(N/20));rand('hay',1);rand('pond',1)}
 return k}
function soilFrac(n){const f=FIELD[0];const k=makeLayout(n,f[0],f[1]);return k.filter(x=>x==='soil').length/k.length}
function upCost(u){const l=up(u.k);return Math.round(u.base*Math.pow(u.mul,l)/5)*5}
// ---------- save ----------
function defSave(){return{v:2,started:false,coins:0,day:1,stars:{},best:{},ups:{blade:0,grow:0,price:0,pat:0,sun:0,scare:0,field:0},harv:0,golds:0,bosses:0,maxCombo:0}}
let S=defSave(),hadSave=false,migrated=false;
(()=>{let s=null;try{s=store.get('save',null)}catch(e){}
 if(!s||typeof s!=='object')return;
 try{
  if(s.v===2){S=Object.assign(defSave(),s);S.ups=Object.assign(defSave().ups,s.ups||{});S.stars=s.stars||{};S.best=s.best||{}}
  else if(Array.isArray(s.plots)){// old idle-farm save: keep coins & level as a head start
   let inv=0;if(s.inv)for(const k in s.inv)inv+=(+s.inv[k]||0)*4;
   S.coins=Math.min(20000,Math.round((+s.coins||0)+inv));const lv=Math.max(1,Math.min(10,+s.lvl||1));S.day=lv;
   for(let i=1;i<lv;i++)S.stars[i]=1;const o=s.ups||{};S.ups.grow=Math.min(15,(o.fert|0)*2);S.ups.price=Math.min(20,(o.cart|0)*2);S.ups.scare=Math.min(10,(o.sprk|0)*2);S.ups.sun=Math.min(10,(o.hand|0)*2);
   S.ups.field=Math.min(5,Math.floor(Math.max(0,(s.plots.filter(p=>p&&p.open).length||6)-6)/4));S.harv=(s.stats&&+s.stats.harv)||0;S.started=!!s.started;migrated=true}
  hadSave=!!S.started}catch(e){S=defSave()}})();
let muted=!!store.get('muted',false);
function save(){store.set('save',S)}
if(migrated)save();
function up(k){return (S.ups&&S.ups[k])||0}
function fieldN(){const f=FIELD[Math.min(5,up('field'))];return f[0]*f[1]}
function totalStars(){let t=0;for(const k in S.stars)t+=S.stars[k]|0;return t}
// ---------- audio ----------
let AC=null,master=null,NB=null;
function ensureAudio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=0.7;master.connect(AC.destination);
 NB=AC.createBuffer(1,AC.sampleRate*0.6|0,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,slide,delay){if(muted||!AC)return;try{const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t+d);g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.1,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03)}catch(e){}}
function noise(d,v,fc,ft,delay,q,slide){if(muted||!AC||!NB)return;try{const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=ft||'bandpass';f.frequency.setValueAtTime(fc||1000,t);if(slide)f.frequency.exponentialRampToValueAtTime(fc*slide,t+d);f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v||0.1,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random()*0.3);s.stop(t+d+0.02)}catch(e){}}
let sl={};function lim(k,ms){const n=performance.now();if(sl[k]&&n-sl[k]<ms)return false;sl[k]=n;return true}
const PENTA=[0,2,4,7,9];
function comboFreq(i){i=Math.min(i,24);return 392*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12)}
const SFX={
 swish(sp){if(lim('sw',110))noise(0.14,0.05*Math.min(1.5,sp),1800,'bandpass',0,0.8,2.2)},
 pop(i){if(!lim('pop',25))return;const f=comboFreq(i)*rnd(.99,1.01);tone(f,0.11,'triangle',0.13,1.25);tone(f*2,0.06,'sine',0.05,1,0.02);noise(0.05,0.05,3000,'highpass')},
 rustle(){if(lim('ru',90))noise(0.08,0.03,2400,'highpass')},
 coin(){if(lim('c',45)){tone(1568,0.06,'square',0.03);tone(2093,0.1,'square',0.03,1,0.05)}},
 order(){[659,784,988,1319].forEach((f,i)=>tone(f,0.16,'triangle',0.1,1,i*0.07));noise(0.3,0.04,6000,'highpass',0.25)},
 caw(){tone(rnd(560,640),0.16,'sawtooth',0.05,0.6);tone(rnd(520,600),0.18,'sawtooth',0.05,0.55,0.18)},
 bonk(){tone(220,0.18,'sine',0.2,0.35);noise(0.08,0.12,600,'lowpass');tone(880,0.05,'square',0.04,1.5,0.02)},
 squeak(){tone(1200,0.08,'square',0.04,1.6);tone(1500,0.1,'square',0.04,0.7,0.08)},
 dig(){if(lim('dig',200))noise(0.15,0.05,300,'lowpass')},
 sting(){tone(120,0.35,'sawtooth',0.08,0.9);tone(180,0.3,'square',0.04,0.6);noise(0.2,0.06,500)},
 buzz(){if(lim('bz',500))tone(rnd(200,240),0.25,'sawtooth',0.012,1.05)},
 ice(){noise(0.12,0.1,5000,'highpass');tone(2600,0.05,'square',0.03,0.6)},
 weed(){noise(0.18,0.08,700,'bandpass',0,1,0.4);tone(300,0.1,'triangle',0.06,0.6)},
 squash(){tone(160,0.12,'triangle',0.1,0.6);noise(0.1,0.06,400,'lowpass')},
 thud(){tone(110,0.2,'sine',0.18,0.5);noise(0.1,0.1,250,'lowpass')},
 gold(){[1047,1319,1568,2093,2637].forEach((f,i)=>tone(f,0.18,'triangle',0.07,1,i*0.05))},
 combo(n){[523,659,784,1047].forEach((f,i)=>tone(f*(n>=20?1.5:1),0.15,'square',0.04,1,i*0.06))},
 bad(){tone(180,0.15,'square',0.05,0.7)},click(){tone(820,0.04,'triangle',0.07)},
 buy(){[523,784,1047].forEach((f,i)=>tone(f,0.12,'triangle',0.09,1,i*0.06))},
 tick(f){tone(f?1400:1000,0.04,'square',0.035)},
 star(i){tone([784,988,1319][i]||1319,0.3,'triangle',0.12);tone(([784,988,1319][i]||1319)*2,0.25,'sine',0.04,1,0.05)},
 sunset(){[784,659,523,392].forEach((f,i)=>tone(f,0.3,'triangle',0.08,1,i*0.12))},
 win(){[523,659,784,1047,1319,1568].forEach((f,i)=>tone(f,0.22,'triangle',0.09,1,i*0.08))},
 boss(){tone(110,0.6,'sawtooth',0.06,0.8);tone(82,0.7,'square',0.05,1,0.2)},
 bossDown(){[392,523,659,784,1047].forEach((f,i)=>tone(f,0.3,'square',0.05,1,i*0.09));noise(0.6,0.08,800,'lowpass')},
 angry(){tone(200,0.2,'sawtooth',0.04,0.7)},
 cluck(){tone(700,0.05,'square',0.03,1.6);tone(900,0.06,'square',0.03,0.8,0.06)}};
// ---------- canvas ----------
const cv=document.getElementById('c'),cx=cv.getContext('2d');let W=0,H=0,DPR=1,L={};
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(200,innerWidth);H=Math.max(200,innerHeight);cv.width=W*DPR|0;cv.height=H*DPR|0;layout();icache={}}
function fieldDims(){const f=FIELD[Math.min(5,up('field'))];return L.land?{c:f[0],r:f[1]}:{c:f[1],r:f[0]}}
function layout(){L.hy=GB.isTouch?34:0;L.land=W>=H*1.05;L.hud=58+L.hy+(L.land?0:40);const fd=fieldDims();L.cols=fd.c;L.rows=fd.r;
 if(L.land){L.custW=Math.min(330,Math.max(220,W*0.25));const ax=14,bx=W-L.custW-22,ay=L.hud+Math.min(70,H*0.09),by=H-14;
  L.cs=Math.floor(Math.min((bx-ax)/L.cols,(by-ay)/L.rows,165));L.fx=ax+((bx-ax)-L.cs*L.cols)/2;L.fy=ay+((by-ay)-L.cs*L.rows)/2;
  const n=3,top=L.hud+4,sh=Math.min(170,(H-top-12)/n);L.slots=[];for(let i=0;i<n;i++)L.slots.push({x:W-L.custW-8,y:top+i*sh+((H-top-12)-sh*n)/2,w:L.custW,h:sh-6});
  L.basket=[L.fx+L.cs*L.cols/2,L.hud-6]}
 else{const ch=Math.min(122,H*0.17);const cy=L.hud+2;L.slots=[];const sw=(W-12)/3;for(let i=0;i<3;i++)L.slots.push({x:6+i*sw,y:cy,w:sw-4,h:ch});
  const ay=cy+ch+14,by=H-12,ax=8,bx=W-8;L.cs=Math.floor(Math.min((bx-ax)/L.cols,(by-ay)/L.rows,140));L.fx=ax+((bx-ax)-L.cs*L.cols)/2;L.fy=ay+((by-ay)-L.cs*L.rows)/2;L.basket=[W/2,L.hud-6]}
 L.horizon=L.land?L.fy-L.cs*0.15:L.slots[0].y+L.slots[0].h*0.8;L.coinPos=[96,L.hy+28];L.u=L.cs/100}
function rr(g,x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

.gbT-keys kbd.w{min-width:64px;font-size:12px;letter-spacing:.05em}
.gbT-keys kbd:nth-child(2){animation-delay:.16s}.gbT-keys kbd:nth-child(3){animation-delay:.32s}.gbT-keys kbd:nth-child(4){animation-delay:.48s}
@keyframes gbKey{0%,55%,100%{transform:translateY(0);box-shadow:0 3px 0 #868ba6,0 5px 8px rgba(0,0,0,.4)}22%{transform:translateY(3px);box-shadow:0 0 0 #868ba6,0 2px 3px rgba(0,0,0,.4)}}
.gbT-skip{position:absolute;right:var(--tSkipR,calc(14px + env(safe-area-inset-right)));bottom:var(--tSkipB,calc(14px + env(safe-area-inset-bottom)));top:var(--tSkipT,auto);left:var(--tSkipL,auto);pointer-events:auto;cursor:pointer;font:800 14px/1 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--tInk,#fff);background:var(--tBg,rgba(12,8,36,.88));border:2px solid var(--tSkipBd,rgba(255,255,255,.55));border-radius:999px;padding:9px 16px 9px 18px;box-shadow:0 4px 12px rgba(0,0,0,.4);transition:transform .15s cubic-bezier(.2,1.6,.4,1),border-color .15s;touch-action:manipulation}
.gbT-skip:hover{transform:scale(1.06);border-color:#fff}
.gbT-skip:active{transform:scale(.93)}
.gbT-skip b{display:inline-block;margin-left:4px;transition:transform .2s}
.gbT-skip:hover b{transform:translateX(3px)}
.gbT.hid .gbT-cap,.gbT.hid .gbT-c{visibility:hidden}
.gbT-txt{letter-spacing:.03em}

:root{--tA:#ffc93d;--tOk:#7ad94a;--tBg:rgba(43,24,56,.92);--tGlow:rgba(255,201,61,.45);--tTop:calc(70px + env(safe-area-inset-top));--tRad:16px;--tFont:900 18px/1.15 "Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;--tSkipR:auto;--tSkipL:calc(12px + env(safe-area-inset-left));--tSkipB:calc(12px + env(safe-area-inset-bottom));--supC:#2b1838}

<script>
(()=>{
'use strict';
const SLUG='orbit-defense',PRE='gamebop.'+SLUG+'.';
const store={get(k,d){try{const v=localStorage.getItem(PRE+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(PRE+k,JSON.stringify(v))}catch(e){}}};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=Math.random,TAU=Math.PI*2;
const angD=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d};
const OUT='#2b1838';
let muted=!!store.get('mute',false);

// ---------- save (v2, migrates the old research save) ----------
const META=[
 {id:'hp',n:'Thick Crust',d:'+12 core HP',max:20,base:12,g:1.27,ic:'hp'},
 {id:'dmg',n:'Power Cells',d:'+7% damage',max:20,base:15,g:1.28,ic:'dmg'},
 {id:'rate',n:'Fast Loader',d:'+5% fire rate',max:15,base:18,g:1.3,ic:'rate'},
 {id:'swat',n:'Spiky Ring',d:'+12% whack',max:15,base:12,g:1.28,ic:'swat'},
 {id:'spin',n:'Turbo Motor',d:'+spin & cooling',max:10,base:20,g:1.34,ic:'spin'},
 {id:'gem',n:'Gem Magnet',d:'+10% gems',max:10,base:30,g:1.38,ic:'gem'},
 {id:'luck',n:'Lucky Star',d:'more rare cards',max:10,base:35,g:1.38,ic:'luck'},
 {id:'reroll',n:'Reroll',d:'+1 reroll / world',max:5,base:70,g:1.8,ic:'reroll'},
 {id:'start',n:'Head Start',d:'+1 card at start',max:4,base:150,g:2.1,ic:'start'}];
function metaCost(m,l){return Math.round(m.base*Math.pow(m.g,l))}
function fresh(){return{v:2,gems:0,meta:{},unlocked:1,stars:{},clears:{},run:null,played:0,endless:0,kills:0}}
let S=store.get('save',null);
if(!S||typeof S!=='object')S=fresh();
else if(S.v!==2){ // old Spin Defense save: crystals + research levels -> gems, sector progress -> worlds
 const o=S,n=fresh();let refund=0;
 const OLDB={dmg:10,rate:15,crit:40,tesla:30,laser:80,missile:150,cred:10,bounty:20,interest:45,refund:60,hp:10,radar:25,regen:35,ring4:120,spin:15};
 try{for(const k in (o.res||{})){const b=OLDB[k]||20;for(let l=0;l<(o.res[k]|0);l++)refund+=Math.round(b*Math.pow(l+1,1.6))}}catch(e){}
 n.gems=Math.round(((+o.cry)||0)+refund*.5);n.unlocked=clamp((o.unlocked|0)||1,1,5);n.clears=o.clears&&typeof o.clears==='object'?o.clears:{};n.played=o.played|0;n.migrated=1;S=n}
{const f=fresh();for(const k in f)if(S[k]===undefined)S[k]=f[k]}
function persist(){store.set('save',S)}
const M=k=>S.meta[k]|0;
const cleared=()=>Object.keys(S.clears).filter(k=>S.clears[k]).length;
persist();

// ---------- audio ----------
let AC=null,master=null,nb=null,lastS={},spinG=null,spinF=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination);nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nb.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;

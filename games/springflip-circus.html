<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Springflip Circus</title>
<style>
:root{--red:#c8283a;--deep:#6e1020;--gold:#f4b73e;--cream:#f8ead0;--ink:#3a0a12}
html,body{margin:0;height:100%;overflow:hidden;background:#1a0710;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:Georgia,'DejaVu Serif','Times New Roman',serif;color:var(--cream)}
canvas#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:5;text-align:center;padding:16px;box-sizing:border-box}
.ov.on{display:flex}
.dim{background:radial-gradient(ellipse at center,rgba(40,6,18,.55),rgba(14,2,8,.86))}
#title{justify-content:flex-start;padding-top:max(3vh,10px)}
.logo{width:min(640px,96vw);height:auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.5));animation:bob 3s ease-in-out infinite;transform-origin:50% 60%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-7px) rotate(1deg)}}
.menu{display:flex;flex-direction:column;gap:12px;align-items:center;margin-top:auto;margin-bottom:max(5vh,30px)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;color:var(--cream);border:0;cursor:pointer;padding:12px 26px;font-size:20px;letter-spacing:.06em;border-radius:12px;position:relative;
 background:linear-gradient(180deg,#e8434f 0%,#c3202f 55%,#9a1424 100%);
 box-shadow:0 0 0 3px #f4b73e,0 0 0 6px #6e1020,0 7px 0 6px #3e0812,0 12px 22px rgba(0,0,0,.45);
 text-shadow:0 2px 0 #5a0a14;transition:transform .09s cubic-bezier(.3,1.6,.5,1),box-shadow .09s}
.btn:hover{transform:translateY(-2px) scale(1.04)}
.btn:active{transform:translateY(5px) scale(.97);box-shadow:0 0 0 3px #f4b73e,0 0 0 6px #6e1020,0 2px 0 6px #3e0812,0 4px 10px rgba(0,0,0,.4)}
.btn.big{font-size:30px;padding:14px 50px;min-width:230px}
.btn.big::before{content:"";position:absolute;inset:5px;border-radius:8px;border:2px dotted rgba(255,236,170,.75);pointer-events:none}
.btn.alt{background:linear-gradient(180deg,#fff7e4,#f2dcb0 60%,#dcc08a);color:var(--ink);text-shadow:0 1px 0 #fff}
.btn.sm{font-size:16px;padding:9px 16px}
.btn .ic{width:22px;height:22px;vertical-align:-4px}
.cos{display:flex;align-items:center;gap:8px;background:rgba(30,6,14,.55);border-radius:30px;padding:4px 6px;box-shadow:inset 0 0 0 2px rgba(244,183,62,.5)}
.cos button{width:34px;height:34px;border-radius:50%;border:0;background:#f4b73e;color:var(--ink);font:900 18px Georgia,serif;cursor:pointer;box-shadow:0 3px 0 #8a5a10}
.cos button:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5a10}
#cosName{min-width:150px;font-size:15px;font-weight:900;letter-spacing:.05em}
#cosName small{display:block;font-size:11px;opacity:.75;font-weight:400}
#sup{position:fixed;right:calc(8px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));font:12px Verdana,'DejaVu Sans',sans-serif;color:#f8ead0;opacity:.55;text-decoration:none;z-index:6}
#sup:hover{opacity:1}
.ib{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;
 background:radial-gradient(circle at 40% 35%,#ffdf8a,#e9a42c 60%,#b5761a);box-shadow:0 3px 0 #6e3e08,0 4px 10px rgba(0,0,0,.4)}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 #6e3e08}
.ib svg{width:22px;height:22px}
#mute{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:8}
#hudb{position:fixed;top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));z-index:7;display:none;gap:8px}
#hudb.on{display:flex}
#skip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;display:none;font-size:16px;padding:8px 22px}
#skip.on{display:block}
#skip:hover{transform:translateX(-50%) scale(1.05)}#skip:active{transform:translateX(-50%) translateY(3px)}
.poster{position:relative;width:min(420px,92vw);padding:22px 18px 22px;border-radius:18px;color:var(--ink);
 background:repeating-linear-gradient(90deg,rgba(200,40,58,.08) 0 22px,transparent 22px 44px),linear-gradient(180deg,#fff6e2,#f1dcb0);
 box-shadow:0 0 0 4px #f4b73e,0 0 0 9px #a3192b,0 0 0 11px #f4b73e,0 18px 40px rgba(0,0,0,.6);animation:popin .5s cubic-bezier(.2,1.5,.4,1)}
@keyframes popin{0%{transform:scale(.4) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.rt{font-size:clamp(34px,9vw,48px);font-weight:900;letter-spacing:.04em;color:#c8283a;text-shadow:0 3px 0 #6e1020,0 6px 10px rgba(0,0,0,.2);margin:-4px 0 0}
.rsub{font-size:14px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;margin-top:2px}
#rMedal{width:130px;height:130px;margin:2px auto 0;display:block}
.rs{font:900 40px 'Trebuchet MS','DejaVu Sans',sans-serif;letter-spacing:.02em}
.rl{font-size:15px;min-height:20px;margin:2px 0 8px;font-weight:700;color:#7a1a28}
.tease{display:flex;align-items:center;gap:10px;justify-content:center;background:#3a0a16;color:var(--cream);border-radius:12px;padding:8px 14px;margin:6px auto 14px;width:fit-content;box-shadow:inset 0 0 0 2px #f4b73e}
.tease small{display:block;font-size:11px;letter-spacing:.25em;opacity:.7;text-align:left}
.tease b{font-size:19px}
#rIcon{width:52px;height:52px}
.rb{display:flex;gap:12px;justify-content:center;align-items:center}
.rb .btn.big{min-width:170px}
.cun{font-size:14px;font-weight:900;color:#1d7a50;min-height:0}
h2.at{font-size:clamp(34px,8vw,52px);margin:0 0 4px;color:#f4b73e;text-shadow:0 4px 0 #6e1020,0 8px 18px rgba(0,0,0,.5);letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;width:min(820px,94vw);max-height:62vh;overflow-y:auto;padding:8px;box-sizing:border-box}
.tk{position:relative;border:0;cursor:pointer;font:inherit;color:var(--ink);padding:10px 8px 8px;border-radius:10px;background:linear-gradient(180deg,#fff7e4,#efd6a4);box-shadow:0 0 0 3px #c8283a,0 5px 0 3px #6e1020;transition:transform .1s}
.tk:hover{transform:translateY(-3px) rotate(-1deg)}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#2a0810}
.tk::before{left:-9px}.tk::after{right:-9px}
.tk canvas{width:56px;height:56px;display:block;margin:0 auto}
.tk b{display:block;font-size:14px;margin-top:2px}.tk small{font-size:11px;letter-spacing:.2em;opacity:.7}
.tk.lock{filter:grayscale(1) brightness(.55);cursor:default}
.tk .md{position:absolute;top:6px;right:8px;width:18px;height:18px;border-radius:50%;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.pt{font-size:clamp(40px,10vw,64px);font-weight:900;color:#f4b73e;text-shadow:0 5px 0 #6e1020;margin:0 0 10px}
</style></head><body>
<canvas id="c"></canvas>

<div id="title" class="ov on">
 <svg class="logo" viewBox="0 0 640 270" aria-label="Springflip Circus">
  <defs>
   <linearGradient id="lg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffd24a"/><stop offset="1" stop-color="#f08218"/></linearGradient>
   <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ef4655"/><stop offset="1" stop-color="#a3172a"/></linearGradient>
   <path id="arc" d="M40,178 Q320,8 600,178"/>
  </defs>
  <g opacity=".9">
   <path d="M80,40 l8,0 -4,-8z M552,30 l8,0 -4,-8z" fill="#ffd24a"/>
  </g>
  <text font-family="Georgia,'DejaVu Serif',serif" font-weight="900" font-size="80" letter-spacing="1" textLength="540" lengthAdjust="spacingAndGlyphs" fill="#4a0a14" transform="translate(0,9)"><textPath href="#arc" startOffset="50%" text-anchor="middle">SPRINGFLIP</textPath></text>
  <text font-family="Georgia,'DejaVu Serif',serif" font-weight="900" font-size="80" letter-spacing="1" textLength="540" lengthAdjust="spacingAndGlyphs" fill="url(#lg)" stroke="#6e1020" stroke-width="9" stroke-linejoin="round" paint-order="stroke"><textPath href="#arc" startOffset="50%" text-anchor="middle">SPRINGFLIP</textPath></text>
  <path d="M110,186 L60,176 L84,206 L56,236 L130,232 Z M530,186 L580,176 L556,206 L584,236 L510,232 Z" fill="#7a0f1e"/>
  <path d="M120,180 Q320,160 520,180 L512,238 Q320,218 128,238 Z" fill="url(#rb)" stroke="#f4b73e" stroke-width="4"/>
  <path d="M128,188 Q320,170 512,188" fill="none" stroke="#ffdf8a" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>
  <text x="320" y="226" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-weight="900" font-size="46" letter-spacing="14" fill="#fff3d6" stroke="#5a0a14" stroke-width="5" paint-order="stroke">CIRCUS</text>

 <div class="menu">
  <button id="bPlay" class="btn big">Play</button>

   <button id="bHome" class="btn alt sm" aria-label="menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 11 L12 3 L21 11 V21 H14 V15 H10 V21 H3Z" fill="#3a0a12"/></svg></button>
   <button id="bRetry" class="btn alt sm" aria-label="retry"><svg class="ic" viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8h-3a5 5 0 1 1-5-5v3l5-4.5L12 1z" fill="#3a0a12"/></svg></button>

 </div>

 <button class="ib" id="bPause" aria-label="pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="#3a0a12"/><rect x="14" y="5" width="4" height="14" rx="1" fill="#3a0a12"/></svg></button>
 <button class="ib" id="bRestart" aria-label="restart"><svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 8 8h-3a5 5 0 1 1-5-5v3l5-4.5L12 1z" fill="#3a0a12"/></svg></button>
</div>
<button class="ib" id="mute" aria-label="mute"><svg viewBox="0 0 24 24" id="muteIc"></svg></button>
<button id="skip" class="btn alt">Skip tutorial ›</button>

<script>
'use strict';
// ================= storage =================
const SLUG='springflip-circus',KP='gamebop.'+SLUG+'.';
function lsGet(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}
const saved=lsGet('save',null);
let save=Object.assign({unlocked:1,medals:{},best:{},costume:0,golds:0,tut:false,hint:0,last:0},saved||{});
let hasSave=!!saved;
function persist(){lsSet('save',save);hasSave=true}
let muted=!!lsGet('mute',false);

// ================= helpers =================
const TAU=Math.PI*2,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[(Math.random()*a.length)|0];
const wrap=a=>{a=(a+PI)%TAU;if(a<0)a+=TAU;return a-PI};
const appr=(v,t,d)=>v<t?Math.min(t,v+d):Math.max(t,v-d);
const eOutBack=t=>{const c=1.9;t=clamp(t,0,1);return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const eOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const FT="Georgia,'DejaVu Serif','Times New Roman',serif",FS="'Trebuchet MS','DejaVu Sans',Verdana,sans-serif";

// ================= audio =================
let AC=null,master=null,noiseBuf=null,musGain=null;
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.85;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;master.connect(comp);comp.connect(AC.destination);
  musGain=AC.createGain();musGain.gain.value=.5;musGain.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  nextNote=AC.currentTime+.1;
 }catch(e){AC=null}
}
function tone(f,dur,o={}){if(!AC)return;const t=AC.currentTime+(o.d||0);const os=AC.createOscillator(),g=AC.createGain();os.type=o.type||'sine';
 os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+(o.slide||dur));
 if(o.vib){const l=AC.createOscillator(),lg=AC.createGain();l.frequency.value=o.vib;lg.gain.value=f*.03;l.connect(lg);lg.connect(os.frequency);l.start(t);l.stop(t+dur+.05)}
 const v=o.v==null?.2:o.v;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 os.connect(g);g.connect(o.bus||master);os.start(t);os.stop(t+dur+.05)}
function noise(dur,o={}){if(!AC)return;const t=AC.currentTime+(o.d||0);const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 const f=AC.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;
 const g=AC.createGain(),v=o.v==null?.2:o.v;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+(o.a||.005));g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(f);f.connect(g);g.connect(master);s.start(t,Math.random());s.stop(t+dur+.05)}
const vr=()=>rnd(.94,1.06);
const PENTA=[0,2,4,7,9];
const scaleF=i=>{const o=Math.floor(i/5),n=PENTA[((i%5)+5)%5];return 392*Math.pow(2,o+n/12)};
const S={
 boing(p){const k=vr();tone(110*k*(.8+p*.5),.32,{to:330*k*(.8+p*.6),slide:.18,type:'sine',v:.32});tone(220*k,.18,{to:520*k*(1+p*.4),type:'triangle',v:.12});noise(.08,{f:300,v:.08})},
 tuck(){noise(.22,{f:500,f2:2200,q:1.4,v:.16,a:.03})},
 whoosh(r){noise(.13,{f:700*r*vr(),f2:1500*r,q:2,v:.07,a:.02})},
 land(m,flips,perf){const b=4+m;const k=vr();[0,2,4].forEach((s,i)=>{tone(scaleF(b+s)*k,.5,{type:'triangle',v:.16,d:i*.045});tone(scaleF(b+s)*2*k,.3,{type:'sine',v:.05,d:i*.045})});
  if(perf)tone(scaleF(b+8),.6,{type:'sine',v:.08,d:.14});if(flips>=2)tone(scaleF(b+10),.7,{type:'square',v:.04,d:.2})},
 bonk(){tone(620*vr(),.09,{type:'sine',v:.35,to:420});tone(160,.16,{type:'square',v:.08,to:80});tone(1400,.6,{to:260,type:'sine',v:.12,d:.08,slide:.55,vib:9})},
 flop(){tone(180*vr(),.2,{type:'triangle',v:.3,to:70});noise(.15,{f:400,v:.15,ft:'lowpass'})},
 cheer(x){x=clamp(x,.2,1.4);noise(1.4,{f:1700,q:.6,v:.11*x,a:.08});noise(1,{f:900,q:.8,v:.07*x,a:.05});for(let i=0;i<3+x*4;i++){const f=rnd(500,900);tone(f,rnd(.3,.6),{to:f*rnd(1.3,1.7),type:'sine',v:.025*x,d:rnd(0,.3),vib:6})}},
 aww(){for(let i=0;i<5;i++){const f=rnd(300,420);tone(f,.7,{to:f*.6,type:'sine',v:.03,d:rnd(0,.1),vib:5})};noise(.7,{f:600,q:.7,v:.05,a:.1})},
 laugh(){for(let i=0;i<6;i++){tone(rnd(380,520),.08,{type:'triangle',v:.05,d:i*.11+rnd(0,.03),to:300})}},
 pop(i){noise(.05,{ft:'highpass',f:2000,v:.3});tone(scaleF(5+i),.15,{type:'sine',v:.14,to:scaleF(5+i)*1.5})},
 star(i){tone(scaleF(8+i),.18,{type:'triangle',v:.13});tone(scaleF(10+i),.3,{type:'sine',v:.1,d:.06})},
 corn(i){noise(.03,{ft:'highpass',f:3000,v:.18});tone(900+i*40,.05,{type:'square',v:.03})},
 boom(){noise(.9,{ft:'lowpass',f:900,f2:80,v:.6,a:.002});tone(130,.6,{to:35,type:'sine',v:.5})},
 fwump(){tone(240,.2,{to:90,type:'sine',v:.3});noise(.15,{ft:'lowpass',f:500,v:.2})},
 clank(){tone(880*vr(),.25,{type:'square',v:.05});tone(1318*vr(),.3,{type:'sine',v:.1})},
 honk(){tone(233,.28,{type:'sawtooth',v:.07,vib:14});tone(294,.28,{type:'sawtooth',v:.05,vib:14})},
 arf(){tone(300,.16,{type:'sawtooth',v:.07,to:440});tone(420,.16,{type:'sawtooth',v:.06,to:260,d:.17})},
 thunder(){noise(2.2,{ft:'lowpass',f:260,f2:60,v:.5,a:.05})},
 zap(){noise(.25,{ft:'highpass',f:3000,v:.25});tone(1800,.2,{type:'sawtooth',v:.05,to:200})},
 fanfare(){[0,4,7,12,16].forEach((s,i)=>{tone(523*Math.pow(2,s/12),.35+(i==4?.6:0),{type:'square',v:.06,d:i*.11});tone(523*Math.pow(2,s/12),.4,{type:'triangle',v:.1,d:i*.11})})},
 sad(){[7,5,3,0].forEach((s,i)=>tone(392*Math.pow(2,s/12),.4,{type:'triangle',v:.1,d:i*.18,vib:5}))},
 click(){tone(700,.06,{type:'triangle',v:.12,to:900})},
 gold(){[0,4,7,11,14,19].forEach((s,i)=>tone(784*Math.pow(2,s/12),.5,{type:'sine',v:.08,d:i*.06}))},
 whistle(){tone(900,.5,{to:1700,type:'sine',v:.08,vib:8})},
 squeak(){tone(1200,.12,{to:1900,type:'square',v:.04})}
};
// circus waltz
const MEL=[72,76,79, 84,0,79, 77,74,71, 74,0,0, 71,74,77, 79,77,74, 72,76,79, 76,0,0, 72,76,79, 84,83,81, 81,77,72, 77,0,81, 79,76,72, 74,77,71, 72,0,79, 72,0,0];
const CHO=[48,48,43,43,43,43,48,48,48,48,41,41,48,43,48,48];
let nextNote=0,beat=0,musOn=true;
function musTick(){if(!AC||muted)return;if(nextNote<AC.currentTime)nextNote=AC.currentTime+.05;
 const sp=60/(mode==='play'?176:150);
 while(nextNote<AC.currentTime+.2){const b=beat%48,bar=(b/3)|0,ch=CHO[bar],t=nextNote-AC.currentTime;const vol=(mode==='play'?.55:.8)*(paused?0:1);
  if(vol>0){if(b%3===0)tone(440*Math.pow(2,(ch-12-69)/12),.3,{type:'triangle',v:.09*vol,d:t,bus:musGain});
   else{tone(440*Math.pow(2,(ch+4-69)/12),.14,{type:'square',v:.018*vol,d:t,bus:musGain});tone(440*Math.pow(2,(ch+7-69)/12),.14,{type:'square',v:.015*vol,d:t,bus:musGain})}
   const m=MEL[b];if(m)tone(440*Math.pow(2,(m-69)/12),sp*.9,{type:'square',v:.022*vol,d:t,bus:musGain,vib:5.5});}
  nextNote+=sp;beat++}}

 A=newAcro();A.x=tramps[0].x;A.y=420;A.vy=-200;A.tgt=trampTarget(0);
 if(act.trapeze){const t=act.trapeze;trap={px:t.x,py:t.y,len:t.len,ang:.2,angV:0,L:t.len}}

 goldenT=(i>=1&&!tut&&Math.random()<.45)?rnd(10,26):-1;if(act.endless)goldenT=rnd(8,16);
 clownPlan=(act.clown?5:(i>=3&&act.tramps.length===1&&!act.car&&act.cannon==null&&Math.random()<.45)?rnd(8,20):-1);

 const cols=['#e9433f','#3a8fd8','#2aa66e','#f2b33d','#9a4ad0','#f07ab0'];

 balloons.push({x,y,r:30,c:pick(cols),ph:rnd(0,TAU),t:-(delay||0),gold:false,dead:false,charged:false})
}

function camTargetX(){let mn=1e9,mx=-1e9;for(const t of tramps){const lo=t.car?t.base-250:t.x,hi=t.car?t.base+250:t.x;mn=Math.min(mn,lo-150);mx=Math.max(mx,hi+150)}

 const visW=W/(baseSc*cam.z);if(mx-mn<=visW)return(mn+mx)/2;return clamp(A?A.x:0,mn+visW/2,mx-visW/2)}

// ================= game logic =================
function timeToY(ty){const disc=A.vy*A.vy+2*G*(A.y-ty);if(disc<0)return -1;return(A.vy+Math.sqrt(disc))/G}
function steer(dt,hard){const T=A.tgt;if(!T)return;const tr=timeToY(T.y);if(tr<0.03)return;A.tr=tr;const tx=T.xAt(time+tr);const des=clamp((tx-A.x)/tr,-1200,1200);
 if(hard)A.vx=des;else A.vx+=(des-A.vx)*Math.min(1,5*dt)}
function nearestTramp(){let bi=0,bd=1e9;tramps.forEach((t,i)=>{const d=Math.abs(t.x-A.x);if(d<bd){bd=d;bi=i}});return bi}
function launchTargetPick(){
 if(cannon&&A.onCount>=2){A.onCount=0;const m=cannonPos();A.tgt={kind:'cannon',y:m.y,xAt:()=>cannonPos().x};cannon.glow=1;bubble(()=>({x:rm.x,y:130}),'Into the cannon!',1.4);return}
 if(tramps.length>1)A.tgt=trampTarget(1-A.ti);else A.tgt=trampTarget(0)}
function goalAdd(type,n){act.goals.forEach((g,i)=>{if(g[0]===type){const was=prog[i];prog[i]=Math.min(g[1],prog[i]+n);if(prog[i]>was){goalPulse=1;if(prog[i]>=g[1]&&was<g[1]){S.star(6);popup(0,0,'✓ '+GL[type],{screen:true,sz:28,c:'#bfffcf',stroke:'#0e4a2a'})}}}});checkDone()}
let goalPulse=0;
function checkDone(){if(done||act.endless||!act.goals.length)return;if(act.goals.every((g,i)=>prog[i]>=g[1])){finishAct(true)}}
function finishAct(w){if(done)return;done=true;won=w;doneT=0;
 if(w){slowT=1.1;S.fanfare();setTimeout(()=>S.cheer(1.4),120);cheerT=2.5;confetti(A.x,A.y,90,900);for(let k=0;k<4;k++)setTimeout(()=>{if(mode==='play')confetti(cam.x+rnd(-400,400),cam.y+rnd(300,700),40,700)},200+k*260);flash=.5;flashCol='#fff4c0';
  bubble(()=>({x:rm.x,y:140}),pick(['Magnificent!','Bravo! Bravo!','Spectacular!','What a show!']),2)}
 else{S.sad()}
}

function update(dt){
 time+=dt;
 const edge=inp.edge,rel=inp.rel;inp.edge=false;inp.rel=false;
 if(attract)botInput();
 // timer
 if(!tut&&!done&&mode==='play'){timeLeft-=dt;if(timeLeft<=0){timeLeft=0;finishAct(!!act.endless||!!act.bonus)}}
 if(done){doneT+=dt/Math.max(.25,ts);if(doneT>1.9&&mode==='play')showResults()}
 updAcro(dt,edge,rel);

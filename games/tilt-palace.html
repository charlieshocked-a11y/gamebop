 background:linear-gradient(#ff6b8e,#d81b5a 55%,#a3093f);box-shadow:0 0 0 3px #f5e6c8,0 0 0 5px #6b4a2a,0 6px 0 5px #3a1a10,0 10px 22px rgba(0,0,0,.6),inset 0 2px 0 rgba(255,255,255,.5);

<script>
'use strict';
// ================= helpers =================
const TAU=Math.PI*2,W=560,H=1000,MXC=526,BR=12;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const eOut=t=>1-Math.pow(1-clamp(t,0,1),3), eIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const eBack=t=>{t=clamp(t,0,1);const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const eEl=t=>t<=0?0:t>=1?1:Math.pow(2,-10*t)*Math.sin((t*10-.75)*TAU/3)+1;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const fmt=n=>Math.floor(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,',');
const shortN=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+'M':n>=1e3?Math.round(n/1e3)+'K':''+Math.floor(n);
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w));c.height=Math.max(1,Math.ceil(h));return c}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath()}
function star(x,X,Y,r1,r2,n,rot){x.beginPath();for(let i=0;i<n*2;i++){const a=rot+i*Math.PI/n,r=i%2?r2:r1;x.lineTo(X+Math.cos(a)*r,Y+Math.sin(a)*r)}x.closePath()}
function gearPath(x,X,Y,r,n,rot){x.beginPath();for(let i=0;i<n*4;i++){const a=rot+i*TAU/(n*4),rr2=(i%4<2)?r:r*.84;x.lineTo(X+Math.cos(a)*rr2,Y+Math.sin(a)*rr2)}x.closePath()}
function arcPts(cx,cy,r,a0,a1,n){const p=[];for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n;p.push([cx+Math.cos(a)*r,cy+Math.sin(a)*r])}return p}
const glowCache={};
function glowSpr(col){if(glowCache[col])return glowCache[col];const c=mk(64,64),x=c.getContext('2d');const g=x.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,col);g.addColorStop(.25,col);g.addColorStop(1,'rgba(0,0,0,0)');x.globalAlpha=1;x.fillStyle=g;x.fillRect(0,0,64,64);return glowCache[col]=c}
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${n>>8&255},${n&255},${a})`}

// ================= storage =================
const PFX='gamebop.tilt-palace.';
function sget(k,d){try{const v=localStorage.getItem(PFX+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v))}catch(e){}}
function sdel(k){try{localStorage.removeItem(PFX+k)}catch(e){}}
const P=Object.assign({unl:1,best:[0,0,0,0,0,0],wiz:[0,0,0,0,0,0],ach:{},fin:0,tut:0,daily:{},games:0,last:0,tot:{sling:0}},sget('profile',{}));
const S=Object.assign({mute:0,music:1},sget('settings',{}));
const saveP=()=>sset('profile',P), saveS=()=>sset('settings',S);

// ================= audio =================
const A={c:null};
function initAudio(){
 if(A.c){if(A.c.state==='suspended')A.c.resume();return}
 try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;A.c=new C()}catch(e){return}
 const c=A.c;A.master=c.createGain();const comp=c.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;
 A.master.connect(comp);comp.connect(c.destination);A.sfx=c.createGain();A.sfx.connect(A.master);A.mus=c.createGain();A.mus.connect(A.master);
 const len=c.sampleRate*2|0;A.nb=c.createBuffer(1,len,c.sampleRate);const d=A.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
 const src=c.createBufferSource();src.buffer=A.nb;src.loop=true;A.rollF=c.createBiquadFilter();A.rollF.type='lowpass';A.rollF.frequency.value=200;A.rollG=c.createGain();A.rollG.gain.value=0;src.connect(A.rollF);A.rollF.connect(A.rollG);A.rollG.connect(A.sfx);src.start();
 applyVol();MUS.next=c.currentTime+.1;
}
function applyVol(){if(!A.c)return;const t=A.c.currentTime;A.master.gain.setTargetAtTime(S.mute?0:.8,t,.02);A.mus.gain.setTargetAtTime(S.music?.24:0,t,.05);updSndIcons()}
function env(g,t,a,p,d){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d)}
function osc(type,f,t,dur,vol,o){o=o||{};const c=A.c,O=c.createOscillator();O.type=type;O.frequency.setValueAtTime(f,t);if(o.to)O.frequency.exponentialRampToValueAtTime(Math.max(20,o.to),t+dur);
 const g=c.createGain();env(g,t,o.a||.004,vol,dur);let n=O;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;O.connect(fl);n=fl}n.connect(g);g.connect(o.bus||A.sfx);O.start(t);O.stop(t+(o.a||.004)+dur+.05)}
function nz(t,dur,vol,o){o=o||{};const c=A.c,s=c.createBufferSource();s.buffer=A.nb;const fl=c.createBiquadFilter();fl.type=o.type||'bandpass';fl.frequency.setValueAtTime(o.f||1500,t);if(o.to)fl.frequency.exponentialRampToValueAtTime(o.to,t+dur);fl.Q.value=o.q||1;
 const g=c.createGain();env(g,t,o.a||.002,vol,dur);s.connect(fl);fl.connect(g);g.connect(o.bus||A.sfx);s.start(t,Math.random());s.stop(t+dur+.06)}
const lastS={},SFXT={tick:.03,wall:.05,bump:.05,sling:.06,flip:.02,lane:.08,target:.04,bonus:.02};
const semi=(b,s)=>b*Math.pow(2,s/12);
function sfx(n,a){if(!A.c||S.mute||G.attract)return;const t=A.c.currentTime;if(lastS[n]&&t-lastS[n]<(SFXT[n]||.03))return;lastS[n]=t;try{SFX[n](t,a)}catch(e){}}
const SFX={
 flip(t){nz(t,.07,.32,{f:700,type:'lowpass'});osc('square',150,t,.05,.1,{to:55,lp:900})},
 flipD(t){nz(t,.04,.1,{f:500,type:'lowpass'})},
 bump(t){osc('sine',260,t,.16,.45,{to:70});osc('square',950,t,.05,.07,{to:300,lp:3000});nz(t,.07,.28,{f:2600,q:2})},
 sling(t){osc('triangle',640,t,.08,.25,{to:170});nz(t,.05,.28,{f:3600,q:1.5})},
 wall(t,v){nz(t,.035,clamp(v/2600,.03,.22),{f:1900,q:2.5});osc('sine',340,t,.04,clamp(v/3200,0,.1),{to:210})},
 drop(t){osc('square',320,t,.09,.16,{to:90,lp:1300});nz(t,.06,.25,{f:900})},
 target(t){osc('triangle',780,t,.1,.22,{to:520});nz(t,.03,.2,{f:4200,q:3})},
 tick(t){osc('square',2600,t,.012,.05,{lp:6000})},
 lane(t,i){osc('sine',semi(880,(i||0)*4),t,.22,.18);osc('sine',semi(1320,(i||0)*4),t+.05,.22,.1)},
 ramp(t){nz(t,.55,.22,{f:400,to:3200,q:2});osc('sawtooth',180,t,.5,.05,{to:820,lp:2200})},
 shot(t){[0,4,7,12].forEach((s,i)=>osc('square',semi(523,s),t+i*.055,.14,.09,{lp:3200}))},
 scoop(t){osc('sine',130,t,.25,.5,{to:40});nz(t,.15,.3,{f:300,type:'lowpass'})},
 eject(t){nz(t,.1,.4,{f:500});osc('square',90,t,.12,.2,{to:220,lp:900})},

 else if(k==='Space'||k==='ArrowDown'||k==='Enter'){if(G.pulling){G.pulling=0;const b=G.balls.find(b=>inLane(b)&&b.lane);if(b)launch(b,G.pull);G.pull=0}}});
const ptrs={};
cv.addEventListener('pointerdown',e=>{anyGesture();if(G.mode!=='play'||G.paused)return;if(e.pointerType==='touch')lastTouch=G.t+1e-3;const side=e.clientX<vw/2?-1:1;ptrs[e.pointerId]={side,x:e.clientX,y:e.clientY,t:G.t,sw:0};
 if(side<0){G.fl=(G.fl||0)+1;sfx('flip');laneRotate(-1);tutEvent('flipL')}else{G.fr=(G.fr||0)+1;sfx('flip');laneRotate(1);tutEvent('flipR')}try{cv.setPointerCapture(e.pointerId)}catch(_){}});
cv.addEventListener('pointermove',e=>{const p=ptrs[e.pointerId];if(!p||G.mode!=='play')return;const dy=e.clientY-p.y;const lb=G.balls.find(b=>inLane(b)&&b.lane);
 if(lb&&dy>8){G.pull=clamp(dy/140,0,1)}
 if(!p.sw&&dy<-55&&G.t-p.t<.5){p.sw=1;if(lb){launch(lb,clamp(Math.max(G.pull,-dy/220),.45,1));G.pull=0}else nudge(rnd(-60,60),-300)}});
function ptrUp(e){const p=ptrs[e.pointerId];if(!p)return;delete ptrs[e.pointerId];if(p.side<0)G.fl=Math.max(0,G.fl-1);else G.fr=Math.max(0,G.fr-1);sfx('flipD');const lb=G.balls.find(b=>inLane(b)&&b.lane);if(lb&&G.pull>.05&&!p.sw){launch(lb,G.pull)}G.pull=0}
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);

function togglePause(){G.paused=!G.paused;G.fl=G.fr=0;G.pulling=0;if(G.paused){show('#pause');updSndIcons()}else showOnly(null);if(A.c){G.paused?A.c.suspend&&A.c.suspend():A.c.resume()}}

// ================= tutorial =================
const TUT=[{id:'launch',k:()=>isTouch()?'Drag down, swipe up to launch':'Hold <kbd>Space</kbd> · release to launch'},{id:'flip',k:()=>isTouch()?'Tap left / right side to flip':'Flip with <kbd>←</kbd> <kbd>→</kbd>'},{id:'cradle',k:()=>'Hold a flipper to trap the ball'},{id:'nudge',k:()=>isTouch()?'Swipe up to nudge · not too much!':'<kbd>Shift</kbd> nudges · too much = TILT'},{id:'aim',k:()=>'Hit glowing arrows to start missions'}];
function isTouch(){return lastTouch>0||matchMedia('(pointer:coarse)').matches}
function startTut(){G.tut={i:0,t:0,f:{}};R0.saveT=999;$('#tut').classList.add('on');$('#tutSkip').classList.add('on');tutShow()}
function tutShow(){const s=TUT[G.tut.i];$('#tutCap').innerHTML=s.k();G.tut.t=0;G.tut.f={}}
function tutEvent(ev){const T=G.tut;if(!T)return;const s=TUT[T.i];if(!s)return;
 if(s.id==='launch'&&ev==='launch')tutNext();else if(s.id==='flip'&&(ev==='flipL'||ev==='flipR')){T.f[ev]=1;if(T.f.flipL&&T.f.flipR&&T.t>.6)tutNext()}else if(s.id==='cradle'&&ev==='cradle')tutNext();else if(s.id==='nudge'&&ev==='nudge'){G.tiltM=0;tutNext()}else if(s.id==='aim'&&ev==='shot')tutNext()}
function tutNext(){const T=G.tut;if(!T)return;T.i++;sfx('click');if(T.i>=TUT.length){endTut(1);return}tutShow()}
function tutTick(dt){const T=G.tut;if(!T)return;T.t+=dt;const s=TUT[T.i];if(s.id==='flip'&&T.f.flipL&&T.f.flipR&&T.t>1)tutNext();else if(s.id==='cradle'&&T.t>14)tutNext();else if(s.id==='aim'&&T.t>7)tutNext();if(G.tut&&TUT[G.tut.i].id!=='launch')G.tiltM=Math.min(G.tiltM,2)}
function endTut(done){G.tut=null;P.tut=1;saveP();$('#tut').classList.remove('on');$('#tutSkip').classList.remove('on');if(G.mode==='play'){R0.saveT=Math.min(R0.saveT,8);call('GOOD LUCK',263,500,G.w.D.pal.a,30)}}
function tutDraw(c){const T=G.tut,s=TUT[T.i],t=G.t,sc=LAY.s;const P2=(x,y)=>[LAY.x+x*sc,LAY.y+y*sc];c.save();
 const arrow=(x,y,ang)=>{const b=Math.sin(t*6)*8;c.save();c.translate(x,y);c.rotate(ang);c.translate(-b,0);c.fillStyle='#ffd35a';c.strokeStyle='#3a1a00';c.lineWidth=3;c.beginPath();c.moveTo(0,0);c.lineTo(-22,-14);c.lineTo(-22,-6);c.lineTo(-44,-6);c.lineTo(-44,6);c.lineTo(-22,6);c.lineTo(-22,14);c.closePath();c.stroke();c.fill();c.restore()};
 const hand=(x,y,press)=>{c.save();c.translate(x,y);c.scale(1-press*.12,1-press*.12);c.globalAlpha=.85;icon(c,'hand',0,0,46,'#fff');c.restore()};
 if(s.id==='launch'){const [x,y]=P2(535,930);arrow(x-12,y,0);if(isTouch()){const k=(t%1.6)/1.6;const yy=k<.5?y-40+k*120:y+20-(k-.5)*260;hand(vw*.75,clamp(yy,y-200,y+40),k<.5?1:0)}}
 else if(s.id==='flip'){const [a,b]=P2(210,905),[d,e]=P2(316,905);const pl=Math.sin(t*6)>0;arrow(a-10,b+30,-Math.PI*.15);arrow(d+10,e+30,-Math.PI*.85);if(isTouch()){hand(vw*.22,vh*.8,pl?1:0);hand(vw*.78,vh*.8,pl?0:1)}}
 else if(s.id==='cradle'){const [a,b]=P2(190,880);c.strokeStyle='#ffd35a';c.lineWidth=3;c.setLineDash([6,6]);c.beginPath();c.arc(a,b,40*sc*2,0,TAU);c.stroke()}
 else if(s.id==='nudge'){if(isTouch()){const k=(t%1)/1;hand(vw/2,vh*.7-k*80,0)}else{const [a,b]=P2(263,700);c.globalAlpha=.6+.4*Math.sin(t*8);icon(c,'warn',a,b,40,'#ffd35a','#000')}}
 else if(s.id==='aim'){const sh=G.w.shots.find(q=>q.id==='scoop');const [a,b]=P2(sh.x,sh.y+40);arrow(a,b+40,-Math.PI/2)}
 c.restore()}

let LOGO=null;
function drawLogo(){const cn=$('#logo');const x=cn.getContext('2d'),w=cn.width,h=cn.height,t=G.t;x.clearRect(0,0,w,h);
 const fl=Math.sin(t*23)>.97?.4:1;
 x.save();x.globalAlpha=.9;const gg=x.createRadialGradient(w/2,h*.45,10,w/2,h*.45,w*.5);gg.addColorStop(0,'rgba(255,80,200,.35)');gg.addColorStop(1,'rgba(255,80,200,0)');x.fillStyle=gg;x.fillRect(0,0,w,h);x.restore();
 for(let i=0;i<5;i++){x.save();x.globalAlpha=.6;x.fillStyle='#ffd35a';star(x,w*(.08+i*.21),h*(.12+.06*Math.sin(t*2+i)),10+4*Math.sin(t*4+i),4,4,t+i);x.fill();x.restore()}
 if(!LOGO){LOGO={a:mk(w,h*.62),b:mk(w,h*.42)};const a=LOGO.a.getContext('2d');a.translate(w/2,h*.31);neon(a,'TILT',0,-h*.22,h*.42,{col:'#ffd35a',col2:'#8a2a00',chrome:1,depth:6,w:1.35,dk:'#3a0a20',glow:1.2,blur:1});const bb=LOGO.b.getContext('2d');bb.translate(w/2,h*.21);neon(bb,'PALACE',0,-h*.12,h*.24,{col:'#ff4fd8',depth:4,w:1.2,glow:1.6,blur:1})}
 x.save();x.translate(w/2,h*.36);x.rotate(-.05+Math.sin(t*1.3)*.01);x.drawImage(LOGO.a,-w/2,-h*.36);x.restore();
 x.save();x.globalAlpha=fl;x.translate(w/2,h*.78);x.rotate(.02);x.drawImage(LOGO.b,-w/2,-h*.21);x.restore();
 // ball
 const bx=w*.5+Math.cos(t*1.5)*w*.38,by=h*.62+Math.sin(t*3)*h*.04;x.save();const spr=ballSpr(P.fin||0,P.last||0,64);x.drawImage(spr,bx-h*.05,by-h*.05,h*.1,h*.1);x.restore()}
function updSndIcons(){const on=!S.mute;$('#bSndT').innerHTML=on?'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';$('#bSndP').textContent=on?'Sound ON':'Sound OFF';$('#bMusP').textContent=S.music?'Music ON':'Music OFF'}
function goTitle(){G.mode='title';G.attract=1;G.paused=0;G.tut=null;$('#tut').classList.remove('on');$('#tutSkip').classList.remove('on');$('#hud').classList.remove('on');G.ti=P.last||0;G.w=getWorld(G.ti);resetToys(G.w);R0=newState();G.balls=[];G.score=0;G.parts=[];G.calls=[];G.daily=null;G.br=BR;G.grav=1500;G.bumpMul=1;G.kickMul=1;G.endT=0;G.bonusAnim=null;G.tilted=0;serveBall(.3);setMusic(TABLES[G.ti].mus);MUS.intense=0;
 const r=sget('resume',null);$('#bCont').style.display=r?'':'none';$('#tsub').textContent=TABLES[G.ti].name+(P.best[G.ti]?' · best '+shortN(P.best[G.ti]):'');show('#title');layout()}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dailyDef(){const s=todayStr();let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))>>>0;return{date:s,ti:h%TABLES.length,mod:MODS[(h>>>4)%MODS.length].id}}
function gameOver(){G.mode='over';G.over=1;sdel('resume');$('#hud').classList.remove('on');dmd('gameover',99,{});const ti=G.ti,sc=G.score;G.balls=[];
 P.games++;unlock('first');const prevBest=P.best[ti]||0,prevUnl=P.unl,prevStars=starsFor(ti);let nb=false;
 if(G.daily){const d=P.daily;if(d.date!==G.daily.date){P.daily={date:G.daily.date,best:0}}if(sc>P.daily.best){P.daily.best=sc;nb=true}unlock('daily')}
 else{if(sc>prevBest){P.best[ti]=sc;nb=true}if(ti<TABLES.length-1&&P.best[ti]>=TABLES[ti].goal&&P.unl<ti+2)P.unl=ti+2}
 saveP();checkMeta();saveP();
 $('#overTable').textContent=G.daily?'Daily · '+TABLES[ti].name:TABLES[ti].name;$('#overBest').textContent=nb?'★ NEW BEST ★':'Best '+fmt(G.daily?P.daily.best:P.best[ti]);
 const st=starsFor(ti);$('#overStars').innerHTML=[0,1,2].map(i=>`<span class="${i<st?'on':''}" style="animation-delay:${.4+i*.25}s">★</span>`).join('');
 const ub=$('#unlockBan');if(P.unl>prevUnl){ub.style.display='block';ub.textContent='UNLOCKED: '+TABLES[P.unl-1].name;sfx('jackpot')}else ub.style.display='none';
 const oa=$('#overAch');oa.innerHTML='';(G.newAch||[]).forEach((a,i)=>{const cn=document.createElement('canvas');cn.width=80;cn.height=80;cn.style.animationDelay=(.6+i*.15)+'s';badgeArt(cn.getContext('2d'),a,80,1);cn.title=a[1];oa.appendChild(cn)});G.newAch=[];
 const ng=$('#nextGoal');if(!G.daily&&ti<TABLES.length-1&&P.unl<ti+2){const g=TABLES[ti].goal;ng.innerHTML=`<div style="margin-bottom:4px">🔒 ${TABLES[ti+1].name} at ${shortN(g)}</div><div class="bar"><i style="width:${clamp(P.best[ti]/g*100,2,100)}%"></i></div>`}else if(!G.daily){const g=TABLES[ti].goal*2.5;ng.innerHTML=P.best[ti]<g?`<div style="margin-bottom:4px">Next ★ at ${shortN(g)}</div><div class="bar"><i style="width:${clamp(P.best[ti]/g*100,2,100)}%"></i></div>`:(P.wiz[ti]?'Table mastered!':'★ Reach wizard mode')}else ng.textContent='';
 animScore(sc);setTimeout(()=>show('#over'),900)}
function animScore(v){const el=$('#overScore');const t0=performance.now();const f=()=>{const k=Math.min(1,(performance.now()-t0)/1400);el.textContent=fmt(v*eOut(k));if(k<1)requestAnimationFrame(f)};f()}
function buildTables(){const g=$('#tgrid');g.innerHTML='';const s=Math.min(.19,vh*.00024+.06);
 const mkCard=(i,daily)=>{const D=TABLES[i];const lock=!daily&&i>=P.unl;const card=document.createElement('div');card.className='card'+(lock?' lock':'');const w=getWorld(i);const cs=Math.max(.1,Math.min(.17,vh/5200,vw/2900));const r=renderStatic(w,cs*dpr);const top=renderTop(w,cs*dpr);const cn=mk(W*cs*dpr,H*cs*dpr);const x=cn.getContext('2d');x.drawImage(r.pf,0,0);x.save();x.scale(cs*dpr,cs*dpr);drawBoss(x,w.boss.key,w.boss.x,w.boss.y,1,{hit:0,open:0,hp:1,max:1},0,D.pal);w.bumpers.forEach(b=>drawBumper(x,b,D.pal,0));w.fl.forEach(f=>drawFlipper(x,f,D.pal));x.restore();x.drawImage(top,0,0);cn.style.width=W*cs+'px';cn.style.height=H*cs+'px';card.appendChild(cn);
  const ci=document.createElement('div');ci.className='ci';
  if(daily){const M=MODS.find(m=>m.id===daily.mod);ci.innerHTML=`<div class="nm">Daily Table</div><div class="bs">${D.name}</div><div class="mod" style="justify-content:flex-start;margin:0"><canvas width="44" height="44" style="width:22px;height:22px"></canvas>${M.name}</div><div class="bs">Today ${P.daily.date===daily.date?shortN(P.daily.best):'—'}</div>`;card.insertAdjacentHTML('afterbegin','<div class="tag">TODAY</div>');icon(ci.querySelector('canvas').getContext('2d'),M.ic,22,22,40,'#ffd35a','#000');card.onclick=()=>{sfx('click');startGame(daily.ti,{daily})}}
  else{const st=starsFor(i);ci.innerHTML=`<div class="nm">${D.name}</div><div class="st">${'★'.repeat(st)}<span style="opacity:.25">${'★'.repeat(3-st)}</span></div><div class="bs">${lock?'Score '+shortN(TABLES[i-1].goal)+' on '+TABLES[i-1].name:'Best '+shortN(P.best[i])}</div>`+(lock?`<div class="bar"><i style="width:${clamp((P.best[i-1]||0)/TABLES[i-1].goal*100,2,100)}%"></i></div>`:'');

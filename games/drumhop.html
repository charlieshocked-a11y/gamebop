<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Drumhop</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1b5a3e;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff4dc;user-select:none;-webkit-user-select:none;touch-action:none}
canvas#c{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;pointer-events:none}
.scr.on{display:flex}
.scr .pe,.scr button,.scr a{pointer-events:auto}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
/* wooden plank buttons */
.btn{position:relative;font-weight:900;letter-spacing:.04em;color:#fff6e0;padding:12px 22px;border-radius:14px 9px 15px 10px;
 background:repeating-linear-gradient(92deg,rgba(0,0,0,.0) 0 13px,rgba(70,30,8,.16) 13px 15px,rgba(0,0,0,0) 15px 31px),linear-gradient(#c7803f,#9a5524);
 box-shadow:0 5px 0 #5b2c10,0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,230,180,.45);border:2px solid #5b2c10;
 text-shadow:0 2px 0 #5b2c10;transition:transform .12s cubic-bezier(.3,1.8,.5,1),box-shadow .1s;transform:rotate(var(--r,-1deg))}
.btn:hover{transform:rotate(var(--r,-1deg)) scale(1.05)}
.btn:active,.btn.press{transform:rotate(var(--r,-1deg)) translateY(4px) scale(.97);box-shadow:0 1px 0 #5b2c10,0 3px 6px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,230,180,.3)}
.btn svg{width:20px;height:20px;vertical-align:-4px;margin-right:6px;fill:none;stroke:#fff6e0;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 2px 0 #5b2c10)}
.btn.play{font-size:30px;padding:14px 46px 16px;border-radius:22px 18px 24px 16px;--r:1deg;
 background:radial-gradient(ellipse at 50% 0,rgba(255,240,200,.55),rgba(255,240,200,0) 60%),linear-gradient(#ff7b45,#d9401f);border-color:#7a1d08;box-shadow:0 6px 0 #7a1d08,0 10px 20px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,220,180,.6);text-shadow:0 3px 0 #7a1d08}
.btn.play:active{box-shadow:0 1px 0 #7a1d08,0 3px 8px rgba(0,0,0,.3)}
.btn.green{background:repeating-linear-gradient(92deg,rgba(0,0,0,0) 0 13px,rgba(0,40,10,.14) 13px 15px,rgba(0,0,0,0) 15px 31px),linear-gradient(#5fc65a,#2f8a3a);border-color:#174d1d;box-shadow:0 5px 0 #174d1d,0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(220,255,200,.45);text-shadow:0 2px 0 #174d1d}
.btn.sm{font-size:15px;padding:9px 14px}
.ib{width:44px;height:44px;border-radius:50% 46% 52% 48%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#c7803f,#9a5524);border:2px solid #5b2c10;box-shadow:0 4px 0 #5b2c10,0 6px 10px rgba(0,0,0,.3);transition:transform .12s}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 #5b2c10}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff6e0;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#corner{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));display:flex;gap:8px;z-index:30}
/* title */
#title{flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:max(8vh,40px)}
#title .tb{display:flex;flex-direction:column;align-items:center;gap:14px}
#title .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#support{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff6e6;opacity:.55;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.3px;z-index:31}
#support:hover{opacity:1}
#tNotes{font-weight:900;font-size:15px;color:#ffe08a;text-shadow:0 2px 0 rgba(60,30,0,.6);display:flex;align-items:center;gap:6px}
/* hud */
#hud{z-index:20}
#bPause{position:fixed;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
/* tutorial */
#tut{z-index:25;flex-direction:column;align-items:center}
#tutCap{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-weight:900;font-size:clamp(20px,4.6vw,34px);color:#fff;white-space:nowrap;
 text-shadow:0 3px 0 #5b2c10,0 0 18px rgba(0,0,0,.4);padding:10px 22px;border-radius:30px 26px 32px 24px;background:rgba(91,44,16,.55);transition:opacity .3s,transform .3s}
#tutCap.pop{animation:cap .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes cap{from{transform:translateX(-50%) scale(.5);opacity:0}}
#tutHint{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);display:flex;align-items:center;gap:14px}
.key{font-weight:900;font-size:16px;color:#3a1c08;background:linear-gradient(#fff8e6,#e8d2a6);border-radius:9px;padding:8px 16px;box-shadow:0 5px 0 #8a6a3a;transition:transform .06s,box-shadow .06s}
.key.dn{transform:translateY(4px);box-shadow:0 1px 0 #8a6a3a}
#hand{width:56px;height:64px;transition:transform .06s}
#hand.dn{transform:translateY(8px) scale(.94)}
#tutSkip{position:fixed;top:calc(12px + env(safe-area-inset-top));left:calc(12px + env(safe-area-inset-left));z-index:26}
/* overlays */
.ov{background:rgba(20,10,4,.45);align-items:center;justify-content:center;z-index:40}
.card{pointer-events:auto;position:relative;min-width:min(400px,92vw);max-width:94vw;padding:22px 24px 20px;border-radius:26px 20px 28px 22px;text-align:center;
 background:radial-gradient(ellipse at 50% -10%,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 21px,rgba(90,50,10,.07) 21px 23px),linear-gradient(#f9e2b0,#e9c27f);
 color:#4a250d;border:3px solid #6b3613;box-shadow:0 8px 0 #6b3613,0 16px 40px rgba(0,0,0,.45);animation:cardin .45s cubic-bezier(.25,1.6,.5,1)}
@keyframes cardin{from{transform:translateY(40px) scale(.85);opacity:0}}
.card h2{font-size:30px;font-weight:900;letter-spacing:.03em;color:#8a2e10;text-shadow:0 2px 0 #fff3d0}
.card .row{display:flex;gap:10px;justify-content:center;align-items:center;margin-top:14px;flex-wrap:wrap}
.stars{display:flex;justify-content:center;gap:6px;margin:10px 0 6px}
.star{width:58px;height:58px;clip-path:polygon(50% 0,61.8% 35%,98% 35.4%,68.9% 57.3%,79.4% 91%,50% 70.5%,20.6% 91%,31.1% 57.3%,2% 35.4%,38.2% 35%);background:#b88a52;transform:scale(.9)}
.star.mid{width:70px;height:70px;margin-top:-10px}
.star.on{background:radial-gradient(circle at 40% 30%,#fffbe0,#ffd23d 45%,#f09a0c);animation:spop .5s cubic-bezier(.3,2,.5,1)}
@keyframes spop{0%{transform:scale(2.2) rotate(-30deg);opacity:0}100%{transform:scale(1)}}
.stat{display:flex;justify-content:center;gap:14px;font-weight:900;font-size:15px;margin:6px 0}
.stat div{display:flex;flex-direction:column;align-items:center;min-width:60px}
.stat small{font-size:11px;letter-spacing:.08em;opacity:.7}
.stat b{font-size:22px}
#rScore{font-size:40px;font-weight:900;color:#8a2e10;line-height:1}
#rNotes{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:22px;color:#a35a00;margin-top:6px}
#rTag{font-weight:900;color:#d0381c;font-size:16px;height:20px;letter-spacing:.06em}
#rTag.b{animation:blink .45s infinite alternate}
@keyframes blink{to{opacity:.35}}
.peek{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;padding:6px 12px;border-radius:16px;background:rgba(107,54,19,.12)}
.peek canvas{width:84px;height:56px}
.peek small{display:block;font-size:11px;letter-spacing:.12em;opacity:.7;font-weight:900}
.peek b{font-size:18px}
#bNext{min-width:150px}
/* map */
#map,#shop{z-index:35;flex-direction:column;align-items:center;background:rgba(14,30,20,.35)}
.top{width:min(860px,100vw);display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:calc(10px + env(safe-area-inset-top)) 112px 6px 12px;pointer-events:auto}
.top h3{font-size:24px;font-weight:900;text-shadow:0 3px 0 rgba(60,30,0,.6);margin-right:auto}
.pill{display:flex;align-items:center;gap:5px;font-weight:900;font-size:16px;padding:6px 12px;border-radius:20px;background:rgba(60,28,8,.55);color:#ffe08a}
.scroll{pointer-events:auto;width:min(860px,100vw);flex:1;overflow-y:auto;padding:4px 12px 30px;touch-action:pan-y;scrollbar-width:thin}
.world{border-radius:24px 20px 26px 18px;padding:12px 12px 14px;margin:10px 0 14px;border:3px solid rgba(0,0,0,.25);box-shadow:0 6px 0 rgba(0,0,0,.2);position:relative;overflow:hidden}
.world h4{font-size:20px;font-weight:900;text-shadow:0 2px 0 rgba(0,0,0,.4);display:flex;align-items:center;gap:8px}
.world h4 span{margin-left:auto;font-size:14px;opacity:.9}
.songs{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px;margin-top:10px}
.sd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:16px;transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.sd:hover{transform:scale(1.07) rotate(-2deg)}
.sd:active{transform:scale(.95)}
.sd .dr{width:66px;height:66px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;color:#5b2c10;
 background:radial-gradient(circle,#fff3cf 0 54%,rgba(0,0,0,.25) 55%,transparent 58%),repeating-conic-gradient(var(--a) 0 12deg,var(--b) 12deg 24deg);box-shadow:0 5px 0 rgba(0,0,0,.3)}
.sd.cur .dr{animation:bob .7s infinite alternate ease-in-out}
@keyframes bob{to{transform:translateY(-5px) scale(1.05)}}
.sd .nm{font-size:12px;font-weight:900;text-shadow:0 1px 0 rgba(0,0,0,.5);text-align:center;line-height:1.1;min-height:26px}
.sd .st{font-size:12px;color:#ffd23d;letter-spacing:1px;text-shadow:0 1px 0 #000}
.sd.lock{opacity:.5;filter:saturate(.3)}
.sd.lock .dr{color:#333}
.sd .wild{position:absolute;right:-6px;top:-6px;font-size:11px;background:#e2341c;color:#fff;border-radius:10px;padding:1px 5px;font-weight:900}
.tog{display:flex;border-radius:20px;overflow:hidden;border:2px solid #5b2c10;box-shadow:0 3px 0 #5b2c10}
.tog button{font-weight:900;font-size:14px;padding:6px 12px;background:#e9c27f;color:#5b2c10}
.tog button.on{background:#e2341c;color:#fff}
.tog button.on.n{background:#2f8a3a}
/* shop */
.tabs{display:flex;gap:8px;margin:4px 0}
.ups{display:flex;flex-direction:column;gap:10px}
.up{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px 14px 20px 15px;background:linear-gradient(#f9e2b0,#e9c27f);color:#4a250d;border:2px solid #6b3613;box-shadow:0 4px 0 #6b3613}
.up .ic{width:46px;height:46px;flex:none;border-radius:50%;background:#7a3e16;display:flex;align-items:center;justify-content:center}
.up .ic svg{width:28px;height:28px;fill:none;stroke:#ffe08a;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.up .tx{flex:1;min-width:0}
.up .tx b{font-size:17px;display:block}
.up .tx small{font-size:12px;opacity:.75}
.pips{display:flex;gap:3px;margin-top:4px;flex-wrap:wrap}
.pips i{width:10px;height:10px;border-radius:3px;background:rgba(107,54,19,.25)}
.pips i.on{background:#e2741c}
.buy{min-width:96px;font-size:15px!important}
.buy.no{filter:grayscale(.8);opacity:.7}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.sk{display:flex;flex-direction:column;align-items:center;padding:8px 4px;border-radius:18px;background:linear-gradient(#f9e2b0,#e9c27f);border:2px solid #6b3613;box-shadow:0 4px 0 #6b3613;color:#4a250d;font-weight:900;font-size:13px;gap:2px}
.sk canvas{width:64px;height:64px}
.sk.sel{background:linear-gradient(#ffe98a,#ffbf3a);outline:3px solid #fff}
.sk.lock canvas{filter:saturate(.35) brightness(.7);opacity:.75}
.sk small{font-size:12px;color:#a35a00}
.noteic{width:16px;height:18px;display:inline-block}
#cal .big{font-size:44px;font-weight:900;color:#8a2e10;margin:6px 0}
#cal .dots{display:flex;gap:6px;justify-content:center;margin:10px 0}
#cal .dots i{width:14px;height:14px;border-radius:50%;background:rgba(107,54,19,.25)}
#cal .dots i.on{background:#e2741c}
#toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);font-weight:900;font-size:20px;padding:8px 18px;border-radius:20px;background:rgba(60,28,8,.8);color:#ffe08a;z-index:60;display:none;white-space:nowrap}
@media (max-width:560px){.btn.play{font-size:26px;padding:12px 36px 14px}.btn.sm{font-size:14px;padding:8px 11px}.card{padding:16px 14px}.star{width:48px;height:48px}.star.mid{width:58px;height:58px}#rScore{font-size:34px}.top h3{font-size:20px}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="title" class="scr on">
 <div class="tb">
  <div id="tNotes" class="pe"></div>
  <button id="bPlay" class="btn play">PLAY</button>
  <div class="row">
   <button id="bSongs" class="btn sm" style="--r:-2deg"><svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/><path d="M9 18V5l12-2v13"/></svg>Songs</button>
   <button id="bShop" class="btn sm green" style="--r:1.5deg"><svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/></svg>Shop</button>
   <button id="bHow" class="btn sm" style="--r:-1deg"><svg viewBox="0 0 24 24"><path d="M9 11V5a2 2 0 0 1 4 0v6"/><path d="M13 10a2 2 0 0 1 4 0v4a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a2 2 0 0 1 3-2l2 2"/></svg>How to play</button>
  </div>
 </div>
 <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="corner">
 <button id="bSync" class="ib" title="Sync"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 13l3-3M12 2v3M9 2h6"/></svg></button>
 <button id="bMute" class="ib" title="Sound"></button>
</div>

<div id="hud" class="scr">
 <button id="bPause" class="ib pe" title="Pause"><svg viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
</div>

<div id="tut" class="scr">
 <div id="tutCap"></div>
 <div id="tutHint"><svg id="hand" viewBox="0 0 56 64"><path d="M22 34V10a5 5 0 0 1 10 0v18l12 3a6 6 0 0 1 5 7l-3 14a10 10 0 0 1-10 8H28a10 10 0 0 1-8-4l-9-12a4.5 4.5 0 0 1 7-6z" fill="#fff6e0" stroke="#5b2c10" stroke-width="3" stroke-linejoin="round"/></svg><span class="key" id="tutKey">SPACE</span></div>
 <button id="tutSkip" class="btn sm skip" aria-label="Skip tutorial" data-testid="skip" title="Skip tutorial">Skip ▸▸</button>
</div>

<div id="pause" class="scr ov">
 <div class="card">
  <h2>Paused</h2>
  <div class="row"><button id="pRes" class="btn play" style="font-size:24px">▶ Resume</button></div>
  <div class="row"><button id="pRe" class="btn sm">↻ Restart</button><button id="pMap" class="btn sm green">Songs</button></div>
 </div>
</div>

<div id="res" class="scr ov">
 <div class="card" id="resCard">
  <h2 id="rTitle">Nice!</h2>
  <div class="stars"><div class="star" id="s1"></div><div class="star mid" id="s2"></div><div class="star" id="s3"></div></div>
  <div id="rTag"></div>
  <div id="rScore">0</div>
  <div class="stat"><div><small>PERFECT</small><b id="rP">0</b></div><div><small>GOOD</small><b id="rG">0</b></div><div><small>MISS</small><b id="rM">0</b></div><div><small>COMBO</small><b id="rC">0</b></div></div>
  <div id="rNotes"></div>
  <div class="peek" id="peek"><canvas id="peekC" width="168" height="112"></canvas><div><small id="peekL">NEXT</small><b id="peekN"></b></div></div>
  <div class="row"><button id="rMap" class="btn sm green" title="Songs"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button id="rRe" class="btn sm" title="Retry"><svg viewBox="0 0 24 24" style="margin:0"><path d="M4 12a8 8 0 1 0 3-6.3"/><path d="M4 4v5h5"/></svg></button><button id="bNext" class="btn play" style="font-size:24px">NEXT ▶</button></div>
 </div>
</div>

<div id="map" class="scr">
 <div class="top"><button id="mBack" class="ib pe"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h3>Songs</h3>
  <div class="tog pe"><button id="mN" class="n on">Normal</button><button id="mW">Wild</button></div>
  <div class="pill" id="mStars"></div><div class="pill" id="mNotes"></div></div>
 <div class="scroll" id="mapBody"></div>
</div>

<div id="shop" class="scr">
 <div class="top"><button id="sBack" class="ib pe"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h3>Shop</h3><div class="pill" id="sNotes"></div></div>
 <div class="scroll"><div class="tabs"><button id="tU" class="btn sm">Upgrades</button><button id="tS" class="btn sm green">Balls</button></div><div id="shopBody"></div></div>
</div>

<div id="cal" class="scr ov">
 <div class="card">
  <h2>Sync</h2>
  <div style="font-weight:900">Tap with the clicks</div>
  <div class="dots" id="calDots"></div>
  <div class="big" id="calV">0 ms</div>
  <div class="row"><button id="cAgain" class="btn sm">↻ Again</button><button id="cZero" class="btn sm">0</button><button id="cDone" class="btn sm green">Done</button></div>
 </div>
</div>
<div id="toast"></div>

<script>
'use strict';
// ================= helpers =================
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const easeOut=t=>1-Math.pow(1-t,3),easeBack=t=>{const c=1.9;t-=1;return 1+(c+1)*t*t*t+c*t*t};
function rngf(seed){let s=(seed>>>0)||1;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const $=s=>document.querySelector(s);
const cv=$('#c');let cx=cv.getContext('2d');
const KEY='gamebop.drumhop.';
function lsGet(k,d){try{const v=localStorage.getItem(KEY+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(KEY+k,JSON.stringify(v))}catch(e){}}
const mtof=m=>440*Math.pow(2,(m-69)/12);
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16)+','+(n>>8&255)+','+(n&255)+','+a+')'}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const r=Math.round(lerp(a>>16,b>>16,t)),g=Math.round(lerp(a>>8&255,b>>8&255,t)),bl=Math.round(lerp(a&255,b&255,t));return '#'+((1<<24)|(r<<16)|(g<<8)|bl).toString(16).slice(1)}

// ================= data =================
const WORLDS=[

function defSave(){return{songs:{},notes:0,earned:0,up:{},skins:['classic'],skin:'classic',golds:0,plays:0,wild:false,started:false,bought:{}}}
let save=Object.assign(defSave(),lsGet('save',{})||{});
if(typeof save.songs!=='object'||!save.songs)save.songs={};
let muted=!!lsGet('mute',false),offset=+lsGet('offset',0)||0,tutDone=!!lsGet('tut',false);
function persist(){lsSet('save',save)}
const upL=id=>save.up[id]|0;
const upCost=(u,l)=>Math.round(u.base*Math.pow(u.gr,l)/5)*5;
function songRec(id){return save.songs[id]||(save.songs[id]={stars:0,best:0,wst:0,wbest:0,clr:0})}
function totalStars(){let s=0;for(const k in save.songs)s+=(save.songs[k].stars|0);return s}
const GATES=[0,8,18,28];
function unlocked(i){const s=SONGS[i];if(s.bonus)return !!save.bought[s.id];if(totalStars()<GATES[s.w])return false;let j=i-1;while(j>=0&&SONGS[j].bonus)j--;if(j<0)return true;return (songRec(SONGS[j].id).clr|0)>0}
function nextSongIdx(){for(let i=0;i<SONGS.length;i++){if(SONGS[i].bonus)continue;if(unlocked(i)&&!(songRec(SONGS[i].id).clr))return i}let last=0;for(let i=0;i<SONGS.length;i++)if(!SONGS[i].bonus&&unlocked(i))last=i;return last}

}

const STABP=['pad','....x.......x...','..x...x...x...x.','....x..x....x...','x..x..x...x..x..'];
const MELR=['x.x.x...x.x.x...','x..x..x.x...x...','x...x.x...x.x.x.','x.x...x.x.x.x...','x..x..x...x.x...','x.xx..x.x..x.x..'];

function terrainY(x,seed){return -(130+62*Math.sin(x*.0029+seed)+30*Math.sin(x*.0083+seed*2.3)+12*Math.sin(x*.021+seed))}
function addDrum(g,beat,type,o){
 o=o||{};const D=g.drums;const prev=D[D.length-1];const bd=g.bd;
 const d={beat,t:beat*bd,type,stayB:o.stayB||0,stay:(o.stayB||0)*bd,len:0,x:0,y:0,w:70,state:0,grade:null,hm:1,hT:.85,h0:60,fx:0,rip:[],golden:!!o.golden,pitch:o.pitch||0,callT:o.callT!=null?o.callT*bd:null,revealed:o.callT==null,ph:0,amp:0,tilt:0,tv:0,tag:o.tag||null,hidden:0,hold:o.hold||0};

  prev.h0=clamp(26+gapB*78,24,330)*(prev.type==='cym'?1.9:1);if(prev.type==='cym')prev.h0=Math.max(prev.h0,250)}

 if(type==='start'||type==='finish')d.w=type==='finish'?150:96;
 const wk=WORLDS[g.song.w].kind;
 d.y=terrainY(d.x,g.song.seed);
 if(type==='hold')d.y=terrainY(d.x+d.len/2,g.song.seed);
 if(type==='move'){d.amp=34+((beat*7)%3)*10;d.ph=(beat*1.7)%TAU;if(wk==='river')d.y=-34}

 if(type==='finish')d.y=-150;

}
function buildChart(g){
 const song=g.song,bd=g.bd;const rows=expandBars(song.bars);let bar=1;
 const r=rngf(song.seed*977+(g.wild?5:0));
 const st=addDrum(g,0,'start',{stayB:3});
 const pent=PENTS[song.mode];
 let firstOf={};
 for(const row of rows){
  if(row[0]==='B'||row[0]==='T'){
   const pat=row.slice(1),kind=row[0]==='B'?'bird':'boss';let first=pat.search(/[xH]/);if(first<0)first=0;
   addDrum(g,bar*4,'perch',{stayB:3+first/4,tag:kind==='bird'&&!firstOf.bcall?'Listen!':(kind==='boss'&&!firstOf.bcall?'Watch him!':null)});firstOf.bcall=1;
   let pi=(r()*5)|0;
   for(let s=0;s<16;s++){const c=pat[s];if(c==='x'||c==='H'){let len=0;if(c==='H'){let k=s+1;while(pat[k]==='=')k++;len=(k-s)/4}
     pi=clamp(pi+((r()*5)|0)-2,0,9);const midi=song.root+12+pent[pi%5]+12*Math.floor(pi/5);
     const cb=bar*4+s/4;const step=Math.round(cb*4);(g.calls[step]=g.calls[step]||[]).push({kind,midi,len});
     addDrum(g,(bar+1)*4+s/4,len?'hold':kind,{stayB:len,pitch:midi,callT:cb,tag:!firstOf[kind]?'Your turn!':null,hold:len?1:0});
     if(len)g.drums[g.drums.length-1].call=kind;firstOf[kind]=1}}
   bar+=2;continue}
  for(let s=0;s<16;s++){const c=row[s];const beat=bar*4+s/4;let type=null,o={};
   if(c==='x')type='n';else if(c==='o')type='off';else if(c==='m')type='move';else if(c==='C')type='cym';
   else if(c==='H'){type='hold';let k=s+1;while(row[k]==='=')k++;o.stayB=(k-s)/4}
   if(!type)continue;
   if(song.nw&&!firstOf[type]&&((song.nw==='hold'&&type==='hold')||(song.nw==='cym'&&type==='cym')||(song.nw==='off'&&type==='off')||(song.nw==='move'&&type==='move'))){o.tag={hold:'Hold!',cym:'Fly!',off:'Off-beat!',move:'Watch it!'}[type]}
   firstOf[type]=1;
   addDrum(g,beat,type,o)}
  bar++;
 }
 g.endBar=bar;
 // wild densify
 if(g.wild){const D=g.drums;const add=[];for(let i=1;i<D.length-1;i++){const a=D[i],b=D[i+1];if(!['n','off','move'].includes(a.type)||!['n','off','move'].includes(b.type))continue;const gap=b.beat-a.beat;

  if(add.length){const old=D.slice();g.drums=[];for(const d of old){}const all=old.map(d=>({beat:d.beat,type:d.type,o:{stayB:d.stayB,pitch:d.pitch,callT:d.callT!=null?d.callT/bd:null,tag:d.tag,hold:d.hold,call:d.call}})).concat(add.map(a=>({beat:a[0],type:a[1],o:{}})));all.sort((x,y)=>x.beat-y.beat);for(const e of all){const nd=addDrum(g,e.beat,e.type,e.o);if(e.o.call)nd.call=e.o.call}}}
 const last=g.drums[g.drums.length-1];addDrum(g,Math.ceil(last.beat+last.stayB+1.01)+1,'finish');
 g.endBar=Math.ceil(g.drums[g.drums.length-1].beat/4)+1;
 // goldens
 const gch=song.bonus?1:(.025+upL('gold')*.006);
 for(const d of g.drums){if((d.type==='n'||d.type==='move')&&r()<gch)d.golden=true}
 // boss hp
 g.bossMax=g.drums.filter(d=>d.type==='boss'||(d.call==='boss')).length;g.bossHP=g.bossMax;

}

function schedule(){

  const n=G.schedStep,t=G.songStart+n*sd;if(t>ahead)break;G.schedStep++;

  return out}
 const n=D[k+1];const p0=dpos(d,te),p1=dpos(n,n.t);const u=(t-te)/(n.t-te);

 for(let i=0;i<TITLE.length;i++){const land=hopI===i?Math.exp(-u*7):0;const di=clamp(intro*TITLE.length*1.2-i,0,1);const dy=(1-easeBack(di))*-H*.6;
  const lx=pos[i],ly=ty+dy+land*fs*.08;
  cx.save();cx.translate(lx,ly);cx.rotate(Math.sin(T*2+i)*.04);cx.scale(1+land*.12,1-land*.15);
  cx.textAlign='left';cx.textBaseline='middle';cx.fillStyle='rgba(40,16,4,.35)';cx.fillText(TITLE[i],-ws[i]*.5+fs*.05,fs*.1);
  const g=cx.createLinearGradient(0,-fs*.5,0,fs*.4);const cols=[['#fff07a','#ff9a1f'],['#ffb0c0','#ff4a6a'],['#bff7a0','#3fbf4a'],['#a8e8ff','#2f8fd6']][i%4];g.addColorStop(0,cols[0]);g.addColorStop(1,cols[1]);
  cx.textAlign='left';cx.textBaseline='middle';cx.lineJoin='round';cx.lineWidth=fs*.14;cx.strokeStyle='#4a1d08';cx.strokeText(TITLE[i],-ws[i]*.5,0);cx.fillStyle=g;cx.fillText(TITLE[i],-ws[i]*.5,0);
  cx.fillStyle='rgba(255,255,255,.45)';cx.beginPath();cx.ellipse(-ws[i]*.1,-fs*.22,ws[i]*.18,fs*.05,-.3,0,TAU);cx.fill();
  cx.restore()}
 // ball
 if(intro>=1&&hopI>=-1&&!(H>W*1.1)){const a=hopI<0?pos[0]-ws[0]*1.2:pos[Math.min(hopI,TITLE.length-1)],b=hopI+1<TITLE.length?pos[hopI+1]:pos[TITLE.length-1]+ws[0]*1.5;
  const bx=hopI>=TITLE.length-1?lerp(a,b,u):lerp(a,b,u),by=ty-fs*.55-Math.sin(u*Math.PI)*fs*.7;
  const sq=Math.exp(-u*9)*.25;if(hopI<TITLE.length){drawBall(cx,bx,by+sq*fs*.1,fs*.2,SK(),1+sq,1-sq,T*4,u<.3?1:0,0,(T%3)<.1,1);if(u<.1)for(let k=0;k<1;k++)parts.push({scr:1,x:bx,y:by,vx:-40,vy:-60,g:-30,life:0,max:1,type:'note',c:noteColor(),sz:fs*.12,rot:0,vr:0,ws:1})}}
 // portrait: demo drums with a hopping ball fill the space
 if(H>W*1.1){const xs=[.2,.5,.8].map(f=>W*f),dy=gy-8*Z;const bt=T/bd,bi=Math.floor(bt),bu=bt-bi;const from=((bi%4)+4)%4,seq=[0,1,2,1],a=seq[from],b2=seq[(from+1)%4];
  for(let i=0;i<3;i++){const land=(seq[from]===i)?Math.exp(-bu*8):0;post(cx,xs[i],dy-30*Z,gy+4,7*Z,'#8a5a2c');cx.save();cx.translate(xs[i],dy-70*Z);cx.scale(Z,Z);cyl(cx,0,0,74,46,'#e2532f','#a3301a','#fff0c2','#ffe7a8',land,land*.6);cx.restore()}
  const bx=lerp(xs[a],xs[b2],bu),by=dy-70*Z-R*Z-Math.sin(bu*Math.PI)*90*Z;const sq=Math.exp(-bu*10)*.22;drawBall(cx,bx,by+sq*R*Z,R*Z*1.15,SK(),1+sq,1-sq,T*3,bu<.25?1:0,0,(T%3.3)<.12,b2>a?1:-1)}
 // subtitle tagline
 txt('tap the beat · hop the drums',W/2,ty+fs*.75,sm?15:20,'#fff6e0');
 drawParts(true);
}

// ================= peek canvas =================
function drawPeek(song){const c=$('#peekC').getContext('2d');c.clearRect(0,0,168,112);const w=WORLDS[song.w];const g=c.createLinearGradient(0,0,0,112);g.addColorStop(0,w.sky[0]);g.addColorStop(1,w.sky[2]);c.fillStyle=g;c.beginPath();c.roundRect?c.roundRect(0,0,168,112,16):c.rect(0,0,168,112);c.fill();
 const saveCx=cx;const oldG=G;G=G||{song,bd:.6};
 const nw=song.nw;
 cx=c;try{
  if(nw==='hold'){const d={type:'hold',x:40,y:70,len:80,w:60,fx:0,rip:[],state:0,stay:1,t:0,call:null,tag:null};c.save();drawDrumSimple(c,'hold',70,74,w)}
  else if(nw==='bird'||nw==='bird2'||nw==='storm'){drawBird(c,96,60,1,1,0);drawNote(c,48,46,16,'#2bc0b0',1)}
  else if(nw==='boss'){drawToad(c,92,108,.45,{bd:.5,bossHurt:0,bossLaugh:0,bossHP:1,bossMax:1},0)}
  else drawDrumSimple(c,nw,84,62,w)
 }catch(e){}cx=saveCx;G=oldG}
function drawDrumSimple(c,nw,x,y,w){
 if(nw==='hold'){c.fillStyle='#9a5e2a';c.fillRect(x-56,y,112,24);c.fillStyle=w.head;c.fillRect(x-50,y-5,100,10);c.fillStyle='#e8c89a';c.beginPath();c.ellipse(x+56,y+12,6,12,0,0,TAU);c.fill();drawBall(c,x-30,y-20,15,SK(),1,1,0,1,0,0,1);return}
 if(nw==='cym'){c.strokeStyle='#555';c.lineWidth=3;c.beginPath();c.moveTo(x,y);c.lineTo(x,112);c.stroke();c.fillStyle='#ffd84d';c.beginPath();c.ellipse(x,y,46,7,-.1,0,TAU);c.fill();drawBall(c,x+20,y-50,15,SK(),1,1,0,-1,0,0,1);return}
 let c1=w.drum,c2=w.drum2;if(nw==='off'){c1='#ff9a1f';c2='#b65200'}if(nw==='bonus'){c1='#ffd84d';c2='#c18208'}
 const n=nw==='double'||nw==='fast'?3:1;for(let i=0;i<n;i++){const xx=n>1?x-44+i*44:x;cyl(c,xx,y,n>1?36:64,n>1?28:40,c1,c2,w.head,w.rope,0,0)}
 if(nw==='move'){c.fillStyle='#57b85e';c.beginPath();c.ellipse(x,y+50,52,10,0,0,TAU);c.fill()}
 drawBall(c,x-(n>1?44:0),y-24,14,SK(),1,1,0,1,0,0,1)}

// ================= calibration render =================
function renderCal(){renderMenu();if(!CAL)return;const t=ctxNow()-lat()-CAL.start;const i=Math.floor(t/CAL.bd);const u=t/CAL.bd-i;const p=i>=0&&i<CAL.n?Math.exp(-u*7):0;
 const x=W/2,y=H*.22;cx.save();cx.translate(x,y);cx.scale(1+p*.15,1-p*.1);cyl(cx,0,0,110,60,'#e2532f','#a3301a','#fff0c2','#ffe7a8',p,p);cx.restore()}

// ================= loop =================
const BOOT=performance.now();let lastF=performance.now();const FPSA=[];
function frame(now){
 requestAnimationFrame(frame);
 let dt=(now-lastF)/1000;lastF=now;FPSA.push(now);while(FPSA.length&&now-FPSA[0]>1000)FPSA.shift();if(!(dt>0))dt=.016;dt=Math.min(dt,.05);T+=dt;
 cx.setTransform(DPR,0,0,DPR,0,0);
 shake=Math.max(0,shake-dt*30);flash=Math.max(0,flash-dt*2.2);
 if((mode==='play'||mode==='results')&&G){const st=updatePlay(G.paused?0:dt);renderPlay(st);if(mode==='results'){cx.fillStyle='rgba(20,10,4,.2)';cx.fillRect(0,0,W,H)}}
 else if(mode==='calib')renderCal();
 else renderMenu();
 stepParts(G&&G.paused?0:dt);
}
// debug hook for tests
window.__dhStart=(i,w)=>startSong(i,{wild:w});
window.__dh={fps:()=>FPSA.length,upcoming(){if(!G)return[];nextPending();const st=songT(),o=[];for(let i=G.pend;i<G.drums.length&&o.length<6;i++){const d=G.drums[i];if(d.state===0&&d.type!=='finish'&&d.type!=='start')o.push({dt:d.t-st,type:d.type,stay:d.stay,i})}return o},get mode(){return mode},get G(){return G},songT:()=>G?songT():0,nextIn(){if(!G)return null;const d=nextPending();if(!d)return null;return{dt:d.t-songT(),type:d.type,stay:d.stay,revealed:d.revealed}},save:()=>save,lat};
resize();setMute(muted);refreshTitle();requestAnimationFrame(frame);

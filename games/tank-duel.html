<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a2440;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS','Segoe UI',Verdana,system-ui,sans-serif;color:#fff}

.ov.on{display:flex}
.dim{background:rgba(10,14,28,.76);backdrop-filter:blur(3px)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;margin-bottom:10px;animation:bob 2.6s ease-in-out infinite}
.logo span{font-weight:900;font-size:min(15vw,18vh,140px);letter-spacing:.05em;background:linear-gradient(180deg,#fffbe0 0%,#ffd84a 40%,#ff9a2a 70%,#c8401a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2a0a) drop-shadow(0 8px 0 #1e0c04) drop-shadow(0 0 22px rgba(255,150,40,.5))}
.logo span.l2{background:linear-gradient(180deg,#f0ffe0 0%,#a8f05a 40%,#4ab83a 70%,#1e6a2a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0c3a14) drop-shadow(0 8px 0 #041a08) drop-shadow(0 0 22px rgba(120,240,80,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.btn{font:inherit;font-weight:900;color:#fff;border:0;border-radius:14px;padding:12px 24px;font-size:20px;cursor:pointer;background:linear-gradient(180deg,#ffb04a,#e8701a);box-shadow:0 5px 0 #7a3408,0 8px 16px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;justify-content:center;touch-action:manipulation}

.btn.gn{background:linear-gradient(180deg,#9af05a,#3aa82a);box-shadow:0 5px 0 #1a5a10,0 8px 16px rgba(0,0,0,.35)}
.btn.rd{background:linear-gradient(180deg,#ff6a5a,#d8301e);box-shadow:0 5px 0 #6a1008,0 8px 16px rgba(0,0,0,.35)}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#ffd84a;margin-top:-9px;box-shadow:0 2px 0 #8a5a00}

<script>
'use strict';
const SLUG='tank-duel';
const S={k:k=>'gamebop.'+SLUG+'.'+k,
 get(k,d){try{const v=localStorage.getItem(this.k(k));return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(this.k(k),JSON.stringify(v))}catch(e){}}};
const A={c:null,m:null,nb:null,muted:!!S.get('muted',false),
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.45;this.m.connect(this.c.destination)}catch(e){this.c=null}},
 mute(v){this.muted=v;S.set('muted',v);if(this.m)this.m.gain.value=v?0:.45;drawMute()},
 t(f,d,type,vol,slide,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+d+.03)}catch(e){}},
 n(d,vol,freq,delay,type){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0);if(!this.nb){const L=c.sampleRate*2;this.nb=c.createBuffer(1,L,c.sampleRate);const a=this.nb.getChannelData(0);for(let i=0;i<L;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq||2000,t0);f.frequency.exponentialRampToValueAtTime(Math.max(60,(freq||2000)*.15),t0+d);const g=c.createGain();g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+d+.03)}catch(e){}}};
const SFX={
 fire(){A.n(.3,.35,1800);A.t(140,.2,'square',.12,.4)},
 boom(r){const k=Math.min(1.6,r/30);A.n(.4+k*.4,.3+k*.15,1400*k);A.t(80,.4*k,'sawtooth',.15,.3)},
 nuke(){A.n(2,.6,2400);A.t(50,1.5,'sawtooth',.25,.4)},
 bounce(){A.t(520,.08,'square',.08,.6)},
 dig(){A.n(.05,.08,600)},
 move(){A.t(70,.08,'sawtooth',.05,1.1)},
 click(){A.t(880,.05,'square',.06,1.3)},
 tick(){A.t(1300,.02,'square',.03)},
 win(){[523,659,784,1046].forEach((f,i)=>A.t(f,.2,'square',.08,1,i*.1))},
 lose(){[392,330,262,196].forEach((f,i)=>A.t(f,.3,'triangle',.12,1,i*.16))},
 coin(){A.t(1400,.06,'square',.05,1.2);A.t(2100,.08,'square',.04,1,.05)},
 hit(){A.t(200,.2,'square',.12,.5)},
 fizz(){A.n(.2,.05,3000,0,'highpass')},
 whistle(){A.t(1600,.6,'sine',.04,.5)}};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){let s=(seed>>>0)||1;const f=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296};return f}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- data ---------- */
const WEAP=[
 {id:'shell',n:'Shell',r:24,dmg:34,cost:0,pack:0,c:'#ddd'},
 {id:'big',n:'Big Shot',r:40,dmg:50,cost:40,pack:3,c:'#ffb04a'},
 {id:'cluster',n:'Cluster',r:18,dmg:16,cost:60,pack:2,c:'#ff6ad8'},
 {id:'digger',n:'Digger',r:20,dmg:26,cost:30,pack:3,c:'#c8a060'},
 {id:'bouncer',n:'Bouncer',r:26,dmg:34,cost:40,pack:3,c:'#5ad0ff'},
 {id:'napalm',n:'Napalm',r:14,dmg:12,cost:70,pack:2,c:'#ff5a1a'},
 {id:'homing',n:'Homing',r:24,dmg:38,cost:90,pack:2,c:'#9af05a'},
 {id:'dirt',n:'Dirt Bomb',r:55,dmg:0,cost:25,pack:3,c:'#a8743a'},
 {id:'air',n:'Airstrike',r:24,dmg:24,cost:120,pack:1,c:'#ffe066'},
 {id:'nuke',n:'Nuke',r:88,dmg:85,cost:200,pack:1,c:'#ff3a3a'}];
const THEMES=[
 {sky:['#4a9ae8','#bfe4ff'],top:[90,190,70],dirt:[120,82,48],dirt2:[96,62,36],hill:'#6aa0c8',name:'Meadow'},
 {sky:['#e8904a','#ffe0a0'],top:[236,200,120],dirt:[214,160,90],dirt2:[184,128,70],hill:'#d8946a',name:'Dunes'},
 {sky:['#6a8ac8','#e8f2ff'],top:[248,252,255],dirt:[150,160,180],dirt2:[110,120,140],hill:'#a8b8d8',name:'Tundra'},
 {sky:['#2a0a1a','#a83a2a'],top:[60,40,40],dirt:[90,40,30],dirt2:[60,26,22],hill:'#5a1a1a',name:'Ashlands'},
 {sky:['#05030f','#2a1050'],top:[150,240,200],dirt:[80,60,120],dirt2:[56,40,90],hill:'#3a2a6a',name:'Xeno'}];
const RANKS=['Recruit','Private','Corporal','Sergeant','Lieutenant','Captain','Major','Colonel','Brigadier','General','Marshal'];
const TCOL=['#5ab83a','#e8503a','#3a8ae8','#e8c03a','#b05ae8','#3ae8c8','#e87ab0','#8a8a8a'];

let save=Object.assign({duel:1,cash:0,inv:{},armor:0,fuel:0,wins:0},S.get('save',{}));
save.inv=Object.assign({},save.inv);
function persist(){S.set('save',save)}

/* ---------- canvas ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR,SC=1,OX=0,OY=0,portrait=false;
let TW=1100,TH=600,bcan=null,mask,col,tcan,tctx,timg,t32,terrDirty=false,colDirty=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);portrait=W/H<1;
 const pe=$('panel'),panelH=state==='play'?(pe.offsetHeight||(portrait?168:76)):0,top=portrait&&state==='play'?60:40;
 SC=Math.min(W/TW,(H-panelH-top)/TH);OX=(W-TW*SC)/2;OY=H-panelH-TH*SC;if(state!=='play'){SC=Math.max(W/TW,H/TH);OX=(W-TW*SC)/2;OY=H-TH*SC}}
addEventListener('resize',resize);

/* ---------- terrain ---------- */
function genTerrain(seed,th){
 const R=rng(seed);mask=new Uint8Array(TW*TH);col=new Uint32Array(TW*TH);
 const ph=[R()*6,R()*6,R()*6,R()*6],amp=[TH*.12,TH*.07,TH*.03,TH*.012],fr=[1.3+R(),3+R()*2,7+R()*4,19+R()*6];
 const base=TH*(.55+R()*.1),hs=[];
 for(let x=0;x<TW;x++){let h=base;for(let k=0;k<4;k++)h+=Math.sin(x/TW*fr[k]*Math.PI+ph[k])*amp[k];const edge=Math.min(x,TW-x)/TW;h-=Math.max(0,.08-edge)*TH*1.5;hs.push(clamp(h,TH*.3,TH*.9))}
 // noise for caves
 const nz=(x,y)=>Math.sin(x*.021+ph[0])*Math.cos(y*.027+ph[1])+Math.sin((x+y)*.013+ph[2])*.7;
 const T=THEMES[th];
 bcan=document.createElement('canvas');bcan.width=TW;bcan.height=TH;const bctx=bcan.getContext('2d'),bimg=bctx.createImageData(TW,TH),b32=new Uint32Array(bimg.data.buffer);
 for(let x=0;x<TW;x++){const sy=Math.floor(TH-hs[x]);for(let y=sy;y<TH;y++){const d=y-sy;if(d>26&&seed%3===0&&nz(x,y)>1.25){b32[y*TW+x]=darken(darken(pcol(T,d,x,y)));continue}const i=y*TW+x;mask[i]=1;col[i]=pcol(T,d,x,y)}}
 bctx.putImageData(bimg,0,0);
 tcan=document.createElement('canvas');tcan.width=TW;tcan.height=TH;tctx=tcan.getContext('2d');timg=tctx.createImageData(TW,TH);t32=new Uint32Array(timg.data.buffer);terrDirty=true;
}
function pcol(T,d,x,y){let c;const n=((x*73856093^y*19349663)>>>0)%100/100;
 if(d<5)c=T.top.map(v=>v*(.9+n*.15));else{const band=Math.sin(y*.09+Math.sin(x*.02)*2)>.6;const b=band?T.dirt2:T.dirt;const k=Math.max(.55,1-d/600);c=b.map(v=>v*k*(.88+n*.18))}
 return(255<<24)|(clamp(c[2]|0,0,255)<<16)|(clamp(c[1]|0,0,255)<<8)|clamp(c[0]|0,0,255)}
function solid(x,y){x|=0;y|=0;if(x<0||x>=TW)return false;if(y>=TH)return true;if(y<0)return false;return mask[y*TW+x]===1}
function surfaceY(x){x=clamp(x|0,0,TW-1);for(let y=0;y<TH;y++)if(mask[y*TW+x])return y;return TH}
function carve(cx,cy,r){const x0=Math.max(0,cx-r|0),x1=Math.min(TW-1,cx+r|0),y0=Math.max(0,cy-r|0),y1=Math.min(TH-1,cy+r|0);let n=0;

<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a2440;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS','Segoe UI',Verdana,system-ui,sans-serif;color:#fff}

.ov.on{display:flex}
.dim{background:rgba(10,14,28,.76);backdrop-filter:blur(3px)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.86;margin-bottom:10px;animation:bob 2.6s ease-in-out infinite}
.logo span{font-weight:900;font-size:min(15vw,18vh,140px);letter-spacing:.05em;background:linear-gradient(180deg,#fffbe0 0%,#ffd84a 40%,#ff9a2a 70%,#c8401a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #5a2a0a) drop-shadow(0 8px 0 #1e0c04) drop-shadow(0 0 22px rgba(255,150,40,.5))}
.logo span.l2{background:linear-gradient(180deg,#f0ffe0 0%,#a8f05a 40%,#4ab83a 70%,#1e6a2a 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #0c3a14) drop-shadow(0 8px 0 #041a08) drop-shadow(0 0 22px rgba(120,240,80,.45))}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.btn{font:inherit;font-weight:900;color:#fff;border:0;border-radius:14px;padding:12px 24px;font-size:20px;cursor:pointer;background:linear-gradient(180deg,#ffb04a,#e8701a);box-shadow:0 5px 0 #7a3408,0 8px 16px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;justify-content:center;touch-action:manipulation}

.ib{width:40px;height:40px;border-radius:12px;border:0;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}

#panel{position:fixed;left:0;right:0;bottom:0;z-index:4;display:none;gap:8px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(180deg,rgba(14,18,34,.0),rgba(14,18,34,.92) 30%);align-items:center;justify-content:center;touch-action:manipulation;flex-wrap:wrap}

.ctl output{min-width:34px;font-weight:900;font-size:18px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;width:150px;height:28px;background:transparent;touch-action:none}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,#3a4a6a,#8aa0d0)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#ffd84a;margin-top:-9px;box-shadow:0 2px 0 #8a5a00}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:#5a6a8a}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#ffd84a;border:0}
.sq{width:40px;height:40px;border-radius:12px;border:0;background:#3a4a6a;color:#fff;font-weight:900;font-size:18px;cursor:pointer;touch-action:manipulation;display:flex;align-items:center;justify-content:center;padding:0}
.sq:active{background:#5a6a8a}
#wBtn{display:flex;align-items:center;gap:6px;background:#3a4a6a;border:0;border-radius:14px;color:#fff;font:inherit;font-weight:900;padding:4px 10px 4px 4px;cursor:pointer;font-size:16px}
#wBtn canvas{width:40px;height:40px}
#fire{min-width:110px}
.fuel{width:46px;height:8px;border-radius:4px;background:rgba(255,255,255,.15);overflow:hidden}

@media (max-width:1000px){input[type=range]{width:96px}}
@media (orientation:portrait){#panel{display:none}#panel.on{display:grid;grid-template-columns:1fr 1fr;gap:6px}#panel .ctl.ang,#panel .ctl.pow{grid-column:span 2;justify-content:center}#panel .ctl.ang{order:1}#panel .ctl.pow{order:2}#wBtn{order:3;justify-content:center}#panel .ctl.mv{order:4;justify-content:center}#fire{order:5;grid-column:span 2}#panel input[type=range]{width:auto;flex:1}#fire{min-width:0}}

.lad{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;max-width:560px;width:100%}
.ln{aspect-ratio:1;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:20px;background:#2a3454;position:relative}
.ln.done{background:linear-gradient(180deg,#5ab83a,#2a7a1e)}
.ln.cur{background:linear-gradient(180deg,#ffb04a,#e8701a);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.ln canvas{width:60%;height:34%}
.rank{display:flex;align-items:center;gap:10px;font-weight:900;font-size:22px}

.ups{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.up{background:rgba(255,255,255,.08);border-radius:14px;padding:8px 12px;display:flex;align-items:center;gap:10px;font-weight:900}.up{width:min(340px,92vw);box-sizing:border-box}#shUps{max-width:720px;margin:0 auto}.up>span:first-child{width:70px;flex:none;text-align:left}.up .pips{flex:1}.up button{margin-left:auto;flex:none}
.pips{display:flex;gap:3px}.pips u{width:10px;height:10px;border-radius:3px;background:rgba(255,255,255,.15);display:block}.pips u.f{background:#9af05a}
.res{display:flex;gap:14px;font-size:22px;font-weight:900;flex-wrap:wrap;justify-content:center}
.res div{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);padding:8px 14px;border-radius:12px}
.gbsup{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));z-index:6;font-size:12px;color:#fff;opacity:.55;text-decoration:none;font-weight:700;letter-spacing:.03em;text-shadow:0 1px 2px rgba(0,0,0,.6);transition:opacity .2s}
.gbsup:hover{opacity:1}
.btn.pu{background:linear-gradient(180deg,#b88aff,#6a3ae0);box-shadow:0 5px 0 #2e1470,0 8px 16px rgba(0,0,0,.35)}
.btn.pu:active{box-shadow:0 2px 0 #2e1470}
.net-ic{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid #fff;position:relative;box-sizing:border-box}
.net-ic:before{content:"";position:absolute;left:5px;right:5px;top:-3px;bottom:-3px;border:3px solid #fff;border-radius:50%;border-top:0;border-bottom:0}
.net-ic:after{content:"";position:absolute;left:-3px;right:-3px;top:6px;height:3px;background:#fff}
#mpres .board{display:flex;flex-direction:column;gap:6px;width:min(520px,100%)}
.prow{display:grid;grid-template-columns:34px 40px 1fr auto;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:14px;padding:6px 10px;font-weight:900;text-align:left;animation:pin .4s cubic-bezier(.34,1.56,.64,1) both}
.prow.win{background:linear-gradient(90deg,rgba(255,216,74,.35),rgba(255,154,42,.15));box-shadow:0 0 0 2px #ffd84a inset}
.prow.me .pn:after{content:" (you)";opacity:.6;font-size:12px}
.prow .pl{font-size:22px;color:#ffd84a;text-align:center}
.prow .pn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:17px}
.prow .ps{display:flex;gap:10px;font-size:13px;opacity:.9;white-space:nowrap}
.prow .ps i{font-style:normal;opacity:.6;font-size:11px;display:block;text-align:center}
.prow .rdy{color:#9af05a;font-size:12px}
.tav{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
@keyframes pin{from{transform:translateX(-30px) scale(.9);opacity:0}}
#mpwait .spin{width:44px;height:44px;border:6px solid rgba(255,255,255,.2);border-top-color:#ffd84a;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (max-width:420px){.prow{grid-template-columns:26px 34px 1fr auto;gap:6px;padding:6px 8px}.tav{width:34px;height:34px;font-size:19px}.prow .pn{font-size:15px}.prow .ps{gap:7px;font-size:12px}}
</style></head><body>
<canvas id="c"></canvas>
<div class="corner"><button class="ib" id="bPause" style="display:none" aria-label="pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button><button class="ib" id="bMute" aria-label="mute"></button></div>

<div id="panel">
 <button id="wBtn" data-gbctl="weapon"><canvas id="wIc" width="80" height="80"></canvas><span id="wCnt">∞</span></button>
 <div class="ctl ang" data-gbctl="angle"><b>∠</b><button class="sq" id="aL">‹</button><input type="range" id="ang" min="0" max="180" value="45"><button class="sq" id="aR">›</button><output id="angO">45</output></div>
 <div class="ctl pow" data-gbctl="power"><b>⚡</b><button class="sq" id="pD">−</button><input type="range" id="pow" min="5" max="100" value="60"><button class="sq" id="pU">+</button><output id="powO">60</output></div>
 <div class="ctl mv" data-gbctl="move"><button class="sq" id="mL">◀</button><div class="fuel"><i id="fuelI"></i></div><button class="sq" id="mR">▶</button></div>
 <button class="btn rd" id="fire" data-gbctl="fire">FIRE</button>
</div>

<script>
'use strict';
const SLUG='tank-duel';
const S={k:k=>'gamebop.'+SLUG+'.'+k,
 get(k,d){try{const v=localStorage.getItem(this.k(k));return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(this.k(k),JSON.stringify(v))}catch(e){}}};
const A={c:null,m:null,nb:null,muted:!!S.get('muted',false),
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.45;this.m.connect(this.c.destination)}catch(e){this.c=null}},
 mute(v){this.muted=v;S.set('muted',v);if(this.m)this.m.gain.value=v?0:.45;drawMute()},
 t(f,d,type,vol,slide,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+d+.03)}catch(e){}},
 n(d,vol,freq,delay,type){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0);if(!this.nb){const L=c.sampleRate*2;this.nb=c.createBuffer(1,L,c.sampleRate);const a=this.nb.getChannelData(0);for(let i=0;i<L;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.setValueAtTime(freq||2000,t0);f.frequency.exponentialRampToValueAtTime(Math.max(60,(freq||2000)*.15),t0+d);const g=c.createGain();g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+d+.03)}catch(e){}}};
const SFX={
 fire(){A.n(.3,.35,1800);A.t(140,.2,'square',.12,.4)},
 boom(r){const k=Math.min(1.6,r/30);A.n(.4+k*.4,.3+k*.15,1400*k);A.t(80,.4*k,'sawtooth',.15,.3)},
 nuke(){A.n(2,.6,2400);A.t(50,1.5,'sawtooth',.25,.4)},
 bounce(){A.t(520,.08,'square',.08,.6)},
 dig(){A.n(.05,.08,600)},
 move(){A.t(70,.08,'sawtooth',.05,1.1)},
 click(){A.t(880,.05,'square',.06,1.3)},
 tick(){A.t(1300,.02,'square',.03)},
 win(){[523,659,784,1046].forEach((f,i)=>A.t(f,.2,'square',.08,1,i*.1))},
 lose(){[392,330,262,196].forEach((f,i)=>A.t(f,.3,'triangle',.12,1,i*.16))},
 coin(){A.t(1400,.06,'square',.05,1.2);A.t(2100,.08,'square',.04,1,.05)},
 hit(){A.t(200,.2,'square',.12,.5)},
 fizz(){A.n(.2,.05,3000,0,'highpass')},
 whistle(){A.t(1600,.6,'sine',.04,.5)}};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){let s=(seed>>>0)||1;const f=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296};return f}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- data ---------- */
const WEAP=[
 {id:'shell',n:'Shell',r:24,dmg:34,cost:0,pack:0,c:'#ddd'},
 {id:'big',n:'Big Shot',r:40,dmg:50,cost:40,pack:3,c:'#ffb04a'},
 {id:'cluster',n:'Cluster',r:18,dmg:16,cost:60,pack:2,c:'#ff6ad8'},
 {id:'digger',n:'Digger',r:20,dmg:26,cost:30,pack:3,c:'#c8a060'},
 {id:'bouncer',n:'Bouncer',r:26,dmg:34,cost:40,pack:3,c:'#5ad0ff'},
 {id:'napalm',n:'Napalm',r:14,dmg:12,cost:70,pack:2,c:'#ff5a1a'},
 {id:'homing',n:'Homing',r:24,dmg:38,cost:90,pack:2,c:'#9af05a'},
 {id:'dirt',n:'Dirt Bomb',r:55,dmg:0,cost:25,pack:3,c:'#a8743a'},
 {id:'air',n:'Airstrike',r:24,dmg:24,cost:120,pack:1,c:'#ffe066'},
 {id:'nuke',n:'Nuke',r:88,dmg:85,cost:200,pack:1,c:'#ff3a3a'}];
const THEMES=[
 {sky:['#4a9ae8','#bfe4ff'],top:[90,190,70],dirt:[120,82,48],dirt2:[96,62,36],hill:'#6aa0c8',name:'Meadow'},
 {sky:['#e8904a','#ffe0a0'],top:[236,200,120],dirt:[214,160,90],dirt2:[184,128,70],hill:'#d8946a',name:'Dunes'},
 {sky:['#6a8ac8','#e8f2ff'],top:[248,252,255],dirt:[150,160,180],dirt2:[110,120,140],hill:'#a8b8d8',name:'Tundra'},
 {sky:['#2a0a1a','#a83a2a'],top:[60,40,40],dirt:[90,40,30],dirt2:[60,26,22],hill:'#5a1a1a',name:'Ashlands'},
 {sky:['#05030f','#2a1050'],top:[150,240,200],dirt:[80,60,120],dirt2:[56,40,90],hill:'#3a2a6a',name:'Xeno'}];
const RANKS=['Recruit','Private','Corporal','Sergeant','Lieutenant','Captain','Major','Colonel','Brigadier','General','Marshal'];
const TCOL=['#5ab83a','#e8503a','#3a8ae8','#e8c03a','#b05ae8','#3ae8c8','#e87ab0','#8a8a8a'];

let save=Object.assign({duel:1,cash:0,inv:{},armor:0,fuel:0,wins:0,power:0,scope:0},S.get('save',{}));
const UPG=[['armor','ARMOR',12,70,1.32],['fuel','ENGINE',10,60,1.32],['power','POWER',12,90,1.34],['scope','SCOPE',8,80,1.4]];
function upCost(base,g,l){return Math.round(base*Math.pow(g,l)/5)*5}
function gearLv(){return save.armor+save.fuel+save.power+save.scope}
let hitStop=0,slowMo=0,streak=0,lastLand=null;
save.inv=Object.assign({},save.inv);
function persist(){S.set('save',save)}

function aiUpdate(t,dt){if(!aiPlan)return;aiPlan.t+=dt;t.ang=lerp(t.ang,aiPlan.ang,Math.min(1,dt*3));t.pow=lerp(t.pow,aiPlan.pow,Math.min(1,dt*3));if(aiPlan.t>1.4){t.ang=aiPlan.ang;t.pow=aiPlan.pow;curW=aiPlan.w;aiPlan=null;fire()}}

/* ---------- update ---------- */
let keys={};
function update(dt){
 T+=dt;
 for(const c of clouds){c.x+=(wind*6+4)*c.v*dt;if(c.x>TW+120)c.x=-120;if(c.x<-120)c.x=TW+120}
 if(state!=='play')return;
 if(mode==='net'){netFrame(dt);return}
 const t=tanks[turn];
 if(!busy&&!t.ai)playerInput(t,dt);
 if(!busy&&t.ai)aiUpdate(t,dt);
 simStep(dt);

 if(!busy&&tanks.some(t=>t.dead)){busy=true;panelOn(false);settleT=0}
 // end of turn

}
// keyboard + held on-screen buttons for the human whose turn it is; returns true if aim/position changed
function playerInput(t,dt){let ch=false;if(keys.ArrowLeft){t.ang=clamp(t.ang+50*dt,0,180);ch=true}if(keys.ArrowRight){t.ang=clamp(t.ang-50*dt,0,180);ch=true}if(keys.ArrowUp){t.pow=clamp(t.pow+35*dt,5,100);ch=true}if(keys.ArrowDown){t.pow=clamp(t.pow-35*dt,5,100);ch=true}
  const mv=(keys.KeyA||held.mL?-1:0)+(keys.KeyD||held.mR?1:0);if(mv)moveTank(t,mv,dt);
  if(held.aL)t.ang=clamp(t.ang+50*dt,0,180),ch=true;if(held.aR)t.ang=clamp(t.ang-50*dt,0,180),ch=true;if(held.pD)t.pow=clamp(t.pow-35*dt,5,100),ch=true;if(held.pU)t.pow=clamp(t.pow+35*dt,5,100),ch=true;
  if(ch||mv)syncPanel();return ch||!!mv}
// gameplay physics: everything that changes the battle. Online it runs at a fixed 1/60 s step so every screen gets the same result.
function simStep(dt){
 simT+=dt;for(let i=0;i<sched.length;){if(sched[i].at<=simT){const q=sched.splice(i,1)[0];q.f()}else i++}
 // projectiles
 for(let i=proj.length-1;i>=0;i--){const p=proj[i];let dead=false;const n=Math.ceil(Math.hypot(p.vx,p.vy)*dt/3)+1;for(let k=0;k<n&&!dead;k++)dead=stepProj(p,dt/n);if(dead)proj.splice(i,1)}
 // fires
 for(const f of fires){f.l-=dt;f.vy+=GRAV*dt;const nx=f.x+f.vx*dt,ny=f.y+f.vy*dt;if(solid(nx,ny)){if(!solid(nx,ny-3)){f.x=nx;f.y=ny-2;}f.vy=0;f.vx*=.9;const dl=solid(f.x-2,f.y+2),dr=solid(f.x+2,f.y+2);if(!dl&&dr)f.vx-=60*dt*10;else if(dl&&!dr)f.vx+=60*dt*10}else{f.x=nx;f.y=ny}
  if(Math.random()<.25)parts.push({x:f.x,y:f.y,vx:rnd(-10,10),vy:rnd(-60,-20),l:.5,m:.5,c:Math.random()<.5?'#ffb03a':'#ff5a1a',s:rnd(2,5),g:-40});
  for(const tk of tanks)if(!tk.dead&&Math.abs(tk.x-f.x)<16&&Math.abs(tk.y-6-f.y)<16){if(mode==='net')tk.inFire=1;else tk.burn+=dt*14;if(f.owner)tk.burnBy=f.owner}}
 // online: standing in fire burns at one steady rate (napalm can't one-shot a full tank)
 if(mode==='net')for(const tk of tanks)if(tk.inFire){tk.inFire=0;tk.burn+=dt*14}
 fires=fires.filter(f=>f.l>0&&f.y<TH+10);
 for(const tk of tanks){if(tk.burn>=1){const d=Math.floor(tk.burn);tk.burn-=d;tk.hp=Math.max(0,tk.hp-d);tk.burnAcc=(tk.burnAcc||0)+d;const owner=tk.burnBy||tanks.find(o=>o!==tk);if(owner&&owner!==tk){owner.dmgDealt+=d;tk.lastBy=owner}tk.hitT=.5}if(tk.burnAcc&&!fires.length){floats.push({x:tk.x,y:tk.y-40,s:'-'+tk.burnAcc,c:'#ff8a3a',t:0});tk.burnAcc=0}}
 // terrain collapse
 collapseStep();
 // tanks settle
 for(const tk of tanks){if(tk.dead)continue;const sup=solid(tk.x-8,tk.y+1)||solid(tk.x,tk.y+1)||solid(tk.x+8,tk.y+1);
  if(!sup){tk.falling=true;tk.fallV+=GRAV*1.4*dt;tk.y+=tk.fallV*dt;if(tk.y>TH+30){tk.hp=0}}
  else{if(tk.falling){const v=tk.fallV;tk.falling=false;tk.fallV=0;if(v>160){hurt(tk,Math.round((v-160)/12),null);shake=Math.max(shake,4)}}while(solid(tk.x,tk.y)&&tk.y>0)tk.y--}}
 // deaths
 for(const tk of tanks)if(!tk.dead&&tk.hp<=0){tk.dead=true;for(let i=0;i<60;i++)parts.push({x:tk.x,y:tk.y-8,vx:rnd(-260,260),vy:rnd(-380,-40),l:rnd(.8,1.6),m:1.6,c:i%3?tk.c:'#333',s:rnd(3,7),g:500});booms.push({x:tk.x,y:tk.y-8,r:46,t:0});SFX.boom(50);shake=18;carve(tk.x,tk.y-6,22);slowMo=1.4;flash=Math.max(flash,.5);
  const kb=tk.lastBy;if(kb&&kb!==tk)kb.kills=(kb.kills||0)+1;if(mode==='net')netKill(tk,kb)}
}
// visual-only effects
function fxStep(dt){
 for(const tk of tanks){tk.recoil=Math.max(0,tk.recoil-dt*4);tk.hitT=Math.max(0,(tk.hitT||0)-dt*2)}
 for(const b of booms)b.t+=dt;booms=booms.filter(b=>b.t<(b.nuke?1.4:.55));
 for(const p of parts){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.l>0);if(parts.length>1400)parts.splice(0,parts.length-1400);
 for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.3);
 shake=Math.max(0,shake-dt*24);flash=Math.max(0,flash-dt*1.2);
}
function moveTank(t,dir,dt){if(t.fuel<=0)return;const nx=t.x+dir*40*dt;if(nx<10||nx>TW-10)return;let ny=t.y;while(solid(nx,ny)&&t.y-ny<6)ny--;if(solid(nx,ny))return;t.x=nx;t.y=ny;t.fuel=Math.max(0,t.fuel-dt*30);if(Math.random()<.3)SFX.move();if(Math.random()<.4)parts.push({x:t.x-dir*14,y:t.y,vx:-dir*rnd(10,40),vy:rnd(-40,-10),l:.4,m:.4,c:'#a89878',s:3,g:100})}
function endTurn(){
 const alive=tanks.filter(t=>!t.dead);
 if(alive.length<2){finish(alive[0]||null);return}
  const shooter=tanks[turn];if(!shooter.ai&&shooter.id===0){if(turnHit){streak++;if(streak>=2&&mode==='camp'){const b=streak*8;save.cash+=b;persist();floats.push({x:shooter.x,y:shooter.y-70,s:'STREAK ×'+streak+'  +'+b,c:'#9af05a',t:0,big:1});SFX.coin()}}else streak=0}turnHit=false;closeShown=false;if(shooter.ai){if(shooter.dmgDealt===(shooter.lastDmg||0))shooter.miss=(shooter.miss||0)+1;else shooter.miss=0;shooter.lastDmg=shooter.dmgDealt}
 turn=(turn+1)%2;startTurn();
}
function finish(winner){

  const won=winner===me;const d=save.duel;const earn=Math.round((won?60+d*12:20+d*3)+me.dmgDealt*.6);save.cash+=earn;
  let rankUp=false;if(won){const before=rankIdx();save.wins++;if(save.duel<=20)save.duel++;rankUp=rankIdx()>before}
  persist();title=won?(d===20?'CHAMPION!':'VICTORY!'):'DEFEAT';(won?SFX.win:SFX.lose)();
  items.push('<div><span class="coin"></span>+'+earn+'</div>');if(rankUp)items.push('<div style="color:#9af05a">RANK UP!</div>');
  $('rNext').textContent=won?(save.duel>20?'MENU':'NEXT'):'RETRY';
 } else {title=winner?(winner.id===0?'GREEN WINS!':'RED WINS!'):'DRAW';SFX.win();$('rNext').textContent='REMATCH'}
 setTimeout(()=>{$('rT').textContent=title;$('rRes').innerHTML=items.join('');showOv('result')},1200);
}

/* =====================================================================
   BATTLE ONLINE (GBNet): 2-4 tank free-for-all on one shared terrain.
   The host picks a seed ('start'). The active player sends 'move' (aim, for show) and 'fire'.
   Every screen simulates the shot at a fixed 1/60 s step with a seeded RNG, so results match;
   then the host sends 'result' (HP, positions, terrain checksum) that fixes any drift
   ('resync' -> 'terrain' if the ground itself drifted). The host also runs the bots,
   plays for anyone who dropped, and auto-fires a weak shot when the 25 s shot clock runs out.
   ===================================================================== */

const hEsc=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.2832*v)}
function netBlock(){return mode==='net'&&($('pause').classList.contains('on')||$('wpick').classList.contains('on')||!!(window.GBNet&&GBNet.isOpen()))}
function netTop(){return portrait?52+Math.ceil(Math.max(2,tanks.length)/2)*36+40:84}
function pop(s,c,l){banners.unshift({s,c:c||'#fff',t:0,l:l||1.3});if(banners.length>3)banners.length=3}
function restY(x){let y=Math.min(surfaceY(x-8),surfaceY(x),surfaceY(x+8))-1;while(y>0&&solid(x,y))y--;return y}
function nextIdx(i){const N=tanks.length;for(let j=1;j<=N;j++){const k=(i+j)%N;if(!tanks[k].dead)return k}return i}
function netTank(u){return tanks.find(t=>t.uid===u)}
function netPlayer(u){const r=NET&&NET.room;return r?r.players.find(p=>p.uid===u):null}
function netWind(n){const R=rng(((M.seed^Math.imul(n+1,40503))>>>0)||3);R();return Math.round((R()*2-1)*6*10)/10}
function tchk(){const u=new Uint32Array(mask.buffer,0,mask.length>>2);let h=2166136261;for(let i=0;i<u.length;i++)h=Math.imul(h^u[i],16777619);return h>>>0}

 for(let x=0;x<TW;x++){keep.fill(0);const n=a[i++]|0;for(let k=0;k<n;k++){const y0=a[i++]|0,len=a[i++]|0;for(let y=y0;y<y0+len&&y<TH;y++)keep[y]=1}
  for(let y=0;y<TH;y++){const j=y*TW+x;if(keep[y]&&!mask[j])col[j]=pcol(th,30,x,y);mask[j]=keep[y]}}
 terrDirty=true;colDirty=null;for(const t of tanks)if(!t.dead)t.y=restY(t.x)}

function netEvent(e){if(!NET)return;const d=e.data||{};
 if(e.type==='start'){if(!(d.k>NET.k)||!arr(d.ps).length)return;netBegin(d,e.t);return}
 if(e.type==='again'){NET.ready[e.from]=d.k;if(M&&M.over)netBoard();return}
 if(!M||d.k!==M.k)return;
 const act=tanks[M.active];
 if(e.type==='move'){if(M.fired||d.n!==M.n||!act||d.u!==act.uid||d.u===NET_ME())return;
  act.tg={ang:clamp(+d.ang||0,0,180),pow:clamp(+d.pow||50,5,100),x:clamp(+d.x||act.x,10,TW-10)};act.wShow=d.w;
  if(d.g&&act.lastBy)M.bubble={t:act,s:'Payback, '+act.lastBy.short+'!',until:performance.now()+2600};return}
 if(e.type==='fire'){if(M.fired||M.over||d.n!==M.n||!act||d.u!==act.uid)return;netDoFire(d);return}
 if(e.type==='result'){if(d.n!==M.n||!M.fired||M.resolved)return;netApplyResult(d,e.t);return}
 if(e.type==='resync'){if(GBNet.isHost()&&M.rleSnap&&M.rleSnap.n===d.n&&!M.rleSent[d.n]){M.rleSent[d.n]=1;GBNet.send('terrain',{k:M.k,n:d.n,r:M.rleSnap.r}).catch(()=>{M.rleSent[d.n]=0})}return}
 if(e.type==='terrain'){if(GBNet.isHost())return;if(M.n===d.n+1&&!M.fired){rleDec(d.r);M.fixes++}return}}

function netBegin(d,t0){
 const ps=arr(d.ps),me=NET_ME(),R=rng(d.seed>>>0||1),N=ps.length;NET.k=d.k;NET.ready={};
 mode='net';state='play';paused=false;TH=600;TW=N<=2?1100:1300;
 theme=Math.floor(R()*5);const ts=1+Math.floor(R()*1e9);bgSeed=ts;genTerrain(ts,theme);
 const slots=[...Array(N).keys()];for(let i=N-1;i>0;i--){const j=Math.floor(R()*(i+1));const q=slots[i];slots[i]=slots[j];slots[j]=q}

 for(const t of tanks){t.y=surfaceY(t.x)-1;flatten(t.x)}

 proj=[];fires=[];booms=[];parts=[];floats=[];sched=[];simT=0;banners=[];lastLand=null;hitStop=0;slowMo=0;
 clouds=[];for(let i=0;i<8;i++)clouds.push({x:Math.random()*TW,y:rnd(20,TH*.3),s:rnd(.6,1.4),v:rnd(.5,1)});
 stars=[];for(let i=0;i<80;i++)stars.push({x:Math.random(),y:Math.random()*.6});
 M={k:d.k,seed:d.seed>>>0,n:0,active:Math.floor(R()*N),fired:false,settled:false,resolved:false,steps:0,simN:0,acc:0,
  deadline:(t0||GBNet.serverNow())+SHOT_MS+2500,resultSent:{},hostActed:{},rleSent:{},rleSnap:null,lastPump:performance.now(),turnAt:performance.now(),

function netDoFire(d){
 const t=tanks[M.active],mine=t.uid===NET_ME();M.fired=true;M.shooter=t;busy=true;panelOn(false);
 t.x=clamp(+d.x||t.x,10,TW-10);for(const o of tanks)if(!o.dead){o.y=restY(o.x);o.falling=false;o.fallV=0}

 let w=WEAP.some(x=>x.id===d.w)?d.w:'shell';if(w!=='shell'){if(t.inv[w]>0)t.inv[w]--;else w='shell'}
 GR=rng(((M.seed^Math.imul(M.n+7,2654435761))>>>0)||7);simT=0;sched=[];M.acc=0;M.steps=0;M.simN=0;

 if(!GBNet.isHost())return;

  if(hs.length&&hs.every(p=>NET.ready[p.uid]===M.k))netSendStart();return}
 const n=M.n,t=tanks[M.active];if(!t)return;

 else if(GBNet.serverNow()>M.deadline+400){M.hostActed[n]=1;GBNet.send('fire',{k:M.k,n,u:t.uid,ang:r2(t.ang),pow:24,x:r2(t.x),w:'shell',auto:1}).catch(()=>{if(M)M.hostActed[n]=0})}}

<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Knuckle Comet</title>
<style>
:root{--ol:#2a1840}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#3d6fd0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Arial Black","Segoe UI",Verdana,sans-serif}
canvas{position:fixed;left:0;top:0;display:block}
.ov{position:fixed;inset:0;pointer-events:none;display:none}
.ov.on{display:block}
.btn{pointer-events:auto;font:900 20px/1 "Trebuchet MS","Arial Black",sans-serif;color:var(--ol);background:linear-gradient(180deg,#fff08a 0%,#ffd23f 46%,#ffab1f 54%,#ff9a14 100%);border:3px solid var(--ol);border-radius:16px 20px 14px 22px;box-shadow:0 6px 0 var(--ol),inset 0 3px 0 rgba(255,255,255,.65),inset 0 -4px 0 rgba(0,0,0,.12);padding:14px 24px;letter-spacing:1px;cursor:pointer;transform:rotate(-1.2deg);transition:transform .08s,box-shadow .08s;text-shadow:0 2px 0 rgba(255,255,255,.55);white-space:nowrap;outline:none}
.btn:hover{transform:rotate(-1.2deg) translateY(-2px) scale(1.04)}
.btn:active,.btn.press{transform:rotate(-1.2deg) translateY(5px) scale(.97);box-shadow:0 1px 0 var(--ol),inset 0 3px 0 rgba(255,255,255,.6)}
.btn.blue{background:linear-gradient(180deg,#d4f4ff 0%,#8fdcff 46%,#52b6f6 54%,#3c9ee8 100%);transform:rotate(1deg)}
.btn.pink{background:linear-gradient(180deg,#ffe0f0 0%,#ffa8d4 46%,#ff74b4 54%,#f05aa0 100%);transform:rotate(.8deg)}
.btn.blue:active,.btn.pink:active{transform:translateY(5px) scale(.97)}
.btn.sm{font-size:15px;padding:10px 15px;box-shadow:0 4px 0 var(--ol),inset 0 2px 0 rgba(255,255,255,.6)}
.btn .k{display:inline-block;font-size:.62em;border:2px solid var(--ol);border-radius:5px;padding:2px 5px;margin-left:8px;vertical-align:middle;background:rgba(255,255,255,.5);text-shadow:none}
@keyframes popin{0%{transform:scale(.3) rotate(-10deg);opacity:0}65%{transform:scale(1.1) rotate(2deg);opacity:1}100%{transform:scale(1) rotate(-1.2deg)}}
.ov.on .btn{animation:popin .5s cubic-bezier(.2,.9,.3,1.3) backwards}
.ov.on .d1{animation-delay:.07s}.ov.on .d2{animation-delay:.14s}.ov.on .d3{animation-delay:.21s}
.col{position:absolute;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:13px}
.row{display:flex;gap:12px;justify-content:center;align-items:center}
#menu .col{bottom:calc(5.5vh + env(safe-area-inset-bottom))}
#bPlay{font-size:clamp(21px,3.6vh,30px);min-width:min(290px,76vw)}
#support{position:absolute;right:calc(9px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff;opacity:.55;text-decoration:none;pointer-events:auto;text-shadow:0 1px 2px rgba(0,0,0,.55);letter-spacing:.3px}
#support:hover{opacity:1}
#top{position:fixed;top:calc(9px + env(safe-area-inset-top));right:calc(9px + env(safe-area-inset-right));display:flex;gap:8px;z-index:5}
.ib{pointer-events:auto;width:42px;height:42px;border-radius:50% 46% 52% 48%;border:3px solid var(--ol);background:linear-gradient(180deg,#fffaf0,#ffe2b8);box-shadow:0 4px 0 var(--ol);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
.ib svg{width:22px;height:22px}
#res .col{bottom:calc(3.5vh + env(safe-area-inset-bottom))}
#bNext{font-size:clamp(22px,3.8vh,30px);min-width:min(250px,64vw)}
#skip{position:fixed;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));z-index:6}
#pause .col,#shop .panel{top:50%;transform:translate(-50%,-50%)}
#pause{background:rgba(25,12,50,.45);pointer-events:auto}
#pause .col{position:absolute;left:50%}
.ptitle{font:900 44px/1 "Trebuchet MS","Arial Black",sans-serif;color:#fff;-webkit-text-stroke:2px var(--ol);text-shadow:0 5px 0 var(--ol);margin-bottom:10px;transform:rotate(-3deg)}
#shop{background:rgba(25,12,50,.5);pointer-events:auto}
#shop .panel{position:absolute;left:50%;width:min(560px,calc(100vw - 20px));max-height:calc(100vh - 24px);display:flex;flex-direction:column;background:#fff6e0;border:4px solid var(--ol);border-radius:22px 26px 20px 28px;box-shadow:0 8px 0 var(--ol),inset 0 -6px 0 #f3dcae;overflow:hidden}
.shead{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:linear-gradient(180deg,#7b5bd6,#5a3db8);border-bottom:4px solid var(--ol);color:#fff;font:900 24px/1 "Trebuchet MS","Arial Black",sans-serif;text-shadow:0 3px 0 var(--ol)}
.coinv{display:flex;align-items:center;gap:6px;font-size:22px}
.cn{display:inline-block;width:.95em;height:.95em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff7b0,#ffd23f 45%,#e09a00);border:2px solid var(--ol);vertical-align:-2px;box-sizing:border-box}
.slist{overflow-y:auto;padding:10px 12px;touch-action:pan-y;flex:1}
.urow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:2px dashed #e5c993}
.urow canvas{position:static;width:46px;height:46px;flex:none}
.uinfo{flex:1;min-width:0;color:var(--ol);font-weight:900;font-size:16px}
.pips{display:flex;gap:2px;margin-top:5px;flex-wrap:wrap}
.pips i{display:block;width:9px;height:9px;border-radius:3px;border:1.5px solid var(--ol);background:#fff}
.pips i.f{background:#ff9a14}
.buy{font-size:15px;padding:9px 10px;min-width:92px;box-shadow:0 4px 0 var(--ol),inset 0 2px 0 rgba(255,255,255,.6)}
.buy.no{filter:grayscale(.8) brightness(.95);opacity:.7}
.buy.max{background:#c7f0b0}
.skt{color:var(--ol);font-weight:900;font-size:16px;margin:12px 4px 6px}
.skins{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.sk{pointer-events:auto;position:relative;border:3px solid var(--ol);border-radius:14px;background:#fff;padding:3px 0 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font:900 11px/1.2 "Trebuchet MS",sans-serif;color:var(--ol);box-shadow:0 3px 0 var(--ol)}
.sk canvas{position:static;width:44px;height:44px}
.sk.eq{background:#ffe88a}
.sk.lock{background:#e9e1f3}
.sfoot{padding:10px;display:flex;justify-content:center;border-top:3px solid #e5c993}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="top">
  <button class="ib" id="bMute" aria-label="Mute"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
  <button class="ib" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1.5" fill="#2a1840"/><rect x="14" y="5" width="4" height="14" rx="1.5" fill="#2a1840"/></svg></button>
</div>

<div id="menu" class="ov">
  <div class="col">
    <button class="btn" id="bPlay">PLAY</button>
    <div class="row">
      <button class="btn sm blue d1" id="bHow">HOW TO PLAY</button>
      <button class="btn sm pink d2" id="bShop">UPGRADES</button>
    </div>
  </div>
  <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="tutov" class="ov"><button class="btn sm blue" id="skip">SKIP ▸▸</button></div>

<div id="res" class="ov">
  <div class="col">
    <button class="btn" id="bNext">NEXT ▸</button>
    <div class="row">
      <button class="btn sm blue d1" id="bRetry">↻ RETRY</button>
      <button class="btn sm pink d2" id="bShop2">UPGRADES</button>
      <button class="btn sm blue d3" id="bMenu2">MENU</button>
    </div>
  </div>
</div>

<div id="pause" class="ov">
  <div class="col">
    <div class="ptitle">PAUSED</div>
    <button class="btn" id="bResume">RESUME</button>
    <button class="btn sm blue d1" id="bRestart">↻ RESTART</button>
    <button class="btn sm pink d2" id="bMenu">MENU</button>
  </div>
</div>

<div id="shop" class="ov">
  <div class="panel">
    <div class="shead"><span>UPGRADES</span><span class="coinv"><i class="cn"></i><span id="shopCoins">0</span></span></div>
    <div class="slist">
      <div id="upList"></div>
      <div class="skt">GLOVES</div>
      <div class="skins" id="skinList"></div>
    </div>
    <div class="sfoot"><button class="btn sm" id="bShopX">◂ BACK</button></div>
  </div>
</div>

<script>
'use strict';
// ================= UTIL =================
const SLUG='knuckle-comet', KP='gamebop.'+SLUG+'.';
function lsGet(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v));}catch(e){}}
const TAU=Math.PI*2;
const rnd=(a,b)=>a+Math.random()*(b-a);
const rint=(a,b)=>Math.floor(rnd(a,b+1));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const pick=a=>a[Math.floor(Math.random()*a.length)];
const easeOutBack=t=>{t=clamp(t,0,1);const c=1.9;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const easeOutCubic=t=>1-Math.pow(1-clamp(t,0,1),3);
function hash(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);}
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function segDist(ax,ay,bx,by,px,py){const dx=bx-ax,dy=by-ay;const l=dx*dx+dy*dy||1;let t=((px-ax)*dx+(py-ay)*dy)/l;t=clamp(t,0.08,0.92);const x=ax+dx*t-px,y=ay+dy*t-py;return Math.sqrt(x*x+y*y);}
const OL='#2a1840';
const FONT='"Trebuchet MS","Arial Black","Segoe UI",Verdana,sans-serif';
const font=(px,w=900)=>w+' '+Math.round(px)+'px '+FONT;

// ================= SAVE =================
const DEF={wave:1,coins:0,upg:{reach:0,combo:0,power:0,magnet:0,dash:0,heart:0},skin:0,skins:[0],medals:{},bestCombo:0,secrets:[],smashed:0,started:false,golds:0};
let save=JSON.parse(JSON.stringify(DEF));
(function(){const s=lsGet('save',null);if(s&&typeof s==='object'){Object.assign(save,s);save.upg=Object.assign({},DEF.upg,s.upg||{});if(!Array.isArray(save.skins))save.skins=[0];if(!Array.isArray(save.secrets))save.secrets=[];save.medals=save.medals||{};}})();
function persist(){lsSet('save',save);}
let tutDone=lsGet('tut',false);
let muted=lsGet('mute',false);

const UPG={
  reach:{name:'Reach',max:15,base:40,k:1.42},
  combo:{name:'Combo Time',max:15,base:35,k:1.42},
  power:{name:'Punch Power',max:12,base:60,k:1.45},
  magnet:{name:'Coin Magnet',max:12,base:50,k:1.45},
  dash:{name:'Air Dash',max:4,costs:[400,1500,5000,15000]},
  heart:{name:'Hearts',max:4,costs:[600,2500,8000,24000]},
};
function upCost(k){const u=UPG[k],l=save.upg[k];if(l>=u.max)return Infinity;return u.costs?u.costs[l]:Math.round(u.base*Math.pow(u.k,l)/5)*5;}
const SKINS=[
 {n:'Classic',c:'#ff3b4e',d:'#b81c35',p:0},{n:'Sky',c:'#3fb6ff',d:'#1f6fc0',p:300},{n:'Lime',c:'#8fe34a',d:'#4e9a1e',p:800},
 {n:'Bubble',c:'#ff7ad1',d:'#c23f97',p:1500},{n:'Tiger',c:'#ff9a1f',d:'#c25a00',p:3000,stripe:1},{n:'Galaxy',c:'#6a4cff',d:'#35209a',p:6000,stars:1},
 {n:'Lava',c:'#ff5a1f',d:'#8a1500',p:10000,lava:1},{n:'Diamond',c:'#c9f6ff',d:'#5ab8d6',p:16000,shine:1},{n:'Rainbow',c:'#ff5a6e',d:'#7a3fb0',p:25000,rainbow:1},{n:'Golden',c:'#ffd34a',d:'#c28a00',p:40000,shine:1}];
const reach=()=>205+10*save.upg.reach;
const comboTime=()=>1.7+0.12*save.upg.combo;
const powerLv=()=>save.upg.power;
const maxCharges=()=>1+save.upg.dash;
const maxHearts=()=>3+save.upg.heart;
const coinMul=()=>1+0.1*save.upg.magnet;
function upgTotal(){let s=0;for(const k in save.upg)s+=save.upg[k];return s;}

// ================= AUDIO =================
let AC=null,MG=null,SG=null,MUS=null,noiseBuf=null,musTimer=null,musStep=0,musNext=0,musInt=0;
function audioInit(){
  if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain();MG.gain.value=muted?0:1;MG.connect(AC.destination);
    SG=AC.createGain();SG.gain.value=0.6;SG.connect(MG);
    MUS=AC.createGain();MUS.gain.value=0.13;MUS.connect(MG);
    const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    musNext=AC.currentTime+0.15;musTimer=setInterval(schedMusic,60);
  }catch(e){AC=null;}
}
function tone(f,dur,type,vol,f2,delay,dest){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(dest||SG);o.start(t);o.stop(t+dur+0.05);
}
function noise(dur,vol,ff,ftype,f2,delay,q){
  if(!AC)return;const t=AC.currentTime+(delay||0);
  const s=AC.createBufferSource();s.buffer=noiseBuf;const fl=AC.createBiquadFilter();fl.type=ftype||'lowpass';fl.frequency.setValueAtTime(ff||1200,t);fl.Q.value=q||1;
  if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g=AC.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.2,t+0.006);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(fl);fl.connect(g);g.connect(SG);s.start(t,Math.random()*0.4);s.stop(t+dur+0.05);
}
const PENTA=[0,2,4,7,9];
function comboNote(c){const i=Math.min(c,24);return 330*Math.pow(2,(PENTA[i%5]+12*Math.floor(i/5))/12*0.75);}
let lastCoinS=0;
const SFX={
  whoosh(){noise(0.13,0.22,700,'bandpass',3600,0,1.3);},
  hit(c){const v=rnd(0.95,1.06);tone(190*v,0.15,'sine',0.7,48);noise(0.06,0.4,2200,'highpass');tone(comboNote(c),0.24,'triangle',0.26,null,0.012);tone(comboNote(c)*2,0.1,'square',0.05,null,0.012);},
  pop(){tone(rnd(900,1300),0.06,'square',0.07,280);noise(0.05,0.22,4200,'highpass');},
  clang(){[523,1340,2210,2960].forEach((f,i)=>tone(f*rnd(.98,1.02),0.42-i*0.07,'sine',0.2/(i+1)));noise(0.05,0.2,6000,'highpass');},
  boom(){noise(0.55,0.6,1000,'lowpass',90);tone(120,0.45,'sine',0.6,32);},
  hurt(){tone(520,0.35,'sawtooth',0.16,110);tone(390,0.3,'square',0.07,90,0.05);},
  boing(){tone(170,0.32,'sine',0.38,640);tone(640,0.22,'triangle',0.13,300,0.14);},
  coin(){const n=performance.now();if(n-lastCoinS<45)return;lastCoinS=n;const p=rnd(.98,1.04);tone(988*p,0.06,'square',0.05);tone(1319*p,0.14,'square',0.05,null,0.05);},
  gold(){[0,4,7,12,16,19,24].forEach((n,i)=>tone(660*Math.pow(2,n/12),0.25,'triangle',0.13,null,i*0.05));},
  fanfare(){[0,4,7,12].forEach((n,i)=>{tone(523*Math.pow(2,n/12),i===3?0.6:0.17,'square',0.08,null,i*0.11);tone(262*Math.pow(2,n/12),0.3,'triangle',0.15,null,i*0.11);});},
  milestone(){[0,7,12].forEach((n,i)=>tone(659*Math.pow(2,n/12),0.2,'square',0.07,null,i*0.07));},
  click(){tone(720,0.05,'square',0.06,480);},
  gull(){for(let i=0;i<3;i++)tone(1400-i*80,0.11,'sawtooth',0.05,820,i*0.12);},
  zap(){noise(0.35,0.4,3200,'bandpass',500,0,2);tone(95,0.3,'square',0.12,55);},
  charge(){tone(220,0.6,'sawtooth',0.04,880);},
  warn(){tone(880,0.07,'square',0.05);tone(880,0.07,'square',0.05,null,0.14);},
  cannon(){noise(0.3,0.45,520,'lowpass',100);tone(95,0.25,'sine',0.4,40);},
  whiff(){noise(0.1,0.1,800,'bandpass',300);},
  dash(){noise(0.22,0.26,400,'bandpass',2600,0,0.8);tone(300,0.15,'triangle',0.1,760);},
  wind(){noise(2.2,0.16,300,'bandpass',1100,0,0.7);},
  bigboom(){noise(1.4,0.7,1300,'lowpass',60);tone(85,1.2,'sine',0.7,25);},
  perfect(){[0,4,7,12].forEach((n,i)=>tone(880*Math.pow(2,n/12),0.16,'triangle',0.11,null,i*0.035));},
  secret(){[0,7,12,16,19,24,28].forEach((n,i)=>tone(523*Math.pow(2,n/12),0.45,'sine',0.12,null,i*0.08));},
  bosshit(){tone(110,0.4,'sawtooth',0.18,40);noise(0.3,0.5,1500,'lowpass',200);tone(70,0.5,'sine',0.6,30);},
  reflect(){tone(400,0.12,'square',0.08,1400);noise(0.08,0.3,3000,'highpass');},
};
const PROG=[[0,4,7],[-3,0,4],[5,9,12],[7,11,14]];
function schedMusic(){
  if(!AC)return;
  if(paused||AC.state!=='running'){musNext=AC.currentTime+0.1;return;}
  const spb=60/118/2;
  while(musNext<AC.currentTime+0.2){
    const st=musStep%32,bar=Math.floor(musStep/8)%4,ch=PROG[bar],d=musNext-AC.currentTime;
    const root=130.81*Math.pow(2,ch[0]/12);
    if(st%2===0)tone(st%4===0?root/2:root*0.75,0.22,'triangle',0.5,null,d,MUS);
    const arp=[0,1,2,1,2,0,2,1][st%8];
    if(scene!=='title'||st%2===0)tone(261.6*Math.pow(2,ch[arp]/12)*(st%16<8?1:2),0.12,'square',musInt>0?0.11:0.08,null,d,MUS);
    if(musInt>0&&st%4===0){tone(140,0.12,'sine',0.6,45,d,MUS);}
    if(st%2===1)noise(0.03,0.05,8000,'highpass',null,d);
    musStep++;musNext+=spb;
  }
}
function setMute(m){muted=m;lsSet('mute',m);if(MG)MG.gain.value=m?0:1;drawMuteIcon();}

// ================= CANVAS / VIEW =================
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,S=1,VW=0,VH=0,HU=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cv.style.width=W+'px';cv.style.height=H+'px';
  S=Math.min(W/(W<H?420:560),H/580);VW=W/S;VH=H/S;HU=clamp(Math.min(W/760,H/600),0.72,1.35);
  seaTile=null;
}
addEventListener('resize',resize);

// ================= THEMES & BG SPRITES =================
const THEMES=[
 {sky:['#3d8fef','#7cc6ff','#e2f5ff'],sun:'#fff8cf',glow:'rgba(255,250,215,0.6)',cl:'#ffffff',cs:'#bcd3f2',far:'#e6f2ff',farS:'#c3d8f3',isl:'#9fb7e0',sea1:'#4b3a7e',sea2:'#8069c6',spk:'#33265e'},

// ================= ROCKO =================
const GRAV=1450,DASHSP=2400;
function dashMove(dt){
  const R=G.R,t=R.tgt;
  if(!t||!targetable(t)&&!(t.type==='weak'&&t.alive)){R.dashing=false;R.vx*=0.3;R.vy*=0.3;return;}
  let rem=DASHSP*dt;
  while(rem>0&&R.dashing){
    const dx=t.x-R.x,dy=t.y-R.y,d=Math.hypot(dx,dy)||1;R.dir=Math.atan2(dy,dx);
    const st=Math.min(rem,10);rem-=st;
    const mv=Math.min(st,Math.max(0,d-2));R.x+=dx/d*mv;R.y+=dy/d*mv;
    R.vx=dx/d*DASHSP;R.vy=dy/d*DASHSP;
    // hazards
    if(R.inv<=0)for(const s of G.ents){if(s.type==='spike'&&s.alive&&s.soft<0.5&&Math.hypot(s.x-R.x,s.y-R.y)<s.hr+9){hurt(s.x,s.y);return;}}
    // contact
    for(const e of G.ents){if(!targetable(e))continue;const cd=e.r+14;if(Math.abs(e.x-R.x)<cd&&Math.abs(e.y-R.y)<cd&&Math.hypot(e.x-R.x,e.y-R.y)<cd){onHit(e);return;}}
    if(mv<=0.01)break;
  }
}
function updateRocko(dt){
  const R=G.R;
  R.inv-=dt;R.recentT-=dt;R.hurtT-=dt;R.whiffT=(R.whiffT||0)-dt;R.moodT-=dt;R.trail-=dt;R.freeT-=dt;
  if(R.dashing){R.dashT+=dt;if(R.dashT>0.42){R.dashing=false;R.vx*=0.3;R.vy*=0.3;}else dashMove(dt);}
  else{
    let g=GRAV*(G.mode==='tut'?G.tut.grav:1)*(1+Math.min(0.3,(G.cfg.diff-1)*0.12));
    if(G.ending&&!G.failed){g=0;R.vy*=Math.exp(-3*dt);R.vx*=Math.exp(-3*dt);R.vy+=Math.sin(G.t*3)*30*dt;}
    if(R.freeT>0)g*=0.4;
    if(R.y<playTop()-80&&R.vy<0)g*=1.8;
    if(G.hover){g=0;R.vy=lerp(R.vy,Math.sin(G.t*3)*40,Math.min(1,dt*3));const q=G.soonTgt;R.vx=G.nextTgt?R.vx*Math.exp(-3*dt):lerp(R.vx,q?Math.sign(q.x-R.x)*150:(G.arena?0:140),Math.min(1,dt*3));if(q&&!G.nextTgt)R.vy+=clamp(q.y-R.y,-1,1)*60;}
    R.vy+=g*dt;if(R.vy>1050)R.vy=1050;
    R.vx*=Math.exp(-1.3*dt);
    const hb=heldBias();if(hb&&!G.ending)R.vx+=hb*520*dt;
    R.vx+=G.windF*dt;R.vy+=G.windF*0.12*dt*(G.gust.up||0);
    R.x+=R.vx*dt;R.y+=R.vy*dt;
    if(R.vy>220)R.fallT+=dt;else R.fallT=Math.max(0,R.fallT-dt*3);
    if(R.y<-1250){R.y=-1250;R.vy=Math.max(R.vy,0);}
    if(R.y>-24){seaHit();}
    if(G.buffer>0)tryPunch(true,G.bufBias);
  }
  G.buffer-=dt;
  if(G.arena){const A=G.arena;if(R.x<A.x0+20){R.x=A.x0+20;R.vx=Math.abs(R.vx)*0.6+120;}if(R.x>A.x1-20){R.x=A.x1-20;R.vx=-Math.abs(R.vx)*0.6-120;}}
  // facing
  const hb=heldBias();if(hb&&!R.dashing)R.facing=hb;
  // hazards
  if(R.inv<=0&&!G.ending){

function smallBoom(x,y){SFX.boom();addShake(8);for(let i=0;i<10;i++)P({k:'puff',x,y,vx:rnd(-200,200),vy:rnd(-200,120),life:rnd(0.3,0.6),s:rnd(8,16),col:pick(['#ffb93c','#ff7a3c','#6b5a7a'])});ring(x,y,50,'#ffd34a',0.3);}
function updateEnts(dt){
  const C=G.cfg,R=G.R,d=C.diff||1;
  for(const e of G.ents){
    if(!e.alive)continue;e.t+=dt;e.flash-=dt;if(e.panic>0)e.panic-=dt;if(e.bubbleT)e.bubbleT-=dt;
    switch(e.type){
      case 'goblin':case 'armor':case 'gold':case 'mini':case 'split':case 'ghost':case 'coinb':case 'heartb':
        if(e.vx||e.vy){e.bx+=e.vx*dt;e.by+=e.vy*dt;const k=Math.exp(-3*dt);e.vx*=k;e.vy*=k;if(Math.abs(e.vx)<1)e.vx=0;if(Math.abs(e.vy)<1)e.vy=0;}
        e.bx+=G.windF*0.05*dt;
        e.x=e.bx+Math.sin(e.t*1.3+e.ph)*5;e.y=e.by+Math.sin(e.t*2.1+e.ph)*8;
        if(e.type==='ghost'){e.gc+=dt;const per=3.0+0.3*d;const ph=e.gc%per;const tv=ph<1.7?1:0;e.vis+=(tv-e.vis)*Math.min(1,dt*8);}
        break;
      case 'bomb':e.x=e.bx+Math.sin(e.t*1.1+e.ph)*22;e.y=e.by+Math.sin(e.t*2.6+e.ph)*10;e.bx+=G.windF*0.05*dt;break;
      case 'spike':{
        if(e.orbit){const b=e.orbit;if(!b.alive||b.dying>0){e.alive=false;smallBoom(e.x,e.y);break;}e.oa+=dt*0.7;e.x=b.x+Math.cos(e.oa)*250;e.y=b.y+Math.sin(e.oa)*130;}
        else{if(d>1.55&&!G.ending){const dx=R.x-e.bx,dy=R.y-e.by,dd=Math.hypot(dx,dy)||1;if(dd<380){const v=Math.min(70,30*(d-1.4));e.bx+=dx/dd*v*dt;e.by+=dy/dd*v*dt;}}
          e.x=e.bx+Math.sin(e.t*0.9+e.ph)*10;e.y=e.by+Math.sin(e.t*1.7+e.ph)*12;}
        e.cyc+=dt;const sd=2.3+0.25*(d-1),so=Math.max(0.7,1.2-0.08*(d-1));const per=sd+so;const ph=e.cyc%per;const tv=ph>sd?1:0;e.soft+=(tv-e.soft)*Math.min(1,dt*12);break;}
      case 'zip':{
        if(e.zipping>0){e.zipping-=dt;const k=1-Math.max(0,e.zipping)/e.zd;const ek=easeOutCubic(k);const nx=lerp(e.sx,e.tx,ek),ny=lerp(e.sy,e.ty,ek);e.vx=(nx-e.x)/dt;e.vy=(ny-e.y)/dt;e.x=nx;e.y=ny;}
        else{e.vx=0;e.vy=0;e.zt-=dt;e.y+=Math.sin(e.t*5)*0.3;if(e.zt<=0){e.sx=e.x;e.sy=e.y;e.tx=clamp(e.x+rnd(-170,170),e.ax-220,e.ax+220);e.ty=clamp(e.y+rnd(-130,130),-640,-140);e.zd=Math.max(0.14,0.26/Math.sqrt(d));e.zipping=e.zd;e.zt=Math.max(0.35,rnd(0.7,1.3)/d);if(Math.random()<0.4)tone(900,0.08,'square',0.03,1600);}}
        break;}
      case 'ship':updateShip(e,dt);break;
      case 'ball':case 'drop':{
        e.life-=dt;if(e.life<=0){e.alive=false;smallBoom(e.x,e.y);break;}
        if(e.refl){const h=e.home;if(h&&h.alive){const tx=h.x,ty=h.type==='ship'?h.y-10:h.y;const dx=tx-e.x,dy=ty-e.y,dd=Math.hypot(dx,dy)||1;e.vx=dx/dd*1300;e.vy=dy/dd*1300;
            if(dd<(h.type==='boss'?110:46)){e.alive=false;if(h.type==='ship')shipDamage(h);else bossBonk(h,e);}}}
        else if(e.type==='drop'){e.vy+=520*dt;if(e.y>-30){e.alive=false;smallBoom(e.x,-20);}}
        e.x+=e.vx*dt;e.y+=e.vy*dt;break;}
      case 'zap':{
        e.stT-=dt;e.x+=Math.sin(e.t*0.5)*10*dt;
        if(e.st==='idle'&&e.stT<=0){e.st='charge';e.stT=Math.max(0.65,1.0-0.04*(d-1));if(onScreen(e))SFX.charge();}
        else if(e.st==='charge'&&e.stT<=0){e.st='strike';e.stT=0.4;if(onScreen(e)){SFX.zap();addShake(6);}}
        else if(e.st==='strike'&&e.stT<=0){e.st='idle';e.stT=rnd(1.6,2.8)/Math.sqrt(d);}
        break;}
      case 'boss':updateBoss(e,dt);break;
      case 'weak':{const b=e.boss;e.cool=(e.cool||0)-dt;e.x=b.x+e.ox;e.y=b.y+e.oy;if(!b.alive)e.alive=false;break;}
      case 'gull':e.x+=e.vx*dt;e.y=e.by+Math.sin(e.t*2)*10;if(e.t>9)e.alive=false;break;
      case 'bell':break;
    }
    if(!e.keep&&e.type!=='gull'&&e.x<G.camX-360)e.alive=false;
  }
  G.ents=G.ents.filter(e=>e.alive);
}

function spawnFormation(){
  const C=G.cfg,rc=reach(),n=C.n||1;
  if(G.mode==='play'&&!G.introDone){G.introDone=true;const w=spawnIntro(C.newT);if(w>=0)return{w,sp:170};}
  if(G.mode==='play'&&C.castle&&!G.castle&&G.smashed>=G.goal*0.35){G.castle=true;return spawnCastle();}
  if(C.bonus){return spawnBonusForm();}
  const shapes=n<=2?['arc','line','stairUp','arc','stairDown']:['arc','line','stairUp','stairDown','zig','tower','ring','arc'];
  const shape=pick(shapes);
  const sp=clamp(205+rnd(0,35)+(C.diff-1)*18+(rc-190)*0.9,180,rc+70);
  const top=playTop(),bot=-150;
  let k=shape==='tower'?3:shape==='ring'?6:4+Math.floor(Math.random()*3);
  const by=clamp(G.lastY+rnd(-110,90),top+130,bot-40);
  const pts=[];
  for(let i=0;i<k;i++){let px,py;
    switch(shape){
      case 'arc':px=i*sp;py=-Math.sin(i/(k-1)*Math.PI)*110+40;break;
      case 'line':px=i*sp;py=0;break;
      case 'stairUp':px=i*sp*0.85;py=-i*62+60;break;
      case 'stairDown':px=i*sp*0.85;py=i*55-80;break;
      case 'zig':px=i*sp*0.8;py=i%2?-75:40;break;
      case 'tower':px=(i%2)*50;py=-i*sp*0.62+60;break;
      case 'ring':{const a=i/k*TAU+Math.PI;px=105+Math.cos(a)*105;py=Math.sin(a)*100;break;}
    }
    pts.push([px,clamp(by+py,top,bot)]);}
  const x0=G.spawnX;
  for(const p of pts){let ty=pickMix(C.mix);if(Math.random()<(C.gold||0.025))ty='gold';const e=addEnemy(ty,x0+p[0],p[1]);if(ty==='zip'){e.ax=e.x;e.ay=e.y;}}
  if(C.spikes&&Math.random()<C.spikes){const cnt=1+(Math.random()<(C.diff-1.25)*0.6?1:0)+(Math.random()<(C.diff-2)*0.5?1:0);
    for(let j=0;j<cnt;j++){const i=rint(0,pts.length-2);const a=pts[i],b=pts[i+1];addEnemy('spike',x0+(a[0]+b[0])/2,(a[1]+b[1])/2+pick([-1,1])*rnd(8,50));}}
  if(G.mode==='play'&&G.hearts<maxHearts()&&Math.random()<0.06){const p=pts[rint(0,pts.length-1)];addEnemy('heartb',x0+p[0]+rnd(-30,30),p[1]-110);}
  if(C.zap&&Math.random()<C.zap){const m=pts[k>>1];addEnemy('zap',x0+m[0]+rnd(-40,40),Math.max(top-60,m[1]-rnd(190,240)));}
  G.lastY=pts[pts.length-1][1];
  let w=0;for(const p of pts)w=Math.max(w,p[0]);
  return{w,sp};
}
function spawnBonusForm(){
  const x0=G.spawnX,top=playTop();const by=clamp(G.lastY+rnd(-120,100),top+120,-200);const k=6;const sp=150;
  const sh=pick(['wave','arc','ring']);
  for(let i=0;i<k;i++){let px=i*sp,py=sh==='wave'?Math.sin(i*1.1)*80:sh==='arc'?-Math.sin(i/(k-1)*Math.PI)*120+40:0;if(sh==='ring'){const a=i/k*TAU;px=110+Math.cos(a)*110;py=Math.sin(a)*100;}
    addEnemy(Math.random()<0.12?'gold':'coinb',x0+px,clamp(by+py,top,-150));}
  G.lastY=by;return{w:sh==='ring'?220:(k-1)*sp,sp};
}
function spawnCastle(){

  // stair of goblins up to the bell

function spawner(){
  const R=G.R;if(G.arena||G.ending||G.mode==='tut')return;
  if(G.mode==='play'&&G.cfg.bonus&&G.timer<=0)return;
  let guard=0;
  while(G.spawnX<Math.max(R.x,G.camX+VW*0.3)+VW*0.8+200&&guard++<4){

function startWave(n){
  scene='play';paused=false;G=makeG('play',n);const C=G.cfg;
  if(C.boss)setupBoss(C.boss);
  if(C.bonus){G.timer=30;G.goal=45;}
  if(C.ship)G.shipT=C.newT==='ship'?2.5:8;
  G.banner={t:0,title:C.boss?'BOSS BLIMP!':C.bonus?'BONUS!':'WAVE '+n,sub:NEWTXT[C.newT]||'',icon:C.newT};
  if(C.newT==='goblin')G.banner.sub='SMASH '+C.goal+'!';
  G.R.vy=-380;

  save.started=true;persist();showUI();
}
function waveClear(){
  if(G.ending)return;G.ending=true;G.endT=1.5;G.failed=false;G.slow=Math.max(G.slow,0.8);
  SFX.fanfare();confetti(G.R.x,G.R.y-40,60);G.pops.push({text:G.cfg.bonus?'TIME!':'CLEAR!',t:0,col:'#ffe14d',big:1});
  G.R.mood='joy';G.R.moodT=3;
  for(const e of G.ents)if(e.type==='ball'||e.type==='drop'||e.type==='spike')e.alive=false;
  if(G.ship){shipDamage(G.ship);if(G.ship)G.ship.alive=false;}
}
function waveFail(){
  if(G.ending)return;G.ending=true;G.failed=true;G.endT=1.2;G.slow=0.5;G.R.mood='hurt';G.R.moodT=5;
}
function showResults(){
  const win=!G.failed,C=G.cfg,n=G.n;
  let medal=0;
  if(win){
    if(C.bonus){medal=G.smashed>=45?3:G.smashed>=28?2:1;}
    else{const pr=G.hits?(G.perfects||0)/G.hits:0;medal=1;if(G.dmg<=1&&pr>=0.3)medal=2;if(G.dmg===0&&pr>=0.55)medal=3;}
  }
  const run=Math.round(G.coinsRun);
  const clear=win?20+8*n:0;const mb=medal===3?30+4*n:medal===2?15+2*n:0;
  const total=run+clear+mb;
  save.coins+=total;
  if(win){save.wave=Math.max(save.wave,n+1);const prev=save.medals[n]||0;if(medal>prev){save.medals[n]=medal;if(medal===3)save.golds=(save.golds||0)+1;}}
  if(G.maxCombo>save.bestCombo)save.bestCombo=G.maxCombo;
  persist();
  let near='';
  if(win&&!C.bonus&&medal<3){near=G.dmg>0?'GOLD: NO HITS + 55% PERFECT':'GOLD: 55% PERFECT';}
  if(!win&&G.goal)near=G.smashed>=G.goal*0.7?'SO CLOSE!':'';
  G.res={win,medal,run,clear,mb,total,t:0,near,smashed:G.smashed,goal:G.goal,combo:G.maxCombo,best:save.bestCombo,perf:G.perfects||0,hits:G.hits||0,next:waveCfg(win?n+1:n)};
  scene='results';showUI();
}

  const T=G.tut;T.hits++;

  const T=G.tut;T.t+=dt;const R=G.R;
  if(T.doneT>0){T.doneT-=dt;if(T.doneT<=0)finishTut();return;}

  if(T.step===2&&T.C&&(!T.C.alive||T.C.x<R.x-300)&&T.t>1){T.t=0;tutSpawn();}
  if(T.t>0.3&&!G.ents.some(e=>e.alive&&COUNTS[e.type]&&e.x>R.x-150)){T.t=0;tutSpawn();}

// ================= MAIN UPDATE =================
let mascot=null;
function update(dt){
  RT+=dt;
  if(scene==='shop'&&!G)return;
  if(paused)return;
  if(G.res)G.res.t+=dt;
  stepWorld(dt);
}
function stepWorld(rdt){
  const g=G;
  // shake decay (real time)
  g.shake*=Math.exp(-9*rdt);g.shx*=Math.exp(-12*rdt);g.shy*=Math.exp(-12*rdt);
  g.zoomV+=(-g.zoom*200-g.zoomV*14)*rdt;g.zoom+=g.zoomV*rdt;
  g.flash-=rdt;g.comboPop=Math.max(0,g.comboPop-rdt*4);
  for(const p of g.pops)p.t+=rdt;g.pops=g.pops.filter(p=>p.t<1.6);
  if(g.banner){g.banner.t+=rdt;if(g.banner.t>2.6)g.banner=null;}
  if(g.hitstop>0){g.hitstop-=rdt;if(g.hitstop>0)return;}
  if(g.pendHit){const h=g.pendHit;g.pendHit=null;h.e.hitting=false;damage(h.e,h.nx,h.ny);}
  let dt=rdt;if(g.slow>0){g.slow-=rdt;dt*=0.3;}
  g.t+=dt;
  if(g.mode==='demo')demoAI(dt);
  if(g.mode==='tut')tutUpdate(dt);
  updateRocko(dt);
  updateEnts(dt);
  processPending(dt);
  updateParts(dt);
  spawner();
  // combo timer
  if(g.combo>0&&!g.ending){g.comboT-=dt;if(g.comboT<=0){if(g.combo>=5&&g.mode==='play')txt(g.R.x,g.R.y-46,'x'+g.combo+'!',18,'#fff');g.combo=0;}}
  // gust
  if(g.mode==='play'&&g.cfg.wind&&!g.ending)updateGust(dt);else g.windF*=Math.exp(-3*dt);
  // ship
  if(g.mode==='play'&&g.cfg.ship&&!g.ship&&!g.ending){g.shipT-=dt;if(g.shipT<=0)spawnShip();}
  // gull random
  if(g.mode==='play'){g.gullT-=dt;if(g.gullT<=0){g.gullT=rnd(35,60);spawnGull(pick(['HI ROCKO!','SQUAWK!','LOOKIN GOOD!','PUNCH ON!']));}}
  // bonus timer
  if(g.mode==='play'&&g.cfg.bonus&&!g.ending){g.timer-=dt;if(g.timer<=0){g.timer=0;waveClear();}}
  // goal
  if(g.mode==='play'&&!g.ending&&!g.cfg.boss&&!g.cfg.bonus&&g.smashed>=g.goal)waveClear();
  if(g.ending){g.endT-=rdt;if(g.endT<=0&&!g.res&&scene==='play')showResults();}
  // rain
  if(TH.rain&&Math.random()<0.8)P({k:'rain',x:g.camX+rnd(0,VW+200),y:g.camY-20,vx:-120,vy:900,life:1.2});
  // camera
  const R=g.R;
  let tx=R.x-VW*(R.facing>0?0.36:0.6);
  if(g.arena){const A=g.arena,aw=A.x1-A.x0;if(VW>=aw+80)tx=(A.x0+A.x1)/2-VW/2;else tx=clamp(tx,A.x0-40,A.x1+40-VW);}
  g.camX+=(tx-g.camX)*(1-Math.exp(-4*rdt));
  const ty=Math.min(-VH*0.87,R.y-VH*0.38);g.camY+=(ty-g.camY)*(1-Math.exp(-3.5*rdt));
}
function updateGust(dt){
  const gs=G.gust,d=G.cfg.diff;gs.t-=dt;
  if(gs.st==='calm'){G.windF*=Math.exp(-2*dt);if(gs.t<=0){gs.st='warn';gs.t=1.0;gs.dir=Math.random()<0.6?-1:1;gs.up=Math.random()<0.3?-1:0;SFX.wind();G.pops.push({text:gs.dir<0?'◀◀ WIND':'WIND ▶▶',t:0,col:'#dff4ff',small:1});}}
  else if(gs.st==='warn'){if(gs.t<=0){gs.st='blow';gs.t=2.4;}}
  else{G.windF=lerp(G.windF,gs.dir*900*Math.min(1.7,Math.sqrt(d)),Math.min(1,dt*3));if(gs.t<=0){gs.st='calm';gs.t=rnd(3,5.5)/Math.sqrt(d);}}

}
function demoAI(dt){

  if(T.step===1){const rr=22*u+Math.sin(RT*6)*3;circ(c,W/2+150*u,by,rr);c.lineWidth=5;c.strokeStyle='#ffd23f';c.stroke();outText(c,'= ★',W/2+190*u,by,16*u,'#ffe14d');}
  if(T.step===3){c.save();const ay=H*0.82+Math.sin(RT*5)*6;outText(c,'▼ OUCH ▼',W/2,ay-40*u,16*u,'#ff8a9a');c.restore();}
}

// icons for banners/teaser
const icv=document.createElement('canvas');icv.width=256;icv.height=256;const icx=icv.getContext('2d');
function drawIcon(c,type,x,y,size,sil){
  const ic=icx;ic.setTransform(1,0,0,1,0,0);ic.clearRect(0,0,256,256);
  ic.setTransform(3.3,0,0,3.3,128,128);
  const savedG=G;G.iconMode=true;
  const fake={x:0,y:0,t:RT,ph:0,col:'#ff5a6e',armor:true,soft:0,vis:1,r:24,f:-1,hp:3,maxhp:3,e:0,cyc:0,st:'idle',flash:0,zipping:0,vx:0,vy:0,warn:0,shk:0,type:type};
  const nt=savedG.nextTgt;G.nextTgt=null;
  try{
    switch(type){
      case 'goblin':case 'gap':drawGob(ic,Object.assign(fake,{type:'goblin'}));break;
      case 'armor':drawGob(ic,fake);break;
      case 'bomb':drawBomb(ic,fake);break;
      case 'spike':drawSpike(ic,fake);break;
      case 'zip':drawZip(ic,fake);break;
      case 'ship':ic.scale(0.45,0.45);ic.translate(0,30);drawShip(ic,Object.assign(fake,{hp:0,maxhp:0}));break;
      case 'zap':ic.scale(0.6,0.6);drawZap(ic,Object.assign(fake,{y:-9999,st:'idle'}));break;
      case 'split':ic.scale(0.8,0.8);drawGob(ic,fake);break;
      case 'ghost':drawGob(ic,fake);break;
      case 'coinb':drawCoinB(ic,fake);break;
      case 'boss':ic.scale(0.2,0.2);drawBoss(ic,Object.assign(fake,{phase:0,stag:0,dying:0,flash:0}));break;
      case 'wind':ic.strokeStyle='#fff';ic.lineWidth=5;ic.lineCap='round';for(let i=0;i<3;i++){ic.beginPath();ic.moveTo(-24,-14+i*14);ic.quadraticCurveTo(10,-22+i*14,20,-10+i*14);ic.arc(14,-10+i*14,6,0,-Math.PI*1.2,true);ic.stroke();}ic.strokeStyle=OL;ic.globalCompositeOperation='destination-over';ic.lineWidth=9;for(let i=0;i<3;i++){ic.beginPath();ic.moveTo(-24,-14+i*14);ic.quadraticCurveTo(10,-22+i*14,20,-10+i*14);ic.arc(14,-10+i*14,6,0,-Math.PI*1.2,true);ic.stroke();}ic.globalCompositeOperation='source-over';break;
      default:drawGob(ic,Object.assign(fake,{type:'goblin'}));
    }
  }catch(err){}
  G.iconMode=false;G.nextTgt=nt;
  if(sil){ic.setTransform(1,0,0,1,0,0);ic.globalCompositeOperation='source-in';ic.fillStyle='#2a1840';ic.fillRect(0,0,256,256);ic.globalCompositeOperation='source-over';}
  c.drawImage(icv,x-size,y-size,size*2,size*2);
}

// ================= RESULTS =================
function drawMedal(c,x,y,r,m,t){
  const cols=[null,['#e3a06a','#a8612e'],['#eef2f8','#9aa6ba'],['#ffe14d','#d39a00']][m];
  // ribbon
  c.beginPath();c.moveTo(x-r*0.6,y-r*0.3);c.lineTo(x-r*0.9,y+r*1.5);c.lineTo(x-r*0.4,y+r*1.2);c.lineTo(x-r*0.1,y+r*1.55);c.lineTo(x+r*0.1,y);c.closePath();fs(c,'#ff5a6e',2.5);
  c.beginPath();c.moveTo(x+r*0.6,y-r*0.3);c.lineTo(x+r*0.9,y+r*1.5);c.lineTo(x+r*0.4,y+r*1.2);c.lineTo(x+r*0.1,y+r*1.55);c.lineTo(x-r*0.1,y);c.closePath();fs(c,'#5a8cff',2.5);
  cel(c,x,y,r,cols[0],cols[1],3);
  circ(c,x,y,r*0.72);c.lineWidth=2;c.strokeStyle=cols[1];c.stroke();
  starPath(c,x,y,r*0.5,Math.sin(t*2)*0.1);fs(c,cols[0],2.5);
  c.save();circ(c,x,y,r);c.clip();const sx=x-r*1.5+((t*0.8)%2)*r*3;c.fillStyle='rgba(255,255,255,0.55)';c.beginPath();c.moveTo(sx,y-r);c.lineTo(sx+r*0.3,y-r);c.lineTo(sx-r*0.2,y+r);c.lineTo(sx-r*0.5,y+r);c.fill();c.restore();
}
function drawResults(){
  const c=ctx,r=G.res,u=HU;const t=r.t;
  c.fillStyle='rgba(30,14,60,'+Math.min(0.45,t*1.5)+')';c.fillRect(0,0,W,H);
  const btnH=Math.min(150,H*0.24);
  const pw=Math.min(W-24,500),ph=Math.min(H-btnH-30,350);
  const px=W/2-pw/2,py=Math.max(12,(H-btnH-ph)/2);
  const a=easeOutBack(t/0.45);
  c.save();c.translate(W/2,py+ph/2);c.scale(a,a);c.rotate(-0.012);c.translate(-W/2,-(py+ph/2));
  rrect(c,px,py+7,pw,ph,26);c.fillStyle=OL;c.fill();rrect(c,px,py,pw,ph,26);fs(c,'#fff6e0',3.5);
  // ribbon title
  const title=r.win?(G.cfg.boss?'BOSS DOWN!':G.cfg.bonus?'BONUS DONE!':'WAVE '+G.n+' CLEAR!'):(r.near||'OUCH!');
  const fz=Math.min(34,pw*0.075);
  c.save();c.translate(W/2,py+4);c.rotate(-0.03);c.font=font(fz);const tw=Math.min(pw+20,c.measureText(title).width+70);
  c.beginPath();c.moveTo(-tw/2-18,8);c.lineTo(-tw/2,-22);c.lineTo(tw/2,-22);c.lineTo(tw/2+18,8);c.lineTo(tw/2,26);c.lineTo(-tw/2,26);c.closePath();fs(c,r.win?'#ff5a6e':'#7b5bd6',3);
  outText(c,title,0,2,fz,'#fff');c.restore();
  // medal
  const mx=px+Math.min(95,pw*0.22),my=py+ph*0.42,mr=Math.min(46,pw*0.1);
  if(r.medal>0){const ma=t<0.6?0:easeOutBack((t-0.6)/0.4);c.save();c.translate(mx,my);c.scale(ma,ma);c.rotate((1-ma)*2);drawMedal(c,0,0,mr,r.medal,RT);c.restore();
    if(t>0.6&&t<0.7&&!r.mfx){r.mfx=1;SFX.milestone();}
    for(let i=0;i<3;i++){const sx=mx-mr+i*mr,sy=my+mr*1.95;starPath(c,sx,sy,mr*0.28,0);fs(c,i<r.medal?'#ffe14d':'#d8c9b0',2);}}
  else{c.save();c.translate(mx,my);const s=mr/16;c.scale(s,s);heartPath(c,0,0,16);fs(c,'#ff5a6e',2.5);c.strokeStyle=OL;c.lineWidth=2.5;c.beginPath();c.moveTo(-2,-10);c.lineTo(3,-2);c.lineTo(-3,4);c.lineTo(2,12);c.stroke();c.restore();
    if(r.goal){const bw=mr*2.4;rrect(c,mx-bw/2,my+mr*1.4,bw,12,6);c.fillStyle='rgba(42,24,64,0.2)';c.fill();rrect(c,mx-bw/2,my+mr*1.4,bw*clamp(r.smashed/r.goal,0,1),12,6);c.fillStyle='#ff9a14';c.fill();}}
  // stats
  const sx=px+Math.min(190,pw*0.42),sw=px+pw-24-sx;const lh=Math.min(44,ph*0.13);let sy=py+ph*0.22;
  const ct=k=>Math.floor(easeOutCubic(clamp((t-0.3-k*0.25)/0.7,0,1))*1000)/1000;
  const rows=[[ 'gob',G.cfg.boss?(r.smashed+' / '+r.goal):(''+Math.round(Math.min(r.goal||999,r.smashed)*ct(0))+(r.goal&&!G.cfg.bonus?' / '+r.goal:'')) ],
             [ 'combo','x'+Math.round(r.combo*ct(1))+(r.combo>=r.best&&r.combo>=5?'  BEST!':'') ],
             [ 'perf',(G.cfg.bonus?'':'PERFECT '+Math.round(r.perf*ct(1.5))+' / '+r.hits) ],
             [ 'coin','+'+Math.round(r.total*ct(2)) ]].filter(x=>x[1]!=='');
  rows.forEach((row,i)=>{const yy=sy+i*lh;c.save();c.translate(sx+14,yy);
    if(row[0]==='gob')goblinHead(c,0,0,11,{t:RT,ph:0,skin:'#77d35a',shade:'#45a040',ko:true});
    else if(row[0]==='combo'){starPath(c,0,0,13,0);fs(c,'#ffe14d',2);}
    else if(row[0]==='perf'){starPath(c,0,0,14,RT,8);fs(c,'#fff6c8',2);circ(c,0,0,5);c.fillStyle='#ffd23f';c.fill();}
    else{circ(c,0,0,11);fs(c,'#ffd23f',2);circ(c,0,0,5);c.fillStyle='#fff3a0';c.fill();}
    c.restore();const avail=sw-40;
    if(row[0]==='coin'){let f=Math.min(28,lh*0.66);c.font=font(f);const w=c.measureText(row[1]).width;if(w>avail)f*=avail/w;outText(c,row[1],sx+36,yy,f,'#ffd23f','left',5);}
    else{let f=Math.min(26,lh*0.62);c.font=font(f);const w=c.measureText(row[1]).width;if(w>avail)f*=avail/w;c.font=font(f);c.fillStyle='#2a1840';c.textAlign='left';c.textBaseline='middle';c.fillText(row[1],sx+36,yy);}
  });
  if(t>0.3&&t<2.2&&Math.random()<0.4&&ct(2)<1)SFX.coin();
  if(r.near&&r.win){const nx0=px+22,maxw=pw-150,ny0=py+ph-30;const txt2=r.near.replace('GOLD: ','');
    starPath(c,nx0+11,ny0-22,10,0);fs(c,'#ffe14d',2);c.font=font(14);c.fillStyle='#8a5a9e';c.textAlign='left';c.textBaseline='middle';c.fillText('GOLD NEEDS',nx0+28,ny0-22);
    let f=19;c.font=font(f);const w=c.measureText(txt2).width;if(w>maxw)f*=maxw/w;c.font=font(f);c.fillStyle='#2a1840';c.fillText(txt2,nx0,ny0+2);}
  // teaser
  const nx=r.next;const tt=nx.newT;const tyy=py+ph-58,txx=px+pw-70;
  if(ph>250){
    c.save();c.translate(txx,tyy);c.rotate(0.03);
    const bob=Math.sin(RT*2)*3;
    c.beginPath();for(const b of[[-30,6,22],[-8,-8,28],[20,-2,24],[34,10,16],[0,14,22]]){c.moveTo(b[0]+b[2],b[1]+bob);c.arc(b[0],b[1]+bob,b[2],0,TAU);}fs(c,'#dfe8ff',2.5);
    c.restore();
    const showSil=r.win&&!(save.medals[G.n+1]);
    drawIcon(c,tt==='remix'?pick(['bomb','zip','armor','ghost','split']):tt,txx,tyy+Math.sin(RT*2)*3,36,showSil&&tt!=='remix');
    if(showSil)outText(c,'?',txx+30,tyy-24,26,'#ffe14d');
    outText(c,r.win?'NEXT':'AGAIN',txx,tyy-52,14,'#fff');
  }
  c.restore();
}

// ================= TITLE =================
function drawTitle(){
  const c=ctx,u=HU;c.setTransform(DPR,0,0,DPR,0,0);
  // vignette top
  const vg=c.createLinearGradient(0,0,0,H*0.45);vg.addColorStop(0,'rgba(30,14,70,0.35)');vg.addColorStop(1,'rgba(30,14,70,0)');c.fillStyle=vg;c.fillRect(0,0,W,H*0.45);
  const fz=Math.min(W*0.135,H*0.15,118);
  const y1=Math.max(fz*0.72,H*0.12)+8,y2=y1+fz*0.98;
  // comet streak
  c.save();c.translate(W/2,y2);const sw=Math.min(W*0.9,fz*6);
  const gr=c.createLinearGradient(-sw/2,0,sw/2,0);gr.addColorStop(0,'rgba(255,230,120,0)');gr.addColorStop(0.7,'rgba(255,180,60,0.55)');gr.addColorStop(1,'rgba(255,255,220,0.95)');
  c.fillStyle=gr;c.beginPath();c.moveTo(-sw/2,-fz*0.06);c.quadraticCurveTo(0,-fz*0.55,sw*0.5,-fz*0.18);c.lineTo(sw*0.5,fz*0.25);c.quadraticCurveTo(0,fz*0.5,-sw/2,fz*0.06);c.fill();
  for(let i=0;i<7;i++){const a=(RT*0.5+i/7)%1;const x=lerp(sw*0.45,-sw*0.5,a);starPath(c,x,Math.sin(i*2+RT)*fz*0.25,fz*0.07*(1-a)+2,RT*3+i);c.fillStyle='#fff6c0';c.fill();}
  c.restore();
  fancyWord('KNUCKLE',W/2,y1,fz*0.86,['#fff8c8','#ffe14d','#ffb020','#ff7a1a'],0);
  fancyWord('COMET',W/2,y2,fz*1.08,['#e8fbff','#8fe3ff','#4fa8ff','#5a5cff'],3);
  // mascot
  if(!mascot){mascot=newRocko(0,0);mascot.jab=1.5;}
  const M=mascot;const portrait=W<H*0.9;
  let ms=portrait?Math.min(3.4,W/120):Math.min(3.6,H/150);
  const avail=W/2-160;if(!portrait)ms=Math.min(ms,avail/75);
  const mxs=portrait?W*0.5:Math.min(W*0.2,avail-40*ms);const mys=portrait?Math.min(H*0.52,y2+fz*0.6+ms*36):H*0.64;
  updateMascot(M,1/60);
  c.save();c.translate(mxs,mys);c.scale(ms,ms);
  // cloud seat
  c.globalAlpha=0.95;for(const b of[[-24,30,14],[-6,34,16],[14,32,14],[28,36,10]]){circ(c,b[0],b[1],b[2]+1.5);c.fillStyle=OL;c.fill();}for(const b of[[-24,30,14],[-6,34,16],[14,32,14],[28,36,10]]){circ(c,b[0],b[1],b[2]);c.fillStyle='#fff';c.fill();}c.globalAlpha=1;
  drawRocko(c,M,{title:true});
  c.restore();
  // best
  if(save.started){c.font=font(13*u);c.textAlign='left';c.fillStyle='rgba(255,255,255,0.9)';const gold=Object.values(save.medals).filter(m=>m===3).length;
    outText(c,'★ '+gold+'   x'+save.bestCombo+' BEST   ● '+Math.floor(save.coins),14,H-16,13*u,'#fff','left');}
}
function updateMascot(M,dt){
  const t=RT;M.x=Math.sin(t*1.3)*3;M.y=Math.sin(t*2.2)*4-6;M.vx=40;M.vy=Math.cos(t*2.2)*8;M.facing=1;
  M.jab-=dt;
  if(M.jab<0){M.jab=rnd(1.6,2.8);M.dashing=true;M.dir=-0.25;M.glove.vx+=1400;M.glove.vy-=300;M.gsqv+=40;M.mood='fierce';M.moodT=0.3;M.jabT=0.18;if(AC&&scene==='title')SFX.whoosh();}
  if(M.jabT>0){M.jabT-=dt;if(M.jabT<=0){M.dashing=false;M.mood='joy';M.moodT=0.6;}}
  const savedG=G;
  // reuse animRocko with fake context
  const gl=M.glove,f=1;let tx=M.dashing?M.x+40:M.x+22,ty=M.dashing?M.y-6:M.y+4+Math.sin(t*4)*2;
  gl.vx+=((tx-gl.x)*620-gl.vx*17)*dt;gl.vy+=((ty-gl.y)*620-gl.vy*17)*dt;gl.x+=gl.vx*dt;gl.y+=gl.vy*dt;
  const gdx=gl.x-M.x,gdy=gl.y-M.y,gd=Math.hypot(gdx,gdy);if(gd>52){gl.x=M.x+gdx/gd*52;gl.y=M.y+gdy/gd*52;}
  M.gsqv+=(-M.gsq*500-M.gsqv*14)*dt;M.gsq+=M.gsqv*dt;
  const s=M.scarf;s[0].x=M.x-8;s[0].y=M.y-7;s[0].px=s[0].x;s[0].py=s[0].y;
  for(let i=1;i<s.length;i++){const p=s[i];const vx=(p.x-p.px)*0.9,vy=(p.y-p.py)*0.9;p.px=p.x;p.py=p.y;p.x+=vx-0.9+Math.sin(t*14+i*0.9)*0.25;p.y+=vy+0.05+Math.cos(t*11+i)*0.45;}
  for(let k=0;k<3;k++)for(let i=1;i<s.length;i++){const a=s[i-1],b=s[i];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;const m=(d-6.2)/d;b.x-=dx*m;b.y-=dy*m;}
  M.blinkT-=dt;if(M.blinkT<0){M.blink=0.12;M.blinkT=rnd(1.8,4);}M.blink-=dt;M.moodT-=dt;
  M.lookX=1;M.lookY=-0.1;M.st=Math.sin(t*2.2)*0.04;M.sqAng=Math.PI/2;
}
function fancyWord(word,cx,cy,fz,cols,seed){
  const c=ctx;c.font=font(fz);const ws=[...word].map(ch=>c.measureText(ch).width*0.94);const tot=ws.reduce((a,b)=>a+b,0);
  let x=cx-tot/2;
  for(let i=0;i<word.length;i++){const ch=word[i];const w=ws[i];
    const rot=Math.sin(RT*2+i*0.8+seed)*0.05+(i%2?0.05:-0.05);const bob=Math.sin(RT*3+i*0.75+seed)*fz*0.03;
    c.save();c.translate(x+w/2,cy+bob);c.rotate(rot);c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';
    for(let k=7;k>=1;k--){c.fillStyle=k>5?OL:'#5a2a7a';c.fillText(ch,0,k*fz*0.012);}
    c.lineWidth=fz*0.16;c.strokeStyle=OL;c.strokeText(ch,0,0);
    const g=c.createLinearGradient(0,-fz*0.42,0,fz*0.4);g.addColorStop(0,cols[0]);g.addColorStop(0.45,cols[1]);g.addColorStop(0.52,cols[2]);g.addColorStop(1,cols[3]);
    c.fillStyle=g;c.fillText(ch,0,0);
    c.save();c.globalAlpha=0.5;c.fillStyle='#fff';c.beginPath();c.ellipse(-w*0.18,-fz*0.24,w*0.12,fz*0.05,-0.4,0,TAU);c.fill();c.restore();
    c.restore();x+=w;}
}

// ================= LOOP =================
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;
  try{update(dt);render();}catch(err){console.warn(err);}
  requestAnimationFrame(frame);
}
resize();
toTitle();
// expose for tests
window.__kc={get G(){return G;},get scene(){return scene;},get save(){return save;},startWave,get paused(){return paused;}};
requestAnimationFrame(frame);
</script>

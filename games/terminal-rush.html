<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Terminal Rush</title>
<style>
:root{--g:#39ff7a;--gd:#1c9c48;--gdd:#0d4a24;--bg:#020a05;--amber:#ffb000;--red:#ff3b3b;--mono:"DejaVu Sans Mono","Cascadia Mono",Consolas,Menlo,"Liberation Mono","Courier New",monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--g);font-family:var(--mono);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
body{background:radial-gradient(ellipse at 50% 45%,#08260f 0%,#031008 55%,#010402 100%)}
#bg{position:fixed;inset:0;width:100vw;height:100vh;opacity:.55}
#crt{position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.28) 3px,rgba(0,0,0,0) 4px);animation:flick 4s infinite steps(1)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:51;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.75) 100%)}
#alarm{position:fixed;inset:0;pointer-events:none;z-index:49;box-shadow:inset 0 0 120px rgba(255,40,40,.0);transition:box-shadow .2s}
@keyframes flick{0%{opacity:.9}50%{opacity:1}52%{opacity:.85}54%{opacity:1}}
.glow{text-shadow:0 0 4px rgba(57,255,122,.8),0 0 14px rgba(57,255,122,.35)}
.scr{position:fixed;inset:0;display:none;flex-direction:column;z-index:10;padding:14px 16px}
.scr.on{display:flex}
button{font-family:var(--mono);background:transparent;color:var(--g);border:2px solid var(--g);padding:10px 18px;font-size:18px;font-weight:700;cursor:pointer;text-shadow:0 0 6px rgba(57,255,122,.7);box-shadow:0 0 12px rgba(57,255,122,.25),inset 0 0 12px rgba(57,255,122,.12);letter-spacing:1px}
button:hover,button:focus-visible{background:rgba(57,255,122,.14);outline:none}
button:active{transform:translateY(1px)}
button.big{font-size:24px;padding:14px 34px}
button.dim{border-color:var(--gd);color:var(--gd);box-shadow:none}
button.ico{width:42px;height:42px;padding:0;font-size:18px;display:flex;align-items:center;justify-content:center}
/* title */
#title{align-items:center;justify-content:center;text-align:center}
.logo{font-weight:900;line-height:.92;font-size:min(15vw,17vh,128px);letter-spacing:-.02em;position:relative;color:var(--g)}
.logo span{display:block;position:relative;isolation:isolate}
.logo span::before,.logo span::after{content:attr(data-t);position:absolute;left:0;right:0;top:0;opacity:.7;z-index:-1;text-shadow:none}
.logo span::before{color:#ff2e6e;transform:translate(-3px,0);clip-path:inset(0 0 55% 0);animation:gl1 2.6s infinite}
.logo span::after{color:#29e6ff;transform:translate(3px,0);clip-path:inset(50% 0 0 0);animation:gl2 3.1s infinite}
.logo span.r{color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.8),0 0 22px rgba(255,176,0,.35)}
@keyframes gl1{0%,90%,100%{transform:translate(-3px,0)}92%{transform:translate(-9px,2px)}94%{transform:translate(4px,-1px)}}
@keyframes gl2{0%,85%,100%{transform:translate(3px,0)}87%{transform:translate(10px,-2px)}89%{transform:translate(-5px,1px)}}
.prompt{margin:18px 0 26px;font-size:min(4vw,18px);color:var(--gd)}
.cur{display:inline-block;width:.6em;height:1.05em;background:var(--g);vertical-align:-2px;animation:blink 1s steps(1) infinite;box-shadow:0 0 8px var(--g)}
@keyframes blink{50%{opacity:0}}
.hint{margin-top:16px;font-size:13px;color:var(--gd)}
/* top bar */
.bar{display:flex;align-items:center;gap:10px;min-height:46px;flex-wrap:nowrap}
.bar .sp{flex:1}
.cred{color:var(--amber);font-weight:700;font-size:18px;text-shadow:0 0 6px rgba(255,176,0,.6);white-space:nowrap}
/* map */
#map .corps{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:6px 2px 10px;scrollbar-width:thin}
.corp{border:1px solid var(--gdd);padding:10px 12px;background:rgba(10,40,20,.35)}
.corp h3{margin:0 0 8px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
.corp h3 small{color:var(--gd);font-weight:400}
.nodes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.node{border:1px solid var(--gd);padding:8px 4px;text-align:center;cursor:pointer;font-size:13px;min-height:52px;display:flex;flex-direction:column;justify-content:center;gap:2px}
.node b{font-size:20px}
.node.lock{opacity:.3;cursor:default}
.node.done{background:rgba(57,255,122,.12);border-color:var(--g)}
.node.next{border-color:var(--amber);color:var(--amber);animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 14px rgba(255,176,0,.5)}}
.corp.locked{opacity:.35}
.foot{display:flex;gap:10px;justify-content:center;padding-top:8px;flex-wrap:wrap}
/* shop */
#shop .list{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px;align-content:start;padding:8px 2px}
.up{border:1px solid var(--gdd);padding:12px;display:flex;gap:12px;align-items:center;background:rgba(10,40,20,.35)}
.up .ic{width:48px;height:48px;border:2px solid var(--g);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:900;flex:none}
.up .mid{flex:1;min-width:0}
.up .nm{font-weight:700}
.pips{display:flex;gap:4px;margin-top:6px}.pips i{width:14px;height:6px;background:var(--gdd)}.pips i.on{background:var(--g);box-shadow:0 0 6px var(--g)}
.up button{font-size:15px;padding:8px 10px;white-space:nowrap}
.up button.no{border-color:var(--gdd);color:var(--gdd);box-shadow:none}
/* game */
#game{padding:10px 14px}
.trace{position:relative;height:22px;border:2px solid var(--g);margin:6px 0;box-shadow:0 0 10px rgba(57,255,122,.25)}
.trace i{position:absolute;left:0;top:0;bottom:0;width:0;background:repeating-linear-gradient(90deg,var(--g) 0 8px,rgba(57,255,122,.6) 8px 10px);box-shadow:0 0 12px var(--g)}
.trace span{position:absolute;right:6px;top:0;line-height:18px;font-size:13px;font-weight:700;mix-blend-mode:difference;color:#fff}
.trace.warn{border-color:var(--amber)}.trace.warn i{background:repeating-linear-gradient(90deg,var(--amber) 0 8px,rgba(255,176,0,.6) 8px 10px);box-shadow:0 0 12px var(--amber)}
.trace.crit{border-color:var(--red);animation:shk .15s infinite}.trace.crit i{background:repeating-linear-gradient(90deg,var(--red) 0 8px,rgba(255,59,59,.6) 8px 10px);box-shadow:0 0 16px var(--red)}
@keyframes shk{50%{transform:translateX(2px)}}
.stats{display:flex;gap:16px;font-size:14px;flex-wrap:wrap;color:var(--gd)}.stats b{color:var(--g)}
.stats .tab{color:var(--amber)}
.term{flex:1;overflow:hidden;position:relative;margin-top:8px;border-top:1px dashed var(--gdd);padding-top:8px;display:flex;flex-direction:column;justify-content:center}
.hist{color:var(--gd);opacity:.6;font-size:min(3.6vw,16px);white-space:pre-wrap;word-break:break-all;max-height:30%;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.hist div::before{content:"$ ";color:var(--gdd)}
.line{font-size:min(5.6vw,clamp(18px,3vw,30px));line-height:1.45;white-space:pre-wrap;word-break:break-all;padding:10px 0;position:relative}
.line .ok{color:var(--g);text-shadow:0 0 6px rgba(57,255,122,.8)}
.line .c{background:var(--g);color:var(--bg);box-shadow:0 0 10px var(--g)}
.line .c.bad{background:var(--red);box-shadow:0 0 14px var(--red)}
.line .rest{color:#7fae8f}
.line .pre{color:var(--amber)}
.line.fw .rest{color:#e58f8f}
.line.glitch{animation:glt .3s}
@keyframes glt{0%{transform:translate(0)}20%{transform:translate(-6px,1px);filter:hue-rotate(90deg)}40%{transform:translate(5px,-1px)}60%{transform:translate(-3px,0);filter:none}100%{transform:none}}
.fwbar{height:4px;background:var(--gdd);margin-top:2px}.fwbar i{display:block;height:100%;width:0;background:var(--red);box-shadow:0 0 8px var(--red)}
.next{color:var(--gdd);font-size:min(3.8vw,17px);white-space:pre-wrap;word-break:break-all;margin-top:6px}
.next div{opacity:.9}.next div+div{opacity:.55}
.banner{position:absolute;left:0;right:0;top:40%;text-align:center;font-size:min(8vw,44px);font-weight:900;pointer-events:none;opacity:0}
.banner.show{animation:ban 1s forwards}
@keyframes ban{0%{opacity:0;transform:scale(1.4)}15%{opacity:1;transform:scale(1)}80%{opacity:1}100%{opacity:0}}
.shake{animation:sh .18s}
@keyframes sh{25%{transform:translate(-4px,2px)}50%{transform:translate(4px,-2px)}75%{transform:translate(-2px,1px)}}
/* overlays */
.ov{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(1,6,3,.86)}
.ov.on{display:flex}
.box{border:2px solid var(--g);padding:22px 26px;min-width:min(380px,92vw);max-width:94vw;text-align:center;background:rgba(2,14,6,.95);box-shadow:0 0 30px rgba(57,255,122,.25)}
.box h2{margin:0 0 10px;font-size:min(8vw,38px)}
.box.bad{border-color:var(--red)}.box.bad h2{color:var(--red);text-shadow:0 0 10px var(--red)}
.rank{font-size:64px;font-weight:900;line-height:1;margin:6px 0;color:var(--amber);text-shadow:0 0 16px rgba(255,176,0,.7)}
.kv{display:grid;grid-template-columns:auto auto;gap:4px 18px;justify-content:center;margin:10px 0 16px;font-size:16px;text-align:left}
.kv b{text-align:right}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#bHow{margin-top:14px;font-size:15px;padding:8px 16px;border-color:var(--gd);color:var(--g)}
.gbsup{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));z-index:52;font-size:12px;color:var(--g);opacity:.55;text-decoration:none;text-shadow:0 0 6px rgba(57,255,122,.5);transition:opacity .2s}
.gbsup:hover{opacity:1}
#kb{position:fixed;left:-9999px;top:0;opacity:0;width:10px;height:10px}
.tapkb{display:none;margin-top:8px;font-size:13px;color:var(--amber);text-align:center}
@media (hover:none) and (pointer:coarse){.tapkb{display:block}}
@media (max-width:520px){.nodes{gap:5px}.node{font-size:11px;padding:6px 2px}.node b{font-size:17px}button{font-size:16px;padding:9px 12px}button.big{font-size:20px}.stats{gap:10px;font-size:12px}}
</style></head>

<canvas id="bg"></canvas>
<div id="alarm"></div>
<!-- TITLE -->
<div id="title" class="scr on">
 <div class="logo glow"><span data-t="TERMINAL">TERMINAL</span><span class="r" data-t="RUSH">RUSH</span></div>

<!-- SHOP -->

<!-- GAME -->
<div id="game" class="scr">

  <div class="hist" id="hist"></div>
  <div class="line" id="line"></div>
  <div class="fwbar" id="fwbar" style="visibility:hidden"><i></i></div>
  <div class="next" id="next"></div>
  <div class="banner glow" id="banner"></div>
 </div>
 <div class="tapkb" id="tapkb">Tap here for keyboard</div>
</div>
<!-- OVERLAYS -->
<div class="ov" id="ovPause"><div class="box"><h2 class="glow">PAUSED</h2><div class="btns"><button id="pRes">RESUME</button><button id="pQuit" class="dim">ABORT</button></div></div></div>

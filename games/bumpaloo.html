<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Bumpaloo</title>
<style>
:root{--ink:#2b1d3a;--cream:#fff7e8;--sun:#ffd23f;--sunD:#f29e0c;--pink:#ff5fa2;--teal:#1fc6c4;--sea:#1883a8;--grape:#7b5cff;--safeT:env(safe-area-inset-top,0px);--safeB:env(safe-area-inset-bottom,0px);--safeL:env(safe-area-inset-left,0px);--safeR:env(safe-area-inset-right,0px)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#7fd3ff;font-family:"Trebuchet MS","Segoe UI","Verdana",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
.scr{position:fixed;inset:0;display:none;z-index:10}
.scr.on{display:flex}
.hide{display:none!important}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.14em;background:radial-gradient(circle at 34% 30%,#fffbd0 0 14%,#ffd02a 30%,#e89a00 78%);border:2px solid #8a4f00;box-shadow:inset 0 -2px 0 rgba(0,0,0,.18)}
/* ---------- title ---------- */
#title{flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--safeT) + 4vh) 16px calc(var(--safeB) + 26px);pointer-events:none}
#title>*{pointer-events:auto}
#logo{display:flex;gap:.02em;font-weight:900;font-size:clamp(54px,14.5vw,128px);line-height:1;letter-spacing:-.02em;margin-top:1vh;filter:drop-shadow(0 10px 0 rgba(43,29,58,.28))}
#logo span{display:inline-block;-webkit-text-stroke:.11em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink);animation:bob 1.6s cubic-bezier(.45,0,.55,1) infinite;transform-origin:50% 90%}
#logo span:nth-child(odd){animation-delay:-.4s}
#logo span:nth-child(3n){animation-delay:-.8s}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}45%{transform:translateY(-.09em) scale(.96,1.05)}55%{transform:translateY(-.09em) scale(.96,1.05)}90%{transform:translateY(0) scale(1.07,.92)}}
@media (min-aspect-ratio:6/5){#title{align-items:flex-start;padding-left:calc(var(--safeL) + 4.5vw);justify-content:center;gap:5vh}.tTop{align-items:flex-start}.menu{align-items:flex-start;width:auto}#logo{font-size:clamp(46px,10vw,124px);margin-top:0}#tagline{margin-left:.4em}.menu .row{justify-content:flex-start;max-width:440px}}
@media (max-width:560px){#logo{margin-top:46px}#tutCap{top:calc(var(--safeT) + 108px)}}
#tagline{margin-top:6px;font-weight:900;font-size:clamp(15px,3.6vw,22px);color:#fff;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;letter-spacing:.02em;transform:rotate(-2deg)}
.tTop{display:flex;flex-direction:column;align-items:center}
.menu{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(440px,100%)}
.bigb{position:relative;font-weight:900;font-size:clamp(28px,7vw,40px);padding:.32em 1.3em .38em;border-radius:999px;color:var(--ink);background:linear-gradient(#fff3a6,#ffd23f 45%,#ffaa1d);border:4px solid var(--ink);box-shadow:0 8px 0 var(--ink),inset 0 -7px 0 rgba(170,80,0,.25),inset 0 5px 0 rgba(255,255,255,.75);transition:transform .08s,box-shadow .08s;min-width:min(300px,86vw)}
.bigb small{display:block;font-size:.42em;letter-spacing:.06em;opacity:.75;margin-top:-.15em}
.bigb:active,.bigb.press{transform:translateY(6px);box-shadow:0 2px 0 var(--ink),inset 0 -7px 0 rgba(170,80,0,.25),inset 0 5px 0 rgba(255,255,255,.75)}
.bigb::after{content:"";position:absolute;left:18%;top:12%;width:22%;height:22%;border-radius:50%;background:rgba(255,255,255,.7);filter:blur(1px)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;font-weight:800;font-size:16px;padding:9px 14px 10px;border-radius:16px 16px 18px 18px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.chip:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.chip svg{width:20px;height:20px}
.chip.c1{background:#bff3ff}.chip.c2{background:#ffd3e6}.chip.c3{background:#d9ffc4}
.diff{display:flex;background:rgba(43,29,58,.75);border-radius:999px;padding:4px;gap:2px}
.diff button{font-weight:800;font-size:13px;color:#fff;padding:6px 12px;border-radius:999px;opacity:.7}
.diff button.on{background:#fff;color:var(--ink);opacity:1;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.diff button[data-d="2"].on{background:#ff4d6d;color:#fff}
.wallet{position:fixed;top:calc(var(--safeT) + 12px);right:calc(var(--safeR) + 66px);font-weight:900;font-size:18px;background:var(--cream);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 5px 8px;box-shadow:0 4px 0 var(--ink);display:flex;align-items:center;gap:6px}
.wallet b{font-size:15px;color:#c78100}
#gbSupport{position:fixed;right:calc(8px + var(--safeR));bottom:calc(6px + var(--safeB));z-index:60;font:600 11.5px/1 system-ui,-apple-system,sans-serif;color:#2b1d3a;opacity:.55;text-decoration:none;padding:3px 4px;transition:opacity .2s}
#gbSupport:hover,#gbSupport:focus-visible{opacity:1}
.rb{position:fixed;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;z-index:30;background:radial-gradient(circle at 35% 30%,#fff 0 18%,#ffe9f1 40%,#ffb3cf);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);pointer-events:auto}
.rb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.rb svg{width:22px;height:22px}
#muteB{top:calc(var(--safeT) + 10px);right:calc(var(--safeR) + 10px)}
#pauseB{top:calc(var(--safeT) + 10px);right:calc(var(--safeR) + 64px)}
/* ---------- hud ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;display:none}
#hud.on{display:block}
#lvPill{position:absolute;top:calc(var(--safeT) + 10px);left:calc(var(--safeL) + 10px);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.flag{font-weight:900;font-size:15px;background:var(--cream);border:3px solid var(--ink);border-radius:12px 18px 18px 12px;padding:4px 14px 5px 10px;box-shadow:0 4px 0 var(--ink);white-space:nowrap;max-width:46vw;overflow:hidden;text-overflow:ellipsis}
.flag i{font-style:normal;background:var(--pink);color:#fff;border-radius:8px;padding:0 6px;margin-right:6px;-webkit-text-stroke:0}
#hudCoins{font-weight:900;font-size:16px;color:#fff;-webkit-text-stroke:4px var(--ink);paint-order:stroke fill;display:flex;align-items:center;gap:5px;padding-left:4px}
#hudCoins.bump{animation:cbump .35s cubic-bezier(.3,1.8,.5,1)}@keyframes cbump{0%{transform:scale(1.5)}100%{transform:scale(1)}}
#goal{position:absolute;top:calc(var(--safeT) + 12px);left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:5px;background:rgba(43,29,58,.72);border-radius:999px;padding:5px 10px;color:#fff;font-weight:900;font-size:15px}
#goal .face{width:22px;height:22px;border-radius:50%;border:2px solid #fff;position:relative;transition:transform .3s,filter .3s,opacity .3s}
#goal .face::before,#goal .face::after{content:"";position:absolute;top:6px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:inset 1px 1px 0 2px #111}
#goal .face::before{left:3px}#goal .face::after{right:3px}
#goal .face.out{filter:grayscale(1) brightness(.6);opacity:.55;transform:scale(.75) rotate(25deg)}
#goal .face.boss{width:30px;height:26px;border-radius:8px}
#goal .wv{display:flex;gap:3px;margin-right:4px}#goal .wv b{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.3)}#goal .wv b.done{background:#8fe04a}#goal .wv b.cur{background:#ffd23f;box-shadow:0 0 0 2px #fff}
#hearts{display:flex;gap:2px;padding-left:2px}#hearts .ht{width:24px;height:24px;display:block}#hearts .ht svg{width:100%;height:100%;fill:#ff4d6d}#hearts .ht.off svg{fill:#7d6f8c;opacity:.6}#hearts .ht.lost{animation:hlost .6s cubic-bezier(.3,1.8,.5,1)}@keyframes hlost{0%{transform:scale(1.9) rotate(-20deg)}100%{transform:none}}
#flash.red{background:#ff2d55}
.chk{display:flex;flex-direction:column;gap:3px;align-items:center;margin:2px 0 4px;font-weight:800;font-size:14px}.chk div{display:flex;gap:6px;align-items:center}.chk b{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:#e3d8ee;color:#fff;font-size:13px;border:2px solid var(--ink)}.chk .ok b{background:#5fd35a}.chk .no{opacity:.6}
#timer{margin-left:6px;font-size:14px;opacity:.85;min-width:30px;text-align:right}
@media (max-width:560px){#goal{top:calc(var(--safeT) + 66px)}}
#hint{position:absolute;left:50%;bottom:calc(var(--safeB) + 18px);transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(43,29,58,.72);color:#fff;font-weight:800;font-size:14px;border-radius:16px;padding:8px 14px;transition:opacity .8s;white-space:nowrap}
#hint .k{display:inline-grid;place-items:center;min-width:26px;height:26px;padding:0 6px;border-radius:7px;background:#fff;color:var(--ink);border-bottom:3px solid #b9a9c9;font-size:13px;margin:0 2px}
#hint.fade{opacity:0}
#banner{position:fixed;left:50%;top:30%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:8;pointer-events:none;text-align:center;transition:transform .35s cubic-bezier(.3,1.6,.5,1),opacity .25s}
#banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#banner .b1{font-weight:900;font-size:clamp(30px,7vw,54px);color:#fff;-webkit-text-stroke:8px var(--ink);paint-order:stroke fill;white-space:nowrap}
#banner .b2{display:inline-block;margin-top:6px;font-weight:900;font-size:clamp(15px,3.6vw,20px);background:var(--sun);border:3px solid var(--ink);border-radius:14px;padding:5px 14px;box-shadow:0 4px 0 var(--ink);white-space:nowrap}
#banner .b2 em{font-style:normal;background:var(--pink);color:#fff;border-radius:7px;padding:0 6px;margin-right:6px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.pop{position:absolute;left:0;top:0;font-weight:900;white-space:nowrap;color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;font-size:30px;will-change:transform,opacity}
.pop.big{font-size:46px;color:var(--sun)}
.pop.boing{color:#ffe14d;font-size:38px}
.pop.coin{font-size:22px;color:#ffe066}
.pop.sm{font-size:20px}
.pop.red{color:#ff6b6b}
.pop.blue{color:#8be3ff}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:7}
/* ---------- panels ---------- */
.panelWrap{align-items:center;justify-content:center;background:rgba(30,20,50,.35);padding:16px}
.panel{position:relative;background:linear-gradient(#fffaf0,#ffeccf);border:4px solid var(--ink);border-radius:30px;box-shadow:0 10px 0 var(--ink),inset 0 -8px 0 rgba(200,120,40,.14);padding:22px 22px 26px;width:min(460px,100%);text-align:center;animation:pin .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes pin{0%{transform:translateY(40px) scale(.7);opacity:0}100%{transform:none;opacity:1}}
.panel h2{margin:0 0 4px;font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:7px var(--ink);paint-order:stroke fill;line-height:1.1}
.panel .sub{font-weight:800;opacity:.7;font-size:15px}
.stars{display:flex;justify-content:center;gap:6px;margin:12px 0 6px}
.stars svg{width:64px;height:64px;transform:scale(0);filter:drop-shadow(0 4px 0 rgba(43,29,58,.35))}
.stars svg.on{animation:star .5s cubic-bezier(.3,1.8,.5,1) forwards}
.stars svg:nth-child(2){margin-top:-14px;width:76px;height:76px}
@keyframes star{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.earn{font-weight:900;font-size:30px;display:flex;align-items:center;justify-content:center;gap:8px;margin:6px 0}
.near{font-weight:800;font-size:14px;color:#d1456e;min-height:18px}
.tease{margin:12px auto 16px;background:#2b1d3a;color:#fff;border-radius:16px;padding:9px 12px;font-weight:800;font-size:15px;display:flex;align-items:center;gap:10px;justify-content:center}
.tease i{font-style:normal;background:var(--pink);border-radius:8px;padding:1px 7px;font-size:12px;letter-spacing:.05em}
.prow{display:flex;gap:10px;justify-content:center;align-items:center}
.sq{width:56px;height:56px;border-radius:18px;display:grid;place-items:center;background:var(--cream);border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
.sq:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.sq svg{width:26px;height:26px}
.panel .bigb{min-width:0;flex:1;font-size:30px;white-space:nowrap;padding:.32em .6em .38em}
@media (max-width:440px){.panel{padding:18px 14px 22px}.panel .bigb{font-size:24px}.sq{width:48px;height:48px;border-radius:15px}.prow{gap:7px}.panel h2{font-size:30px}}
/* garage */
#garage{flex-direction:column;justify-content:flex-end;align-items:center;padding:12px 12px calc(var(--safeB) + 12px);pointer-events:none}
#garage .panel{pointer-events:auto;width:min(560px,100%);padding:14px 16px 18px;animation:slideup .4s cubic-bezier(.3,1.3,.5,1)}
@keyframes slideup{0%{transform:translateY(100%)}100%{transform:none}}
.carSel{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.carSel .nm{font-weight:900;font-size:22px}
.carSel .st{font-weight:800;font-size:14px}
.arrow{width:46px;height:46px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:22px}
.arrow:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.upg{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:7px 8px 7px 10px;margin-top:8px;text-align:left}
.upg .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.upg .ic svg{width:24px;height:24px}
.upg .mid{flex:1;min-width:0}
.upg .t{font-weight:900;font-size:15px}
.pips{display:flex;gap:2px;margin-top:3px}
.pips span{flex:1;height:8px;border-radius:3px;background:#e6dcef;max-width:22px}
.pips span.on{background:linear-gradient(#ffe066,#ffaa1d);box-shadow:inset 0 -2px 0 rgba(0,0,0,.15)}
.buy{font-weight:900;font-size:15px;padding:7px 10px;border-radius:12px;background:#9ef07a;border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);white-space:nowrap;display:flex;align-items:center;gap:4px}
.buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.buy.no{background:#ddd;opacity:.65}
.buy.max{background:#ffd23f}
.gHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.gHead b{font-size:22px;font-weight:900}
/* levels */
#levels .panel{width:min(640px,100%);max-height:calc(100vh - 40px);display:flex;flex-direction:column;padding:16px}
.lvGrid{overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:9px;padding:6px 4px 10px;touch-action:pan-y}
.wHead{grid-column:1/-1;text-align:left;font-weight:900;font-size:16px;margin-top:6px;display:flex;align-items:center;gap:8px}
.wHead span{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink)}
.lv{aspect-ratio:1;border-radius:18px;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;position:relative}
.lv small{font-size:11px;letter-spacing:1px;color:#e89a00;-webkit-text-stroke:0}
.lv.lock{background:#cfc6d8;opacity:.6;box-shadow:0 2px 0 var(--ink)}
.lv.cur{animation:pulse 1s ease-in-out infinite}
.lv .tag{position:absolute;top:-8px;right:-6px;font-size:10px;background:var(--pink);color:#fff;border-radius:6px;padding:1px 4px;border:2px solid var(--ink)}
@keyframes pulse{50%{transform:scale(1.07)}}
/* tutorial */
#tut{position:fixed;inset:0;pointer-events:none;z-index:9;display:none}
#tut.on{display:block}
#tutCap{position:absolute;left:50%;top:calc(var(--safeT) + 62px);transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:10px 18px;box-shadow:0 6px 0 var(--ink);font-weight:900;font-size:clamp(20px,5vw,28px);white-space:nowrap;animation:pin .4s cubic-bezier(.3,1.5,.5,1)}
#tutCap .k{display:inline-grid;place-items:center;min-width:38px;height:38px;padding:0 8px;border-radius:9px;background:#fff;border:3px solid var(--ink);border-bottom-width:6px;font-size:16px}
#tutCap .k.hold{animation:hold 1.2s ease-in-out infinite}
@keyframes hold{0%,100%{transform:translateY(0)}30%,70%{transform:translateY(4px);border-bottom-width:3px;background:#ffe066}}
#skipB{position:absolute;right:calc(var(--safeR) + 12px);bottom:calc(var(--safeB) + 16px);pointer-events:auto;font-weight:900;font-size:18px;padding:8px 18px 10px;border-radius:14px;background:#fff;border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
#hand{position:absolute;left:76%;bottom:calc(var(--safeB) + 170px);width:64px;height:64px;margin-left:-32px;filter:drop-shadow(0 6px 0 rgba(43,29,58,.35))}
#hand.press{animation:press 1.2s ease-in-out infinite}
#hand.sway{animation:sway 1.6s ease-in-out infinite}
@keyframes press{0%,100%{transform:translateY(0) scale(1)}30%,70%{transform:translateY(10px) scale(.92)}}
@keyframes sway{0%,100%{transform:translateX(-70px) rotate(-12deg)}50%{transform:translateX(70px) rotate(12deg)}}
#pause .panel{width:min(360px,100%)}
#pause .bigb{width:100%;margin-top:10px}
.tiny{font-weight:800;font-size:13px;opacity:.6;margin-top:10px}
</style></head><body>
<canvas id="c"></canvas>
<div id="fx"></div>
<div id="flash"></div>
<div id="hud">
  <div id="lvPill"><div class="flag" id="lvName"><i>1</i>Sleepy Shore</div><div id="hudCoins"><span class="coin"></span><span id="hcN">0</span></div><div id="hearts"></div></div>
  <div id="goal"></div>
  <div id="hint"></div>
</div>
<div id="banner"><div class="b1" id="bn1">ROUND 1</div><div class="b2" id="bn2"></div></div>
<button class="rb hide" id="pauseB" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2" fill="#2b1d3a"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#2b1d3a"/></svg></button>
<button class="rb" id="muteB" aria-label="Mute"><svg viewBox="0 0 24 24" id="muteIc"></svg></button>

<div id="title" class="scr on">
  <div class="tTop"><div id="logo"></div><div id="tagline">Ram 'em off the island!</div></div>
  <div class="menu">
    <button class="bigb" id="playB">PLAY</button>
    <div class="row">
      <button class="chip c1" id="levelsB"><svg viewBox="0 0 24 24"><path d="M5 21V3m0 1h11l-2 4 2 4H5" fill="#ff5fa2" stroke="#2b1d3a" stroke-width="2.2" stroke-linejoin="round"/></svg>Levels</button>
      <button class="chip c2" id="garageB"><svg viewBox="0 0 24 24"><circle cx="7" cy="17" r="3" fill="#2b1d3a"/><circle cx="17" cy="17" r="3" fill="#2b1d3a"/><path d="M3 15c0-4 2-7 6-7h5c3 0 5 2 7 6v2H3z" fill="#4ab8ff" stroke="#2b1d3a" stroke-width="2"/></svg>Garage</button>
      <button class="chip c3" id="howB"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#ffd23f" stroke="#2b1d3a" stroke-width="2"/><path d="M9.5 9.5a2.6 2.6 0 1 1 3.6 2.3c-.8.4-1.1 1-1.1 1.8M12 17v.2" stroke="#2b1d3a" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>How to play</button>
    </div>
    <div class="diff" id="diff"><button data-d="0">Normal</button><button data-d="1">Hard ×1.5</button><button data-d="2">Mayhem ×2.5</button></div>
  </div>
  <div class="wallet" id="tWallet"><span class="coin"></span><span id="twN">0</span><b id="twS"></b></div>
  <a id="gbSupport" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>

<div id="result" class="scr panelWrap"><div class="panel" id="resPanel"></div></div>
<div id="pause" class="scr panelWrap"><div class="panel"><h2>Paused</h2>

  if(L%5===4){return{n:'Bonus Bay '+tier,w,r:10+rr()*1.5,bonus:{balls:5,goals:2+(rr()*2|0)},spin:rr()<0.4?0.4:0,wind:rr()<0.4?1:0,bump:rr()<0.4?2:0,intro:'Bonus goals!'}}
  const c={n:TOUR_NAMES[rr()*TOUR_NAMES.length|0]+' '+tier,w,r:10.5+rr()*2,riv:[]};const mods=['ice','spin','bump','geyser','wind','seesaw'];const nm=1+(rr()<0.5+tier*0.01?1:0)+(tier>20&&rr()<0.4?1:0);const used=[];
  for(let i=0;i<nm;i++){let m=mods[rr()*mods.length|0];if(used.includes(m))continue;used.push(m)}
  if(used.includes('seesaw')){c.seesaw=1;c.rect=[18+rr()*3,8+rr()*1.5];used.splice(used.indexOf('spin'),used.includes('spin')?1:0)}
  if(used.includes('ice')){c.ice=1;c.shrink=rr()<0.6?1:0}if(used.includes('spin')&&!c.seesaw)c.spin=0.35+rr()*0.25;if(used.includes('bump')&&!c.seesaw)c.bump=2+(rr()*2|0);if(used.includes('geyser'))c.geyser=1;if(used.includes('wind'))c.wind=1;
  const n=Math.min(7,3+Math.floor(tier/9)+(rr()*2|0));const kinds=['basic','dodger','pack','pack','tank','dodger'];
  if(L%5===0){c.riv.push('boss');if(tier>15)c.riv.push('boss');for(let i=0;i<Math.min(3,1+tier/12|0);i++)c.riv.push(kinds[rr()*kinds.length|0])}else for(let i=0;i<n;i++)c.riv.push(kinds[rr()*kinds.length|0]);
  c.intro=[c.ice&&'Ice',c.spin&&'Spin',c.bump&&'Bumpers',c.geyser&&'Lava',c.wind&&'Wind',c.seesaw&&'Seesaw'].filter(Boolean).join(' + ')||'Mixed mob!';if(L%5===0)c.intro='BOSS + '+c.intro;return c}

function buildWaves(cfg,L){if(cfg.waves)return cfg.waves.map(w=>w.slice());const base=(cfg.riv||[]).slice(),d=save.diff;
  const pool=base.filter(k=>k!=='boss'&&k!=='sleepy');const extra=()=>pool.length&&Math.random()<0.6?pick(pool):(L<6?'basic':pick(['basic','dodger','pack','basic']));
  let W;if(base.includes('boss')){const m=pool.length?pool.slice():[];while(m.length<2)m.push(L>6?pick(['basic','dodger']):'basic');if(m.length<3&&L>9)m.push('pack');W=[m,base]}
  else W=[base.slice(),base.concat([extra()]),base.concat([extra(),L>=7?'dodger':'basic'])];

  if(G.win){h+='<div class="stars">'+[0,1,2].map(i=>i<stars?STAR_SVG:STAR_OFF).join('')+'</div><div class="chk">'+chk+'</div>'}else{h+='<div style="height:12px"></div>'}
  h+='<div class="earn"><span class="coin"></span><span id="earnN">0</span>'+(mult>1?'<span style="font-size:15px;opacity:.6">×'+mult+'</span>':'')+'</div><div class="near">'+near+'</div>';
  if(G.win){const tg=levelTag(nc);h+='<div class="tease"><i>'+(tg||'NEXT')+'</i>'+nextL+'. '+nc.n+(nc.intro?' · '+nc.intro:'')+'</div>'}
  else h+='<div class="tease" style="background:#d1456e"><i>TIP</i>'+pick(cfg.bonus?['Drive to the yellow ring first!','Yellow arrows = how far it rolls']:G.rivals.some(r=>r.kind==='tank'&&r.alive)?['Tanks need a FULL charge ring!']:G.rivals.some(r=>r.kind==='boss'&&r.alive)?['Dodge the charge, then ram it dizzy!','Ram the boss when it sees stars!']:['Steer away when rivals flash red!','Ram them toward the edge!','Upgrade Mass in the Garage!','Bonk rivals into each other!','Ram up close - far rams get dodged!','Long revs leave your back open!'])+'</div>';
  h+='<div class="prow"><button class="sq" id="rMenu" aria-label="Menu"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="#2b1d3a"/></svg></button>'+(G.win?'<button class="sq" id="rRetry" aria-label="Retry"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2-5" stroke="#2b1d3a" stroke-width="3" fill="none" stroke-linecap="round"/><path d="M4 3v5h5" stroke="#2b1d3a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>':'')+'<button class="sq" id="rGar" aria-label="Garage"><svg viewBox="0 0 24 24"><circle cx="7" cy="17" r="3" fill="#2b1d3a"/><circle cx="17" cy="17" r="3" fill="#2b1d3a"/><path d="M3 15c0-4 2-7 6-7h5c3 0 5 2 7 6v2H3z" fill="#4ab8ff" stroke="#2b1d3a" stroke-width="2"/></svg></button><button class="bigb" id="rNext">'+(G.win?'NEXT ›':'RETRY')+'</button></div>';
  $('resPanel').innerHTML=h;showScreen('result');$('hud').classList.remove('on');$('pauseB').classList.add('hide');resWin=G.win;
  if(G.win){[0,1,2].forEach(i=>{if(i<stars)setTimeout(()=>{const s=$('resPanel').querySelectorAll('.stars svg')[i];if(s){s.classList.add('on');sfx.star(i)}},250+i*260)});[0,1,2].forEach(i=>{if(i>=stars)setTimeout(()=>{const s=$('resPanel').querySelectorAll('.stars svg')[i];if(s)s.classList.add('on')},250+i*260)})}
  const t0=performance.now();const dur=Math.min(1200,300+earned*12);let lastN=0;(function cu(){const f=Math.min(1,(performance.now()-t0)/dur);const n=Math.round(earned*(1-Math.pow(1-f,3)));const el=$('earnN');if(!el)return;el.textContent=n;if(n>lastN&&Math.random()<0.4)sfx.coin(0);lastN=n;if(f<1)requestAnimationFrame(cu)})();
  $('rNext').onclick=resultAction;$('rMenu').onclick=()=>toTitle();const rr=$('rRetry');if(rr)rr.onclick=()=>startLevel(L);$('rGar').onclick=()=>{openGarage()};
  musicVol(0.15);
}
function resultAction(){if(G.mode!=='result'||performance.now()-resShownT<450)return;sfx.pop();startLevel(resWin?G.level+1:G.level)}

// ================= main loop =================
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;baseFov=camera.fov=w/h<0.8?52:42;camera.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
let last=performance.now(),acc=0;
function frame(now){requestAnimationFrame(frame);const raw=(now-last)/1000;let dt=Math.min(0.05,raw);last=now;if(dt<=0)dt=0.001;if(raw<0.5&&!document.hidden)perfTick(raw);
  G.vt+=dt;let sdt=0;
  if(!paused){if(G.hitstop>0){G.hitstop-=dt}else{let ts=1;if(G.slowmo>0){G.slowmo-=dt;ts=0.3}if(G.mode==='garage')ts=0;acc+=dt*ts;let n=0;while(acc>=STEP&&n<12){step(STEP);acc-=STEP;n++}sdt=dt*ts}
    if(G.attract&&G.mode!=='garage')attractUpdate(dt);
    for(const c of G.cars){if(c.state==='show'){c.sqv+=((1-c.sq)*120-c.sqv*6)*dt;c.sq+=c.sqv*dt;c.model.root.position.set(0,Math.abs(Math.sin(G.vt*2))*0.15,0);c.model.root.rotation.set(0,G.vt*0.6,0);c.model.body.scale.set(1/Math.sqrt(c.sq),c.sq,1/Math.sqrt(c.sq));c.shadow.position.set(0,0.03,0);c.model.headG.rotation.z=Math.sin(G.vt*2.5)*0.15;continue}updCarVisual(c,sdt||0.0001)}
    updP(sdt,G.vt);updRings(sdt||dt*0.2);updAim();
    if(G.mode==='play'){const tl=$('timer');if(tl){const rem=G.cfg.bonus?Math.max(0,G.timeLimit-G.t):G.t;tl.textContent=G.cfg.bonus?Math.ceil(rem)+'s':Math.floor(rem)+'s';tl.style.color=G.cfg.bonus&&rem<5?'#ff6b6b':''}}
  }
  updWorld(dt);updCamera(dt);updPops(dt);
  if(flashA>0){flashA=Math.max(0,flashA-dt*2.5);$('flash').style.opacity=flashA}
  renderer.render(scene,camera);
}
// boot
G.vt=0;startAttract();refreshTitle();showScreen('title');
requestAnimationFrame(frame);
</script>

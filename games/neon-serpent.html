<style>
/* ---- first-time tutorial + support link ---- */

 border-radius:var(--tut-rad,14px);background:var(--tut-bg,rgba(10,5,30,.82));border:2px solid var(--tut-c,#22f3ff);box-shadow:0 0 16px var(--tut-glow,rgba(34,243,255,.45)),0 8px 24px rgba(0,0,0,.35);color:var(--tut-fg,#fff)}

 box-shadow:0 3px 0 rgba(0,0,0,.45);animation:tutKey 1.1s ease-in-out infinite}

@keyframes tutKey{0%,60%,100%{transform:translateY(0);box-shadow:0 3px 0 rgba(0,0,0,.45)}30%{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,.45);background:var(--tut-c,#22f3ff)}}
#tut .tor{font:800 11px/1 system-ui,sans-serif;opacity:.6;margin:0 2px;text-transform:uppercase}

@keyframes tutTap{0%,100%{transform:translate(8px,10px) scale(1)}45%{transform:translate(0,0) scale(.86)}60%{transform:translate(0,0) scale(.9)}}
@keyframes tutBob{0%,100%{transform:translate(4px,10px)}50%{transform:translate(0,0)}}
@keyframes tutSwipe{0%{transform:translate(0,0) scale(1);opacity:0}12%{opacity:1;transform:translate(0,0) scale(.88)}70%{transform:translate(var(--dx,60px),var(--dy,0px)) scale(.88);opacity:1}88%,100%{transform:translate(var(--dx,60px),var(--dy,0px)) scale(1);opacity:0}}
#tut .tring{position:absolute;left:0;top:0;border-radius:50%;border:3px solid var(--tut-c,#22f3ff);box-shadow:0 0 14px var(--tut-c,#22f3ff),inset 0 0 10px var(--tut-glow,rgba(34,243,255,.4));display:none;animation:tutRing 1.2s ease-in-out infinite}
@keyframes tutRing{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.14);opacity:.55}}
#tut .tskip{position:absolute;pointer-events:auto;cursor:pointer;font:800 14px/1 var(--tut-font,system-ui,sans-serif);letter-spacing:.06em;text-transform:uppercase;color:var(--tut-fg,#fff);
 background:var(--tut-bg,rgba(10,5,30,.82));border:2px solid var(--tut-c,#22f3ff);border-radius:999px;padding:9px 16px;box-shadow:0 3px 0 rgba(0,0,0,.35);transition:transform .12s}

.gbSup{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font:600 11.5px/1 system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.04em;
 color:var(--sup-c,#fff);opacity:.55;text-decoration:none;padding:4px 6px;border-radius:6px;transition:opacity .15s;z-index:3;pointer-events:auto}

<script>
// Gamebop first-time tutorial helper: steps = [{cap, icon, at:()=>{x,y,mode,dx,dy,r}|null, el:()=>Element|null, done:(t)=>bool, min, enter}]
const GBTut=(()=>{
 let el,card,cap,ico,dots,hand,ring,skip,steps=null,i=0,st=0,last=0,opts={},okT=0,gen=0;
 const HAND='<svg viewBox="0 0 48 48"><path d="M18 27V9.5a3.5 3.5 0 0 1 7 0V21l9.2 2.3c3 .8 4.7 3.6 4 6.5L36.3 40a6 6 0 0 1-5.8 5H23a6 6 0 0 1-4.6-2.1L10 33.6a3.4 3.4 0 0 1 5-4.7z" fill="#fff" stroke="#1d1830" stroke-width="2.6" stroke-linejoin="round"/><path d="M25 22v6M30 23.3V29" stroke="#1d1830" stroke-width="2" stroke-linecap="round" opacity=".45"/></svg>';
 function build(){
  el=document.createElement('div');el.id='tut';
  el.innerHTML='<div class="tring"></div><div class="thand">'+HAND+'</div><div class="tcard"><div class="tico"></div><div class="tcap"></div><div class="tdots"></div></div><button class="tskip" type="button">Skip ›</button>';
  document.body.appendChild(el);
  card=el.querySelector('.tcard');cap=el.querySelector('.tcap');ico=el.querySelector('.tico');dots=el.querySelector('.tdots');hand=el.querySelector('.thand');ring=el.querySelector('.tring');skip=el.querySelector('.tskip');
  const sk=e=>{e.preventDefault();e.stopPropagation();finish(true)};
  skip.addEventListener('click',sk);skip.addEventListener('pointerdown',e=>e.stopPropagation());skip.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});
 }
 function start(s,o){if(!el)build();steps=s;opts=o||{};i=-1;skip.className='tskip '+(opts.skip||'br');dots.innerHTML=s.map(()=>'<i></i>').join('');el.classList.add('on');okT=0;next();last=performance.now();const g=++gen;requestAnimationFrame(n=>tick(n,g))}
 function next(){i++;if(i>=steps.length){finish(false);return}const s=steps[i];st=0;cap.textContent=s.cap;ico.innerHTML=s.icon||'';
  [...dots.children].forEach((d,k)=>d.classList.toggle('on',k===i));card.classList.remove('pop','ok');void card.offsetWidth;card.classList.add('pop');if(s.enter)s.enter()}
 function finish(skipped){if(!steps)return;steps=null;el.classList.remove('on');hand.style.display=ring.style.display='none';if(opts.onEnd)opts.onEnd(skipped)}
 function place(p){
  if(!p){hand.style.display='none';ring.style.display='none';return}
  hand.style.display='block';const m=p.mode||'tap';if(hand.dataset.m!==m){hand.className='thand '+m;hand.dataset.m=m}
  hand.style.transform='translate('+Math.round(p.x)+'px,'+Math.round(p.y)+'px)';hand.style.setProperty('--dx',(p.dx||0)+'px');hand.style.setProperty('--dy',(p.dy||0)+'px');
  if(p.r){const r=p.r;ring.style.display='block';ring.style.width=ring.style.height=r*2+'px';ring.style.left=(p.rx!=null?p.rx:p.x)-r+'px';ring.style.top=(p.ry!=null?p.ry:p.y)-r+'px';ring.style.borderRadius=p.sq?'14px':'50%'}else ring.style.display='none';
 }
 function tick(now,g){
  if(!steps||g!==gen)return;const dt=Math.min(.05,(now-last)/1000);last=now;
  const vis=opts.visible?opts.visible():true;el.style.visibility=vis?'visible':'hidden';
  const s=steps[i];
  if(vis||s.bg){st+=dt;let p=null;
   if(!vis);else if(s.el){const e=s.el();if(e&&e.offsetParent!==null){const b=e.getBoundingClientRect();p={x:b.left+b.width/2,y:b.top+b.height/2,mode:'tap',r:Math.max(b.width,b.height)/2+8}}else if(s.at)p=s.at()}
   else if(s.at)p=s.at();
   place(p);
   if(okT>0){okT-=dt;if(okT<=0)next()}
   else if(st>=(s.min||.5)&&s.done&&s.done(st)){okT=.4;card.classList.remove('pop');void card.offsetWidth;card.classList.add('ok');if(opts.onStep)opts.onStep(i)}}
  requestAnimationFrame(n=>tick(n,g))}
 const key=t=>'<span class="kc'+(t.length>2?' w':'')+'">'+t+'</span>';
 return {start,finish,key,get on(){return !!steps},get i(){return steps?i:-1},get t(){return st}};
})();
</script>
<script>
(()=>{
'use strict';
document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('button,.card,.lv,.tile,.sec'))setTimeout(()=>{const a=document.activeElement;if(a&&a.blur)a.blur()},0)},true);
const SLUG='neon-serpent',PRE='gamebop.'+SLUG+'.';
const store={get(k,d){try{const v=localStorage.getItem(PRE+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(PRE+k,JSON.stringify(v))}catch(e){}}};
let save=store.get('save',null);
const fresh={stars:{},best:{},endless:[],daily:{},skin:0,trail:0,unlocked:1,games:0};
if(!save||typeof save!=='object')save=JSON.parse(JSON.stringify(fresh));
for(const k in fresh)if(save[k]===undefined)save[k]=JSON.parse(JSON.stringify(fresh[k]));
function persist(){store.set('save',save)}
let muted=!!store.get('mute',false);

// ---------- audio ----------
let AC=null,master=null,noiseBuf=null;
function initAudio(){if(AC){if(AC.state==='suspended')AC.resume();return}try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.45;master.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,f2,delay){if(!AC)return;type=type||'sine';v=v||.2;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
function noise(d,v,fq,delay){if(!AC)return;if(!noiseBuf){noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=noiseBuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(fq||1500,t);f.frequency.exponentialRampToValueAtTime(60,t+d);const g=AC.createGain();g.gain.setValueAtTime(v||.3,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05)}

const LW=24,LH=16;
function sym(add,x,y){add(x,y);add(LW-1-x,y);add(x,LH-1-y);add(LW-1-x,LH-1-y)}
const PAT={
 open(){},
 pillars(add){for(const p of [[5,3],[5,11],[17,3],[17,11],[11,7]]){add(p[0],p[1]);add(p[0]+1,p[1]);add(p[0],p[1]+1);add(p[0]+1,p[1]+1)}},
 bars(add){for(let x=4;x<20;x++){if(x===11||x===12)continue;add(x,4);add(x,11)}},
 cross(add){for(let y=1;y<15;y++){if(y>=6&&y<=9)continue;add(11,y);add(12,y)}for(let x=3;x<21;x++){if(x>=9&&x<=14)continue;add(x,7);add(x,8)}},
 box(add){for(let x=6;x<18;x++){if(x===11||x===12)continue;add(x,3);add(x,12)}for(let y=3;y<13;y++){if(y===7||y===8)continue;add(6,y);add(17,y)}},
 rooms(add){for(let y=0;y<16;y++){if(y===3||y===4||y===11||y===12)continue;add(12,y)}for(let x=0;x<24;x++){if(x===4||x===5||x===18||x===19)continue;add(x,8)}},
 corridors(add){for(let y=0;y<11;y++){add(6,y);add(17,y)}for(let y=5;y<16;y++){add(11,y);add(12,y)}},

 spiral(add){for(let x=3;x<21;x++){add(x,2);add(x,13)}for(let y=2;y<14;y++){add(3,y);if(y<6||y>9)add(20,y)}for(let x=7;x<17;x++){add(x,5);add(x,10)}for(let y=5;y<11;y++){add(16,y);if(y<7||y>8)add(7,y)}}
};

function stageCfg(n){const s=STAGES[n-1];const pool=[];if(n>=2)pool.push('magnet');if(n>=4)pool.push('slow');if(n>=6)pool.push('phase');if(n>=9||s[3])pool.push('bomb');

function todayKey(){const d=new Date();return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate()}
function dailyCfg(){const k=todayKey(),r=RNG(k*31+7);const pats=Object.keys(PAT).filter(p=>p!=='open');
 return {seed:k,pat:pats[r()*pats.length|0],portals:r()*3|0,movers:1+(r()*3|0),crates:r()<.5?0:6+(r()*8|0),shrink:0,speed:.125,target:0,pool:['magnet','slow','phase','bomb'],hue:(r()*360)|0,endless:true,dayGrow:true}}

function buildLevel(cfg,portrait){
 const rng=RNG(cfg.seed);const L=new Uint8Array(LW*LH);
 const add=(x,y)=>{if(x>=0&&y>=0&&x<LW&&y<LH)L[y*LW+x]=1};
 PAT[cfg.pat](add);
 let sp=null;const rows=[8,7,9,6,10,5,11,4,12,3,13,2];
 outer:for(const y of rows){for(let x=1;x<=LW-10;x++){let ok=true;for(let k=0;k<9;k++)if(L[y*LW+x+k]){ok=false;break}if(ok){sp={x,y};break outer}}}
 if(!sp)sp={x:2,y:8};
 const R=new Uint8Array(LW*LH);
 const res=(x,y)=>{if(x>=0&&y>=0&&x<LW&&y<LH)R[y*LW+x]=1};
 for(let k=-1;k<12;k++)for(let dy=-1;dy<=1;dy++)res(sp.x+k,sp.y+dy);
 const free=(x,y)=>x>=0&&y>=0&&x<LW&&y<LH&&!L[y*LW+x]&&!R[y*LW+x];
 const portals=[];
 for(let p=0;p<cfg.portals;p++){for(let tr=0;tr<600;tr++){
  const a={x:1+(rng()*(LW-2)|0),y:1+(rng()*(LH-2)|0)},b={x:1+(rng()*(LW-2)|0),y:1+(rng()*(LH-2)|0)};
  if(Math.abs(a.x-b.x)+Math.abs(a.y-b.y)<10)continue;
  const ok=c=>free(c.x,c.y)&&free(c.x+1,c.y)&&free(c.x-1,c.y)&&free(c.x,c.y+1)&&free(c.x,c.y-1);
  if(!ok(a)||!ok(b))continue;
  portals.push([a,b]);for(const c of [a,b])for(let dx=-1;dx<=1;dx++)for(let dy=-1;dy<=1;dy++)res(c.x+dx,c.y+dy);break}}
 const movers=[];
 for(let m=0;m<cfg.movers;m++){for(let tr=0;tr<600;tr++){
  const hz=rng()<.5,len=4+(rng()*4|0);const x0=hz?(rng()*(LW-len)|0):(rng()*LW|0),y0=hz?(rng()*LH|0):(rng()*(LH-len)|0);
  const path=[];let ok=true;for(let k=0;k<len;k++){const x=hz?x0+k:x0,y=hz?y0:y0+k;if(!free(x,y)){ok=false;break}path.push({x,y})}
  if(!ok)continue;movers.push({path,i:rng()*len|0,d:rng()<.5?1:-1});for(const c of path)res(c.x,c.y);break}}
 const crates=[];
 for(let c=0;c<cfg.crates;c++){for(let tr=0;tr<300;tr++){const x=rng()*LW|0,y=rng()*LH|0;if(free(x,y)){crates.push({x,y});res(x,y);break}}}
 const tp=portrait?(c=>({x:c.y,y:c.x})):(c=>({x:c.x,y:c.y}));
 const GW=portrait?LH:LW,GH=portrait?LW:LH;const wall=new Uint8Array(GW*GH);
 for(let y=0;y<LH;y++)for(let x=0;x<LW;x++)if(L[y*LW+x]){const p=tp({x,y});wall[p.y*GW+p.x]=1}
 for(const c of crates){const p=tp(c);wall[p.y*GW+p.x]=2}
 const snake=[];for(let k=3;k>=0;k--)snake.push(tp({x:sp.x+k,y:sp.y}));
 return {GW,GH,wall,portals:portals.map(p=>[tp(p[0]),tp(p[1])]),movers:movers.map(m=>({path:m.path.map(tp),i:m.i,pi:m.i,d:m.d})),snake,dir:portrait?{x:0,y:1}:{x:1,y:0}};
}

function newGame(mode,stage){
 const cfg=mode==='campaign'?stageCfg(stage):mode==='daily'?dailyCfg():endlessCfg();
 const portrait=VH>VW*1.1;
 const L=buildLevel(cfg,portrait);
 G=Object.assign(L,{mode,stage,cfg,prev:null,q:[],acc:0,time:0,steps:0,eaten:0,score:0,combo:1,comboT:0,power:null,powerT:0,powerMax:1,food:null,bonus:null,pick:null,pickT:6+Math.random()*4,
  bombs:[],state:'ready',shrinkN:0,shrinkT:cfg.shrink||0,grow:0,deadT:0,readyT:0,feat:0,stepT:cfg.speed,hue:cfg.hue,nextBonus:6});
 G.prev=G.snake.map(s=>({x:s.x,y:s.y}));
 spawnFood();layout();show('');screen='play';$('pauseB').style.display='flex';
 $('hint').textContent=('ontouchstart' in window)?'swipe to steer':'← ↑ → ↓ / WASD';
 save.games++;persist();
}
function idx(x,y){return y*G.GW+x}
function inB(x,y){return x>=0&&y>=0&&x<G.GW&&y<G.GH}
function portalAt(x,y){for(const p of G.portals){if(p[0].x===x&&p[0].y===y)return p[1];if(p[1].x===x&&p[1].y===y)return p[0]}return null}
function moverAt(x,y){for(const m of G.movers){const c=m.path[m.i];if(c.x===x&&c.y===y)return m}return null}
function snakeAt(x,y){for(let i=0;i<G.snake.length;i++){const s=G.snake[i];if(s.x===x&&s.y===y)return i}return -1}
function cellFree(x,y){return inB(x,y)&&!G.wall[idx(x,y)]&&!portalAt(x,y)&&!moverAt(x,y)&&snakeAt(x,y)<0&&!(G.food&&G.food.x===x&&G.food.y===y)&&!(G.bonus&&G.bonus.x===x&&G.bonus.y===y)&&!(G.pick&&G.pick.x===x&&G.pick.y===y)}
function randFree(minD){const h=G.snake[0];for(let t=0;t<800;t++){const x=Math.random()*G.GW|0,y=Math.random()*G.GH|0;if(cellFree(x,y)&&(t>400||Math.abs(x-h.x)+Math.abs(y-h.y)>=(minD||0)))return{x,y}}for(let y=0;y<G.GH;y++)for(let x=0;x<G.GW;x++)if(cellFree(x,y))return{x,y};return null}
function spawnFood(){G.food=randFree(4);if(G.food)G.food.t=0}

function layout(){
 if(!G)return;
 cs=Math.floor(Math.min((VW-12)/G.GW,(VH-HUD-12)/G.GH));cs=Math.max(cs,8);
 ox=Math.floor((VW-cs*G.GW)/2);oy=Math.floor(HUD+(VH-HUD-cs*G.GH)/2);
 renderStatic();
}
function renderStatic(){
 staticC=document.createElement('canvas');staticC.width=VW*DPR;staticC.height=VH*DPR;const s=staticC.getContext('2d');s.scale(DPR,DPR);
 const h=G.hue;
 s.fillStyle='hsla('+h+',60%,6%,.9)';s.fillRect(ox,oy,cs*G.GW,cs*G.GH);
 s.strokeStyle='hsla('+h+',80%,50%,.08)';s.lineWidth=1;s.beginPath();
 for(let x=0;x<=G.GW;x++){s.moveTo(ox+x*cs+.5,oy);s.lineTo(ox+x*cs+.5,oy+G.GH*cs)}
 for(let y=0;y<=G.GH;y++){s.moveTo(ox,oy+y*cs+.5);s.lineTo(ox+G.GW*cs,oy+y*cs+.5)}s.stroke();
 for(let y=0;y<G.GH;y++)for(let x=0;x<G.GW;x++){if((x+y)%2===0){s.fillStyle='hsla('+h+',80%,50%,.025)';s.fillRect(ox+x*cs,oy+y*cs,cs,cs)}}
 const isW=(x,y)=>!inB(x,y)||G.wall[idx(x,y)]===1||G.wall[idx(x,y)]===3;
 for(let pass=0;pass<2;pass++)for(let y=0;y<G.GH;y++)for(let x=0;x<G.GW;x++){const w=G.wall[idx(x,y)];if(w!==1&&w!==3)continue;
  const col=w===3?'hsl(355,100%,60%)':'hsl('+h+',100%,62%)';const px=ox+x*cs,py=oy+y*cs;
  if(pass===0){s.fillStyle=w===3?'hsla(355,80%,25%,.85)':'hsla('+h+',70%,22%,.9)';s.fillRect(px,py,cs,cs);
   if(w===3){s.strokeStyle='hsla(355,100%,60%,.35)';s.lineWidth=2;s.beginPath();s.moveTo(px,py+cs);s.lineTo(px+cs,py);s.stroke()}}
  else{s.strokeStyle=col;s.lineWidth=2.5;s.shadowColor=col;s.shadowBlur=10;s.beginPath();
   if(!isW(x,y-1)&&y>0){s.moveTo(px,py+1);s.lineTo(px+cs,py+1)}if(!isW(x,y+1)&&y<G.GH-1){s.moveTo(px,py+cs-1);s.lineTo(px+cs,py+cs-1)}
   if(!isW(x-1,y)&&x>0){s.moveTo(px+1,py);s.lineTo(px+1,py+cs)}if(!isW(x+1,y)&&x<G.GW-1){s.moveTo(px+cs-1,py);s.lineTo(px+cs-1,py+cs)}s.stroke();s.shadowBlur=0}}
 s.strokeStyle='hsl('+h+',100%,65%)';s.lineWidth=3;s.shadowColor=s.strokeStyle;s.shadowBlur=18;s.strokeRect(ox-2,oy-2,cs*G.GW+4,cs*G.GH+4);s.shadowBlur=0;
}

// ---------- game logic ----------
const DIRS={up:{x:0,y:-1},down:{x:0,y:1},left:{x:-1,y:0},right:{x:1,y:0}};
function pushDir(d){
 if(!G||screen!=='play')return;
 if(G.state==='ready'){if(d.x===-G.dir.x&&d.y===-G.dir.y)return;G.dir=d;G.state='run';G.acc=0;G.turns=(G.turns||0)+1;$('hint').textContent='';SFX.turn();return}
 if(G.state!=='run')return;
 const last=G.q.length?G.q[G.q.length-1]:G.dir;
 if((d.x===last.x&&d.y===last.y)||(d.x===-last.x&&d.y===-last.y))return;
 if(G.q.length<3){G.q.push(d);G.turns=(G.turns||0)+1;SFX.turn()}
}
function curStep(){let s=G.stepT;if(G.mode==='campaign')s*=1-.14*Math.min(1,G.eaten/G.cfg.target);else s=Math.max(.068,G.cfg.speed-G.eaten*.0011);if(G.power==='slow')s*=1.75;if(GBTut.on)s*=1.3;return s}
function step(){
 if(G.q.length)G.dir=G.q.shift();
 const h=G.snake[0];let nx=h.x+G.dir.x,ny=h.y+G.dir.y,j=null;
 const pp=portalAt(nx,ny);
 if(pp){j={x:pp.x,y:pp.y};nx=pp.x+G.dir.x;ny=pp.y+G.dir.y;SFX.portal();const c=cc(pp.x,pp.y);burst(c.x,c.y,18,'#7ff',160,3,.5);const c2=cc(h.x+G.dir.x,h.y+G.dir.y);burst(c2.x,c2.y,12,'#fa5',120,3,.4)}
 const phase=G.power==='phase';
 if(!inB(nx,ny))return die();
 const w=G.wall[idx(nx,ny)];
 if(w===1||w===3)return die();
 if(w===2&&!phase)return die();
 if(moverAt(nx,ny))return die();
 if(!phase){const n=G.snake.length-(G.grow>0?0:1);for(let i=0;i<n;i++){const s=G.snake[i];if(s.x===nx&&s.y===ny)return die()}}
 const old=G.snake.map(s=>({x:s.x,y:s.y}));
 const seg={x:nx,y:ny};if(j){seg.px=j.x;seg.py=j.y}
 G.snake.unshift(seg);
 if(G.grow>0){G.grow--;old.push({x:old[old.length-1].x,y:old[old.length-1].y})}else G.snake.pop();
 G.prev=old;G.steps++;
 // trail
 if(save.trail)emitTrail();
 // magnet
 if(G.power==='magnet'){for(const k of ['food','bonus']){const f=G[k];if(!f)continue;const dx=nx-f.x,dy=ny-f.y;if(Math.abs(dx)+Math.abs(dy)<=6){const mx=Math.abs(dx)>=Math.abs(dy)?Math.sign(dx):0,my=mx?0:Math.sign(dy);const tx=f.x+mx,ty=f.y+my;if(inB(tx,ty)&&!G.wall[idx(tx,ty)]&&!portalAt(tx,ty)){f.x=tx;f.y=ty;const c=cc(tx,ty);burst(c.x,c.y,2,'#ff4d6d',40,2,.3)}}}}
 checkEat();
 // movers
 if(G.steps%2===0)moveMovers();
}
function checkEat(){
 const h=G.snake[0];

 if(G.mode==='campaign'){const f=clamp(G.eaten/G.cfg.target,0,1);cx.fillStyle='rgba(255,255,255,.12)';rr(12,30,bw,12,6);cx.fill();const gg=cx.createLinearGradient(12,0,12+bw,0);gg.addColorStop(0,'#22f3ff');gg.addColorStop(1,'#ff3df2');cx.fillStyle=gg;rr(12,30,Math.max(12,bw*f),12,6);cx.fill();cx.fillStyle='#fff';cx.font='800 11px system-ui,sans-serif';cx.fillText(G.eaten+'/'+G.cfg.target,16+bw,36)}
 else{cx.font='700 12px system-ui,sans-serif';cx.fillStyle='#ffd23d';cx.fillText('BEST '+(G.mode==='daily'?(save.daily[todayKey()]||0):endBest()),12,37)}
 cx.textAlign='center';cx.font='900 '+(VW<500?24:30)+'px system-ui,sans-serif';cx.fillStyle='#fff';cx.shadowColor='#22f3ff';cx.shadowBlur=12;cx.fillText(G.score,VW/2,22);cx.shadowBlur=0;
 if(G.combo>1){cx.font='900 13px system-ui,sans-serif';cx.fillStyle='#ffd23d';cx.fillText('COMBO x'+G.combo,VW/2,45);cx.fillStyle='rgba(255,210,61,.6)';cx.fillRect(VW/2-30,52,60*G.comboT/3.5,2)}
 cx.textAlign='right';cx.font='800 15px system-ui,sans-serif';const tx=VW-118;
 const tm=G.time;cx.fillStyle=G.mode==='campaign'&&tm>G.cfg.par?'#ff6d8a':'#9fe9ff';cx.fillText(fmt(tm),tx,20);
 if(G.mode==='campaign'){cx.font='700 11px system-ui,sans-serif';cx.fillStyle='rgba(255,210,61,.85)';if(VW<560){cx.textAlign='left';cx.fillText('★'+fmt(G.cfg.par)+'  ★'+G.cfg.goal,12,52)}else cx.fillText('★'+fmt(G.cfg.par)+'  ★'+G.cfg.goal,tx,40)}
 if(G.power){const x=VW/2+(VW<500?70:110),y=24;cx.strokeStyle='rgba(255,255,255,.15)';cx.lineWidth=3;cx.beginPath();cx.arc(x,y,16,0,7);cx.stroke();cx.strokeStyle=PW[G.power].c;cx.beginPath();cx.arc(x,y,16,-1.57,-1.57+6.283*G.powerT/G.powerMax);cx.stroke();powerIcon(G.power,x,y,13)}
}
function rr(x,y,w,h,r){cx.beginPath();cx.moveTo(x+r,y);cx.arcTo(x+w,y,x+w,y+h,r);cx.arcTo(x+w,y+h,x,y+h,r);cx.arcTo(x,y+h,x,y,r);cx.arcTo(x,y,x+w,y,r);cx.closePath()}
function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss}

// ---------- attract mode (title bg) ----------
const A={cs:32,cols:0,rows:0,snake:[],prev:[],dir:{x:1,y:0},food:null,acc:0};
function initAttract(){A.cs=Math.max(22,Math.min(40,Math.round(Math.min(VW,VH)/16)));A.cols=Math.ceil(VW/A.cs);A.rows=Math.ceil(VH/A.cs);const y=Math.floor(A.rows*.82);A.snake=[];for(let i=0;i<14;i++)A.snake.push({x:8-i,y});A.prev=A.snake.map(s=>({...s}));A.dir={x:1,y:0};A.food={x:Math.floor(A.cols*.7),y:Math.floor(A.rows*.2)};A.acc=0}
function updAttract(dt){A.acc+=dt;const st=.085;while(A.acc>=st){A.acc-=st;stepAttract()}}
function stepAttract(){
 const h=A.snake[0];const opts=[A.dir,{x:A.dir.y,y:-A.dir.x},{x:-A.dir.y,y:A.dir.x}];
 const wrap=(x,y)=>({x:(x+A.cols)%A.cols,y:(y+A.rows)%A.rows});
 let best=null,bd=1e9;for(const d of opts){const n=wrap(h.x+d.x,h.y+d.y);if(A.snake.some((s,i)=>i<A.snake.length-1&&s.x===n.x&&s.y===n.y))continue;let dd=Math.abs(n.x-A.food.x)+Math.abs(n.y-A.food.y)+Math.random()*2.5;if(dd<bd){bd=dd;best=d}}
 if(!best){initAttract();return}
 A.dir=best;const n=wrap(h.x+best.x,h.y+best.y);A.prev=A.snake.map(s=>({x:s.x,y:s.y}));A.snake.unshift(n);
 if(n.x===A.food.x&&n.y===A.food.y){const c={x:n.x*A.cs+A.cs/2,y:n.y*A.cs+A.cs/2};burst(c.x,c.y,20,skinCol(save.skin,0),200,3,.6);A.food={x:2+(Math.random()*(A.cols-4)|0),y:2+(Math.random()*(A.rows-4)|0)};A.prev.push({...A.prev[A.prev.length-1]});if(A.snake.length>34)A.snake.pop()}else A.snake.pop();
}
function drawAttract(){
 const s=A.cs;const g=cx.createRadialGradient(VW/2,VH*.4,0,VW/2,VH*.4,Math.max(VW,VH)*.8);g.addColorStop(0,'#1d0b4a');g.addColorStop(.6,'#0b0628');g.addColorStop(1,'#040212');cx.fillStyle=g;cx.fillRect(0,0,VW,VH);
 cx.strokeStyle='rgba(120,90,255,.12)';cx.lineWidth=1;cx.beginPath();for(let x=0;x<=A.cols;x++){cx.moveTo(x*s+.5,0);cx.lineTo(x*s+.5,VH)}for(let y=0;y<=A.rows;y++){cx.moveTo(0,y*s+.5);cx.lineTo(VW,y*s+.5)}cx.stroke();
 // horizon glow
 const hg=cx.createLinearGradient(0,VH*.55,0,VH);hg.addColorStop(0,'rgba(255,61,242,0)');hg.addColorStop(1,'rgba(255,61,242,.22)');cx.fillStyle=hg;cx.fillRect(0,VH*.55,VW,VH*.45);
 const fq={x:A.food.x*s+s/2,y:A.food.y*s+s/2};glowCircle(fq.x,fq.y,s*1.3,'rgba(255,61,242,.6)');cx.fillStyle='#ff3df2';cx.beginPath();cx.arc(fq.x,fq.y,s*.3,0,7);cx.fill();
 const t=clamp(A.acc/.085,0,1);const pts=A.snake.map((c,i)=>{let p=A.prev[i]||c;if(Math.abs(p.x-c.x)+Math.abs(p.y-c.y)>1.5)p=c;return{x:lerp(p.x,c.x,t)*s+s/2,y:lerp(p.y,c.y,t)*s+s/2}});
 drawSnakePts(pts,save.skin,s*.6,1);drawHead(pts[0],A.dir,s*.6,save.skin,1);
}

// ---------- loop ----------
let last=performance.now(),paused=false;
function frame(now){
 let dt=(now-last)/1000;last=now;dt=Math.min(dt,.05);
 if(!paused)update(dt);
 cx.setTransform(DPR,0,0,DPR,0,0);
 cx.fillStyle='#07041a';cx.fillRect(0,0,VW,VH);
 cx.save();
 if(shake>0){cx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);if(!paused)shake=Math.max(0,shake-dt*40)}
 if(G&&(screen==='play'||screen==='result'))drawGame();else drawAttract();
 // particles
 cx.globalCompositeOperation='lighter';
 for(let i=parts.length-1;i>=0;i--){const p=parts[i];if(!paused){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.96;p.vy*=.96}if(p.l<=0){parts.splice(i,1);continue}const a=clamp(p.l/p.ml,0,1);cx.globalAlpha=a;
  if(p.k===3){star(p.x,p.y,p.s*1.6,p.c)}else if(p.k===5){cx.fillStyle=p.c;cx.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}else if(p.k===2){cx.strokeStyle=p.c;cx.lineWidth=1.5;cx.beginPath();cx.arc(p.x,p.y,p.s*(1.5-a*.5),0,7);cx.stroke()}else{cx.fillStyle=p.c;cx.beginPath();cx.arc(p.x,p.y,p.s*a+.5,0,7);cx.fill()}}
 cx.globalAlpha=1;cx.globalCompositeOperation='source-over';
 for(let i=floats.length-1;i>=0;i--){const f=floats[i];if(!paused){f.l-=dt*1.2;f.y-=dt*40}if(f.l<=0){floats.splice(i,1);continue}cx.globalAlpha=clamp(f.l*2,0,1);cx.font='900 16px system-ui,sans-serif';cx.textAlign='center';cx.fillStyle=f.c;cx.shadowColor=f.c;cx.shadowBlur=8;cx.fillText(f.t,f.x,f.y);cx.shadowBlur=0}
 cx.globalAlpha=1;cx.restore();
 if(screen==='play'&&G)drawHUD();
 requestAnimationFrame(frame);
}

// ---------- screens ----------
const SC=['sTitle','sModes','sStages','sSkins','sPause','sResult'];
function show(id){for(const s of SC)$(s).classList.toggle('on',s===id)}
function goTitle(){if(GBTut.on)GBTut.finish(true);screen='title';G=null;paused=false;show('sTitle');$('pauseB').style.display='none';$('hint').textContent='';refreshTitle()}
function refreshTitle(){const any=save.games>0;$('bPlay').textContent=any?'CONTINUE':'PLAY';$('tStars').textContent=any?'★ '+totalStars()+' / 72':'arcade · portals · power-ups'}
function nextStage(){for(let i=1;i<=24;i++)if(!save.stars[i])return Math.min(i,save.unlocked);return 24}
function openStages(){screen='menu';show('sStages');$('stStars').textContent='★ '+totalStars()+' / 72';const gr=$('grid');gr.innerHTML='';
 for(let i=1;i<=24;i++){const d=document.createElement('div');const lock=i>save.unlocked;d.className='lv'+(lock?' lock':'')+(i===nextStage()&&!lock?' cur':'');const st=save.stars[i]||0;
  d.innerHTML=(lock?'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#889" stroke-width="2.4"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>':i)+'<small>'+(lock?'':'★'.repeat(st)+'<span style="opacity:.25">'+'★'.repeat(3-st)+'</span>')+'</small>';
  const hue=[190,280,330,25,140,50][(i-1)>>2];if(!lock)d.style.borderColor='hsl('+hue+',90%,55%)';
  d.onclick=()=>{if(lock)return;SFX.click();newGame('campaign',i)};gr.appendChild(d)}}
function openModes(){screen='menu';show('sModes');$('mCampI').textContent='★ '+totalStars()+' / 72';$('mEndI').textContent='best '+endBest();$('mDayI').textContent='today '+(save.daily[todayKey()]||0)}
function openSkins(){screen='menu';show('sSkins');const ts=totalStars();$('skStars').textContent='★ '+ts;
 const S=$('shopS');S.innerHTML='';SKINS.forEach((sk,i)=>{const ok=unlockedSkin(i);const d=document.createElement('div');d.className='tile'+(save.skin===i?' sel':'')+(ok?'':' lock');
  const c=document.createElement('canvas');c.width=120;c.height=50;d.appendChild(c);const lab=document.createElement('div');lab.innerHTML=ok?sk.n:'<span class="rq">★'+sk.rq+'</span>';d.appendChild(lab);
  const g=c.getContext('2d');g.lineCap='round';g.lineWidth=14;for(let k=0;k<12;k++){g.strokeStyle=skinCol(i,k/12);g.beginPath();const x1=105-k*8,x2=105-(k+1)*8;g.moveTo(x1,25+Math.sin(k*.7)*8);g.lineTo(x2,25+Math.sin((k+1)*.7)*8);g.stroke()}
  if(!ok){g.fillStyle='rgba(0,0,0,.5)';g.fillRect(0,0,120,50)}
  d.onclick=()=>{if(!ok){SFX.turn();return}save.skin=i;persist();SFX.click();openSkins()};S.appendChild(d)});
 const R=$('shopT');R.innerHTML='';TRAILS.forEach((tr,i)=>{const ok=unlockedTrail(i);const d=document.createElement('div');d.className='tile'+(save.trail===i?' sel':'')+(ok?'':' lock');
  d.innerHTML='<div style="height:30px;display:flex;align-items:center;justify-content:center;font-size:20px;color:'+['#667','#ffe066','#8cf','#fff6a0','#ff7a2a','#b6ff3b','#bff'][i]+'">'+['∅','✦','○','★','▲','■','☄'][i]+'</div>'+(ok?tr.n:'<span class="rq">'+(tr.end?tr.end+' pts':'★'+tr.rq)+'</span>');
  d.onclick=()=>{if(!ok){SFX.turn();return}save.trail=i;persist();SFX.click();openSkins()};R.appendChild(d)})}
function showResult(){
 $('pauseB').style.display='none';screen='result';show('sResult');
 const rs=$('rStars'),goals=$('rGoals'),lb=$('rLB');const bs=rs.querySelectorAll('b');bs.forEach(b=>b.classList.remove('on'));
 if(G.mode==='campaign'){
  const won=G.state==='won';rs.style.display='block';
  const tOk=won&&G.time<=G.cfg.par,sOk=won&&G.score>=G.cfg.goal;const st=won?1+(tOk?1:0)+(sOk?1:0):0;
  $('rTitle').textContent=won?(st===3?'PERFECT!':'CLEAR!'):'CRASHED';
  goals.innerHTML='<span class="'+(won?'ok':'')+'">✔ '+G.eaten+'/'+G.cfg.target+'</span><span class="'+(tOk?'ok':'')+'">◷ '+fmt(G.time)+' / '+fmt(G.cfg.par)+'</span><span class="'+(sOk?'ok':'')+'">◆ '+G.score+' / '+G.cfg.goal+'</span>';
  $('rScore').textContent=G.score;lb.style.display='none';
  if(won){for(let i=0;i<st;i++)setTimeout(()=>{bs[i].classList.add('on');SFX.star(i)},300+i*280);
   const prevS=save.stars[G.stage]||0;if(st>prevS)save.stars[G.stage]=st;if(G.score>(save.best[G.stage]||0))save.best[G.stage]=G.score;
   save.unlocked=Math.max(save.unlocked,Math.min(24,G.stage+1));persist();
   $('bNext').style.display=G.stage<24?'':'none';$('bNext').textContent='Next'}
  else{$('bNext').style.display='none'}
 }else{
  rs.style.display='none';$('rTitle').textContent='GAME OVER';goals.innerHTML='<span>✔ '+G.eaten+'</span><span>◷ '+fmt(G.time)+'</span>';$('rScore').textContent=G.score;$('bNext').style.display='none';lb.style.display='block';
  if(G.mode==='endless'){const e={s:G.score,d:new Date().toLocaleDateString(undefined,{month:'short',day:'numeric'}),me:Date.now()};save.endless.push(e);save.endless.sort((a,b)=>b.s-a.s);save.endless=save.endless.slice(0,8);persist();
   lb.innerHTML=save.endless.map((x,i)=>'<div class="'+(x.me===e.me?'me':'')+'"><span>'+(i+1)+'. '+x.d+'</span><b>'+x.s+'</b></div>').join('')||'';}
  else{const k=todayKey();const pb=save.daily[k]||0;if(G.score>pb)save.daily[k]=G.score;const ks=Object.keys(save.daily).sort().slice(-14);const o={};ks.forEach(x=>o[x]=save.daily[x]);save.daily=o;persist();
   lb.innerHTML='<div class="'+(G.score>=pb?'me':'')+'"><span>today best</span><b>'+(save.daily[k]||0)+'</b></div><div><span>days played</span><b>'+Object.keys(save.daily).length+'</b></div>'}
 }
 if(G.mode==='campaign'&&G.state==='won')$('bNext').focus();
}

// ---------- input ----------
$('bPlay').onclick=()=>{SFX.click();if(!tutDone()){runTut();return}newGame('campaign',save.games>0?nextStage():1)};
$('bHow').onclick=()=>{SFX.click();runTut()};
function tutDone(){if(store.get('tut',0))return true;if(save.games>0){store.set('tut',1);return true}return false}
function runTut(){
 newGame('campaign',1);$('hint').textContent='';
 const touch=('ontouchstart' in window)||matchMedia('(pointer:coarse)').matches;
 const K=GBTut.key,arrows=K('←')+K('↑')+K('→')+K('↓');
 const head=()=>G&&G.snake&&G.snake[0]?cc(G.snake[0].x,G.snake[0].y):null;
 const ok=()=>screen==='play'&&G;
 GBTut.start([
  {cap:touch?'Swipe to steer':'Steer with the arrows',icon:touch?'':arrows,min:.6,
   at:()=>{const h=head();if(!h)return null;return G.state==='ready'||touch?{x:h.x+cs,y:h.y+cs*.6,mode:'swipe',dx:0,dy:G.dir.x?70:0,r:cs*1.1,rx:h.x,ry:h.y}:{x:h.x,y:h.y+cs*.5,mode:'point',r:cs*1.1,rx:h.x,ry:h.y}},
   done:()=>ok()&&(G.turns||0)>=3},
  {cap:'Eat the glowing orbs',icon:'<svg class="tgi" viewBox="0 0 28 28"><circle cx="14" cy="14" r="8" fill="#ff3df2"/><circle cx="11" cy="11" r="3" fill="#fff"/></svg>',
   at:()=>G&&G.food?(()=>{const q=cc(G.food.x,G.food.y);return{x:q.x,y:q.y+cs*.4,mode:'point',r:cs*.95,rx:q.x,ry:q.y}})():null,
   done:()=>ok()&&G.eaten>=2},
  {cap:'Grab power-ups for tricks',icon:'<svg class="tgi" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="#140a30" stroke="#ff4d6d" stroke-width="2.5"/><path d="M9 16v-4a5 5 0 0 1 10 0v4" stroke="#ff4d6d" stroke-width="3" fill="none"/></svg>',
   enter:()=>{G.tutPick=1},
   at:()=>{if(!G)return null;if(!G.pick&&!G.power&&G.state!=='dead'){const p=randFree(4);if(p){p.k='magnet';p.t=60;G.pick=p}}if(!G.pick)return null;const q=cc(G.pick.x,G.pick.y);return{x:q.x,y:q.y+cs*.45,mode:'point',r:cs*1.05,rx:q.x,ry:q.y}},
   done:()=>ok()&&!!G.power},
  {cap:'Avoid walls and your tail!',icon:'<svg class="tgi" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11" fill="none" stroke="#ff3d6d" stroke-width="3"/><path d="M7 21L21 7" stroke="#ff3d6d" stroke-width="3"/></svg>',
   at:()=>null,min:2.4,done:()=>true}
 ],{skip:'br',visible:()=>screen==='play'&&!paused,
  onStep:()=>{SFX.star(Math.min(3,GBTut.i))},
  onEnd:(sk)=>{store.set('tut',1);if(screen==='play'&&G){floatText(VW/2,oy+cs*2,sk?'GO!':'YOU GOT IT!','#b6ff3b');SFX.bonus();$('hint').textContent=''}}});
}
$('bModes').onclick=()=>{SFX.click();openModes()};
$('bSkins').onclick=()=>{SFX.click();openSkins()};
$('bBack1').onclick=$('bBack2').onclick=$('bBack3').onclick=()=>{SFX.click();goTitle()};
$('mCamp').onclick=()=>{SFX.click();openStages()};
$('mEnd').onclick=()=>{SFX.click();newGame('endless')};
$('mDay').onclick=()=>{SFX.click();newGame('daily')};
$('bResume').onclick=()=>{SFX.click();setPause(false)};
$('bRestartP').onclick=()=>{SFX.click();paused=false;newGame(G.mode,G.stage)};
$('bMenuP').onclick=$('bMenuR').onclick=()=>{SFX.click();const m=G&&G.mode;goTitle();if(m==='campaign')openStages();else openModes()};
$('bRetry').onclick=()=>{SFX.click();newGame(G.mode,G.stage)};
$('bNext').onclick=()=>{SFX.click();newGame('campaign',Math.min(24,G.stage+1))};
$('mute').onclick=e=>{e.stopPropagation();initAudio();setMute(!muted)};
$('pauseB').onclick=e=>{e.stopPropagation();if(screen==='play')setPause(!paused)};
function setPause(p){if(screen!=='play'||!G)return;if(G.state==='dead'||G.state==='won')p=false;paused=p;show(p?'sPause':'')}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&screen==='play')setPause(true)});
window.addEventListener('blur',()=>{if(screen==='play'&&G&&G.state==='run')setPause(true)});
const KM={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'};
addEventListener('keydown',e=>{
 initAudio();
 if(KM[e.code]){e.preventDefault();if(screen==='play'&&!paused)pushDir(DIRS[KM[e.code]]);return}
 if(e.code==='Escape'||e.code==='KeyP'){if(screen==='play')setPause(!paused);else if(screen==='menu')goTitle();return}
 if(e.code==='KeyM'){setMute(!muted);return}
 if(e.code==='Enter'||e.code==='Space'){
  if(screen==='title'){e.preventDefault();$('bPlay').click()}
  else if(screen==='result'){e.preventDefault();($('bNext').style.display!=='none'?$('bNext'):$('bRetry')).click()}
  else if(screen==='play'&&paused){e.preventDefault();setPause(false)}
 }
});
addEventListener('pointerdown',()=>initAudio(),{capture:true});
let ts=null;
cv.addEventListener('touchstart',e=>{const t=e.changedTouches[0];ts={x:t.clientX,y:t.clientY}},{passive:true});
cv.addEventListener('touchmove',e=>{if(!ts)return;const t=e.changedTouches[0];const dx=t.clientX-ts.x,dy=t.clientY-ts.y;if(Math.abs(dx)+Math.abs(dy)>22){pushDir(Math.abs(dx)>Math.abs(dy)?(dx>0?DIRS.right:DIRS.left):(dy>0?DIRS.down:DIRS.up));ts={x:t.clientX,y:t.clientY}}e.preventDefault()},{passive:false});
cv.addEventListener('touchend',()=>{ts=null});

function resize(){DPR=Math.min(2,window.devicePixelRatio||1);VW=innerWidth;VH=innerHeight;cv.width=Math.round(VW*DPR);cv.height=Math.round(VH*DPR);cv.style.width=VW+'px';cv.style.height=VH+'px';initAttract();if(G)layout()}
addEventListener('resize',resize);
resize();refreshTitle();requestAnimationFrame(frame);
window.__ns={get G(){return G},save:()=>save,newGame,pushDir};
})();
</script>

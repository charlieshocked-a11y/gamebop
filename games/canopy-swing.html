<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Canopy Swing</title>
<style>
:root{--cream:#fff4d8;--wood:#a8693a;--woodD:#5a3416;--ink:#3a2512;--leaf:#5fbf45;--leafD:#245a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173a26;touch-action:none;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
body{font-family:"Trebuchet MS","Avenir Next","Nunito","Segoe UI",system-ui,sans-serif;color:var(--ink)}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
.scr.on{display:block}
.btn{pointer-events:auto;font:inherit;font-weight:900;font-size:19px;line-height:1;color:var(--cream);cursor:pointer;padding:12px 22px;border:3px solid var(--woodD);
 border-radius:13px 17px 12px 16px/16px 12px 17px 13px;
 background:repeating-linear-gradient(177deg,rgba(255,255,255,0) 0 6px,rgba(70,35,10,.12) 6px 8px,rgba(255,255,255,0) 8px 13px),linear-gradient(#cf9154,#a5652f 60%,#93582a);
 box-shadow:0 5px 0 #4a2a10,0 9px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,228,180,.55),inset 0 -2px 0 rgba(0,0,0,.15);
 text-shadow:0 2px 0 #5a3416;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;position:relative;
 transition:transform .14s cubic-bezier(.3,1.7,.5,1),box-shadow .1s,filter .1s}
.btn:hover{transform:translateY(-2px) rotate(-1deg) scale(1.04);filter:brightness(1.06)}
.btn:active,.btn.dn{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 #4a2a10,0 3px 6px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,228,180,.4);transition-duration:.05s}
.btn.leaf{border-color:#1e4a19;background:radial-gradient(120% 80% at 30% 15%,rgba(255,255,220,.35),rgba(255,255,255,0) 50%),linear-gradient(#8fdc5a,#4fa83a 60%,#3f932f);box-shadow:0 5px 0 #1a4015,0 9px 16px rgba(0,0,0,.35),inset 0 2px 0 rgba(230,255,190,.6);text-shadow:0 2px 0 #1e4a19}
.btn.leaf:active{box-shadow:0 1px 0 #1a4015,inset 0 2px 0 rgba(230,255,190,.5)}
.btn.gold{border-color:#6a4208;background:linear-gradient(#ffe07a,#f0b22e 60%,#d9941c);color:#4a2c05;text-shadow:0 1px 0 rgba(255,250,210,.7);box-shadow:0 5px 0 #6a4208,0 9px 14px rgba(0,0,0,.3),inset 0 2px 0 #fff6c0}
.btn.big{font-size:30px;padding:16px 46px;letter-spacing:1px}
.btn.sm{font-size:15px;padding:8px 14px;border-width:2px}
.btn.ico{width:48px;height:48px;padding:0;border-radius:50% 46% 52% 48%/48% 52% 46% 50%}
.btn svg{width:22px;height:22px;flex:none}
.btn.big svg{width:30px;height:30px}
.btn[disabled]{filter:grayscale(.85) brightness(.85);cursor:default}
.btn.lash::before,.btn.lash::after{content:"";position:absolute;top:-7px;bottom:-7px;width:9px;border-radius:4px;background:repeating-linear-gradient(160deg,#e9cf8f 0 3px,#b38b4a 3px 5px);box-shadow:0 2px 2px rgba(0,0,0,.3)}
.btn.lash::before{left:14px}.btn.lash::after{right:14px}
@keyframes popin{0%{transform:scale(.2) rotate(-10deg);opacity:0}55%{transform:scale(1.12) rotate(3deg);opacity:1}78%{transform:scale(.95)}100%{transform:none}}
@keyframes rise{0%{transform:translateY(46px);opacity:0}70%{transform:translateY(-5px);opacity:1}100%{transform:none}}
@keyframes sway{0%,100%{transform:rotate(-1.4deg)}50%{transform:rotate(1.4deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.on .rise{animation:rise .6s cubic-bezier(.2,.9,.3,1.2) backwards}
.on .pop{animation:popin .55s cubic-bezier(.2,.8,.3,1) backwards}
#title .menu{position:absolute;left:0;right:0;bottom:calc(30px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:14px}
#title .row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff6e6;opacity:.55;text-decoration:none;pointer-events:auto;text-shadow:0 1px 2px rgba(0,0,0,.5);letter-spacing:.3px}
#support:hover{opacity:1}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;color:var(--cream);font-weight:900;font-size:18px;padding:5px 12px 5px 7px;border-radius:14px 18px 13px 17px;
 background:linear-gradient(rgba(60,34,14,.82),rgba(40,22,8,.82));border:2px solid rgba(255,220,160,.35);box-shadow:0 3px 8px rgba(0,0,0,.3);text-shadow:0 1px 0 #000}
.chip svg{width:24px;height:24px}
.bar{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) calc(66px + env(safe-area-inset-right)) 0 calc(12px + env(safe-area-inset-left));gap:8px}
#bMute{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));z-index:9;width:44px;height:44px}
#bPause{width:44px;height:44px}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 20px));max-height:calc(100vh - 24px);overflow:auto;pointer-events:auto;text-align:center;
 padding:30px 18px 18px;border-radius:20px 26px 18px 24px;color:var(--ink);
 background:radial-gradient(130% 90% at 25% 0%,#fdf0cc,#efd8a2 55%,#ddbd7b);border:5px solid #6b4220;
 box-shadow:0 0 0 3px #3a2210,0 20px 44px rgba(0,0,0,.5),inset 0 0 34px rgba(130,80,25,.3)}
.on .panel{animation:panelin .5s cubic-bezier(.2,1.25,.35,1) backwards}
@keyframes panelin{0%{transform:translate(-50%,-38%) scale(.8) rotate(-3deg);opacity:0}100%{transform:translate(-50%,-50%)}}
.ribbon{display:inline-block;margin:-6px auto 12px;padding:8px 30px;font-weight:900;font-size:24px;color:#fffbe6;border-radius:9px 13px 8px 12px;
 background:linear-gradient(#86d450,#3f9530);border:3px solid #1f4d1d;box-shadow:0 4px 0 #173d15;text-shadow:0 2px 0 #1f4d1d;transform:rotate(-2deg)}
.close{position:absolute;right:8px;top:8px}
.tabs{display:flex;gap:6px;justify-content:center;margin-bottom:12px;flex-wrap:wrap}
.tab{opacity:.7}.tab.sel{opacity:1;filter:brightness(1.12);transform:translateY(-2px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:rgba(255,250,232,.7);border:2px solid rgba(107,66,32,.35);border-radius:14px 18px 13px 17px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800}
.card canvas{width:84px;height:64px}
.card .nm{font-size:15px}.card .ds{font-size:12px;opacity:.75;font-weight:700;min-height:14px}
.pips{display:flex;gap:4px}.pips i{width:10px;height:10px;border-radius:50%;background:#c9ad7a;border:1px solid #7a5530}.pips i.f{background:#7ccf4e}
.fruitc{display:inline-flex;align-items:center;gap:4px}.fruitc svg{width:18px;height:18px}
#map .wsel{position:absolute;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:8px}
.sign{pointer-events:auto;min-width:200px;text-align:center;padding:9px 20px 10px;font-weight:900;font-size:22px;color:var(--cream);border:3px solid var(--woodD);border-radius:8px 12px 7px 11px;
 background:repeating-linear-gradient(178deg,rgba(255,255,255,0) 0 7px,rgba(70,35,10,.14) 7px 9px),linear-gradient(#b87a42,#8d5426);box-shadow:0 5px 0 #4a2a10,0 8px 16px rgba(0,0,0,.35);text-shadow:0 2px 0 #4a2a10;animation:sway 4s ease-in-out infinite;transform-origin:50% -20px}
.sign small{display:block;font-size:12px;opacity:.85;margin-top:3px;letter-spacing:.5px}
#nodes{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);width:min(860px,96vw);display:flex;flex-wrap:wrap;justify-content:center;gap:14px 12px;padding:0 6px}
.node{pointer-events:auto;width:82px;height:96px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;border:none;background:none;font:inherit;position:relative;transition:transform .15s cubic-bezier(.3,1.7,.5,1)}
.node:nth-child(even){transform:translateY(22px)}
.node:hover{transform:scale(1.08)}.node:nth-child(even):hover{transform:translateY(22px) scale(1.08)}
.node .disc{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:26px;color:var(--cream);text-shadow:0 2px 0 #4a2a10;
 background:radial-gradient(circle at 50% 50%,#c78b52 0 30%,#b07440 31% 45%,#c78b52 46% 60%,#a56a37 61%);border:4px solid var(--medal,#5a3416);box-shadow:0 5px 0 #3a2210,0 8px 14px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,230,190,.5)}
.node.boss .disc{width:78px;height:78px;background:radial-gradient(circle,#c64a2a,#7e2412);border-color:var(--medal,#2a0e06)}
.node .disc svg{width:38px;height:38px}
.node .idl{display:flex;gap:2px}.node .idl svg{width:15px;height:15px}
.node[disabled]{cursor:default}.node[disabled] .disc{filter:grayscale(.9) brightness(.6)}
.node.next .disc{animation:bob 1.2s ease-in-out infinite}
#map .bot{position:absolute;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
#map .topl{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;align-items:center}
#mStars{position:absolute;left:50%;top:calc(84px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;gap:10px}
.lockmsg{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);pointer-events:none;font-weight:900;font-size:22px;color:var(--cream);text-shadow:0 2px 6px #000;display:none}
#hud .mid{position:absolute;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:2px}
#hTime{font-weight:900;font-size:24px;color:var(--cream);text-shadow:0 2px 0 #2a1608,0 0 8px rgba(0,0,0,.5);font-variant-numeric:tabular-nums}
#hPar{font-size:12px;font-weight:800;color:#ffe9b0;opacity:.85;text-shadow:0 1px 2px #000}
#hPar.over{color:#ff9c7a}
#hud .rt{position:absolute;right:calc(62px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top))}
#hIdols{display:flex;gap:3px;padding:4px 8px}
#hIdols svg{width:20px;height:20px;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
#hIdols svg.got{transform:scale(1.25)}
.hl{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
#tut .cap{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top));transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:10px 18px;font-weight:900;font-size:20px;color:#3a2512;
 background:linear-gradient(#fff6dc,#f2dca6);border:3px solid #6b4220;border-radius:14px 18px 12px 16px;box-shadow:0 5px 0 #3a2210,0 10px 20px rgba(0,0,0,.35);white-space:nowrap;max-width:calc(100vw - 20px)}
#tut .cap .keys{display:flex;gap:4px;align-items:center}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:24px;padding:0 6px;border-radius:5px;background:#fff;border:2px solid #6b4220;box-shadow:0 2px 0 #6b4220;font-size:12px;font-weight:900;color:#3a2512}
.key svg{width:16px;height:16px}
#tutSkip{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-top));pointer-events:auto}
.res .medal{width:110px;height:110px;margin:0 auto 4px;display:block}
.res .rows{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.res .stat{background:rgba(255,250,232,.65);border:2px solid rgba(107,66,32,.3);border-radius:12px;padding:6px 12px;min-width:92px;font-weight:900;font-size:20px}
.res .stat small{display:block;font-size:11px;opacity:.7;letter-spacing:.5px}
.res .stat svg{width:20px;height:20px;vertical-align:-4px}
.res .btns{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.res .idr{display:flex;gap:6px;justify-content:center}.res .idr svg{width:34px;height:34px}
.newrec{display:inline-block;background:#ff6a3d;color:#fff;font-weight:900;padding:4px 12px;border-radius:8px;transform:rotate(-4deg);box-shadow:0 3px 0 #9a3218;margin-bottom:6px}
#toasts{position:fixed;right:calc(10px + env(safe-area-inset-right));top:calc(64px + env(safe-area-inset-top));z-index:20;pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.toast{display:flex;align-items:center;gap:8px;padding:6px 12px;font-weight:900;font-size:14px;color:var(--cream);border-radius:12px;border:2px solid #f0c040;background:linear-gradient(#5a3618,#3a2210);box-shadow:0 6px 16px rgba(0,0,0,.45);animation:popin .5s cubic-bezier(.2,.8,.3,1)}
.toast svg{width:26px;height:26px}
.achg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.ach{border-radius:12px;padding:8px 4px;font-size:12px;font-weight:800;background:rgba(255,250,232,.6);border:2px solid rgba(107,66,32,.3);display:flex;flex-direction:column;align-items:center;gap:4px}
.ach svg{width:34px;height:34px}.ach.lk{opacity:.42;filter:grayscale(1)}
.ach .d{font-size:10.5px;opacity:.75;font-weight:700}
.runc{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.runc .card{width:200px;padding:14px}.runc .card b{font-size:22px}
.prow{display:flex;flex-direction:column;gap:10px;align-items:center}
@media (max-width:560px){.btn.big{font-size:26px;padding:14px 38px}.node{width:70px;height:86px}.node .disc{width:58px;height:58px;font-size:22px}.node.boss .disc{width:66px;height:66px}#nodes{gap:10px 6px;top:50%}.sign{min-width:150px;font-size:18px}#tut .cap{font-size:16px;white-space:normal}.grid{grid-template-columns:repeat(2,1fr)}}
@media (max-height:460px){#title .menu{gap:9px;bottom:14px}.btn.big{font-size:24px;padding:11px 34px}.btn{font-size:16px;padding:9px 16px}#nodes{top:56%}.node{height:80px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button id="bMute" class="btn ico sm" aria-label="Sound"></button>
<div id="title" class="scr">
 <div class="menu">
  <button id="bPlay" class="btn leaf big lash rise"></button>
  <div class="row rise" style="animation-delay:.08s">
   <button id="bRun" class="btn"></button><button id="bShop" class="btn"></button><button id="bAch" class="btn ico" aria-label="Trophies"></button>
  </div>
  <button id="bHow" class="btn sm rise" style="animation-delay:.16s">How to play</button>
 </div>
 <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>
<div id="map" class="scr">
 <div class="topl"><button id="mBack" class="btn ico" aria-label="Back"></button><span class="chip" id="mFruit"></span></div>
 <div class="wsel"><button id="wPrev" class="btn ico sm" aria-label="Previous world"></button><div class="sign" id="wName"></div><button id="wNext" class="btn ico sm" aria-label="Next world"></button></div>
 <div id="nodes"></div>
 <div class="lockmsg" id="wLock"></div>
 <div class="bot"><button id="mShop" class="btn"></button><button id="mRun" class="btn"></button><button id="mAch" class="btn ico" aria-label="Trophies"></button></div>
</div>
<div id="shop" class="scr"><div class="panel">
 <button class="btn ico sm close" id="sClose" aria-label="Close"></button>
 <div class="ribbon">Shop</div>
 <div style="margin:-4px 0 10px"><span class="chip" id="sFruit"></span></div>
 <div class="tabs"><button class="btn sm tab sel" data-t="up">Upgrades</button><button class="btn sm tab" data-t="skin">Fur</button><button class="btn sm tab" data-t="vine">Vines</button></div>
 <div class="grid" id="sGrid"></div>
</div></div>
<div id="ach" class="scr"><div class="panel">
 <button class="btn ico sm close" id="aClose" aria-label="Close"></button>
 <div class="ribbon" id="aTitle">Trophies</div>
 <div class="achg" id="aGrid"></div>
</div></div>
<div id="runsel" class="scr"><div class="panel">
 <button class="btn ico sm close" id="rClose" aria-label="Close"></button>
 <div class="ribbon">Jungle Run</div>
 <div class="runc">
  <div class="card"><canvas id="rc1" width="168" height="128"></canvas><b>Endless</b><span class="ds" id="rBest"></span><button class="btn leaf" id="rGo">Run!</button></div>
  <div class="card"><canvas id="rc2" width="168" height="128"></canvas><b>Daily</b><span class="ds" id="rDaily"></span><button class="btn gold" id="rDay">Today</button></div>
 </div>
</div></div>
<div id="hud" class="scr">
 <div class="bar"><div class="hl"><span class="chip" id="hFruit"></span><span class="chip" id="hIdols"></span></div></div>
 <div class="mid"><div id="hTime">0:00.0</div><div id="hPar"></div></div>
 <div class="rt"><button id="bPause" class="btn ico sm" aria-label="Pause"></button></div>
</div>
<div id="tut" class="scr"><div class="cap" id="tutCap"></div><button id="tutSkip" class="btn sm gold">Skip ›</button></div>
<div id="pause" class="scr"><div class="panel" style="width:min(340px,calc(100vw - 20px))">
 <div class="ribbon">Paused</div>
 <div class="prow"><button class="btn leaf big" id="pRes"></button><button class="btn" id="pRetry"></button><button class="btn" id="pMap"></button></div>
</div></div>
<div id="results" class="scr"><div class="panel res" id="resP"></div></div>
<div id="toasts"></div>
<script>
'use strict';
// ================= utilities =================
const SLUG = 'canopy-swing', PFX = 'gamebop.' + SLUG + '.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} }
};
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, hyp = Math.hypot;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v, lerp = (a, b, t) => a + (b - a) * t;
const rnd = Math.random, rr = (a, b) => a + rnd() * (b - a);
const easeOut = t => 1 - Math.pow(1 - t, 3), easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeBack = t => { const c = 1.9; t = clamp(t, 0, 1); return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
function mulberry(s) { return function () { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function RNG(seed) { const f = mulberry(seed); return { f, r: (a, b) => a + f() * (b - a), i: (a, b) => Math.floor(a + f() * (b - a + 1)), p: a => a[Math.floor(f() * a.length)], c: p => f() < p }; }
function hash(n) { let x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }
const _hc = {};
function h2r(h) { if (_hc[h]) return _hc[h]; const n = parseInt(h.slice(1), 16); return _hc[h] = [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(a, b, t) { const A = h2r(a), B = h2r(b); return '#' + [0, 1, 2].map(i => Math.round(A[i] + (B[i] - A[i]) * t).toString(16).padStart(2, '0')).join(''); }
function rgba(h, a) { const A = h2r(h); return 'rgba(' + A[0] + ',' + A[1] + ',' + A[2] + ',' + a + ')'; }
function angDiff(a, b) { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return Math.abs(d); }
function segDist(px, py, ax, ay, bx, by) { const dx = bx - ax, dy = by - ay, l = dx * dx + dy * dy; let t = l ? ((px - ax) * dx + (py - ay) * dy) / l : 0; t = clamp(t, 0, 1); return hyp(px - ax - dx * t, py - ay - dy * t); }
function fmtT(t) { const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(1); }
function todaySeed() { const d = new Date(); return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }

// ================= save =================
const DEF = { fruit: 0, up: { vine: 0, reel: 0, flip: 0, glide: 0, magnet: 0 }, skins: ['cocoa'], skin: 'cocoa', vines: ['jungle'], vine: 'jungle', lv: {}, world: 0, ach: {}, seen: {}, runBest: 0, daily: { seed: 0, best: 0 },
  st: { fruit: 0, bounce: 0, zip: 0, flips: 0, glide: 0, perfect: 0, deaths: 0, runs: 0, toucan: 0 } };
let save = loadSave();

 const add=(c,a,b)=>{if(a>b){const t=a;a=b;b=t}if(!c.conns.some(p=>p[0]===a&&p[1]===b))c.conns.push([a,b])};

 for(const s of def.sp||[]){const c=at(s);if(!c||c.type!=='s'){errs.push('spring '+s);continue}c.spring=true}

 if(def.rv!=null){const x=mh?GW-1-def.rv:def.rv;L.river={x};L.bridges=[];for(let y=0;y<GH;y++){const c=L.get(x,y);if(c){if(!straightIs(c,false))errs.push('bridge '+c.k);c.bridge={r:0,tg:0,warn:0};L.bridges.push(c)}}}

}
function segLen(a,b){return b===opp(a)?1:PI/4}
function exitsAll(c,e){

 const r=[];const sets=c.type==='w'?[c.base,c.alt]:[c.conns];
 for(const cs of sets)for(const p of cs){if(p[0]===e)r.push(p[1]);else if(p[1]===e)r.push(p[0])}return r}
function exitNow(c,e){

 if(c.type==='s'){if(e===c.trunk)return c.br[c.state];return c.br.includes(e)?c.trunk:-1}
 const cs=c.type==='w'?(c.state?c.alt:c.base):c.conns;
 for(const p of cs){if(p[0]===e)return p[1];if(p[1]===e)return p[0]}return -1}
function plan(L,sx,sy,entry,color){

  if(cell.station){if(cell.station===n.c)return n;continue}
  if(cell.tunnel&&n.e===opp(cell.from))continue;
  const col=cell.paint||n.c;
  for(const ex of exitsAll(cell,n.e)){const nx=n.x+DX[ex],ny=n.y+DY[ex],ne=opp(ex),k=nx+','+ny+','+ne+col;if(seen.has(k))continue;seen.add(k);q.push({x:nx,y:ny,e:ne,c:col,d:n.d+segLen(n.e,ex),par:n,ex})}}

function segPos(x,y,a,b,t){

// --- particles ---
let PT=[];
function puff(x,y,s,col){PT.push({t:'puff',x,y,vx:(Math.random()-.5)*8+6,vy:-14-Math.random()*10,r:T*.09*s,gr:T*.3*s,life:0,max:1.3+Math.random()*.5,col:col||'#ffffff'})}
function spark(x,y,s){const a=Math.random()*TAU,v=(60+Math.random()*160)*s;PT.push({t:'spark',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-50*s,life:0,max:.35+Math.random()*.4,col:Math.random()<.5?'#ffe066':'#ff9a3c'})}
function dust(x,y){PT.push({t:'puff',x,y,vx:(Math.random()-.5)*30,vy:-8-Math.random()*8,r:T*.05,gr:T*.1,life:0,max:.5,col:'#d9cbb0'})}
function confetti(x,y){const a=-PI/2+(Math.random()-.5)*2.2,v=120+Math.random()*180;PT.push({t:'conf',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:1.4+Math.random()*.6,col:['#ee4a3e','#3a84e8','#f7c632','#46b94b','#a05ad9','#fff'][Math.floor(Math.random()*6)],rot:Math.random()*6,vr:(Math.random()-.5)*20})}
function drop(x,y){const a=-PI/2+(Math.random()-.5)*2,v=80+Math.random()*160;PT.push({t:'drop',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:0,max:1+Math.random()*.4,col:'#7fd3f0'})}
function paintSplat(x,y,c){const a=Math.random()*TAU,v=40+Math.random()*90;PT.push({t:'drop',x,y:y-T*.2,vx:Math.cos(a)*v,vy:Math.sin(a)*v-60,life:0,max:.7,col:CC[c][0]})}
function popText(x,y,s,col){PT.push({t:'text',x,y,s,col,life:0,max:1.1})}
function ring(x,y,col){PT.push({t:'ring',x,y,col,life:0,max:.5})}
function burst(x,y){PT.push({t:'burst',x,y,life:0,max:.9})}
let SHK=0;function shake(a){SHK=Math.max(SHK,a)}
function updParticles(dt){for(const p of PT){p.life+=dt;if(p.t==='puff'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy*=.985;p.vx*=.99}else if(p.t==='spark'||p.t==='conf'||p.t==='drop'){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.t==='conf'?160:420)*dt;p.vx*=p.t==='conf'?.97:.99;if(p.t==='conf'){p.rot+=p.vr*dt;p.vy*=.97}}else if(p.t==='text')p.y-=40*dt*(1-p.life/p.max)}PT=PT.filter(p=>p.life<p.max);if(PT.length>600)PT.splice(0,PT.length-600)}
function drawParticles(g){for(const p of PT){const k=p.life/p.max;
 if(p.t==='puff'){g.globalAlpha=(1-k)*.75;g.fillStyle=p.col;const r=p.r+p.gr*eOut(k);g.beginPath();g.arc(p.x,p.y,r,0,TAU);g.fill();g.globalAlpha=(1-k)*.4;g.fillStyle='#fff';g.beginPath();g.arc(p.x-r*.3,p.y-r*.3,r*.5,0,TAU);g.fill()}
 else if(p.t==='spark'){g.globalAlpha=1-k;g.strokeStyle=p.col;g.lineWidth=2;g.beginPath();g.moveTo(p.x,p.y);g.lineTo(p.x-p.vx*.03,p.y-p.vy*.03);g.stroke()}
 else if(p.t==='conf'){g.globalAlpha=1-k*k;g.save();g.translate(p.x,p.y);g.rotate(p.rot);g.fillStyle=p.col;g.fillRect(-3,-1.5*Math.abs(Math.cos(p.rot*2))-1,6,3);g.restore()}
 else if(p.t==='drop'){g.globalAlpha=1-k;g.fillStyle=p.col;g.beginPath();g.arc(p.x,p.y,2.5,0,TAU);g.fill()}
 else if(p.t==='text'){g.globalAlpha=k<.7?1:(1-k)/.3;const sc=eBack(Math.min(1,k*4));g.font='900 '+Math.round(T*.42*sc)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.lineWidth=4;g.strokeStyle='#2a2238';g.strokeText(p.s,p.x,p.y);g.fillStyle=p.col;g.fillText(p.s,p.x,p.y)}
 else if(p.t==='ring'){g.globalAlpha=1-k;g.strokeStyle=p.col;g.lineWidth=3;g.beginPath();g.arc(p.x,p.y,T*(.2+k*.6),0,TAU);g.stroke()}
 else if(p.t==='burst'){g.globalAlpha=k<.6?1:(1-k)/.4;const sc=eBack(Math.min(1,k*3))*T*1.1;g.save();g.translate(p.x,p.y);g.rotate(k*.5);g.fillStyle='#ffe14d';g.strokeStyle='#2a2238';g.lineWidth=3;g.beginPath();for(let i=0;i<20;i++){const r=i%2?sc*.5:sc;const a=i/20*TAU;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.stroke();g.fillStyle='#e84b3c';g.font='900 '+Math.round(sc*.42)+'px '+FONT;g.textAlign='center';g.textBaseline='middle';g.rotate(-.2);g.fillText('BONK!',0,0);g.restore()}}
 g.globalAlpha=1}

function drawWorld(g,opts){opts=opts||{};const L=G.L;
 // table background
 const bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,G.R.bg[0]);bg.addColorStop(1,G.R.bg[1]);g.fillStyle=bg;g.fillRect(0,0,W,H);

 for(const d of G.dec){if(L.get(Math.floor(d.x),Math.floor(d.y)))continue;const s=W2S(d.x,d.y);list.push({y:s[1],d,s})}
 for(const tr of G.trains)drawTrain(g,tr,list);

 // people

 for(const c of L.cells.values())if(c.paint)drawShed(g,c);

}

  if(r.gift&&t>1.6){txt('New prop: '+r.gift.n+'!',W/2,y+h*.75+fs*1.8,fs*.9,'#3fa34d')}
  const bw=w*.27,bh=h*.15,by=y+h*.84-bh/2+h*.02;const btns=[['restart','#2f8fd1',()=>restart()],['map','#8a7a9a',()=>go(()=>{SCR='map';mapTarget=Math.min(LV.length-1,g.idx+1)})]];if(g.idx<LV.length-1)btns.push(['play','#3fa34d',()=>go(()=>startLevel(g.idx+1))]);
  btns.forEach((b,i)=>button('rb'+i,W/2-(btns.length*bw+(btns.length-1)*12)/2+i*(bw+12),by,bw,bh,(a,b2,ww,hh)=>{plate(a,b2,ww,hh,b[1]);icon(b[0],0,0,hh*.6,'#fff')},()=>{SFX.click();b[2]()}))}
 else{const rush=g.mode==='rush';const title=rush?(g.rush.newBest?'New best!':'Rush over'):(g.failKind==='mix'?'Too many mix-ups':'Crash!');
  txt(title,W/2,y+h*.15,h*(title.length>12?.085:.11),'#e8473b','center',{w:'900'});

  else{const tc=(g.crashCar=g.crashCar||(Math.random()*4|0));drawCar(cx,W/2-h*.12,y+h*.45,.5+Math.sin(t*3)*.1,'eng','rbgy'[tc],{sc:h*.3});drawCar(cx,W/2+h*.14,y+h*.47,-2.4,'coach','rbgy'[(tc+1)%4],{sc:h*.3});for(let i=0;i<3;i++){const a=t*2+i*2.1;starShape(cx,W/2+Math.cos(a)*h*.22,y+h*.33+Math.sin(a)*h*.06,h*.03,'#ffe14d',1)}

  const bw=w*.34,bh=h*.15,by=y+h*.8;const btns=[['restart','#3fa34d',()=>restart()],[rush?'back':'map','#8a7a9a',()=>go(()=>{if(rush)toTitle();else{SCR='map';mapTarget=g.idx}})]];
  btns.forEach((b,i)=>button('fb'+i,W/2-(2*bw+12)/2+i*(bw+12),by,bw,bh,(a,b2,ww,hh)=>{plate(a,b2,ww,hh,b[1]);icon(b[0],0,0,hh*.6,'#fff')},()=>{SFX.click();b[2]()}))}

 const fs=Math.round(clamp(17*US,13,19));const s=t.a?t.a[1]:t.msg;cx.font='900 '+fs+'px '+FONT;const w=cx.measureText(s).width+fs*(t.a?4.4:2);const h=fs*2.6;const y=lerp(-h-10,hudTop()+8,k);const x=W/2-w/2;
 plate(x,y,w,h,'#2c3e66',{r:h/2,rivets:0});if(t.a){cx.fillStyle='#f7c632';cx.beginPath();cx.arc(x+h*.55,y+h/2,h*.36,0,TAU);cx.fill();icon(t.a[3],x+h*.55,y+h/2,h*.42,'#7a4a0e');txt(s,x+h*1.05+(w-h*1.05)/2-fs*.4,y+h/2+1,fs,'#fff')}else txt(s,W/2,y+h/2+1,fs,'#fff')}

// ===== main loop =====
const SUP=document.getElementById('sup');let supShown=null;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=Math.max(200,innerWidth);H=Math.max(200,innerHeight);cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);US=clamp(Math.min(W/900,H/640),.62,1.25);
 if(SCR==='title'&&TG){G=TG;layoutWorld(true)}else if(SCR==='play'&&G)layoutWorld(false,hudTop(),G.phase==='build'?Math.round(72*US):6)}
addEventListener('resize',resize);
function stepPlay(rdt){const g=G;if(g.paused)return 1;let sc=g.slow;
 if(g.phase==='crash'){const c=g.crash;c.t+=rdt;sc=c.t<1.3?.15:Math.max(0,.15-(c.t-1.3)*.2);const p=W2S(c.x,c.y);g.cam.z=lerp(g.cam.z,1.25,.05);g.cam.x=lerp(g.cam.x,(p[0]-W/2)*.55,.05);g.cam.y=lerp(g.cam.y,(p[1]-H/2)*.55,.05);
  if(c.t>2.3){if(g.mode==='rush')endRush();else{g.phase='fail';g.failKind='crash';g.resT=0}}}
 else if(g.phase==='fail'||g.phase==='over'){if(g.failKind==='crash'||g.crash){sc=0}}
 if(g.hold>0)g.hold-=rdt;
 else if(g.phase==='play'||g.phase==='crash'){const dt=rdt*(g.ff?2.5:1)*sc;const n=Math.max(1,Math.ceil(dt/(1/60)));for(let i=0;i<n;i++){simStep(dt/n);if(g.phase!=='play'&&g.phase!=='crash')break}}
 if(g.mode==='tut')tutUpdate(rdt);
 if(g.bot&&g.phase==='play')botStep();
 const dsc=g.crash&&g.crash.t<1.3?.3:1;const ddt=rdt*dsc;
 for(const d of g.debris){d.x+=d.vx*ddt;d.y+=d.vy*ddt;d.vz-=T*14*ddt;d.z+=d.vz*ddt;if(d.z<0){d.z=0;if(d.sink)d.sinkT=(d.sinkT||0)+ddt*1.5;d.vz=-d.vz*.35;d.vx*=.6;d.vy*=.6;d.va*=.6}d.a+=d.va*ddt;if(Math.random()<.1&&d.z>2)puff(d.x,d.y-d.z,.5,'#999')}
 for(const s of g.L.stations){s.wave=Math.max(0,(s.wave||0)-rdt);s.grump=Math.max(0,(s.grump||0)-rdt)}
 if(g.phase!=='crash'&&g.cam.z!==1){g.cam.z=lerp(g.cam.z,1,.08);if(Math.abs(g.cam.z-1)<.002)g.cam.z=1}
 return dsc}
let last=performance.now(),slowFrames=0;
function frame(now){const rdt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;TIME+=rdt;
 if(rdt>.03)slowFrames++;else slowFrames=Math.max(0,slowFrames-.5);if(slowFrames>90&&tiltOn){tiltOn=false}
 if(TRN){TRN.t+=rdt*3.4;if(TRN.t>=1&&!TRN.done){TRN.done=true;try{TRN.fn()}catch(e){console.warn(e)}}if(TRN.t>=2)TRN=null}
 let pf=1;
 if(SCR==='title'&&TG){G=TG;const n=Math.max(1,Math.ceil(rdt/(1/60)));for(let i=0;i<n;i++)simStep(rdt/n);if(G.trains.length<2){const c=G.L.get(3,2);if(c&&!G.occ.has(c.k)&&!G.occ.has('4,2'))spawnTrainAt(c,3,1,'rbgyp'[Math.floor(Math.random()*5)],Math.random()<.3?'f':'n')}}
 else if(SCR==='play'&&G)pf=stepPlay(rdt);
 updParticles(rdt*pf);SHK=Math.max(0,SHK-rdt*40);
 render();

function render(){UIB=[];cx.setTransform(DPR,0,0,DPR,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over';

 if(SCR==='title'){drawTitle()}
 else if(SCR==='play'&&G){drawWorld(cx);tiltShift(cx,Math.max(10,OY+T*.25),Math.max(10,H-OY-BH+T*.1));drawHUD();drawTutorial();
  if(G.paused)drawPause();else if(G.phase==='done'||G.phase==='fail'||G.phase==='over')drawResult()}
 else if(SCR==='map')drawMap();else if(SCR==='shop')drawShop();else if(SCR==='dio')drawDio();else if(SCR==='ach')drawAch();
 drawToasts();
 }catch(e){console.warn(e)}
 if(TRN){const a=TRN.t<1?eIO(TRN.t):eIO(2-TRN.t);const R=Math.hypot(W,H)*.6*(1-a);cx.fillStyle='#2a1f33';cx.beginPath();cx.rect(0,0,W,H);cx.arc(W/2,H/2,Math.max(0,R),0,TAU,true);cx.fill('evenodd');if(a>.6){cx.globalAlpha=(a-.6)/.4;drawCar(cx,W/2,H/2,0,'eng','r',{sc:60});cx.globalAlpha=1}}

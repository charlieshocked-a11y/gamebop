<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kickflip Alley</title>
<style>
:root{--ink:#2b1d33;--cream:#fff3df;--sun:#ffc94d;--coral:#ff6f59;--teal:#2fb5a5;--plum:#6b3f7a;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#2b1d33;touch-action:none;user-select:none;-webkit-user-select:none;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink)}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.H{font-family:Impact,"Haettenschweiler","Arial Narrow Bold","Arial Black",sans-serif;font-weight:900;letter-spacing:.5px}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;padding:calc(10px + var(--sat)) calc(10px + var(--sar)) calc(10px + var(--sab)) calc(10px + var(--sal))}
.scr.on{display:flex;animation:scrIn .38s cubic-bezier(.2,1.4,.4,1)}
@keyframes scrIn{from{opacity:0;transform:translateY(22px) scale(.96)}to{opacity:1;transform:none}}
.dim{background:radial-gradient(ellipse at center,rgba(43,29,51,.25),rgba(43,29,51,.72))}
/* logo */
.logo{transform:rotate(-5deg);margin:0 0 min(2.5vh,18px);pointer-events:none}
.logo svg{width:min(88vw,540px,74vh);height:auto;display:block;overflow:visible}
.logo .lt{animation:bob 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:translateY(0) rotate(var(--r))}50%{transform:translateY(-.9px) rotate(calc(var(--r)*-1))}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-2deg) scale(1.06)}}
/* buttons */
.btn{font-weight:900;font-family:Impact,"Haettenschweiler","Arial Black",sans-serif;font-size:19px;line-height:1;letter-spacing:1px;color:var(--ink);background:var(--bc,#ffc94d);border:3px solid var(--ink);border-radius:16px 11px 18px 10px;padding:11px 22px;box-shadow:0 5px 0 var(--ink),0 8px 14px rgba(43,29,51,.25);cursor:pointer;transform:rotate(calc(var(--r,0)*1deg));transition:transform .18s cubic-bezier(.3,1.9,.5,1),box-shadow .08s;position:relative;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:30%;border-radius:10px;background:rgba(255,255,255,.35);pointer-events:none}
.btn:hover{transform:rotate(calc(var(--r,0)*1deg)) scale(1.07)}
.btn:active,.btn.press{transform:rotate(calc(var(--r,0)*1deg)) translateY(4px) scale(.98);box-shadow:0 1px 0 var(--ink)}
.btn.big{font-size:min(8vw,34px);padding:13px 46px}
.btn.sm{font-size:15px;padding:8px 13px}
.btn[disabled]{filter:grayscale(.85) brightness(.9);opacity:.7;cursor:default}
.btn svg{width:20px;height:20px;flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.menu{display:flex;flex-direction:column;gap:14px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--cream);border:3px solid var(--ink);border-radius:20px;padding:4px 11px 4px 7px;font:900 16px/1 Impact,"Arial Black",sans-serif;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.chip svg{width:20px;height:20px}
.ib{width:44px;height:44px;border-radius:13px 10px 14px 9px;border:3px solid var(--ink);background:var(--cream);box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;transition:transform .15s cubic-bezier(.3,1.9,.5,1)}
.ib:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.ib svg{width:24px;height:24px}
#topR{position:fixed;top:calc(8px + var(--sat));right:calc(8px + var(--sar));z-index:7;display:flex;gap:8px}
#topL{position:fixed;top:calc(8px + var(--sat));left:calc(8px + var(--sal));z-index:7;display:none;gap:8px}
#support{position:fixed;right:calc(9px + var(--sar));bottom:calc(7px + var(--sab));font-size:11.5px;color:#fff3df;opacity:.55;text-decoration:none;z-index:8;text-shadow:0 1px 2px rgba(43,29,51,.8);display:none;padding:3px 2px}
#support:hover{opacity:1}
/* panels */
.panel{background:var(--cream);border:3px solid var(--ink);border-radius:22px 14px 24px 13px;box-shadow:7px 8px 0 var(--ink);padding:14px 16px;max-width:min(96vw,900px);position:relative}
.ptitle{font:900 30px/1 Impact,"Arial Black",sans-serif;letter-spacing:1px;color:var(--ink);text-shadow:2px 2px 0 var(--sun);margin-bottom:8px;display:flex;align-items:center;gap:10px}
.back{position:absolute;top:10px;left:10px;z-index:2}
/* spots */
#spotWrap{width:min(96vw,980px);display:flex;flex-direction:column;gap:10px;max-height:100%}
#spotWrap>.panel,#sGear .panel{max-height:calc(100vh - 34px);overflow-y:auto;touch-action:pan-y}
#cards{display:flex;gap:12px;overflow-x:auto;padding:8px 4px 14px;scroll-snap-type:x mandatory;touch-action:pan-x;scrollbar-width:thin}
.card{flex:none;width:168px;scroll-snap-align:center;background:var(--cream);border:3px solid var(--ink);border-radius:16px 12px 18px 11px;box-shadow:0 5px 0 var(--ink);cursor:pointer;overflow:hidden;transition:transform .2s cubic-bezier(.3,1.8,.5,1);position:relative}
.card:nth-child(odd){transform:rotate(-1.2deg)}.card:nth-child(even){transform:rotate(1deg)}
.card.sel{transform:translateY(-6px) scale(1.04);box-shadow:0 10px 0 var(--ink),0 0 0 4px var(--sun)}
.card canvas{display:block;width:100%;height:92px;border-bottom:3px solid var(--ink)}
.card .nm{font:900 17px/1.05 Impact,"Arial Black",sans-serif;padding:6px 8px 2px}
.card .sub{display:flex;justify-content:space-between;align-items:center;padding:0 8px 7px;font:900 13px/1 Impact,"Arial Black",sans-serif;color:#7a5a6a}
.card.lock canvas{filter:grayscale(1) brightness(.55)}
.lockb{position:absolute;top:30px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sun);border-radius:12px;padding:5px 10px;font:900 15px/1 Impact,"Arial Black",sans-serif;display:flex;gap:5px;align-items:center}
#gpanel{display:flex;gap:14px;align-items:stretch;flex-wrap:wrap}
#glist{flex:1 1 380px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 10px}
.gi{display:flex;align-items:center;gap:8px;font:900 15px/1.05 Impact,"Arial Black",sans-serif;padding:3px 4px;border-radius:10px;min-width:0}
.gi .gic{width:32px;height:32px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;display:flex;align-items:center;justify-content:center}
.gi .gic svg{width:20px;height:20px}
.gi.done .gic{background:var(--sun)}
.gi.done .gl{text-decoration:line-through;text-decoration-thickness:2px;opacity:.6}
.gi .gl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.gi .gc{font-size:12px;color:#5f8f3a;white-space:nowrap}
#gside{flex:0 0 190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
/* gear */
#tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tab{font:900 15px/1 Impact,"Arial Black",sans-serif;padding:8px 12px;border:3px solid var(--ink);border-radius:12px 9px 13px 8px;background:#f1dcc0;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.tab.on{background:var(--sun);transform:translateY(-2px)}
#items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;max-height:min(52vh,420px);overflow-y:auto;padding:4px 4px 10px;touch-action:pan-y}
.it{background:#fff;border:3px solid var(--ink);border-radius:14px 10px 15px 9px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 4px 0 var(--ink);cursor:pointer;transition:transform .15s cubic-bezier(.3,1.9,.5,1)}
.it:active{transform:translateY(3px)}
.it.eq{background:#fff6c8;box-shadow:0 4px 0 var(--ink),0 0 0 3px var(--teal)}
.it canvas{width:110px;height:70px}
.it .nm{font:900 14px/1 Impact,"Arial Black",sans-serif;text-align:center}
.it .pr{font:900 13px/1 Impact,"Arial Black",sans-serif;color:#3c7a2e}
.it.lk{opacity:.55}
.stat{display:flex;align-items:center;gap:10px;font:900 18px/1 Impact,"Arial Black",sans-serif;padding:6px 0}
.stat .sn{width:76px}
.pips{display:flex;gap:3px;flex:1}
.pips i{width:16px;height:16px;border:2px solid var(--ink);border-radius:5px 3px 5px 3px;background:#efe0cc}
.pips i.on{background:var(--teal)}.pips i.bo{background:var(--sun)}
.tk{display:flex;align-items:center;gap:8px;font:900 14px/1 Impact,"Arial Black",sans-serif;padding:6px;background:#fff;border:2px solid var(--ink);border-radius:10px}
.tk .keys{display:flex;gap:3px}
.kk{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border:2px solid var(--ink);border-bottom-width:4px;border-radius:6px;background:#fff;font:900 13px/1 Impact,"Arial Black",sans-serif}
.tk.lk{opacity:.4}
.tk.got{background:#e6fbe0}
/* end */
#endScore{font:900 min(14vw,72px)/1 Impact,"Arial Black",sans-serif;color:var(--sun);text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink),0 7px 0 var(--ink);text-align:center}
.newbest{display:inline-block;background:var(--coral);color:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px 10px;font:900 16px Impact,"Arial Black",sans-serif;transform:rotate(-6deg);animation:wig 1s ease-in-out infinite}
/* touch */
#touch{position:fixed;inset:0;z-index:4;display:none;pointer-events:none}
#touch.on{display:block}
#joy{position:absolute;left:calc(14px + var(--sal));bottom:calc(18px + var(--sab));width:136px;height:136px;border-radius:50%;background:rgba(255,243,223,.16);border:3px solid rgba(43,29,51,.45);pointer-events:auto;touch-action:none}
#joy::before{content:"";position:absolute;inset:18px;border-radius:50%;border:2px dashed rgba(255,243,223,.35)}
#knob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink)}
.tb{position:absolute;border-radius:50%;border:3px solid var(--ink);box-shadow:0 5px 0 var(--ink);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column;font:900 12px/1 Impact,"Arial Black",sans-serif;color:var(--ink);transition:transform .06s}
.tb svg{width:58%;height:58%}
.tb.dn{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 var(--ink)}
#bO{right:calc(16px + var(--sar));bottom:calc(20px + var(--sab));width:92px;height:92px;background:var(--sun)}
#bX{right:calc(122px + var(--sar));bottom:calc(22px + var(--sab));width:70px;height:70px;background:var(--coral)}
#bC{right:calc(40px + var(--sar));bottom:calc(126px + var(--sab));width:70px;height:70px;background:var(--teal)}
/* hud dom */
#goalrow{position:fixed;top:calc(56px + var(--sat));right:calc(8px + var(--sar));display:none;gap:3px;z-index:3;flex-wrap:wrap;justify-content:flex-end;max-width:180px;pointer-events:none}
#goalrow .g{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:rgba(255,243,223,.9);display:flex;align-items:center;justify-content:center}
#goalrow .g svg{width:15px;height:15px}
#goalrow .g.d{background:var(--sun);animation:gpop .5s cubic-bezier(.3,2,.5,1)}
@keyframes gpop{from{transform:scale(1.8)}to{transform:scale(1)}}
/* tutorial */
#tut{position:fixed;inset:0;z-index:9;pointer-events:none;display:none}
#tut.on{display:block}
#tutCap{position:absolute;left:50%;top:calc(17% + var(--sat));transform:translateX(-50%);background:var(--cream);border:3px solid var(--ink);border-radius:18px 12px 20px 11px;box-shadow:5px 6px 0 var(--ink);padding:10px 16px;font:900 min(6vw,24px)/1.1 Impact,"Arial Black",sans-serif;display:flex;align-items:center;gap:10px;white-space:nowrap;animation:capIn .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes capIn{from{transform:translateX(-50%) scale(.5) rotate(-8deg);opacity:0}to{transform:translateX(-50%)}}
#tutCap .kk{font-size:16px;height:32px;min-width:32px;animation:kpress 1s ease-in-out infinite}
@keyframes kpress{0%,60%,100%{transform:none;border-bottom-width:4px}30%{transform:translateY(3px);border-bottom-width:1px}}
#tutSkip{position:absolute;top:calc(10px + var(--sat));left:50%;transform:translateX(-50%);pointer-events:auto}
#tutDots{position:absolute;left:50%;top:calc(17% + 62px + var(--sat));transform:translateX(-50%);display:flex;gap:6px}
#tutDots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--cream)}
#tutDots i.on{background:var(--sun)}
#ghost{position:absolute;width:56px;height:56px;display:none;animation:ghost 1.1s ease-in-out infinite;filter:drop-shadow(2px 4px 0 rgba(43,29,51,.4))}
@keyframes ghost{0%,100%{transform:translate(0,0)}45%{transform:translate(var(--gx,0px),var(--gy,10px)) scale(.92)}}
#toast{position:fixed;left:50%;top:calc(104px + var(--sat));transform:translateX(-50%);z-index:8;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
.tst{background:var(--cream);border:3px solid var(--ink);border-radius:14px 10px 15px 9px;box-shadow:4px 5px 0 var(--ink);padding:7px 14px;font:900 18px/1 Impact,"Arial Black",sans-serif;display:flex;align-items:center;gap:8px;white-space:nowrap;animation:tIn .45s cubic-bezier(.3,1.8,.5,1)}
.tst.gold{background:var(--sun)}.tst.teal{background:#9ff0e2}
.tst svg{width:24px;height:24px}
.tst.out{animation:tOut .35s ease-in forwards}
@keyframes tIn{from{transform:translateY(-30px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes tOut{to{transform:translateY(-20px) scale(.8);opacity:0}}
#fade{position:fixed;inset:0;background:#2b1d33;opacity:0;pointer-events:none;z-index:20;transition:opacity .25s}
.cash{color:#2e7a28}
@media (max-width:640px){.panel{padding:12px 10px}.ptitle{font-size:24px}#glist{grid-template-columns:1fr;gap:3px}.gi{font-size:14px}.gi .gic{width:28px;height:28px}#gside{flex:1 1 100%;flex-direction:row;flex-wrap:wrap;order:-1}.card{width:140px}.card canvas{height:78px}}
@media (max-height:460px){.logo{margin-bottom:4px}.menu{gap:9px}.btn.big{padding:10px 40px;font-size:28px}.btn.sm{padding:7px 11px;font-size:14px}#glist{gap:2px 10px}.gi .gic{width:26px;height:26px}.gi{font-size:13px}.card canvas{height:70px}}
</style></head><body>
<canvas id="cv"></canvas>
<div id="goalrow"></div>
<div id="topR"><div class="ib" id="bPause" title="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="1.5" fill="#2b1d33"/><rect x="14" y="4" width="5" height="16" rx="1.5" fill="#2b1d33"/></svg></div><div class="ib" id="bMute" title="Sound"></div></div>
<div id="touch"><div id="joy"><div id="knob"></div></div>

<div class="tb" id="bX"><svg viewBox="0 0 40 40"><path d="M8 22a12 12 0 1 0 6-12" stroke="#2b1d33" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M8 4v10h10" stroke="#2b1d33" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
<div class="tb" id="bC"><svg viewBox="0 0 40 40"><path d="M12 30V14a3 3 0 0 1 6 0v8V9a3 3 0 0 1 6 0v13V12a3 3 0 0 1 6 0v12q0 10-9 10h-3q-5 0-8-5l-5-8a3 3 0 0 1 5-3z" fill="#fff3df" stroke="#2b1d33" stroke-width="3" stroke-linejoin="round"/></svg></div>
</div>
<div class="scr" id="sTitle">
 <div style="position:relative"><div class="logo" id="logo"></div></div>
 <div class="menu">
  <button class="btn big" id="bPlay" style="--bc:#ffc94d;--r:-2">PLAY</button>
  <div class="row">
   <button class="btn sm" id="bFree" style="--bc:#ff8f6b;--r:1.5"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#fff3df" stroke="#2b1d33" stroke-width="2.5"/><path d="M12 13V8.5M10 2.5h4" stroke="#2b1d33" stroke-width="2.5" stroke-linecap="round"/></svg>2-MIN</button>
   <button class="btn sm" id="bDaily" style="--bc:#9ff0e2;--r:-1"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3" fill="#fff3df" stroke="#2b1d33" stroke-width="2.5"/><path d="M3 10h18M8 3v4M16 3v4" stroke="#2b1d33" stroke-width="2.5" stroke-linecap="round"/></svg>DAILY</button>
   <button class="btn sm" id="bGear" style="--bc:#c9a7ef;--r:2"><svg viewBox="0 0 24 24"><path d="M3 12q0-3 3-3h12q3 0 3 3" stroke="#2b1d33" stroke-width="2.5" fill="#fff3df"/><circle cx="7" cy="16" r="2.6" fill="#2b1d33"/><circle cx="17" cy="16" r="2.6" fill="#2b1d33"/></svg>GEAR</button>
   <button class="btn sm" id="bHow" style="--bc:#fff3df;--r:-1.5"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.5" fill="#ffc94d" stroke="#2b1d33" stroke-width="2.5"/><path d="M9.3 9.5a2.8 2.8 0 1 1 3.6 2.7c-.6.2-.9.8-.9 1.4v.6" stroke="#2b1d33" stroke-width="2.5" fill="none" stroke-linecap="round"/><circle cx="12" cy="17.6" r="1.4" fill="#2b1d33"/></svg>HOW TO PLAY</button>
  </div>
  <div class="row" id="titleChips"></div>
 </div>
</div>
<a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>

 <div class="panel" style="width:100%"><button class="btn sm back" id="spBack" style="--bc:#fff3df;--r:-4">‹ BACK</button>
  <div class="ptitle" style="justify-content:space-between;padding-left:96px"><span id="spTitle">SPOTS</span><span class="row" id="spChips"></span></div>
  <div id="cards"></div>
  <div id="gpanel"><div id="glist"></div><div id="gside"></div></div>
 </div></div></div>

 <div class="ptitle" style="justify-content:space-between;padding-left:96px"><span>GEAR</span><span id="gCash" class="chip"></span></div>
 <div id="tabs"></div><div id="items"></div></div></div>

 <div class="ptitle" style="justify-content:center;margin-top:34px">DAILY LINE</div><div id="dBody"></div>

<script>
(()=>{

 G.S={mode,spi,time:mode==='tutorial'?9999:120,score:0,combo:newCombo(),letters:[0,0,0,0,0],tapes:0,pigeons:0,special:0,sess:{},newGoals:[],cash:0,goals:goalList(spi),done,best1:0,bails:0,dailyBest:0,daily:mode==='daily'?dailyDef():null,over:false};
 if(mode!=='tutorial'){SV.started=true;SV.lastSpot=spi;save()}
 G.state='play';G.dispScore=0;G.banner={txt:mode==='tutorial'?'LET\'S ROLL!':'GO!',sub:mode==='tutorial'?'':SPOTS[spi].name,t:0};sfx.start();G.tev={};
 showScr(null);renderGoalRow();if(mode==='tutorial')tutStart();else tutHide();}
function endSession(){const S=G.S;if(!S||S.over)return;S.over=true;const id=SPOTS[S.spi].id;let nb=false;SV.sessions++;
 if(S.mode==='career'&&S.score>(SV.best[id]||0)){SV.best[id]=S.score;nb=S.score>0}
 if(S.mode==='free'&&S.score>(SV.free[id]||0)){SV.free[id]=S.score;nb=S.score>0}
 let paid=0;if(S.mode==='daily'){const k=S.daily.key;if(S.dailyBest>(SV.daily[k]||0)){SV.daily[k]=S.dailyBest;nb=S.dailyBest>0}if(S.dailyBest>=S.daily.target&&!SV.dailyPaid[k]){SV.dailyPaid[k]=1;SV.cash+=300;S.cash+=300;paid=1}}
 const bonus=Math.floor(S.score/500/5)*5;SV.cash+=bonus;S.cash+=bonus;save();
 G.state='end';showScr('sEnd');renderGoalRow();
 $('eTitle').textContent=S.mode==='daily'?'DAILY LINE':S.mode==='free'?'FREE SESSION':SPOTS[S.spi].name.toUpperCase();
 const target=S.mode==='daily'?S.dailyBest:S.score;let k=0;const el=$('endScore');el.textContent='0';
 const iv=setInterval(()=>{k=Math.min(1,k+.04);el.textContent=fmt(target*EZ.out(k));if(k<1&&Math.random()<.5)sfx.tick();if(k>=1){clearInterval(iv);if(nb)sfx.goal()}},30);
 $('eSub').innerHTML=(nb?'<span class="newbest">NEW BEST!</span>':'')+'<span class="chip">'+ICON.cash+'<span class="cash">+$'+fmt(S.cash)+'</span></span>'+(S.mode==='daily'?'<span class="chip">TARGET '+fmt(S.daily.target)+(paid?' ✓':'')+'</span>':'<span class="chip">'+ICON.combo+'BEST LINE '+fmt(S.best1)+'</span>');
 $('eGoals').innerHTML=S.newGoals.map(i=>'<span class="chip" style="background:#ffc94d">'+goalIcon(S.goals[i].t)+S.goals[i].lab+'</span>').join('')+(S.mode==='career'?'<span class="chip">'+ICON.score+spotGoals(S.spi)+'/10</span>':'');}

/* ---------- bots ---------- */
function botInput(b,dt,trickP){const I=b.bi||(b.bi={l:0,r:0,u:0,d:0,o:0,f:0,g:0,e:{},rel:{},hold:0,spinT:0});
 for(const k of ACTS){I.e[k]=false;I.rel[k]=false}I.r=0;I.l=0;I.f=0;I.g=0;I.u=0;I.d=0;if(b.cool>0)b.cool-=dt;else b.cool=0;
 if(b.mode==='ground'){I.spinT=0;if(b.s<b.botV)I.r=1;
  if(I.hold>0){I.hold-=dt;if(I.hold<=0)I.o=0}
  else{const T=b.T,look=Math.max(50,b.s*.4)+30;let need=0,dist=0;
   for(let d=8;d<=look;d+=6){const g1=groundAt(T,b.x+d).y,g0=groundAt(T,b.x+d-6).y;if(g0-g1>9){need=b.y-groundAt(T,b.x+d+10).y;dist=d;break}if(g1-g0>22){need=-1;dist=d;break}}
   for(const z of T.zones)if(z.k==='pit'&&z.x0>b.x&&z.x0-b.x<b.s*.05+12){need=-2;dist=z.x0-b.x;b.cool=0}
   if(b.cool>0&&need>=0){}else if(need>0&&dist<b.s*.2+26){b.botCharge=clamp(.1+need/100,0,1);I.o=1;I.e.o=true;I.hold=.09;b.cool=.3}
   else if(need===-2||(need<0&&dist<b.s*.05+8)){b.botCharge=need===-2?1:.75;I.o=1;I.e.o=true;I.hold=.001;b.cool=.3}
   else if(trickP&&Math.random()<trickP*dt*.6&&b.s>240&&need===0){b.botCharge=.65+Math.random()*.35;I.o=1;I.e.o=true;I.hold=.18;b.cool=.8}}}
 else if(b.mode==='air'){I.o=0;I.hold=0;
  if(trickP&&!b.trick&&!b.grab&&b.airT>.05&&b.vy<-260&&b.cool<.5){b.cool=1;const r=Math.random();if(r<.45){I.f=1;I.e.f=true;if(Math.random()<.4){I.d=1;b.stale.d=0}}else if(r<.75){I.g=1;I.e.g=true}else I.spinT=.22+Math.random()*.3}
  if(I.spinT>0){I.spinT-=dt;I.r=1}
  if(b.grab)I.g=b.grab.t<.35?1:0}
 else if(b.mode==='grind'){I.o=0;if(trickP&&b.gT>.5&&Math.random()<dt*.4)I.e.o=true}
 return I}

/* ---------- update ---------- */
function update(dt){const W=G.W;if(!W)return;W.t+=dt;const S=G.S,sk=W.sk,T=W.T,play=G.state==='play';
 const I=play?(G.auto?(sk.botV=sk.botV||380,botInput(sk,dt,1)):readInput()):(W.mode==='demo'?botInput(sk,dt,1):blankInput());
 if(play&&S.time<=0){I.r=false}
 skUpdate(sk,I,dt);if(sk.mode!=='bail')computeRig(sk,dt);
 if(sk.bot&&sk.mode==='ground'&&Math.abs(sk.s)<20){sk.stuck=(sk.stuck||0)+dt;if(sk.stuck>1.5){sk.x+=80;sk.y=groundAt(T,sk.x).y;sk.s=260;sk.stuck=0}}else sk.stuck=0;
 // rival
 const r=W.rival;if(r){const R=W.race;
  if(R.st==='idle'){r.idle=true;r.s=0;r.t+=dt;computeRig(r,dt);if(sk.x>T.raceStart){R.st='on';r.idle=false;toast(ICON.race,'RACE '+W.sp.G.rival+'!','teal');sfx.start()}}
  else{r.botV=W.sp.G.rv+(sk.x>r.x+300?40:0)-(r.x>sk.x+600?40:0);skUpdate(r,botInput(r,dt,.25),dt);if(r.mode!=='bail')computeRig(r,dt);
   if(R.st==='on'){if(sk.x>=T.raceEnd&&sk.mode!=='bail'){R.st='won';goalDone(7);popup(sk.x,sk.y-120,'WIN!','#7fd67a',30)}else if(r.x>=T.raceEnd){R.st='lost';toast(ICON.race,W.sp.G.rival+' wins! Next lap','')}}
   if(r.x>T.len){r.x=T.len-10;r.s=0;r.idle=true}}}
 // combo grace
 if(S&&S.combo.on&&sk.mode==='ground'&&!sk.manual&&!sk.charging){S.combo.grace-=dt;if(S.combo.grace<=0){comboBank();if(G.tev)G.tev.bank=1}}
 if(S&&S.special>0&&S.special<1&&!S.combo.on)S.special=Math.max(0,S.special-.012*dt);
 // collectibles
 if(S&&sk.mode!=='bail'&&sk.J){const hx=sk.J.hip.x,hy=sk.J.hip.y-12;
  T.letters.forEach((l,i)=>{if(l.got)return;const dx=l.x-hx,dy=l.y-hy;if(dx*dx+dy*dy<40*40){l.got=true;const li='SKATE'.indexOf(l.ch);S.letters[li]=1;const n=S.letters.reduce((a,b)=>a+b,0);sfx.letter(n);popup(l.x,l.y-30,l.ch,'#ff6f59',30);for(let k=0;k<10;k++)G.parts.push({k:'star',x:l.x,y:l.y,vx:(Math.random()-.5)*400,vy:(Math.random()-.5)*400,t:0,life:.5,c:'#ffc94d',s:5});if(n>=5)goalDone(3)}});
  T.tapes.forEach(p=>{if(p.got)return;const dx=p.x-hx,dy=p.y-hy;if(dx*dx+dy*dy<38*38){p.got=true;S.tapes++;sfx.coin();popup(p.x,p.y-26,S.tapes+'/5','#9ff0e2',22);goalCheck('tapes',S.tapes)}})}
 // peds & pigeons
 for(const p of T.peds){p.t+=dt;if(p.st&&p.t>1.8)p.st=0;if(p.bub){p.bub.t+=dt;if(p.bub.t>1.7)p.bub=null}const d=sk.x-p.x;if(Math.abs(d)<320&&p.st!==1)p.face=d>0?1:-1}
 for(const b of T.pigeons){b.t+=dt;if(!b.fly){const near=(q)=>q&&Math.abs(q.x-b.x)<120&&Math.abs(q.y-b.y)<90&&q.mode!=='bail';
   if(near(sk)||near(r)){b.fly=1;const dir=b.x>=sk.x?1:-1;b.vx=dir*(70+Math.random()*90)+(sk.s||0)*.45;b.vy=-240-Math.random()*140;b.f=b.vx>0?1:-1;if(G.W===W&&Math.random()<.6)sfx.flap();for(let k=0;k<2;k++)G.parts.push({k:'feather',x:b.x,y:b.y-8,vx:(Math.random()-.5)*60,vy:-30,t:0,life:1.4});
    if(S&&play&&near(sk)){S.pigeons++;goalCheck('pigeons',S.pigeons)}}
   else if(Math.random()<dt*.4){b.x+=b.f*3;if(Math.random()<.3)b.f*=-1}}
  else{b.vy=damp(b.vy,-90,1.5,dt);b.x+=b.vx*dt;b.y+=b.vy*dt}}
 if(play&&Math.random()<dt*.15)for(const b of T.pigeons)if(!b.fly&&Math.abs(b.x-sk.x)<500){sfx.coo();break}
 // camera
 const cam=G.cam;let tx=sk.x,ty=sk.y,vx=sk.mode==='air'?sk.vx:sk.s;if(sk.mode==='bail'&&sk.rag){tx=sk.rag.p.hip.x;ty=sk.rag.p.hip.y;vx=0}
 let ref=ty;if(sk.mode==='air'){ref=lerp(Math.min(sk.toY,groundAt(T,tx).y),ty,.55)}
 cam.x=damp(cam.x,tx+(W.mode==='demo'?0:clamp(vx*.38,-60,220)),3.6,dt);cam.y=damp(cam.y,ref-34,sk.mode==='air'?2.6:4.5,dt);
 const ht=sk.mode==='air'?clamp((sk.toY-sk.y)/520,0,1):0;cam.z=damp(cam.z,1-ht*.26-clamp((Math.abs(vx)-480)/1600,0,.12),1.8,dt);
 if(Math.abs(vx)>520&&Math.random()<dt*20)G.parts.push({k:'line',x:V.R+20,y:V.T+Math.random()*(V.B-V.T),vx:-vx*1.6,l:40+Math.random()*60,t:0,life:.5});
 W.bgBase=damp(W.bgBase||0,groundAt(T,cam.x).y,1.2,dt);
 // lap
 if(sk.x>T.len&&sk.mode==='ground'){if(S&&S.combo.on)comboBank();sk.x=-260;sk.y=groundAt(T,sk.x).y;sk.ang=0;cam.x=sk.x+160;cam.y=sk.y-40;W.lap++;
  for(const b of T.pigeons){b.fly=0;b.x=b.hx;b.y=groundAt(T,b.hx).y;b.vx=b.vy=0}
  if(r&&W.race.st!=='won'){W.race.st='idle';r.x=T.raceStart+40;r.y=groundAt(T,r.x).y;r.mode='ground';r.s=0;r.idle=true}
  else if(r){r.x=T.raceEnd-200}
  const f=$('fade');f.style.transition='none';f.style.opacity='1';void f.offsetWidth;f.style.transition='opacity .5s';f.style.opacity='0';if(play)popup(sk.x+200,sk.y-120,'LAP '+W.lap,'#fff3df',26)}
 // timer
 if(play&&S.mode!=='tutorial'&&!S.over){const pt=S.time;S.time-=dt;if(pt>10&&S.time<=10)sfx.tick();if(S.time<10&&Math.floor(pt)!==Math.floor(S.time)&&S.time>0)sfx.tick();
  if(S.time<=0){if(pt>0){G.banner={txt:'TIME!',sub:'',t:0}}if((sk.mode==='ground'&&!sk.manual&&!S.combo.on)||S.time<-6){if(S.combo.on&&sk.mode!=='bail')comboBank();endSession()}}}
 if(play&&S.mode==='tutorial')tutUpdate(dt);
 // audio beds
 if(AC){const on=sk.mode==='ground'&&!G.paused,sp=Math.abs(sk.s);rollG.gain.setTargetAtTime(on&&play?clamp(sp/500,0,1)*(sk.manual?.12:.22):(G.state==='title'&&on?clamp(sp/500,0,1)*.08:0),AC.currentTime,.05);rollF.frequency.setTargetAtTime(250+sp*1.4,AC.currentTime,.05);
  grindG.gain.setTargetAtTime(sk.mode==='grind'&&play?.16:0,AC.currentTime,.03)}
}

 c.fillStyle=p.mid;c.fillRect(0,h*.7,w,h);c.fillStyle=p.g;c.beginPath();c.moveTo(0,h*.82);c.lineTo(w*.35,h*.82);c.lineTo(w*.35,h*.74);c.lineTo(w*.6,h*.74);c.lineTo(w*.6,h*.82);c.lineTo(w,h*.82);c.lineTo(w,h);c.lineTo(0,h);c.fill();
 c.strokeStyle=INK;c.lineWidth=2;c.stroke();c.fillStyle=p.gt;c.fillRect(0,h*.82+1,w*.35,3);c.fillRect(w*.6,h*.82+1,w*.4,3);
 c.strokeStyle='#d8d4e0';c.lineWidth=3;c.beginPath();c.moveTo(w*.66,h*.7);c.lineTo(w*.92,h*.7);c.stroke();c.strokeStyle=INK;c.lineWidth=1.5;c.stroke();}
function openSpots(){G.state='menu';showScr('sSpots');const cards=$('cards'),tg=totalGoals();$('spTitle').textContent=G.spotMode==='free'?'2-MIN SESSION':'SPOTS';

 else{gl.style.display='none';gs.innerHTML='<div class="chip">'+ICON.score+'BEST '+fmt(SV.free[sp.id]||0)+'</div><div class="chip">2:00 · NO GOALS · JUST LINES</div><button class="btn big" id="spGo" style="--bc:#ff8f6b;--r:-2">DROP IN</button>'}

 '<div class="row"><span class="chip">'+ICON.combo+'ONE LINE ≥ '+fmt(d.target)+'</span><span class="chip">'+ICON.cash+(paid?'PAID ✓':'$300')+'</span></div><div class="row" style="margin-top:8px"><span class="chip">'+ICON.score+'TODAY '+fmt(best)+'</span></div>'}

 [...$('tabs').children].forEach(el=>el.addEventListener('click',()=>{sfx.click();openGear(el.dataset.k)}));

   gearPreview(d.querySelector('canvas'),tab,i);
   d.addEventListener('click',()=>{if(own){SV.eq[tab]=i;save();sfx.click()}else if(SV.cash>=o.price){SV.cash-=o.price;SV.own[tab].push(i);SV.eq[tab]=i;save();sfx.buy()}else{sfx.bonk();d.animate([{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'none'}],{duration:200});return}openGear(tab)});it.appendChild(d)})}
 else if(tab==='stats'){it.style.display='block';const es=effStats();it.innerHTML='<div class="chip" style="margin-bottom:8px">'+ICON.score+'POINTS: '+SV.pts+'</div>'+['pop','speed','bal','spin'].map(k=>{const b=SV.stats[k],e=es[k];let p='';for(let i=1;i<=13;i++)p+='<i class="'+(i<=b?'on':i<=e?'bo':'')+'"></i>';
   return'<div class="stat"><span class="sn">'+({pop:'POP',speed:'SPEED',bal:'BALANCE',spin:'SPIN'})[k]+'</span><span class="pips">'+p+'</span><button class="btn sm" data-k="'+k+'" '+(SV.pts&&b<10?'':'disabled')+'>+</button></div>'}).join('')+'<div style="font:900 13px Impact,Arial Black;opacity:.6;margin-top:6px">GOALS GIVE ★ POINTS · GEAR ADDS BONUS</div>';
  it.querySelectorAll('button[data-k]').forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.k;if(SV.pts>0&&SV.stats[k]<10){SV.pts--;SV.stats[k]++;save();sfx.buy();openGear('stats')}}))}
 else{it.style.display='grid';it.style.gridTemplateColumns='repeat(auto-fill,minmax(200px,1fr))';const K={n:'',l:KA('l'),r:KA('r'),u:KA('u'),d:KA('d')};const rows=[];
  for(const[m,btnk]of[[FLIPMAP,'X'],[GRABMAP,'C'],[GRINDMAP,'RAIL']])for(const d of['n','l','r','u','d'])rows.push([m[d],(K[d]?'<span class="kk">'+K[d]+'</span>':'')+'<span class="kk">'+btnk+'</span>']);
  rows.push(['manual','<span class="kk">'+KA('d')+'</span>']);rows.push(['nmanual','<span class="kk">'+KA('u')+'</span>']);
  it.innerHTML=rows.map(([id,keys])=>{const ul=unlocked(id),got=SV.landed[id];return'<div class="tk'+(ul?'':' lk')+(got?' got':'')+'"><span class="keys">'+keys+'</span><span style="flex:1">'+TR[id].n+'</span>'+(ul?(got?ICON.check.replace('<svg','<svg width="18" height="18"'):''):'★'+unlockAt(id))+'</div>'}).join('')+
   SPECIALS.map(s=>{const ul=unlocked(s.id);return'<div class="tk'+(ul?'':' lk')+'" style="background:#fff6c8"><span class="keys">'+(s.dir!=='n'?'<span class="kk">'+K[s.dir]+'</span>':'')+'<span class="kk">X+C</span></span><span style="flex:1">'+s.n+'</span>'+(ul?ICON.special.replace('<svg','<svg width="18" height="18"'):'★'+unlockAt(s.id))+'</div>'}).join('')+
   '<div class="tk'+(unlocked('double')?'':' lk')+'"><span class="keys"><span class="kk">X</span><span class="kk">X</span></span><span style="flex:1">Double Flips</span>'+(unlocked('double')?'':'★'+unlockAt('double'))+'</div>'}
 if(tab!=='tricks')it.style.gridTemplateColumns=''}

 if(tab==='outfit'){const T={pts:[{x:-500,y:0},{x:500,y:0}]};const sk=newSkater(T,0,null,false);sk.t=1;for(let k=0;k<30;k++)computeRig(sk,1/60);c.translate(55,66);c.scale(.78,.78);drawSkater(c,sk.J,OUTFITS[i],BOARDS[SV.eq.board]||BOARDS[0],(WHEELS[SV.eq.wheel]||WHEELS[0]).c)}
 else{c.translate(55,40);c.scale(1.8,1.8);const bd=tab==='board'?BOARDS[i]:BOARDS[SV.eq.board]||BOARDS[0],wc=tab==='wheel'?WHEELS[i].c:(WHEELS[SV.eq.wheel]||WHEELS[0]).c;drawBoard(c,0,-4,0,0,1,bd,wc);drawBoard(c,0,10,0,-PI/2,1,bd,wc)}}

function tutArrow(){if(!TU.on||!TUTS[TU.i].arrow||!G.W)return;const sk=G.W.sk;let best=null;for(const r of G.W.T.rails)if(r.x1>sk.x+20&&(!best||r.x0<best.x0))best=r;if(!best)return;
 const x=Math.max(best.x0+30,Math.min(best.x1-20,sk.x+120)),y=railY(best,x)-46+Math.sin(G.W.t*8)*6,c=cx;c.beginPath();c.moveTo(x,y+18);c.lineTo(x-12,y);c.lineTo(x-5,y);c.lineTo(x-5,y-16);c.lineTo(x+5,y-16);c.lineTo(x+5,y);c.lineTo(x+12,y);c.closePath();c.fillStyle='#ffc94d';c.fill();c.strokeStyle=INK;c.lineWidth=3;c.stroke()}

 drawWorld(G.W,dt);layer(1,G.cam);tutArrow();

 if(G.state==='title'||G.state==='menu'){cx.setTransform(DPR,0,0,DPR,0,0);const g=cx.createLinearGradient(0,0,0,VH);g.addColorStop(0,'rgba(43,29,51,.15)');g.addColorStop(.5,'rgba(43,29,51,0)');g.addColorStop(1,'rgba(43,29,51,.3)');cx.fillStyle=g;cx.fillRect(0,0,VW,VH)}}

 musTick();let gdt=dt;
 if(G.state==='play'||G.state==='title'||G.state==='end'||G.state==='menu'){if(G.hit>0){G.hit-=dt;gdt=0}else if(G.slow>0){G.slow-=dt;gdt=dt*.4}
  if(gdt>0&&G.state!=='end')update(gdt)}else gdt=0;
 G.shake=Math.max(0,G.shake-dt*30);

updMute();goTitle();requestAnimationFrame(frame);

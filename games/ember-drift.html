{name:'FROST NEON',need:6,th:{bg:'#05122a',bg2:'#0a2142',dot:'#12345c',wall:'#29e5ff',sand:'#173a5e',curbA:'#29e5ff',curbB:'#e9fbff',track:'#1a2742',line:'#2f4a73',deco:'#6af3ff',deco2:'#c3a8ff',accent:'#49eaff'}},
{name:'VOID CORE',need:16,th:{bg:'#12041e',bg2:'#260a3a',dot:'#3a1556',wall:'#ff3fb4',sand:'#3a1550',curbA:'#ff3fb4',curbB:'#ffe0f4',track:'#24112f',line:'#47215c',deco:'#ff58c8',deco2:'#ffd04a',accent:'#ff5ac4'}}];

const TCP=[
[[0,0],[6,0],[8,1],[8,4],[6,5],[4,4],[2,5],[0,4],[-1,2]],
[[0,0],[3,-1],[6,0],[9,0],[10,2],[8,4],[5,3],[3,5],[0,4],[-1,2]],
[[0,0],[2,0],[3,1],[4,0],[6,0],[7,1],[8,0],[10,0],[10,3],[8,5],[6,4],[4,5],[2,4],[0,3]],

[[0,0],[4,0],[5,1],[4,2],[2,2],[1,3],[2,4],[6,4],[7,3],[7,0],[9,0],[10,2],[9,6],[0,6],[-1,3]],
[[0,0],[3,0],[4,1],[6,1],[7,0],[10,0],[11,2],[10,4],[8,3],[6,5],[4,3],[2,5],[0,4],[-1,2]],
[[0,0],[3,1],[5,-1],[7,1],[10,0],[9,3],[11,5],[8,6],[6,4],[4,6],[1,6],[2,3]],
[[0,0],[9,0],[10,1],[10,9],[9,10],[1,10],[0,9],[1,8],[7,8],[8,7],[7,6],[1,6],[0,5],[1,4],[7,4],[8,3],[7,2],[1,2],[-1,1]],
[[0,0],[2,1],[4,0],[6,1],[8,0],[10,1],[11,3],[9,4],[10,6],[8,7],[6,6],[4,7],[2,6],[0,7],[-1,5],[1,4],[-1,2]],
[[0,0],[5,0],[6,1],[5,2],[3,2],[2,3],[3,4],[8,4],[9,3],[8,2],[8,0],[11,0],[12,2],[11,4],[12,6],[10,8],[6,7],[4,8],[0,8],[-1,6],[1,5],[-1,3],[0,1.5]]];

const CARS=[
{name:'SPARK',col:'#ff8a3d',glow:'#ffb35c',cost:0,acc:540,maxV:520,turn:3.1,grip:7,dgrip:1.5,ember:1,boost:1,st:[3,3,3]},
{name:'WISP',col:'#4ff0ff',glow:'#a9fbff',cost:250,acc:620,maxV:505,turn:3.7,grip:10,dgrip:2.2,ember:0.95,boost:1,st:[2,5,3]},
{name:'BLAZE',col:'#ff3b5c',glow:'#ff8aa0',cost:600,acc:580,maxV:600,turn:3.0,grip:6,dgrip:1.2,ember:1.1,boost:1.1,st:[5,2,3]},
{name:'INFERNO',col:'#c66bff',glow:'#e8b8ff',cost:1200,acc:660,maxV:610,turn:3.35,grip:7,dgrip:1.3,ember:1.45,boost:1.3,st:[5,3,5]}];
const LAPS=3,STEP=1/120;
// ---------- track generation ----------
const tcache={};
function getTrack(id){if(tcache[id])return tcache[id];const d=TRACKS[id],cps=d.cp,N=cps.length;
// catmull-rom
const raw=[];for(let i=0;i<N;i++){const p0=cps[(i-1+N)%N],p1=cps[i],p2=cps[(i+1)%N],p3=cps[(i+2)%N];for(let s=0;s<40;s++){const t=s/40,t2=t*t,t3=t2*t;raw.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),0.5*((2*p1[1])+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)])}}
const Wd=d.w,margin=Wd+80;let S=240,pts;
for(let it=0;it<40;it++){pts=smoothC(resample(raw,S,22),22,margin);if(!overlaps(pts,22,margin))break;S*=1.07}
pts=resample(pts,1,10);const n=pts.length,ang=new Float32Array(n),cum=new Float32Array(n);
for(let i=0;i<n;i++){const a=pts[i],b=pts[(i+1)%n];ang[i]=Math.atan2(b[1]-a[1],b[0]-a[0]);if(i)cum[i]=cum[i-1]+10}
const path=new Path2D();path.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<n;i++)path.lineTo(pts[i][0],pts[i][1]);path.closePath();
let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;for(const p of pts){mnx=Math.min(mnx,p[0]);mny=Math.min(mny,p[1]);mxx=Math.max(mxx,p[0]);mxy=Math.max(mxy,p[1])}
// decorations
const deco=[],dr=rng(d.seed*3+1);let tries=0;while(deco.length<90&&tries<3000){tries++;const x=lerp(mnx-500,mxx+500,dr()),y=lerp(mny-500,mxy+500,dr());let md=1e9;for(let i=0;i<n;i+=3){const dx=pts[i][0]-x,dy=pts[i][1]-y,q=dx*dx+dy*dy;if(q<md)md=q}md=Math.sqrt(md);if(md<Wd/2+70)continue;deco.push({x,y,s:14+dr()*30,r:dr()*TAU,k:dr()<0.5?0:1,ph:dr()*TAU})}
const T={id,def:d,th:CUPS[d.cup].th,w:Wd,pts,ang,cum,n,len:n*10,path,box:[mnx,mny,mxx,mxy],deco,laps:n<700?4:n<1250?3:2};
tcache[id]=T;T.par=simBot(T);return T}
function smoothC(p,sp,m){const lim=1/(m*0.5);for(let it=0;it<200;it++){let bad=false;const n=p.length;const q=p.map(a=>a.slice());for(let i=0;i<n;i++){const a=p[(i-2+n)%n],b=p[i],c=p[(i+2)%n];const k=Math.abs(wrapA(Math.atan2(c[1]-b[1],c[0]-b[0])-Math.atan2(b[1]-a[1],b[0]-a[0])))/(2*sp);if(k>lim){bad=true;for(let j=-3;j<=3;j++){const ii=(i+j+n)%n,pp=p[(ii-1+n)%n],nn=p[(ii+1)%n];q[ii][0]=lerp(q[ii][0],(pp[0]+nn[0])/2,0.5);q[ii][1]=lerp(q[ii][1],(pp[1]+nn[1])/2,0.5)}}}p=resample(q.concat([]),1,sp);if(!bad)break}return p}
function resample(raw,S,sp){const out=[];let acc=0,prev=[raw[0][0]*S,raw[0][1]*S];out.push(prev);const M=raw.length;for(let i=1;i<=M;i++){const c=[raw[i%M][0]*S,raw[i%M][1]*S];let dx=c[0]-prev[0],dy=c[1]-prev[1],L=Math.hypot(dx,dy);while(acc+L>=sp){const t=(sp-acc)/L;const p=[prev[0]+dx*t,prev[1]+dy*t];out.push(p);prev=p;dx=c[0]-prev[0];dy=c[1]-prev[1];L=Math.hypot(dx,dy);acc=0}acc+=L;prev=c}
const l=out[out.length-1];if(Math.hypot(l[0]-out[0][0],l[1]-out[0][1])<sp*0.5)out.pop();return out}
function overlaps(p,sp,m){const n=p.length,skip=Math.ceil(m*1.9/sp),m2=m*m;for(let i=0;i<n;i++)for(let j=i+skip;j<n;j++){if(n-(j-i)<skip)continue;const dx=p[i][0]-p[j][0],dy=p[i][1]-p[j][1];if(dx*dx+dy*dy<m2)return true}

for(let i=0;i<n;i++){const a=p[(i-2+n)%n],b=p[i],c=p[(i+2)%n];const a1=Math.atan2(b[1]-a[1],b[0]-a[0]),a2=Math.atan2(c[1]-b[1],c[0]-b[0]);const k=Math.abs(wrapA(a2-a1))/(2*sp);if(k>1/(m*0.5))return true}return false}
// ---------- car physics ----------
function newCar(T,spec){const n=T.n,i=(n-4)%n,p=T.pts[i];return{x:p[0],y:p[1],a:T.ang[i],vx:0,vy:0,steer:0,drifting:false,ember:0,tier:0,boost:0,boostLvl:0,idx:i,prevIdx:i,d:0,off:false,spec,cp:0,lap:0,boosts:0,hitT:0,wrong:0,botD:false}}
function projCar(c,T,full){const n=T.n;let best=1e18,bi=c.idx;if(full){for(let i=0;i<n;i++){const dx=T.pts[i][0]-c.x,dy=T.pts[i][1]-c.y,q=dx*dx+dy*dy;if(q<best){best=q;bi=i}}}else for(let k=-30;k<=30;k++){const i=(c.idx+k+n)%n,dx=T.pts[i][0]-c.x,dy=T.pts[i][1]-c.y,q=dx*dx+dy*dy;if(q<best){best=q;bi=i}}
if(!full&&best>200*200)return projCar(c,T,true);c.prevIdx=c.idx;c.idx=bi;const a=T.ang[bi],p=T.pts[bi];c.d=(c.x-p[0])*-Math.sin(a)+(c.y-p[1])*Math.cos(a)}
function stepCar(c,inp,T,dt,ev){const S=c.spec;c.steer+=clamp(inp.steer-c.steer,-dt*9,dt*9);
let v=Math.hypot(c.vx,c.vy);const was=c.drifting;c.drifting=!!inp.drift&&v>110;
if(was&&!c.drifting){if(c.ember>0.2){c.boostLvl=c.tier;c.boost=(0.35+c.ember*1.25)*S.boost;c.boosts++;ev&&ev.push(['boost',c.tier])}c.ember=0;c.tier=0}
let fx=Math.cos(c.a),fy=Math.sin(c.a);let fwd0=c.vx*fx+c.vy*fy;
c.a+=c.steer*S.turn*clamp(v/170,0,1)*(c.drifting?1.5:1)*dt*(fwd0<-5?-1:1);
fx=Math.cos(c.a);fy=Math.sin(c.a);let fwd=c.vx*fx+c.vy*fy,lat=-c.vx*fy+c.vy*fx;
const bo=c.boost>0,maxV=S.maxV*(c.off?0.58:1)*(bo?1.32+c.boostLvl*0.06:1);
if(inp.brake)fwd-=S.acc*1.7*dt;else if(fwd<maxV)fwd+=S.acc*(bo?2:1)*dt*(1-clamp(fwd/maxV,0,1)*0.55);

fwd*=Math.exp(-(c.off?1.3:0.1)*dt);
c.vx=fwd*fx-lat*fy;c.vy=fwd*fy+lat*fx;c.x+=c.vx*dt;c.y+=c.vy*dt;if(c.boost>0)c.boost-=dt;
projCar(c,T,false);const lim=T.w/2+26;c.off=Math.abs(c.d)>T.w/2+3;
if(Math.abs(c.d)>lim){const a=T.ang[c.idx],nx=-Math.sin(a),ny=Math.cos(a),sg=Math.sign(c.d),pen=Math.abs(c.d)-lim;c.x-=nx*pen*sg;c.y-=ny*pen*sg;const vn=c.vx*nx+c.vy*ny;if(vn*sg>0){c.vx-=nx*vn*1.35;c.vy-=ny*vn*1.35;c.vx*=0.86;c.vy*=0.86;if(Math.abs(vn)>60&&c.hitT<=0){ev&&ev.push(['hit',Math.abs(vn)]);c.hitT=0.25}}c.d=sg*lim}
if(c.hitT>0)c.hitT-=dt;
// laps
const n=T.n;if(c.idx>n*0.45&&c.idx<n*0.55)c.cp=1;
if(c.prevIdx>n*0.8&&c.idx<n*0.2){if(c.cp){c.lap++;c.cp=0;ev&&ev.push(['lap'])}}
const tdot=Math.cos(T.ang[c.idx])*c.vx+Math.sin(T.ang[c.idx])*c.vy;c.wrong=tdot<-60?c.wrong+dt:0}
function botInput(c,T,skill){const n=T.n,v=Math.hypot(c.vx,c.vy),look=7+(v*0.22/10|0),tg=T.pts[(c.idx+look)%n];
const des=Math.atan2(tg[1]-c.y,tg[0]-c.x),df=wrapA(des-c.a);const t1=T.ang[(c.idx+5)%n],t2=T.ang[(c.idx+5+28)%n],cv=Math.abs(wrapA(t2-t1));

function simBot(T){const c=newCar(T,CARS[0]);let t=0;while(c.lap<T.laps&&t<400){stepCar(c,botInput(c,T,1),T,STEP,null);t+=STEP}return t}
function medalTimes(T){const p=T.par;return[p*1.36,p*1.18,p*1.05]}
function medalPoints(){let s=0;for(const k in save.medal)s+=save.medal[k];return s}
function cupOpen(c){return medalPoints()>=CUPS[c].need}
function trackOpen(id){const d=TRACKS[id];if(!cupOpen(d.cup))return false;return d.i===0||(save.medal[id-1]||0)>=1}
// ---------- state ----------
let state='title',paused=false,shake=0,flash=0,time=0;

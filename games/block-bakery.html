function seatsLayout(){L.seatR=[];if(!G)return;const n=G.seats.length,R=L.counter;
 for(let i=0;i<n;i++){
  if(L.land){const rh=R.h/3;const y0=R.y+i*rh+(3-n)*rh/2;const hs=Math.min(rh*0.5,R.w*0.26);const ss=Math.min((R.w-hs*1.6-34)/3,rh*0.4,58);

   L.seatR.push({hx:x0+cw/2,hy:R.y+R.h-hs*0.55,hs,bx:x0+8,by:R.y+4,bw:cw-16,bh:ss*1.35,ss,horiz:false})}}}
function trySpawnCustomer(dt){if(G.end)return;const li=G.li;G.spawnT-=dt;if(G.spawnT>0)return;
 const idx=G.seats.findIndex(s=>!s);if(idx<0)return;if(G.arrived>=li.customers)return;
 G.seats[idx]=newCustomer();G.arrived++;G.spawnT=G.endless?Math.max(1.5,4-G.served*0.06):2.2;}
function findSlot(f,t){for(let i=0;i<G.seats.length;i++){const c=G.seats[i];if(!c||c.state!=='wait')continue;for(const s of c.slots)if(!s.done&&s.f===f&&s.t===t)return[i,s]}return null}

 if(seatIdx!=null){const c=G.seats[seatIdx];if(c&&c.state==='wait'){const s=c.slots.find(s=>!s.done&&s.f===item.f&&s.t===item.t);if(s)m=[seatIdx,s]}}

 const [i,s]=m;s.done=true;G.delivered=(G.delivered||0)+1;const sr=L.seatR[i];flyers.push({x:fromX,y:fromY,tx:sr.hx,ty:sr.hy,f:item.f,t:item.t,life:0,dur:0.35});

 if(c.slots.every(z=>z.done)){c.state='happy';c.a=0;let p=c.slots.reduce((a,z)=>a+pay(z.t),0);if(c.patMax&&c.pat/c.patMax>0.5)p=Math.round(p*1.25);

function updatePlay(dt){

 for(let i=0;i<G.seats.length;i++){const c=G.seats[i];if(!c)continue;c.a+=dt;c.blinkT-=dt;if(c.blinkT<-0.15)c.blinkT=2+Math.random()*3;

 for(let r=0;r<6;r++)for(let cc=0;cc<6;cc++){const it=G.grid[r][cc];if(!it)continue;it.sc+=(1-it.sc)*Math.min(1,dt*14);if(it.dy<0){it.vy+=3200*dt;it.dy+=it.vy*dt;if(it.dy>=0){it.dy=0;it.vy=0;it.sc=0.8}}if(it.wob>0)it.wob=Math.max(0,it.wob-dt*3)}

function dropOn(sr,sc,tr,tc){const a=G.grid[sr][sc],b=G.grid[tr][tc];if(sr===tr&&sc===tc)return;

function pt(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}

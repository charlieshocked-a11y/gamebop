<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Knight Quest</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1c1630;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr.on{display:flex}
.scr *{pointer-events:auto}
.title{font-size:min(15vw,112px);font-weight:900;letter-spacing:.02em;line-height:.9;text-align:center;color:#fff6d8;text-shadow:0 .06em 0 #b8742a,0 .12em 0 #6b3a14,0 .2em .3em rgba(0,0,0,.5);transform:rotate(-3deg)}
.title span{display:block;color:#ffd04a;text-shadow:0 .06em 0 #d2561e,0 .12em 0 #7a2410,0 .2em .3em rgba(0,0,0,.5)}
.btn{font:inherit;font-weight:800;border:0;border-radius:16px;padding:14px 34px;font-size:24px;color:#3a1d05;background:linear-gradient(#ffe27a,#f5a623);box-shadow:0 6px 0 #a35f0c,0 10px 20px rgba(0,0,0,.35);cursor:pointer;transition:transform .08s;margin:6px}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #a35f0c}
.btn.alt{background:linear-gradient(#fff,#d8d2ee);color:#33285a;box-shadow:0 6px 0 #8a80b5,0 10px 20px rgba(0,0,0,.3)}
.btn.sm{font-size:18px;padding:10px 22px}
.ib{width:46px;height:46px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:22px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25)}
.ib:hover{background:rgba(255,255,255,.24)}
.ib svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ib .badge{position:absolute;top:-6px;right:-6px;background:#ffcf3a;color:#3a1d05;border-radius:10px;font-size:12px;padding:1px 6px;font-weight:900}
#hud{position:fixed;top:0;left:0;right:0;height:64px;display:none;align-items:center;gap:8px;padding:9px 12px;justify-content:space-between}
#hud.on{display:flex}
#hud .mid{flex:1;display:flex;flex-direction:column;align-items:center;line-height:1.1}
#lvlName{font-weight:900;font-size:18px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
#moves{font-size:14px;opacity:.95;white-space:nowrap}
.grp{display:flex;gap:6px}
#tip{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:13px;opacity:.6;display:none;pointer-events:none}
.cards{display:grid;grid-template-columns:repeat(5,minmax(0,170px));gap:14px;padding:0 16px;max-width:100%}
.card{border-radius:20px;padding:16px 10px 12px;text-align:center;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25),0 14px 30px rgba(0,0,0,.3);transition:transform .12s;position:relative;color:#fff}
.card:hover{transform:translateY(-4px)}
.card .ico{height:74px;display:flex;align-items:center;justify-content:center}
.card .nm{font-weight:900;font-size:17px;margin-top:6px;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.card .st{font-size:15px;margin-top:4px;opacity:.95}
.card.lock{filter:grayscale(.9) brightness(.6);cursor:default}
.card.lock:hover{transform:none}
.lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:40px}
.h2{font-size:min(9vw,48px);font-weight:900;margin-bottom:18px;text-shadow:0 4px 0 rgba(0,0,0,.3)}
.lgrid{display:grid;grid-template-columns:repeat(5,64px);gap:12px}
.lb{width:64px;height:72px;border-radius:16px;border:0;font:inherit;font-weight:900;font-size:24px;color:#3a2a10;background:linear-gradient(#fff8e2,#f0d9a0);box-shadow:0 5px 0 #b08b48;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.lb small{font-size:11px;letter-spacing:1px;color:#e09a12}
.lb.lock{background:#5a5270;box-shadow:0 5px 0 #3a3450;color:#8b84a5;cursor:default}
.lb.cur{outline:4px solid #ffd04a;animation:pulse 1s infinite alternate}
@keyframes pulse{to{outline-color:#fff}}
.panel{background:linear-gradient(#fffaf0,#f3e3c0);color:#3a2a10;border-radius:26px;padding:24px 30px;text-align:center;box-shadow:0 10px 0 #b08b48,0 20px 50px rgba(0,0,0,.5);animation:pop .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.panel h3{font-size:34px;font-weight:900;margin-bottom:6px}
.stars{font-size:54px;letter-spacing:6px;margin:4px 0 8px}
.stars i{font-style:normal;display:inline-block;color:#d8c9a5;transform:scale(0);animation:star .4s forwards}
.stars i.on{color:#ffbf1a;text-shadow:0 3px 0 #c27a00}
@keyframes star{60%{transform:scale(1.4)}to{transform:scale(1)}}
.row{display:flex;justify-content:center;flex-wrap:wrap}
.dim{position:fixed;inset:0;background:rgba(15,10,30,.55)}
.sub{font-size:16px;opacity:.75;margin-bottom:10px}
#muteT{position:fixed;top:12px;right:12px;z-index:5}
@media (max-width:760px){.cards{grid-template-columns:repeat(3,minmax(0,120px));gap:10px}.card .ico{height:54px}.card .nm{font-size:14px}.card{padding:10px 6px}.lgrid{grid-template-columns:repeat(5,56px);gap:9px}.lb{width:56px;height:64px;font-size:20px}}
@media (max-height:520px){.title{font-size:min(12vw,80px)}.card .ico{height:48px}}
</style>
</head>

  <div class="title">KNIGHT<span>QUEST</span></div>
  <div style="height:5vh"></div>
  <div class="row"><button class="btn" id="bPlay">▶ Play</button></div>
  <div style="margin-top:14px;font-size:14px;background:rgba(40,10,50,.55);padding:6px 14px;border-radius:20px">Hop in L-shapes · grab every gem · reach the gate</div>
</div>

<div id="sMap" class="scr">
  <div class="h2">Castles</div>
  <div class="cards" id="cards"></div>
  <div class="row" style="margin-top:22px"><button class="btn alt sm" id="bMapBack">◀ Title</button></div>
</div>

<div id="sLevels" class="scr">
  <div class="h2" id="castleName">Castle</div>
  <div class="lgrid" id="lgrid"></div>
  <div class="row" style="margin-top:22px"><button class="btn alt sm" id="bLvBack">◀ Castles</button></div>
</div>

<div id="hud">
  <div class="grp"><button class="ib" id="bBack" title="Menu"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button></div>
  <div class="mid"><div id="lvlName">1-1</div><div id="moves">0 moves</div></div>
  <div class="grp">
    <button class="ib" id="bHint" title="Hint (H)"><svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg><span class="badge" id="hintN">3</span></button>

    <button class="ib" id="bReset" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></button>
  <div style="width:46px"></div></div>
</div>
<button class="ib" id="muteT" title="Sound (M)"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
<div id="tip">Click a glowing square · Z undo · R restart · H hint</div>

<div id="sOver" class="scr"><div class="dim"></div><div class="panel" id="panel" style="position:relative"></div></div>

"use strict";
// Knight Quest rules engine (shared by generator and game)
// Legend: . floor  # wall  _ hole  K knight  G gem  E exit  C crumble  R rook  B bishop  Q queen

var KQ = (function () {
  var KM = [[1, 2], [2, 1], [2, -1], [1, -2], [-1, -2], [-2, -1], [-2, 1], [-1, 2]];

      if (c === 'E') L.exit = i;
      if (c === 'G') L.gems.push(i);

    }
    for (var k in tps) if (tps[k].length === 2) { L.tp[tps[k][0]] = tps[k][1]; L.tp[tps[k][1]] = tps[k][0]; }
    return L;
  }
  function init(L) { return { p: L.start, g: 0, c: 0, k: 0, e: 0 }; }
  function key(s) { return s.p + 64 * (s.g + 256 * (s.k + 4 * (s.e + 16 * s.c))); }
  function keyHeld(L, s, col) { for (var i = 0; i < L.keys.length; i++) if (L.keys[i].c === col && (s.k >> i & 1)) return true; return false; }
  function blocked(L, s, i) { // blocks lines of sight / landing
    var t = L.cell[i];
    if (t === 'w') return true;
    if ((t === 'X' || t === 'Y') && !keyHeld(L, s, t)) return true;
    return false;
  }
  function enemyAt(L, s, i) { for (var j = 0; j < L.en.length; j++) if (!(s.e >> j & 1) && L.en[j].p === i) return j; return -1; }
  function attackers(L, s, target) { // list of enemy indices attacking target
    var out = [];
    for (var j = 0; j < L.en.length; j++) {
      if (s.e >> j & 1) continue;
      var e = L.en[j], ex = e.p % L.W, ey = (e.p / L.W) | 0;
      if (e.p === target) continue;
      var dirs = e.t === 'R' ? RD : e.t === 'B' ? BD : RD.concat(BD);

        var x = ex + dirs[d][0], y = ey + dirs[d][1], hit = false;
        while (x >= 0 && y >= 0 && x < L.W && y < L.H) {
          var i = y * L.W + x;
          if (i === target) { hit = true; break; }
          if (blocked(L, s, i) || enemyAt(L, s, i) >= 0) break;
          x += dirs[d][0]; y += dirs[d][1];
        }
        if (hit) { out.push(j); break; }
      }
    }
    return out;
  }
  function crumbIdx(L, i) { return L.crumb.indexOf(i); }
  function landable(L, s, i) {
    var t = L.cell[i];
    if (t === 'w' || t === 'h') return false;
    if (t === 'c' && (s.c >> crumbIdx(L, i) & 1)) return false;
    if ((t === 'X' || t === 'Y') && !keyHeld(L, s, t)) return false;
    return true;
  }
  // returns list of {to, s (new state), dead, win, tele, cap, gem, keyGot}
  function moves(L, s) {
    var out = [], px = s.p % L.W, py = (s.p / L.W) | 0;
    for (var m = 0; m < 8; m++) {
      var x = px + KM[m][0], y = py + KM[m][1];
      if (x < 0 || y < 0 || x >= L.W || y >= L.H) continue;
      var i = y * L.W + x;
      if (!landable(L, s, i)) continue;
      out.push(apply(L, s, i));

    return out;
  }
  function apply(L, s, i) {
    var n = { p: i, g: s.g, c: s.c, k: s.k, e: s.e }, r = { from: s.p, to: i, land: i, s: n, dead: false, win: false, tele: -1, cap: -1, gem: -1, keyGot: -1, crumbled: -1 };

    var gi = L.gems.indexOf(i); if (gi >= 0 && !(n.g >> gi & 1)) { n.g |= 1 << gi; r.gem = gi; }
    for (var q = 0; q < L.keys.length; q++) if (L.keys[q].p === i && !(n.k >> q & 1)) { n.k |= 1 << q; r.keyGot = q; }
    if (L.tp[i] !== undefined) {
      var j = L.tp[i];
      if (landable(L, n, j) && enemyAt(L, n, j) < 0) { n.p = j; r.tele = j; r.to = j;
        var gj = L.gems.indexOf(j); if (gj >= 0 && !(n.g >> gj & 1)) { n.g |= 1 << gj; r.gem2 = gj; }
      }
    }
    var att = attackers(L, n, n.p);
    if (att.length) { r.dead = true; r.by = att; }
    if (!r.dead && n.p === L.exit && n.g === (1 << L.gems.length) - 1) r.win = true;
    return r;
  }
  function solve(L, s0, limit) {
    s0 = s0 || init(L); limit = limit || 400000;
    var q = [s0], prev = new Map(), k0 = key(s0); prev.set(k0, null);
    var head = 0;
    while (head < q.length) {
      var s = q[head++];
      var ms = moves(L, s);

        var m = ms[i]; if (m.dead) continue;
        var k = key(m.s); if (prev.has(k)) continue;
        prev.set(k, { s: s, to: m.land });
        if (m.win) { // rebuild
          var path = [m.land], cur = s;
          while (true) { var pr = prev.get(key(cur)); if (!pr) break; path.unshift(pr.to); cur = pr.s; }
          return { len: path.length, path: path, explored: prev.size };
        }
        q.push(m.s);
        if (prev.size > limit) return null;
      }
    }
    return { len: -1, explored: prev.size };
  }
  return { parse: parse, init: init, moves: moves, apply: apply, attackers: attackers, solve: solve, key: key, landable: landable, keyHeld: keyHeld, enemyAt: enemyAt, KM: KM };
})();

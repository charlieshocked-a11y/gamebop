<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Letter Lattice</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0f3b47;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;color:#fff;user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.scr.on{display:flex}.scr>*{pointer-events:auto}
.btn{font:inherit;font-weight:900;border:0;border-radius:16px;padding:14px 36px;font-size:24px;color:#3a2200;background:linear-gradient(#ffe48a,#ffb23a);box-shadow:0 6px 0 #b8741a,0 10px 22px rgba(0,0,0,.3);cursor:pointer;margin:6px;transition:transform .08s}
.btn:hover{transform:translateY(-2px) scale(1.03)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b8741a}
.btn.alt{background:linear-gradient(#fffaf0,#e3d9c4);color:#2a4a52;box-shadow:0 6px 0 #9a8f78,0 10px 22px rgba(0,0,0,.25)}
.btn.teal{background:linear-gradient(#8ff0e0,#3cc8b4);color:#08343a;box-shadow:0 6px 0 #1f8a7a,0 10px 22px rgba(0,0,0,.25)}
.btn.sm{font-size:17px;padding:9px 20px}
.ib{width:44px;height:44px;border-radius:14px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-weight:900}
.ib svg{width:22px;height:22px;fill:none;stroke:#fff;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#mute{position:fixed;top:10px;right:12px;z-index:9}
.h2{font-size:min(9vw,44px);font-weight:900;margin-bottom:12px;text-shadow:0 4px 0 rgba(0,0,0,.25)}
.lg{display:grid;grid-template-columns:repeat(8,58px);gap:9px;max-height:64vh;overflow-y:auto;padding:6px;touch-action:pan-y}
.lb{width:58px;height:62px;border-radius:14px;border:0;font:inherit;font-weight:900;font-size:21px;color:#2a3a3a;background:linear-gradient(#fffaf0,#efe2c4);box-shadow:0 5px 0 #a8946a;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.lb small{font-size:10px;color:#e0961a;letter-spacing:1px}
.lb.six{background:linear-gradient(#e6fff9,#bfeee4);box-shadow:0 5px 0 #6ab0a2}
.lb.lock{background:#2c5a63;box-shadow:0 5px 0 #1a3a42;color:#6f9aa2;cursor:default}
.lb.cur{outline:3px solid #ffd23a}
#hud{position:fixed;top:0;left:0;right:0;display:none;align-items:center;gap:10px;padding:10px 12px;pointer-events:none}
#hud.on{display:flex}#hud>*{pointer-events:auto}
.sbox{flex:1;max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:5px;padding-right:50px}
.srow{display:flex;align-items:baseline;gap:8px;justify-content:center}
#score{font-size:30px;font-weight:900;text-shadow:0 3px 0 rgba(0,0,0,.25)}
#target{font-size:15px;opacity:.85;font-weight:900}
#tbar{height:12px;border-radius:7px;background:rgba(0,0,0,.25);overflow:hidden;position:relative}
#tfill{height:100%;background:linear-gradient(90deg,#3cc8b4,#8ff0e0);border-radius:7px}
#tbar .mk{position:absolute;top:0;bottom:0;width:3px;background:#ffd23a}
#time{font-size:20px;font-weight:900;min-width:52px;text-align:center}
.dim{position:fixed;inset:0;background:rgba(4,24,30,.6)}
.panel{position:relative;background:linear-gradient(#fffaf0,#efe4cc);color:#2a3a3a;border-radius:26px;padding:22px 28px;text-align:center;box-shadow:0 10px 0 #a8946a,0 20px 50px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.6,.4,1);max-width:94vw}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.panel h3{font-size:30px;font-weight:900}
.stars{font-size:50px;letter-spacing:6px}.stars i{font-style:normal;color:#d8cba8;display:inline-block;animation:st .4s backwards}.stars i.on{color:#ffb21a;text-shadow:0 3px 0 #c27a00}
@keyframes st{from{transform:scale(0)}60%{transform:scale(1.4)}}
.big{font-size:44px;font-weight:900;color:#e08a1e}
.sub{opacity:.7;font-size:15px;margin:2px 0 8px}
.chip{display:inline-block;background:#2a6a72;color:#fff;border-radius:10px;padding:2px 9px;margin:2px;font-weight:900;font-size:14px;letter-spacing:.06em}
#tools{position:fixed;bottom:12px;left:0;right:0;display:none;justify-content:center;gap:10px;pointer-events:none}
#tools.on{display:flex}#tools>*{pointer-events:auto}
.tt{font-size:13px;opacity:.7;position:fixed;bottom:66px;left:0;right:0;text-align:center;pointer-events:none;display:none}
.sup{position:fixed;right:calc(10px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));font-size:11.5px;font-weight:700;color:#fffaf0;opacity:.55;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.4);transition:opacity .15s}
.sup:hover{opacity:1}
@media (max-width:600px){.lg{grid-template-columns:repeat(5,54px);gap:8px}.lb{width:54px;height:58px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="sTitle" class="scr on">
  <div style="height:min(46vh,330px)"></div>
  <div style="display:flex;flex-wrap:wrap;justify-content:center"><button class="btn" id="bPlay">▶ Play</button><button class="btn teal" id="bDaily">📅 Daily</button></div>
  <button class="btn alt sm" id="bHow">? How to play</button>
  <div style="margin-top:12px;font-size:14px;opacity:.85">Drag through letters · longer words score big</div>
  <a class="sup" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>
<div id="sLevels" class="scr"><div class="h2">Levels</div><div class="lg" id="lg"></div><div style="margin-top:12px"><button class="btn alt sm" id="bLB">◀</button></div></div>
<div id="hud"><button class="ib" id="bPause"><svg viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></svg></button><div class="sbox"><div class="srow"><span id="lvl" class="chip">1</span><span id="score">0</span><span id="target">/ 100</span><span id="time">90</span></div><div id="tbar"><div id="tfill"></div></div></div></div>
<div id="tools"><button class="btn alt sm" id="bShuf" title="Shuffle (−5s)">🔀 −5s</button></div>
<div class="tt" id="tt">Drag or type · Enter to submit</div>
<button class="ib" id="mute"><svg viewBox="0 0 24 24" id="muteIco"></svg></button>
<div id="sOver" class="scr"><div class="dim"></div><div class="panel" id="panel"></div></div>

<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Rune Match</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#160c2c;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS','Segoe UI',Verdana,system-ui,sans-serif;color:#fff}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;text-align:center;padding:16px;box-sizing:border-box}
.ov.on{display:flex}
.dim{background:rgba(12,6,28,.74);backdrop-filter:blur(3px)}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.85;animation:bob 2.6s ease-in-out infinite;margin-bottom:14px}
.logo span{font-weight:900;font-size:clamp(60px,15vw,136px);letter-spacing:.03em;background:linear-gradient(180deg,#fff7d6 0%,#ffd45a 40%,#ff8a3a 75%,#e8466a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #6a2a12) drop-shadow(0 8px 0 #2a0c20) drop-shadow(0 0 24px rgba(255,170,60,.5))}
.logo span.l2{background:linear-gradient(180deg,#f0fff8 0%,#7dffcf 40%,#33c8ff 75%,#6a5cff 100%);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 4px 0 #13306a) drop-shadow(0 8px 0 #0a0c2a) drop-shadow(0 0 24px rgba(80,220,255,.5))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-8px) rotate(1deg)}}
.btn{font:inherit;font-weight:900;color:#fff;border:0;border-radius:16px;padding:12px 26px;font-size:20px;cursor:pointer;background:linear-gradient(180deg,#ffb84a,#f0742a);box-shadow:0 5px 0 #8a3a10,0 8px 18px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(0,0,0,.25);letter-spacing:.04em;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3a10}
.btn.big{font-size:28px;padding:14px 44px;min-width:220px}
.btn.gn{background:linear-gradient(180deg,#7dffb0,#22b86a);box-shadow:0 5px 0 #0e6a38,0 8px 18px rgba(0,0,0,.35)}
.btn.gy{background:linear-gradient(180deg,#7a6aa8,#4e3f80);box-shadow:0 5px 0 #2a2050}
.btn.sm{font-size:15px;padding:8px 14px;border-radius:12px}
.btn[disabled]{filter:grayscale(1);opacity:.55}
.btns{display:flex;flex-direction:column;gap:14px;align-items:center}
.hint{opacity:.75;font-size:14px;letter-spacing:.04em}
.corner{position:fixed;top:8px;right:8px;z-index:8;display:flex;gap:8px}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:rgba(0,0,0,.35);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.ib svg{width:24px;height:24px}
h2{margin:0;font-size:clamp(36px,8vw,60px);font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#fff,#ffd45a 60%,#ff8a3a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #5a2a12)}
#map{padding:0;justify-content:flex-start}
#mapScroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#mapInner{position:relative;width:100%;max-width:560px;margin:0 auto}
.node{position:absolute;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;border:0;font:inherit;font-weight:900;font-size:22px;color:#fff;cursor:pointer;background:radial-gradient(circle at 35% 30%,#fff6 0,#0000 40%),linear-gradient(180deg,#ffb84a,#e0602a);box-shadow:0 5px 0 #7a2a10,0 0 0 4px #fff3;text-shadow:0 2px 0 #0005}
.node.done{background:radial-gradient(circle at 35% 30%,#fff6 0,#0000 40%),linear-gradient(180deg,#7dffb0,#1aa860);box-shadow:0 5px 0 #0c5a30,0 0 0 4px #fff3}
.node.lock{background:linear-gradient(180deg,#5a5070,#3a3050);box-shadow:0 5px 0 #201830;color:#fff6;cursor:default}
.node.boss{width:80px;height:80px;margin:-40px 0 0 -40px;font-size:15px}
.node.cur{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12);box-shadow:0 5px 0 #7a2a10,0 0 0 8px #ffd45a88}}
.stars{position:absolute;left:50%;top:-14px;transform:translateX(-50%);font-size:14px;letter-spacing:-1px;white-space:nowrap;color:#ffd45a;text-shadow:0 1px 2px #000}
.bar{position:fixed;top:0;left:0;right:0;z-index:7;display:flex;gap:10px;align-items:center;padding:8px 110px 8px 10px;background:linear-gradient(180deg,rgba(10,6,24,.9),rgba(10,6,24,0));pointer-events:none}
.bar>*{pointer-events:auto}
.pill{background:rgba(0,0,0,.45);border-radius:20px;padding:6px 14px;font-weight:900;font-size:18px;display:flex;align-items:center;gap:6px}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff7b0,#ffc81a 50%,#c88a00);box-shadow:0 0 6px #ffcf3a}
#hero{justify-content:flex-start;overflow-y:auto;padding-top:60px;gap:10px}
.panel{background:rgba(255,255,255,.06);border-radius:18px;padding:10px;max-width:560px;width:100%;box-sizing:border-box}
.uprow{display:flex;align-items:center;gap:10px;padding:6px}
.uprow canvas{width:40px;height:40px}
.pips{display:flex;gap:4px;flex:1}
.pips u{flex:1;max-width:22px;height:10px;border-radius:5px;background:rgba(255,255,255,.15);display:block}
.pips u.f{background:#ffd45a}
.relics{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.relic{aspect-ratio:1;border-radius:14px;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 0 0 2px rgba(255,255,255,.08) inset}
.relic canvas{width:80%;height:80%}
.relic.eq{box-shadow:0 0 0 3px #7dffb0 inset,0 0 12px #7dffb088}
.relic .pr{position:absolute;bottom:2px;left:0;right:0;font-size:11px;font-weight:900;color:#ffd45a}
.relic.lock canvas{filter:brightness(0) opacity(.5)}
.slots{display:flex;gap:10px;justify-content:center;margin-bottom:8px}
.slot{width:58px;height:58px;border-radius:14px;border:2px dashed rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center}
.slot canvas{width:46px;height:46px}
.tip{min-height:20px;font-size:14px;opacity:.85}
.lv{font-size:22px;font-weight:900}
.xpbar{height:10px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin:4px 0 0}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#7dffcf,#33c8ff)}
.res{display:flex;gap:14px;font-size:22px;font-weight:900;flex-wrap:wrap;justify-content:center}
.res div{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.08);padding:8px 14px;border-radius:12px}
.bigstars{font-size:54px;letter-spacing:6px;color:#ffd45a;text-shadow:0 3px 0 #8a5a00,0 0 18px #ffd45a88}
.bigstars s{text-decoration:none;color:#ffffff22;text-shadow:none}
</style></head><body>
<canvas id="c"></canvas>
<div class="corner"><button class="ib" id="bPause" style="display:none" aria-label="pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="5" y="4" width="5" height="16" rx="1.5"/><rect x="14" y="4" width="5" height="16" rx="1.5"/></svg></button><button class="ib" id="bMute" aria-label="mute"></button></div>

<div id="title" class="ov on" style="background:radial-gradient(ellipse at center,rgba(12,6,30,.6) 0,rgba(12,6,30,.25) 55%,transparent 80%)">
 <div class="logo"><span>RUNE</span><span class="l2">MATCH</span></div>
 <div class="btns"><button class="btn big gn" id="bCont">CONTINUE</button><button class="btn big" id="bPlay">PLAY</button></div>
 <div class="hint">Swap runes · match 3+ · defeat monsters</div>
</div>

<div id="map" class="ov">
 <div id="mapScroll"><div id="mapInner"></div></div>
 <div class="bar"><div class="pill"><span class="coin"></span><span id="mGold">0</span></div><div class="pill" id="mLv">Lv 1</div><button class="btn sm" id="bHero">HERO</button></div>
</div>

<div id="hero" class="ov dim">
 <div class="bar"><div class="pill"><span class="coin"></span><span id="hGold">0</span></div><button class="btn sm gy" id="hBack">BACK</button></div>
 <div class="panel"><div class="lv" id="hLv">Lv 1</div><div class="xpbar"><i id="hXp"></i></div><div style="opacity:.8;margin-top:6px;font-weight:900" id="hStats"></div></div>
 <div class="panel" id="upPanel"></div>
 <div class="panel"><div class="slots" id="slots"></div><div class="relics" id="relics"></div><div class="tip" id="tip"></div></div>
</div>

<div id="win" class="ov dim">
 <h2 id="winT">VICTORY!</h2>
 <div class="bigstars" id="winStars"></div>
 <div class="res" id="winRes"></div>
 <div class="btns" style="flex-direction:row;flex-wrap:wrap;justify-content:center"><button class="btn gy" id="wMap">MAP</button><button class="btn gn big" id="wNext">NEXT</button></div>
</div>
<div id="lose" class="ov dim">
 <h2>DEFEATED</h2>
 <div class="res" id="loseRes"></div>
 <div class="btns" style="flex-direction:row;flex-wrap:wrap;justify-content:center"><button class="btn gy" id="lMap">MAP</button><button class="btn gn big" id="lRetry">RETRY</button></div>
</div>
<div id="pause" class="ov dim">
 <h2>PAUSED</h2>
 <div class="btns"><button class="btn gn big" id="pRes">RESUME</button><button class="btn gy" id="pMap">MAP</button></div>
</div>

<script>
'use strict';
const SLUG='rune-match';
const S={k:k=>'gamebop.'+SLUG+'.'+k,
 get(k,d){try{const v=localStorage.getItem(this.k(k));return v==null?d:JSON.parse(v)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(this.k(k),JSON.stringify(v))}catch(e){}}};
const A={c:null,m:null,nb:null,muted:!!S.get('muted',false),
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.42;this.m.connect(this.c.destination)}catch(e){this.c=null}},
 mute(v){this.muted=v;S.set('muted',v);if(this.m)this.m.gain.value=v?0:.42;drawMute()},
 t(f,d,type,vol,slide,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+d+.03)}catch(e){}},
 n(d,vol,freq,delay,hp){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0);if(!this.nb){const L=c.sampleRate;this.nb=c.createBuffer(1,L,L);const a=this.nb.getChannelData(0);for(let i=0;i<L;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=hp?'highpass':'lowpass';f.frequency.value=freq||2000;const g=c.createGain();g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+d+.03)}catch(e){}}};
const NOTES=[523,587,659,784,880,1046,1175,1318,1568,1760];
const SFX={
 swap(){A.t(500,.06,'triangle',.1,1.4)},
 bad(){A.t(200,.12,'square',.08,.7)},
 match(k){const f=NOTES[Math.min(k,9)];A.t(f,.12,'triangle',.14);A.t(f*1.5,.1,'sine',.06,1,.03)},
 special(){A.t(300,.3,'sawtooth',.08,3);A.n(.25,.12,4000,0,1)},
 slash(){A.n(.15,.25,3000,0,1);A.t(900,.08,'sawtooth',.06,.4)},
 fire(){A.n(.35,.25,900);A.t(160,.3,'sawtooth',.08,.5)},
 ice(){[1800,2200,2600].forEach((f,i)=>A.t(f,.12,'sine',.06,.8,i*.04))},
 heal(){[660,880,1100].forEach((f,i)=>A.t(f,.14,'sine',.08,1.1,i*.06))},
 shield(){A.t(320,.25,'triangle',.12,1.6)},
 hurt(){A.n(.25,.3,700);A.t(120,.25,'square',.12,.5)},
 mhit(){A.t(140,.12,'square',.12,.6);A.n(.1,.15,1500)},
 win(){[523,659,784,1046,784,1046,1318].forEach((f,i)=>A.t(f,.18,'square',.07,1,i*.09))},
 lose(){[392,330,262,196].forEach((f,i)=>A.t(f,.3,'triangle',.12,1,i*.16))},
 click(){A.t(880,.05,'square',.06,1.3)},
 coin(){A.t(1400,.06,'square',.05,1.2);A.t(2100,.08,'square',.04,1,.05)},
 tick(){A.t(1200,.04,'square',.04)}};

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a),ease=t=>1-Math.pow(1-t,3);
function rng(seed){let s=(seed>>>0)||1;const f=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296};f.pick=a=>a[Math.floor(f()*a.length)];return f}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function shade(hex,amt){let c=hex.replace('#','');if(c.length===3)c=c.split('').map(x=>x+x).join('');let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);const f=amt<0?0:255,t=Math.abs(amt);return'rgb('+Math.round(lerp(r,f,t))+','+Math.round(lerp(g,f,t))+','+Math.round(lerp(b,f,t))+')'}

/* ---------- data ---------- */
const N=8,TYPES=5,STONE=5;
const RC=['#ff4a5a','#ff9a2a','#3ad0ff','#4ae08a','#ffd23a'];
const RN=['sword','fire','ice','heal','shield'];
const REGIONS=[
 {n:'Mossy Woods',sky:['#3a8adf','#9fe0ff'],hill:['#2e8a4a','#1e6a3a','#145030'],ground:'#5a3a22'},
 {n:'Crystal Depths',sky:['#1a0f3a','#4a2a8a'],hill:['#5a3aa0','#3a2478','#24164e'],ground:'#2a1a40'},
 {n:'Ember Peaks',sky:['#3a0a10','#c8402a'],hill:['#6a1a1a','#4a1010','#2a0808'],ground:'#2a1010'}];
const RELICS=[
 {id:'fang',n:'Vampire Fang',d:'Sword hits heal 15%',c:'#ff4a5a',boss:5},
 {id:'ember',n:'Ember Heart',d:'Burn deals double',c:'#ff9a2a',boss:10},
 {id:'crown',n:'Frost Crown',d:'Ice freezes more easily',c:'#3ad0ff',boss:15},
 {id:'feather',n:'Phoenix Feather',d:'Revive once per battle',c:'#ffb02a',boss:20},
 {id:'charm',n:'Combo Charm',d:'Bigger cascade bonus',c:'#ff6ad8',boss:25},
 {id:'prismr',n:'Prism Shard',d:'Start with a prism rune',c:'#bfa0ff',boss:30},
 {id:'coin',n:'Lucky Coin',d:'+40% gold',c:'#ffd23a',cost:150},
 {id:'mail',n:'Thorn Mail',d:'Blocked damage hits back',c:'#9aa8c0',cost:250},
 {id:'tome',n:'Sage Tome',d:'+30% XP',c:'#7d8aff',cost:200},
 {id:'aegis',n:'Aegis',d:'Start battles with block',c:'#ffe27a',cost:350},
 {id:'band',n:'Berserk Band',d:'Low HP: +50% damage',c:'#e8303a',cost:450},
 {id:'gear',n:'Clockwork',d:'Monsters start slower',c:'#c8a060',cost:600}];
const ABIL=['stone','poison','heal','rage','double','shield'];

let save=Object.assign({max:1,stars:[],gold:0,xp:0,lv:1,up:[0,0,0,0,0],relics:[],equip:[],seen:false},S.get('save',{}));
function persist(){S.set('save',save)}
function has(id){return save.equip.includes(id)}
function xpNeed(l){return 40+l*35}
function upCost(l){return Math.round(40*Math.pow(l+1,1.55))}
function heroMax(){return 100+18*(save.lv-1)}
function power(){return 1+.13*(save.lv-1)}

/* ---------- canvas ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR,cell,bx,by,scene={x:0,y:0,w:0,h:0},portrait=false;
let sprites=[];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);
 portrait=W/H<1.15;
 if(!portrait){const B=Math.floor(Math.min(H-68,W*.55)/8)*8;cell=B/8;const pad=Math.max(12,(W*.02));bx=W-B-pad;by=(H-B)/2+22;scene={x:pad,y:by,w:bx-pad*2,h:B}}
 else{const B=Math.floor(Math.min(W-12,H*.6)/8)*8;cell=B/8;bx=(W-B)/2;by=H-B-Math.max(8,(H-B)*.03);scene={x:0,y:0,w:W,h:by-4}}
 buildSprites()}
function buildSprites(){sprites=[];const s=Math.ceil(cell*DPR);for(let t=0;t<6;t++){const c=document.createElement('canvas');c.width=c.height=s;const g=c.getContext('2d');g.scale(s/100,s/100);drawRune(g,t);sprites.push(c)}}
function drawRune(g,t){
 g.save();g.translate(50,50);
 if(t===STONE){g.fillStyle='#6a6478';rr(g,-40,-40,80,80,14);g.fill();g.fillStyle='#8a849a';rr(g,-40,-40,80,40,14);g.fill();g.strokeStyle='#4a4458';g.lineWidth=4;g.beginPath();g.moveTo(-20,-30);g.lineTo(-6,-4);g.lineTo(-18,20);g.moveTo(10,-36);g.lineTo(18,0);g.lineTo(30,10);g.stroke();g.restore();return}
 const c=RC[t];
 const gr=g.createRadialGradient(-14,-18,4,0,0,52);gr.addColorStop(0,shade(c,.55));gr.addColorStop(.5,c);gr.addColorStop(1,shade(c,-.5));
 g.fillStyle='rgba(0,0,0,.3)';g.save();g.translate(0,5);shapePath(g,t);g.fill();g.restore();
 g.fillStyle=gr;shapePath(g,t);g.fill();
 g.lineWidth=3;g.strokeStyle=shade(c,.6);g.stroke();
 g.fillStyle='rgba(255,255,255,.35)';g.beginPath();g.ellipse(-12,-20,14,7,-.5,0,7);g.fill();
 g.fillStyle='#fff';g.strokeStyle=shade(c,-.6);g.lineWidth=5;g.lineJoin='round';
 symbol(g,t,1);g.restore()}
function shapePath(g,t){g.beginPath();
 if(t===0){rr(g,-38,-38,76,76,16)}
 else if(t===1){g.arc(0,0,40,0,7)}
 else if(t===2){g.moveTo(0,-44);g.lineTo(42,0);g.lineTo(0,44);g.lineTo(-42,0);g.closePath()}
 else if(t===3){for(let i=0;i<6;i++){const a=i/6*Math.PI*2+Math.PI/6;g.lineTo(Math.cos(a)*42,Math.sin(a)*42)}g.closePath()}
 else{g.moveTo(-36,-34);g.lineTo(36,-34);g.lineTo(34,6);g.quadraticCurveTo(26,30,0,42);g.quadraticCurveTo(-26,30,-34,6);g.closePath()}}
function symbol(g,t,sc){g.save();g.scale(sc,sc);g.beginPath();
 if(t===0){g.moveTo(-4,14);g.lineTo(-4,-24);g.lineTo(0,-30);g.lineTo(4,-24);g.lineTo(4,14);g.closePath();g.moveTo(-14,12);g.lineTo(14,12);g.lineTo(14,18);g.lineTo(-14,18);g.closePath();g.moveTo(-3,18);g.lineTo(3,18);g.lineTo(3,28);g.lineTo(-3,28);g.closePath()}
 else if(t===1){g.moveTo(0,-26);g.bezierCurveTo(18,-8,20,6,14,16);g.quadraticCurveTo(0,30,-14,16);g.bezierCurveTo(-20,6,-10,-2,-8,-10);g.quadraticCurveTo(-2,-2,0,-26)}
 else if(t===2){for(let i=0;i<3;i++){const a=i*Math.PI/3;g.moveTo(Math.cos(a)*-24,Math.sin(a)*-24);g.lineTo(Math.cos(a)*24,Math.sin(a)*24)}g.stroke();g.restore();g.save();g.scale(sc,sc);g.strokeStyle='#fff';g.lineWidth=5;g.beginPath();for(let i=0;i<3;i++){const a=i*Math.PI/3;g.moveTo(Math.cos(a)*-22,Math.sin(a)*-22);g.lineTo(Math.cos(a)*22,Math.sin(a)*22)}g.stroke();g.restore();return}
 else if(t===3){g.rect(-7,-22,14,44);g.rect(-22,-7,44,14)}
 else{g.moveTo(-18,-18);g.lineTo(18,-18);g.lineTo(17,2);g.quadraticCurveTo(12,16,0,22);g.quadraticCurveTo(-12,16,-17,2);g.closePath()}
 g.stroke();g.fill();g.restore()}
addEventListener('resize',resize);

/* ---------- board ---------- */
let grid=[],uid=1;
function mk(t,sp){return{t,sp:sp||null,id:uid++,x:0,y:0,vy:0,sc:1,dead:0,flash:0}}
function randType(R){return Math.floor((R?R():Math.random())*TYPES)}
function fillBoard(){grid=[];for(let r=0;r<N;r++){grid[r]=[];for(let c=0;c<N;c++){let t;do{t=randType()}while((c>=2&&grid[r][c-1].t===t&&grid[r][c-2].t===t)||(r>=2&&grid[r-1][c].t===t&&grid[r-2][c].t===t));const o=mk(t);o.x=c;o.y=r-N-1-Math.random()*.5;grid[r][c]=o}}if(!findMove())fillBoard()}
function at(r,c){return r>=0&&r<N&&c>=0&&c<N?grid[r][c]:null}
function same(a,b){return a&&b&&a.t===b.t&&a.t<TYPES&&a.sp!=='prism'&&b.sp!=='prism'}
function findRuns(){const runs=[];
 for(let r=0;r<N;r++){let c=0;while(c<N){let e=c+1;while(e<N&&same(grid[r][c],grid[r][e]))e++;if(e-c>=3)runs.push({h:1,cells:Array.from({length:e-c},(_,i)=>[r,c+i])});c=e}}
 for(let c=0;c<N;c++){let r=0;while(r<N){let e=r+1;while(e<N&&same(grid[r][c],grid[e][c]))e++;if(e-r>=3)runs.push({h:0,cells:Array.from({length:e-r},(_,i)=>[r+i,c])});r=e}}
 return runs}
function groupRuns(runs){const groups=[];const used=new Array(runs.length).fill(false);
 for(let i=0;i<runs.length;i++){if(used[i])continue;used[i]=true;const g={runs:[runs[i]]};let changed=true;while(changed){changed=false;for(let j=0;j<runs.length;j++){if(used[j])continue;if(g.runs.some(a=>a.cells.some(([r,c])=>runs[j].cells.some(([r2,c2])=>r===r2&&c===c2)))){used[j]=true;g.runs.push(runs[j]);changed=true}}}groups.push(g)}
 return groups}
function findMove(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const a=grid[r][c];if(!a||a.t===STONE)continue;if(a.sp==='prism')return[[r,c],[r,c+1<N?c+1:c-1]];for(const[dr,dc]of[[0,1],[1,0]]){const r2=r+dr,c2=c+dc;if(r2>=N||c2>=N)continue;const b=grid[r2][c2];if(!b||b.t===STONE)continue;grid[r][c]=b;grid[r2][c2]=a;const ok=findRuns().length>0;grid[r][c]=a;grid[r2][c2]=b;if(ok)return[[r,c],[r2,c2]]}}return null}

/* ---------- battle state ---------- */
let state='title',paused=false,busy=false,battle=null,hero=null,mon=null,sel=null,hint=null,idleT=0,T=0;
let parts=[],floats=[],orbs=[],timers=[],conds=[],fx=[],shake=0,flashR=0,comboTxt=null;
function wait(t){return new Promise(r=>timers.push({t,r}))}
function until(fn){return new Promise(r=>conds.push({fn,r}))}
function settled(){for(let r=0;r<N;r++)for(let c=0;c<N;c++){const o=grid[r][c];if(o&&(Math.abs(o.y-r)>.01||Math.abs(o.x-c)>.01))return false}return true}

function monsterFor(n,wave,waves){
 const R=rng(n*977+wave*31+5),reg=Math.floor((n-1)/10),boss=n%10===0,mini=n%5===0&&!boss,last=wave===waves-1;
 const big=(boss||mini)&&last;
 const k=n-1,hp=Math.round(55*(1+.075*k)*(1+.06*k)*Math.pow(1.02,k)*(big?(boss?2.4:1.7):1)*(waves>1&&!last?.7:1));
 const atk=Math.round((8+1.6*n)*Math.pow(1.015,n)*(big?1.25:1));
 const abil=[];if(n>=4){abil.push(ABIL[Math.floor(R()*ABIL.length)])}if(big){let a;do{a=ABIL[Math.floor(R()*ABIL.length)]}while(abil.includes(a));abil.push(a)}
 const hue=[[120,90,60,160],[260,200,300,180],[0,20,340,40]][reg];
 return{hp,max:hp,atk,cd:big?2:(2+Math.floor(R()*3)),cdMax:0,abil,boss:big,crown:boss&&last,body:Math.floor(R()*5),col:'hsl('+(hue[Math.floor(R()*4)]+R()*30)+','+(60+R()*30)+'%,'+(50+R()*12)+'%)',eyes:1+Math.floor(R()*3),horns:R()<.45,wings:R()<.3,teeth:R()<.5,block:0,burn:0,frozen:0,rage:0,x:0,lunge:0,hurt:0,ph:R()*6,dead:0}}
function startBattle(n){
 const waves=n<=2?1:(n%5===0?3:(n<8?2:2+Math.floor(Math.random()*2)));
 battle={n,wave:0,waves,turns:0,dmgTaken:0,revived:false,reg:Math.floor((n-1)/10)};
 hero={hp:heroMax(),max:heroMax(),block:has('aegis')?25+save.lv*3:0,poison:0,lunge:0,hurt:0,cast:null,castT:0};
 newWave();fillBoard();
 if(has('prismr')){const r=Math.floor(Math.random()*N),c=Math.floor(Math.random()*N);grid[r][c].sp='prism';grid[r][c].t=-1}
 state='battle';busy=false;sel=null;hint=null;idleT=0;parts=[];floats=[];orbs=[];fx=[];showOv(null);$('bPause').style.display='flex';

}

/* ---------- turn resolution ---------- */
let turnPow=[0,0,0,0,0],cascade=0;
async function trySwap(a,b){
 if(busy||state!=='battle')return;
 const A1=grid[a[0]][a[1]],B1=grid[b[0]][b[1]];if(!A1||!B1||A1.t===STONE||B1.t===STONE)return;
 busy=true;sel=null;hint=null;idleT=0;
 grid[a[0]][a[1]]=B1;grid[b[0]][b[1]]=A1;SFX.swap();
 await until(settled);
 turnPow=[0,0,0,0,0];cascade=0;
 if(A1.sp==='prism'||B1.sp==='prism'){
  const p=A1.sp==='prism'?A1:B1,o=p===A1?B1:A1;const set=new Set();
  if(o.sp==='prism'){for(let r=0;r<N;r++)for(let c=0;c<N;c++)set.add(r*N+c)}
  else{for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c].t===o.t)set.add(r*N+c)}
  const pp=find(p);set.add(pp[0]*N+pp[1]);
  SFX.special();shake=8;flashR=.5;
  for(const k of set){const r=Math.floor(k/N),c=k%N;fx.push({k:'beam',x1:pp[1],y1:pp[0],x2:c,y2:r,t:.35})}
  await wait(.25);cascade=1;await clearCells(set,[]);await collapse();await resolve(null);
 } else {
  if(!findRuns().length){grid[a[0]][a[1]]=A1;grid[b[0]][b[1]]=B1;SFX.bad();await until(settled);busy=false;return}
  await resolve([b,a]);
 }
 await endTurn();
}
function find(o){for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(grid[r][c]===o)return[r,c];return[0,0]}
async function resolve(swapPos){
 while(true){
  const runs=findRuns();if(!runs.length)break;cascade++;
  const groups=groupRuns(runs),set=new Set(),create=[];
  for(const g of groups){const cells=[];for(const r of g.runs)for(const p of r.cells)if(!cells.some(q=>q[0]===p[0]&&q[1]===p[1]))cells.push(p);
   cells.forEach(([r,c])=>set.add(r*N+c));
   const maxLen=Math.max(...g.runs.map(r=>r.cells.length)),hv=new Set(g.runs.map(r=>r.h));
   let sp=null;if(maxLen>=5)sp='prism';else if(hv.size>1)sp='bomb';else if(maxLen===4)sp=g.runs[0].h?'h':'v';
   if(sp){let pos=null;if(swapPos)for(const s of swapPos)if(cells.some(q=>q[0]===s[0]&&q[1]===s[1])){pos=s;break}if(!pos){if(hv.size>1){const all=g.runs.map(r=>r.cells.map(p=>p[0]*N+p[1]));pos=cells.find(([r,c])=>all.filter(a=>a.includes(r*N+c)).length>1)||cells[0]}else pos=cells[Math.floor(cells.length/2)]}
    create.push({pos,sp,t:grid[pos[0]][pos[1]].t})}}
  SFX.match(cascade);
  if(cascade>=2){comboTxt={s:'COMBO x'+cascade,t:0};}
  await clearCells(set,create);
  await collapse();swapPos=null;
 }
}
async function clearCells(set,create){
 // expand specials
 const queue=[...set],done=new Set(set);
 while(queue.length){const k=queue.shift(),r=Math.floor(k/N),c=k%N,o=grid[r][c];if(!o||!o.sp)continue;if(create.some(cr=>cr.pos[0]===r&&cr.pos[1]===c&&o.sp===cr.sp))continue;
  let add=[];if(o.sp==='h'){for(let i=0;i<N;i++)add.push(r*N+i);fx.push({k:'line',h:1,r,c,t:.35})}else if(o.sp==='v'){for(let i=0;i<N;i++)add.push(i*N+c);fx.push({k:'line',h:0,r,c,t:.35})}else if(o.sp==='bomb'){for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++)if(at(r+dr,c+dc))add.push((r+dr)*N+c+dc);fx.push({k:'ring',r,c,t:.4})}else if(o.sp==='prism'){const tt=Math.floor(Math.random()*TYPES);for(let rr2=0;rr2<N;rr2++)for(let cc=0;cc<N;cc++)if(grid[rr2][cc].t===tt)add.push(rr2*N+cc)}
  if(add.length){SFX.special();shake=Math.max(shake,6)}
  for(const a of add)if(!done.has(a)){done.add(a);queue.push(a)}}
 // stones adjacent
 for(const k of [...done]){const r=Math.floor(k/N),c=k%N;for(const[dr,dc]of[[0,1],[1,0],[0,-1],[-1,0]]){const o=at(r+dr,c+dc);if(o&&o.t===STONE)done.add((r+dr)*N+c+dc)}}
 const mult=(1+(cascade-1)*(has('charm')?.4:.25));
 for(const k of done){const r=Math.floor(k/N),c=k%N,o=grid[r][c];if(!o)continue;
  const keep=create.find(cr=>cr.pos[0]===r&&cr.pos[1]===c);
  if(o.t>=0&&o.t<TYPES){turnPow[o.t]+=mult;spawnOrb(c,r,o.t)}
  burst(bx+(c+.5)*cell,by+(r+.5)*cell,o.t>=0&&o.t<TYPES?RC[o.t]:'#aaa',7,cell*3);
  if(keep){continue}o.dead=1}
 await wait(.2);
 for(const k of done){const r=Math.floor(k/N),c=k%N,o=grid[r][c];if(!o)continue;const keep=create.find(cr=>cr.pos[0]===r&&cr.pos[1]===c);
  if(keep){o.sp=keep.sp;if(keep.sp==='prism')o.t=-1;o.flash=1;o.dead=0;o.sc=1.4}else grid[r][c]=null}
}
async function collapse(){
 for(let c=0;c<N;c++){let w=N-1;for(let r=N-1;r>=0;r--){const o=grid[r][c];if(o){if(w!==r){grid[w][c]=o;grid[r][c]=null}w--}}
  let k=0;for(let r=w;r>=0;r--){const o=mk(randType());o.x=c;o.y=-1-k-.2*k;k++;grid[r][c]=o}}
 await until(settled);
}
function spawnOrb(c,r,t){orbs.push({x:bx+(c+.5)*cell,y:by+(r+.5)*cell,t:0,d:rnd(.35,.55),c:RC[t],sx:bx+(c+.5)*cell,sy:by+(r+.5)*cell})}

function heroPos(){const s=sceneScale();return{x:scene.x+scene.w*.27,y:scene.y+scene.h*.78,s}}
function monPos(){const s=sceneScale();return{x:scene.x+scene.w*.72,y:scene.y+scene.h*.78,s}}

function num(x,y,s,c,big){floats.push({x,y,s:''+s,c,t:0,big})}

async function endTurn(){
 battle.turns++;
 const p=power(),m=i=>1+.2*save.up[i];
 const low=has('band')&&hero.hp<hero.max*.5?1.5:1;
 const H=heroPos(),M=monPos();
 // sword
 if(turnPow[0]>0&&mon.hp>0){const d=Math.round(turnPow[0]*4*p*m(0)*low);hero.lunge=1;await wait(.15);SFX.slash();fx.push({k:'slash',t:.3});dmgMon(d,RC[0]);if(has('fang'))healHero(Math.round(d*.15));await wait(.3)}
 if(turnPow[1]>0&&mon.hp>0){const d=Math.round(turnPow[1]*3.4*p*m(1)*low);hero.cast=1;SFX.fire();fx.push({k:'proj',c:RC[1],t:0,d:.35,big:turnPow[1]});await wait(.35);dmgMon(d,RC[1]);mon.burn=Math.max(mon.burn,3);mon.burnD=Math.max(1,Math.round(turnPow[1]*.9*p*m(1)*(has('ember')?2:1)));await wait(.2)}
 if(turnPow[2]>0&&mon.hp>0){const d=Math.round(turnPow[2]*3*p*m(2)*low);hero.cast=1;SFX.ice();fx.push({k:'proj',c:RC[2],t:0,d:.3,big:turnPow[2],ice:1});await wait(.3);dmgMon(d,RC[2]);if(turnPow[2]>=(has('crown')?3:4)){mon.frozen=Math.min(3,mon.frozen+1);num(M.x,M.y-140*M.s,'FREEZE','#bff')}await wait(.2)}
 if(turnPow[3]>0){const h=Math.round(turnPow[3]*3*p*m(3));SFX.heal();healHero(h);if(hero.poison){hero.poison=0}await wait(.3)}
 if(turnPow[4]>0){const b=Math.round(turnPow[4]*3*p*m(4));hero.block+=b;SFX.shield();fx.push({k:'bubble',t:.6});num(H.x,H.y-120*H.s,'+'+b,RC[4]);await wait(.3)}
 if(mon.hp<=0){await monDies();return}
 // DoTs
 if(mon.burn>0){mon.burn--;dmgMon(mon.burnD||1,'#ff9a2a');await wait(.25);if(mon.hp<=0){await monDies();return}}
 if(hero.poison>0){hero.poison--;const d=Math.max(1,Math.round(hero.max*.04));hero.hp-=d;num(H.x,H.y-100*H.s,'-'+d,'#8f6');await wait(.2);if(await checkDeath())return}

function dmgMon(d,c){if(mon.block>0){const b=Math.min(mon.block,d);mon.block-=b;d-=b}mon.hp=Math.max(0,mon.hp-d);mon.hurt=1;const M=monPos();num(M.x+rnd(-20,20),M.y-110*M.s,d,c,d>60);SFX.mhit();shake=Math.max(shake,4+Math.min(10,d/15));burst(M.x,M.y-50*M.s,c,14,300)}
function healHero(h){const H=heroPos();const a=Math.min(h,hero.max-hero.hp);hero.hp+=a;num(H.x,H.y-110*H.s,'+'+h,RC[3]);for(let i=0;i<14;i++)parts.push({x:H.x+rnd(-30,30)*H.s,y:H.y-rnd(0,90)*H.s,vx:0,vy:-rnd(40,120),l:.8,m:.8,c:RC[3],s:rnd(3,6),g:0,plus:1})}

  hero.hp-=d;hero.hurt=1;battle.dmgTaken+=d;SFX.hurt();shake=12;flashR=.35;num(H.x,H.y-100*H.s,d?'-'+d:'BLOCK',d?'#ff5a5a':RC[4],d>30);burst(H.x,H.y-50*H.s,'#ff5a5a',16,260);

/* ---------- update ---------- */
function update(dt){
 T+=dt;
 for(const t of timers)t.t-=dt;const done=timers.filter(t=>t.t<=0);timers=timers.filter(t=>t.t>0);done.forEach(t=>t.r());
 // board anim
 for(let r=0;r<N;r++)for(let c=0;c<N;c++){const o=grid[r]&&grid[r][c];if(!o)continue;
  if(o.y<r){o.vy+=dt*38;o.y=Math.min(r,o.y+o.vy*dt);if(o.y>=r){o.vy=0;o.sc=1.15}}else if(o.y>r){o.y=Math.max(r,o.y-dt*12)}else o.vy=0;
  if(o.x!==c){const d=c-o.x;o.x+=Math.sign(d)*Math.min(Math.abs(d),dt*9)}
  o.sc=lerp(o.sc,1,Math.min(1,dt*10));o.flash=Math.max(0,o.flash-dt*3)}
 const cd=conds.filter(c=>c.fn());conds=conds.filter(c=>!cd.includes(c));cd.forEach(c=>c.r());
 for(const p of parts){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}parts=parts.filter(p=>p.l>0);
 for(const f of floats)f.t+=dt;floats=floats.filter(f=>f.t<1.1);

  if(f.k==='line'){const a=f.t/.35;g.fillStyle='rgba(255,255,255,'+a+')';if(f.h)g.fillRect(bx,by+(f.r+.5)*cell-cell*.25*a,B,cell*.5*a);else g.fillRect(bx+(f.c+.5)*cell-cell*.25*a,by,cell*.5*a,B)}
  if(f.k==='ring'){const a=f.t/.4;g.strokeStyle='rgba(255,230,150,'+a+')';g.lineWidth=8*a;g.beginPath();g.arc(bx+(f.c+.5)*cell,by+(f.r+.5)*cell,cell*(2.2-a),0,7);g.stroke()}
  if(f.k==='beam'){const a=f.t/.35;g.strokeStyle='rgba(255,255,255,'+a+')';g.lineWidth=3;g.beginPath();g.moveTo(bx+(f.x1+.5)*cell,by+(f.y1+.5)*cell);g.lineTo(bx+(f.x2+.5)*cell,by+(f.y2+.5)*cell);g.stroke()}
 }
}
function drawPrism(g,x,y,r){g.save();g.translate(x,y);g.rotate(T*1.5);for(let i=0;i<6;i++){g.fillStyle=RC[i%5];g.beginPath();g.moveTo(0,0);g.arc(0,0,r*.9,i*Math.PI/3,(i+1)*Math.PI/3);g.fill()}g.restore();const gr=g.createRadialGradient(x-r*.3,y-r*.3,1,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.95)');gr.addColorStop(.5,'rgba(255,255,255,.2)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();g.strokeStyle='#fff';g.lineWidth=2;g.beginPath();g.arc(x,y,r*.9,0,7);g.stroke()}

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused)update(dt);render();requestAnimationFrame(frame)}

/* ---------- input ---------- */
let down=null;
function cellAt(x,y){const c=Math.floor((x-bx)/cell),r=Math.floor((y-by)/cell);return r>=0&&r<N&&c>=0&&c<N?[r,c]:null}
cv.addEventListener('pointerdown',e=>{A.init();if(state!=='battle'||paused||busy)return;const p=cellAt(e.clientX,e.clientY);if(!p){sel=null;return}
 if(sel&&Math.abs(sel[0]-p[0])+Math.abs(sel[1]-p[1])===1){const s=sel;sel=null;trySwap(s,p);return}
 down={p,x:e.clientX,y:e.clientY};sel=p;SFX.tick()});
addEventListener('pointermove',e=>{if(!down||busy)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.max(Math.abs(dx),Math.abs(dy))>cell*.35){const p=down.p;const q=Math.abs(dx)>Math.abs(dy)?[p[0],p[1]+Math.sign(dx)]:[p[0]+Math.sign(dy),p[1]];down=null;if(q[0]>=0&&q[0]<N&&q[1]>=0&&q[1]<N){sel=null;trySwap(p,q)}}});
addEventListener('pointerup',()=>{down=null});
addEventListener('keydown',e=>{A.init();if(e.code==='Escape'||e.code==='KeyP'){if(state==='battle')setPause(!paused);e.preventDefault()}if(e.code==='KeyM')A.mute(!A.muted);if(e.code==='Enter'&&state==='title'){($('bCont').style.display!=='none'?$('bCont'):$('bPlay')).click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='battle'&&!paused)setPause(true)});

/* ---------- UI ---------- */
function showOv(id){for(const o of['title','map','hero','win','lose','pause'])$(o).classList.toggle('on',o===id)}
function drawMute(){$('bMute').innerHTML=A.muted?'<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24" fill="#fff"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round"/></svg>'}
drawMute();
$('bMute').onclick=e=>{A.init();A.mute(!A.muted)};
$('bPause').onclick=()=>setPause(true);
function setPause(v){if(v&&state!=='battle')return;paused=v;showOv(v?'pause':null)}
$('pRes').onclick=()=>{SFX.click();setPause(false)};
$('pMap').onclick=()=>{SFX.click();paused=false;openMap()};
$('bPlay').onclick=()=>{A.init();SFX.click();if(!save.seen){save.seen=true;persist();startBattle(1)}else openMap()};
$('bCont').onclick=()=>{A.init();SFX.click();openMap()};
function refreshTitle(){$('bCont').style.display=save.seen?'':'none';$('bPlay').style.display=save.seen?'none':''}
function openMap(){state='map';battle=null;hero=null;mon=null;timers=[];conds=[];busy=false;$('bPause').style.display='none';showOv('map');buildMap()}
function buildMap(){
 $('mGold').textContent=save.gold;$('mLv').textContent='Lv '+save.lv;
 const inner=$('mapInner');inner.innerHTML='';const sp=110,h=30*sp+220;inner.style.height=h+'px';
 const wdt=Math.min(560,innerWidth);
 const pos=i=>{const y=h-120-i*sp;const x=wdt/2+Math.sin(i*.9)*wdt*.3;return[x,y]};
 // region bands
 for(let r=0;r<3;r++){const d=document.createElement('div');const y0=h-120-(r*10+9.5)*sp,y1=h-120-(r*10-.5)*sp;const reg=REGIONS[r];d.style.cssText='position:absolute;left:-50vw;right:-50vw;top:'+(r===2?0:y0)+'px;height:'+((r===0?h:y1)-(r===2?0:y0))+'px;background:linear-gradient(180deg,'+reg.hill[2]+','+reg.hill[0]+' 60%,'+reg.sky[1]+')';inner.appendChild(d)}
 let svg='<svg width="'+wdt+'" height="'+h+'" style="position:absolute;left:0;top:0"><path d="';for(let i=0;i<30;i++){const[x,y]=pos(i);svg+=(i?'L':'M')+x+' '+y}svg+='" stroke="#0006" stroke-width="16" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="';for(let i=0;i<30;i++){const[x,y]=pos(i);svg+=(i?'L':'M')+x+' '+y}svg+='" stroke="#fff6" stroke-width="5" stroke-dasharray="2 14" fill="none" stroke-linecap="round"/></svg>';
 const R=rng(7);let dec='<svg width="'+wdt+'" height="'+h+'" style="position:absolute;left:0;top:0;opacity:.55">';for(let i=0;i<70;i++){const y=R()*h,x=R()<.5?R()*wdt*.22:wdt-R()*wdt*.22,reg=y>h-120-9.5*sp?0:y>h-120-19.5*sp?1:2,z=14+R()*26;if(reg===0)dec+='<path d="M'+x+' '+(y-z*1.6)+'L'+(x+z*.7)+' '+y+'L'+(x-z*.7)+' '+y+'Z" fill="#0d4a24"/><rect x="'+(x-3)+'" y="'+y+'" width="6" height="'+z*.4+'" fill="#3a2414"/>';else if(reg===1)dec+='<path d="M'+x+' '+(y-z)+'L'+(x+z*.4)+' '+y+'L'+x+' '+(y+z*.5)+'L'+(x-z*.4)+' '+y+'Z" fill="#b58aff"/>';else dec+='<path d="M'+(x-z)+' '+y+'L'+x+' '+(y-z*1.2)+'L'+(x+z)+' '+y+'Z" fill="#2a0808"/><circle cx="'+x+'" cy="'+(y-z*1.2)+'" r="'+z*.2+'" fill="#ff7a2a"/>'}dec+='</svg>';inner.insertAdjacentHTML('beforeend',dec);
 inner.insertAdjacentHTML('beforeend',svg);
 for(let i=0;i<30;i++){const n=i+1,[x,y]=pos(i);const b=document.createElement('button');const st=save.stars[i]||0;b.className='node'+(n<save.max?' done':'')+(n>save.max?' lock':'')+(n===save.max?' cur':'')+(n%5===0?' boss':'');b.style.left=x+'px';b.style.top=y+'px';b.textContent=n%10===0?'BOSS':n;
  if(st){const s=document.createElement('div');s.className='stars';s.textContent='★'.repeat(st);b.appendChild(s)}
  if(n<=save.max)b.onclick=()=>{SFX.click();startBattle(n)};inner.appendChild(b)}
 inner.style.width=wdt+'px';
 requestAnimationFrame(()=>{const[,y]=pos(Math.min(29,save.max-1));$('mapScroll').scrollTop=y-innerHeight*.6})}
$('bHero').onclick=()=>{SFX.click();openHero()};
$('hBack').onclick=()=>{SFX.click();openMap()};
function relicCanvas(r,size){const c=document.createElement('canvas');c.width=c.height=size*2;const g=c.getContext('2d');g.scale(size*2/100,size*2/100);g.translate(50,50);
 const i=RELICS.indexOf(r);g.fillStyle=r.c;g.shadowColor=r.c;g.shadowBlur=14;g.beginPath();
 const sh=i%4;if(sh===0)g.arc(0,0,34,0,7);else if(sh===1){g.moveTo(0,-38);g.lineTo(34,0);g.lineTo(0,38);g.lineTo(-34,0)}else if(sh===2){for(let k=0;k<6;k++){const a=k/6*6.283;g.lineTo(Math.cos(a)*36,Math.sin(a)*36)}}else{for(let k=0;k<10;k++){const a=k/10*6.283-Math.PI/2,rr2=k%2?18:38;g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2)}}g.closePath();g.fill();g.shadowBlur=0;
 g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.ellipse(-10,-14,12,6,-.5,0,7);g.fill();
 g.fillStyle='#fff';g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=5;g.save();g.scale(.55,.55);symbol(g,[0,1,2,1,3,4,4,4,2,4,0,2][i],1);g.restore();return c}
function openHero(){showOv('hero');buildHero()}
function buildHero(){
 $('hGold').textContent=save.gold;$('hLv').textContent='Lv '+save.lv;$('hXp').style.width=(save.xp/xpNeed(save.lv)*100)+'%';
 $('hStats').innerHTML='<span style="color:#4ae08a">♥ '+heroMax()+'</span> &nbsp; <span style="color:#ffd45a">⚔ ×'+power().toFixed(2)+'</span>';
 const up=$('upPanel');up.innerHTML='';
 for(let i=0;i<5;i++){const row=document.createElement('div');row.className='uprow';const ic=document.createElement('canvas');ic.width=ic.height=80;ic.getContext('2d').scale(.8,.8);drawRune(ic.getContext('2d'),i);row.appendChild(ic);
  const p=document.createElement('div');p.className='pips';for(let j=0;j<10;j++){const u=document.createElement('u');if(j<save.up[i])u.className='f';p.appendChild(u)}row.appendChild(p);
  const b=document.createElement('button');b.className='btn sm gn';const cost=upCost(save.up[i]);if(save.up[i]>=10){b.textContent='MAX';b.disabled=true}else{b.innerHTML='<span class="coin"></span>'+cost;if(save.gold<cost)b.disabled=true}
  b.onclick=()=>{if(save.gold>=cost&&save.up[i]<10){save.gold-=cost;save.up[i]++;persist();SFX.coin();buildHero()}};row.appendChild(b);up.appendChild(row)}
 const sl=$('slots');sl.innerHTML='';for(let i=0;i<3;i++){const d=document.createElement('div');d.className='slot';const id=save.equip[i];if(id){d.appendChild(relicCanvas(RELICS.find(r=>r.id===id),46));d.onclick=()=>{save.equip.splice(i,1);persist();SFX.click();buildHero()}}sl.appendChild(d)}
 const rl=$('relics');rl.innerHTML='';
 RELICS.forEach(r=>{const own=save.relics.includes(r.id);const d=document.createElement('div');d.className='relic'+(own?'':' lock')+(save.equip.includes(r.id)?' eq':'');d.appendChild(relicCanvas(r,48));
  if(!own){const p=document.createElement('div');p.className='pr';p.textContent=r.cost?r.cost:'BOSS '+r.boss;d.appendChild(p)}
  d.onclick=()=>{$('tip').innerHTML='<b style="color:'+r.c+'">'+r.n+'</b> · '+r.d;
   if(own){if(save.equip.includes(r.id))save.equip=save.equip.filter(x=>x!==r.id);else if(save.equip.length<3)save.equip.push(r.id);else{save.equip[2]=r.id}persist();SFX.click();buildHero();$('tip').innerHTML='<b style="color:'+r.c+'">'+r.n+'</b> · '+r.d}
   else if(r.cost&&save.gold>=r.cost&&d.dataset.arm){save.gold-=r.cost;save.relics.push(r.id);if(save.equip.length<3)save.equip.push(r.id);persist();SFX.coin();buildHero();$('tip').innerHTML='<b style="color:'+r.c+'">'+r.n+'</b> · '+r.d}
   else if(r.cost){document.querySelectorAll('.relic').forEach(x=>delete x.dataset.arm);d.dataset.arm=1;$('tip').innerHTML+=save.gold>=r.cost?' · <b>tap again to buy</b>':''}};
  rl.appendChild(d)});
}
$('wMap').onclick=()=>{SFX.click();openMap()};
$('wNext').onclick=()=>{SFX.click();startBattle(Math.min(30,battle.n+1))};
$('lMap').onclick=()=>{SFX.click();openMap()};
$('lRetry').onclick=()=>{SFX.click();startBattle(battle.n)};

window.__rm={go:n=>startBattle(n),state:()=>state,save:()=>save,win:()=>{mon.hp=0;battle.wave=battle.waves-1;monDies()},hint:()=>findMove(),swap:(a,b)=>trySwap(a,b),busy:()=>busy,cell:()=>({bx,by,cell}),mon:()=>mon,hero:()=>hero};

resize();fillBoard();for(let r=0;r<N;r++)for(let c=0;c<N;c++){grid[r][c].y=r;grid[r][c].x=c}
refreshTitle();
requestAnimationFrame(frame);
</script></body></html>

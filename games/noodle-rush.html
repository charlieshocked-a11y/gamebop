<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Noodle Rush</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#1a1230;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:#fff4e0}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
#ui{position:fixed;inset:0;pointer-events:none}
.screen{position:absolute;inset:0;pointer-events:auto;display:flex;flex-direction:column;align-items:center}
.hidden{display:none!important}
.btn{font:inherit;font-weight:900;letter-spacing:.4px;color:#fff6e4;border:0;cursor:pointer;padding:11px 20px;border-radius:14px 14px 16px 16px;
 background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 9px,rgba(80,30,0,.07) 9px 11px),linear-gradient(#cf8446,#9a522b);
 box-shadow:inset 0 2px 0 rgba(255,230,190,.5),inset 0 -3px 0 rgba(0,0,0,.25),0 5px 0 #5a2c14,0 9px 16px rgba(0,0,0,.35);
 text-shadow:0 2px 0 rgba(70,30,10,.75);transition:transform .2s cubic-bezier(.34,1.8,.64,1),filter .15s,box-shadow .1s;font-size:17px;position:relative;white-space:nowrap}
.btn:hover{transform:translateY(-2px) scale(1.05);filter:brightness(1.1)}
.btn:active{transform:translateY(4px) scale(.96);box-shadow:inset 0 2px 0 rgba(255,230,190,.5),0 1px 0 #5a2c14,0 2px 4px rgba(0,0,0,.3)}
.btn.red{background:radial-gradient(120% 90% at 50% 10%,#ff9a5a,#e0402c 55%,#b3241f);border:2px solid #ffd27a;box-shadow:inset 0 2px 0 rgba(255,230,190,.6),inset 0 -4px 0 rgba(0,0,0,.2),0 5px 0 #7a1a14,0 10px 22px rgba(255,90,40,.35)}
.btn.teal{background:linear-gradient(#4fb3a6,#2c7f7a);box-shadow:inset 0 2px 0 rgba(220,255,240,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 5px 0 #17484a,0 9px 16px rgba(0,0,0,.35)}
.btn.big{font-size:26px;padding:12px 44px;border-radius:20px}
.btn.sm{font-size:14px;padding:8px 13px}
.btn[disabled]{filter:grayscale(.8) brightness(.7);cursor:default}
.btn .ic{width:22px;height:22px;vertical-align:-5px;margin-right:6px}
#title .tb{position:absolute;bottom:max(5vh,14px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:11px;animation:rise .7s cubic-bezier(.3,1.5,.6,1) both .15s}
#title .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
@keyframes rise{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}70%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes slideDown{from{transform:translateX(-130%)}to{transform:translateX(0)}}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font-size:11.5px;color:#ffe9c8;opacity:.55;text-decoration:none;transition:opacity .2s;pointer-events:auto;z-index:5}
#support:hover{opacity:1}
.panel{background:linear-gradient(#fff3dc,#f1dcb5);color:#5a2f17;border-radius:20px;border:4px solid #8f4f27;box-shadow:0 8px 0 #5a2c14,0 18px 40px rgba(0,0,0,.5);padding:14px;animation:pop .45s cubic-bezier(.3,1.5,.6,1) both}
.topbar{position:absolute;top:calc(8px + env(safe-area-inset-top));left:10px;right:10px;display:flex;align-items:center;gap:8px;z-index:3}
.sign{background:linear-gradient(#8a4a26,#6a3418);border:3px solid #3e1d0c;border-radius:12px;padding:6px 12px;font-weight:900;color:#ffe3ad;font-size:18px;text-shadow:0 2px 0 #2a1206;box-shadow:0 4px 0 #2a1206}
.money{display:flex;align-items:center;gap:6px;margin-left:auto}
.money i{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff2a8,#f4b52a 55%,#b9761a);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
#hub .locs{display:flex;gap:6px;margin-top:calc(64px + env(safe-area-inset-top));flex-wrap:wrap;justify-content:center;padding:0 8px}
.loc{width:74px;height:70px;border-radius:14px;border:3px solid #3e1d0c;background:#5a3018;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10.5px;font-weight:900;color:#ffe3ad;transition:transform .2s cubic-bezier(.34,1.8,.64,1);position:relative;font-family:inherit;padding:2px}
.loc img{width:40px;height:40px}
.loc.on{background:#d3352a;border-color:#ffd27a;transform:translateY(-3px) scale(1.06)}
.loc.lock img{filter:grayscale(1) brightness(.6)}
.loc span{line-height:1.05}.loc .pr{position:absolute;bottom:-11px;white-space:nowrap;background:#2a1206;border-radius:8px;padding:1px 6px;font-size:10px;color:#ffd27a}
.days{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;max-width:560px;padding:0 10px}
.day{width:58px;height:74px;cursor:pointer;border:0;background:none;position:relative;font-family:inherit;transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.day:hover{transform:scale(1.08) rotate(-2deg)}
.day .lan{position:absolute;left:6px;top:4px;width:46px;height:50px;border-radius:45% 45% 40% 40%;background:radial-gradient(circle at 50% 40%,#ffd88a,#f06a2a 60%,#a92a1a);box-shadow:0 0 18px rgba(255,140,60,.6);border:2px solid #5a1a0a;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:19px;color:#5a1a0a}
.day .lan:before{content:"";position:absolute;top:-7px;left:13px;width:16px;height:6px;background:#3a1a0a;border-radius:3px}
.day.lock .lan{background:radial-gradient(circle at 50% 40%,#7a6a80,#4a3a55 70%);box-shadow:none;color:#2a1a30}
.day.sel .lan{outline:3px solid #fff;outline-offset:2px}
.day .st{position:absolute;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:1px}
.st svg,.stars svg{width:15px;height:15px}
.dcard{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:280px}
.goals{display:flex;gap:12px;align-items:center;font-weight:900;font-size:16px}
.goals span{display:flex;align-items:center;gap:2px}
.feat{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:34px}
.feat img{width:34px;height:34px;background:rgba(90,47,23,.12);border-radius:9px;padding:2px}
.feat .nw{position:relative}
.feat .nw:after{content:"NEW";position:absolute;top:-6px;right:-8px;background:#e0402c;color:#fff;font-size:8.5px;font-weight:900;border-radius:5px;padding:1px 3px}
.bottombar{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:0 8px}
.grid{display:grid;gap:10px;overflow:auto;max-height:calc(100vh - 170px);padding:6px;width:min(94vw,820px)}
.card{background:#fffaf0;border:3px solid #c9965f;border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;color:#5a2f17;font-weight:900;font-size:13px;text-align:center;position:relative}
.card img{width:64px;height:64px}
.card .pips{display:flex;gap:3px}
.card .pips b{width:10px;height:10px;border-radius:50%;background:#e4cfa8;border:2px solid #b98a55}
.card .pips b.on{background:#f4b52a;border-color:#a8651a}
.card .btn{font-size:14px;padding:6px 12px}
.card.lock img{filter:brightness(0) opacity(.25)}
.card.lock{color:#b39a80}
.card .ef{font-size:11px;color:#8a5a37;font-weight:700}
.tabs{display:flex;gap:6px;margin:calc(62px + env(safe-area-inset-top)) 0 8px}
.tabs .btn.on{background:linear-gradient(#ff7a4a,#d3352a)}
#res .panel,#pause .panel,#confirm .panel{margin:auto;display:flex;flex-direction:column;align-items:center;gap:10px;min-width:260px;max-width:92vw}
.bigstars{display:flex;gap:8px;margin:2px 0}
.bigstars svg{width:58px;height:58px;transform:scale(0)}
.bigstars svg.in{animation:starIn .55s cubic-bezier(.3,1.8,.5,1) forwards}
@keyframes starIn{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.earn{font-size:38px;font-weight:900;color:#c96a14;text-shadow:0 3px 0 #f9e3b0}
.stats{display:flex;gap:14px;font-weight:900;font-size:16px}
.stats span{display:flex;align-items:center;gap:4px}
.stats img{width:28px;height:28px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dim{background:rgba(20,10,30,.55)}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:6px;pointer-events:auto;z-index:4}
.ibtn{width:42px;height:42px;border-radius:12px;padding:0;display:flex;align-items:center;justify-content:center}
.ibtn svg{width:22px;height:22px}
#tut{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(62px + env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none;z-index:4;max-width:46vw}
@media (max-aspect-ratio:1/1){#tut{top:auto;bottom:calc(10px + env(safe-area-inset-bottom));left:8px;right:8px;max-width:none;align-items:center;flex-direction:column-reverse}}
#tutcap{background:rgba(40,18,8,.86);border:2px solid #ffd27a;color:#fff3d6;font-weight:900;font-size:19px;padding:7px 16px;border-radius:14px;box-shadow:0 5px 0 rgba(0,0,0,.35);display:flex;align-items:center;gap:8px;animation:pop .35s cubic-bezier(.3,1.6,.6,1) both;max-width:92vw;text-align:center}
#tutcap kbd{background:#fff3d6;color:#5a2f17;border-radius:6px;padding:1px 7px;font-family:inherit;font-size:15px;box-shadow:0 2px 0 #b98a55}
#skip{pointer-events:auto;font-size:14px;padding:6px 14px}
#toast{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:calc(10px + env(safe-area-inset-left));z-index:9;pointer-events:none;display:flex;flex-direction:column;align-items:flex-start}
.tst{background:linear-gradient(#ffe7a6,#f4b52a);color:#5a2f17;border:3px solid #8f4f27;border-radius:14px;padding:6px 14px 6px 8px;font-weight:900;display:flex;align-items:center;gap:8px;animation:slideDown .45s cubic-bezier(.3,1.5,.6,1) both;box-shadow:0 5px 0 #5a2c14;margin-bottom:6px;font-size:15px;white-space:nowrap}
.tst img{width:34px;height:34px}
h2{font-size:24px;font-weight:900;color:#ffe3ad;text-shadow:0 3px 0 #3e1d0c}
.panel h2{color:#8f3f17;text-shadow:0 2px 0 #f9e3b0}
.cnt{font-size:13px;font-weight:900;color:#ffe3ad}
@media (max-width:520px){.btn.big{font-size:22px;padding:11px 34px}.loc{width:62px;height:64px;font-size:9.5px}.loc img{width:34px;height:34px}.days{gap:6px}.day{width:52px}}
@media (max-height:430px){#title .tb{gap:7px}.btn.big{font-size:20px;padding:8px 30px}.btn{padding:8px 15px;font-size:15px}.btn.sm{font-size:12px;padding:6px 10px}#hub .locs{margin-top:54px}.days{margin-top:8px}.day{height:64px}.dcard{margin-top:4px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
 <div id="title" class="screen">
  <div class="tb">
   <button id="bPlay" class="btn red big">Play</button>
   <div class="row">
    <button id="bEndless" class="btn teal">Endless Rush</button>
   </div>
   <div class="row">
    <button id="bBook" class="btn sm">Recipes</button>
    <button id="bTro" class="btn sm">Trophies</button>
    <button id="bHow" class="btn sm">How to play</button>
    <button id="bNew" class="btn sm hidden">New</button>
    <button id="bMute0" class="btn sm ibtn" aria-label="Sound"></button>
   </div>
  </div>
  <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
 </div>
 <div id="hub" class="screen hidden">
  <div class="topbar"><button class="btn sm" id="hubBack">‹</button><div class="sign" id="hubLoc">Night Market</div><div class="sign money"><i></i><span id="hubMoney">0</span></div></div>
  <div class="locs" id="locs"></div>
  <div class="days" id="days"></div>
  <div class="dcard panel" id="dcard"></div>
  <div class="bottombar"><button class="btn teal" id="hubShop">Upgrades</button><button class="btn sm" id="hubBook">Recipes</button><button class="btn sm" id="hubTro">Trophies</button></div>
 </div>
 <div id="shop" class="screen hidden dim">
  <div class="topbar"><button class="btn sm" id="shopBack">‹</button><div class="sign">Stall Shop</div><div class="sign money"><i></i><span id="shopMoney">0</span></div></div>
  <div class="tabs"><button class="btn sm on" id="tabU">Kitchen</button><button class="btn sm" id="tabD">Decor</button></div>
  <div class="grid" id="shopGrid" style="grid-template-columns:repeat(auto-fill,minmax(140px,1fr))"></div>
 </div>
 <div id="book" class="screen hidden dim">
  <div class="topbar"><button class="btn sm" id="bookBack">‹</button><div class="sign" id="bookTitle">Recipe Book</div><div class="sign cnt" id="bookCnt"></div></div>
  <div class="grid" id="bookGrid" style="margin-top:calc(62px + env(safe-area-inset-top));grid-template-columns:repeat(auto-fill,minmax(104px,1fr))"></div>
 </div>
 <div id="res" class="screen hidden dim"><div class="panel" id="resP"></div></div>
 <div id="pause" class="screen hidden dim"><div class="panel"><h2>Paused</h2><div class="btnrow"><button class="btn red" id="pResume">Resume</button></div><div class="btnrow"><button class="btn sm" id="pRestart">Restart</button><button class="btn sm" id="pQuit">Quit</button><button class="btn sm ibtn" id="bMute2" aria-label="Sound"></button></div></div></div>
 <div id="confirm" class="screen hidden dim"><div class="panel" id="confP"></div></div>
 <div id="hud" class="hidden"><button class="btn sm ibtn" id="bMute1" aria-label="Sound"></button><button class="btn sm ibtn" id="bPause" aria-label="Pause"><svg viewBox="0 0 24 24"><rect x="5" y="4" width="5" height="16" rx="2" fill="#fff6e4"/><rect x="14" y="4" width="5" height="16" rx="2" fill="#fff6e4"/></svg></button></div>
 <div id="tut" class="hidden"><div id="tutcap"></div><button class="btn sm" id="skip">Skip ›</button></div>
 <div id="toast"></div>
</div>
<script>
'use strict';
// ================= UTIL =================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const easeOutBack = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOutCubic = t => 1 - Math.pow(1 - t, 3);
const easeInOut = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const easeOutElastic = t => t <= 0 ? 0 : t >= 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - .75) * TAU / 3) + 1;
const $ = id => document.getElementById(id);
const KP = 'gamebop.noodle-rush.';
const store = {
  get(k, d) { try { const v = localStorage.getItem(KP + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(KP + k, JSON.stringify(v)); } catch (e) { } }
};
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

// ================= AUDIO =================
const AU = {
  ctx: null, muted: !!store.get('mute', false), loops: {}, nextNote: 0, step: 0, root: 220,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const C = window.AudioContext || window.webkitAudioContext; if (!C) return;
      const a = this.ctx = new C();
      this.master = a.createGain(); this.master.gain.value = this.muted ? 0 : .8;
      const comp = a.createDynamicsCompressor(); this.master.connect(comp); comp.connect(a.destination);
      const len = a.sampleRate * 2, b = a.createBuffer(1, len, a.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      this.nb = b;
      this.sfx = a.createGain(); this.sfx.connect(this.master);
      this.mus = a.createGain(); this.mus.gain.value = .55; this.mus.connect(this.master);
      this.loops.boil = this.mkLoop('bandpass', 420, 1.4);
      this.loops.sizzle = this.mkLoop('highpass', 3200, .6);
      this.loops.rain = this.mkLoop('lowpass', 1100, .4);
      this.loops.fire = this.mkLoop('lowpass', 420, .8);
      this.loops.crowd = this.mkLoop('bandpass', 700, .5);
      this.nextNote = a.currentTime + .4;
    } catch (e) { this.ctx = null; }
  },
  mkLoop(type, f, q) {
    const a = this.ctx, s = a.createBufferSource(); s.buffer = this.nb; s.loop = true;
    const fl = a.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = a.createGain(); g.gain.value = 0; s.connect(fl); fl.connect(g); g.connect(this.sfx); s.start();
    return { g, fl };
  },
  setLoop(n, v) { if (!this.ctx) return; const l = this.loops[n]; if (l) l.g.gain.setTargetAtTime(v, this.ctx.currentTime, .15); },
  setMute(m) { this.muted = m; store.set('mute', m); if (this.master) this.master.gain.setTargetAtTime(m ? 0 : .8, this.ctx.currentTime, .05); updMuteIcons(); },
  tone(f, dur, o = {}) {
    if (!this.ctx) return;
    const a = this.ctx, t = a.currentTime + (o.delay || 0), os = a.createOscillator(), g = a.createGain();
    os.type = o.type || 'sine'; os.frequency.setValueAtTime(f, t);
    if (o.to) os.frequency.exponentialRampToValueAtTime(o.to, t + (o.slide || dur));
    const v = o.vol == null ? .2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.att || .005)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    let node = os;
    if (o.lp) { const fl = a.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; os.connect(fl); node = fl; }
    node.connect(g); g.connect(o.dest || this.sfx); os.start(t); os.stop(t + dur + .05);
  },
  noise(dur, o = {}) {
    if (!this.ctx) return;
    const a = this.ctx, t = a.currentTime + (o.delay || 0), s = a.createBufferSource(); s.buffer = this.nb;
    const fl = a.createBiquadFilter(); fl.type = o.type || 'bandpass'; fl.frequency.setValueAtTime(o.f || 1000, t);
    if (o.to) fl.frequency.exponentialRampToValueAtTime(o.to, t + dur); fl.Q.value = o.q || 1;
    const g = a.createGain(), v = o.vol == null ? .2 : o.vol;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + (o.att || .003)); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl); fl.connect(g); g.connect(this.sfx); s.start(t, Math.random() * 1.5); s.stop(t + dur + .05);
  },
  play(n, p = 1) {
    if (!this.ctx || this.muted) return;
    const T = this;
    switch (n) {
      case 'pick': T.tone(480 * p, .08, { type: 'triangle', to: 720 * p, vol: .12 }); break;
      case 'drop': T.tone(320, .1, { to: 170, vol: .16 }); T.noise(.05, { f: 1800, vol: .05 }); break;
      case 'plop': T.tone(200, .2, { to: 80, vol: .28 }); T.noise(.3, { f: 900, to: 260, q: 2, vol: .14, delay: .02 }); for (let i = 0; i < 3; i++) T.tone(rnd(300, 500), .06, { to: rnd(600, 900), vol: .05, delay: .08 + i * .06 }); break;
      case 'chop': T.noise(.045, { type: 'highpass', f: 2600, vol: .32 }); T.tone(150 * p, .09, { to: 70, vol: .32 }); T.noise(.03, { f: 5000, vol: .08, delay: .01 }); break;
      case 'toss': T.noise(.55, { f: 2600, to: 1100, q: .7, vol: .26 }); T.noise(.4, { type: 'lowpass', f: 300, to: 1400, vol: .32 }); T.tone(90, .3, { to: 50, vol: .18 }); break;
      case 'ladle': T.noise(.35, { f: 700, to: 230, q: 5, vol: .3 }); T.tone(260, .25, { to: 150, vol: .07, delay: .05 }); for (let i = 0; i < 4; i++) T.tone(rnd(250, 420), .05, { to: rnd(500, 700), vol: .04, delay: .1 + i * .05 }); break;
      case 'chili': for (let i = 0; i < 4; i++) T.noise(.04, { type: 'highpass', f: 5500, vol: .14, delay: i * .045 }); break;

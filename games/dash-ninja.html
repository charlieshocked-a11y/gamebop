<style>
html,body{margin:0;height:100%;overflow:hidden;background:#12081e;touch-action:none;user-select:none;-webkit-user-select:none;font-family:'Trebuchet MS','Segoe UI',Verdana,system-ui,sans-serif;color:#fff}

<script>
'use strict';
const SLUG='dash-ninja';
const S={k:k=>'gamebop.'+SLUG+'.'+k,

const A={c:null,m:null,nb:null,muted:!!S.get('muted',false),
 init(){if(this.c)return;try{const C=window.AudioContext||window.webkitAudioContext;if(!C)return;this.c=new C();this.m=this.c.createGain();this.m.gain.value=this.muted?0:.42;this.m.connect(this.c.destination)}catch(e){this.c=null}},
 mute(v){this.muted=v;S.set('muted',v);if(this.m)this.m.gain.value=v?0:.42;drawMute()},
 t(f,d,type,vol,slide,delay){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*slide),t0+d);g.gain.setValueAtTime(vol||.12,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(this.m);o.start(t0);o.stop(t0+d+.03)}catch(e){}},
 n(d,vol,freq,delay,type){if(!this.c||this.muted)return;try{const c=this.c,t0=c.currentTime+(delay||0);if(!this.nb){const L=c.sampleRate;this.nb=c.createBuffer(1,L,L);const a=this.nb.getChannelData(0);for(let i=0;i<L;i++)a[i]=Math.random()*2-1}const s=c.createBufferSource();s.buffer=this.nb;const f=c.createBiquadFilter();f.type=type||'lowpass';f.frequency.value=freq||2000;const g=c.createGain();g.gain.setValueAtTime(vol||.2,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(f);f.connect(g);g.connect(this.m);s.start(t0);s.stop(t0+d+.03)}catch(e){}}};
const SFX={
 jump(){A.t(380,.12,'square',.07,1.8)},
 djump(){A.t(520,.14,'square',.07,1.9);A.t(780,.1,'sine',.05,1.5,.04)},
 dash(){A.n(.18,.25,5000,0,'highpass');A.t(900,.12,'sawtooth',.05,.4)},
 slash(){A.n(.12,.3,3000,0,'bandpass');A.t(200,.15,'square',.1,.4)},
 coin(){A.t(1320,.05,'square',.04,1);A.t(1760,.08,'square',.04,1,.04)},
 hurt(){A.t(220,.3,'sawtooth',.12,.4);A.n(.2,.2,800)},
 land(){A.n(.06,.08,500)},

 clear(){[523,659,784,1046,1318].forEach((f,i)=>A.t(f,.16,'square',.07,1,i*.08))},

 throw(){A.t(1400,.06,'sawtooth',.03,.6)},

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rnd=(a,b)=>a+Math.random()*(b-a);
function rng(seed){let s=(seed>>>0)||1;const f=()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296};f.i=(a,b)=>a+Math.floor(f()*(b-a+1));f.pick=a=>a[Math.floor(f()*a.length)];return f}
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

/* ---------- data ---------- */
const REG=[

 {n:'SAKURA VILLAGE',sky:['#ff9a8a','#ffe0c8'],sun:'#fff0d0',far:'#d89ab0',mid:'#a85a7a',near:'#6a2a4a',gTop:'#ffb0c8',gBody:'#5a2a3a',acc:'#ff8ac8',fx:'petal',boss:{n:'KITSUNE',c:'#ff9a2a',hp:5}},
 {n:'SNOW PEAKS',sky:['#1a2a5a','#6a8ac8'],sun:'#f0f4ff',far:'#8aa0d0',mid:'#4a5a8a',near:'#2a3460',gTop:'#f4f8ff',gBody:'#3a4468',acc:'#bfe8ff',fx:'snow',boss:{n:'YETI',c:'#d8e8ff',hp:6}},
 {n:'SHADOW FORTRESS',sky:['#0a0410','#4a0a2a'],sun:'#ff4a3a',far:'#3a1030',mid:'#2a0820',near:'#14040e',gTop:'#8a2a4a',gBody:'#24081a',acc:'#ff4a6a',fx:'ember',boss:{n:'SHOGUN',c:'#8a5aff',hp:7}}];

 {id:'frost',n:'Frost',body:'#e8f4ff',scarf:'#3ab0ff',band:'#3ab0ff',boss:2},

 {id:'phantom',n:'Phantom',body:'#5a3ae8',scarf:'#d8c8ff',band:'#fff',boss:3,ghost:1}];

let save=Object.assign({prog:[1,0,0,0],perfect:{},coins:0,up:{dash:0,heart:0,dbl:0,mag:0},outfits:['shadow'],outfit:'shadow',seen:false,best:0},S.get('save',{}));
save.up=Object.assign({dash:0,heart:0,dbl:0,mag:0},save.up);
function persist(){S.set('save',save)}

/* ---------- canvas ---------- */
const cv=$('c'),ctx=cv.getContext('2d');let W,H,DPR,SC=1,VW=1280,VH=720;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.floor(W*DPR);cv.height=Math.floor(H*DPR);SC=Math.min(H/680,W/700);VW=W/SC;VH=H/SC}

/* ---------- level ---------- */
let solids=[],ents=[],coins=[],shots=[],parts=[],floats=[],fxP=[],level=null,boss=null;
const GH=900;
function G(x,w){solids.push({x,y:0,w,h:GH,t:'g'})}
function P(x,y,w){solids.push({x,y,w,h:16,t:'p'})}
function Wl(x,h,w){solids.push({x,y:-h,w:w||46,h:h+GH,t:'w'})}
function Br(x,y,n){for(let i=0;i<n;i++)solids.push({x:x+i*40,y,w:40,h:14,t:'b',fall:0,vy:0,trig:false})}
function E(t,x,y,o){const e=Object.assign({t,x,y,vx:0,vy:0,alive:true,ph:Math.random()*6,cd:rnd(.5,1.5),y0:y},o||{});ents.push(e);return e}
function C(x,y){coins.push({x,y,got:false})}
function Carc(x,y,n,sp,h){for(let i=0;i<n;i++){const k=i/(n-1||1);C(x+i*sp,y-Math.sin(k*Math.PI)*(h||0))}}
const CHUNKS=[
 {d:1,f(x,R){G(x,520);Carc(x+120,-50,6,50,0);return 520}},
 {d:1,f(x,R){G(x,240);const gap=R.i(110,150);G(x+240+gap,300);Carc(x+180,-60,5,(gap+120)/4,90);return 540+gap}},
 {d:1,f(x,R){G(x,400);E('spk',x+200,0,{w:R.i(1,2)*40});Carc(x+170,-90,4,40,40);return 400}},
 {d:2,f(x,R){G(x,560);E('guard',x+360,0);Carc(x+100,-40,4,40,0);return 560}},
 {d:2,f(x,R){G(x,200);P(x+280,-90,140);G(x+500,260);Carc(x+290,-130,4,40,0);return 760}},
 {d:3,f(x,R){G(x,600);P(x+300,-150,180);E('thrower',x+380,-150);Carc(x+120,-40,5,40,0);return 600}},
 {d:3,f(x,R){G(x,520);E('crate',x+280,0);E('crate',x+280,-44);Carc(x+380,-40,3,40,0);return 520}},
 {d:2,f(x,R){G(x,700);P(x+180,-90,120);P(x+340,-180,120);P(x+500,-90,120);Carc(x+360,-220,3,40,0);return 700}},
 {d:4,f(x,R){G(x,160);const n=R.i(8,11);Br(x+160,0,n);G(x+160+n*40,240);Carc(x+180,-40,n-1,40,0);return 400+n*40}},
 {d:4,f(x,R){G(x,300);const h=R.i(180,250);Wl(x+300,h,60);G(x+360,300);Carc(x+300,-h-50,4,30,0);return 660}},
 {d:5,f(x,R){G(x,200);const gap=R.i(220,280);G(x+200+gap,260);E('bat',x+200+gap/2,-150);E('bat',x+200+gap/2+90,-80);Carc(x+200,-120,4,gap/4,40);return 460+gap}},
 {d:4,f(x,R){let cx=x;for(let i=0;i<3;i++){G(cx,180);cx+=180+R.i(90,120)}G(cx,160);Carc(x+150,-70,8,(cx-x)/8,0);return cx-x+160}},
 {d:5,f(x,R){G(x,700);E('spk',x+120,0,{w:440});P(x+100,-120,200);P(x+360,-160,220);Carc(x+120,-160,10,46,0);return 700}},
 {d:6,f(x,R){G(x,800);P(x+260,-140,140);E('thrower',x+320,-140);E('thrower',x+700,0);Carc(x+500,-60,4,40,0);return 800}},
 {d:5,f(x,R){G(x,520);E('saw',x+260,-26,{r:30});Carc(x+200,-140,4,40,40);return 520}},
 {d:7,f(x,R){G(x,260);Wl(x+260,200,50);const gap=R.i(150,190);Wl(x+310+gap,330,50);G(x+360+gap,320);Carc(x+300,-260,4,gap/3,0);solids.push({x:x+310,y:0,w:gap,h:GH,t:'pit'});return 680+gap}},
 {d:6,f(x,R){G(x,160);Br(x+160,0,6);E('thrower',x+620,0);G(x+400,400);return 800}},
 {d:6,f(x,R){G(x,600);E('guard',x+260,0);E('guard',x+420,0);E('bat',x+520,-110);Carc(x+200,-100,6,50,30);return 600}},
 {d:7,f(x,R){G(x,220);const gap=R.i(260,320);P(x+220+gap/2-50,-110,100);E('saw',x+220+gap/2,-230,{r:24,amp:60});G(x+220+gap,240);Carc(x+220,-150,5,gap/4,40);return 460+gap}},
 {d:8,f(x,R){G(x,700);E('saw',x+200,-26,{r:28});E('saw',x+460,-26,{r:28});E('crate',x+600,0);Carc(x+180,-150,8,40,60);return 700}},
 {d:8,f(x,R){G(x,200);Br(x+200,-60,4);Br(x+380,-140,4);Br(x+560,-60,4);G(x+720,240);E('bat',x+460,-260);return 960}},
 {d:9,f(x,R){G(x,300);const h=R.i(320,380);Wl(x+300,h,56);P(x+356,-h,220);E('thrower',x+500,-h);G(x+356,480);E('spk',x+420,0,{w:240});Carc(x+380,-h-40,5,40,0);return 836}}];

function buildStage(r,s){
 solids=[];ents=[];coins=[];shots=[];parts=[];floats=[];boss=null;
 const R=rng(r*1000+s*37+11),d=r*2.6+s*.75;
 let x=-400;G(x,1000);x+=1000;
 if(s===10){G(x,400000);level={r,s,len:x+5200,boss:true};startBoss(r,x);return}
 const n=Math.round(12+s*1.4+r*2.5);

function openMap(){state='map';demo=true;startDemo();state='map';$('bPause').style.display='none';touchUI(false);showOv('map');
 for(let r=3;r>=0;r--)if(save.prog[r]>0){curR=Math.max(0,Math.min(curR,3));break}if(!save.prog[curR])curR=0;buildMap()}
function buildMap(){const t=$('rtabs');t.innerHTML='';REG.forEach((rg,i)=>{const b=document.createElement('button');b.className='tab'+(i===curR?' sel':'')+(save.prog[i]?'':' lock');b.textContent=i+1;b.style.borderBottom='4px solid '+rg.acc;if(save.prog[i])b.onclick=()=>{curR=i;demoW=i;startDemo();state='map';SFX.click();buildMap()};t.appendChild(b)});
 $('rname').textContent=REG[curR].n;$('rname').style.color=REG[curR].acc;
 const gr=$('sgrid');gr.innerHTML='';for(let s=1;s<=10;s++){const b=document.createElement('button');const un=s<=save.prog[curR],done=s<save.prog[curR];b.className='st'+(done?' done':'')+(un?'':' lock')+(s===10?' boss':'');b.textContent=s===10?REG[curR].boss.n:s;if(save.perfect[curR+'-'+s]){const p=document.createElement('span');p.className='pf';p.textContent='★';b.appendChild(p)}if(un)b.onclick=()=>{SFX.click();startStage(curR,s)};gr.appendChild(b)}}
function upIcon(id){const c=document.createElement('canvas');c.width=c.height=88;const g=c.getContext('2d');g.scale(88/100,88/100);g.translate(50,50);g.fillStyle='#ff6a8a';g.strokeStyle='#ff6a8a';g.lineWidth=8;g.lineCap='round';g.lineJoin='round';
 if(id==='dash'){g.beginPath();g.moveTo(-34,20);g.lineTo(30,-20);g.moveTo(10,-22);g.lineTo(32,-22);g.lineTo(30,0);g.stroke();g.globalAlpha=.4;g.beginPath();g.moveTo(-34,0);g.lineTo(-10,0);g.moveTo(-30,30);g.lineTo(-14,30);g.stroke()}
 else if(id==='heart'){g.beginPath();g.moveTo(0,30);g.bezierCurveTo(-46,0,-24,-36,0,-14);g.bezierCurveTo(24,-36,46,0,0,30);g.fill()}
 else if(id==='dbl'){g.fillStyle='#8a7aff';g.strokeStyle='#8a7aff';for(let i=0;i<2;i++){g.beginPath();g.moveTo(-20,10-i*26);g.lineTo(0,-10-i*26);g.lineTo(20,10-i*26);g.stroke()}g.fillRect(-24,24,48,8)}
 else{g.strokeStyle='#ffd23a';g.lineWidth=14;g.lineCap='butt';g.beginPath();g.arc(0,4,22,Math.PI,0,true);g.stroke();g.beginPath();g.moveTo(-22,4);g.lineTo(-22,-24);g.moveTo(22,4);g.lineTo(22,-24);g.stroke();g.strokeStyle='#fff';g.beginPath();g.moveTo(-22,-14);g.lineTo(-22,-26);g.moveTo(22,-14);g.lineTo(22,-26);g.stroke()}
 return c}
function outCanvas(o){const c=document.createElement('canvas');c.width=c.height=120;const g=c.getContext('2d');g.translate(0,0);g.scale(1.6,1.6);const fake={x:34,y:66,h:44,w:26,dash:0,on:true,wall:0,run:T*3,land:0,inv:0,trail:[],scarf:Array.from({length:6},(_,i)=>({x:28-i*6,y:30+Math.sin(i)*2}))};const sv=T;drawNinja(g,fake,o);return c}
function openShop(){showOv('shop');const u=$('ups');u.innerHTML='';
 UPG.forEach(up=>{const lv=save.up[up.id],d=document.createElement('div');d.className='up';d.appendChild(upIcon(up.id));const m=document.createElement('div');m.className='mid';m.textContent=up.n;const p=document.createElement('div');p.className='pips';for(let i=0;i<up.cost.length;i++){const q=document.createElement('u');if(i<lv)q.className='f';p.appendChild(q)}m.appendChild(p);d.appendChild(m);
  const b=document.createElement('button');b.className='btn sm gn';if(lv>=up.cost.length){b.textContent='MAX';b.disabled=true}else{b.innerHTML='<span class="coin"></span>'+up.cost[lv];if(save.coins<up.cost[lv])b.disabled=true}b.onclick=()=>{if(save.coins>=up.cost[lv]){save.coins-=up.cost[lv];save.up[up.id]++;persist();SFX.coin&&SFX.coin();openShop()}};d.appendChild(b);u.appendChild(d)});
 const oc=$('outs');oc.innerHTML='';OUTFITS.forEach(o=>{const own=save.outfits.includes(o.id),d=document.createElement('div');d.className='out'+(save.outfit===o.id?' sel':'')+(own?'':' lock');d.appendChild(outCanvas(o));const n=document.createElement('div');n.innerHTML=own?o.n:(o.cost?'<span class="coin" style="width:10px;height:10px"></span>'+o.cost:REG[o.boss].boss.n);d.appendChild(n);
  d.onclick=()=>{if(own){save.outfit=o.id;persist();SFX.click();openShop()}else if(o.cost&&save.coins>=o.cost){save.coins-=o.cost;save.outfits.push(o.id);save.outfit=o.id;persist();SFX.coin();openShop()}else $('otip').textContent=o.cost?'Need '+o.cost+' coins':'Defeat '+REG[o.boss].boss.n};oc.appendChild(d)})}
function showResult(win,earned){$('bPause').style.display='none';touchUI(false);
 $('rT').textContent=win?(level.s===10?'BOSS DOWN!':'CLEAR!'):'K.O.';
 let h='<div><span class="coin"></span>+'+earned+'</div>';if(win&&hits===0)h+='<div style="color:#ffe27a">★ PERFECT</div>';if(win&&newOutfit){h+='<div style="color:#7dffb0">NEW OUTFIT!</div>';newOutfit=null}
 $('rRes').innerHTML=h;$('rNext').style.display=win&&!(level.r===3&&level.s===10)?'':'none';showOv('result')}
$('rMap').onclick=()=>{SFX.click();openMap()};
$('rRetry').onclick=()=>{SFX.click();startStage(level.r,level.s)};
$('rNext').onclick=()=>{SFX.click();let r=level.r,s=level.s+1;if(s>10){r++;s=1;curR=r}startStage(r,s)};

window.__dn={state:()=>state,pl:()=>pl,level:()=>level,save:()=>save,go:(r,s)=>startStage(r,s),warp:x=>{pl.x=x;pl.y=-400;pl.vy=0},boss:()=>boss,god:()=>{pl.hearts=99;pl.maxH=3}};

toTitle();
requestAnimationFrame(loop);
</script></body></html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Breakshot Bay</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#2a5a6e;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;pointer-events:none;z-index:5}
.scr.on{display:flex}
.scr>*{pointer-events:auto}
.btn{position:relative;font:900 20px "Trebuchet MS",Verdana,sans-serif;letter-spacing:.5px;color:#fff8e8;cursor:pointer;border:3px solid #5b3112;border-radius:16px 12px 16px 12px;padding:11px 26px;background:linear-gradient(#e7b06a,#c47d3c 60%,#a9652b);box-shadow:0 5px 0 #4f2a0f,0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.45);text-shadow:0 2px 0 #6b3a15,0 0 4px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;outline:none;min-width:170px}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 #4f2a0f,0 3px 6px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.3)}
.btn::before,.btn::after{content:"";position:absolute;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:radial-gradient(#f4e2b8,#7a5a2a);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn::before{left:8px}.btn::after{right:8px}
.btn.sea{background:linear-gradient(#73e0d2,#2fa597 60%,#1d8075);border-color:#0f4a44;box-shadow:0 5px 0 #0c3d38,0 8px 14px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.5);text-shadow:0 2px 0 #11544c}
.btn.big{font-size:26px;padding:14px 34px;min-width:230px}
.btn.sm{font-size:15px;padding:8px 14px;min-width:0}
.btn.lock{filter:grayscale(.7) brightness(.8)}
.btn small{display:block;font-size:11px;opacity:.85;letter-spacing:0}
#scTitle{justify-content:flex-end;padding-bottom:7vh;gap:10px}
#scTitle .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:820px}
#support{position:fixed;right:calc(8px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));font-size:11px;color:#fff;opacity:.55;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.6);z-index:6}
#support:hover{opacity:1}
.panel{background:linear-gradient(#f3dcae,#e3c084);border:4px solid #6b3d17;border-radius:20px 16px 22px 14px;box-shadow:0 10px 0 #4f2a0f,0 18px 40px rgba(0,0,0,.45),inset 0 0 0 3px rgba(255,255,255,.35);padding:18px 22px;color:#4a2a10;max-width:min(92vw,720px);max-height:86vh;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;animation:pop .42s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.4) rotate(-4deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.panel h2{margin:2px 0 10px;font:900 30px "Trebuchet MS",Verdana,sans-serif;color:#fff6dc;text-shadow:0 3px 0 #8a4a1a,2px 2px 0 #8a4a1a,-2px 2px 0 #8a4a1a,0 -2px 0 #8a4a1a,2px -1px 0 #8a4a1a,-2px -1px 0 #8a4a1a;letter-spacing:1px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;overflow-y:auto;padding:4px 6px 10px;width:100%;box-sizing:border-box}
.wname{grid-column:1/-1;font-weight:900;color:#7a4419;font-size:14px;letter-spacing:1px;margin-top:6px;text-transform:uppercase}
.tile{aspect-ratio:1;min-width:48px;border-radius:12px;border:3px solid #6b3d17;background:linear-gradient(#5fd0c2,#2a9486);box-shadow:0 4px 0 #3d2410;color:#fff;font:900 20px "Trebuchet MS",Verdana,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;text-shadow:0 2px 0 #145a52}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 #3d2410}
.tile.boss{background:linear-gradient(#ff8a6a,#c6402b);text-shadow:0 2px 0 #6a1b10}
.tile.locked{background:linear-gradient(#9a8a74,#6e604f);cursor:default;color:#d8cbb4;text-shadow:none}
.tile .st{display:flex;gap:1px;margin-top:2px}
.tile svg{width:13px;height:13px}
.tile .crown{position:absolute;top:-9px;width:22px;height:14px}
.stars{display:flex;gap:10px;margin:4px 0 8px}
.stars svg{width:64px;height:64px;filter:drop-shadow(0 3px 0 rgba(90,45,10,.6))}
.stars svg.on{animation:starpop .5s cubic-bezier(.2,1.8,.4,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}100%{transform:scale(1) rotate(0)}}
.shells{font:900 24px "Trebuchet MS",Verdana,sans-serif;color:#7a4419;display:flex;align-items:center;gap:6px}
.tease{display:flex;align-items:center;gap:10px;margin:10px 0;background:rgba(255,255,255,.35);border-radius:12px;padding:6px 12px;font-weight:900;color:#6b3d17}
.tease canvas{width:56px;height:56px}
.brow{display:flex;gap:10px;margin-top:8px;flex-wrap:wrap;justify-content:center}
#hud{position:fixed;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:none;gap:7px;z-index:6}
#hud.on{display:flex}
.hb{width:42px;height:42px;border-radius:50%;border:3px solid #5b3112;background:radial-gradient(circle at 40% 35%,#f0c27f,#b9733a);box-shadow:0 4px 0 #4f2a0f,0 5px 10px rgba(0,0,0,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 #4f2a0f}
.hb svg{width:22px;height:22px;fill:#fff8e8;stroke:#fff8e8}
#skip{position:fixed;right:calc(12px + env(safe-area-inset-right));bottom:calc(12px + env(safe-area-inset-bottom));display:none;z-index:7}
#skip.on{display:block}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tab{opacity:.65}.tab.cur{opacity:1}
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;overflow-y:auto;width:100%;padding:4px;box-sizing:border-box}
.item{background:rgba(255,255,255,.4);border:3px solid #a06a35;border-radius:14px;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:13px;color:#5a3112}
.item canvas{width:120px;height:60px}
.item.eq{border-color:#1d8075;background:rgba(115,224,210,.35)}
.wallet{font:900 18px "Trebuchet MS",Verdana,sans-serif;color:#7a4419;display:flex;align-items:center;gap:5px;margin-bottom:6px}
.shellico{width:22px;height:22px;display:inline-block;vertical-align:middle}
#topShells{position:fixed;left:calc(12px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));z-index:6;font:900 18px "Trebuchet MS",Verdana,sans-serif;color:#fff;text-shadow:0 2px 0 #5b3112,0 0 4px #000;display:none;align-items:center;gap:5px}
#topShells.on{display:flex}
@media (max-width:520px){.btn{font-size:17px;min-width:140px;padding:10px 18px}.btn.big{font-size:22px;min-width:200px}.grid{gap:5px;padding:4px 2px 8px}.tile{min-width:0;font-size:16px;border-width:2px}.tile svg{width:9px;height:9px}.panel{padding:14px 12px}.panel h2{font-size:25px}.stars svg{width:52px;height:52px}#scTitle{padding-bottom:5vh}}
@media (max-height:520px){.btn{font-size:15px;padding:7px 12px;min-width:118px}.btn.big{font-size:20px;padding:8px 26px;min-width:170px}#scTitle{padding-bottom:3vh;gap:7px}.btn small{font-size:9px}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="topShells"><svg class="shellico" viewBox="0 0 24 24"><use href="#shellS"/></svg><span id="tsN">0</span></div>
<div id="scTitle" class="scr">
  <button class="btn sea big" id="bPlay">Play</button>
  <div class="row">
    <button class="btn" id="bLevels">Tables</button>
    <button class="btn" id="bSpeed">Speed Rack</button>
    <button class="btn" id="bShop">Cue Shop</button>
    <button class="btn" id="bHow">How to play</button>
  </div>
  <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support ♥</a>
</div>
<div id="scLevels" class="scr"><div class="panel" style="width:min(92vw,640px)"><h2>Pick a Table</h2><div class="grid" id="lvGrid"></div><div class="brow"><button class="btn sm" id="bLvBack">◀ Back</button></div></div></div>
<div id="scShop" class="scr"><div class="panel" style="width:min(94vw,700px)"><h2>Cue Shop</h2><div class="wallet"><svg class="shellico" viewBox="0 0 24 24"><use href="#shellS"/></svg><span id="shopN">0</span></div><div class="tabs"><button class="btn sm tab cur" id="tCues">Cues</button><button class="btn sm tab" id="tTables">Felts</button></div><div class="shopgrid" id="shopGrid"></div><div class="brow"><button class="btn sm" id="bShopBack">◀ Back</button></div></div></div>
<div id="scRes" class="scr"><div class="panel" id="resPanel"></div></div>
<div id="scPause" class="scr"><div class="panel"><h2>Paused</h2><div class="brow" style="flex-direction:column;align-items:center"><button class="btn sea big" id="bResume">Resume</button><button class="btn" id="bPRestart">Restart</button><button class="btn" id="bPMenu">Menu</button></div></div></div>
<div id="hud"><button class="hb" id="hRestart" title="Restart (R)"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button><button class="hb" id="hMute" title="Mute (M)"><svg viewBox="0 0 24 24" id="muteIco"></svg></button><button class="hb" id="hPause" title="Pause (P)"><svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button></div>
<button class="btn sm" id="skip">Skip ▶▶</button>
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="starS" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.8-5.4 4.9 1.5 7.1L12 17.6l-6.4 3.6 1.5-7.1L1.7 9.2l7.2-.8z"/></symbol>
<symbol id="shellS" viewBox="0 0 24 24"><path d="M12 3C6.5 3 2.5 7.5 2.5 12.5c0 1.5.6 2.8 1.6 3.6L9 19.5h6l4.9-3.4c1-.8 1.6-2.1 1.6-3.6C21.5 7.5 17.5 3 12 3z" fill="#ffb27a" stroke="#8a3f1a" stroke-width="1.4"/><path d="M12 4.5v14M8 5.5l2 13M16 5.5l-2 13M4.8 9l5 9.5M19.2 9l-5 9.5" stroke="#c4622e" stroke-width="1.1" fill="none"/><rect x="9" y="19" width="6" height="2.5" rx="1" fill="#e8945e" stroke="#8a3f1a" stroke-width="1"/></symbol>
</defs></svg>
<script>
'use strict';
/* ============ storage ============ */
const SLUG='breakshot-bay',PFX='gamebop.'+SLUG+'.';
const store={get(k,d){try{const v=localStorage.getItem(PFX+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v));}catch(e){}}};
const DEF={v:1,unlocked:1,stars:[],shells:0,cues:[0],cue:0,tables:[0],table:0,speedBest:0,tut:false,golds:0,played:false,last:0,bossWins:[]};
let save=Object.assign({},DEF,store.get('save',{})||{});
['stars','cues','tables','bossWins'].forEach(k=>{if(!Array.isArray(save[k]))save[k]=DEF[k].slice();});
function persist(){store.set('save',save);}
let muted=!!store.get('mute',false);

/* ============ math ============ */
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,hyp=Math.hypot;
const easeOut=t=>1-Math.pow(1-t,3),easeBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
const wrapA=a=>{while(a>Math.PI)a-=TAU;while(a<-Math.PI)a+=TAU;return a;};
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ============ audio ============ */
const A={c:null,last:{}};
function audioInit(){
  if(A.c){if(A.c.state==='suspended')A.c.resume();return;}
  const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
  try{A.c=new C();}catch(e){return;}
  const c=A.c;A.out=c.createGain();A.out.gain.value=muted?0:1;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-12;comp.ratio.value=4;
  A.out.connect(comp);comp.connect(c.destination);
  A.sfx=c.createGain();A.sfx.gain.value=.9;A.sfx.connect(A.out);
  A.mus=c.createGain();A.mus.gain.value=.16;A.mus.connect(A.out);
  const len=c.sampleRate*2;A.nb=c.createBuffer(1,len,c.sampleRate);const d=A.nb.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  // ambient sea
  try{const s=c.createBufferSource();s.buffer=A.nb;s.loop=true;s.playbackRate.value=.5;const f=c.createBiquadFilter();f.type='lowpass';f.frequency.value=380;const g=c.createGain();g.gain.value=.05;const l=c.createOscillator();l.frequency.value=.11;const lg=c.createGain();lg.gain.value=.035;l.connect(lg);lg.connect(g.gain);s.connect(f);f.connect(g);g.connect(A.out);s.start();l.start();}catch(e){}
  startMusic();
}
function thr(k,ms){const n=performance.now();if(A.last[k]&&n-A.last[k]<ms)return false;A.last[k]=n;return true;}
function env(g,t,a,p,dur){g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);}
function tone(f,dur,o){o=o||{};const c=A.c;if(!c)return;const t=c.currentTime+(o.d||0);const s=c.createOscillator();s.type=o.type||'sine';s.frequency.setValueAtTime(f,t);if(o.f2)s.frequency.exponentialRampToValueAtTime(o.f2,t+dur);const g=c.createGain();env(g,t,o.a||.003,o.v||.3,dur);let n=s;if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;s.connect(fl);n=fl;}n.connect(g);g.connect(o.out||A.sfx);s.start(t);s.stop(t+dur+.05);}
function noise(dur,o){o=o||{};const c=A.c;if(!c)return;const t=c.currentTime+(o.d||0);const s=c.createBufferSource();s.buffer=A.nb;s.playbackRate.value=o.rate||1;const f=c.createBiquadFilter();f.type=o.ft||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.f2)f.frequency.exponentialRampToValueAtTime(o.f2,t+dur);f.Q.value=o.q||1;const g=c.createGain();env(g,t,o.a||.002,o.v||.3,dur);s.connect(f);f.connect(g);g.connect(o.out||A.sfx);s.start(t,Math.random()*1.5);s.stop(t+dur+.05);}
const midi=m=>440*Math.pow(2,(m-69)/12);
const S={
  click(i){if(!thr('click',28))return;i=clamp(i,.05,1);const p=rnd(.92,1.08);noise(.03,{f:3600*p,q:3,v:.55*i});tone(2400*p,.035,{type:'triangle',v:.16*i});tone(1250*p,.05,{v:.1*i});},
  cue(p){noise(.05,{f:1500,q:1.5,v:.35+.3*p});tone(520,.07,{type:'triangle',f2:260,v:.22});tone(180,.08,{v:.2*p});},
  rail(i){if(!thr('rail',40))return;i=clamp(i,.08,1);tone(120*rnd(.9,1.1),.14,{f2:75,v:.32*i});noise(.06,{ft:'lowpass',f:500,v:.25*i});},
  rattle(soft){tone(rnd(700,950),.04,{type:'triangle',v:soft?.08:.14});noise(.03,{f:2200,q:4,v:soft?.12:.22});},
  thunk(){tone(115,.3,{f2:52,v:.55});noise(.18,{ft:'lowpass',f:360,v:.45});tone(230,.09,{type:'triangle',f2:140,v:.2,d:.01});},
  bump(){tone(330,.16,{type:'square',f2:720,v:.07,lp:1800});tone(220,.22,{f2:520,v:.22});},
  boom(){noise(.8,{ft:'lowpass',f:1400,f2:90,v:.9,q:.7});tone(90,.6,{f2:28,v:.7});noise(.25,{f:3000,q:.6,v:.3});},
  cheer(big){const d=big?2.4:1.3;noise(d,{f:1300,q:.8,v:big?.32:.18,a:.25});noise(d*.9,{f:2300,q:1.2,v:big?.16:.08,a:.3});for(let i=0;i<(big?26:10);i++)noise(.025,{ft:'highpass',f:1800,v:rnd(.15,.32),d:rnd(.05,d*.8)});if(big){tone(1900,.25,{f2:2600,v:.06,d:.3});tone(2100,.3,{f2:2900,v:.05,d:.9});}},
  aww(){noise(1.1,{f:700,f2:320,q:1.2,v:.22,a:.15});},
  fanfare(){[72,76,79,84].forEach((m,i)=>tone(midi(m),.22,{type:'triangle',v:.2,d:i*.11}));[72,76,79].forEach(m=>tone(midi(m),.7,{type:'triangle',v:.12,d:.46}));tone(midi(96),.5,{v:.06,d:.5});},
  star(i){const f=midi(76+i*4);tone(f,.5,{type:'triangle',v:.22});tone(f*2,.4,{v:.08});tone(f*3,.25,{v:.04});},
  coin(){tone(1320,.08,{type:'square',v:.06,lp:3000});tone(1760,.14,{type:'square',v:.06,lp:3000,d:.07});},
  gull(){for(let k=0;k<2;k++){tone(1500,.16,{type:'sawtooth',f2:900,v:.07,lp:2600,d:k*.2});tone(1250,.1,{type:'sawtooth',f2:1500,v:.05,lp:2600,d:k*.2+.12});}},
  hiss(){noise(.55,{ft:'highpass',f:3500,v:.28,a:.03});tone(620,.25,{type:'sawtooth',f2:420,v:.05,lp:1500,d:.05});},
  meow(){tone(620,.35,{type:'sawtooth',f2:460,v:.06,lp:1400});},
  splash(){noise(.45,{f:1100,f2:300,q:.8,v:.35});noise(.2,{ft:'highpass',f:3000,v:.12,d:.05});},
  portal(){tone(260,.3,{f2:1100,v:.16});tone(390,.3,{type:'triangle',f2:1500,v:.08,d:.04});},
  gulp(){tone(320,.18,{f2:110,v:.4});tone(160,.2,{type:'triangle',f2:90,v:.25,d:.12});noise(.12,{f:600,v:.2,d:.15});},
  pop(){tone(500,.08,{f2:900,v:.15});},
  crab(){noise(.02,{f:4200,q:5,v:.25});noise(.02,{f:3900,q:5,v:.2,d:.06});},
  ui(){tone(880,.04,{type:'triangle',v:.12});noise(.02,{f:2500,v:.1});},
  tick(p){if(!thr('tick',45))return;tone(400+p*900,.03,{type:'triangle',v:.06});},
  fail(){[67,63,58].forEach((m,i)=>tone(midi(m),.32,{type:'triangle',v:.16,d:i*.22}));},
  combo(n){tone(midi(72+n*3),.18,{type:'square',v:.07,lp:2500});tone(midi(79+n*3),.22,{type:'triangle',v:.1,d:.05});},
  thunder(){noise(2.2,{ft:'lowpass',f:500,f2:80,v:.5,a:.08});}
};
function startMusic(){const c=A.c;let next=c.currentTime+.4,step=0;const sp=60/92/2;const prog=[[60,64,67],[55,59,62],[57,60,64],[53,57,60]];const pat=[0,1,2,1,0,2,1,2];
  setInterval(()=>{if(!A.c)return;while(next<c.currentTime+.35){const bar=Math.floor(step/8)%4,ch=prog[bar],i=step%8;if(!muted&&!document.hidden){pluck(midi(ch[pat[i]]+12),next,i%4===0?.13:.08);if(i===0)pluck(midi(ch[0]-12),next,.16,.8);if(i===6&&step%32>15)pluck(midi(ch[2]+24),next,.05,.3);}next+=sp;step++;}},90);}
function pluck(f,t,v,dur){dur=dur||.35;const c=A.c;const o=c.createOscillator();o.type='triangle';o.frequency.value=f;const o2=c.createOscillator();o2.type='sine';o2.frequency.value=f*2.003;const g=c.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);const g2=c.createGain();g2.gain.value=.3;o.connect(g);o2.connect(g2);g2.connect(g);g.connect(A.mus);o.start(t);o2.start(t);o.stop(t+dur+.05);o2.stop(t+dur+.05);}
function setMute(m){muted=m;store.set('mute',m);if(A.out)A.out.gain.setTargetAtTime(m?0:1,A.c.currentTime,.02);drawMuteIco();}

/* ============ table / levels ============ */
const W=1000,H=560,R=15,FR=42,STEP=1/300;

function pathLen(p){let l=0;for(let i=0;i<p.length-1;i++)l+=hyp(p[i+1][0]-p[i][0],p[i+1][1]-p[i][1]);return l;}
function pathPos(p,d){for(let i=0;i<p.length-1;i++){const a=p[i],b=p[i+1],l=hyp(b[0]-a[0],b[1]-a[1]);if(d<=l||i===p.length-2){const k=l?clamp(d/l,0,1):0;return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];}d-=l;}return p[0];}
function srand(s){s.seed=(Math.imul(s.seed,1664525)+1013904223)>>>0;return s.seed/4294967296;}
function addBall(s,x,y,type){const b={id:s.id++,x,y,vx:0,vy:0,type,on:true,drop:null,fuse:-1,pc:null,rail:0,num:0};if(type==='t')b.num=(s.nt++%7)+1;s.balls.push(b);return b;}
function buildSim(L,seed){

  addBall(s,L.cue[0],L.cue[1],'c');
  (L.t||[]).forEach(p=>addBall(s,p[0],p[1],'t'));
  (L.b||[]).forEach(p=>addBall(s,p[0],p[1],'b'));
  (L.k||[]).forEach(p=>addBall(s,p[0],p[1],'k'));
  (L.pockets||['tl','tm','tr','bl','bm','br']).forEach(id=>{const p=PK[id];s.pockets.push({id,kind:'rail',x:p.x,y:p.y,w:p.w,c:!!p.c,m:p.c?34:28,r:p.c?31:27});});
  (L.slides||[]).forEach((sl,i)=>s.pockets.push({id:'s'+i,kind:'rail',x:sl.x0,y:sl.wall==='T'?0:H,w:[sl.wall],c:false,m:28,r:27,slide:sl}));
  (L.portals||[]).forEach((p,i)=>{s.pockets.push({id:'pa'+i,kind:'portal',x:p[0],y:p[1],r:30,link:'pb'+i,hue:i},{id:'pb'+i,kind:'portal',x:p[2],y:p[3],r:30,link:'pa'+i,hue:i});});
  (L.bump||[]).forEach(b=>s.bumps.push({x:b[0],y:b[1],r:b[2]||28,vx:0,vy:0}));
  (L.crabs||[]).forEach((c,i)=>s.crabs.push({path:c.path,sp:c.sp||100,off:c.off||0,x:c.path[0][0],y:c.path[0][1],vx:0,vy:0,r:24,len:pathLen(c.path),i}));
  if(L.cat)s.cat={x:L.cat[0],y:L.cat[1],r:40,st:'sleep',tm:0,vx:0,vy:0,fx:0,fy:0,tx:0,ty:0};
  if(L.boss){const B=L.boss;s.boss={kind:B.kind,hp:B.hp,max:B.hp,ph:0,sp:1,hurt:0,cx:B.cx,cy:B.cy,ax:B.ax,ay:B.ay,fx:B.fx,fy:B.fy,r:B.r,face:B.face,arms:B.arms,x:B.cx,y:B.cy,vx:0,vy:0,parts:B.arms.map(a=>({x:0,y:0,vx:0,vy:0,r:a.r}))};s.pockets.push({id:'mouth',kind:'mouth',x:0,y:0,r:33});s.goal=B.hp;}

function pk(s,id){for(const p of s.pockets)if(p.id===id)return p;return null;}
function ev(s,k,o){if(s.quiet)return;o.k=k;s.ev.push(o);}
function updMovers(s,dt){
  for(const p of s.pockets)if(p.slide){const sl=p.slide;p.x=sl.x0+(sl.x1-sl.x0)*(.5-.5*Math.cos(TAU*s.t/sl.per+(sl.ph||0)));}

    B.arms.forEach((a,i)=>{const q=B.parts[i];const ang=B.face+a.a+(a.rot||0)*B.ph+(a.osc?a.osc*Math.sin(s.t*2.6):0);const px=B.x+Math.cos(ang)*a.d,py=B.y+Math.sin(ang)*a.d;if(dt>0){q.vx=(px-q.x)/dt;q.vy=(py-q.y)/dt;}q.x=px;q.y=py;q.ang=ang;});}

}
function freeSpot(s,clr,cat){
  const B=s.boss;
  for(let i=0;i<80;i++){const x=80+srand(s)*(B?Math.max(120,B.cx-B.ax-B.r-200):840),y=70+srand(s)*420;let ok=true;
    for(const b of s.balls)if(b.on&&!b.drop&&hyp(b.x-x,b.y-y)<clr+R+4){ok=false;break;}
    if(ok)for(const o of s.bumps)if(hyp(o.x-x,o.y-y)<o.r+clr+4){ok=false;break;}
    if(ok)for(const p of s.pockets)if(hyp(p.x-x,p.y-y)<(p.kind==='rail'?75:p.r+clr+10)){ok=false;break;}
    if(ok&&s.cat&&!cat&&hyp(s.cat.x-x,s.cat.y-y)<s.cat.r+clr+6)ok=false;
    if(ok)for(const c of s.crabs)if(Math.abs(c.x-x)<60&&Math.abs(c.y-y)<60)ok=false;
    if(ok)return[x,y];}
  return[250,280];
}
function kin(s,b,o,e,kind,ref){
  const dx=b.x-o.x,dy=b.y-o.y,rr=o.r+R,d2=dx*dx+dy*dy;if(d2>=rr*rr)return 0;
  const d=Math.sqrt(d2)||.01,nx=dx/d,ny=dy/d;b.x=o.x+nx*rr;b.y=o.y+ny*rr;
  const ux=o.vx||0,uy=o.vy||0;let rvx=b.vx-ux,rvy=b.vy-uy;const vn=rvx*nx+rvy*ny;
  if(vn<0){rvx-=(1+e)*vn*nx;rvy-=(1+e)*vn*ny;b.vx=rvx+ux;b.vy=rvy+uy;ev(s,kind,{x:o.x+nx*o.r,y:o.y+ny*o.r,v:-vn,ref,nx,ny,b});return -vn;}
  return 0;
}
function inMouth(s,b,w){for(const p of s.pockets){if(p.kind!=='rail'||p.w.indexOf(w)<0)continue;const t=(w==='T'||w==='B')?Math.abs(b.x-p.x):Math.abs(b.y-p.y);if(t<p.m)return p;}return null;}
function capture(s,b,p){
  b.drop={pid:p.id,t:0,ox:b.x-p.x,oy:b.y-p.y,sp:hyp(b.vx,b.vy)};b.vx=b.vy=0;b.fuse=-1;
  let fin=false;
  if(b.type==='c')s.cueIn=true;
  else if(b.type==='k')s.black=true;
  else if(b.type==='t'){
    if(p.kind==='mouth'){s.boss.hp--;s.boss.sp*=1.16;s.boss.hurt=.9;s.potted++;fin=s.potted>=s.goal;}
    else if(s.boss){b.respawn=true;}
    else{s.potted++;fin=s.potted>=s.goal&&s.mode!=='speed';if(s.mode==='speed')b.respawn=false;}
  }
  ev(s,'pot',{b,p,x:p.x,y:p.y,type:b.type,gold:b.gold,bank:b.rail>0,fin,mouth:p.kind==='mouth'});
}
function explode(s,b){
  b.on=false;b.fuse=-1;ev(s,'boom',{x:b.x,y:b.y});
  for(const o of s.balls){if(!o.on||o.drop||o===b)continue;const dx=o.x-b.x,dy=o.y-b.y,d=hyp(dx,dy)||1;if(d<230){const f=1500*(1-d/230)+250;o.vx+=dx/d*f;o.vy+=dy/d*f;if(o.type==='b'&&o.fuse<0)o.fuse=.14;}}

}
function arm(s,b,v){if(b.type==='b'&&b.fuse<0&&v>90){b.fuse=.32;ev(s,'fuse',{b});}}
function dropStep(s,b,dt){

/* ---------- fx helpers ---------- */
function puff(x,y,n,col,sp,life,size){for(let i=0;i<n;i++){const a=Math.random()*TAU,v=sp*(.3+Math.random()*.7);G.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:life*(.6+Math.random()*.6),ml:life,s:size*(.6+Math.random()*.6),c:col,k:'dot'});}}

function popText(x,y,txt,col,size){G.texts.push({x,y,txt,col:col||'#fff',l:1.3,ml:1.3,s:size||26});}
function confetti(n,x,y){const cols=['#f2c014','#e0523f','#2fa597','#2364d2','#ffffff','#ff8ad0'];for(let i=0;i<n;i++){const burst=x!=null;G.conf.push({x:burst?x:rnd(0,cw),y:burst?y:rnd(-60,-5),vx:burst?rnd(-320,320):rnd(-60,60),vy:burst?rnd(-620,-200):rnd(60,240),rot:rnd(0,TAU),vr:rnd(-12,12),w:rnd(6,11),h:rnd(3,6),c:cols[i%6],l:rnd(2,3.4)});}}
function spinBalls(s){
  for(const b of s.balls){
    if(!b.spot){const a=Math.random()*TAU,z=Math.random()*.5+.4,r=Math.sqrt(1-z*z);b.spot=[Math.cos(a)*r,Math.sin(a)*r,z];b.lx=b.x;b.ly=b.y;}
    const dx=b.x-b.lx,dy=b.y-b.ly,d=hyp(dx,dy);b.lx=b.x;b.ly=b.y;if(d<1e-4||d>90||b.drop)continue;
    const kx=-dy/d,ky=dx/d,th=d/R,c=Math.cos(th),sn=Math.sin(th),v=b.spot;
    const cx=ky*v[2],cy=-kx*v[2],cz=kx*v[1]-ky*v[0],kd=kx*v[0]+ky*v[1];

/* ---------- events ---------- */
function procEvents(s,silent){
  for(const e of s.ev){
    switch(e.k){
      case'hit':{const i=e.v/1700;if(!silent)S.click(i);const q=Math.min(1,i*1.3);for(const b of[e.a,e.b]){b.sq=Math.max(b.sq||0,q);b.sqx=e.nx;b.sqy=e.ny;}if(e.v>450)puff(e.x,e.y,4,'255,255,255',140*i,.25,2.6);if(e.v>1500&&!silent)G.hitstop=Math.max(G.hitstop,.04);if(!silent)G.shake+=i*2.5;break;}
      case'rail':{const i=e.v/1800;if(!silent)S.rail(i);if(e.v>300)puff(e.x+e.nx*3,e.y+e.ny*3,5,'225,250,225',100*i,.3,3);e.b.sq=Math.max(e.b.sq||0,Math.min(.8,i));e.b.sqx=e.nx;e.b.sqy=e.ny;if(!silent)G.shake+=i*1.4;break;}
      case'bump':e.ref.fl=1;if(!silent){S.bump();G.shake+=2;}puff(e.x,e.y,8,'255,240,150',260,.35,3);break;
      case'crab':e.ref.ouch=.6;if(!silent&&thr('crabh',180)){S.crab();popText(e.ref.x,e.ref.y-40,'Pinch!','#ffd0b0',18);}break;
      case'boss':case'arm':if(!silent)S.rail(e.v/1500);if(e.ref)e.ref.hitT=.3;break;
      case'cat':if(!silent){S.hiss();G.shake+=3;}popText(e.x,e.y-50,'HSSS!','#ffd0a0',26);break;
      case'catland':if(!silent)S.meow();puff(e.x,e.y,10,'255,255,255',140,.4,4);popText(e.x,e.y-46,'zzz','#e8f0ff',18);break;
      case'fuse':if(!silent)S.tick(1);break;
      case'pot':if(!silent)onPot(e);else G.pflash[e.p.id]=1;break;
      case'rattle':if(!silent)S.rattle(e.soft);break;
      case'thunk':G.pflash[e.p.id]=1;ring(e.x,e.y,'255,255,255',20,60,.4,4);if(e.b.type==='t'){for(let i=0;i<12;i++){const a=i/12*TAU,v=rnd(160,320);G.fx.push({x:e.x,y:e.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:.6,ml:.6,s:rnd(5,8),c:e.b.gold?'255,220,60':'255,245,170',k:'star'});}}if(!silent){S.thunk();G.shake+=2.5;if(e.p.kind==='rail'&&e.b.type==='t'&&(Math.random()<.22||e.b.gold))spawnFish(e.p);}break;
      case'boom':if(!silent){S.boom();G.hitstop=.09;G.shake+=16;G.boomT=1.3;}puff(e.x,e.y,30,'255,170,60',520,.5,7);puff(e.x,e.y,18,'90,80,80',220,.9,10);ring(e.x,e.y,'255,230,160',20,230,.45,8);break;
      case'portal':if(!silent)S.portal();ring(e.x,e.y,'120,255,240',10,50,.4,4);ring(e.x2,e.y2,'120,255,240',50,10,.4,4);G.pflash[e.b.id+'w']=1;e.b.warp=1;break;
      case'break':if(!silent){S.boom();G.shake+=10;G.hitstop=.06;popText(e.x,e.y-30,'BREAK!','#fff3a0',34);}puff(e.x,e.y,20,'255,255,255',380,.4,3);ring(e.x,e.y,'255,255,255',10,120,.35,5);break;
      case'spawn':e.b.pop=1;if(!silent)S.pop();ring(e.b.x,e.b.y,'255,255,255',8,40,.4,3);break;
    }
  }
  s.ev.length=0;

function onPot(e){
  const s=G.sim,b=e.b;G.pflash[e.p.id]=1;
  if(b.type==='c'){popText(e.x,e.y,'Scratch!','#ffb0a0',24);if(G.mode==='speed'){G.speed.time=Math.max(0,G.speed.time-3);popText(e.x,e.y+30,'-3s','#ff8080',20);}return;}
  if(b.type==='k'){if(G.mode==='speed'){G.speed.time=Math.max(0,G.speed.time-6);popText(e.x,e.y,'8-BALL! -6s','#ff8080',26);S.fail();return;}popText(e.x,e.y,'Oh no! The 8!','#ff8080',28);S.fail();G.aww=2;return;}
  if(b.type==='b'){popText(e.x,e.y,'fizzle...','#ddd',18);return;}
  if(s.boss&&!e.mouth){popText(e.x,e.y,'Feed the boss!','#fff',20);return;}
  G.shotPots++;G.cheer=Math.max(G.cheer,1.2);S.cheer(false);
  let label=e.mouth?'GULP!':'+1',col='#ffffff',sz=26;
  if(e.mouth){S.gulp();G.shake+=8;G.hitstop=Math.max(G.hitstop,.06);puff(e.x,e.y,16,'255,240,180',300,.5,4);}
  if(G.shotPots>=2){label=['','','DOUBLE!','TRIPLE!','MEGA x4!','INSANE x5!'][Math.min(5,G.shotPots)]||'x'+G.shotPots+'!';col='#ffe060';sz=30+G.shotPots*2;S.combo(G.shotPots);}
  else if(b.warp){label='WARP SHOT!';col='#8ffff0';}
  else if(e.bank){label='BANK SHOT!';col='#a8ffb0';}
  if(G.boomT>0&&G.shotPots<2){label='KABOOM!';col='#ffb060';}
  if(G.mode==='speed'){const pts=(1+G.speed.streak)*(b.gold?5:1);G.speed.score+=pts;G.speed.time+=b.gold?4:2;label='+'+pts+(G.speed.streak?' x'+(G.speed.streak+1):'');}
  if(b.gold){save.shells+=30;save.golds++;persist();S.fanfare();const p=w2s(e.x,e.y);confetti(60,p[0],p[1]);popText(e.x,e.y-34,'GOLDEN! +30','#ffe060',30);}
  popText(e.x,e.y,label,col,sz+4);
  if(e.fin){G.finalPot=true;G.winT=0;G.hitstop=Math.max(G.hitstop,.07);S.cheer(true);G.cheer=3.5;G.tsT=.3;G.slowT=.7;G.slowP={x:e.x,y:e.y};const p=w2s(e.x,e.y);confetti(80,p[0],p[1]);}
}

function startTable(L,mode){
  G.mode=mode;G.L=L;G.sim=buildSim(L,(Math.random()*1e9)|0);G.phase='aim';G.shots=0;G.winT=-1;G.resT=-1;G.finalPot=false;
  G.fx.length=0;G.texts.length=0;G.fish.length=0;G.gull=null;G.ts=G.tsT=1;G.slowT=0;G.slowP=null;G.acc=0;G.drag=null;G.charge=null;G.stick=null;
  G.shotPots=0;G.pflash={};G.boomT=0;G.hitstop=0;CAM.z=1;CAM.fx=W/2;CAM.fy=H/2;G.paused=false;G.keyRot=0;
  G.theme=mode==='level'?Math.min(4,Math.floor(L.n/6)):mode==='speed'?1:0;bgKey='';tableKey='';
  const s=G.sim;G.gullPlan=0;
  if(mode==='level'){
    if(L.n>=2&&!L.boss&&Math.random()<.16){const ts=s.balls.filter(b=>b.type==='t');if(ts.length)ts[(Math.random()*ts.length)|0].gold=true;}
    if(L.gull)G.gullPlan=1;else if(L.n>=3&&!L.boss&&Math.random()<.4)G.gullPlan=1+Math.floor(Math.random()*Math.max(1,L.lim-1));
    G.banner={t:0,title:'LEVEL '+(L.n+1),sub:L.name,nw:L.nw};
  }else if(mode==='speed')G.banner={t:0,title:'SPEED RACK',sub:'Pot fast! +2s per ball',nw:{k:'ball',l:'Chain pots for multipliers'}};
  else G.banner=null;
  G.cand=cands(s);autoAim();
  setScr('play');
}
function startLevel(n){n=clamp(n,0,LV.length-1);startTable(LV[n],'level');}
function startTut(from){G.tut={step:0,from};startTable(TUT[0],'tut');}
function tutNext(){G.tut.step++;if(G.tut.step>=TUT.length)finishTut();else startTable(TUT[G.tut.step],'tut');}
function finishTut(){save.tut=true;save.played=true;persist();if(G.tut&&G.tut.from==='menu')toTitle();else startLevel(0);}
function restart(){if(G.mode==='level')startLevel(G.L.n);else if(G.mode==='speed')startSpeed();else if(G.mode==='tut')startTable(TUT[G.tut.step],'tut');}
function startSpeed(){const L={name:'Speed Rack',mode:'speed',goal:99999,lim:99999,par:0,cue:[250,280],t:[],n:-1};startTable(L,'speed');G.speed={time:45,score:0,streak:0,haz:0,over:false,lastSec:99};for(let i=0;i<6;i++)spawnT();G.cand=cands(G.sim);autoAim();}
function spawnT(type){const s=G.sim;const q=freeSpot(s,32);const b=addBall(s,q[0],q[1],type||'t');b.pop=1;if(!type&&Math.random()<.08)b.gold=true;return b;}
const HAZ=['bump','crab','bomb','black','bump','ice','crab','bomb','black','bump'];
function addHazard(i){const s=G.sim,k=HAZ[i%HAZ.length];let l='';
  if(k==='bump'){const q=freeSpot(s,60);s.bumps.push({x:q[0],y:q[1],r:26,vx:0,vy:0});l='Buoy dropped in!';}
  else if(k==='crab'){const x=300+Math.random()*450;const c={path:[[x,70],[x,490]],sp:90+i*8,off:Math.random()*300,x,y:70,vx:0,vy:0,r:24,i:s.crabs.length};c.len=pathLen(c.path);s.crabs.push(c);l='A crab joins!';}
  else if(k==='bomb'){spawnT('b');l='Bomb ball!';}
  else if(k==='black'){spawnT('k');l="Avoid the 8!";}
  else if(k==='ice'){s.ice=!s.ice;G.L.ice=s.ice;tableKey='';l=s.ice?'Ice felt!':'Felt is back';}
  G.banner={t:0,title:'WAVE '+(i+2),sub:l,nw:{k:k==='bump'?'bump':k==='crab'?'crab':k==='bomb'?'bomb':k==='black'?'black':'ice',l}};S.fanfare();
}

/* ---------- aiming / shooting ---------- */
function autoAim(){const c=G.cand.length?G.cand:cands(G.sim);if(!c.length)return;let best=c[0];for(const x of c)if(x.sc>best.sc)best=x;G.aim.ang=best.ang;G.aim.key=best.key;}
function jumpCand(dir){const cs=cands(G.sim);G.cand=cs;let best=null,bd=1e9;
  for(const c of cs){const d=wrapA(c.ang-G.aim.ang)*dir;if(d>.015&&d<bd){bd=d;best=c;}}
  if(!best)for(const c of cs){let d=wrapA(c.ang-G.aim.ang)*dir;if(d<=.015)d+=TAU;if(d<bd){bd=d;best=c;}}
  if(best){G.aim.ang=best.ang;G.aim.key=best.key;S.ui();}}
function snapAim(raw,th){let best=null,bd=th;for(const c of G.cand){const d=Math.abs(wrapA(c.ang-raw));if(d<bd){bd=d;best=c;}}if(best){if(G.aim.key!==best.key&&thr('snap',80))S.tick(.3);G.aim.ang=best.ang;G.aim.key=best.key;}else{G.aim.ang=raw;G.aim.key=null;}}
function chargeP(){const u=(G.charge.t/1.15)%2;return .04+.96*(u<1?u:2-u);}
function maxDrag(){return clamp(Math.min(cw,ch)*.36,110,230);}
function shoot(ang,p){
  if(G.phase!=='aim'||G.scr!=='play'||G.paused)return;const s=G.sim;const cb=cueBall(s);if(!cb.on||cb.drop)return;
  applyShot(s,ang,p);G.phase='roll';G.shots++;G.shotPots=0;G.boomT=0;for(const b of s.balls)b.warp=0;
  S.cue(p);G.stick={ang,p,t:0,x0:cb.x,y0:cb.y};G.shake+=p*4;puff(cb.x,cb.y,6+p*8,'255,255,255',90+p*200,.3,3);ring(cb.x,cb.y,'255,255,255',R,R+20+p*40,.25,3+p*3);if(p>.85){G.hitstop=.03;popText(cb.x,cb.y-34,'POWER!','#ffd080',20);}
  G.drag=null;G.charge=null;save.shotsTotal=(save.shotsTotal||0)+1;
}
function endTurn(){
  const s=G.sim;stopAll(s);const cb=cueBall(s);
  if(s.cueIn||!cb.on){s.cueIn=false;cb.on=true;cb.drop=null;cb.held=false;const tmp={...s,balls:s.balls.filter(b=>b!==cb)};let q=[s.cue0[0],s.cue0[1]];if(s.balls.some(b=>b!==cb&&b.on&&hyp(b.x-q[0],b.y-q[1])<2*R+4))q=freeSpot(tmp,30);cb.x=q[0];cb.y=q[1];cb.lx=cb.x;cb.ly=cb.y;cb.pop=1;S.pop();}
  if(G.mode==='speed'){speedTurn();return;}
  if(G.mode==='tut'){G.phase='aim';G.cand=cands(s);autoAim();return;}
  if(s.black){fail('black');return;}
  if(s.potted>=s.goal){win();return;}
  if(G.shots>=G.L.lim){fail('shots');return;}
  if(s.boss){let n=s.balls.filter(b=>b.on&&b.type==='t'&&!b.drop).length;while(n<3){spawnT();n++;}}
  G.phase='aim';G.cand=cands(s);autoAim();
  if(G.gullPlan&&G.shots>=G.gullPlan&&!G.gull){G.gullPlan=0;startGull();}
}
function speedTurn(){const s=G.sim,sp=G.speed;
  if(G.shotPots>0)sp.streak++;else sp.streak=0;
  let n=s.balls.filter(b=>b.on&&b.type==='t'&&!b.drop).length;while(n<5){spawnT();n++;}
  const w=Math.floor(sp.score/12);while(sp.haz<w&&sp.haz<14)addHazard(sp.haz++);
  if(sp.time<=0){finishSpeed();return;}
  G.phase='aim';G.cand=cands(s);autoAim();
  if(Math.random()<.12&&!G.gull)startGull();
}
function finishSpeed(){const sp=G.speed;G.phase='done';const rec=sp.score>save.speedBest;const prev=save.speedBest;if(rec)save.speedBest=sp.score;const sh=sp.score*2;save.shells+=sh;persist();G.res={speed:1,score:sp.score,rec,prev,shells:sh};if(rec){confetti(140);S.cheer(true);G.cheer=3;}else S.aww();G.resT=.9;}
function win(){
  const L=G.L;G.phase='done';G.tsT=1;const st=G.shots<=L.par?3:G.shots<=L.par+1?2:1;const prev=save.stars[L.n]||0;let sh=5+Math.max(0,st-prev)*15;
  if(L.boss&&save.bossWins.indexOf(L.n)<0){save.bossWins.push(L.n);sh+=50;}
  save.stars[L.n]=Math.max(prev,st);save.shells+=sh;save.unlocked=Math.max(save.unlocked,Math.min(LV.length,L.n+2));save.last=Math.min(LV.length-1,L.n+1);save.played=true;persist();
  G.res={win:true,stars:st,shells:sh,n:L.n,prev};if(!G.finalPot){S.cheer(true);G.cheer=3.5;}confetti(110);G.resT=1.05;
}
function fail(why){G.phase='done';G.tsT=1;const s=G.sim;G.res={win:false,why,need:s.goal-s.potted,n:G.L.n};G.aww=2.5;S.aww();setTimeout(()=>S.fail(),250);G.resT=.9;save.played=true;persist();}

/* ---------- gull ---------- */
function startGull(){const s=G.sim;const ts=s.balls.filter(b=>b.on&&!b.drop&&!b.held&&b.type==='t');if(ts.length<2&&G.mode!=='speed')return;if(!ts.length)return;const b=ts[(Math.random()*ts.length)|0];
  const a=Math.random()*TAU;const lx=clamp(b.x+Math.cos(a)*130,60,W-60),ly=clamp(b.y+Math.sin(a)*130,60,H-60);const sx=lx<500?-180:W+180,sy=-140;
  G.gull={st:'in',x:sx,y:sy,sx,sy,lx,ly,t:0,h:1,ang:Math.atan2(ly-sy,lx-sx),bid:b.id};S.gull();}
function gullLeave(st){const g=G.gull;g.st=st;g.t=0;g.sx=g.x;g.sy=g.y;g.ex=g.x<500?-220:W+220;g.ey=-180;}
function gullUpdate(dt){const g=G.gull,s=G.sim;g.t+=dt;const ball=s.balls.find(b=>b.id===g.bid);
  if(g.st==='in'){const k=Math.min(1,g.t/1.4),e=easeOut(k);g.x=lerp(g.sx,g.lx,e);g.y=lerp(g.sy,g.ly,e);g.h=1-e;if(k>=1){g.st='walk';g.t=0;S.gull();popText(g.x,g.y-34,'Squawk!','#fff',20);}}
  else if(g.st==='walk'){if(!ball||!ball.on||ball.drop){gullLeave('leave');return;}const dx=ball.x-g.x,dy=ball.y-g.y,d=hyp(dx,dy);g.ang=Math.atan2(dy,dx);if(d<26){g.st='grab';g.t=0;ball.held=true;ball.vx=ball.vy=0;S.gull();}else{const sp=52*dt;g.x+=dx/d*sp;g.y+=dy/d*sp;}}
  else if(g.st==='grab'){if(ball){ball.x=g.x+Math.cos(g.ang)*22;ball.y=g.y+Math.sin(g.ang)*22;}if(g.t>.45){g.st='carry';g.t=0;g.sx=g.x;g.sy=g.y;const q=freeSpot(s,40);g.tx=q[0];g.ty=q[1];popText(g.x,g.y-36,'Thief!','#ffe0a0',24);}}
  else if(g.st==='carry'){const k=Math.min(1,g.t/1.8),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;g.x=lerp(g.sx,g.tx,e);g.y=lerp(g.sy,g.ty,e);g.h=Math.sin(k*PI)*.9;g.ang=Math.atan2(g.ty-g.sy,g.tx-g.sx);if(ball){ball.x=g.x;ball.y=g.y;}
    if(k>=1){if(ball){ball.held=false;ball.x=g.tx;ball.y=g.ty;ball.vx=ball.vy=0;ball.pop=1;ball.lx=ball.x;ball.ly=ball.y;S.pop();puff(ball.x,ball.y,8,'255,255,255',100,.3,3);}gullLeave('leave');G.cand=cands(s);}}
  else{const k=Math.min(1,g.t/(g.st==='scared'?.9:1.5)),e=k*k;g.x=lerp(g.sx,g.ex,e);g.y=lerp(g.sy,g.ey,e);g.h=Math.min(1,k*1.6);g.ang=Math.atan2(g.ey-g.sy,g.ex-g.sx);if(k>=1)G.gull=null;}
}
function gullTouch(){const g=G.gull;if(!g||!(g.st==='walk'||g.st==='grab'||(g.st==='in'&&g.h<.35)))return;const s=G.sim;
  for(const b of s.balls){if(!b.on||b.held||b.drop)continue;if(b.vx*b.vx+b.vy*b.vy<3600)continue;if(hyp(b.x-g.x,b.y-g.y)<30){
    const held=s.balls.find(x=>x.id===g.bid&&x.held);if(held){held.held=false;held.vx=held.vy=0;}
    save.shells+=10;persist();S.gull();popText(g.x,g.y-30,'Shoo! +10','#fff3a0',26);puff(g.x,g.y,14,'255,255,255',200,.7,4);G.cheer=Math.max(G.cheer,1);gullLeave('scared');return;}}}

/* ---------- update ---------- */
function updatePlay(dt){
  const s=G.sim;
  G.ts+=(G.tsT-G.ts)*Math.min(1,dt*10);
  let sdt=dt*G.ts;if(G.hitstop>0){G.hitstop-=dt;sdt=0;}
  G.acc+=sdt;let n=0;while(G.acc>=STEP&&n<90){step(s,STEP);if(G.gull)gullTouch();G.acc-=STEP;n++;}if(n>=90)G.acc=0;
  V.phi=V.base+(s.boat?Math.sin(TAU*s.t/s.boat.per)*.035:0);
  procEvents(s,false);spinBalls(s);
  if(G.gull)gullUpdate(sdt);
  if(G.phase==='aim'){
    G.candT-=dt;if(G.candT<=0){G.cand=cands(s);G.candT=.12;if(G.aim.key&&!(G.drag&&G.drag.active)&&!G.keyFree){const c=G.cand.find(c=>c.key===G.aim.key);if(c)G.aim.ang=c.ang;}}
    if(G.keyRot){G.keyRotT+=dt;if(G.keyRotT>.28){G.keyFree=true;G.aim.key=null;const sp=.32+Math.min(1.3,(G.keyRotT-.28)*1.3);G.aim.ang=wrapA(G.aim.ang+G.keyRot*sp*dt);}}
    if(G.charge){G.charge.t+=dt;const p=chargeP(),q=Math.floor(p*10);if(q!==G.charge.lt){G.charge.lt=q;S.tick(p);}}
  }
  if(G.phase==='roll'&&G.winT<0){
    const need=s.goal-s.potted;
    if(need===1&&G.mode!=='speed'){const dec=s.ice?150:620;
      for(const b of s.balls){if(!b.on||b.drop||b.type!=='t')continue;const v=hyp(b.vx,b.vy);if(v<90)continue;
        for(const p of s.pockets){if(s.boss?p.kind!=='mouth':p.kind!=='rail')continue;const dx=p.x-b.x,dy=p.y-b.y,d=hyp(dx,dy);if(d<170&&d>1){const dot=(b.vx*dx+b.vy*dy)/(v*d);if(dot>.94&&v*v/(2*dec)>d-25){G.tsT=.3;G.slowT=Math.max(G.slowT,.2);G.slowP={x:p.x,y:p.y};}}}}}
    if(atRest(s))endTurn();
  }
  if(G.slowT>0){G.slowT-=dt;if(G.slowT<=0){G.tsT=1;G.slowP=null;}}
  if(G.winT>=0&&G.phase!=='done'){G.winT+=dt;if(G.winT>.9&&(atRest(s)||G.winT>2.4)){if(G.mode==='tut'){G.phase='done';G.resT=-1;popText(W/2,H/2,['Nice pot!','Great aim!','You got it!'][G.tut.step]||'Nice!','#fff3a0',38);setTimeout(()=>{if(G.mode==='tut'&&G.scr==='play')tutNext();},800);}else if(s.black)fail('black');else win();}}
  if(G.mode==='speed'&&G.speed&&G.phase!=='done'){const sp=G.speed;if(sp.time>0){sp.time-=dt*Math.min(1,G.ts);const sec=Math.ceil(sp.time);if(sec<=10&&sec!==sp.lastSec){sp.lastSec=sec;S.tick(.8);}if(sp.time<=0){sp.time=0;if(G.phase==='aim')finishSpeed();}}}
  if(G.resT>0){G.resT-=dt;if(G.resT<=0)showResults();}
  const tz=G.slowP&&G.tsT<1?1.14:1;CAM.z+=(tz-CAM.z)*Math.min(1,dt*5);const fx=G.slowP&&G.tsT<1?lerp(W/2,G.slowP.x,.3):W/2,fy=G.slowP&&G.tsT<1?lerp(H/2,G.slowP.y,.3):H/2;CAM.fx+=(fx-CAM.fx)*Math.min(1,dt*5);CAM.fy+=(fy-CAM.fy)*Math.min(1,dt*5);
  if(THEMES[G.theme].rain){G.nextBolt-=dt;if(G.nextBolt<=0){G.lightning=1;S.thunder();G.nextBolt=rnd(9,17);}}
  if(G.stick)G.stick.t+=dt;
  for(const c of s.crabs){if(c.ouch>0)c.ouch-=dt;}
  if(G.banner){G.banner.t+=dt;if(G.banner.t>2.6)G.banner=null;}
}
function updateFX(dt){
  for(const p of G.fx){p.l-=dt;if(p.k==='dot'||p.k==='star'){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.pow(.02,dt);p.vx*=f;p.vy*=f;}}
  G.fx=G.fx.filter(p=>p.l>0);
  for(const c of G.conf){c.l-=dt;c.vy+=520*dt;c.vx*=Math.pow(.4,dt);c.x+=c.vx*dt+Math.sin(c.rot)*30*dt;c.y+=c.vy*dt;c.rot+=c.vr*dt;if(c.vy>160)c.vy=160+(c.vy-160)*.9;}
  G.conf=G.conf.filter(c=>c.l>0&&c.y<ch+30);
  for(const t of G.texts)t.l-=dt;G.texts=G.texts.filter(t=>t.l>0);
  for(const f of G.fish){f.t+=dt;if(f.t>=1.1&&!f.done){f.done=1;const ex=f.x+f.dx*165,ey=f.y+f.dy*165;puff(ex,ey,12,'150,210,255',160,.5,3.5);if(G.scr==='play')S.splash();}}
  G.fish=G.fish.filter(f=>f.t<1.6);
  for(const k in G.pflash){G.pflash[k]-=dt*2.2;if(G.pflash[k]<=0)delete G.pflash[k];}
  const s=G.scr==='title'||G.scr==='levels'||G.scr==='shop'?(G.attract&&G.attract.sim):G.sim;
  if(s){for(const b of s.balls){if(b.sq>0)b.sq=Math.max(0,b.sq-dt*7);if(b.pop>0)b.pop=Math.max(0,b.pop-dt*3);}for(const o of s.bumps)if(o.fl>0)o.fl=Math.max(0,o.fl-dt*4);}
  G.shake=Math.min(22,G.shake)*Math.pow(.003,dt);if(G.shake<.05)G.shake=0;
  SH.x=(Math.random()-.5)*G.shake;SH.y=(Math.random()-.5)*G.shake;
  if(G.cheer>0)G.cheer-=dt;if(G.aww>0)G.aww-=dt;if(G.lightning>0)G.lightning-=dt*2.5;
}
function updateAttract(dt){
  if(!G.attract){const L={cue:[230,280],t:rack(690,280,4),goal:99};G.attract={sim:buildSim(L,123),wait:1.3,acc:0};}
  const a=G.attract,s=a.sim;V.phi=V.base;
  a.acc+=dt;let n=0;while(a.acc>=STEP&&n<90){step(s,STEP);a.acc-=STEP;n++;}
  procEvents(s,true);spinBalls(s);
  if(a.stick)a.stick.t+=dt;
  if(atRest(s)){a.wait-=dt;if(a.wait<=0){const tg=s.balls.filter(b=>b.on&&b.type==='t');if(tg.length<3||!cueBall(s).on){G.attract=null;return;}
    const c=cands(s).sort((x,y)=>y.sc-x.sc);const pick=c[Math.min(c.length-1,(Math.random()*2)|0)];if(!pick){G.attract=null;return;}stopAll(s);applyShot(s,pick.ang,rnd(.5,.85));a.wait=1.6;a.stick={ang:pick.ang,t:0,p:.7};}}
}

/* ============ render ============ */
function render(){
  setScreen();const t=G.rt;
  const inPlay=G.scr==='play'||G.scr==='res'||G.scr==='pause';
  const s=inPlay?G.sim:(G.attract&&G.attract.sim);
  if(!inPlay)G.theme=0;
  [LX,LY]=sv2w(-.3,-.36);const sv=sv2w(.26,.34);SX=sv[0];SY=sv[1];
  drawBG(t);drawCritters(t);
  if(s)drawWorld(s,t,inPlay);
  setScreen();
  if(THEMES[G.theme].rain)drawRain(t);
  if(G.lightning>0){ctx.fillStyle='rgba(230,240,255,'+(Math.max(0,G.lightning)*(Math.sin(t*90)>0?.55:.25))+')';ctx.fillRect(0,0,cw,ch);}
  if(G.scr==='play'||G.scr==='pause')drawHUD(t);
  drawTexts();
  if(G.scr==='title')drawLogo(t);
  if(G.scr==='play'&&G.mode==='tut')drawTut(t);
  if(G.banner&&G.scr==='play')drawBanner(t);
  for(const c of G.conf){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.rot);ctx.scale(1,Math.cos(c.rot*1.7));ctx.globalAlpha=Math.min(1,c.l);ctx.fillStyle=c.c;ctx.fillRect(-c.w/2,-c.h/2,c.w,c.h);ctx.restore();}
}
function drawWorld(s,t,inPlay){
  const L=inPlay?G.L:null;buildTable(s,L);setWorld();
  const pad=tableC.pad;ctx.drawImage(tableC,-FR-pad,-FR-pad,W+2*FR+2*pad,H+2*FR+2*pad);
  if(s.boat){const gy=Math.sin(TAU*s.t/s.boat.per);ctx.save();ctx.globalAlpha=Math.abs(gy)*.22;ctx.strokeStyle='#fff';ctx.lineWidth=6;ctx.lineCap='round';ctx.lineJoin='round';const d=gy>0?1:-1;for(let i=0;i<5;i++){const x=150+i*175,y=H/2+((t*60*d)%40)*d*0;ctx.beginPath();ctx.moveTo(x-22,y-d*12);ctx.lineTo(x,y+d*10);ctx.lineTo(x+22,y-d*12);ctx.stroke();}ctx.restore();}

    for(let i=0;i<str.length;i++){const c=str[i],cx=x+ws[i]/2,yy=y+Math.sin(t*2.6+i*.55)*size*wob;const rot=Math.sin(t*1.7+i)*.04;ctx.save();ctx.translate(cx,yy);ctx.rotate(rot);ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      ctx.lineWidth=size*.24;ctx.strokeStyle='#3a1d0c';ctx.strokeText(c,0,size*.06);ctx.strokeText(c,0,0);ctx.lineWidth=size*.1;ctx.strokeStyle='#fff3d6';ctx.strokeText(c,0,0);
      const gg=ctx.createLinearGradient(0,-size*.45,0,size*.45);gg.addColorStop(0,c1);gg.addColorStop(1,c2);ctx.fillStyle=gg;ctx.fillText(c,0,0);ctx.fillStyle='rgba(255,255,255,.35)';ctx.save();ctx.beginPath();ctx.rect(-size,-size*.5,size*2,size*.32);ctx.clip();ctx.fillText(c,0,0);ctx.restore();ctx.restore();x+=ws[i]+size*.02;}
    return tw;};
  line('BREAKSHOT',y0,fs,'#ffe27a','#ff8a2c',.04);
  const tw=line('BAY',y0+fs*1.02,fs*1.15,'#9ff7ea','#1d9a8c',.05);
  const bb={type:'t',num:8,spot:[.3*Math.cos(t),-.25,.9],id:3,fuse:-1};ctx.save();ctx.translate(cw/2+tw/2+fs*.55,y0+fs*1.02);ctx.rotate(Math.sin(t*2)*.1);ctx.scale(fs/32,fs/32);LX=-.3;LY=-.36;drawBall(ctx,{...bb,type:'c'},0,0,1);ctx.restore();
  ctx.save();ctx.translate(cw/2-tw/2-fs*.55,y0+fs*1.02);ctx.scale(fs/32,fs/32);drawBall(ctx,{type:'t',num:1,spot:[-.2,.1,.95],id:4,fuse:-1},0,0,1);ctx.restore();
  txt('trick-shot billiards on the pier',cw/2,y0+fs*1.85,Math.max(12,fs*.2),'#fff8e8','center',4);
}

/* ============ UI screens ============ */
function setScr(n){G.scr=n;['scTitle','scLevels','scShop','scRes','scPause'].forEach(id=>$(id).classList.remove('on'));
  const map={title:'scTitle',levels:'scLevels',shop:'scShop',res:'scRes',pause:'scPause'};if(map[n])$(map[n]).classList.add('on');
  $('hud').classList.toggle('on',n==='play'||n==='pause');$('skip').classList.toggle('on',n==='play'&&G.mode==='tut');
  $('topShells').classList.toggle('on',n==='title'||n==='levels');$('tsN').textContent=save.shells;}
function toTitle(){G.sim=null;G.mode='menu';G.banner=null;G.conf.length=0;refreshTitle();setScr('title');}
function refreshTitle(){$('bPlay').textContent=save.played?'Continue':'Play';const sp=$('bSpeed');const lock=save.unlocked<4;sp.classList.toggle('lock',lock);sp.innerHTML=lock?'Speed Rack<small>Beat level 3</small>':'Speed Rack<small>Best '+save.speedBest+'</small>';$('tsN').textContent=save.shells;}
function pause(){if(G.scr!=='play')return;G.paused=true;G.drag=null;G.charge=null;setScr('pause');}
function resume(){G.paused=false;setScr('play');}
const starSvg=(on,i)=>'<svg viewBox="0 0 24 24" class="'+(on?'on':'')+'" style="animation-delay:'+(i*.28+.2)+'s"><use href="#starS" fill="'+(on?'#ffd23a':'rgba(90,45,10,.28)')+'" stroke="'+(on?'#a0600a':'rgba(90,45,10,.4)')+'" stroke-width="1.2"/></svg>';
function showResults(){
  const r=G.res,P=$('resPanel');let h='';
  if(r.speed){h='<h2>'+(r.rec?'NEW RECORD!':'TIME UP!')+'</h2><div class="shells" style="font-size:44px;color:#1d6f66">'+r.score+'</div><div style="font-weight:900;color:#7a4419">Best '+save.speedBest+'</div><div class="shells" id="resSh">+0 <svg class="shellico" viewBox="0 0 24 24"><use href="#shellS"/></svg></div><div class="brow"><button class="btn sm" id="rMenu">Menu</button><button class="btn sea big" id="rMain">Again ▶</button></div>';}
  else if(r.win){const nx=LV[r.n+1];h='<h2>'+(r.stars===3?'PERFECT!':r.stars===2?'GREAT SHOT!':'TABLE CLEARED!')+'</h2><div class="stars">'+[0,1,2].map(i=>starSvg(i<r.stars,i)).join('')+'</div>'+
    '<div style="font-weight:900;color:#7a4419;font-size:14px">'+G.shots+' shot'+(G.shots>1?'s':'')+' · ★★★ in '+G.L.par+'</div><div class="shells" id="resSh">+0 <svg class="shellico" viewBox="0 0 24 24"><use href="#shellS"/></svg></div>'+
    (nx?'<div class="tease"><span id="teaseIco"></span><div>NEXT ›<br><span style="font-size:15px;color:#1d6f66">'+nx.nw.l+'</span></div></div>':'<div class="tease">You beat the Kraken! Legend!</div>')+
    '<div class="brow"><button class="btn sm" id="rMenu">Menu</button><button class="btn sm" id="rRetry">↻ Retry</button><button class="btn sea big" id="rMain">'+(nx?'Next ▶':'Menu')+'</button></div>';}
  else{const why=r.why==='black'?'THE 8 SANK!':r.need===1?'SO CLOSE!':'OUT OF SHOTS';h='<h2>'+why+'</h2><div style="font-weight:900;color:#7a4419;font-size:18px;margin-bottom:6px">'+(r.why==='black'?'Steer clear of the black ball':r.need===1?'Just 1 ball left!':r.need+' balls left')+'</div><div class="brow"><button class="btn sm" id="rMenu">Menu</button><button class="btn sea big" id="rMain">↻ Retry</button></div>';}
  P.innerHTML=h;setScr('res');
  const ti=$('teaseIco');if(ti&&LV[r.n+1])ti.appendChild(iconCanvas(LV[r.n+1].nw.k,56));
  if(r.win)for(let i=0;i<r.stars;i++)setTimeout(()=>S.star(i),200+i*280);
  if(r.shells){const el=$('resSh');let c=0;const tgt=r.shells;const iv=setInterval(()=>{c=Math.min(tgt,c+Math.ceil(tgt/18));if(el)el.firstChild.textContent='+'+c+' ';if(thr('coin',60))S.coin();if(c>=tgt)clearInterval(iv);},45);}
  const m=$('rMain');m.onclick=()=>{S.ui();if(r.speed)startSpeed();else if(r.win){if(LV[r.n+1])startLevel(r.n+1);else toTitle();}else restart();};
  $('rMenu').onclick=()=>{S.ui();toTitle();};const rr=$('rRetry');if(rr)rr.onclick=()=>{S.ui();restart();};
}
function buildLevels(){const g=$('lvGrid');let h='';
  for(let w=0;w<5;w++){h+='<div class="wname">'+WORLDS[w].n+'</div>';for(let i=w*6;i<w*6+6;i++){const L=LV[i],lock=i>=save.unlocked,st=save.stars[i]||0;
    h+='<div class="tile'+(L.boss?' boss':'')+(lock?' locked':'')+'" data-n="'+i+'">'+(L.boss?'<svg class="crown" viewBox="0 0 22 14"><path d="M1 13L3 3l5 5 3-7 3 7 5-5 2 10z" fill="#ffd23a" stroke="#7a4a00" stroke-width="1.2"/></svg>':'')+(lock?'<svg viewBox="0 0 24 24" style="width:22px;height:22px"><path d="M7 10V7a5 5 0 0 1 10 0v3h1v11H6V10zm2 0h6V7a3 3 0 0 0-6 0z" fill="#d8cbb4"/></svg>':(i+1))+'<div class="st">'+[0,1,2].map(k=>'<svg viewBox="0 0 24 24"><use href="#starS" fill="'+(k<st?'#ffd23a':'rgba(0,0,0,.25)')+'"/></svg>').join('')+'</div></div>';}}
  g.innerHTML=h;g.querySelectorAll('.tile').forEach(el=>el.onclick=()=>{const n=+el.dataset.n;if(n<save.unlocked){S.ui();startLevel(n);}});}
let shopTab='cues';
function buildShop(){$('shopN').textContent=save.shells;const g=$('shopGrid');g.innerHTML='';const list=shopTab==='cues'?CUES:TABLES;const own=shopTab==='cues'?save.cues:save.tables;const cur=shopTab==='cues'?save.cue:save.table;
  list.forEach((it,i)=>{const d=document.createElement('div');d.className='item'+(cur===i?' eq':'');const c=document.createElement('canvas');const dd=Math.min(2,window.devicePixelRatio||1);c.width=120*dd;c.height=60*dd;const x=c.getContext('2d');x.scale(dd,dd);
    if(shopTab==='cues'){x.translate(4,30);x.rotate(-.12);x.scale(.27,.27);drawStick(x,{x:440,y:0},0,0,i,1);}
    else{x.fillStyle=it.wd[1];rrect(x,4,4,112,52,10);x.fill();x.fillStyle=it.f;x.fillRect(14,14,92,32);x.fillStyle='#111';[[14,14],[60,14],[106,14],[14,46],[60,46],[106,46]].forEach(p=>{x.beginPath();x.arc(p[0],p[1],4,0,TAU);x.fill();});x.fillStyle='#f6f2e4';x.beginPath();x.arc(40,30,4,0,TAU);x.fill();x.fillStyle='#f2c014';x.beginPath();x.arc(80,28,4,0,TAU);x.fill();}
    d.appendChild(c);const nm=document.createElement('div');nm.textContent=it.n;d.appendChild(nm);
    const b=document.createElement('button');b.className='btn sm'+(own.indexOf(i)>=0?'':' sea');const owned=own.indexOf(i)>=0;
    b.innerHTML=cur===i?'Equipped':owned?'Equip':'<svg class="shellico" viewBox="0 0 24 24" style="width:16px;height:16px"><use href="#shellS"/></svg> '+it.p;
    if(!owned&&save.shells<it.p)b.classList.add('lock');
    b.onclick=()=>{if(owned){if(shopTab==='cues')save.cue=i;else{save.table=i;tableKey='';}S.ui();}else if(save.shells>=it.p){save.shells-=it.p;own.push(i);if(shopTab==='cues')save.cue=i;else{save.table=i;tableKey='';}S.fanfare();}else{S.fail();return;}persist();buildShop();};
    d.appendChild(b);g.appendChild(d);});
  $('tCues').classList.toggle('cur',shopTab==='cues');$('tTables').classList.toggle('cur',shopTab==='tables');}
function drawMuteIco(){$('muteIco').innerHTML=muted?'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke-width="2.4" fill="none"/>':'<path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke-width="2.2" fill="none"/>';}

/* ============ input ============ */
cv.addEventListener('pointerdown',e=>{audioInit();if(G.scr!=='play'||G.paused)return;try{cv.setPointerCapture(e.pointerId);}catch(_){}G.drag={x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY,active:false,p:0,id:e.pointerId};e.preventDefault();});
cv.addEventListener('pointermove',e=>{const d=G.drag;if(!d||d.id!==e.pointerId)return;d.x=e.clientX;d.y=e.clientY;const dx=d.x0-d.x,dy=d.y0-d.y,l=hyp(dx,dy);if(l>12)d.active=true;
  if(d.active&&G.phase==='aim'){const [wx,wy]=sv2w(dx,dy);const raw=Math.atan2(wy,wx);const th=G.mode==='tut'?(G.tut.step===0?1.2:.3):G.L&&G.L.n<2?.22:.11;snapAim(raw,th);const np=clamp((l-12)/maxDrag(),0,1);if(Math.floor(np*10)!==Math.floor(d.p*10))S.tick(np);d.p=np;}});
function endDrag(e,cancel){const d=G.drag;if(!d||(e&&d.id!==e.pointerId))return;G.drag=null;if(cancel)return;
  if(d.active){if(G.phase==='aim'&&d.p>=.03)shoot(G.aim.ang,d.p);}
  else if(G.phase==='aim'&&G.sim){const [wx,wy]=s2w(d.x,d.y);let best=null,bd=60;for(const b of G.sim.balls){if(!b.on||b.drop||b.held||b.type==='c')continue;const dd=hyp(b.x-wx,b.y-wy);if(dd<bd){bd=dd;best=b;}}
    if(best){const cs=cands(G.sim).filter(c=>c.bid===best.id).sort((a,b)=>b.sc-a.sc);if(cs[0]){G.aim.ang=cs[0].ang;G.aim.key=cs[0].key;S.ui();}}}}
cv.addEventListener('pointerup',e=>endDrag(e));cv.addEventListener('pointercancel',e=>endDrag(e,true));
addEventListener('keydown',e=>{audioInit();const k=e.key;
  if(k==='Escape'||k==='p'||k==='P'){if(G.scr==='play')pause();else if(G.scr==='pause')resume();e.preventDefault();return;}
  if(k==='m'||k==='M'){setMute(!muted);return;}
  if(G.scr==='title'){if(k==='Enter'||k===' '){e.preventDefault();$('bPlay').click();}return;}
  if(G.scr==='res'){if(k==='Enter'||k===' '){e.preventDefault();const m=$('rMain');if(m)m.click();}else if(k==='r'||k==='R')restart();return;}
  if(G.scr==='pause'){if(k==='Enter'||k===' '){e.preventDefault();resume();}return;}
  if(G.scr==='levels'||G.scr==='shop'){if(k==='Enter'||k===' ')e.preventDefault();return;}
  if(G.scr!=='play')return;
  if(k==='r'||k==='R'){restart();return;}
  if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ArrowRight'||k==='d'||k==='D'){e.preventDefault();const dir=(k==='ArrowLeft'||k==='a'||k==='A')?-1:1;if(!e.repeat&&G.phase==='aim'){jumpCand(dir);G.keyRot=dir;G.keyRotT=0;G.keyFree=false;}return;}
  if(k==='ArrowUp'||k==='ArrowDown'||k==='w'||k==='s'||k==='W'||k==='S'){e.preventDefault();if(G.phase==='aim'){G.aim.ang=wrapA(G.aim.ang+((k==='ArrowUp'||k==='w'||k==='W')?-1:1)*.006);G.aim.key=null;}return;}
  if(k===' '||k==='Enter'){e.preventDefault();if(!e.repeat&&G.phase==='aim'&&!G.charge)G.charge={t:0,lt:-1};}
});
addEventListener('keyup',e=>{const k=e.key;
  if(k==='ArrowLeft'||k==='a'||k==='A'||k==='ArrowRight'||k==='d'||k==='D'){if(G.keyFree&&G.phase==='aim'){snapAim(G.aim.ang,.04);}G.keyRot=0;G.keyFree=false;}
  if((k===' '||k==='Enter')&&G.charge){const p=chargeP();G.charge=null;if(G.scr==='play'&&G.phase==='aim')shoot(G.aim.ang,Math.max(.05,p));}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.scr==='play')pause();});
addEventListener('resize',layout);
$('bPlay').onclick=()=>{audioInit();S.ui();if(!save.tut)startTut('first');else startLevel(Math.min(save.last||0,save.unlocked-1));};
$('bLevels').onclick=()=>{audioInit();S.ui();buildLevels();setScr('levels');};
$('bSpeed').onclick=()=>{audioInit();if(save.unlocked<4){S.fail();return;}S.ui();startSpeed();};
$('bShop').onclick=()=>{audioInit();S.ui();buildShop();setScr('shop');};
$('bHow').onclick=()=>{audioInit();S.ui();startTut('menu');};
$('bLvBack').onclick=()=>{S.ui();toTitle();};$('bShopBack').onclick=()=>{S.ui();toTitle();};
$('tCues').onclick=()=>{shopTab='cues';buildShop();};$('tTables').onclick=()=>{shopTab='tables';buildShop();};
$('bResume').onclick=()=>{S.ui();resume();};$('bPRestart').onclick=()=>{S.ui();restart();};$('bPMenu').onclick=()=>{S.ui();toTitle();};
$('hPause').onclick=()=>{S.ui();pause();};$('hMute').onclick=()=>{audioInit();setMute(!muted);};$('hRestart').onclick=()=>{S.ui();restart();};
$('skip').onclick=()=>{S.ui();finishTut();};
['hPause','hMute','hRestart','skip'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));

/* ============ loop ============ */
let lastT=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,Math.max(0,(now-lastT)/1000));lastT=now;G.rt+=dt;
  try{
    if(G.scr==='title'||G.scr==='levels'||G.scr==='shop')updateAttract(dt);
    else if(G.scr==='play'&&!G.paused)updatePlay(dt);
    else if(G.scr==='res'&&G.sim){G.acc+=dt;let n=0;while(G.acc>=STEP&&n<90){step(G.sim,STEP);G.acc-=STEP;n++;}procEvents(G.sim,true);spinBalls(G.sim);if(G.banner)G.banner=null;}
    if(!G.paused)updateFX(dt);
    render();
  }catch(err){console.warn(err);}
}
layout();drawMuteIco();refreshTitle();setScr('title');requestAnimationFrame(frame);
window.__bb={w2s,V,CAM,G,LV,TUT,buildSim,step,atRest,cands,applyShot,startLevel,shoot,stopAll,cueBall,STEP,get save(){return save;},startTut,finishTut,startSpeed,preview};

<style>

function tone(f,d,type,v,f2,delay){if(!AC||muted)return;const t=AC.currentTime+(delay||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.05)}
let nbuf=null;function noise(d,v,freq,q,delay){if(!AC||muted)return;if(!nbuf){nbuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const a=nbuf.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1}const t=AC.currentTime+(delay||0);const s=AC.createBufferSource();s.buffer=nbuf;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=freq||1000;f.Q.value=q||1;const g=AC.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+d+.05)}

function eye(g,x,y,r,sil){if(sil){g.fillStyle='#22344a';g.beginPath();g.arc(x,y,r*.7,0,TAU);g.fill();return}g.fillStyle='#fff';g.beginPath();g.arc(x,y,r,0,TAU);g.fill();g.fillStyle='#111';g.beginPath();g.arc(x+r*.25,y,r*.6,0,TAU);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(x+r*.45,y-r*.3,r*.22,0,TAU);g.fill()}

 else if(sp.pat==='line'){g.fillStyle=c[2];g.globalAlpha=.8;g.fillRect(-rx,-ry*.12,rx*2,ry*.24);g.globalAlpha=1}

 const info=document.createElement('div');info.className='row';info.style.cssText='margin-top:12px;opacity:.9;font-weight:900';info.innerHTML='<span>⬇ '+dep+'m'+(rec?' <span style="color:#7cf08a">BEST!</span>':'')+'</span>'+(streakB?'<span style="color:#7cf08a">PERFECT +'+streakB+'</span>':'');d.appendChild(info);
 const t=document.createElement('div');t.className='tot';t.innerHTML='<i class="coin" style="width:30px;height:30px"></i><span>+'+pendingCoins+'</span>';d.appendChild(t);
 const b=document.createElement('button');b.className='btn green';b.style.cssText='display:block;margin:0 auto;font-size:22px;padding:12px 40px';b.textContent='COLLECT';b.onclick=()=>{closeModal()};d.appendChild(b);
 save();openModal(hooked.length?'Catch!':'No bite…',d);if(Object.keys(newIds).length)setTimeout(()=>{SFX.win()},200);if(hooked.some(f=>f.sp.z===3))SFX.legend()}
function collect(){G.coins+=pendingCoins;pendingCoins=0;hooked=[];save();SFX.coin();showHub(true);updateBadge()}
// ---------- render ----------
function drawSky(sy){const w=water();const gr=ctx.createLinearGradient(0,sy-H,0,sy);gr.addColorStop(0,w.sky[0]);gr.addColorStop(1,w.sky[1]);ctx.fillStyle=gr;ctx.fillRect(0,0,W,Math.max(0,sy));
 // sun
 const sx=W*.78,suy=sy-H*.32;const sg=ctx.createRadialGradient(sx,suy,0,sx,suy,90);sg.addColorStop(0,'rgba(255,255,230,1)');sg.addColorStop(.3,'rgba(255,240,180,.9)');sg.addColorStop(1,'rgba(255,240,180,0)');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(sx,suy,90,0,TAU);ctx.fill();
 // clouds
 ctx.fillStyle='rgba(255,255,255,.85)';for(let i=0;i<4;i++){const cx=((i*W*.31+T*12*(1+i*.3))%(W+300))-150,cy=sy-H*(.2+(i%3)*.12);[[0,0,50,16],[28,-10,30,18],[-25,-4,26,13]].forEach(e=>{ctx.beginPath();ctx.ellipse(cx+e[0],cy+e[1],e[2],e[3],0,0,TAU);ctx.fill()})}
 // land
 ctx.fillStyle=w.land;ctx.beginPath();ctx.moveTo(-10,sy);ctx.quadraticCurveTo(W*.12,sy-70,W*.3,sy);ctx.fill();ctx.beginPath();ctx.moveTo(W*.62,sy);ctx.quadraticCurveTo(W*.85,sy-50,W+10,sy-20);ctx.lineTo(W+10,sy);ctx.fill();
 if(G.water===2){ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(W*.08,sy-40);ctx.lineTo(W*.12,sy-52);ctx.lineTo(W*.17,sy-40);ctx.fill()}
 if(G.water===3){ctx.fillStyle='rgba(255,120,60,.8)';ctx.beginPath();ctx.arc(W*.12,sy-55,6+Math.sin(T*4)*2,0,TAU);ctx.fill()}
 if(G.water===0||G.water===1){ctx.strokeStyle='#6a4a2a';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.13,sy-60);ctx.quadraticCurveTo(W*.14,sy-90,W*.12,sy-110);ctx.stroke();ctx.fillStyle=G.water?'#2f5a2f':'#3fae5a';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(W*.12+Math.cos(i*1.3)*20,sy-110+Math.sin(i*1.3)*6,22,6,i*1.3,0,TAU);ctx.fill()}}
}
function drawWater(top){// top: screen y of surface (may be negative)
 const d0=Math.max(0,(0+camY)/PPM),d1=Math.max(0,(H+camY)/PPM);
 const y0=Math.max(0,top);const gr=ctx.createLinearGradient(0,y0,0,H);gr.addColorStop(0,colAt(Math.max(0,(y0+camY)/PPM)));gr.addColorStop(.5,colAt(Math.max(0,(lerp(y0,H,.5)+camY)/PPM)));gr.addColorStop(1,colAt(d1));ctx.fillStyle=gr;ctx.fillRect(0,y0,W,H-y0);
 // rays
 const ra=clamp(1-d0/(water().z[0]*1.2),0,1)*.12;if(ra>0.005){ctx.fillStyle='rgba(255,255,230,'+ra+')';for(let i=0;i<6;i++){const x=W*(i/5)+Math.sin(T*.4+i)*40;ctx.beginPath();ctx.moveTo(x-20,top);ctx.lineTo(x+30,top);ctx.lineTo(x+160,top+H*1.2);ctx.lineTo(x+60,top+H*1.2);ctx.fill()}}
 // side rocks
 const seg=240;const s0=Math.floor(Math.max(0,camY)/seg),s1=Math.floor((camY+H)/seg)+1;const rc=colAt(Math.max(0,(camY+H*.5)/PPM));
 for(let s=Math.max(1,s0);s<=s1;s++){const R=seedR(s*131+G.water*7);for(let side=0;side<2;side++){if(R()<.45)continue;const y=s*seg+R()*seg-camY;const sz=30+R()*60;const x=side?W+10-R()*20:-10+R()*20;ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(x,y,sz,sz*.7,0,0,TAU);ctx.fill();
  if(G.water===1&&R()<.7){ctx.strokeStyle='rgba(40,120,60,.55)';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x+(side?-10:10),y);for(let k=1;k<6;k++)ctx.lineTo(x+(side?-10:10)+Math.sin(T*1.5+k+s)*10,y-k*24);ctx.stroke()}
  if(G.water===0&&R()<.6&&(s*seg)/PPM<200){ctx.fillStyle='rgba(255,120,140,.5)';for(let k=0;k<3;k++){ctx.beginPath();ctx.arc(x+(side?-sz*.5:sz*.5)+k*6,y-sz*.5-k*8,6,0,TAU);ctx.fill()}}
  if(G.water===3&&R()<.5){const gg=ctx.createRadialGradient(x,y-sz*.6,0,x,y-sz*.6,40);gg.addColorStop(0,'rgba(255,120,40,.4)');gg.addColorStop(1,'rgba(255,120,40,0)');ctx.fillStyle=gg;ctx.fillRect(x-40,y-sz*.6-40,80,80)}
 }}
 // snow
 ctx.fillStyle='rgba(255,255,255,.35)';for(const p of snow){const y=((p.y*H-camY*p.z*.6)%H+H)%H;if(y<top)continue;ctx.beginPath();ctx.arc(p.x*W+Math.sin(T+p.y*20)*8,y,p.r,0,TAU);ctx.fill()}
}
function drawSurface(top){ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.moveTo(0,top);for(let x=0;x<=W;x+=12)ctx.lineTo(x,top+Math.sin(x*.03+T*2)*3+Math.sin(x*.07-T*3)*2);ctx.lineTo(W,top+8);ctx.lineTo(0,top+8);ctx.fill()}
function render(){
 const sx=shake?rnd(-shake,shake):0,sy=shake?rnd(-shake,shake):0;ctx.save();ctx.translate(sx,sy);
 const top=-camY;
 if(top>0)drawSky(top);drawWater(top);
 const inCast=state==='cast'||state==='reel';
 // entities
 if(inCast||state==='landing'){
  for(const e of ents){const y=e.y-camY;if(y<-150||y>H+150)continue;ctx.save();
   if(e.k==='f'){ctx.translate(e.x,y+Math.sin(T*2+e.ph)*e.bob);ctx.scale(e.vx<0?-1:1,1);drawFish(ctx,e.sp,e.size,T+e.ph,0,false)}else{ctx.translate(e.x,y+Math.sin(T*1.5+e.ph)*6);drawJelly(ctx,e.r,T,e.ph,e.deep,0)}ctx.restore()}
 }
 if(state==='title'||state==='hub'){for(const f of (state==='hub'?hubFish:titleFish)){ctx.save();ctx.translate(f.x*W,f.y*H+Math.sin(T*2+f.ph)*6);ctx.scale(f.d,1);drawFish(ctx,f.sp,f.sp.sz*1.3*Math.min(1.3,W/700+.5),T+f.ph,0,false);ctx.restore()}}
 // boat
 if(top>-80){const rt=rodTipWorld(W/2,0,G.boat,T);drawBoat(ctx,W/2,top+Math.sin(T*1.6)*2,G.boat,T,[rt[0]-W/2,rt[1]]);
  if(!inCast&&state!=='landing'&&state!=='title'){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rt[0],rt[1]-camY);ctx.lineTo(rt[0]+4,top+30);ctx.stroke();drawHook(rt[0]+4,top+30,0)}}
 drawSurface(top);
 // line + hook
 if(inCast){const rt=rodTipWorld(W/2,0,G.boat,T);ctx.strokeStyle='rgba(255,255,255,.75)';ctx.lineWidth=1.3;ctx.beginPath();ctx.moveTo(rt[0],rt[1]-camY);ctx.quadraticCurveTo(lerp(rt[0],hook.x,.5)+hook.vx*.0,(rt[1]-camY+hook.y-camY)/2,hook.x,hook.y-camY);ctx.stroke();
  // hooked cluster
  hooked.forEach((f,i)=>{ctx.save();const a=(i%2?1:-1)*(.25+Math.floor(i/2)*.12)+Math.sin(T*6+i)*.12;ctx.translate(hook.x,hook.y-camY+6);ctx.rotate(a);ctx.translate(0,f.size*.42);ctx.rotate(Math.PI/2);drawFish(ctx,f.sp,f.size*.85,T*1.6+i,0,false);ctx.restore()});
  drawHook(hook.x,hook.y-camY,castInfo.inv>0?1:0)}
 // parts
 for(const p of parts){if(p.col==='b'){ctx.strokeStyle='rgba(220,250,255,'+clamp(p.life,0,1)*.7+')';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(p.x,p.y-camY,p.r,0,TAU);ctx.stroke()}else{ctx.globalAlpha=clamp(p.life/p.max,0,1);ctx.fillStyle=p.col;ctx.beginPath();ctx.arc(p.x,p.y-camY,p.r,0,TAU);ctx.fill();ctx.globalAlpha=1}}
 // darkness
 if(inCast){const d=Math.max(0,(camY+H*.5)/PPM);const dk=darkAt(d)*.92;if(dk>.02){const lr=UP.lure.light[G.lure];const hy=hook.y-camY;const gr=ctx.createRadialGradient(hook.x,hy,lr*.2,hook.x,hy,lr);gr.addColorStop(0,'rgba(0,0,8,0)');gr.addColorStop(1,'rgba(0,2,10,'+dk+')');ctx.fillStyle=gr;ctx.fillRect(-20,-20,W+40,H+40)}
  // glow pass
  for(const e of ents){const y=e.y-camY;if(y<-150||y>H+150)continue;if(e.k==='f'&&(e.sp.glow||e.sp.z===3)){ctx.save();ctx.translate(e.x,y+Math.sin(T*2+e.ph)*e.bob);ctx.scale(e.vx<0?-1:1,1);drawFish(ctx,e.sp,e.size,T+e.ph,1);ctx.restore()}else if(e.k==='j'&&e.deep){ctx.save();ctx.translate(e.x,y+Math.sin(T*1.5+e.ph)*6);drawJelly(ctx,e.r,T,e.ph,true,1);ctx.restore()}}
  // lure glow
  if(dk>.1){ctx.globalCompositeOperation='lighter';const hy=hook.y-camY;const gr=ctx.createRadialGradient(hook.x,hy,0,hook.x,hy,24);gr.addColorStop(0,'rgba(255,240,160,.8)');gr.addColorStop(1,'rgba(255,240,160,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(hook.x,hy,24,0,TAU);ctx.fill();ctx.globalCompositeOperation='source-over'}
 }
 if(state==='landing'){for(const p of landing.fl){if(p.done||landing.t<p.delay)continue;ctx.save();ctx.translate(p.x,p.y-camY);ctx.rotate(p.r);drawFish(ctx,p.f.sp,Math.min(p.f.size,90),T,0,false);ctx.restore()}}
 for(const f of floats){ctx.globalAlpha=clamp(f.life,0,1);ctx.font='900 '+f.size+'px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.strokeStyle='rgba(0,0,0,.5)';ctx.strokeText(f.txt,f.x,f.y-camY);ctx.fillStyle=f.col;ctx.fillText(f.txt,f.x,f.y-camY);ctx.globalAlpha=1}
 ctx.restore();
 if(state==='reel'||(reel&&reel.res))drawReelUI();
 if(state==='cast'&&castInfo.phase!=='drop')drawDepthGauge();
}
function drawHook(x,y,flash){ctx.save();ctx.translate(x,y);ctx.strokeStyle=flash&&Math.floor(T*20)%2?'#ff8ad8':'#e8eef5';ctx.lineWidth=3;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-8);ctx.lineTo(0,6);ctx.arc(-5,6,5,0,Math.PI*.9);ctx.stroke();ctx.fillStyle='#ff4a5a';ctx.beginPath();ctx.arc(0,-10,4,0,TAU);ctx.fill();ctx.restore()}
function drawDepthGauge(){const x=W-22,y0=70,y1=H-90,h=y1-y0;ctx.fillStyle='rgba(0,0,0,.35)';rr(x-6,y0-4,12,h+8,6);ctx.fill();const w=water();const max=castInfo.maxPx/PPM;
 [[0,w.cols[0]],[w.z[0],w.cols[1]],[w.z[1],w.cols[2]]].forEach(z=>{if(z[0]<max){ctx.fillStyle=z[1];const a=y0+h*z[0]/max;ctx.fillRect(x-3,a,6,Math.min(y1,y0+h*(z===null?1:1))-a)}});
 ctx.fillStyle=w.cols[2];if(w.z[1]<max)ctx.fillRect(x-3,y0+h*w.z[1]/max,6,y1-(y0+h*w.z[1]/max));
 if(w.leg<max){ctx.fillStyle='#ffd23f';ctx.fillRect(x-8,y0+h*w.leg/max,16,2)}
 const p=clamp(hook.y/castInfo.maxPx,0,1);ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y0+h*p,7,0,TAU);ctx.fill();ctx.fillStyle='#ff4a5a';ctx.beginPath();ctx.arc(x,y0+h*p,4,0,TAU);ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function drawReelUI(){const r=reel;if(!r)return;const bw=Math.min(W*.86,440),bx=(W-bw)/2,by=H-120;
 ctx.fillStyle='rgba(0,10,25,.7)';rr(bx-14,by-56,bw+28,110,18);ctx.fill();
 ctx.fillStyle='#24384f';rr(bx,by,bw,26,13);ctx.fill();
 const zx=bx+bw*(r.zc-r.zw/2);ctx.fillStyle='rgba(124,240,138,.85)';rr(zx,by,bw*r.zw,26,13);ctx.fill();
 ctx.fillStyle='rgba(255,80,80,.7)';rr(bx+bw*.93,by,bw*.07,26,8);ctx.fill();
 const nx=bx+bw*r.ten;ctx.fillStyle='#fff';ctx.beginPath();ctx.moveTo(nx,by-6);ctx.lineTo(nx-8,by-18);ctx.lineTo(nx+8,by-18);ctx.fill();ctx.fillRect(nx-2,by-6,4,38);
 ctx.fillStyle='#132233';rr(bx,by+38,bw,10,5);ctx.fill();const pg=ctx.createLinearGradient(bx,0,bx+bw,0);pg.addColorStop(0,'#ffd23f');pg.addColorStop(1,'#ff7a1a');ctx.fillStyle=pg;rr(bx,by+38,Math.max(10,bw*clamp(r.prog,0,1)),10,5);ctx.fill();
 ctx.font='900 16px "Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.fillStyle='#fff';ctx.fillText(r.res?'':(r.f.sp.z===3?'★ ':'')+r.f.wt.toFixed(1)+'kg · HOLD to reel',W/2,by-28);
 // fish preview thrash
}
// ---------- loop ----------
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;
 if(!paused){T+=dt;
  if(state==='title'){camY=-H*.42;for(const f of titleFish){f.x+=f.d*f.v*dt;if(f.x>1.15)f.x=-.15;if(f.x<-.15)f.x=1.15}}
  else if(state==='hub'){camY+=(-H*.42-camY)*Math.min(1,dt*3);if(hubW!==G.water)makeHubFish();for(const f of hubFish){f.x+=f.d*f.v*dt;if(f.x>1.15)f.x=-.15;if(f.x<-.15)f.x=1.15}}
  else if(state==='cast'||state==='reel'){if(state==='cast')updateCast(dt);else{updateReel(dt);for(const e of ents){if(e.k==='f'&&e!==reel?.f){e.x+=e.vx*dt*.3}}}
   const target=hook.y-H*(castInfo.phase==='up'?.66:.38);camY+=(target-camY)*Math.min(1,dt*(castInfo.phase==='drop'?3:6));
   $('depth').textContent=Math.max(0,Math.round(hook.y/PPM))+'m';}
  else if(state==='landing'){updateLanding(dt);camY+=(-H*.42-camY)*Math.min(1,dt*3)}
  for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.col!=='b'){p.vx*=.96;p.vy*=.96}if(p.life<=0)parts.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=30*dt;if(f.life<=0)floats.splice(i,1)}
  for(let i=ents.length-1;i>=0;i--){const e=ents[i];if(e.escape){e.y+=150*dt;e.escape-=dt*.5;if(e.escape<=0){ents.splice(i,1)}}}
  shake=Math.max(0,shake-dt*30);
  if(shownCoins!==G.coins){shownCoins+=Math.sign(G.coins-shownCoins)*Math.max(1,Math.ceil(Math.abs(G.coins-shownCoins)*dt*6));if(Math.abs(G.coins-shownCoins)<2)shownCoins=G.coins}
  $('coins').textContent=fmtN(shownCoins);
 }
 render();requestAnimationFrame(loop)}
requestAnimationFrame(loop);

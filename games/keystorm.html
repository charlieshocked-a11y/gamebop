<html lang="en"><head><meta charset="utf-8">

<style>

</style></head><body><canvas id="c"></canvas><input id="kb" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
<script>
'use strict';
const TAU=Math.PI*2,clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const R=a=>a[(Math.random()*a.length)|0],RI=(a,b)=>a+((Math.random()*(b-a+1))|0);
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif',MONO='Consolas,"Liberation Mono","DejaVu Sans Mono","Courier New",monospace';
// ---------- storage ----------
const SK='gamebop.keystorm.';
function sget(k,d){try{const v=localStorage.getItem(SK+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function sset(k,v){try{localStorage.setItem(SK+k,JSON.stringify(v))}catch(e){}}
const save=Object.assign({open:0,stars:[],pts:0,up:{},mute:false,bestWpm:0,bestCombo:0,shopSeen:0},sget('save',{}));
let hasSave=!!sget('save',null);
function persist(){hasSave=true;sset('save',save)}
// ---------- canvas ----------
const C=document.getElementById('c'),X=C.getContext('2d');let W,H,DPR,U;
function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR|0;C.height=H*DPR|0;U=clamp(Math.min(W/900,H/620),0.5,1.5);makeCity()}
addEventListener('resize',resize);
// ---------- audio ----------
let AC=null,MG=null;
function initAudio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=save.mute?0:0.5;MG.connect(AC.destination)}catch(e){AC=null}}
function tone(f,d,type,v,slide,delay){if(!AC)return;const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f+slide),t+d);g.gain.setValueAtTime(v||0.1,t);g.gain.exponentialRampToValueAtTime(0.0008,t+d);o.connect(g);g.connect(MG);o.start(t);o.stop(t+d+0.05)}
function noise(d,v,fq){if(!AC)return;const t=AC.currentTime,b=AC.createBuffer(1,AC.sampleRate*d|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.pow(1-i/a.length,2);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=fq||1200;const g=AC.createGain();g.gain.value=v||0.3;s.connect(f);f.connect(g);g.connect(MG);s.start(t)}
const sfx={key(m){tone(900+Math.min(m,8)*90+Math.random()*40,0.04,'square',0.04)},bad(){tone(140,0.16,'sawtooth',0.1,-50)},lock(){tone(1400,0.05,'triangle',0.06)},
boom(big){noise(big?0.9:0.45,big?0.5:0.3,big?700:1600);tone(big?90:160,big?0.6:0.3,'sine',0.2,-60)},hit(){noise(0.7,0.5,500);tone(70,0.5,'square',0.12,-30)},
click(){tone(600,0.05,'triangle',0.08)},win(){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0.2,'triangle',0.1,0,i*0.09))},lose(){[330,262,196,147].forEach((f,i)=>tone(f,0.3,'sawtooth',0.08,0,i*0.18))},
nova(){noise(1.2,0.5,3000);tone(200,1,'sawtooth',0.1,1200)},shield(){tone(500,0.3,'sine',0.15,700)},buy(){[400,600,800,1200].forEach((f,i)=>tone(f,0.1,'square',0.07,0,i*0.05))},combo(n){tone(600+n*120,0.15,'triangle',0.09,300)}};
function setMute(m){save.mute=m;persist();if(MG)MG.gain.value=m?0:0.5}
// ---------- words ----------
const WB=['Asteroid','orbital','Velocity','Frequency','gravity','Nebula','Quantum','spectrum','Horizon','satellite','Comet','eclipse','Magnetic','Thruster','reactor','Payload','Altitude','Vector','Ignition','Station','Beacon','Corridor','Cascade','Phantom','Zenith','Meridian','Fragment','Kinetic','Lattice','Momentum','Pulsar','Quasar','Radiant','Sentinel','Tempest','Umbra','Vortex','Warden','Xenon','Yonder','Zephyr','Capsule','Deflector','Equinox','Flare','Gyroscope','Hydrogen','Inertia','Jettison','Kelvin','Luminous','Monolith','Nucleus','Obsidian','Parallax','Quadrant','Rendezvous','Solstice','Trajectory','Uplink','Voltage','Wavelength','Bulwark','Citadel','Dynamo','Eruption','Furnace','Garrison','Hailstorm','Impact','Javelin','Keystone','Lantern','Meltdown','Outpost','Perimeter','Rampart','Shrapnel','Tremor','Upheaval','Vanguard','Watchtower','Barrage','Crater','Debris','Ember','Fissure','Glacier','Havoc','Inferno','Juggernaut','Overload','Bastion','Cyclone','Ballistic','Overclock','Typhoon','Afterburn','Gauntlet','Lightning','Nightfall','Quicksilver','Ricochet','Skyline','Thunderclap','Undertow','Wildfire'];
const VB=['Hold','Deploy','Abort','Engage','Reroute','Divert','Charge','Launch','Scan','Seal','Evacuate','Arm','Lock','Brace','Fire','Purge','Reboot','Cancel','Confirm','Override'];
const NB=['shields','lasers','gate','tower','sector','reactor','grid','hangar','drones','beacon','turret','dome','bridge','core','relay','vault'];
const lw=w=>w.toLowerCase(),up=w=>w.toUpperCase(),cap=w=>w[0].toUpperCase()+w.slice(1).toLowerCase();
function wS1(k){let w=R(WB);const r=Math.random();if(r<0.35)w=lw(w);else if(r<0.45+k*0.05)w=up(w);if(Math.random()<0.4+k*0.08)w+=R([',','.','!','?',';',':']);if(k>=2&&Math.random()<0.25)w=R(['"',"'",'('])+w+R(['"',"'",')']).replace(/[,.!?;:]$/,'');if(k>=3&&Math.random()<0.3)w=cap(R(WB))+'-'+lw(R(WB));return w}
function wS2(k){const n=()=>RI(2,99),w=cap(R(WB)).slice(0,RI(4,7));return R([()=>w+'-'+n(),()=>RI(1,12)+':'+String(RI(0,59)).padStart(2,'0')+R(['','!','pm','am']),()=>'$'+RI(1,999)+'.'+String(RI(0,99)).padStart(2,'0'),()=>RI(5,100)+'%',()=>'v'+RI(1,9)+'.'+RI(0,9)+'.'+RI(0,20),()=>'#'+String.fromCharCode(65+RI(0,25))+RI(1,99),()=>'('+n()+', -'+n()+')',()=>R(['x','y','z','n'])+'='+n(),()=>RI(1,9)+'/'+RI(2,16),()=>RI(1,9)+','+RI(100,999),()=>'+'+n()+'.'+RI(0,9),()=>'No.'+n(),()=>'T-'+n()+'s',()=>up(w)+'_'+n(),()=>n()+'x'+n(),()=>'Gate '+String.fromCharCode(65+RI(0,25))+'-'+RI(1,9)])()}
function wS3(k){const n=RI(2,99),v=R(VB),no=R(NB),w=cap(R(WB));return R([()=>v+' '+no+'!',()=>v+' '+no+' @ '+RI(1,12)+':'+String(RI(0,59)).padStart(2,'0')+'!',()=>cap(no)+' at '+RI(10,99)+'%!',()=>v+' unit '+String.fromCharCode(65+RI(0,25))+'-'+RI(1,9)+'?',()=>'Sector '+n+': clear.',()=>'Over & out, '+w+'.',()=>v+' (now)!',()=>'Ready? Aim; fire!',()=>'Copy that, '+up(no.slice(0,2))+'Q.',()=>w+' says: "'+lw(v)+'!"',()=>"Don't "+lw(v)+' the '+no+'!',()=>'Re-'+lw(v)+' '+no+' #'+n,()=>v+'! '+v+'!',()=>no+'s: '+RI(1,9)+'/'+RI(10,20)])()}
function wS4(k){const n=RI(2,99),w=lw(R(WB)).slice(0,RI(3,6)),w2=lw(R(WB)).slice(0,RI(3,6));return R([()=>'if (x > '+n+') {',()=>w+'['+RI(0,9)+'] += '+n+';',()=>w+' && !'+w2,()=>w+'@'+w2+'.io',()=>'~/'+w+'/*.log',()=>'x^2 != y',()=>"{"+w+": '"+w2+"'}",()=>'<'+w+'/>',()=>'C:\\'+cap(w)+'\\'+n,()=>'$'+w+' = '+n+';',()=>'f(x) = '+RI(2,9)+'x + '+n,()=>w+'_'+n+'.txt',()=>'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),()=>w+' % '+n+' == 0',()=>'i++; j--;',()=>'print("'+cap(w)+'!")',()=>'['+RI(0,9)+'..'+n+']',()=>'|x| <= '+n,()=>'~'+n+' & 0xFF',()=>w+'.'+w2+'()',()=>'a['+w+'] = `'+w2+'`;',()=>'n => n * '+n])()}
function wS5(k){const r=Math.random();return r<0.3?wS4(k):r<0.55?wS3(k):r<0.75?wS2(k)+' '+wS1(3):wS1(4)+' '+wS2(k)}
const GEN=[wS1,wS2,wS3,wS4,wS5];
const SECT=[{n:'OUTER RING',c1:'#2b0f5c',c2:'#0b2a5c',a:'#5ce1ff'},{n:'NUMBER BELT',c1:'#3b0a2a',c2:'#0a1a3a',a:'#ff6ad5'},{n:'PHRASE STORM',c1:'#0a3a2a',c2:'#08122e',a:'#7dff9a'},{n:'CODE NEBULA',c1:'#3a2a00',c2:'#140a2a',a:'#ffcf3a'},{n:'THE CORE',c1:'#4a0606',c2:'#12041e',a:'#ff5a3a'}];
const BOSS=["Brace yourselves, citizens: the Storm has arrived!","Evacuate Tower 9 by 7:45pm; gates A-F close at 8:00!","Re-route power @ 85% -- shields first, then lasers (hurry)!",'if (hull <= 12 && !shield) { alert("Abandon ship!"); }',"FINAL WARNING: Core temp = 9,750K; x^2 != y; reboot (y/N)? #Hold_The_Line!"];
function chunks(s,max){const w=s.split(' '),out=[];let cur='';for(const x of w){if(cur&&(cur+' '+x).length>max){out.push(cur+' ');cur=x}else cur=cur?cur+' '+x:x}if(cur)out.push(cur);return out}
const TGT_WPM=[48,42,45,38,45];
// ---------- upgrades ----------
const UPS=[{k:'slow',max:4,cost:[500,1100,2200,4000]},{k:'chain',max:3,cost:[800,1800,3800]},{k:'shield',max:3,cost:[600,1500,3300]},{k:'focus',max:3,cost:[500,1300,2800]},{k:'nova',max:3,cost:[900,2200,4800]}];
const UL=k=>save.up[k]||0;
// ---------- state ----------
let state='title',paused=false,time=0,L=0,lv=null,mets=[],parts=[],texts=[],lock=null,shake=0,flash=0,flashC='255,60,60',stars=[],city=[],cityHP=0,shield=0,novaN=0,beams=[],res=null,ui=[],mouse={x:-1,y:-1},demo=[],selSect=0,shopFrom=null;
let st={chars:0,errors:0,combo:0,maxCombo:0,score:0,t:0,killed:0};
function mkStars(){stars=[];for(let i=0;i<180;i++)stars.push({x:Math.random(),y:Math.random(),z:Math.random()*0.8+0.2})}mkStars();
function makeCity(){city=[];let x=0;const base=H;let i=0;while(x<W){const w=(30+Math.random()*50)*Math.max(0.7,U),h=(40+Math.random()*90)*Math.max(0.6,U);city.push({x,w,h,hp:1,win:[],i:i++});x+=w+2}for(const b of city){for(let k=0;k<20;k++)b.win.push([Math.random(),Math.random(),Math.random()<0.6])}}
function cityY(){return H-70*Math.max(0.6,U)}
function lvlCfg(l){const s=Math.floor(l/6),k=l%6;return{s,k,boss:k===5,quota:k===5?6+s*2:12+k*2+s*2,fall:Math.max(5.5,13-l*0.24),spawn:Math.max(0.9,2.3-l*0.048)}}
function startLevel(l){initAudio();L=l;lv=lvlCfg(l);mets=[];parts=[];texts=[];beams=[];lock=null;res=null;paused=false;st={chars:0,errors:0,combo:0,maxCombo:0,score:0,t:0,tt:0,killed:0,spawned:0,spawnT:1.2,intro:2.2,keys:0};
cityHP=100;shield=UL('shield');novaN=UL('nova');for(const b of city)b.hp=1;state='play';
if(lv.boss){const ch=chunks(BOSS[lv.s],W<600?16:22);mets.push({boss:true,chunks:ch,ci:0,text:ch[0],i:0,x:W/2,y:-60,vy:0,r:70*Math.max(0.6,U),rot:0,hit:0,col:SECT[lv.s].a,bx:0})}
focusKb()}
function pickText(){const g=GEN[lv.s];for(let t=0;t<14;t++){const w=g(lv.k);if(w.length>(W<500?16:26))continue;if(!mets.some(m=>m.text[m.i]===w[0]||m.text[0]===w[0]))return w}return g(lv.k)}
function spawn(){const t=pickText();X.font=fontFor(t);const tw=X.measureText(t).width;const x=clamp(Math.random()*W,tw/2+16,W-tw/2-16);const sp=(cityY()+40)/(lv.fall*(1+Math.max(0,t.length-8)/16))*(1-UL('slow')*0.07);
mets.push({text:t,i:0,x,y:-30,vx:(Math.random()-0.5)*10,vy:sp,r:(14+Math.min(t.length,20)*0.8)*Math.max(0.65,U),rot:Math.random()*TAU,vr:(Math.random()-0.5)*2,hit:0,col:SECT[lv.s].a,seed:Math.random()*1000});st.spawned++}
function fontFor(t){return'700 '+Math.round(Math.max(15,19*U))+'px '+MONO}
// ---------- input ----------
const kb=document.getElementById('kb');
function focusKb(){if(isTouch){try{kb.value='';kb.focus({preventScroll:true})}catch(e){}}}
let isTouch=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
kb.addEventListener('input',e=>{const v=kb.value;kb.value='';for(const ch of v)typeChar(ch)});
addEventListener('keydown',e=>{initAudio();if(e.target===kb&&e.key.length===1){return}
if(e.key==='Escape'||(e.key==='Pause')){if(state==='play'&&!res)togglePause();else if(state==='map'||state==='shop'){state=state==='shop'&&shopFrom==='res'?'map':state==='shop'?'map':'title';sfx.click()}e.preventDefault();return}
if(state==='play'&&!paused&&!res){if(e.key==='Enter'){useNova();e.preventDefault();return}if(e.key.length===1&&!e.ctrlKey&&!e.metaKey&&!e.altKey){e.preventDefault();typeChar(e.key)}else if(e.key==='Tab'||e.key==='Backspace'){e.preventDefault();if(lock&&!lock.boss){lock=null}}return}
if(e.key==='Enter'||e.key===' '){e.preventDefault();if(state==='title')state='map';else if(state==='play'&&res){if(res.win&&L<29)startLevel(L+1);else startLevel(L)}else if(state==='play'&&paused)togglePause()}
if(state==='map'&&(e.key==='ArrowRight'||e.key==='ArrowLeft')){selSect=clamp(selSect+(e.key==='ArrowRight'?1:-1),0,4)}
if(e.key==='p'&&state==='play'&&paused)togglePause()});
function togglePause(){paused=!paused;if(!paused)focusKb()}
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='play'&&!res)paused=true});
C.addEventListener('pointerdown',e=>{initAudio();if(e.pointerType==='touch')isTouch=true;const x=e.clientX,y=e.clientY;for(let i=ui.length-1;i>=0;i--){const b=ui[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){sfx.click();b.fn();return}}if(state==='play')focusKb()});
addEventListener('pointermove',e=>{mouse.x=e.clientX;mouse.y=e.clientY});
function typeChar(ch){if(state!=='play'||paused||res||st.intro>0)return;st.keys++;
if(!lock){let best=null;for(const m of mets){if(m.dead)continue;if(m.text[m.i]===ch&&(!best||m.y>best.y))best=m}
if(!best){bad(null);return}lock=best;sfx.lock()}
const m=lock;if(m.lt==null)m.lt=st.t;if(m.text[m.i]===ch){m.i++;st.chars++;st.combo++;st.maxCombo=Math.max(st.maxCombo,st.combo);const mult=multOf();st.score+=5*mult;sfx.key(mult);m.hit=0.12;beams.push({x:m.x,y:m.y,t:0.12});
if(st.combo%15===0&&mult<=8)sfx.combo(mult),texts.push({x:W/2,y:H*0.3,s:'×'+mult,t:0,c:'#ffd84a',big:1});
for(let k=0;k<3;k++)parts.push({x:m.x,y:m.y,vx:(Math.random()-0.5)*160,vy:(Math.random()-0.5)*160,l:0.3,m:0.3,s:2,c:'#fff'});
if(m.i>=m.text.length){st.tt+=st.t-m.lt+0.25;m.lt=null;if(m.boss)bossChunk(m);else destroy(m,true);lock=null}}
else bad(m)}
function liveWpm(){let t=st.tt;if(lock&&lock.lt!=null)t+=st.t-lock.lt;return t>1?st.chars/5/(t/60):0}
function multOf(){return Math.min(8,1+Math.floor(st.combo/15))}
function bad(m){st.errors++;const f=UL('focus');st.combo=Math.floor(st.combo*[0,0.5,0.75,0.9][f]);st.score=Math.max(0,st.score-10);sfx.bad();shake=Math.max(shake,0.25);flash=0.25;flashC='255,40,60';if(m){m.err=0.3;m.y+=6*U}}
function destroy(m,byPlayer){m.dead=true;const mult=multOf();if(byPlayer){const pts=m.text.length*5*mult;st.score+=pts;texts.push({x:m.x,y:m.y,s:'+'+pts,t:0,c:'#fff'});st.killed++}
explode(m.x,m.y,m.r,m.col);sfx.boom(false);shake=Math.max(shake,0.2);
if(byPlayer&&UL('chain')){let near=null,nd=1e9;for(const o of mets){if(o.dead||o.boss||o===m)continue;const d=Math.hypot(o.x-m.x,o.y-m.y);if(d<nd&&d<W*0.45){nd=d;near=o}}if(near){const n=Math.min(UL('chain'),near.text.length-near.i);beams.push({x:near.x,y:near.y,fx:m.x,fy:m.y,t:0.25,c:'#ffcf3a'});near.i+=n;if(lock===near&&near.i>=near.text.length)lock=null;if(near.i>=near.text.length)setTimeout(()=>{if(!near.dead)destroy(near,true)},120)}}}
function bossChunk(m){m.ci++;explode(m.x+(Math.random()-0.5)*m.r,m.y+(Math.random()-0.5)*m.r,m.r*0.6,m.col);sfx.boom(true);shake=0.6;st.score+=m.text.length*10*multOf();
if(m.ci>=m.chunks.length){m.dead=true;explode(m.x,m.y,m.r*2.2,m.col);explode(m.x,m.y,m.r*1.5,'#fff');flash=0.8;flashC='255,240,200';for(const o of mets)if(!o.dead&&!o.boss){destroy(o,true)}st.killed++}
else{m.text=m.chunks[m.ci];m.i=0;m.y=Math.max(Math.min(m.y,cityY()*0.12+m.r),m.y-cityY()*0.12)}}
function useNova(){if(novaN<=0||state!=='play'||paused||res){sfx.bad();return}novaN--;sfx.nova();flash=1;flashC='160,230,255';for(const m of mets)if(!m.dead&&!m.boss)destroy(m,true);for(const m of mets)if(m.boss)m.y=Math.max(Math.min(m.y,cityY()*0.12+m.r),m.y-cityY()*0.1);lock=null;shake=0.6}
function explode(x,y,r,c){for(let i=0;i<30+r;i++){const a=Math.random()*TAU,s=(60+Math.random()*260)*(r/30);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:0.5+Math.random()*0.6,m:1.1,s:2+Math.random()*4,c:Math.random()<0.5?c:'#ffb040'})}parts.push({ring:1,x,y,r:4,R:r*2.6,l:0.4,m:0.4,c})}
// ---------- update ----------
function update(dt){if(state==='title'||state==='map'||state==='shop'){updDemo(dt);updParts(dt);return}
if(paused)return;if(res){res.t+=dt;updParts(dt);return}
if(st.intro>0){st.intro-=dt;updParts(dt);return}
st.t+=dt;const cy=cityY();
// spawning
const quotaLeft=lv.quota-st.spawned;st.spawnT-=dt;if(!mets.some(m=>!m.boss))st.spawnT=Math.min(st.spawnT,0.35);if(quotaLeft>0&&st.spawnT<=0){spawn();st.spawnT=lv.spawn*(lv.boss?1.6:1)*(0.75+Math.random()*0.5)}
if(lv.boss&&quotaLeft<=0&&mets.some(m=>m.boss&&!m.dead))st.spawned=lv.quota-1,st.spawnT=Math.max(st.spawnT,lv.spawn*2);
for(const m of mets){if(m.dead)continue;if(m.boss){const target=cy-m.r*0.4;m.vy=(cy+40)/(48+lv.s*-4)*(1-UL('slow')*0.07);m.y+=m.vy*dt;m.x=W/2+Math.sin(time*0.4)*W*0.12;m.rot+=dt*0.15;if(m.y>=target){cityHit(m,40)}}
else{m.y+=m.vy*dt*(m.err>0?1.6:1);m.x+=m.vx*dt;m.rot+=m.vr*dt;if(m.y>=cy-4)cityHit(m,lv.s>=3?22:18)}
m.hit=Math.max(0,m.hit-dt);if(m.err)m.err=Math.max(0,m.err-dt);
if(Math.random()<0.5)parts.push({x:m.x+(Math.random()-0.5)*m.r,y:m.y-m.r*0.5,vx:(Math.random()-0.5)*20,vy:-m.vy*0.4-30,l:0.5,m:0.5,s:2+Math.random()*3*(m.boss?2:1),c:Math.random()<0.5?'#ff8a3a':m.col})}
mets=mets.filter(m=>!m.dead);if(lock&&lock.dead)lock=null;
for(const b of beams)b.t-=dt;beams=beams.filter(b=>b.t>0);
updParts(dt);

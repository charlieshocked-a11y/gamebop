<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Hopjack</title>
<style>
:root{--ink:#2a1433;--cream:#fff0d4;--gold:#ffbf3c;--org:#ff7a3d;--plum:#5c2a5f}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#2a1433;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;font-family:"Trebuchet MS","Avenir Next","Segoe UI",system-ui,sans-serif;color:var(--ink)}
#c{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
.scr{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;padding:14px}
.scr.on{display:flex;animation:fin .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes fin{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
.dim{background:rgba(32,10,44,.55)}
.btn{pointer-events:auto;font:inherit;font-weight:900;letter-spacing:.5px;color:var(--ink);background:linear-gradient(#fff8e8,#ffdca6);border:3px solid var(--ink);border-radius:16px 8px 16px 8px;padding:10px 18px;font-size:17px;box-shadow:0 5px 0 var(--ink),0 9px 14px rgba(0,0,0,.3);cursor:pointer;transition:transform .09s,box-shadow .09s;position:relative;text-transform:uppercase;white-space:nowrap}
.btn:hover{transform:translateY(-2px) rotate(-1.2deg)}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--ink),0 2px 5px rgba(0,0,0,.3)}
.btn.go{background:linear-gradient(#ffe07a,#ff8f3a);font-size:26px;padding:13px 34px;border-radius:22px 10px 22px 10px;animation:throb 1.6s ease-in-out infinite}
@keyframes throb{0%,100%{transform:scale(1)}50%{transform:scale(1.05) rotate(-1deg)}}
.btn.go:active{animation:none}
.btn.sm{font-size:14px;padding:8px 12px}
.btn.red{background:linear-gradient(#ff9b8a,#e8453c);color:#fff;text-shadow:0 2px 0 var(--ink)}
.btn[disabled]{opacity:.45;filter:grayscale(.7);cursor:default}
#title{justify-content:flex-end;padding-bottom:calc(26px + env(safe-area-inset-bottom));background:none}
.tb{display:flex;flex-direction:column;align-items:center;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(6px + env(safe-area-inset-bottom));font-size:11px;color:#ffe9d0;opacity:.55;text-decoration:none;pointer-events:auto}
#support:hover{opacity:1}
.card{background:linear-gradient(#fff4de,#ffdfb0);border:4px solid var(--ink);border-radius:24px 12px 24px 12px;box-shadow:0 8px 0 var(--ink),0 20px 40px rgba(0,0,0,.45);padding:16px 18px;max-width:min(560px,100%);width:100%;max-height:calc(100% - 10px);overflow:auto;position:relative}
.card.wide{max-width:min(760px,100%)}
.card h2{margin:0 0 10px;font-size:28px;text-align:center;color:#fff;text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink);letter-spacing:1px;font-weight:900}
.sub{text-align:center;font-weight:800;opacity:.75;margin:-4px 0 10px;font-size:14px}
.wh{font-weight:900;margin:10px 2px 6px;font-size:14px;text-transform:uppercase;opacity:.7}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.tile{font:inherit;font-weight:900;border:3px solid var(--ink);border-radius:12px 6px 12px 6px;background:linear-gradient(#fff,#ffe6bd);box-shadow:0 3px 0 var(--ink);padding:6px 2px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;color:var(--ink)}
.tile:active{transform:translateY(3px);box-shadow:none}
.tile b{font-size:20px}
.tile i{font-style:normal;font-size:12px;color:#d08a00;letter-spacing:-1px}
.tile.boss{background:linear-gradient(#ffb7a6,#ff7a5e)}
.tile.bonus{background:linear-gradient(#fff1a8,#ffd45a)}
.tile.lock{opacity:.4;cursor:default}
.urow{display:flex;align-items:center;gap:10px;padding:8px;border-bottom:2px dashed rgba(42,20,51,.2)}
.urow canvas{flex:none}
.uinfo{flex:1;min-width:0}
.uinfo b{display:block;font-size:16px}
.uinfo small{font-weight:700;opacity:.7}
.pips{display:flex;gap:3px;margin-top:3px}
.pips span{width:10px;height:10px;border-radius:3px;border:2px solid var(--ink);background:#fff}
.pips span.f{background:linear-gradient(#ffe07a,#ff9a3c)}
.bank{text-align:center;font-weight:900;font-size:20px;margin-bottom:6px}
.nut{display:inline-block;width:16px;height:16px;vertical-align:-2px;background:radial-gradient(circle,#7a4a00 0 27%,transparent 29%),#ffc23d;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%)}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.skin{border:3px solid var(--ink);border-radius:14px 8px 14px 8px;background:linear-gradient(#fff,#ffe6bd);padding:6px;text-align:center;cursor:pointer;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.skin.sel{background:linear-gradient(#ffe07a,#ffb03a)}
.skin.lock canvas{filter:brightness(0) opacity(.35)}
.skin small{display:block;font-weight:700;opacity:.7;font-size:11px}
#hud{position:absolute;z-index:5;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:flex;gap:8px;pointer-events:auto}
.rb{width:42px;height:42px;border-radius:50%;border:3px solid var(--ink);background:linear-gradient(#fff8e8,#ffd59a);font:900 16px "Trebuchet MS",Verdana,sans-serif;color:var(--ink);box-shadow:0 3px 0 var(--ink);cursor:pointer;padding:0}
.rb:active{transform:translateY(3px);box-shadow:none}
.rb.off{opacity:.55}
#hPause{display:none}
#skip{position:absolute;z-index:5;top:calc(64px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));display:none;pointer-events:auto}
.stars{display:flex;justify-content:center;gap:14px;margin:6px 0 4px}
.st{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:12px;width:96px;text-align:center}
.st .sh{width:66px;height:64px;background:#c9b28f;clip-path:polygon(50% 0,63% 34%,100% 37%,72% 60%,81% 97%,50% 77%,19% 97%,28% 60%,0 37%,37% 34%);transform:scale(.8);transition:transform .35s cubic-bezier(.2,2,.4,1),background .2s}
.st.on .sh{background:linear-gradient(#fff3a0,#ffb21e);transform:scale(1.08) rotate(-6deg)}
.stats{display:flex;justify-content:center;gap:16px;font-weight:800;margin:8px 0;flex-wrap:wrap}
.stats b{font-size:20px;display:block;text-align:center}
.stats div{text-align:center;font-size:12px}
.tease{display:flex;align-items:center;gap:12px;background:rgba(42,20,51,.9);color:#fff;border-radius:14px 6px 14px 6px;padding:8px 12px;margin:8px 0}
.tease small{display:block;color:var(--gold);font-weight:900;letter-spacing:2px}
.tease b{font-size:18px}
.rbtns{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
.newsk{text-align:center;font-weight:900;color:#c2189a}
.prog{height:16px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden;margin:10px 0}
.prog div{height:100%;background:linear-gradient(90deg,#ff8f3a,#ffe07a)}
.big{font-size:44px;text-align:center;font-weight:900;color:#fff;text-shadow:0 4px 0 var(--ink),3px 0 0 var(--ink),-3px 0 0 var(--ink),0 -3px 0 var(--ink);margin:0}
@media (max-width:520px){.grid{grid-template-columns:repeat(4,1fr)}.btn.go{font-size:22px;padding:12px 26px}.st{width:84px}.card h2{font-size:24px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="hud"><button id="hPause" class="rb" aria-label="Pause">II</button><button id="hMute" class="rb" aria-label="Mute">&#9835;</button></div>
  <button id="skip" class="btn sm">Skip &#9656;&#9656;</button>
  <div id="title" class="scr on">
    <div class="tb">
      <button id="bPlay" class="btn go">Play</button>
      <div class="row"><button id="bHow" class="btn sm">How to play</button><button id="bLv" class="btn sm">Levels</button></div>
      <div class="row"><button id="bShop" class="btn sm">Workshop</button><button id="bSkin" class="btn sm">Skins</button></div>
    </div>
    <a id="support" href="https://cash.app/$CharlieShocked" target="_blank" rel="noopener">Support &#9829;</a>
  </div>
  <div id="levels" class="scr dim"><div class="card wide"><h2>Levels</h2><div class="sub" id="lvSub"></div><div id="lvGrid"></div><div class="row" style="margin-top:12px"><button class="btn sm back">Back</button></div></div></div>
  <div id="shop" class="scr dim"><div class="card"><h2>Workshop</h2><div class="bank"><span class="nut"></span> <b id="shopB">0</b></div><div id="shopList"></div><div class="row" style="margin-top:12px"><button class="btn sm back">Back</button></div></div></div>
  <div id="skins" class="scr dim"><div class="card wide"><h2>Pogo Skins</h2><div class="bank"><span class="nut"></span> <b id="skinB">0</b></div><div id="skinGrid" class="sgrid"></div><div class="row" style="margin-top:12px"><button class="btn sm back">Back</button></div></div></div>
  <div id="pause" class="scr dim"><div class="card" style="max-width:340px;text-align:center"><h2>Paused</h2><div class="tb"><button id="pRes" class="btn go">Resume</button><div class="row"><button id="pRe" class="btn sm">Restart</button><button id="pMenu" class="btn sm">Menu</button></div></div></div></div>
  <div id="results" class="scr dim"><div class="card">
    <h2 id="rT">Level 1</h2>
    <div class="stars"><div class="st" id="s0"><div class="sh"></div><span>Finish</span></div><div class="st" id="s1"><div class="sh"></div><span id="s1t">All bolts</span></div><div class="st" id="s2"><div class="sh"></div><span id="s2t">Combo</span></div></div>
    <div class="stats"><div><b id="rTime">0.0</b>time</div><div><b id="rBolts">+0</b>bolts</div><div><b id="rCombo">0</b>best combo</div></div>
    <div id="rNew" class="newsk"></div>
    <div class="tease" id="rTease"><canvas id="teaseC" width="150" height="92"></canvas><div><small>NEXT UP</small><b id="teaseT"></b></div></div>
    <div class="rbtns"><div class="row"><button id="rMenu" class="btn sm">Menu</button><button id="rRe" class="btn sm">Retry</button></div><button id="rNext" class="btn go">Next &#9654;</button></div>
  </div></div>
  <div id="fail" class="scr dim"><div class="card" style="max-width:420px;text-align:center">
    <p class="big">BONKED!</p><div class="sub" id="fSub">So close!</div>
    <div class="prog"><div id="fBar"></div></div>
    <div class="rbtns"><div class="row"><button id="fMenu" class="btn sm">Menu</button><button id="fCP" class="btn sm">From &#9873;</button></div><button id="fRe" class="btn go">Retry</button></div>
  </div></div>
</div>
<script>
'use strict';
// ================= storage =================
const PFX='gamebop.hopjack.';
function lsGet(k,d){try{const v=localStorage.getItem(PFX+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(PFX+k,JSON.stringify(v))}catch(e){}}
let save=Object.assign({unlocked:1,last:1,stars:{},best:{},bolts:0,earned:0,up:{},skins:['classic'],skin:'classic',golden:{},tut:false,moon:0,combo:0,plays:0},lsGet('save',{})||{});
save.up=Object.assign({spring:0,fins:0,timing:0,magnet:0,heart:0,bank:0},save.up||{});
['stars','best','golden'].forEach(k=>{if(!save[k]||typeof save[k]!=='object')save[k]={}});
if(!Array.isArray(save.skins))save.skins=['classic'];
let hadSave=lsGet('save',null)!=null;
let muted=!!lsGet('mute',false);
function persist(){lsSet('save',save);hadSave=true}

// ================= utils =================
const lerp=(a,b,t)=>a+(b-a)*t,clamp=(v,a,b)=>v<a?a:v>b?b:v,PI=Math.PI,TAU=PI*2;
function rng(seed){let a=seed>>>0;return function(){a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hsh(a,b,c){let h=Math.imul(a|0,374761393)^Math.imul(b|0,668265263)^Math.imul(c|0,1274126177);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const now=()=>performance.now()/1000;

// ================= audio =================
let AC=null,MG=null,MUS=null,NB=null;
function audio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=muted?0:.55;MG.connect(AC.destination);MUS=AC.createGain();MUS.gain.value=.5;MUS.connect(MG);
    NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;}catch(e){AC=null;return}}
  if(AC.state==='suspended')AC.resume();
}
function osc(type,f0,f1,dur,vol,delay=0,dest){if(!AC||muted)return;const t=AC.currentTime+delay;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+dur+.05)}
function nz(dur,vol,freq,type='lowpass',delay=0,dest){if(!AC||muted)return;const t=AC.currentTime+delay;const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f);f.connect(g);g.connect(dest||MG);s.start(t,Math.random()*.5);s.stop(t+dur+.02)}
function boingS(k,big){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain(),l=AC.createOscillator(),lg=AC.createGain();const d=big?.36:.2;const f=(big?115:165)*k*(.94+Math.random()*.12);o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*3.3,t+d*.45);o.frequency.exponentialRampToValueAtTime(f*2.3,t+d);l.frequency.value=big?20:28;lg.gain.setValueAtTime(f*.7,t);lg.gain.exponentialRampToValueAtTime(1,t+d);l.connect(lg);lg.connect(o.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(big?.3:.2,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MG);o.start(t);l.start(t);o.stop(t+d+.05);l.stop(t+d+.05)}
const sfx={
  boing:(k=1,big=false)=>boingS(k,big),
  thud:v=>nz(.07,Math.min(.22,v/6000),380),
  note:i=>{const sc=[0,2,4,7,9];const st=Math.min(sc[i%5]+12*Math.floor(i/5),31);const f=523.25*Math.pow(2,st/12);osc('triangle',f,0,.5,.17);osc('sine',f*2,0,.3,.05)},
  squeak:(k=1)=>{osc('square',650*k,1500*k,.09,.07);osc('sine',190,60,.13,.22)},
  ping:i=>{const f=1500+Math.min(i,14)*70;osc('sine',f,0,.1,.09);osc('sine',f*1.5,0,.07,.04,.03)},
  hurt:()=>{osc('sawtooth',420,80,.35,.13);nz(.25,.2,900)},
  crack:()=>nz(.12,.16,2500,'highpass'),
  crumble:()=>{nz(.5,.25,500);osc('sine',80,40,.3,.15)},
  pop:()=>{nz(.08,.3,3000,'highpass');osc('square',300,80,.08,.07)},
  hiss:()=>nz(.5,.14,3800,'highpass'),
  twang:()=>{osc('sawtooth',230,110,.3,.09);osc('triangle',460,200,.2,.06);nz(.25,.08,900,'bandpass',.05)},
  splash:()=>{nz(.45,.3,1100,'bandpass');osc('sine',300,90,.2,.1)},
  door:()=>{osc('square',95,55,.55,.07);nz(.45,.12,300)},
  click:()=>osc('square',900,0,.03,.05),
  clang:()=>{[220,347,523,811].forEach((f,i)=>osc('sine',f,f*.97,.6,.11-i*.02))},
  chime:()=>{[784,988,1175].forEach((f,i)=>osc('triangle',f,0,.3,.09,i*.07))},
  fanfare:()=>{[523,659,784,1047,1319].forEach((f,i)=>osc('triangle',f,0,.4,.14,i*.1));[0,.12,.24,.36].forEach(d=>nz(.1,.2,2000,'highpass',d))},
  fail:()=>{[392,330,262,196].forEach((f,i)=>osc('triangle',f,f*.97,.3,.13,i*.13))},
  moon:()=>{[523,784,1047,1568,2093,2637].forEach((f,i)=>osc('sine',f,0,.7,.08,i*.08))},
  gold:()=>{[1047,1319,1568,2093].forEach((f,i)=>osc('triangle',f,0,.45,.12,i*.06))},
  star:i=>{osc('triangle',660*Math.pow(1.26,i),0,.45,.17);osc('sine',1320*Math.pow(1.26,i),0,.3,.05)},
  bump:()=>osc('sine',170,90,.09,.12),
  crow:()=>{osc('sawtooth',480,950,.22,.07);osc('sawtooth',950,600,.35,.07,.22)},
  meow:()=>{osc('triangle',620,900,.14,.08);osc('triangle',900,480,.25,.08,.14)},
  boom:()=>{nz(.5,.32,420);osc('sine',95,40,.4,.28)},
  cheer:()=>{for(let i=0;i<6;i++)osc('triangle',480+Math.random()*500,800+Math.random()*500,.16,.025,i*.05)},
  gust:()=>nz(.9,.06,700,'bandpass'),
  coin:()=>{osc('square',988,0,.07,.05);osc('square',1319,0,.2,.05,.07)},
};
let musT=0,musI=0;
function mosc(type,f,dur,vol,t){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(MUS);o.start(t);o.stop(t+dur+.05)}
setInterval(()=>{if(!AC||muted||AC.state!=='running')return;const n=AC.currentTime;if(musT<n)musT=n+.05;while(musT<n+.3){const i=musI,t=musT,bar=Math.floor(i/8)%4,b=i%8,r=[130.81,110,87.31,98][bar];
  if(b===0||b===4)mosc('triangle',r,.5,.06,t);if(b===2||b===6)mosc('triangle',r*1.5,.22,.025,t);
  if(Math.random()<.28){const sc=[0,2,4,7,9,12,14];mosc('sine',r*4*Math.pow(2,sc[Math.floor(Math.random()*7)]/12),.25,.022,t)}
  musT+=.27;musI++}},90);
function setMute(m){muted=m;lsSet('mute',m);if(MG)MG.gain.value=m?0:.55;document.getElementById('hMute').classList.toggle('off',m);document.getElementById('hMute').innerHTML=m?'&#215;':'&#9835;'}

// ================= data =================
const LV=[
 {nm:'Boing Street',idea:'Boing Street',ic:'mat'},
 {nm:'Rooftop Hop',feat:['roof','up'],idea:'Rooftops & gaps',ic:'roof'},
 {nm:'Crumble Tops',feat:['chim','roof'],intro:'chim',idea:'Crumbling chimneys!',ic:'chim'},
 {nm:'Laundry Day',feat:['chim','roof','line'],hop:1,idea:'Hopping pigeon-bots',ic:'pig'},
 {nm:'Gusty Gables',feat:['wind','roof'],intro:'wind',hop:1,idea:'Wind gusts!',ic:'wind'},
 {nm:'Clockwork Rooster',boss:'rooster',hp:3,idea:'BOSS: Clockwork Rooster',ic:'rooster'},
 {nm:'Trampoline Terrace',feat:['tramp','roof'],intro:'tramp',idea:'Trampolines!',ic:'tramp'},
 {nm:'Balloon Pop',feat:['balloon','roof'],intro:'balloon',idea:'Spike balloons!',ic:'bal'},
 {nm:'Windy Balloons',feat:['balloon','wind','chim'],idea:'Balloons in the wind',ic:'bal'},
 {nm:'Crane Yard',feat:['crane','roof'],intro:'crane',idea:'Swinging cranes!',ic:'crane'},
 {nm:'Sky Swing',feat:['crane','tramp','chim'],idea:'Cranes + trampolines',ic:'crane'},
 {nm:'Tin Tomcat',boss:'tomcat',hp:3,idea:'BOSS: Tin Tomcat',ic:'tomcat'},
 {nm:'Stomp Gates',feat:['door','roof'],intro:'door',idea:'Stomp-button gates!',ic:'door'},
 {nm:'Gate Crumble',feat:['door','chim','balloon'],idea:'Gates + crumbles',ic:'door'},
 {nm:'Rising Tide',feat:['roof','up','chim'],flood:1,idea:'The flood is rising!',ic:'flood'},
 {nm:'Flooded Cranes',feat:['crane','door','up'],flood:1,idea:'Flood + cranes',ic:'flood'},
 {nm:'Drone Alley',feat:['drone','balloon'],intro:'drone',idea:'Bonk-able drones!',ic:'drone'},
 {nm:'Pigeon King',boss:'king',hp:4,idea:'BOSS: Pigeon King',ic:'king'},
 {nm:'Lift Lanes',feat:['elev','drone'],intro:'elev',idea:'Rooftop lifts!',ic:'elev'},
 {nm:'Treasure Roofs',feat:['tramp','balloon'],bonus:1,idea:'BONUS: treasure roofs',ic:'bolt'},
 {nm:'Gale Cranes',feat:['crane','wind','elev'],idea:'Cranes in a gale',ic:'wind'},
 {nm:'Flood Gates',feat:['door','tramp','drone','up'],flood:1,idea:'Flood + gates',ic:'flood'},
 {nm:'Crumble Rush',feat:['chim','elev','wind','balloon'],idea:'Crumble rush!',ic:'chim'},

function genLevel(n){
  const def=LV[n-1],L=newL(n),R=rng(n*7919+101),d=clamp((n-1)/(NL-1),0,1);
  L.pal=PALS[L.w];
  L.ct=n===1?3:def.boss?3+(def.mk||0)*2:def.bonus?10:Math.round(5+d*10);
  if(n===1){buildStreet(L);return fin(L)}
  if(def.boss){buildArena(L,def);return fin(L)}
  const E={L,R,d,def,flood:!!def.flood};
  E.ene=b=>{if(def.bonus)return;let ne=R()<.32+d*.55?1:0;if(ne&&b.w>380&&R()<d*.75)ne=2;
    for(let i=0;i<ne;i++){const sl=L.n<=3?R()<.55:R()<.18;pig(L,b,b.x+b.w*(.3+.45*(ne>1?i:R())),{sleepy:sl,sp:sl?0:40+85*d,hop:!sl&&(def.hop||L.n>=19)&&R()<.55})}};
  let b=addB(L,-500,0,900);decorate(L,b,R);rowB(L,180,-58,3,50);
  let x=b.x+b.w,y=0,segs=0,introUsed=!def.intro,lastCP=0;const gAt=.35+R()*.4;
  const target=def.len||lerp(6800,15500,d)*(def.bonus?.75:1);
  while(x<target){
    let k='roof';
    if(!introUsed&&segs>=1){k=def.intro;introUsed=true;b=SEG[k](E,x,y,true)}
    else{if(segs>0&&R()<.65&&def.feat.length)k=def.feat[Math.floor(R()*def.feat.length)];if(!SEG[k])k='roof';if(k==='roof'&&segs>1&&R()<.13+d*.15)k='up';b=SEG[k](E,x,y,false)}
    if(def.bonus){arcB(L,b.x+40,b.y,b.x+b.w-40,b.y,170,6)}
    x=b.x+b.w;y=b.y;segs++;
    if(x-lastCP>3000&&x<target-1500){L.cps.push({x:b.x+b.w*.5,y:b.y,on:false});lastCP=x}
    if(!L.golden&&x>target*gAt&&b.k==='bld'){L.golden={x:b.x+b.w*.5,y:b.y-370-60*d,got:!!0}}
  }
  const fb=addB(L,x+80+R()*60,y,900);L.flag={x:fb.x+430,y:fb.y};rowB(L,fb.x+110,fb.y-58,4,50);
  if(def.flood)L.flood={y:330,sp:13+26*d,delay:3};
  return fin(L);
}

function eTop(e){return e.k==='pig'?e.y+e.oy-e.h:e.k==='bal'?e.y-e.r:e.k==='dro'?e.y-14:e.k==='yarn'?e.y-e.r:e.y}

function eBox(e){if(e.k==='pig')return[e.x-17,e.y+e.oy-e.h+12,e.x+17,e.y+e.oy];if(e.k==='dro')return[e.x-24,e.y-8,e.x+24,e.y+12];if(e.k==='yarn')return[e.x-e.r*.75,e.y-e.r*.6,e.x+e.r*.75,e.y+e.r*.75];return[e.x-10,e.y-10,e.x+10,e.y+10]}

function hurt(dir,why){const H=hero;if(H.inv>0||G.ending||H.dead)return;H.hearts--;H.inv=1.7;H.ground=null;H.vy=-720;H.vx=dir*380;G.combo=0;H.hurtT=.5;shake(16);hitstop(.09);sfx.hurt();burst(H.x,H.y-40,14,['#fff','#ffd23c','#ff6b6b'],420,'star');ft(why||'OUCH!',H.x,H.y-110,'#ff8a8a',30);G.lastHurtT=G.t;if(H.hearts<=0)failRun()}
function pitFall(){const H=hero;if(G.ending)return;H.hearts--;G.combo=0;sfx.hurt();shake(10);if(H.hearts<=0){failRun();return}
  H.x=H.safe.x;H.y=H.safe.y-260;H.vx=0;H.vy=0;H.inv=1.7;H.ground=null;H.moon=false;burst(H.x,H.y-40,16,['#fff','#ffd23c'],300,'star');ft('BOING BACK!',H.x,H.y-90,'#fff',24)}
function failRun(){if(G.ending)return;G.ending='fail';G.endT=0;hero.dead=true;hero.vy=-900;hero.ground=null;sfx.fail();G.slowT=.5;bankBolts(false)}
function bankBolts(){if(G.banked)return;G.banked=true;save.bolts+=G.bank;save.earned+=G.bank;persist()}
function land(s){const H=hero,imp=H.vy;H.ground=s;H.ct=0;H.y=s.y;H.touchRT=now();H.vy=0;
  if(!H.armed&&H.touchRT-H.qRT<=BUF)H.armed=true;

  if(s.k==='chim'&&s.st===0){s.st=1;s.t=0;sfx.crack()}
  if(s.k==='mat'||s.k==='tramp')s.sq=1;
  if(s.k==='btn')s.sq=1;
  if(s.k==='bld'||s.k==='street'||s.k==='box'){H.safe={x:clamp(H.x,s.x+40,s.x+s.w-40),y:s.y}}
  H.refY=s.y;
  if(G.tut)G.tut.land++;

}
function landOn(e){const H=hero;const top=eTop(e);H.ground={k:'enemy',e,y:top,vx:0,on:true};H.ct=0;H.y=top;H.touchRT=now();H.vy=0;if(!H.armed&&H.touchRT-H.qRT<=BUF)H.armed=true;e.stomp=true;H.sq=.65;H.sqV=0;sfx.squeak(e.k==='bal'?1.3:1+Math.min(G.combo,10)*.06);hitstop(.04)}
function landBoss(){const H=hero,B=L.boss;H.ground={k:'boss',y:B.y-B.h,vx:0,on:true};H.ct=0;H.y=B.y-B.h;H.touchRT=now();H.vy=0;if(!H.armed&&H.touchRT-H.qRT<=BUF)H.armed=true;H.sq=.6;H.sqV=0}
function killEnemy(e){e.alive=false;e.stomp=false;G.bonks++;
  if(e.k==='pig'){e.dt=0;e.fvx=(hero.x<e.x?1:-1)*260;e.fvy=-420;e.rot=0;burst(e.x,e.y-20,10,['#9fb0d0','#ffd23c','#6a7898'],380,'gear')}

  else if(e.k==='dro'){e.rs=3.5;burst(e.x,e.y,12,['#9fb0d0','#ff5a5a'],380,'gear')}
  else if(e.k==='yarn'){e.dead=1;burst(e.x,e.y,12,['#ff7ab0','#ffd0ea'],300,'conf')}

function launch(){const H=hero,g=H.ground,t=now();H.ground=null;
  const held=jumpHeld()&&!(G&&G.demo);let sup=held||H.armed;const perf=(H.ap||0)<=1&&H.pRT>H.lastL&&H.pRT>=H.touchRT-perfW()&&H.pRT<=t+.001;if(perf)sup=true;
  if(G.demo){sup=demo.sup;}
  const kind=g.k;let v=baseV();
  if(kind==='mat')v*=1.2;else if(kind==='enemy')v*=g.e.k==='bal'?1.12:1.06;else if(kind==='boss')v*=1.2;
  if(kind==='tramp'){v=1480*(1+.02*upg('spring'))*(perf?1.18:sup?1.09:1);g.sq=1}else if(perf)v*=1.58;else if(sup)v*=1.42;
  H.vy=-v;H.vx+=(g.vx||0)*.5;H.sq=1.38;H.sqV=0;H.lastL=t;H.armed=false;H.qRT=-9;H.ap=0;H.lastSup=sup;
  H.compV=-(sup?9:5);
  const style=perf||kind==='enemy'||kind==='boss';
  if(style){G.combo++;if(G.combo>G.maxCombo)G.maxCombo=G.combo;if(G.combo>=2)ft('x'+G.combo,H.x+30,H.y-110,'#ffe07a',22+Math.min(G.combo,12)*2.4,.7);if(G.combo>=3)cheer();if(G.combo===5||G.combo===10||G.combo===15)sfx.fanfare()}else G.combo=0;

  if(kind==='chim'&&g.st===0){g.st=1;g.t=0}
  if(perf){sfx.boing(1.1,true);sfx.note(Math.max(0,G.combo-1));ringFx(H.x,H.y,'#ffd23c',30);burst(H.x,H.y,10,['#ffe07a','#fff'],300,'star');ft('PERFECT!',H.x,H.y-90,'#ffd23c',28,.7);hitstop(.045);shake(4);H.trail=.55;G.flash=.12}
  else if(sup){sfx.boing(.82,true);shake(2.5);H.trail=.4;dust(H.x,H.y,6)}
  else sfx.boing(1);
  if(kind==='tramp'){sfx.boing(.6,true);shake(6);H.trail=.7}
  if(!G.demo&&!L.boss&&!G.moonUsed&&(g.moon||(perf&&Math.random()<.03+.012*Math.min(G.combo,6))))moonBounce();
  if(G.tut)tutLaunch(perf,sup,kind,g);
}
function moonBounce(){const H=hero;G.moonUsed=true;H.moon=true;H.moonY=H.y;H.vy=-1750;H.vx*=.35;G.slowT=.5;ft('MOON BOUNCE!',H.x,H.y-140,'#e6ecff',34,1.6);sfx.moon();shake(10);
  for(let i=0;i<14;i++)L.bolts.push({x:H.x+Math.sin(i*1.7)*120,y:H.y-450-i*150,got:false,ph:i,star:1});save.moon=(save.moon||0)+1;persist()}
function openDoor(btn){const d=L.doors.find(d=>d.btn===btn);if(!d||d.open)return;d.open=true;btn.pressed=1;sfx.door();shake(10);ft('OPEN!',d.dr.x+24,d.by-140,'#7dff8a',30);burst(btn.x+43,btn.y,12,['#7dff8a','#fff'],300,'star')}
function cheer(){if(G.cheerCD>0)return;G.cheerCD=1.4;let c=0;for(const s of L.sol){if(s.k!=='bld'||s.x>camX+VW||s.x+s.w<camX)continue;const gr=winGrid(s);const rows=Math.floor((camY+VH-gr.oy)/gr.rh);if(rows<1)continue;const r=Math.floor(Math.random()*Math.min(rows,3)),col=Math.floor(Math.random()*gr.cols);G.cheer.push({s,c:col,r,t:0,txt:['WOO!','BOING!','GO JACK!','WOW!','YAY!','AMAZING!'][Math.floor(Math.random()*6)]});if(++c>=2)break}
  if(L.street||L.boss){G.cheer.push({bg:1,x:hero.x+(Math.random()-.5)*300,y:hero.y-200,t:0,txt:'WOO!'})}if(c)sfx.cheer()}
function heroUpd(dt){
  const H=hero;H.inv=Math.max(0,H.inv-dt);H.sheetT=Math.max(0,H.sheetT-dt);H.hurtT=Math.max(0,H.hurtT-dt);H.trail=Math.max(0,H.trail-dt);
  H.sqV+=((1-H.sq)*340-H.sqV*13)*dt;H.sq+=H.sqV*dt;H.sq=clamp(H.sq,.45,1.6);
  const ctT=H.ground?(H.armed||jumpHeld()?1:.6):0;H.compV+=((ctT-H.comp)*420-H.compV*16)*dt;H.comp=clamp(H.comp+H.compV*dt,-.6,1.1);
  H.blT-=dt;if(H.blT<=0){H.blT=2+Math.random()*3}
  if(H.dead){H.vy+=GRAV*dt;H.y+=H.vy*dt;H.x+=H.vx*dt*.3;H.rot+=dt*7;tassel(dt);return}
  const lean=inputLean();H.lean=lean;if(lean)H.face=lean;else if(Math.abs(H.vx)>60)H.face=Math.sign(H.vx);
  if(H.ground){
    const g=H.ground;H.ct+=dt;
    if(g.k==='enemy'){g.y=eTop(g.e)}else if(g.k==='boss'){g.y=L.boss.y-L.boss.h}
    if(!g.on){H.ground=null}
    else{H.y=g.y;H.x+=(g.vx||0)*dt;if(!(lean&&Math.sign(H.vx)===lean&&Math.abs(H.vx)>=maxVX()))H.vx+=lean*leanA()*.5*dt;H.x+=H.vx*dt*.5;resolveX(dt);
      if(H.ct>=(g.k==='enemy'||g.k==='boss'?.055:CONTACT))launch()}
  }else{
    const mv0=maxVX();let ax=lean*leanA();if(lean&&Math.sign(H.vx)===-lean)ax*=1.8;if(lean&&Math.sign(H.vx)===lean&&Math.abs(H.vx)>=mv0)ax=0;H.vx+=ax*dt;if(lean&&Math.sign(H.vx)===lean&&Math.abs(H.vx)>mv0&&ax)H.vx=lean*mv0;if(!lean)H.vx*=Math.exp(-1.1*dt);
    let inWind=false;for(const w of L.winds){if(H.x>w.x1&&H.x<w.x2&&gustOn(w)){H.vx+=w.dir*w.str*dt;inWind=true}}
    const mv=maxVX()*(inWind?1.5:1);if(Math.abs(H.vx)>mv)H.vx=Math.sign(H.vx)*Math.max(mv,Math.abs(H.vx)-1400*dt);
    const g=H.moon?GRAV*.25:GRAV;H.vy=Math.min(H.vy+g*dt,1700);
    if(H.moon&&H.vy>0&&H.y>H.moonY-300)H.moon=false;
    const n=Math.ceil(Math.max(Math.abs(H.vx),Math.abs(H.vy))*dt/9)||1,h=dt/n;
    for(let i=0;i<n;i++){H.x+=H.vx*h;resolveX();const py=H.y;H.y+=H.vy*h;if(resolveY(py))break}
  }
  tassel(dt);
  // enemy contact
  if(!H.dead&&H.inv<=0){for(const e of L.en){if(!e.alive||e.stomp||e.dead)continue;
    if(e.k==='bal'){const qx=clamp(e.x,H.x-11,H.x+11),qy=clamp(e.y,H.y-60,H.y-8);if((qx-e.x)**2+(qy-e.y)**2<(e.r*.8)**2){hurt(H.x<e.x?-1:1,'POP!');sfx.pop();break}}
    else{const b=eBox(e);if(H.x+11>b[0]&&H.x-11<b[2]&&H.y-8>b[1]&&H.y-60<b[3]){hurt(H.x<e.x?-1:1);break}}}}
  // laundry
  for(const ln of L.lines){if(ln.snap)continue;if(H.x>ln.x1&&H.x<ln.x2){const t=(H.x-ln.x1)/(ln.x2-ln.x1);const ly=lerp(ln.y1,ln.y2,t)+34*Math.sin(PI*t);if(Math.abs(H.y-34-ly)<38){ln.snap=1;ln.sx=H.x;ln.t=0;H.sheetT=1.5;H.sheetC=ln.col;sfx.twang();sfx.flap&&0;ft('SNAP!',H.x,H.y-120,'#fff',22);for(let i=0;i<6;i++)part({x:H.x,y:ly,vx:(Math.random()-.5)*300,vy:-Math.random()*200,g:500,life:1.2,sz:8,col:['#fff','#7ad0ff','#ffd23c','#ff8ab0'][i%4],k:'conf',rot:0,vr:8,drag:1})}}}
  // pit

  const comboB=G.maxCombo*upg('bank')*2;G.bank+=bonus+comboB;bankBolts();
  save.stars[n]=nw;const isBest=!G.fromCP&&(!save.best[n]||G.t<save.best[n]);if(isBest){save.best[n]=+G.t.toFixed(2);lsSet('ghost'+n,G.rec)}
  save.unlocked=Math.max(save.unlocked,Math.min(NL,n+1));save.last=Math.min(NL,n+1);save.combo=Math.max(save.combo||0,G.maxCombo);
  const ns=checkSkins();persist();
  $('rT').textContent=n+'. '+LV[n-1].nm;$('s1t').textContent='Bolts '+G.bgot+'/'+L.boltTotal;$('s2t').textContent='Combo '+G.maxCombo+'/'+L.ct;
  for(let i=0;i<3;i++)$('s'+i).classList.remove('on');
  s.forEach((v,i)=>{if(v)setTimeout(()=>{if(mode!=='results')return;$('s'+i).classList.add('on');sfx.star(i)},350+i*330)});
  if(!s[1]&&L.boltTotal-G.bgot<=3)$('s1t').textContent+=' so close!';
  $('rTime').textContent=G.t.toFixed(1)+'s'+(isBest&&save.plays>1?' ★':'');$('rCombo').textContent=G.maxCombo;
  const tot=G.bank;let c=0;const ci=setInterval(()=>{c=Math.min(tot,c+Math.max(1,Math.ceil(tot/25)));$('rBolts').textContent='+'+c;if(c%3===0)sfx.ping(c%10);if(c>=tot)clearInterval(ci)},40);
  $('rNew').textContent=(G.golden?'✦ Golden spring found! ':'')+(ns.length?'New skin: '+ns.join(', ')+'!':'');
  if(n<NL){$('rTease').style.display='flex';$('teaseT').textContent=LV[n].idea;drawIcon($('teaseC'),LV[n].ic);$('rNext').textContent='Next ▶'}else{$('rTease').style.display='none';$('rNext').textContent='Levels'}
  showScr('results')}
function showFail(){mode='fail';const pr=clamp((Math.max(hero.safe.x,L.start.x)-L.start.x)/(L.endX-L.start.x),0,1);$('fBar').style.width=Math.round(pr*100)+'%';$('fSub').textContent=pr>.75?'SO close! '+Math.round(pr*100)+'% there':Math.round(pr*100)+'% of the way';
  $('fCP').style.display=G.cp?'inline-block':'none';showScr('fail')}
function retryCP(){if(!G||!G.cp)return;sfx.click();const got=L.bolts.filter(b=>!b.star).map(b=>b.got?1:0);startLevel(G.n,{cp:G.cp,t:G.t,got,mc:G.maxCombo,gold:G.golden})}
function checkSkins(){const out=[];const ts=totalStars(),gc=goldCount();for(const s of SKINS){if(save.skins.includes(s.id)||!s.need||s.need.buy)continue;const n=s.need;if((n.stars&&ts>=n.stars)||(n.gold&&gc>=n.gold)||(n.lvl&&save.unlocked>=n.lvl)||(n.moon&&save.moon>=1)){save.skins.push(s.id);out.push(s.nm)}}return out}
function openLevels(){mode='menu';sfx.click();if(!L||!G||!G.demo)startDemo();const g=$('lvGrid');g.innerHTML='';$('lvSub').textContent='★ '+totalStars()+' / '+NL*3+'   ✦ '+goldCount()+' golden';
  for(let w=0;w<6;w++){const h=document.createElement('div');h.className='wh';h.textContent=WORLDS[w];g.appendChild(h);const gr=document.createElement('div');gr.className='grid';g.appendChild(gr);
    for(let i=w*6+1;i<=w*6+6;i++){const d=LV[i-1],b=document.createElement('button');const lock=i>save.unlocked;b.className='tile'+(d.boss?' boss':'')+(d.bonus?' bonus':'')+(lock?' lock':'');const st=save.stars[i]||[0,0,0];
      b.innerHTML='<b>'+(lock?'•':i)+'</b><i>'+(lock?'&nbsp;':st.map(v=>v?'★':'☆').join(''))+'</i><small style="font-size:9px">'+(d.boss?'BOSS':d.bonus?'BONUS':save.golden[i]?'✦':'&nbsp;')+'</small>';
      if(!lock)b.onclick=()=>{sfx.click();startLevel(i,{tut:i===1&&!save.tut})};gr.appendChild(b)}}
  showScr('levels')}
function openShop(){mode='menu';sfx.click();$('shopB').textContent=save.bolts;const l=$('shopList');l.innerHTML='';
  for(const u of UPS){const lv=save.up[u.id],pr=upPrice(u);const r=document.createElement('div');r.className='urow';const c=document.createElement('canvas');c.width=48;c.height=48;c.style.width='48px';c.style.height='48px';upIcon(c,u.id);r.appendChild(c);
    const inf=document.createElement('div');inf.className='uinfo';inf.innerHTML='<b>'+u.nm+'</b><small>'+u.ds+'</small><div class="pips">'+Array.from({length:u.max},(_,i)=>'<span class="'+(i<lv?'f':'')+'"></span>').join('')+'</div>';r.appendChild(inf);
    const b=document.createElement('button');b.className='btn sm';b.innerHTML=pr==null?'MAX':'<span class="nut"></span> '+pr;b.disabled=pr==null||save.bolts<pr;b.onclick=()=>{if(pr!=null&&save.bolts>=pr){save.bolts-=pr;save.up[u.id]++;persist();sfx.coin();openShop()}};r.appendChild(b);l.appendChild(r)}
  showScr('shop')}
function openSkins(){mode='menu';sfx.click();$('skinB').textContent=save.bolts;checkSkins();persist();const g=$('skinGrid');g.innerHTML='';
  for(const s of SKINS){const own=save.skins.includes(s.id);const d=document.createElement('div');d.className='skin'+(save.skin===s.id?' sel':'')+(own?'':' lock');const c=document.createElement('canvas');c.width=180;c.height=200;c.style.width='90px';c.style.height='100px';
    const ox=X;X=c.getContext('2d');X.scale(2,2);drawHero(45,94,{skin:s.id,face:1,sq:1,grin:own});X=ox;d.appendChild(c);const nm=document.createElement('div');nm.textContent=s.nm;d.appendChild(nm);
    const sm=document.createElement('small');sm.textContent=own?(save.skin===s.id?'Equipped':'Tap to wear'):(s.need.buy?'Buy: '+s.need.buy:s.nd);d.appendChild(sm);
    d.onclick=()=>{if(own){save.skin=s.id;persist();sfx.click();openSkins()}else if(s.need.buy&&save.bolts>=s.need.buy){save.bolts-=s.need.buy;save.skins.push(s.id);save.skin=s.id;persist();sfx.coin();openSkins()}else sfx.bump()};g.appendChild(d)}
  showScr('skins')}
function upIcon(c,id){const g=c.getContext('2d');g.fillStyle='#2a1433';g.beginPath();g.arc(24,24,22,0,TAU);g.fill();g.fillStyle='#ffbf3c';g.strokeStyle='#ffbf3c';g.lineWidth=3;g.lineCap='round';
  if(id==='spring'){g.beginPath();for(let i=0;i<=6;i++)g.lineTo(i%2?32:16,36-i*4);g.stroke()}
  else if(id==='fins'){g.beginPath();g.moveTo(10,30);g.lineTo(38,24);g.lineTo(22,14);g.fill();g.fillRect(8,34,26,3)}
  else if(id==='timing'){g.beginPath();g.arc(24,24,12,0,TAU);g.stroke();g.beginPath();g.moveTo(24,24);g.lineTo(24,15);g.moveTo(24,24);g.lineTo(31,27);g.stroke()}
  else if(id==='magnet'){g.lineWidth=6;g.beginPath();g.arc(24,22,10,PI,0);g.stroke();g.fillStyle='#ff5a5a';g.fillRect(11,22,7,10);g.fillRect(30,22,7,10)}
  else if(id==='bank'){g.font='900 20px Trebuchet MS,Verdana,sans-serif';g.textAlign='center';g.fillText('x5',24,31)}
  else{g.fillStyle='#ff4d6d';g.beginPath();g.moveTo(24,36);g.bezierCurveTo(6,24,12,8,24,17);g.bezierCurveTo(36,8,42,24,24,36);g.fill()}}
function drawIcon(c,ic){const g=c.getContext('2d');g.setTransform(1,0,0,1,0,0);const gr=g.createLinearGradient(0,0,0,c.height);gr.addColorStop(0,'#3a2a6b');gr.addColorStop(1,'#ff9a5a');g.fillStyle=gr;g.fillRect(0,0,c.width,c.height);
  const oX=X,oG=G;X=g;G=G||{t:0};const fakeT=G.t;X.save();X.translate(c.width/2,c.height-14);
  X.fillStyle='#5e3a6a';X.fillRect(-80,0,160,20);X.fillStyle='#ffb07a';X.fillRect(-80,0,160,4);
  try{const sc=.55;X.scale(sc,sc);
  if(ic==='chim'){drawChim({x:-80,y:-60,w:56,h:200,st:0,t:0});drawChim({x:30,y:-90,w:56,h:200,st:1,t:0})}
  else if(ic==='pig'){drawPig({x:-40,y:0,oy:-30,dir:1,t:fakeT,alive:true,sleepy:false,sp:60,h:40,w:46});drawPig({x:50,y:0,oy:0,dir:-1,t:fakeT,alive:true,sleepy:false,sp:60,h:40,w:46})}
  else if(ic==='wind'){X.strokeStyle='#fff';X.lineWidth=5;X.lineCap='round';for(let i=0;i<4;i++){X.beginPath();X.moveTo(-100+i*20,-40-i*30);X.quadraticCurveTo(0,-60-i*30,80,-40-i*30);X.stroke()}}
  else if(ic==='tramp'){drawTramp({x:-46,y:-26,w:92,h:26,sq:0})}
  else if(ic==='bal'){drawBal({x:-40,y:-80,r:30,alive:true,pin:0});drawBal({x:60,y:-110,r:30,alive:true,pin:0})}
  else if(ic==='crane'){const s={x:-60,y:-60,w:120,h:22};X.strokeStyle='#1a1020';X.lineWidth=3;X.beginPath();X.moveTo(0,-200);X.lineTo(-48,-60);X.moveTo(0,-200);X.lineTo(48,-60);X.stroke();X.fillStyle='#b07a4a';X.fillRect(s.x,s.y,s.w,s.h)}
  else if(ic==='door'){const d={dr:{x:20,y:-1500,w:48,h:1500,on:true},by:0,open:false};drawDoor(d);drawBtn({x:-110,y:-14,w:86,h:14,sq:0})}
  else if(ic==='flood'){X.fillStyle='rgba(60,160,210,.9)';X.fillRect(-150,-40,300,80);X.strokeStyle='#dff';X.lineWidth=5;X.beginPath();for(let x=-150;x<=150;x+=10)X.lineTo(x,-40+Math.sin(x*.05)*6);X.stroke()}
  else if(ic==='drone'){drawDro({x:-40,y:-80,bx:0,alive:true,pin:0});drawDro({x:60,y:-120,bx:3,alive:true,pin:0})}
  else if(ic==='elev'){X.fillStyle='#4dc0b5';X.fillRect(-55,-100,110,22);X.strokeStyle='#fff';X.lineWidth=4;X.beginPath();X.moveTo(0,-130);X.lineTo(0,-170);X.moveTo(-10,-160);X.lineTo(0,-172);X.lineTo(10,-160);X.stroke()}
  else if(ic==='bolt'){for(let i=0;i<5;i++)drawBolt({x:-100+i*50,y:-60-Math.sin(i)*30,ph:i})}
  else if(ic==='roof'){X.fillStyle='#7f4651';X.fillRect(-150,-60,110,90);X.fillRect(10,-110,140,140);X.fillStyle='#ffb07a';X.fillRect(-150,-60,110,6);X.fillRect(10,-110,140,6);X.fillStyle='#ffcf6e';for(let i=0;i<3;i++)for(let j=0;j<2;j++){X.fillRect(-140+i*34,-40+j*34,20,22);X.fillRect(24+i*42,-90+j*40,24,24)}}
  else if(ic==='moon'){X.fillStyle='#f4f1dc';X.beginPath();X.arc(0,-90,50,0,TAU);X.fill()}
  else if(ic==='rooster'||ic==='tomcat'||ic==='king'){X.scale(.7,.7);drawBoss({type:ic,x:0,y:0,w:120,h:130,dir:-1,st:'strut',anim:fakeT,fl:0,spiky:false,dead:false,t:0})}
  else{drawMat({x:-65,y:-34,w:130,h:34,sq:0})}}catch(e){}
  X.restore();X=oX;G=oG}

// buttons
$('bPlay').onclick=playMain;$('bHow').onclick=()=>{sfx.click();startLevel(1,{tut:true})};$('bLv').onclick=openLevels;$('bShop').onclick=openShop;$('bSkin').onclick=openSkins;
document.querySelectorAll('.back').forEach(b=>b.onclick=()=>{sfx.click();toTitle()});
$('hPause').onclick=()=>{audio();mode==='play'?pauseGame():resume()};$('hMute').onclick=()=>{audio();setMute(!muted)};
$('pRes').onclick=resume;$('pRe').onclick=()=>{resume();restart()};$('pMenu').onclick=()=>{sfx.click();toTitle()};
$('rNext').onclick=nextLevel;$('rRe').onclick=restart;$('rMenu').onclick=()=>{sfx.click();toTitle()};
$('fRe').onclick=restart;$('fCP').onclick=retryCP;$('fMenu').onclick=()=>{sfx.click();toTitle()};
$('skip').onclick=skipTut;
['hPause','hMute','skip'].forEach(id=>$(id).addEventListener('pointerdown',e=>e.stopPropagation()));
resize();setMute(muted);startDemo();refreshTitle();requestAnimationFrame(frame);
window.__hop={prof(){const o={};const T=(n,f)=>{const t=performance.now();for(let i=0;i<5;i++)f();o[n]=((performance.now()-t)/5).toFixed(1)};X=cx;X.setTransform(DPR,0,0,DPR,0,0);T('sky',drawSky);T('world',drawWorld);T('hud',drawHUD);T('upd',()=>update(1/60));return o},scr(){return{x:(hero.x-camX)*S,y:(hero.y-camY)*S}},press(){press()},step(n,k){if(k)keys=k;for(let i=0;i<n;i++)update(1/60)},get G(){return G},get L(){return L},get hero(){return hero},get mode(){return mode},save:()=>save,startLevel};
</script>

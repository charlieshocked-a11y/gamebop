<style>

.btn{pointer-events:auto;position:relative;border:0;cursor:pointer;font:900 19px/1 "Trebuchet MS","Avenir Next",system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;color:#3a0f12;padding:13px 22px;border-radius:12px 5px 12px 5px;background:linear-gradient(#fff0b0,#ffc23a 55%,#ff9a1f);box-shadow:0 6px 0 #9b4612,0 10px 18px rgba(0,0,0,.45),inset 0 2px 0 rgba(255,255,255,.8);transform:skewX(-7deg);transition:transform .07s,box-shadow .07s,filter .1s;animation:pop .5s cubic-bezier(.2,1.5,.4,1) backwards;white-space:nowrap}

<script>
'use strict';
// ================= utils / save =================
const KP='gamebop.pinquake.';
function lsGet(k,d){try{const v=localStorage.getItem(KP+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(KP+k,JSON.stringify(v))}catch(e){}}
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t, rnd=(a,b)=>a+Math.random()*(b-a), TAU=Math.PI*2;
const eob=t=>{t=clamp(t,0,1);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2)};
const eoc=t=>1-Math.pow(1-clamp(t,0,1),3);
function srand(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const DEF={coins:0,unlocked:1,stars:{},best:{},upg:{w:0,s:0,z:0},skins:[0],skin:0,tut:false,cur:null,endBest:0,seen:{}};
let save=Object.assign({},DEF,lsGet('save',{}));
save.upg=Object.assign({w:0,s:0,z:0},save.upg||{});
function persist(){lsSet('save',save)}
let muted=!!lsGet('mute',false);

// ================= audio =================
let AC=null,MG=null,NB=null,rollN=null,chargeN=null,clonkT=[],musNext=0,musStep=0;
function initAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){AC=null;return}
  MG=AC.createGain();MG.gain.value=muted?0:.75;
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=5;
  MG.connect(comp);comp.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  musNext=AC.currentTime+.1;
}
function setMute(m){muted=m;lsSet('mute',m);if(MG)MG.gain.setTargetAtTime(m?0:.75,AC.currentTime,.03);drawMuteIcon()}
function tone(type,f,dur,vol,o){if(!AC||muted)return;o=o||{};const t=AC.currentTime+(o.delay||0);const os=AC.createOscillator();os.type=type;os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+(o.a||.004));g.gain.exponentialRampToValueAtTime(.0001,t+(o.a||.004)+dur);os.connect(g);if(o.lp){const f2=AC.createBiquadFilter();f2.type='lowpass';f2.frequency.value=o.lp;g.connect(f2);f2.connect(MG)}else g.connect(MG);os.start(t);os.stop(t+dur+.06)}
function noise(dur,vol,o){if(!AC||muted)return;o=o||{};const t=AC.currentTime+(o.delay||0);const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.f||1000,t);if(o.fTo)f.frequency.exponentialRampToValueAtTime(o.fTo,t+dur);f.Q.value=o.q||1;const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+(o.a||.003));g.gain.exponentialRampToValueAtTime(.0001,t+(o.a||.003)+dur);s.connect(f);f.connect(g);g.connect(MG);s.start(t,Math.random()*1.5);s.stop(t+dur+.1)}
const SFX={
  clonk(v,big){if(!AC)return;const n=AC.currentTime;clonkT=clonkT.filter(t=>n-t<.07);if(clonkT.length>5)return;clonkT.push(n);v=clamp(v,.06,1);const b=(big?250:470)*rnd(.82,1.3);tone('sine',b,.07+v*.09,.42*v);tone('triangle',b*2.63,.04+v*.05,.2*v);tone('sine',b*5.1,.025,.09*v);tone('sine',b*.5,.06,.18*v);noise(.022,.45*v,{type:'highpass',f:2200})},
  thud(v){tone('sine',90,.18,.5*v,{to:45});noise(.08,.3*v,{type:'lowpass',f:500})},
  whoosh(){noise(.35,.25,{f:400,fTo:1800,q:.8,a:.05})},
  perfect(){[880,1108,1318,1760].forEach((f,i)=>tone('triangle',f,.18,.12,{delay:i*.05}))},
  strike(n){const r=[0,4,7,12];const b=330*Math.pow(2,Math.min(n-1,4)/12);r.forEach((s,i)=>{tone('sawtooth',b*Math.pow(2,s/12),.5,.07,{delay:i*.06,lp:2400});tone('triangle',b*Math.pow(2,s/12)*2,.4,.06,{delay:i*.06})})},
  spare(){[0,5,9].forEach((s,i)=>tone('triangle',440*Math.pow(2,s/12),.3,.1,{delay:i*.07}))},
  roar(v){noise(1.6+v,.32*v,{f:650,q:.5,a:.18});noise(1.3+v*.6,.18*v,{f:1500,q:.9,a:.25});for(let i=0;i<5;i++)tone('triangle',rnd(380,560),.45,.025*v,{to:rnd(700,1000),delay:rnd(.05,.5),a:.08})},
  aww(){noise(1.2,.16,{f:500,fTo:300,q:.7,a:.2});tone('triangle',392,.5,.05,{to:280,delay:.1,a:.1})},
  gutter(){tone('sawtooth',220,.28,.09,{to:200,lp:900});tone('sawtooth',208,.28,.09,{to:190,delay:.3,lp:900});tone('sawtooth',196,.7,.1,{to:150,delay:.6,lp:900})},
  boom(){noise(.9,.9,{type:'lowpass',f:1200,fTo:80,a:.005});tone('sine',120,.6,.7,{to:30});noise(.15,.5,{type:'highpass',f:3000})},
  coin(){const f=rnd(1500,1800);tone('square',f,.05,.04);tone('square',f*1.5,.12,.04,{delay:.05})},
  boing(){tone('sine',300,.25,.25,{to:700});tone('sine',180,.2,.15,{to:360,delay:.02})},
  jump(){noise(.3,.2,{f:600,fTo:2500,a:.02});tone('triangle',300,.25,.08,{to:800})},
  portal(){tone('sine',200,.4,.15,{to:1600});tone('triangle',1600,.4,.06,{to:200})},
  plop(){tone('sine',600,.25,.25,{to:90});noise(.3,.2,{f:900,fTo:200})},
  squeak(){for(let i=0;i<3;i++)tone('square',rnd(900,1300),.06,.04,{delay:i*.07,to:rnd(1300,1700)})},
  bonk(){tone('sine',520,.15,.4,{to:180});tone('square',1200,.05,.08);noise(.06,.3,{f:2000})},
  pop(){noise(.08,.35,{type:'highpass',f:1500});tone('sine',rnd(500,800),.1,.1,{to:200})},
  crackle(){for(let i=0;i<6;i++)noise(.03,.12,{type:'highpass',f:4000,delay:rnd(.05,.5)})},
  click(){tone('triangle',700,.05,.1);tone('sine',1400,.03,.05)},
  star(i){tone('triangle',660*Math.pow(2,i*4/12),.3,.14);tone('sine',1320*Math.pow(2,i*4/12),.2,.06,{delay:.03})},
  tick(){tone('square',1800+rnd(-100,100),.015,.025)},
  buy(){[0,4,7,12,16].forEach((s,i)=>tone('triangle',523*Math.pow(2,s/12),.15,.1,{delay:i*.04}))},
  ooh(){noise(1.1,.18,{f:380,fTo:950,q:1.2,a:.25});tone('triangle',300,.9,.04,{to:520,a:.2})},
  nope(){tone('square',200,.12,.06);tone('square',150,.15,.06,{delay:.12})},
};
function rollStart(){if(!AC||muted)return;rollStop();const s=AC.createBufferSource();s.buffer=NB;s.loop=true;const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=250;const g=AC.createGain();g.gain.value=0;s.connect(f);f.connect(g);g.connect(MG);const o=AC.createOscillator();o.type='sine';o.frequency.value=50;const og=AC.createGain();og.gain.value=0;o.connect(og);og.connect(MG);s.start();o.start();rollN={s,f,g,o,og}}
function rollSet(sp){if(!rollN)return;const t=AC.currentTime,k=clamp(sp/8,0,1);rollN.g.gain.setTargetAtTime(k*.45,t,.05);rollN.f.frequency.setTargetAtTime(180+sp*80,t,.05);rollN.og.gain.setTargetAtTime(k*.22,t,.05);rollN.o.frequency.setTargetAtTime(38+sp*5,t,.05)}
function rollStop(){if(!rollN)return;const r=rollN;rollN=null;const t=AC.currentTime;r.g.gain.setTargetAtTime(0,t,.05);r.og.gain.setTargetAtTime(0,t,.05);setTimeout(()=>{try{r.s.stop();r.o.stop()}catch(e){}},300)}
function chargeSet(p){if(!AC||muted)return;if(p<0){if(chargeN){const c=chargeN;chargeN=null;c.g.gain.setTargetAtTime(0,AC.currentTime,.02);setTimeout(()=>{try{c.o.stop()}catch(e){}},200)}return}if(!chargeN){const o=AC.createOscillator();o.type='triangle';const g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(MG);o.start();chargeN={o,g}}chargeN.o.frequency.setTargetAtTime(170+p*560,AC.currentTime,.02);chargeN.g.gain.setTargetAtTime(.035+p*.05,AC.currentTime,.03)}
const MUS=[[0,0,7,0,10,0,7,5],[0,7,12,7,3,7,10,7],[0,0,5,0,7,7,5,3],[0,4,7,4,9,7,4,2]];
function musicTick(){
  if(!AC||muted||!(G.mode==='play'||G.mode==='title'||G.mode==='results'))return;
  if(musNext<AC.currentTime)musNext=AC.currentTime+.05;
  const w=G.wi||0,spb=60/(108+w*6)/2,root=[98,110,87,131][w]||98;
  while(musNext<AC.currentTime+.2){
    const st=musStep%16,d=musNext-AC.currentTime,pat=MUS[w]||MUS[0];
    if(st%2===0)tone('triangle',root*Math.pow(2,pat[(st/2)%8]/12),.16,.07,{delay:d,lp:900});
    if(st%4===2)noise(.03,.05,{type:'highpass',f:7000,delay:d});

function groundAt(x,z){
  const lv=G.lv;
  if(z>DECK_END)return -.5;
  if(Math.abs(x)>LH+.01)return -.07;
  if(lv.ramp&&z>=lv.ramp&&z<=lv.ramp+RAMP_L&&Math.abs(x)<RW)return (z-lv.ramp)/RAMP_L*RAMP_H;

}
function inGum(x,z){const g=G.lv.gum;if(!g)return false;for(const q of g){const dx=(x-q.x)/q.rx,dz=(z-q.z)/q.rz;if(dx*dx+dz*dz<1)return true}return false}

function roverX(t){const r=G.lv.rover;return r?Math.sin(t*r.spd)*r.amp:0}
function hookProf(z){return Math.pow(clamp((z-.8)/5.2,0,1),1.25)}

function ballStep(b,dt,t,ghost){

  if(onRamp&&b.y<=fl+.03&&b.vy<=RAMP_H/RAMP_L*b.vz+.01){b.y=fl;b.vy=RAMP_H/RAMP_L*b.vz;b.air=false}

    b.air=true;b.vy-=g*dt;b.y+=b.vy*dt;

  }else{b.y=fl;b.vy=0;b.air=false}

    else if(Math.abs(b.x)>LH+.015&&b.y<.06&&b.z<DECK_Z+.3){b.gutter=Math.sign(b.x);b.spin=0;b.vx=0;if(!ghost){SFX.gutter();G.shake=Math.max(G.shake,3)}}

  }

  if(lv.portal&&!b.gutter&&b.pc<=0){const q=lv.portal;if(Math.hypot(b.x-q.ax,b.z-q.az)<q.r){if(!ghost){SFX.portal();burstAt(P(q.ax,.05,q.az),20,['#ff9a1f','#ffe066','#fff'],4)}b.x=q.bx;b.z=q.bz;b.pc=.5;if(!ghost)burstAt(P(q.bx,.05,q.bz),24,['#33e6d6','#a0f','#fff'],5)}}
  b.pc-=dt;
  if(lv.rover&&!b.gutter&&b.y<.2){const rz=lv.rover.z,rx=roverX(t);const dx=b.x-rx,dz=b.z-rz;if(Math.abs(dz)<.1+b.R&&Math.abs(dx)<.17+b.R){if(Math.abs(dx)>.17){b.x=rx+Math.sign(dx)*(.17+b.R);b.vx=Math.sign(dx)*Math.max(Math.abs(b.vx),1.2)}else{b.x=rx+Math.sign(dx||1)*(.17+b.R);b.vx=Math.sign(dx||1)*1.8;b.vz*=.75}if(!ghost){SFX.clonk(.8,true);SFX.boing();G.shake=Math.max(G.shake,7);G.roverHit=1}}}

// ================= UI =================
const $=id=>document.getElementById(id);
function btnSfx(){initAudio();SFX.click()}
function showScr(id){for(const s of['title','results','pause','lanes','shop'])$(s).classList.toggle('on',s===id);$('muteT').style.display=(id==='title'||id==='pause')?'flex':'none'}
function showUI(){
  if(G.mode==='title'){showScr('title');$('pauseB').style.display='none';$('muteT').style.display='flex';$('skip').style.display='none';
    const c=save.cur&&save.cur.idx!=null;$('bPlay').textContent=c||save.unlocked>1?'Continue':'Play';}
  else if(G.mode==='play'){showScr(G.paused?'pause':null);$('pauseB').style.display='flex';$('muteT').style.display=G.paused?'flex':'none';$('skip').style.display=tut?'block':'none'}
}
function goTitle(){rollStop();chargeSet(-1);G.endN=0;tut=null;startLevel(0,{demo:true});G.mode='title';showUI()}
function playMain(){
  btnSfx();
  if(save.cur&&save.cur.idx!=null&&save.cur.idx<LEVELS.length){startLevel(save.cur.idx,{resume:true});return}
  startLevel(Math.min(save.unlocked-1,LEVELS.length-1))
}
$('bPlay').onclick=playMain;
$('bHow').onclick=()=>{btnSfx();startLevel(0,{practice:true,tutorial:true})};
$('bLanes').onclick=()=>{btnSfx();buildLanes();showScr('lanes')};
$('bShop').onclick=()=>{btnSfx();buildShop();showScr('shop')};
$('lBack').onclick=()=>{btnSfx();showScr('title')};
$('sBack').onclick=()=>{btnSfx();showScr('title')};
$('skip').onclick=()=>{btnSfx();const rep=tut&&tut.replay;tut=null;save.tut=true;persist();$('skip').style.display='none';if(rep)goTitle()};
$('pauseB').onclick=()=>{btnSfx();setPause(true)};
$('pResume').onclick=()=>{btnSfx();setPause(false)};
$('pRestart').onclick=()=>{btnSfx();restartLevel()};
$('pMenu').onclick=()=>{btnSfx();goTitle()};
$('rNext').onclick=()=>{btnSfx();resultsNext()};
$('rRetry').onclick=()=>{btnSfx();restartLevel()};
$('rMenu').onclick=()=>{btnSfx();goTitle()};
$('muteT').onclick=()=>{initAudio();setMute(!muted)};
function drawMuteIcon(){$('muteT').innerHTML=muted?'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M16 9l5 6M21 9l-5 6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>':'<svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path d="M15.5 8.5a5 5 0 010 7M18 6a8.5 8.5 0 010 12" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round"/></svg>'}

  const nb=$('rNext');
  if(G.practice){nb.textContent='Done ▸';$('rPeek').style.display='none'}
  else if(r.stars===0){nb.textContent='Retry ▸';$('rPeek').style.display='none'}
  else{const ni=lv.idx>=0?lv.idx+1:-1;const nl=ni>=0&&ni<LEVELS.length?LEVELS[ni]:makeEndless(G.endN);nb.textContent='Next ▸';$('rPeek').style.display='flex';
    const newW=ni>=0&&ni<LEVELS.length&&LEVELS[ni].w!==lv.w;$('rPeekTag').textContent=newW?'NEW WORLD: '+WORLDS[nl.w].name.toUpperCase():nl.t==='boss'?'BOSS LANE!':'NEXT: '+nl.cap.toUpperCase();$('rPeekName').textContent=(ni>=0&&ni<LEVELS.length?(ni+1)+'. ':'')+nl.name;
    const pc=$('peekC'),pg=pc.getContext('2d');pg.clearRect(0,0,128,128);const wd=WORLDS[nl.w];const gr=pg.createLinearGradient(0,0,0,128);gr.addColorStop(0,wd.floor);gr.addColorStop(1,wd.lane[1]);pg.fillStyle=gr;pg.beginPath();pg.arc(64,64,62,0,TAU);pg.fill();pg.strokeStyle=wd.n1;pg.lineWidth=4;pg.stroke();drawTwistIcon(pg,nl.t,64,64,96,0)}
  $('rRetry').style.display=r.stars===0?'none':'';
}
function buildLanes(){
  const el=$('lList');el.innerHTML='';let total=0;for(const k in save.stars)total+=save.stars[k];$('lStars').textContent='★ '+total+'/'+LEVELS.length*3;
  WORLDS.forEach((w,wi)=>{const d=document.createElement('div');d.className='world';d.innerHTML='<h3>'+w.name+'</h3>';const g=document.createElement('div');g.className='grid';
    LEVELS.filter(l=>l.w===wi).forEach(l=>{const b=document.createElement('button');const lock=l.idx>=save.unlocked;b.className='node'+(lock?' lock':'')+(l.t==='boss'?' boss':'');const st=save.stars[l.idx]||0;b.innerHTML='<canvas width="68" height="68"></canvas>'+(l.idx+1)+'<div class="st">'+'★'.repeat(st)+'<span style="opacity:.3">'+'★'.repeat(3-st)+'</span></div>';const c=b.querySelector('canvas').getContext('2d');drawTwistIcon(c,lock?'lock':l.t,34,34,60,0);
      b.onclick=()=>{if(lock){SFX.nope();return}btnSfx();startLevel(l.idx)};g.appendChild(b)});d.appendChild(g);el.appendChild(d)});
  const d=document.createElement('div');d.className='world';const ok=save.unlocked>10;d.innerHTML='<h3>Quake Mode · endless</h3>';const b=document.createElement('button');b.className='btn'+(ok?'':' ');b.disabled=!ok;b.textContent=ok?'Play endless · best round '+(save.endBest||0):'Beat lane 10 to unlock';b.onclick=()=>{if(!ok)return;btnSfx();G.endN=0;startLevel(-1)};d.appendChild(b);el.appendChild(d);
}
function buildShop(){
  $('sCoins').textContent=save.coins;const u=$('sUpg');u.innerHTML='';
  UPG.forEach(up=>{const lvl=save.upg[up.k],cost=upCost(lvl);const row=document.createElement('div');row.className='upg';
    row.innerHTML='<canvas width="92" height="92"></canvas><div class="mid"><div class="nm">'+up.n+' <span style="font-size:12px;color:#ffc6e4">'+up.d+'</span></div><div class="pips">'+Array.from({length:UPMAX},(_,i)=>'<i class="'+(i<lvl?'on':'')+'"></i>').join('')+'</div></div>';
    const c=row.querySelector('canvas').getContext('2d');drawBallSkin(c,46,46,up.k==='z'?28+lvl:30,save.skin,0,0,0);c.fillStyle='#fff';c.font='900 22px Impact,sans-serif';c.textAlign='center';c.fillText(up.k==='w'?'KG':up.k==='s'?'↻':'⇔',46,88);
    const b=document.createElement('button');b.className='btn sm';if(lvl>=UPMAX){b.textContent='MAX';b.disabled=true}else{b.innerHTML='<i class="coin"></i>'+cost;b.disabled=save.coins<cost}
    b.onclick=()=>{if(lvl>=UPMAX||save.coins<cost){SFX.nope();return}save.coins-=cost;save.upg[up.k]++;persist();initAudio();SFX.buy();buildShop()};row.appendChild(b);u.appendChild(row)});
  const s=$('sSkins');s.innerHTML='';
  SKINS.forEach((sk,i)=>{const own=save.skins.indexOf(i)>=0;const b=document.createElement('button');b.className='skin'+(save.skin===i?' sel':'')+(own?'':' lock');
    const lab=own?sk.n:sk.p>0?'<i class="coin"></i>'+sk.p:sk.p===-1?'Perfect game':sk.p===-20?'Beat lane 20':sk.p===-30?'Beat lane 30':'Beat lane 40';
    b.innerHTML='<canvas width="104" height="104"></canvas>'+lab;const c=b.querySelector('canvas').getContext('2d');drawBallSkin(c,52,52,44,i,0.6,1,0);if(!own){c.fillStyle='rgba(0,0,0,.45)';c.beginPath();c.arc(52,52,44,0,TAU);c.fill()}
    b.onclick=()=>{initAudio();if(own){save.skin=i;persist();SFX.click();buildShop()}else if(sk.p>0&&save.coins>=sk.p){save.coins-=sk.p;save.skins.push(i);save.skin=i;persist();SFX.buy();buildShop()}else SFX.nope()};s.appendChild(b)});
}
// lock icon in twist icons
const _dti=drawTwistIcon;
drawTwistIcon=function(c,k,x,y,s,t){if(k!=='lock')return _dti(c,k,x,y,s,t);c.save();c.translate(x,y);c.fillStyle='#ccc';c.fillRect(-s*.22,-s*.05,s*.44,s*.34);c.strokeStyle='#ccc';c.lineWidth=s*.08;c.beginPath();c.arc(0,-s*.06,s*.15,Math.PI,0);c.stroke();c.restore()};

// ================= input =================
function laneXFromScreen(sx){const p=P(cam.x,0,BZ0);return cam.x+(sx-W/2)/p.s}
function canAim(){return G.mode==='play'&&!G.paused&&G.st==='aim'}
cv.addEventListener('pointerdown',e=>{
  initAudio();if(G.mode!=='play'||G.paused)return;e.preventDefault();
  if(G.st==='tally'&&G.stT>.5&&!G.dance){G.stT=99;return}
  if(!canAim()||G.charging)return;
  ptr={id:e.pointerId,x0:e.clientX,y0:e.clientY,x:e.clientX,y:e.clientY};
  const R=G.ball.R;G.line=clamp(laneXFromScreen(e.clientX),-(LH-R-.02),LH-R-.02);if(tut&&tut.step===2)tut.moved=1;
  G.charging='ptr';G.power=0;G.curve=0;try{cv.setPointerCapture(e.pointerId)}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(ptr&&e.pointerId===ptr.id){ptr.x=e.clientX;ptr.y=e.clientY;return}
  if(e.pointerType==='mouse'&&canAim()&&!G.charging){const R=G.ball.R;G.line=clamp(laneXFromScreen(e.clientX),-(LH-R-.02),LH-R-.02)}
});
function ptrUp(e){if(!ptr||e.pointerId!==ptr.id)return;ptr=null;if(G.charging==='ptr'){if(G.power>=.08)throwBall();else{G.charging=null;chargeSet(-1);G.power=0;G.curve=0}}}
cv.addEventListener('pointerup',ptrUp);cv.addEventListener('pointercancel',ptrUp);
const KMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'u',KeyW:'u',ArrowDown:'d',KeyS:'d'};
addEventListener('keydown',e=>{
  const k=KMAP[e.code];if(k){keys[k]=true;e.preventDefault()}
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault();initAudio();
    if(G.mode==='play'&&!G.paused){if(G.st==='tally'&&G.stT>.5&&!G.dance){G.stT=99;return}if(e.code==='Space'&&canAim()&&!G.charging&&!e.repeat){G.charging='key';G.chargeT=0;G.power=0}}
    else if(!e.repeat&&e.code==='Enter'||!e.repeat&&e.code==='Space'){if(G.mode==='title'&&$('title').classList.contains('on'))playMain();else if(G.mode==='results')resultsNext();else if(G.paused)setPause(false)}
  }
  if((e.code==='Escape'||e.code==='KeyP')&&G.mode==='play'){setPause(!G.paused)}
  else if(e.code==='Escape'&&($('lanes').classList.contains('on')||$('shop').classList.contains('on')))showScr('title');
  if(e.code==='KeyR'&&(G.mode==='play'||G.mode==='results')&&!G.practice){restartLevel()}
  if(e.code==='KeyM'){initAudio();setMute(!muted)}
});
addEventListener('keyup',e=>{const k=KMAP[e.code];if(k)keys[k]=false;if(e.code==='Space'&&G.charging==='key'){throwBall()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(G.mode==='play')setPause(true);if(AC)AC.suspend&&AC.suspend()}else if(AC&&AC.resume)AC.resume()});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false});

// tutorial progression
const _throw=throwBall;
throwBall=function(){const was=G.ball.live;_throw();if(!was&&G.ball.live&&tut){const st=tut.step;tut.step=Math.min(2,st+1);tut.t=0;if(st>=2){tut=null;save.tut=true;persist();$('skip').style.display='none'}}};
const _le=levelEnd;
levelEnd=function(){if(tut){const rep=tut.replay;tut=null;save.tut=true;persist()}else if(G.lvIdx===0&&!G.demo&&!save.tut){save.tut=true;persist()}_le()};

// test hooks
window.__pq={G,save:()=>save,LEVELS,startLevel,P,thresholds,
 sim(li,line,curve,power,upg){if(upg)save.upg=upg;startLevel(li,{practice:true});tut=null;let n=0;while(G.st!=='aim'&&n++<2000)update(1/60);G.line=line;G.ball.x=line;G.curve=curve;G.power=power;G.charging='key';throwBall();n=0;while(G.st!=='tally'&&n++<3000)update(1/60);return {down:G.pins.filter(p=>p.knocked).length,total:G.pins.length,gut:G.ball.gutter,hole:G.ball.hole}}};

startLevel(0,{demo:true});G.demoSkin=0;
requestAnimationFrame(t=>{last=t;requestAnimationFrame(frame)});
</script>

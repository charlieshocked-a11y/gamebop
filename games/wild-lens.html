<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Wild Lens</title>
<style>
:root{--ink:#3a2414;--paper:#f6ead0;--paper2:#e9d3a8;--leather:#7a4524;--leather2:#9c5d31;--brass:#f0c060;--sun:#ff9a3c;--green:#3f5f2c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#24180e;touch-action:none;user-select:none;-webkit-user-select:none}
body{font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;color:var(--ink)}
#cv{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block;touch-action:none;cursor:none}
body.menu #cv{cursor:default}
.hidden{display:none!important}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;z-index:5}
.serif{font-family:Georgia,"Palatino Linotype","Book Antiqua",serif}
/* buttons: stitched leather tags */
.tag{font:inherit;font-weight:800;font-size:16px;letter-spacing:.3px;color:#fdebc8;border:0;cursor:pointer;padding:10px 18px;border-radius:12px 12px 14px 14px;position:relative;white-space:nowrap;
 background:radial-gradient(120% 140% at 30% 0%,rgba(255,220,170,.25),rgba(0,0,0,0) 60%),repeating-linear-gradient(75deg,rgba(0,0,0,0) 0 3px,rgba(40,15,0,.06) 3px 4px),linear-gradient(#a2643a,#74401f);
 box-shadow:inset 0 2px 0 rgba(255,225,180,.45),inset 0 -3px 0 rgba(0,0,0,.25),0 4px 0 #3f2010,0 8px 14px rgba(0,0,0,.35);text-shadow:0 2px 0 rgba(50,20,5,.7);
 transition:transform .22s cubic-bezier(.34,1.8,.64,1),filter .15s,box-shadow .1s}
.tag:before{content:"";position:absolute;inset:4px;border:1.5px dashed rgba(255,226,180,.45);border-radius:9px;pointer-events:none}
.tag:hover{transform:translateY(-2px) scale(1.04) rotate(-.6deg);filter:brightness(1.1)}
.tag:active,.tag.dn{transform:translateY(3px) scale(.96);box-shadow:inset 0 2px 0 rgba(255,225,180,.45),0 1px 0 #3f2010,0 2px 4px rgba(0,0,0,.3)}
.tag.sun{color:#4a2008;text-shadow:0 1px 0 rgba(255,240,200,.7);background:radial-gradient(120% 120% at 30% 0%,#fff3b8,rgba(255,255,255,0) 55%),linear-gradient(#ffd060,#f08a2a 70%,#d9661c);box-shadow:inset 0 2px 0 rgba(255,250,220,.8),inset 0 -4px 0 rgba(120,40,0,.3),0 5px 0 #8a3a10,0 10px 18px rgba(0,0,0,.35)}
.tag.sun:before{border-color:rgba(120,50,10,.35)}
.tag.big{font-size:25px;padding:13px 46px;border-radius:18px}
.tag.sm{font-size:13.5px;padding:7px 12px}
.tag[disabled]{filter:grayscale(.85) brightness(.75);cursor:default;transform:none}
.tag svg{width:20px;height:20px;vertical-align:-4px;margin-right:5px}
.ib{width:42px;height:42px;border-radius:50%;border:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 35% 30%,#7a5236,#3a2414);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 3px 0 #1d1008,0 5px 10px rgba(0,0,0,.35);transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.ib:active{transform:scale(.88)}
.ib svg{width:22px;height:22px}
/* title */
#title{justify-content:flex-end;padding-bottom:calc(5vh + env(safe-area-inset-bottom))}
#logo{position:absolute;top:max(4vh,calc(12px + env(safe-area-inset-top)));left:50%;transform:translateX(-50%);width:min(540px,88vw,72vh);animation:logoIn 1s cubic-bezier(.3,1.6,.5,1) both}
#logo svg{width:100%;height:auto;display:block;filter:drop-shadow(0 10px 18px rgba(40,10,0,.45))}
@keyframes logoIn{from{opacity:0;transform:translate(-50%,-30px) scale(.8) rotate(-3deg)}to{opacity:1;transform:translate(-50%,0)}}
#title .tb{display:flex;flex-direction:column;align-items:center;gap:12px;animation:rise .8s cubic-bezier(.3,1.5,.6,1) both .25s}
#title .row{display:flex;gap:9px;flex-wrap:wrap;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
#support{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(7px + env(safe-area-inset-bottom));font-size:11.5px;color:#fff1d6;opacity:.55;text-decoration:none;text-shadow:0 1px 2px rgba(0,0,0,.6);letter-spacing:.3px;transition:opacity .2s}
#support:hover{opacity:1}
#tMute{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
/* paper panels */
.paper{background:radial-gradient(140% 90% at 20% 0%,#fffaf0 0%,rgba(255,255,255,0) 60%),radial-gradient(90% 70% at 100% 100%,rgba(160,110,50,.18),rgba(0,0,0,0) 70%),linear-gradient(#f7ecd4,#ecd8b0);color:var(--ink);border-radius:8px;
 box-shadow:0 0 0 1px rgba(90,50,20,.25),0 3px 0 #c9a876,0 6px 0 #b08d5b,0 20px 40px rgba(0,0,0,.45)}
.hdr{display:flex;align-items:center;gap:8px;width:100%;padding:calc(8px + env(safe-area-inset-top)) 10px 6px;z-index:2}
.chip{display:flex;align-items:center;gap:5px;padding:5px 11px 5px 7px;border-radius:20px;background:rgba(40,22,10,.72);color:#ffeccb;font-weight:800;font-size:15px;box-shadow:inset 0 1px 0 rgba(255,220,170,.25),0 2px 6px rgba(0,0,0,.3)}
.chip svg{width:20px;height:20px}
.chip.pop{animation:chipPop .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes chipPop{40%{transform:scale(1.25)}}
.sp{flex:1}
/* camp */
#camp{background:radial-gradient(120% 80% at 50% 0%,rgba(30,15,5,0),rgba(30,15,5,.55))}
#campBody{flex:1;width:100%;max-width:1040px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:4px 10px calc(12px + env(safe-area-inset-bottom));min-height:0}
#regions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;flex:0 1 auto;min-height:0}
.reg{position:relative;border-radius:10px;cursor:pointer;background:#2a1a0e;padding:5px 5px 6px;box-shadow:0 3px 0 #1a0e06,0 8px 16px rgba(0,0,0,.4);transition:transform .25s cubic-bezier(.34,1.7,.6,1);transform:rotate(var(--r,0deg))}
.reg canvas{width:100%;aspect-ratio:16/8.4;display:block;border-radius:6px}
.reg .nm{position:absolute;left:12px;bottom:12px;color:#fff3dc;font-weight:800;font-size:15px;text-shadow:0 2px 3px rgba(0,0,0,.8)}
.reg .rp{position:absolute;right:11px;bottom:11px;color:#ffe0a0;font-weight:800;font-size:12px;background:rgba(30,15,5,.7);border-radius:10px;padding:2px 7px}
.reg.on{transform:translateY(-4px) scale(1.035) rotate(0deg);box-shadow:0 0 0 3px #ffd060,0 6px 0 #1a0e06,0 14px 22px rgba(0,0,0,.5)}
.reg:hover{transform:translateY(-3px) rotate(0deg)}
.reg.lock canvas{filter:grayscale(.85) brightness(.5)}
.reg .lk{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;color:#ffe9c4;font-weight:800;font-size:13px;text-shadow:0 2px 3px #000;gap:2px}
.reg .lk svg{width:30px;height:30px}
#trip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:9px 12px;border-radius:14px;background:rgba(36,20,9,.78);box-shadow:inset 0 1px 0 rgba(255,220,170,.2),0 6px 16px rgba(0,0,0,.4)}
.tod{display:flex;gap:6px}
.todb{width:52px;height:46px;border-radius:12px;border:0;cursor:pointer;background:linear-gradient(#5a3a22,#3a2414);box-shadow:inset 0 1px 0 rgba(255,220,170,.3),0 3px 0 #1a0e06;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffe6bf;font:700 10px "Trebuchet MS",sans-serif;gap:1px;transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.todb svg{width:24px;height:24px}
.todb.on{background:linear-gradient(#ffd060,#e8892a);color:#4a2008;transform:translateY(-2px)}
.todb[disabled]{opacity:.4;cursor:default}
.wx{display:flex;align-items:center;gap:4px;color:#ffe6bf;font-weight:700;font-size:12px}
.wx svg{width:26px;height:26px}
#campBtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#daily{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;cursor:pointer;transform:rotate(-1.2deg);transition:transform .2s}
#daily:hover{transform:rotate(0) scale(1.03)}
#daily canvas{width:64px;height:48px;border-radius:4px;background:#d9c49a}
#daily .dt{font-weight:800;font-size:12px;line-height:1.25}
#daily .dt b{display:block;font-size:14px;color:#a8401a}
#daily.done{opacity:.7}
/* modal */
#modal{background:rgba(25,12,4,.55);justify-content:center;z-index:20;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#mBox{width:min(900px,100%);max-height:100%;display:flex;flex-direction:column;padding:12px 14px 14px;animation:panelIn .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes panelIn{from{opacity:0;transform:translateY(30px) scale(.94) rotate(-1deg)}to{opacity:1;transform:none}}
#mHead{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#mTitle{font-size:24px;font-weight:700;flex:1}
#mTabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.tab{border:0;cursor:pointer;font:700 12.5px "Trebuchet MS",sans-serif;padding:5px 10px;border-radius:8px 8px 0 0;background:#d4b886;color:#5a3418}
.tab.on{background:#7a4524;color:#ffeccb}
#mBody{overflow:auto;min-height:0;flex:1;padding:4px 2px 2px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:10px}
.card{background:#fffaf0;border-radius:4px;padding:6px 6px 7px;box-shadow:0 2px 5px rgba(60,30,10,.25);transform:rotate(var(--r,0deg));position:relative}
.card canvas{width:100%;aspect-ratio:4/3;display:block;border-radius:2px;background:#cdb88d}
.card .cn{font-weight:800;font-size:13px;margin-top:4px;display:flex;align-items:center;gap:4px}
.card .cn i{flex:1}
.card.unk canvas{filter:brightness(0) opacity(.35)}
.card.unk .cn{color:#8a7458}
.stars{display:flex;gap:1px;color:#e0a020}
.stars svg{width:13px;height:13px}
.gl{display:flex;gap:3px;margin-top:3px}
.gl span{flex:1;height:24px;border-radius:5px;background:#eadbbd;display:flex;align-items:center;justify-content:center;color:#8a6e4a;font-size:9.5px;font-weight:800;line-height:1;text-align:center;padding:0 2px;overflow:hidden;white-space:nowrap;gap:2px}
.gl span svg{width:14px;height:14px}
.gl span.ok{background:linear-gradient(#ffd666,#f0a030);color:#5a2a06}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{background:#fffaf0;border-radius:10px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;box-shadow:0 2px 5px rgba(60,30,10,.25);text-align:center}
.item .ic{width:56px;height:56px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d6,#e3c58e);display:flex;align-items:center;justify-content:center}
.item .ic svg{width:38px;height:38px}
.item b{font-size:14px}
.item small{font-size:11.5px;color:#7a5a3a;min-height:14px}
.item.own{background:#e8f0d8}
.item .tag{font-size:13px;padding:6px 12px}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ac{display:flex;align-items:center;gap:8px;background:#fffaf0;border-radius:10px;padding:7px;box-shadow:0 2px 4px rgba(60,30,10,.2)}
.ac .md{width:38px;height:38px;flex:none;border-radius:50%;background:radial-gradient(circle at 40% 35%,#e8dcc4,#b9a888);display:flex;align-items:center;justify-content:center}
.ac.ok .md{background:radial-gradient(circle at 40% 35%,#fff3b0,#f0a020 60%,#b86a10);box-shadow:0 0 10px rgba(255,180,40,.6)}
.ac .md svg{width:22px;height:22px}
.ac b{font-size:13px;display:block}.ac small{font-size:11px;color:#7a5a3a}
.ac:not(.ok){opacity:.65}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:4}
#hud .hdr{pointer-events:none}
#hud .hdr .ib{pointer-events:auto}
#prog{flex:1;max-width:420px;height:14px;margin:0 6px;position:relative}
#tools{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));display:flex;gap:8px;pointer-events:auto}
.tool{width:54px;height:54px;border-radius:50%;border:0;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,#8a5a36,#3e2414);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 3px 0 #1d1008,0 6px 12px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;transition:transform .2s cubic-bezier(.34,1.8,.64,1)}
.tool svg{width:30px;height:30px}
.tool .k{position:absolute;top:-4px;left:-4px;width:18px;height:18px;border-radius:5px;background:#f6e6c4;color:#3a2414;font:800 11px "Trebuchet MS",sans-serif;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #9a7a50}
.tool .n{position:absolute;bottom:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:#e8642a;color:#fff;font:800 11px "Trebuchet MS",sans-serif;display:flex;align-items:center;justify-content:center;padding:0 4px}
.tool .cd{position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(20,10,0,.65) var(--p,0%),rgba(0,0,0,0) 0)}
.tool.on{box-shadow:0 0 0 3px #9dff8a,0 3px 0 #1d1008,0 0 18px rgba(140,255,120,.6)}
.tool:active{transform:scale(.88)}
body.touch .tool .k{display:none}
#touchR{position:absolute;right:calc(12px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));display:none;flex-direction:column;align-items:center;gap:12px;pointer-events:auto}
body.touch #touchR{display:flex}
#bShutter{width:78px;height:78px;border-radius:50%;border:5px solid #f5ead6;background:radial-gradient(circle at 40% 35%,#ff8a4a,#d7401c 60%,#8a200c);box-shadow:0 0 0 3px rgba(40,20,8,.6),0 6px 14px rgba(0,0,0,.45);cursor:pointer;transition:transform .12s}
#bShutter:active,#bShutter.dn{transform:scale(.86)}
.tbtn{width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#8a5a36,#3e2414);box-shadow:inset 0 2px 0 rgba(255,220,170,.35),0 3px 0 #1d1008;display:flex;align-items:center;justify-content:center;cursor:pointer}
.tbtn svg{width:28px;height:28px}
.tbtn.dn{transform:scale(.9);box-shadow:0 0 0 3px #ffd060}
#tRow{display:flex;gap:10px}
.tbtn.pulse{animation:tpulse 1s infinite}
@keyframes tpulse{50%{box-shadow:0 0 0 5px #ffd060,0 0 22px rgba(255,208,96,.8)}}
#hint{position:absolute;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);color:#fff3dc;font-size:12.5px;font-weight:700;text-shadow:0 1px 3px rgba(0,0,0,.9);opacity:.8;white-space:nowrap;transition:opacity 1s}
body.touch #hint{display:none}
@media (max-width:700px){#hint{white-space:normal;width:92%;text-align:center;font-size:11px}}
#fork{position:absolute;inset:0;display:flex;align-items:center;justify-content:space-between;padding:0 calc(10px + env(safe-area-inset-right)) 0 calc(10px + env(safe-area-inset-left));pointer-events:none}
.fsign{pointer-events:auto;border:0;cursor:pointer;width:min(210px,44vw);padding:9px 10px 10px;position:relative;color:#fdebc8;font:800 15px "Trebuchet MS",sans-serif;text-shadow:0 2px 0 rgba(40,15,0,.8);
 background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0 7px,rgba(50,20,0,.12) 7px 8px),linear-gradient(#a8703f,#7a4a24);box-shadow:inset 0 2px 0 rgba(255,220,170,.4),0 5px 0 #3e2010,0 10px 18px rgba(0,0,0,.45);animation:signIn .6s cubic-bezier(.3,1.6,.5,1) both;display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .2s}
.fsign.l{clip-path:polygon(14% 0,100% 0,100% 100%,14% 100%,0 50%);padding-left:28px}
.fsign.r{clip-path:polygon(0 0,86% 0,100% 50%,86% 100%,0 100%);padding-right:28px;animation-name:signInR}
.fsign:hover{transform:scale(1.05)}
.fsign canvas{width:100%;height:62px;display:block}
.fsign .ky{font-size:11px;opacity:.8}
@keyframes signIn{from{transform:translateX(-120%) rotate(-8deg)}to{transform:none}}
@keyframes signInR{from{transform:translateX(120%) rotate(8deg)}to{transform:none}}
#forkT{position:absolute;left:50%;top:22%;transform:translateX(-50%);color:#fff3dc;font:700 22px Georgia,serif;text-shadow:0 2px 6px rgba(0,0,0,.8);white-space:nowrap}
#outFilm{position:absolute;left:50%;top:30%;transform:translateX(-50%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff3dc;font:700 20px Georgia,serif;text-shadow:0 2px 6px #000;animation:rise .5s both}
/* tutorial */
#tut{position:fixed;inset:0;pointer-events:none;z-index:8}
#tutCap{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(36,20,9,.86);color:#fff3dc;border-radius:14px;padding:9px 18px;font-weight:800;font-size:18px;white-space:nowrap;box-shadow:0 0 0 2px rgba(255,208,96,.7),0 8px 20px rgba(0,0,0,.4);animation:capIn .5s cubic-bezier(.3,1.7,.5,1)}
@keyframes capIn{from{opacity:0;transform:translate(-50%,-14px) scale(.85)}to{opacity:1;transform:translate(-50%,0)}}
.kbd{display:inline-block;min-width:24px;padding:1px 6px;margin:0 2px;border-radius:6px;background:#f6e6c4;color:#3a2414;box-shadow:0 2px 0 #9a7a50;font-size:14px;text-align:center}
#tutSkip{position:absolute;right:calc(12px + env(safe-area-inset-right));top:calc(112px + env(safe-area-inset-top));pointer-events:auto}
/* results */
#results{background:radial-gradient(120% 90% at 50% 20%,rgba(40,20,8,.45),rgba(20,10,4,.85));justify-content:center;z-index:10;padding:calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom))}
#resBox{width:min(880px,100%);max-height:100%;display:flex;flex-direction:column;align-items:center;padding:12px 14px 14px;gap:8px}
#resT{font-size:26px;font-weight:700}
#album{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;overflow:auto;min-height:0;flex:1;padding:6px;width:100%;touch-action:pan-y}
.pr{background:#fffdf6;padding:5px 5px 18px;box-shadow:0 3px 8px rgba(40,20,5,.35);transform:rotate(var(--r,0deg)) scale(.4);opacity:0;position:relative;width:150px;animation:printIn .55s cubic-bezier(.3,1.6,.5,1) forwards}
.pr canvas{width:100%;display:block;aspect-ratio:3/2}
.pr .st{position:absolute;bottom:2px;left:6px;display:flex;color:#e0a020}.pr .st svg{width:12px;height:12px}
.pr .sc{position:absolute;bottom:2px;right:6px;font:800 12px "Trebuchet MS",sans-serif;color:#5a3418}
.pr .bd{position:absolute;top:-7px;right:-7px;background:#e0482a;color:#fff;font:800 10px "Trebuchet MS",sans-serif;padding:2px 6px;border-radius:8px;box-shadow:0 2px 3px rgba(0,0,0,.3);transform:rotate(8deg)}
.pr .bd.lg{background:linear-gradient(#ffd060,#e08a20);color:#4a2008}
@keyframes printIn{to{transform:rotate(var(--r,0deg)) scale(1);opacity:1}}
#resSum{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;font-weight:800}
.big{font-size:30px;font-family:Georgia,serif}
.sumc{display:flex;flex-direction:column;align-items:center;line-height:1.1;font-size:12px;color:#7a5a3a}
.sumc b{font-size:26px;color:var(--ink);font-family:Georgia,serif}
/* pause */
#pause{background:rgba(20,10,4,.6);justify-content:center;z-index:15}
#pause .paper{padding:20px 28px;display:flex;flex-direction:column;gap:12px;align-items:center;animation:panelIn .35s cubic-bezier(.3,1.5,.5,1)}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top));transform:translate(-50%,-220px);z-index:30;display:flex;align-items:center;gap:10px;padding:8px 16px 8px 8px;border-radius:30px;background:linear-gradient(#4a2a14,#2a160a);color:#ffeccb;box-shadow:0 0 0 2px #ffd060,0 10px 20px rgba(0,0,0,.45);transition:transform .5s cubic-bezier(.3,1.5,.5,1);pointer-events:none}
#toast.on{transform:translate(-50%,0)}
#toast .md{width:38px;height:38px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3b0,#f0a020 60%,#b86a10);display:flex;align-items:center;justify-content:center}
#toast .md svg{width:22px;height:22px}
#toast b{display:block;font-size:14px}#toast small{font-size:11.5px;opacity:.8}
@media (max-width:640px){
 #regions{grid-template-columns:repeat(2,1fr);gap:8px}
 .reg .nm{font-size:13px;left:9px;bottom:9px}

function taper(g, x1, y1, r1, x2, y2, r2) {

  g.lineTo(x1 - nx * r1, y1 - ny * r1); g.arc(x1, y1, Math.max(r1, 1e-5), an - PI, an - TAU, true); g.closePath();
}

}
